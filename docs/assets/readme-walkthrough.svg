<text class="l l59" x="0" y="1194"><tspan class="p">$ </tspan><tspan class="c">cw run --in hello --name web --detach -- python3 -m http.server 3000</tspan></text>
<text class="l l60" x="0" y="1214"><tspan class="o">✓ Started session hello/web · cloud</tspan></text>
<text class="l l61" x="0" y="1234"><tspan class="o">→ cw --cloud attach hello --session web</tspan></text>
<text class="l l62" x="0" y="1254"><tspan class="p">$ </tspan><tspan class="c">cw ports hello --publish 3000 --label web</tspan></text>
<text class="l l63" x="0" y="1274"><tspan class="o">  * Port 3000 registered as web</tspan></text>
<text class="l l64" x="0" y="1294"><tspan class="o">  URL: https://web-e554d-codewire-dev-e2e.{preview domain}</tspan></text>
<text class="l l65" x="0" y="1314"><tspan class="o">  Access: creator</tspan></text>
<text class="l l66" x="0" y="1334"><tspan class="p">$ </tspan><tspan class="c">cw stop hello</tspan></text>
<text class="l l67" x="0" y="1354"><tspan class="o">✓ Environment hello stopped</tspan></text>
