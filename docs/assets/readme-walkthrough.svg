<text class="l l49" x="0" y="994"><tspan class="o">✓ Environment hello created · cloud VM</tspan></text>
<text class="l l50" x="0" y="1014"><tspan class="o">  2 vCPU · 8 GiB RAM · 80 GiB disk</tspan></text>
<text class="l l51" x="0" y="1034"><tspan class="o"></tspan></text>
<text class="l l52" x="0" y="1054"><tspan class="o">  Credentials: platform:me</tspan></text>
<text class="l l53" x="0" y="1074"><tspan class="o">  Secrets:     personal secrets (platform)</tspan></text>
<text class="l l54" x="0" y="1094"><tspan class="o">  Network:     not attached</tspan></text>
<text class="l l55" x="0" y="1114"><tspan class="o"></tspan></text>
<text class="l l56" x="0" y="1134"><tspan class="o">→ cw --cloud shell hello</tspan></text>
<text class="l l57" x="0" y="1154"><tspan class="p">$ </tspan><tspan class="c">cw exec --in hello -- sh -c 'echo "$GREETING"'</tspan></text>
