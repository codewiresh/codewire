<text class="t" x="404.0" y="20.0" text-anchor="middle">cw: five minutes on the platform</text>
<svg x="16" y="48" width="776" height="440">
<g class="s" xml:space="preserve">
<text class="l l0" x="0" y="14"><tspan class="p">$ </tspan><tspan class="c">cw login</tspan></text>
<text class="l l1" x="0" y="34"><tspan class="o">Connecting to codewire-dev.sh…</tspan></text>
<text class="l l2" x="0" y="54"><tspan class="o">Opening browser to authorize...</tspan></text>
<text class="l l3" x="0" y="74"><tspan class="o">If browser doesn't open, visit: https://codewire-dev.sh/device</tspan></text>
<text class="l l4" x="0" y="94"><tspan class="o">Your code: VNQB-NMPN</tspan></text>
<text class="l l5" x="0" y="114"><tspan class="o">Waiting for authorization...</tspan></text>
<text class="l l6" x="0" y="134"><tspan class="o">Logged in as Codewire e2e.</tspan></text>
<text class="l l7" x="0" y="154"><tspan class="o">Default org: codewire-dev-e2e (codewire-dev-e2e).</tspan></text>
<text class="l l8" x="0" y="174"><tspan class="p">$ </tspan><tspan class="c">cw credentials --cloud generate ssh --name my-key</tspan></text>
<text class="l l9" x="0" y="194"><tspan class="o">NAME    KIND     STATUS  EXPIRES</tspan></text>
<text class="l l10" x="0" y="214"><tspan class="o">my-key  SSH key  active  -</tspan></text>
<text class="l l11" x="0" y="234"><tspan class="o">  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFlm7zP0Hzqt4DFTcAADslvbkSFyOx73BvElqoWANAlI</tspan></text>
<text class="l l12" x="0" y="254"><tspan class="o">  SHA256:OJO/b4gIYTS/SYIwU/bnYnKxmAbfoL81gBaX4BeapPE</tspan></text>
<text class="l l13" x="0" y="274"><tspan class="o">Add the public key above to GitHub: https://github.com/settings/ssh/new</tspan></text>
<text class="l l14" x="0" y="294"><tspan class="p">$ </tspan><tspan class="c">cw credentials --cloud --profile me set ssh my-key</tspan></text>
<text class="l l15" x="0" y="314"><tspan class="o">✓ my-key is now in profile "me"</tspan></text>
<text class="l l16" x="0" y="334"><tspan class="p">$ </tspan><tspan class="c">echo hello | cw secrets --cloud --user set GREETING</tspan></text>
<text class="l l17" x="0" y="354"><tspan class="o">Secret GREETING set.</tspan></text>
<text class="l l18" x="0" y="374"><tspan class="p">$ </tspan><tspan class="c">cw create --name hello --image workspace --user-secrets platform --yes</tspan></text>
<text class="l l19" x="0" y="394"><tspan class="o">Configuration: flags only, no codewire.yaml found</tspan></text>
<text class="l l20" x="0" y="414"><tspan class="o">Create environment "hello" on platform "https://codewire-dev.sh", organization "{org id}".</tspan></text>
<text class="l l21" x="0" y="434"><tspan class="o">  Application-secret project: "none"</tspan></text>
<text class="l l22" x="0" y="454"><tspan class="o">  Organization application secrets: none</tspan></text>
<text class="l l23" x="0" y="474"><tspan class="o">  Personal application secrets: platform / current authenticated user (personal)</tspan></text>
<text class="l l24" x="0" y="494"><tspan class="o">  Credential profile: "platform:id:{profile id}" revision 15 (personal, current authenticate</tspan></text>
<text class="l l25" x="0" y="514"><tspan class="o">d user)</tspan></text>
<text class="l l26" x="0" y="534"><tspan class="o">Application secrets are visible to the managed workload; provider credentials remain behind </tspan></text>
<text class="l l27" x="0" y="554"><tspan class="o">their supported handlers.</tspan></text>
<text class="l l28" x="0" y="574"><tspan class="o">hello · cloud VM</tspan></text>
<text class="l l29" x="0" y="594"><tspan class="o">  2 vCPU · 8 GiB RAM · 80 GiB disk</tspan></text>
<text class="l l30" x="0" y="614"><tspan class="o"></tspan></text>
<text class="l l31" x="0" y="634"><tspan class="o">  Credentials: platform:me</tspan></text>
<text class="l l32" x="0" y="654"><tspan class="o">  Secrets:     personal secrets (platform)</tspan></text>
<text class="l l33" x="0" y="674"><tspan class="o">  Network:     not attached</tspan></text>
<text class="l l34" x="0" y="694"><tspan class="o"></tspan></text>
<text class="l l35" x="0" y="714"><tspan class="o">  ✓ Creating sandbox  0.2s</tspan></text>
<text class="l l36" x="0" y="734"><tspan class="o">  ✓ SSH access ready  0.6s</tspan></text>
<text class="l l37" x="0" y="754"><tspan class="o">  ✓ Configuring environment  0s</tspan></text>
<text class="l l38" x="0" y="774"><tspan class="o">  ✓ Setup complete</tspan></text>
<text class="l l39" x="0" y="794"><tspan class="o">✓ Environment hello created · cloud VM</tspan></text>
<text class="l l40" x="0" y="814"><tspan class="o">  2 vCPU · 8 GiB RAM · 80 GiB disk</tspan></text>
<text class="l l41" x="0" y="834"><tspan class="o"></tspan></text>
<text class="l l42" x="0" y="854"><tspan class="o">  Credentials: platform:me</tspan></text>
<text class="l l43" x="0" y="874"><tspan class="o">  Secrets:     personal secrets (platform)</tspan></text>
<text class="l l44" x="0" y="894"><tspan class="o">  Network:     not attached</tspan></text>
<text class="l l45" x="0" y="914"><tspan class="o"></tspan></text>
<text class="l l46" x="0" y="934"><tspan class="o">→ cw --cloud shell hello</tspan></text>
<text class="l l47" x="0" y="954"><tspan class="p">$ </tspan><tspan class="c">cw exec --in hello -- sh -c 'echo "$GREETING"'</tspan></text>
<text class="l l48" x="0" y="974"><tspan class="o">hello</tspan></text>
<text class="l l49" x="0" y="994"><tspan class="p">$ </tspan><tspan class="c">cw run --in hello --name web --detach -- python3 -m http.server 3000</tspan></text>
<text class="l l50" x="0" y="1014"><tspan class="o">✓ Started session hello/web · cloud</tspan></text>
<text class="l l51" x="0" y="1034"><tspan class="o">→ cw --cloud attach hello --session web</tspan></text>
<text class="l l52" x="0" y="1054"><tspan class="p">$ </tspan><tspan class="c">cw ports hello --publish 3000 --label web</tspan></text>
<text class="l l53" x="0" y="1074"><tspan class="o">  * Port 3000 registered as web</tspan></text>
<text class="l l54" x="0" y="1094"><tspan class="o">  URL: https://web-3ba9a-codewire-dev-e2e.{preview domain}</tspan></text>
<text class="l l55" x="0" y="1114"><tspan class="o">  Access: creator</tspan></text>
<text class="l l56" x="0" y="1134"><tspan class="p">$ </tspan><tspan class="c">cw stop hello</tspan></text>
<text class="l l57" x="0" y="1154"><tspan class="o">✓ Environment hello stopped</tspan></text>
<text class="l l58" x="0" y="1174"><tspan class="o">  cloud VM</tspan></text>
<text class="l l59" x="0" y="1194"><tspan class="o"></tspan></text>
<text class="l l60" x="0" y="1214"><tspan class="o">→ cw --cloud start hello</tspan></text>
<text class="l l61" x="0" y="1234"><tspan class="p">$ </tspan><tspan class="c">cw rm hello --yes</tspan></text>
<text class="l l62" x="0" y="1254"><tspan class="o">✓ Removal started: hello</tspan></text>
<text class="l l63" x="0" y="1274"><tspan class="o">  cloud VM · state: destroying</tspan></text>
<text class="l l64" x="0" y="1294"><tspan class="o"></tspan></text>
<text class="l l65" x="0" y="1314"><tspan class="o">→ cw --cloud ls</tspan></text>
</g>
