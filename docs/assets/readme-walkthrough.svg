<text class="l l40" x="0" y="814"><tspan class="o">  ✓ Storing backend info</tspan></text>
<text class="l l41" x="0" y="834"><tspan class="o">  ✓ state transition creating -&gt; running</tspan></text>
<text class="l l42" x="0" y="854"><tspan class="o">  ✓ started timestamp recorded</tspan></text>
<text class="l l43" x="0" y="874"><tspan class="o">  ✓ Marking running</tspan></text>
