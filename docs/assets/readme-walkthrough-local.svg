<rect class="bg" width="808" height="504" rx="8"/>
<path class="bar" d="M8 0H800A8 8 0 0 1 808 8V32H0V8A8 8 0 0 1 8 0Z"/>
<circle cx="16" cy="16.0" r="5.5" fill="#ff5f57"/><circle cx="34" cy="16.0" r="5.5" fill="#febc2e"/><circle cx="52" cy="16.0" r="5.5" fill="#28c840"/>
<text class="t" x="404.0" y="20.0" text-anchor="middle">cw: a VM on your own machine</text>
<svg x="16" y="48" width="776" height="440">
<g class="s" xml:space="preserve">
<text class="l l0" x="0" y="14"><tspan class="p">$ </tspan><tspan class="c">cw setup --local</tspan></text>
<text class="l l1" x="0" y="34"><tspan class="o">Downloading the local VM runtime (6 files, 201 MiB)...</tspan></text>
<text class="l l2" x="0" y="54"><tspan class="o">Local VM runtime installed (806faede047a).</tspan></text>
<text class="l l3" x="0" y="74"><tspan class="p">$ </tspan><tspan class="c">cw create --local --name hello --path . --yes</tspan></text>
<text class="l l4" x="0" y="94"><tspan class="o">Configuration: flags only, no codewire.yaml found; default workspace image</tspan></text>
<text class="l l5" x="0" y="114"><tspan class="o">Workspace: mount ~/hello at /workspace/hello (live, read-write)</tspan></text>
<text class="l l6" x="0" y="134"><tspan class="o">Kept in the VM: node_modules, target, .venv</tspan></text>
<text class="l l7" x="0" y="154"><tspan class="o">  node_modules: node_modules is created empty</tspan></text>
<text class="l l8" x="0" y="174"><tspan class="o">  target: target is created empty</tspan></text>
<text class="l l9" x="0" y="194"><tspan class="o">  .venv: .venv is created empty</tspan></text>
<text class="l l10" x="0" y="214"><tspan class="o">Folders that match later are kept from the next start; what is written into them before then</tspan></text>
<text class="l l11" x="0" y="234"><tspan class="o"> stays on the host, hidden from the VM, so install again.</tspan></text>
<text class="l l12" x="0" y="254"><tspan class="o">hello · local VM</tspan></text>
<text class="l l13" x="0" y="274"><tspan class="o">  2 vCPU · 4 GiB RAM · 20 GiB disk</tspan></text>
<text class="l l14" x="0" y="294"><tspan class="o"></tspan></text>
<text class="l l15" x="0" y="314"><tspan class="o">  Credentials: none</tspan></text>
<text class="l l16" x="0" y="334"><tspan class="o">  Secrets:     none</tspan></text>
<text class="l l17" x="0" y="354"><tspan class="o">  Network:     not attached</tspan></text>
<text class="l l18" x="0" y="374"><tspan class="o"></tspan></text>
<text class="l l19" x="0" y="394"><tspan class="o">  ✓ Preparing sources  0.0s</tspan></text>
<text class="l l20" x="0" y="414"><tspan class="o">  ✓ Checking the VM runtime  4.0s</tspan></text>
<text class="l l21" x="0" y="434"><tspan class="o">  ✓ Checking credential access  0.0s</tspan></text>
<text class="l l22" x="0" y="454"><tspan class="o">  ✓ Preparing the workspace disk  0.1s</tspan></text>
<text class="l l23" x="0" y="474"><tspan class="o">  ✓ Preparing the image  1m 25s</tspan></text>
<text class="l l24" x="0" y="494"><tspan class="o">  ✓ Starting the VM runner  0.5s</tspan></text>
<text class="l l25" x="0" y="514"><tspan class="o">  ✓ Starting the VM  1m 34s</tspan></text>
<text class="l l26" x="0" y="534"><tspan class="o">  ✓ Booting the workspace  1.6s</tspan></text>
<text class="l l27" x="0" y="554"><tspan class="o">✓ Environment hello created · local VM</tspan></text>
<text class="l l28" x="0" y="574"><tspan class="o">  2 vCPU · 4 GiB RAM · 20 GiB disk</tspan></text>
<text class="l l29" x="0" y="594"><tspan class="o"></tspan></text>
<text class="l l30" x="0" y="614"><tspan class="o">  Credentials: none</tspan></text>
<text class="l l31" x="0" y="634"><tspan class="o">  Secrets:     none</tspan></text>
<text class="l l32" x="0" y="654"><tspan class="o">  Network:     not attached</tspan></text>
<text class="l l33" x="0" y="674"><tspan class="o"></tspan></text>
<text class="l l34" x="0" y="694"><tspan class="o">→ cw --local shell hello</tspan></text>
<text class="l l35" x="0" y="714"><tspan class="p">$ </tspan><tspan class="c">cw run --in hello --name web --detach -- python3 -m http.server 3000</tspan></text>
<text class="l l36" x="0" y="734"><tspan class="o">✓ Started session hello/web · local VM</tspan></text>
<text class="l l37" x="0" y="754"><tspan class="o">→ cw --local attach hello --session web</tspan></text>
<text class="l l38" x="0" y="774"><tspan class="p">$ </tspan><tspan class="c">cw ports hello --publish 3000</tspan></text>
<text class="l l39" x="0" y="794"><tspan class="o">Published http://127.0.0.1:3000 -&gt; hello:3000</tspan></text>
<text class="l l40" x="0" y="814"><tspan class="o">hello publishes:</tspan></text>
<text class="l l41" x="0" y="834"><tspan class="o">  127.0.0.1:3000 -&gt; 3000</tspan></text>
<text class="l l42" x="0" y="854"><tspan class="p">$ </tspan><tspan class="c">curl http://127.0.0.1:3000/</tspan></text>
<text class="l l43" x="0" y="874"><tspan class="o">&lt;h1&gt;Hello from a VM&lt;/h1&gt;</tspan></text>
<text class="l l44" x="0" y="894"><tspan class="p">$ </tspan><tspan class="c">cw rm hello --yes</tspan></text>
<text class="l l45" x="0" y="914"><tspan class="o">  ✓ Removing the environment  5.0s</tspan></text>
<text class="l l46" x="0" y="934"><tspan class="o">✓ Environment hello removed</tspan></text>
<text class="l l47" x="0" y="954"><tspan class="o">  local VM · environment disk removed</tspan></text>
<text class="l l48" x="0" y="974"><tspan class="o"></tspan></text>
<text class="l l49" x="0" y="994"><tspan class="o">→ cw ls</tspan></text>
</g>
</svg>
</svg>
