<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request Codewire access · Codewire</title>
    <link rel="icon" href="../../assets/brand-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../components.css">
    <link rel="stylesheet" href="../../routes/auth.css">
    <link rel="stylesheet" href="../../cosmos.css">
    <script src="../../cosmos.js" defer></script>
  </head>
  <body class="cw-body cw-auth-body" data-route="auth">
    <div class="cw-cosmos" aria-hidden="true">
      <canvas id="cosmos-canvas"></canvas>
    </div>
    <main class="cw-auth-shell">
      <a class="cw-auth-brand" href="home.html" aria-label="Codewire home">
        <img src="../../assets/brand-icon.svg" width="48" height="48" alt="Codewire">
      </a>
      <section class="cw-auth-panel" aria-labelledby="auth-title">
        <header class="cw-auth-header">
          <h1 id="auth-title" class="cw-page-title">Request Codewire access</h1>
          <p class="cw-auth-switch">Already have an account? <a href="/login">Sign in.</a></p>
        </header>
        <form class="cw-form" method="post" action="/signup/_actions/sign-up">
          <div class="cw-field">
            <label class="cw-label" for="name">Name</label>
            <input class="cw-input cw-input--large" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="cw-field">
            <label class="cw-label" for="email">Email</label>
            <input class="cw-input cw-input--large" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="cw-field">
            <div class="cw-field-heading">
              <label class="cw-label" for="password">Password</label>
            </div>
            <input class="cw-input cw-input--large" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
            <p class="cw-help">Use at least 12 characters with uppercase, lowercase, a number, and a symbol.</p>
          </div>
          <div class="cw-field">
            <label class="cw-label" for="confirm-password">Confirm password</label>
            <input class="cw-input cw-input--large" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
          </div>
          <div class="cw-field">
            <label class="cw-label" for="reason">What do you want to build?</label>
            <textarea class="cw-textarea cw-auth-reason" id="reason" name="reason" rows="4" maxlength="2000" required></textarea>
          </div>
          <div class="cw-field">
            <label class="cw-label" for="invite-code">Invite code <span class="cw-muted">(optional)</span></label>
            <input class="cw-input cw-input--mono cw-input--large" id="invite-code" name="invite_code" autocomplete="off">
          </div>
          <button class="cw-button cw-button--pill cw-button--large cw-auth-submit" type="submit">Request access</button>
        </form>
      </section>
    </main>
  </body>
</html>
