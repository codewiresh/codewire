<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codewire components</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../components.css"><link rel="stylesheet" href="../../routes/dashboard.css"><link rel="stylesheet" href="../../routes/environments.css"><style>main{max-width:940px;margin:auto;padding:40px 24px}section{display:grid;gap:16px;margin-top:34px;padding:20px;border:1px solid #222;border-radius:8px;background:#0d0d0d}.row{display:flex;flex-wrap:wrap;gap:10px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}</style></head>
<body class="cw-body"><main data-dashboard-app><a href="index.html" class="cw-muted">← Fixtures</a><h1>Components</h1><section><h2>Actions</h2><div class="row"><button class="cw-button cw-button--accent cw-button--pill">Primary action</button><button class="cw-button cw-button--outline cw-button--pill">Secondary</button><button class="cw-button cw-button--outline cw-button--small cw-button--pill"><svg class="cw-icon"><use href="../../assets/icons.svg#icon-filter"/></svg>Filter</button></div></section><section><h2>Fields</h2><div class="field-grid"><div class="cw-field"><label class="cw-label">Name</label><input class="cw-input cw-mono" value="quiet-mesa"></div><div class="cw-field"><label class="cw-label">Region</label><select class="cw-select"><option>Europe</option></select></div></div></section><section><h2>Status</h2><div class="row"><span class="cw-status" data-tone="success">Running</span><span class="cw-status" data-tone="warning">Starting</span><span class="cw-status" data-tone="danger">Error</span></div></section></main></body></html>
