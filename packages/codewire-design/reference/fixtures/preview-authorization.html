<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening preview · Codewire</title>
    <link rel="icon" href="../../assets/brand-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../components.css">
    <link rel="stylesheet" href="../../routes/auth.css">
  </head>
  <body class="cw-body cw-auth-body" data-route="preview-authorization">
    <main class="cw-auth-shell">
      <a class="cw-auth-brand" href="home.html" aria-label="Codewire home"><img src="../../assets/brand-icon.svg" width="48" height="48" alt="Codewire"></a>
      <section class="cw-auth-panel" aria-labelledby="preview-title">
        <header class="cw-auth-header"><h1 id="preview-title" class="cw-page-title">Opening preview</h1></header>
        <form id="preview-form" class="cw-form" method="post" action="/api/v1/preview-auth/authorize">
          <p class="cw-auth-copy">Opening your preview.</p>
          <input type="hidden" name="challenge" value="synthetic-continuation">
          <input type="hidden" name="csrf" value="synthetic-csrf">
          <button type="submit" class="cw-button cw-button--pill cw-button--large cw-auth-submit">Continue to preview</button>
        </form>
      </section>
    </main>
  </body>
</html>
