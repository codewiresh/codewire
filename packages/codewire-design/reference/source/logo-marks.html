<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @font-face { font-family: 'IBM Plex Mono'; src: url('/assets/codewire/fonts/ibm-plex-mono-regular-2.5.0.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('/assets/codewire/fonts/ibm-plex-mono-medium-2.5.0.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('/assets/codewire/fonts/ibm-plex-mono-semibold-2.5.0.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
  body { margin: 0; background: #0a0a0a; }
  a { color: #1f96b4; } a:hover { color: #57bcd4; }
</style>
</helmet>
<div style="min-height: 100vh; background: #0a0a0a; color: #ededed; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; padding: 56px 64px 96px">
  <div style="max-width: 980px">
    <div style="display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #262626; padding-bottom: 14px; margin-bottom: 40px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #fff">Codewire mark</h1>
      <span style="font-size: 12px; color: #6e6e6e">twisted pair — two strands crossing</span>
    </div>

    <div style="display: flex; align-items: center; gap: 72px; flex-wrap: wrap; margin-bottom: 56px">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#1f96b4" stroke-width="1.7" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
      <div style="display: flex; align-items: flex-end; gap: 13px; font-size: 26px">
        <svg style="width: 0.891em; height: 0.520em; margin-bottom: 0.125em; flex: none" viewBox="0 5 24 14" fill="none" stroke="#1f96b4" stroke-width="1.9" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
        <span style="font-size: 1em; font-weight: 500; letter-spacing: -0.02em; line-height: 1">codewire</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #1c1c1c; border: 1px solid #1c1c1c">

      <div style="background: #0f0f0f; padding: 30px; display: flex; flex-direction: column; gap: 20px">
        <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6e6e">Sizes</span>
        <div style="display: flex; align-items: flex-end; gap: 22px">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ededed" stroke-width="1.8" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ededed" stroke-width="2" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ededed" stroke-width="2.1" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
        </div>
        <span style="font-size: 11px; color: #6e6e6e">48 / 24 / 16 px — stroke thickens as it shrinks</span>
      </div>

      <div style="background: #0f0f0f; padding: 30px; display: flex; flex-direction: column; gap: 20px">
        <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6e6e">App icon</span>
        <div style="display: flex; gap: 14px">
          <div style="width: 56px; height: 56px; background: #1f96b4; display: flex; align-items: center; justify-content: center">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
          </div>
          <div style="width: 56px; height: 56px; background: #ededed; display: flex; align-items: center; justify-content: center">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
          </div>
        </div>
        <span style="font-size: 11px; color: #6e6e6e">Knocked out of accent or of white</span>
      </div>

      <div style="background: #0f0f0f; padding: 30px; display: flex; flex-direction: column; gap: 20px">
        <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6e6e">In the sidebar</span>
        <div style="display: flex; align-items: flex-end; gap: 8px; font-size: 15px">
          <svg style="width: 0.891em; height: 0.520em; margin-bottom: 0.125em; flex: none" viewBox="0 5 24 14" fill="none" stroke="#1f96b4" stroke-width="2.1" stroke-linecap="round"><path d="M2 6h5l10 12h5"></path><path d="M2 18h5L17 6h5"></path></svg>
          <span style="font-size: 1em; font-weight: 500; letter-spacing: -0.005em; line-height: 1">codewire</span>
        </div>
        <span style="font-size: 11px; color: #6e6e6e">Live in the prototype</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
