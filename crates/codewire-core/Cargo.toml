[package]
name = "codewire-core"
version.workspace = true
edition.workspace = true
license = "MIT"
authors.workspace = true
description = "Shared business logic for Codewire app — platform-agnostic"

[lib]
name = "codewire_core"

[dependencies]
# Shared types (WASM-safe, zero tokio)
codewire-api-types.workspace = true
codewire-types.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Time & IDs
chrono.workspace = true
uuid.workspace = true

# Crypto (PKCE S256)
sha2.workspace = true
base64.workspace = true

# UniFFI (optional — only for mobile bindings)
uniffi = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { workspace = true, features = ["js"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }

[features]
default = []
# Enable UniFFI bindings for mobile (Swift/Kotlin)
uniffi = ["dep:uniffi"]
# Enable UniFFI CLI for generating bindings
cli = ["uniffi", "uniffi/cli"]
