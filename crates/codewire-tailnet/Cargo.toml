[package]
name = "codewire-tailnet"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
# BSD-3-Clause keeps the public extraction compatible with the
# Tailscale-derived protocol vectors used by this crate's parity tests.
license = "BSD-3-Clause"
description = "Minimal Tailscale-style tailnet data plane for Codewire: WireGuard, DERP, direct UDP, and userspace networking."
repository = "https://github.com/codewiresh/codewire"

[dependencies]
# WireGuard Noise handshake + ChaCha20-Poly1305 transport. We use the
# data-plane crypto only; path selection / netstack are ours (see #45/#46).
boringtun = "0.7"

# DERP relay client (#46): NaCl crypto_box (X25519 + XSalsa20-Poly1305)
# matches the Tailscale DERP wire contract; tokio-rustls/rustls for the
# TLS transport (ring backend).
crypto_box = { version = "0.9", features = ["salsa20"] }
blake2 = "0.10"
rand_core = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "1"

# Userspace TCP/IP netstack (#59): smoltcp at the IP layer (`medium-ip`, no
# Ethernet framing — the tunnel carries bare IP); `proto-ipv6` for the ULA
# tailnet (`fd7a:115c:a1e0::/48`), `proto-ipv4` for 4-in-6; `alloc` for the
# heap-backed `SocketSet`/buffers on a std host.
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "medium-ip",
    "proto-ipv6",
    "proto-ipv4",
    "socket-tcp",
] }

# Node wire types (#48). The Node JSON preserves the Tailscale-compatible
# shape, so serde drives the byte-for-byte parity; uuid/chrono mirror Go's
# uuid.UUID / time.Time.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
thiserror = "2"
crc32fast = { workspace = true }
tracing = { workspace = true }

# Fresh WireGuard static-key generation in `Conn::new` (#59 capstone) when the
# caller does not supply one — boringtun's `StaticSecret::random_from_rng`
# needs an `RngCore + CryptoRng`. `OsRng` is the OS CSPRNG.
rand = "0.8"

# Async transport and netstack synchronization.
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time", "sync"] }

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["full"] }
