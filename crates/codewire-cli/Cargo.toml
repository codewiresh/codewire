[package]
name = "codewire-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust landing zone for the Codewire cw CLI migration."

[features]
local-broker-synthetic-smoke = [
  "codewire-credential-broker/local-broker-synthetic-smoke",
  "codewire-local-vmm/synthetic-oci-input-smoke",
]

[lib]
name = "codewire_cli"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
codewire-access = { workspace = true }
codewire-client = { workspace = true }
codewire-daemon = { workspace = true }
codewire-project = { workspace = true }
codewire-project-proto = { workspace = true }
codewire-protected-store = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
codewire-tls = { workspace = true }
codewire-workload-secrets = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
http = { workspace = true }
libc = "0.2"
portable-pty = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
async-trait = { workspace = true }
buffa = { workspace = true }
codewire-workspace-access = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
codewire-credential-broker = { workspace = true, features = ["codex-enrollment", "ssh-agent"] }
codewire-gateway-proto = { workspace = true }
codewire-local-credentials = { workspace = true }
codewire-local-vmm = { path = "../codewire-local-vmm" }
rustix = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
codewire-local-vmm = { path = "../codewire-local-vmm" }

[dev-dependencies]
axum = { workspace = true }
codewire-tls = { workspace = true, features = ["test-support"] }
buffa = { workspace = true }
connectrpc = { workspace = true, features = ["axum", "client"] }
tempfile = { workspace = true }
wiremock = { workspace = true }
