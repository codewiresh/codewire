[package]
name = "codewire-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust landing zone for the Codewire cw CLI migration."

[lib]
name = "codewire_cli"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
codewire-client = { workspace = true }
codewire-daemon = { workspace = true }
codewire-project = { workspace = true }
codewire-project-proto = { workspace = true }
portable-pty = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tonic = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
codewire-local-vmm = { path = "../codewire-local-vmm" }

[dev-dependencies]
buffa = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
