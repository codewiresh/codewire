[package]
name = "codewire-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Rust landing zone for the Codewire sandbox gateway."

[features]
kind-e2e = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
codewire-client = { workspace = true }
codewire-credential-bridge = { workspace = true }
codewire-daemon = { workspace = true }
codewire-gateway-proto = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
codewire-tailnet = { workspace = true }
codewire-tls = { workspace = true }
codewire-workspace-access = { workspace = true }
connectrpc = { workspace = true, features = ["axum", "client"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
http = { workspace = true }
prometheus = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
codewire-tls = { workspace = true, features = ["test-support"] }
codewire-credential-broker = { path = "../codewire-credential-broker", default-features = false, features = ["ssh-agent"] }
rcgen = "0.13"
boringtun = "0.7"
chrono = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
