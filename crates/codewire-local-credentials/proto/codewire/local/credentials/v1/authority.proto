syntax = "proto3";

package codewire.local.credentials.v1;

import "codewire/bridge/v1/bridge.proto";

// Private owner-only host contract. This is deliberately not codewire.v1 and
// carries no platform compatibility promise. Credential and workload-secret
// material may enter only through explicitly write-only request fields below;
// no response or metadata message can carry material or a protected-store
// reference.
service LocalCredentialAuthorityService {
  rpc GetAuthorityInfo(GetAuthorityInfoRequest) returns (AuthorityInfo);
  // Graceful owner-only process replacement. This route remains stable across
  // private protocol revisions so a newly installed cw can retire its old
  // detached authority without signals or PID trust.
  rpc ShutdownAuthority(ShutdownAuthorityRequest) returns (ShutdownAuthorityResponse);

  rpc AddCredential(AddCredentialRequest) returns (Credential);
  rpc GenerateSshCredential(GenerateSshCredentialRequest) returns (Credential);
  rpc AddSshCredential(AddSshCredentialRequest) returns (Credential);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc GetCredential(CredentialSelector) returns (Credential);
  rpc RenameCredential(RenameCredentialRequest) returns (Credential);
  rpc RotateCredentialMaterial(RotateCredentialMaterialRequest) returns (Credential);
  rpc RevokeCredential(CredentialSelector) returns (Credential);
  rpc DeleteCredential(CredentialSelector) returns (DeleteCredentialResponse);

  rpc CreateSecretProject(CreateLocalSecretProjectRequest) returns (LocalSecretProject);
  rpc ListSecretProjects(ListLocalSecretProjectsRequest) returns (ListLocalSecretProjectsResponse);
  rpc DeleteSecretProject(LocalSecretProjectSelector) returns (DeleteLocalSecretProjectResponse);
  rpc ListUserWorkloadSecrets(ListUserWorkloadSecretsRequest) returns (ListWorkloadSecretsResponse);
  rpc SetUserWorkloadSecret(SetUserWorkloadSecretRequest) returns (WorkloadSecretMetadata);
  rpc DeleteUserWorkloadSecret(DeleteUserWorkloadSecretRequest) returns (DeleteWorkloadSecretResponse);
  rpc RenameUserWorkloadSecret(RenameUserWorkloadSecretRequest) returns (WorkloadSecretMetadata);
  rpc ListProjectWorkloadSecrets(ListProjectWorkloadSecretsRequest) returns (ListWorkloadSecretsResponse);
  rpc SetProjectWorkloadSecret(SetProjectWorkloadSecretRequest) returns (WorkloadSecretMetadata);
  rpc DeleteProjectWorkloadSecret(DeleteProjectWorkloadSecretRequest) returns (DeleteWorkloadSecretResponse);
  rpc RenameProjectWorkloadSecret(RenameProjectWorkloadSecretRequest) returns (WorkloadSecretMetadata);
  rpc ResolveWorkloadSecretMetadata(ResolveWorkloadSecretMetadataRequest) returns (ResolveWorkloadSecretMetadataResponse);
  rpc CreateAccessProfile(CreateAccessProfileRequest) returns (AccessProfileRevision);
  rpc UpdateAccessProfile(UpdateAccessProfileRequest) returns (AccessProfileRevision);
  rpc ListAccessProfiles(ListAccessProfilesRequest) returns (ListAccessProfilesResponse);
  rpc GetAccessProfile(AccessProfileSelector) returns (AccessProfileRevision);
  rpc GetAccessProfileRevision(GetAccessProfileRevisionRequest) returns (AccessProfileRevision);
  rpc ListAccessProfileRevisions(ListAccessProfileRevisionsRequest) returns (ListAccessProfileRevisionsResponse);
  rpc ResolveAccessProfile(ResolveAccessProfileRequest) returns (AccessProfileRevision);
  rpc DeleteAccessProfile(AccessProfileSelector) returns (DeleteAccessProfileResponse);

  // Material-free control routes. Evaluated grants contain only IDs, exact
  // generations, and provider policy; protected values stay authority-private.
  rpc CreateEnvironmentAccessBinding(CreateEnvironmentAccessBindingRequest) returns (EnvironmentAccessBinding);
  rpc ReplaceEnvironmentAccessBinding(ReplaceEnvironmentAccessBindingRequest) returns (EnvironmentAccessBinding);
  rpc GetEnvironmentAccessBinding(EnvironmentAccessBindingSelector) returns (EnvironmentAccessBinding);
  rpc ListEnvironmentAccessBindings(ListEnvironmentAccessBindingsRequest) returns (ListEnvironmentAccessBindingsResponse);
  rpc DeleteEnvironmentAccessBinding(DeleteEnvironmentAccessBindingRequest) returns (DeleteEnvironmentAccessBindingResponse);
  rpc EvaluateEnvironmentGrants(EvaluateEnvironmentGrantsRequest) returns (EvaluateEnvironmentGrantsResponse);
  // Material-free lifecycle controls. The authority, not the supervisor,
  // creates the private inherited lease channel and launches the broker.
  rpc EnsureEnvironmentBroker(EnsureEnvironmentBrokerRequest) returns (EnvironmentBrokerRuntime);
  rpc StopEnvironmentBroker(StopEnvironmentBrokerRequest) returns (StopEnvironmentBrokerResponse);
  rpc ListRecentBrokerLeaseAuditEvents(ListRecentBrokerLeaseAuditEventsRequest) returns (ListRecentBrokerLeaseAuditEventsResponse);
  // One-shot, material-free repository preparation. The authority admits the
  // exact profile revision and launches an isolated credential-bearing
  // executor; this stream contains only public metadata and Git bundle bytes.
  rpc PrepareGitRepository(PrepareGitRepositoryRequest) returns (stream PreparedGitRepositoryChunk);
}

// Private service exposed only on an authority-created inherited Unix stream
// to one isolated broker process. It is never registered on authority.sock.
// The channel is pre-bound to one environment generation, so requests cannot
// select another environment. Provider responses contain metadata only; the
// broker resolves admitted provider generations inside its protected process.
// Application projections are sealed to the actual launcher's fresh recipient
// key and cannot select sources other than this channel's immutable binding.
service LocalCredentialBrokerLeaseService {
  // Platform mode only, once per inherited channel. The real guest Ready is
  // first; admission is returned only after the original-owner public echo.
  rpc DelegateCredentials(stream codewire.bridge.v1.CredentialBridgeGuestMessage) returns (stream BrokerDelegationResponse);
  rpc ReportBrokerReady(BrokerReadyRequest) returns (BrokerReadyResponse);
  rpc ProjectEnvironment(BrokerEnvironmentProjectionRequest) returns (BrokerEnvironmentProjectionResponse);
  // Only selected public identity/signature responses. The authority owns all
  // SSH material and signing workers; generic LeaseCredentialOperation denies
  // SSH so the sealed broker cannot obtain an SSH protected-store generation.
  rpc SshOperation(BrokerSshRequest) returns (codewire.bridge.v1.CredentialSshResponse);
  rpc LeaseCredentialOperation(BrokerLeaseRequest) returns (BrokerLeaseResponse);
  rpc BeginCredentialRefresh(BrokerCredentialRefreshRequest) returns (BrokerCredentialRefreshAdmission);
  rpc StartCredentialRefresh(BrokerCredentialRefreshStartRequest) returns (BrokerCredentialRefreshStartResponse);
  rpc CommitCredentialRefresh(BrokerCredentialRefreshCommitRequest) returns (BrokerCredentialRefreshCommitResponse);
  rpc AbortCredentialRefresh(BrokerCredentialRefreshAbortRequest) returns (BrokerCredentialRefreshAbortResponse);
  rpc FailCredentialRefresh(BrokerCredentialRefreshFailureRequest) returns (BrokerCredentialRefreshFailureResponse);
}

message BrokerDelegationResponse {
  oneof output {
    codewire.bridge.v1.CredentialBridgeReady admitted = 1;
    codewire.bridge.v1.CredentialBridgeHostMessage frame = 2;
  }
}

message BrokerSshRequest {
  uint32 protocol_version = 1;
  // Original caller ID/deadline, with no selectable environment or credential.
  codewire.bridge.v1.CredentialSshRequest request = 2;
}

message BrokerEnvironmentProjectionRequest {
  string request_id = 1;
  bytes recipient_public_key = 2;
  bytes selection_sha256 = 3;
  uint64 deadline_unix_ms = 4;
}

message BrokerEnvironmentProjectionResponse {
  bytes sealed_projection = 1;
}

// Private service exposed only on an authority-created inherited Unix stream
// to one repository executor. Local GitHub mode resolves the admitted material
// generation from OS storage; platform mode receives only a one-job ingress
// capability. Neither public preparation RPC nor its bundle returns material.
service LocalCredentialRepositoryLeaseService {
  rpc ReportRepositoryExecutorReady(RepositoryExecutorReadyRequest) returns (RepositoryExecutorReadyResponse);
  rpc LeaseRepositoryCredential(RepositoryCredentialLeaseRequest) returns (RepositoryCredentialLeaseResponse);
  rpc GetRepositoryBrokeredCheckout(RepositoryCredentialLeaseRequest) returns (RepositoryBrokeredCheckoutResponse);
  rpc GetRepositorySshCheckout(RepositorySshCheckoutRequest) returns (RepositorySshCheckoutResponse);
  rpc RepositorySshOperation(RepositorySshOperationRequest) returns (codewire.bridge.v1.CredentialSshResponse);
  // Local GitHub only, after a lease: refresh a login due for renewal through
  // the authority's per-credential refresh journal, shared with environment
  // brokers, so one refresh token is never spent twice. The executor
  // exchanges the token and stages the rotated material; no material crosses
  // this channel.
  rpc BeginRepositoryCredentialRefresh(RepositoryCredentialRefreshRequest) returns (BrokerCredentialRefreshAdmission);
  rpc StartRepositoryCredentialRefresh(BrokerCredentialRefreshStartRequest) returns (BrokerCredentialRefreshStartResponse);
  rpc CommitRepositoryCredentialRefresh(BrokerCredentialRefreshCommitRequest) returns (BrokerCredentialRefreshCommitResponse);
  rpc FailRepositoryCredentialRefresh(BrokerCredentialRefreshFailureRequest) returns (BrokerCredentialRefreshFailureResponse);
}

message RepositoryCredentialRefreshRequest {
  string refresh_id = 1;
  string request_id = 2;
  string credential_id = 3;
  uint64 expected_revocation_generation = 4;
  uint64 expected_material_generation = 5;
}

enum CredentialAuthenticationKind {
  reserved 5, 6;
  reserved "CREDENTIAL_AUTHENTICATION_KIND_SSH_PRIVATE_KEY", "CREDENTIAL_AUTHENTICATION_KIND_SSH_AGENT";

  CREDENTIAL_AUTHENTICATION_KIND_UNSPECIFIED = 0;
  CREDENTIAL_AUTHENTICATION_KIND_OAUTH = 1;
  CREDENTIAL_AUTHENTICATION_KIND_API_KEY = 2;
  CREDENTIAL_AUTHENTICATION_KIND_ACCESS_TOKEN = 3;
  CREDENTIAL_AUTHENTICATION_KIND_GITHUB_APP = 4;
  CREDENTIAL_AUTHENTICATION_KIND_SSH_KEY = 7;
}

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_EXPIRED = 2;
  CREDENTIAL_STATUS_REFRESH_FAILED = 3;
  CREDENTIAL_STATUS_REVOKED = 4;
}

enum ProtectedStorePersistence {
  PROTECTED_STORE_PERSISTENCE_UNSPECIFIED = 0;
  PROTECTED_STORE_PERSISTENCE_OPERATING_SYSTEM = 1;
  PROTECTED_STORE_PERSISTENCE_PROCESS_LIFETIME = 2;
}

message GetAuthorityInfoRequest {}

message AuthorityInfo {
  uint32 protocol_version = 1;
  ProtectedStorePersistence protected_store_persistence = 2;
  // The recorded persistent store: "secret-service", "keychain", "file" or
  // "keychain:/path" for an explicit test keychain. Empty from an authority
  // that predates the record.
  string protected_store_backend = 3;
}

message ShutdownAuthorityRequest {}
message ShutdownAuthorityResponse {}

message Credential {
  string id = 1;
  string provider = 2;
  CredentialAuthenticationKind authentication_kind = 3;
  string display_name = 4;
  optional string account_hint = 5;
  CredentialStatus status = 6;
  optional uint64 expires_at_unix = 7;
  uint64 revocation_generation = 8;
  ProtectedStorePersistence protected_store_persistence = 9;
  bool protected_store_cleanup_pending = 10;
  uint64 created_at_unix_ms = 11;
  uint64 updated_at_unix_ms = 12;
  SshPublicKey ssh_public_key = 13;
}

message SshPublicKey {
  string openssh = 1;
  string fingerprint = 2;
}

message GenerateSshCredentialRequest {
  string name = 1;
  optional uint64 expires_at_unix = 2;
}

message AddSshCredentialRequest {
  string name = 1;
  bytes private_key = 2 [debug_redact = true];
  optional bytes passphrase = 3 [debug_redact = true];
  optional uint64 expires_at_unix = 4;
}

message AddCredentialRequest {
  string provider = 1;
  CredentialAuthenticationKind authentication_kind = 2;
  string display_name = 3;
  optional string account_hint = 4;
  optional uint64 expires_at_unix = 5;
  // Write-only. The server moves these bytes immediately into ProtectedValue.
  bytes material = 6;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

message CredentialSelector {
  string credential_id = 1;
}

message RenameCredentialRequest {
  string credential_id = 1;
  string display_name = 2;
}

message RotateCredentialMaterialRequest {
  string credential_id = 1;
  // Write-only. The server moves these bytes immediately into ProtectedValue.
  bytes material = 2;
  optional uint64 expires_at_unix = 3;
  // Positive exact metadata revision resolved before confirmation/enrollment.
  // A stale request must fail before writing a new protected entry.
  uint64 expected_revocation_generation = 4;
  // Replace atomically with the material; absent clears the previous hint.
  optional string account_hint = 5;
}

message DeleteCredentialResponse {}

message WorkloadSecretMetadata {
  string key = 1;
  uint64 created_at_unix_ms = 2;
  uint64 updated_at_unix_ms = 3;
  // True only while exact deletion of a retired protected-store generation is pending.
  bool protected_store_cleanup_pending = 4;
}

message LocalSecretProject {
  string id = 1;
  string name = 2;
  uint64 secret_count = 3;
  uint64 created_at_unix_ms = 4;
  uint64 updated_at_unix_ms = 5;
}

message CreateLocalSecretProjectRequest {
  string name = 1;
}

message ListLocalSecretProjectsRequest {}

message ListLocalSecretProjectsResponse {
  repeated LocalSecretProject projects = 1;
}

message LocalSecretProjectSelector {
  string project_id = 1;
}

message DeleteLocalSecretProjectResponse {}

message ListUserWorkloadSecretsRequest {}

message ListWorkloadSecretsResponse {
  repeated WorkloadSecretMetadata secrets = 1;
}

message SetUserWorkloadSecretRequest {
  string key = 1;
  // Write-only. The server moves these bytes immediately into ProtectedValue.
  bytes value = 2;
}

message DeleteUserWorkloadSecretRequest {
  string key = 1;
}

message RenameUserWorkloadSecretRequest {
  string key = 1;
  string new_key = 2;
}

message ListProjectWorkloadSecretsRequest {
  string project_id = 1;
}

message SetProjectWorkloadSecretRequest {
  string project_id = 1;
  string key = 2;
  // Write-only. The server moves these bytes immediately into ProtectedValue.
  bytes value = 3;
}

message DeleteProjectWorkloadSecretRequest {
  string project_id = 1;
  string key = 2;
}

message RenameProjectWorkloadSecretRequest {
  string project_id = 1;
  string key = 2;
  string new_key = 3;
}

message DeleteWorkloadSecretResponse {}

enum WorkloadSecretSource {
  WORKLOAD_SECRET_SOURCE_UNSPECIFIED = 0;
  WORKLOAD_SECRET_SOURCE_PROJECT = 1;
  WORKLOAD_SECRET_SOURCE_USER = 2;
  WORKLOAD_SECRET_SOURCE_EXPLICIT_ENVIRONMENT = 3;
  WORKLOAD_SECRET_SOURCE_ORGANIZATION = 4;
}

message WorkloadSecretSelection {
  bool organization = 1;
  optional string project = 2;
  bool user = 3;
  repeated string explicit_environment_keys = 4;
}

message ResolveWorkloadSecretMetadataRequest {
  WorkloadSecretSelection selection = 1;
}

message ResolvedWorkloadSecretMetadata {
  string key = 1;
  WorkloadSecretSource source = 2;
  repeated WorkloadSecretSource overridden_sources = 3;
}

message ResolveWorkloadSecretMetadataResponse {
  repeated ResolvedWorkloadSecretMetadata secrets = 1;
}

message AccessProfileEntry {
  string capability_slot = 1;
  string credential_id = 2;
}

message AccessProfileRevision {
  string id = 1;
  string name = 2;
  uint64 revision = 3;
  repeated AccessProfileEntry entries = 4;
  uint64 profile_created_at_unix_ms = 5;
  uint64 revision_created_at_unix_ms = 6;
}

message CreateAccessProfileRequest {
  string name = 1;
  repeated AccessProfileEntry entries = 2;
}

message UpdateAccessProfileRequest {
  string profile_id = 1;
  uint64 expected_revision = 2;
  repeated AccessProfileEntry entries = 3;
}

message ListAccessProfilesRequest {}

message ListAccessProfilesResponse {
  repeated AccessProfileRevision profiles = 1;
}

message AccessProfileSelector {
  string profile_id = 1;
}

message GetAccessProfileRevisionRequest {
  string profile_id = 1;
  uint64 revision = 2;
}

message ListAccessProfileRevisionsRequest {
  string profile_id = 1;
}

message ListAccessProfileRevisionsResponse {
  repeated AccessProfileRevision revisions = 1;
}

message ResolveAccessProfileRequest {
  // Canonical scope-qualified reference, for example user/work.
  string reference = 1;
}

message DeleteAccessProfileResponse {}

message EnvironmentAccessBinding {
  string environment_id = 1;
  string profile_id = 2;
  uint64 profile_revision = 3;
  uint64 created_at_unix_ms = 4;
  uint64 updated_at_unix_ms = 5;
}

message CreateEnvironmentAccessBindingRequest {
  string environment_id = 1;
  string profile_id = 2;
  uint64 profile_revision = 3;
}

message ReplaceEnvironmentAccessBindingRequest {
  string environment_id = 1;
  string expected_profile_id = 2;
  uint64 expected_profile_revision = 3;
  string profile_id = 4;
  uint64 profile_revision = 5;
}

message EnvironmentAccessBindingSelector {
  string environment_id = 1;
}

message ListEnvironmentAccessBindingsRequest {}

message ListEnvironmentAccessBindingsResponse {
  repeated EnvironmentAccessBinding bindings = 1;
}

message DeleteEnvironmentAccessBindingRequest {
  string environment_id = 1;
  string expected_profile_id = 2;
  uint64 expected_profile_revision = 3;
}

message DeleteEnvironmentAccessBindingResponse {}

message GrantPermission {
  string operation = 1;
  string route = 2;
}

message DerivedGrant {
  string environment_id = 1;
  uint64 environment_generation = 2;
  string profile_id = 3;
  uint64 profile_revision = 4;
  string capability_slot = 5;
  string credential_id = 6;
  uint64 credential_revocation_generation = 7;
  optional uint64 expires_at_unix = 8;
  repeated GrantPermission permissions = 9;
}

message EvaluateEnvironmentGrantsRequest {
  string environment_id = 1;
  uint64 environment_generation = 2;
}

message EvaluateEnvironmentGrantsResponse {
  repeated DerivedGrant grants = 1;
}

message BrokerLeaseRequest {
  string request_id = 1;
  string capability_slot = 2;
  string operation = 3;
  string route = 4;
}

message BrokerReadyRequest {
  uint32 protocol_version = 1;
  // Actual authenticated guest Ready. Full delegation already carries this
  // through DelegateCredentials; local-provider mode supplies it here.
  codewire.bridge.v1.CredentialBridgeReady guest_ready = 2;
}

message BrokerReadyResponse {}

message BrokerLeaseResponse {
  Credential credential = 1;
  DerivedGrant grant = 2;
  GrantPermission permission = 3;
  uint64 material_generation = 4;
}

message BrokerCredentialRefreshRequest {
  string refresh_id = 1;
  string request_id = 2;
  string operation = 3;
  string route = 4;
  DerivedGrant grant = 5;
  reserved 6;
  uint64 expected_material_generation = 7;
}

message BrokerCredentialRefreshAdmission {
  oneof outcome {
    BrokerCredentialRefreshReservation reserved = 1;
    BrokerCredentialRefreshRecovered recovered = 2;
  }
}

message BrokerCredentialRefreshRecovered {}

message BrokerCredentialRefreshReservation {
  string refresh_id = 1;
  string credential_id = 2;
  uint64 current_material_generation = 3;
  uint64 next_material_generation = 4;
  string request_id = 5;
}

message BrokerCredentialRefreshStartRequest {
  string refresh_id = 1;
  string request_id = 2;
}

message BrokerCredentialRefreshStartResponse {
  uint64 execution_deadline_unix_ms = 1;
}

message BrokerCredentialRefreshCommitRequest {
  string refresh_id = 1;
  string request_id = 2;
}

message BrokerCredentialRefreshCommitResponse {
  uint64 revocation_generation = 1;
  uint64 material_generation = 2;
}

message BrokerCredentialRefreshAbortRequest {
  string refresh_id = 1;
  string request_id = 2;
}

message BrokerCredentialRefreshAbortResponse {}

message BrokerCredentialRefreshFailureRequest {
  string refresh_id = 1;
  string request_id = 2;
}

message BrokerCredentialRefreshFailureResponse {
  uint64 revocation_generation = 1;
}

message EnsureEnvironmentBrokerRequest {
  string environment_id = 1;
  uint64 environment_generation = 2;
  string environment_name = 3;
  string runner_socket = 4;
  LocalEnvironmentProjectionBinding projection = 5;
  // Provider profiles select one authority; application projections may compose
  // local and platform sources. This binding stays in the trusted parent,
  // never in the child launch arguments.
  PlatformCredentialBinding platform = 6;
  // Exact expected local provider selection. Absence requires no local binding.
  BrokerLocalProfileSelection local_profile = 7;
}

message BrokerLocalProfileSelection {
  string profile_id = 1;
  uint64 profile_revision = 2;
}

message PlatformCredentialBinding {
  string config_directory = 1;
  string server_url = 2;
  string owner_id = 3;
  string organization_id = 4;
  bool organization_secrets = 5;
  optional string project_id = 6;
  bool user_secrets = 7;
  string profile_id = 8;
  uint64 profile_revision = 9;
  repeated string ordinary_keys = 10;
  repeated string reserved_keys = 11;
  bytes selection_sha256 = 12;
}

// Owner-created immutable selection. Never accepted from the guest channel.
message LocalEnvironmentProjectionBinding {
  optional string project_id = 1;
  bool user = 2;
  repeated string overridden_keys = 3;
  repeated string reserved_keys = 4;
  bytes selection_sha256 = 5;
}

message EnvironmentBrokerRuntime {
  string environment_id = 1;
  uint64 environment_generation = 2;
  bool running = 3;
}

message StopEnvironmentBrokerRequest {
  string environment_id = 1;
  optional uint64 environment_generation = 2;
}

message StopEnvironmentBrokerResponse {}

message PrepareGitRepositoryRequest {
  string request_id = 1;
  string profile_id = 2;
  uint64 profile_revision = 3;
  string source = 4;
  string branch = 5;
  string revision = 6;
  repeated string known_hosts = 7;
  // Present only for platform-profile checkout; no local-store fallback. The
  // supervisor allocates the eventual create ID before preparation and later
  // journals that SAME ID with the completed credential-free workspace plan.
  RepositoryPlatformAccess platform = 8;
}

message RepositoryPlatformAccess {
  string environment_id = 1;
  uint64 environment_generation = 2;
  PlatformCredentialBinding binding = 3;
}

message PreparedGitRepositoryMetadata {
  string branch = 1;
  string commit = 2;
  uint64 bundle_size = 3;
}

message PreparedGitRepositoryChunk {
  oneof value {
    PreparedGitRepositoryMetadata metadata = 1;
    bytes bundle = 2;
  }
}

message RepositoryExecutorReadyRequest {
  uint32 protocol_version = 1;
}

message RepositoryExecutorReadyResponse {}

message RepositoryCredentialLeaseRequest {
  string request_id = 1;
}

message RepositoryCredentialLeaseResponse {
  Credential credential = 1;
  string profile_id = 2;
  uint64 profile_revision = 3;
  GrantPermission permission = 4;
  uint64 material_generation = 5;
  string source = 6;
  string branch = 7;
  string revision = 8;
}

// Private inherited channel only. This one-job capability authorizes the
// exact repository ingress, not a provider API or a general credential read.
message RepositoryBrokeredCheckoutResponse {
  string source = 1;
  string branch = 2;
  string revision = 3;
  string endpoint = 4;
  bytes capability = 5;
}

message RepositorySshCheckoutRequest {
  uint32 protocol_version = 1;
  string preparation_request_id = 2;
}

message RepositorySshCheckoutResponse {
  string preparation_request_id = 1;
  string profile_id = 2;
  uint64 profile_revision = 3;
  string source = 4;
  string branch = 5;
  string revision = 6;
  repeated string known_hosts = 7;
}

message RepositorySshOperationRequest {
  uint32 protocol_version = 1;
  string preparation_request_id = 2;
  codewire.bridge.v1.CredentialSshRequest request = 3;
}

enum BrokerLeaseAuditDecision {
  BROKER_LEASE_AUDIT_DECISION_UNSPECIFIED = 0;
  BROKER_LEASE_AUDIT_DECISION_ADMITTED = 1;
  BROKER_LEASE_AUDIT_DECISION_DENIED = 2;
  BROKER_LEASE_AUDIT_DECISION_UNAVAILABLE = 3;
}

message BrokerLeaseAuditEvent {
  uint64 sequence = 1;
  uint64 observed_at_unix_ms = 2;
  string environment_id = 3;
  uint64 environment_generation = 4;
  string request_id = 5;
  string capability_slot = 6;
  string operation = 7;
  string route = 8;
  BrokerLeaseAuditDecision decision = 9;
  optional string credential_id = 10;
  optional string profile_id = 11;
  optional uint64 profile_revision = 12;
  optional uint64 credential_revocation_generation = 13;
}

message ListRecentBrokerLeaseAuditEventsRequest {
  uint32 limit = 1;
}

message ListRecentBrokerLeaseAuditEventsResponse {
  repeated BrokerLeaseAuditEvent events = 1;
}
