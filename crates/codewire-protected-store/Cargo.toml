[package]
name = "codewire-protected-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
description = "Opaque fail-closed protected credential storage for Codewire authorities"

[features]
default = []
# Pure, bounded SSH credential preparation. This does not enable an OS-store
# backend, platform services, SSH processes, or a runnable credential grant.
ssh-material = ["dep:ssh-key", "dep:rsa", "dep:rand"]
# Platform authorities opt into authenticated envelopes and pod-bound OpenBao
# identities. Local OS-store consumers do not enable these dependencies.
platform = [
  "dep:aes-gcm",
  "dep:async-trait",
  "dep:futures-util",
  "dep:k8s-openapi",
  "dep:kube",
  "dep:rand",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
]
# Synthetic identities and an unprotected KEK test double. Enable only through
# dev-dependencies or non-promotable Kind fixtures, never production services.
platform-test-support = ["platform"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true }
futures-util = { version = "0.3", optional = true }
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
ssh-key = { workspace = true, features = ["encryption", "rsa"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = { workspace = true }
futures-lite = { workspace = true }
secret-service = { workspace = true, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
codewire-workspace-hack.workspace = true

[lints]
workspace = true
