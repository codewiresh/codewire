[package]
name = "codewire-billing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Codewire billing service: catalog reads, plan management, Stripe webhook handling"

[[bin]]
name = "codewire-billing"
path = "src/main.rs"

[[bin]]
name = "billing-runtime-smoke"
path = "src/bin/runtime-smoke.rs"

[lib]
name = "codewire_billing"
path = "src/lib.rs"

[dependencies]
codewire-admin-proto = { workspace = true }
codewire-proto = { workspace = true }
# `otel`: a purchase's requests export OpenTelemetry spans when
# OTEL_EXPORTER_OTLP_ENDPOINT is set (codewire-server-core/src/obs.rs).
codewire-server-core = { workspace = true, features = ["otel"] }
codewire-email = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
connectrpc = { workspace = true }
buffa-types = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
async-stripe = { workspace = true }
async-stripe-core = { workspace = true }
async-stripe-checkout = { workspace = true }
async-stripe-billing = { workspace = true }
async-stripe-shared = { workspace = true }
async-stripe-webhook = { workspace = true }
async-stripe-types = { workspace = true }
async-stripe-client-core = { workspace = true }
miniserde = { workspace = true }
prometheus = { workspace = true }

# Temporal worker (#38): OrgTeardownWorkflow + the subscription-cancel
# activity, on the codewire-billing task queue. Same pinned SDK the
# orchestration worker uses.
temporalio-sdk = { workspace = true }
temporalio-client = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-common = { workspace = true }
temporalio-workflow = { workspace = true }
url = { workspace = true }
# Required in scope by the temporalio workflow/activity attribute macros.
futures = { workspace = true }

[features]
# A synthetic card-setup address key, for tests outside the crate.
test-support = []

[dev-dependencies]
# The wire contract builds billing's state with a synthetic address key.
codewire-billing = { path = ".", features = ["test-support"] }
# Tests read what billing would have emailed.
codewire-email = { workspace = true, features = ["test-support"] }
# The wire contract drives generated BillingCatalogService clients over both
# Connect codecs; production billing stays server-only.
codewire-admin-proto = { workspace = true, features = ["client"] }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { workspace = true, features = ["client"] }
# The wire contract reads every billing method from the generated
# descriptor sets.
prost = { workspace = true }
prost-types = { workspace = true }
codewire-workspace-hack.workspace = true

[lints]
workspace = true
