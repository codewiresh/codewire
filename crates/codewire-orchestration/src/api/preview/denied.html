<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview access denied · Codewire</title>
    <link rel="stylesheet" href="{frontend}/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="{frontend}/assets/codewire/routes/auth-v2.css">
    <link rel="stylesheet" href="{frontend}/assets/codewire/cosmos-v1.css">
    <script src="{frontend}/assets/codewire/cosmos-v1.js" defer></script>
  </head>
  <body class="cw-body cw-auth-body" data-route="preview-access-denied">
    <div class="cw-cosmos" aria-hidden="true"><canvas id="cosmos-canvas"></canvas></div>
    <main class="cw-auth-shell">
      <a class="cw-auth-brand" href="{frontend}/" aria-label="Codewire home"><img src="{frontend}/assets/codewire/brand-icon-v1.svg" width="48" height="48" alt="Codewire"></a>
      <section class="cw-auth-panel" aria-labelledby="preview-denied-title">
        <header class="cw-auth-header">
          <h1 id="preview-denied-title" class="cw-page-title">Preview access denied</h1>
          <p class="cw-auth-copy">Your account can't open this preview. Ask the Sandbox's owner for access, or sign in with another account.</p>
        </header>
        <a class="cw-button cw-button--pill cw-button--large cw-auth-submit" href="{frontend}/dashboard/">Go to Codewire</a>
      </section>
    </main>
  </body>
</html>
