[package]
name = "codewire-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Server-side crate: AGPL like the other Phase 2+ services.
license = "AGPL-3.0-only"

[[example]]
name = "dind-storage-fixture"
test = true

[features]
# Host-only evidence hooks used by the local Kind fencing smoke. Production
# service images never enable this feature.
kind-e2e = [
  "codewire-protected-store/platform-test-support",
  "codewire-proto/client",
  "connectrpc/client",
  "dep:tokio-tungstenite",
]

[[bin]]
name = "environment-setup-smoke"
path = "src/bin/environment-setup-smoke.rs"
required-features = ["kind-e2e"]

[[bin]]
name = "exec-stream-smoke"
path = "src/bin/exec-stream-smoke.rs"
required-features = ["kind-e2e"]

[[bin]]
name = "prepare-stream-smoke"
path = "src/bin/prepare-stream-smoke.rs"
required-features = ["kind-e2e"]

[[bin]]
name = "log-stream-smoke"
path = "src/bin/log-stream-smoke.rs"
required-features = ["kind-e2e"]

[[bin]]
name = "file-service-smoke"
path = "src/bin/file-service-smoke.rs"
required-features = ["kind-e2e"]

[[bin]]
name = "reconciler-ttl-smoke"
path = "src/bin/reconciler-ttl-smoke.rs"
required-features = ["kind-e2e"]

[[bin]]
name = "deploy-shape-smoke"
path = "src/bin/deploy-shape-smoke.rs"
required-features = ["kind-e2e"]

[dependencies]
codewire-access = { workspace = true }
codewire-admin-proto = { workspace = true }
codewire-cw-release = { workspace = true }
codewire-daemon = { workspace = true }
codewire-daemon-bridge = { workspace = true }
codewire-daemon-proto = { workspace = true }
codewire-platform-credentials = { workspace = true }
codewire-project = { workspace = true }
codewire-project-proto = { workspace = true }
codewire-protected-store = { workspace = true, features = ["platform"] }
codewire-proto = { workspace = true }
# `otel`: the create path exports OpenTelemetry spans when
# OTEL_EXPORTER_OTLP_ENDPOINT is set (codewire-server-core/src/obs.rs).
codewire-server-core = { workspace = true, features = ["kubernetes-identity", "otel"] }
codewire-tls = { workspace = true }
codewire-workload-secrets = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
kube = { workspace = true, features = ["jsonpatch"] }
futures = { workspace = true }
hyper-util = { workspace = true }
reqwest = { workspace = true }
k8s-openapi = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
# The credential relay's epoch cancellation (worker::credential_relay).
tokio-util = { workspace = true }
tonic = { workspace = true }
# Encoded frame sizes for the credential relay's byte budgets.
prost = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
prometheus = { workspace = true }
# Sidecar readiness probes speak SSH/SFTP over a pod port-forward, the
# same path the Go worker's CheckSidecarReady takes.
russh = { workspace = true }
russh-sftp = { workspace = true }
rustix = { workspace = true }
uuid = { workspace = true }
# Temporal worker (#36 Stage D1): EnvironmentWorkflow + activities.
temporalio-sdk = { workspace = true }
temporalio-client = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-common = { workspace = true }
temporalio-workflow = { workspace = true }
url = { workspace = true }
futures-util = "0.3"
chrono = { workspace = true }
connectrpc = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
# Gateway sidecar token issuance.
sha2 = { workspace = true }
hmac = { workspace = true }
# Host enrollment signatures (#3609).
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
crc32fast = { workspace = true }
# OS entropy for SSH keypair generation (ssh_keys.rs); version-pinned to the
# ssh-key/rand_core 0.10 tree already in the lock.
getrandom = "0.3"
rand = { workspace = true }
zeroize = { workspace = true }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"], optional = true }

[dev-dependencies]
# The real guest bridge behind a synthetic daemon, for the relay's streamed-body proof.
codewire-credential-bridge = { workspace = true }
codewire-tls = { workspace = true, features = ["test-support"] }
codewire-protected-store = { workspace = true, features = ["platform-test-support"] }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { workspace = true, features = ["client"] }
flate2 = { workspace = true }
libc = "0.2"
regorus = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
codewire-workspace-hack.workspace = true

[lints]
workspace = true
