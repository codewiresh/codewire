syntax = "proto3";

package codewire.local.v1;

// This package is a private host-process contract. It is deliberately not
// part of codewire.v1 and carries no platform compatibility promise.
service LocalSupervisorService {
  // Mandatory compatibility fence. Clients call this before every other
  // supervisor RPC and reject anything except their exact private protocol.
  rpc GetSupervisorInfo(GetSupervisorInfoRequest) returns (SupervisorInfo);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (Operation);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc GetEnvironment(EnvironmentSelector) returns (Environment);
  rpc SelectEnvironment(EnvironmentSelector) returns (Environment);
  rpc ListOrphans(ListOrphansRequest) returns (ListOrphansResponse);
  rpc StartEnvironment(EnvironmentSelector) returns (Operation);
  rpc StopEnvironment(EnvironmentSelector) returns (Operation);
  rpc RestartEnvironment(EnvironmentSelector) returns (Operation);
  rpc RefreshEnvironmentSkills(EnvironmentSelector) returns (Operation);
  rpc ResizeEnvironment(ResizeEnvironmentRequest) returns (Operation);
  rpc UpdateEnvironmentSources(UpdateEnvironmentSourcesRequest) returns (Operation);
  // Publishes or withdraws host ports on 127.0.0.1. A running VM changes
  // without a restart; a stopped one binds the recorded set at its next start.
  rpc UpdateHostPorts(UpdateHostPortsRequest) returns (Operation);
  rpc DeleteEnvironment(EnvironmentSelector) returns (Operation);
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc WatchOperation(WatchOperationRequest) returns (stream Operation);
  // Starts or reuses the authority-owned broker for the exact running
  // environment generation. The response and request are material-free.
  rpc EnsureCredentialBroker(EnvironmentSelector) returns (CredentialBrokerRuntime);
  rpc GetDaemonAccess(EnvironmentSelector) returns (DaemonAccess);
  // HTTPS hostnames for labelled ports (#4316, protocol 23): the router's
  // state and, for a named environment, each labelled port's hostname.
  rpc GetLocalHttps(EnvironmentSelector) returns (LocalHttps);
  // Chooses the router's port, or turns it off; remembered for this user.
  rpc SetLocalHttpsPort(SetLocalHttpsPortRequest) returns (LocalHttps);
  // Makes sure the local HTTPS CA exists, or replaces it with a new one, and
  // reports where its certificate is (#4316, protocol 24). The caller
  // untrusts an old CA first.
  rpc PrepareLocalHttpsCa(PrepareLocalHttpsCaRequest) returns (LocalHttps);
  // Serves SSH for one running environment over this owner-only socket
  // (#3025, protocol 15). The client's first frame opens the stream; every
  // other frame in either direction carries SSH protocol bytes. The supervisor
  // terminates SSH itself and runs its sessions through the environment's
  // daemon, so nothing listens for SSH anywhere. The host key the client must
  // expect is the public GetEnvironmentHostKey answer on this socket.
  rpc OpenEnvironmentSshStream(stream SshStreamFrame) returns (stream SshStreamFrame);
  // Public runtime identity from this immutable UUID's retained native binding.
  // Never consults the current global artifact source or a guest manifest.
  rpc GetManagedRuntime(EnvironmentSelector) returns (ManagedRuntime);
  // Hands the state root to another cw's supervisor of the same protocol or a
  // newer one. Every pending operation runs first; while any environment may
  // still run a VM the request fails and nothing changes. Otherwise this
  // supervisor refuses every later request and exits. Every protocol from 12
  // on keeps this RPC unchanged.
  rpc RetireSupervisor(RetireSupervisorRequest) returns (RetireSupervisorResponse);
  // This host's network policies (#2537, protocol 16): named, each edit an
  // immutable revision with its own digest. `open`, `web` and `locked` are
  // built-ins and never stored. A policy holds no secret.
  rpc CreateNetworkPolicy(CreateNetworkPolicyRequest) returns (NetworkPolicy);
  rpc ListNetworkPolicies(ListNetworkPoliciesRequest) returns (ListNetworkPoliciesResponse);
  rpc GetNetworkPolicy(GetNetworkPolicyRequest) returns (NetworkPolicy);
  // Adds and removes rules in one new revision; a change that changes nothing
  // is refused.
  rpc UpdateNetworkPolicy(UpdateNetworkPolicyRequest) returns (NetworkPolicy);
  // Refused while an environment selects the policy.
  rpc DeleteNetworkPolicy(NetworkPolicySelector) returns (NetworkPolicy);
  // Selects the network policy of an existing environment. A stopped one
  // enforces it at its next start; a running one keeps enforcing what it
  // started with and reports restart_required.
  rpc UpdateEnvironmentNetworkPolicy(UpdateEnvironmentNetworkPolicyRequest) returns (Environment);
  // What a running VM's egress broker and its intercepted hosts' front door
  // refused since the VM started (#5058, protocol 26), from its runner's
  // log: the owner's view, with the raw reasons the guest never sees. A VM that isn't running answers
  // FAILED_PRECONDITION and nothing else does.
  rpc GetEgressRefusals(EnvironmentSelector) returns (EgressRefusals);
}

// One row of a refusal log: every refusal of one destination, protocol,
// port and reason since the VM started (#5058). It names a host and port
// only, never a request's method, contents or any text of its answer.
message EgressRefusal {
  oneof destination {
    // A name the runner checked: printable ASCII, at most 253 bytes.
    string name = 1;
    // A dial to an address no name leads to.
    string address_only = 2;
    // A name that failed the check, kept without its text.
    bool withheld = 3;
  }
  // The latest address refused; empty when none, as for most lookups.
  string address = 4;
  EgressRefusalProtocol protocol = 5;
  // Zero for a lookup.
  uint32 port = 6;
  // The refusal reason's stable code (`port_not_allowed`, …).
  string reason = 7;
  // The policy and revision the latest refusal was decided under, as the
  // runner was told them; an empty name for one it was not.
  string policy_name = 8;
  uint32 policy_revision = 9;
  int64 first_seen_unix_ms = 10;
  int64 last_seen_unix_ms = 11;
  uint64 count = 12;
  // Which refused it: the egress broker, or an intercepted host's front
  // door, whose reason is a refusal code of the credential routes and whose
  // destination is the route's bound host. Unspecified from a runner before
  // the front door reported, and read as the egress broker.
  EgressRefusalSource source = 13;
}

enum EgressRefusalSource {
  EGRESS_REFUSAL_SOURCE_UNSPECIFIED = 0;
  EGRESS_REFUSAL_SOURCE_NETWORK = 1;
  EGRESS_REFUSAL_SOURCE_CREDENTIALS = 2;
}

enum EgressRefusalProtocol {
  EGRESS_REFUSAL_PROTOCOL_UNSPECIFIED = 0;
  EGRESS_REFUSAL_PROTOCOL_DNS = 1;
  EGRESS_REFUSAL_PROTOCOL_TCP = 2;
  EGRESS_REFUSAL_PROTOCOL_UDP = 3;
}

// A running VM's refusal log, in memory for this run only (#5058).
message EgressRefusals {
  // Most recently seen first; at most 1,000.
  repeated EgressRefusal refusals = 1;
  // Rows dropped, the least recently seen first, to stay within the bound.
  uint64 dropped = 2;
  // When the log began: when this run's egress broker started.
  int64 started_unix_ms = 3;
  EgressRefusalSummary summary = 4;
  // The front door's reports and rows the runner rejected since the VM
  // started: malformed, past the runner's rate or row limit, or for a host
  // it didn't bind. None of it is kept.
  uint64 rejected = 5;
}

// How many requests a running VM's egress broker and its intercepted hosts'
// front door refused since it started, dropped rows included, and when the
// last was (#5058).
message EgressRefusalSummary {
  uint64 refused = 1;
  int64 last_unix_ms = 2;
}

message EnvironmentNetworkPolicy {
  // `open`, `web`, `locked` or `local:id:UUID`.
  string reference = 1;
  // `open`, `web`, `locked` or the stored policy's name.
  string name = 2;
  // The stored policy's current revision; zero for a built-in.
  uint32 revision = 3;
  string digest = 4;
  // What the running VM's egress broker enforces; zero and empty when it is
  // not running.
  uint32 enforced_revision = 5;
  string enforced_digest = 6;
  // The running VM enforces another revision or policy than the selection,
  // because its broker could not take the selection; it takes it at its
  // next start.
  bool restart_required = 7;
}

message UpdateEnvironmentNetworkPolicyRequest {
  string name = 1;
  // As CreateEnvironmentRequest.network_policy.
  string network_policy = 2;
}

message NetworkPolicySelector {
  oneof selector {
    string name = 1;
    // The canonical UUID a `local:id:` reference names.
    string id = 2;
  }
}

// One allow rule: an exact name, a `*.` descendant pattern or a public CIDR,
// and the TCP ports it may be dialed on.
message NetworkPolicyRule {
  string target = 1;
  repeated uint32 ports = 2;
}

message NetworkPolicy {
  string id = 1;
  string name = 2;
  // The revision this message describes.
  uint32 revision = 3;
  uint32 current_revision = 4;
  // In canonical order.
  repeated NetworkPolicyRule rules = 5;
  // Lowercase hex SHA-256 of the canonical document the brokers enforce.
  string digest = 6;
  int64 created_unix_ms = 7;
  // After an edit (#2537): the running environments that select this policy
  // and now enforce this revision or a later one, and those whose broker
  // could not take it and which take it at their next start.
  repeated string enforced_in = 8;
  repeated string restart_required_in = 9;
}

message CreateNetworkPolicyRequest {
  string name = 1;
  // Unset starts from the built-in `locked`.
  NetworkPolicySelector from = 2;
  repeated NetworkPolicyRule allow = 3;
}

message ListNetworkPoliciesRequest {}

message ListNetworkPoliciesResponse {
  // Each at its current revision, by name.
  repeated NetworkPolicy policies = 1;
}

message GetNetworkPolicyRequest {
  NetworkPolicySelector policy = 1;
  // Zero means the current revision.
  uint32 revision = 2;
}

message UpdateNetworkPolicyRequest {
  NetworkPolicySelector policy = 1;
  repeated NetworkPolicyRule allow = 2;
  // Targets whose rules the new revision drops.
  repeated string remove = 3;
}

message SshStreamFrame {
  oneof frame {
    // The client's first frame, and only that one.
    SshStreamOpen open = 1;
    // SSH protocol bytes, in order.
    bytes data = 2;
  }
}

message SshStreamOpen {
  // The environment's UUID, as the public API names it.
  string environment_id = 1;
  // A stream a host's tailnet peer opens for a client on the environment's
  // tailnet (#3609, slice 3), not the owner's own: it has its own budget and
  // idle timeout, so remote connections never use up the owner's. Protocol 28;
  // an older supervisor counts it with the owner's.
  bool remote = 2;
}

message RetireSupervisorRequest {
  // The successor supervisor's protocol; it must not be below this one's.
  uint32 successor_protocol = 1;
}

message RetireSupervisorResponse {}

message ManagedRuntime {
  string environment_id = 1;
  string artifact_generation = 2;
  bytes provenance_json = 3;
  // Canonical bounded catalog admitted independently of the boot bundle.
  bytes catalog_json = 4;
  string cw_runtime_catalog_generation = 5;
}

message GetSupervisorInfoRequest {}

// Local disk snapshots (protocol 19, Linux): reusable copy-on-write copies of
// a stopped environment's disks on this host. A snapshot is an independent
// set of files; `CreateEnvironment` with `snapshot` starts environments from
// one, each with fresh identity.
service LocalSnapshotService {
  rpc CreateSnapshot(CreateSnapshotRequest) returns (Snapshot);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc GetSnapshot(SnapshotSelector) returns (Snapshot);
  rpc DeleteSnapshot(SnapshotSelector) returns (Snapshot);
}

message CreateSnapshotRequest {
  // The stopped source environment, by name.
  string environment = 1;
  // The new snapshot's name, unique on this host; never a UUID.
  string name = 2;
  // The platform account the capturing cw is signed in to, or absent.
  PlatformAccount account = 3;
}

// A snapshot by name or ID.
message SnapshotSelector {
  string snapshot = 1;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message SnapshotDisk {
  // state, docker or root.
  string role = 1;
  // Apparent size.
  uint64 bytes = 2;
  // reflink (shares blocks until either copy changes) or copy.
  string mode = 3;
  // Bytes the file holds on the host filesystem.
  uint64 allocated_bytes = 4;
  // Of those, bytes shared with another file, when the filesystem reports it.
  optional uint64 shared_bytes = 5;
}

message Snapshot {
  string id = 1;
  string name = 2;
  int64 created_unix_ms = 3;
  string source_environment_id = 4;
  string source_name = 5;
  // clean (the guest shut down) or crash (what a power loss would leave).
  string consistency = 6;
  // Where it lives: always ["local"] for now.
  repeated string locations = 7;
  string architecture = 8;
  // reflink when every disk is a reflink, otherwise copy.
  string mode = 9;
  repeated SnapshotDisk disks = 10;
  uint32 vcpus = 11;
  uint32 memory_mib = 12;
  uint64 disk_bytes = 13;
  uint64 docker_disk_bytes = 14;
  string image = 15;
  // The source's project and workspace inputs, which a create from the
  // snapshot names again exactly.
  bytes project_spec_json = 16;
  string project_spec_sha256 = 17;
  string source_path = 18;
  string implicit_path_mode = 19;
  repeated LocalMountInput local_mounts = 20;
  repeated string implicit_vm_only = 21;
  // Recorded from the source as information only; a create from the
  // snapshot derives each of these again from its own request.
  PlatformSourceAuthority platform_source_authority = 22;
  string access_profile_reference = 23;
  repeated HostPortBinding host_ports = 24;
  MeshAttachment mesh = 25;
  string network_policy = 26;
  // The source mounts host folders directly.
  bool direct_mounts = 27;
  // How many Codewire-delivered sign-ins capture removed from the copy.
  uint32 removed_logins = 28;
  uint64 capture_milliseconds = 29;
  // Space warnings, such as a sparse copy's cost.
  repeated string warnings = 30;
  // The platform account the capturing cw was signed in to, if any.
  PlatformAccount account = 31;
}

// Linux protocol9 only. Runtime selection never authorizes a lifecycle effect.
service LinuxCwRuntimeService {
  // Read saved identity only; never replay/reconcile lifecycle operations.
  rpc Resolve(LinuxCwRuntimeSelector) returns (LinuxCwRuntimeIdentity);
  rpc Info(LinuxCwRuntimeQuery) returns (LinuxCwRuntimeStatus);
  rpc Update(LinuxCwRuntimeMutation) returns (LinuxCwRuntimeStatus);
  rpc Rollback(LinuxCwRuntimeMutation) returns (LinuxCwRuntimeStatus);
  rpc Observe(LinuxCwRuntimeQuery) returns (LinuxCwRuntimeStatus);
  rpc Cancel(LinuxCwRuntimeQuery) returns (LinuxCwRuntimeStatus);
}
message LinuxCwRuntimeSelector {
  string selector = 1;
}
message LinuxCwRuntimeIdentity {
  string environment_id = 1;
}
message LinuxCwRuntimeQuery {
  string environment_id = 1;
  // Resolve the SAME durable operation after a lost reply.
  string request_id = 2;
}
message LinuxCwRuntimeMutation {
  string environment_id = 1;
  uint64 generation = 2;
  string bootstrap_catalog_sha256 = 3;
  string request_id = 4;
  uint64 expected_revision = 5;
  string target_sha256 = 6;
  // Update requires a pinned local source. Never journal the source path.
  string image_index_sha256 = 7;
  string source_lock = 8;
}
message LinuxCwRuntimeStatus {
  string environment_id = 1;
  uint64 generation = 2;
  bytes selection_json = 3;
  string operation_id = 4;
  string request_id = 5;
  string phase = 6;
  string error_code = 7;
  // Retained old-birth uncertainty is not reported as an unchanged update.
  repeated string interrupted_request_ids = 8;
}

message SupervisorInfo {
  uint32 protocol_version = 1;
  // SHA-256 of the supervisor's exact NativeRuntimeConfig path bytes.
  bytes configuration_sha256 = 2;
}

// VM checkpoints (protocol 20, Linux, #3046 R4): a running local VM's memory,
// device state and disks at one instant, kept in the same host store as disk
// snapshots. A VM checkpoint stays on this host; it is never exported.
service LocalCheckpointService {
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (Checkpoint);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc GetCheckpoint(CheckpointSelector) returns (Checkpoint);
  rpc DeleteCheckpoint(CheckpointSelector) returns (Checkpoint);
  // Put the stopped source environment back at the VM checkpoint's instant:
  // a Start operation that places the checkpoint's disks and restores its
  // memory. Every disk change since the checkpoint is discarded.
  rpc RestoreCheckpoint(RestoreCheckpointRequest) returns (Operation);
  // Stop the running source of a VM checkpoint for a restore: a Stop
  // operation that skips the guest's graceful poweroff, because the restore
  // discards its state. Refused unless the checkpoint passes every check the
  // restore makes of it, so a restore after it fails only where one after a
  // graceful stop would. A plain StopEnvironment is unchanged.
  rpc StopForRestore(StopForRestoreRequest) returns (Operation);
}

message StopForRestoreRequest {
  // The VM checkpoint the restore will use, by name or ID; its source is
  // the environment stopped.
  string checkpoint = 1;
  // The platform account the restoring cw is signed in to, or absent, as for
  // RestoreCheckpoint.
  PlatformAccount account = 2;
  string request_id = 3;
}

message RestoreCheckpointRequest {
  // The VM checkpoint, by name or ID.
  string checkpoint = 1;
  // The platform account the restoring cw is signed in to, or absent. A
  // checkpoint captured under another account is refused.
  PlatformAccount account = 2;
  string request_id = 3;
  // Restore once although the checkpoint's disk may hold an earlier sign-in
  // (#6277). Refused for a VM on a platform profile.
  bool start_with_uncleared_disk = 4;
}

message CreateCheckpointRequest {
  // The running source environment, by name.
  string environment = 1;
  // The new VM checkpoint's name, unique on this host among snapshots and
  // VM checkpoints; never a UUID. Empty takes `<environment>-<UTC time>`.
  string name = 2;
  // The platform account the capturing cw is signed in to, or absent.
  PlatformAccount account = 3;
}

// A VM checkpoint by name or ID.
message CheckpointSelector {
  string checkpoint = 1;
}

message ListCheckpointsRequest {
  // Only the VM checkpoints of this environment, by name; empty lists all.
  string environment = 1;
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

// How long each part of a capture took, in microseconds.
message CheckpointTimings {
  // The guest freezing its workload.
  uint64 guest_freeze_us = 1;
  // From the freeze to the thaw: how long the workload stood still.
  uint64 workload_frozen_us = 2;
  // From vm.pause to vm.resume: how long the VM stood still.
  uint64 vm_paused_us = 3;
  // Writing the memory and device state.
  uint64 memory_write_us = 4;
  // Cloning the disks.
  uint64 disk_clone_us = 5;
  // The whole capture, as the supervisor saw it.
  uint64 total_us = 6;
}

message Checkpoint {
  string id = 1;
  string name = 2;
  int64 created_unix_ms = 3;
  string source_environment_id = 4;
  string source_name = 5;
  // paired: exact together with its memory, crash-consistent alone.
  string consistency = 6;
  // Always ["local"]: a VM checkpoint never leaves this host.
  repeated string locations = 7;
  string architecture = 8;
  uint32 vcpus = 9;
  uint32 memory_mib = 10;
  uint64 disk_bytes = 11;
  uint64 docker_disk_bytes = 12;
  string image = 13;
  // The disks, as for a snapshot.
  repeated SnapshotDisk disks = 14;
  // The memory file's size and the bytes it holds on the host filesystem.
  uint64 memory_bytes = 15;
  uint64 memory_allocated_bytes = 16;
  // The VMM the checkpoint restores only into.
  string vmm_version = 17;
  string vmm_sha256 = 18;
  uint32 guest_checkpoint_abi = 19;
  CheckpointTimings timings = 20;
  // Restore is refused, and why: another CPU, or the pinned VMM is gone.
  string unrestorable_reason = 21;
  repeated string warnings = 22;
  PlatformAccount account = 23;
  // The source's boot generation at capture.
  uint64 source_generation = 24;
  // What a fork recreates the source's request from: the checkpoint's disk
  // half, described as a disk snapshot is. Its ID is the checkpoint's.
  Snapshot snapshot = 25;
  // It may hold an earlier real sign-in (#6277): taken without interception,
  // or from a state disk not recorded as cleared. While interception is on,
  // its restore and fork are refused.
  bool may_hold_sign_in = 26;
}

service EnvironmentRunnerService {
  // Mandatory immutable compatibility fence. Supervisors call this before
  // adoption or any RPC that can observe or change runner/VM state.
  rpc GetRunnerProtocolInfo(GetRunnerProtocolInfoRequest) returns (RunnerProtocolInfo);
  rpc AdoptRunner(AdoptRunnerRequest) returns (RunnerInfo);
  rpc GetRunnerInfo(GetRunnerInfoRequest) returns (RunnerInfo);
  rpc WatchRunner(WatchRunnerRequest) returns (stream RunnerEvent);
  rpc StartVm(StartVmRequest) returns (RunnerInfo);
  rpc StopVm(StopVmRequest) returns (RunnerInfo);
  rpc GrowStateDisk(GrowStateDiskRequest) returns (GrowStateDiskResponse);
  // Converges the running generation's host listeners to exactly this set.
  // New ports bind all-or-nothing before any change; withdrawn ones are
  // closed before the reply.
  rpc SetHostPorts(SetHostPortsRequest) returns (SetHostPortsResponse);
  // Enforces this network policy on the running generation's egress broker
  // at once (#2537). Replies after the broker acknowledges it, when every
  // flow the policy refuses has ended.
  rpc ReplaceNetworkPolicy(ReplaceNetworkPolicyRequest) returns (ReplaceNetworkPolicyResponse);
  // Stops the exact owned VMM and releases its device handles. The runner
  // never removes environment storage; only the supervisor may tombstone it.
  rpc PrepareRetireRunner(PrepareRetireRunnerRequest) returns (PrepareRetireRunnerResponse);
  // Requests process exit only after successful resource retirement. The
  // supervisor must still observe the exact process exit before clearing its
  // durable ownership record or removing environment storage.
  rpc ShutdownRunner(ShutdownRunnerRequest) returns (ShutdownRunnerResponse);
  rpc GetDaemonAccess(GetDaemonAccessRequest) returns (DaemonAccess);
  // Owner-only startup seam. Never waits on the main runner state mutex and
  // never admits a different or dead generation. Normal access stays Ready-only.
  rpc GetGenerationDaemonAccess(GetGenerationDaemonAccessRequest) returns (DaemonAccess);
  // The current generation's secrets (#3999), for an intercepting boot only,
  // from the same owner-only seam. Any other request gets nothing at all.
  // Never part of a status or debug answer.
  rpc GetBootSecrets(GetBootSecretsRequest) returns (GetBootSecretsResponse);
  // Runner protocol 10 (#3046 R4): freeze the running generation's
  // workload, pause the VM, write its memory and device state, clone its
  // disks, resume and thaw, into vms/<id>/checkpoints/out-<operation_id>.
  // The supervisor takes that tree over and treats it as untrusted.
  rpc CheckpointVm(CheckpointVmRequest) returns (CheckpointVmResponse);
  // Runner protocol 15 (#5058): the running generation's refusal log. Any
  // other generation, or a VM that isn't running, is FAILED_PRECONDITION.
  rpc GetEgressRefusals(GetEgressRefusalsRequest) returns (EgressRefusals);
}

message GetEgressRefusalsRequest {
  string environment_id = 1;
  uint64 generation = 2;
}

// The name and revision the supervisor knows a policy by, which the runner
// labels its refusal log with (#5058); revision zero for a built-in.
message NetworkPolicyLabel {
  string name = 1;
  uint32 revision = 2;
}

message CheckpointVmRequest {
  string environment_id = 1;
  // The running boot generation; any other is refused.
  uint64 generation = 2;
  string operation_id = 3;
}

// The seed bindings the captured guest applied at boot, which a restore's
// new seed must repeat exactly. Its daemon token, environment id and
// generation are re-keyed instead.
message CheckpointBootBindings {
  string skill_snapshot_sha256 = 1;
  string environment_projection_sha256 = 2;
  string managed_credential_clients = 3;
  bool docker = 4;
  string cw_runtime_catalog_generation = 5;
  uint32 daemon_vsock_port = 6;
  // The captured boot intercepted agent hosts and its guest trusts that
  // boot's egress CA (#3999). A restore must match: the switch applies on a
  // stop and start, not a restore.
  bool intercept = 7;
}

message CheckpointVmResponse {
  CheckpointTimings timings = 1;
  uint64 memory_bytes = 2;
  uint32 guest_checkpoint_abi = 3;
  string vmm_version = 4;
  string vmm_sha256 = 5;
  uint32 vsock_cid = 6;
  // The root generation's storage name, as StartVmRequest.root_generation.
  string root_generation = 7;
  // The captured boot's one-boot setup disk, when it had one: a restore
  // attaches a placeholder of this size.
  uint64 setup_disk_bytes = 8;
  CheckpointBootBindings boot = 9;
  // The checkpoint is complete but the VM did not resume; it is stopped.
  bool resume_failed = 10;
}

message GetRunnerProtocolInfoRequest {}

message RunnerProtocolInfo {
  uint32 protocol_version = 1;
}

enum EnvironmentState {
  ENVIRONMENT_STATE_UNSPECIFIED = 0;
  ENVIRONMENT_STATE_STOPPED = 1;
  ENVIRONMENT_STATE_STARTING = 2;
  ENVIRONMENT_STATE_RUNNING = 3;
  ENVIRONMENT_STATE_ERROR = 4;
  ENVIRONMENT_STATE_ORPHANED = 5;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_CREATE = 1;
  OPERATION_KIND_START = 2;
  OPERATION_KIND_STOP = 3;
  OPERATION_KIND_RESTART = 4;
  OPERATION_KIND_UPDATE_WORKSPACE = 5;
  OPERATION_KIND_ROLLBACK_WORKSPACE = 6;
  OPERATION_KIND_DELETE = 7;
  OPERATION_KIND_GROW_DISK = 8;
  OPERATION_KIND_RECONCILE = 9;
  reserved 10;
  reserved "OPERATION_KIND_APPLY_ENVIRONMENT_ACCESS";
  OPERATION_KIND_UPDATE_ENVIRONMENT_SOURCES = 11;
  OPERATION_KIND_UPDATE_CW_RUNTIME = 12;
  OPERATION_KIND_ROLLBACK_CW_RUNTIME = 13;
  OPERATION_KIND_UPDATE_HOST_PORTS = 14;
}

enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_INTENT = 1;
  OPERATION_PHASE_EFFECT_APPLIED = 2;
  OPERATION_PHASE_COMPLETED = 3;
  OPERATION_PHASE_FAILED = 4;
  OPERATION_PHASE_INTERRUPTED = 5;
}

// The next bounded, auditable lifecycle effect. Raw host paths, process output,
// guest serial data, credentials and daemon capabilities never enter operation
// progress or its public projection.
enum OperationStage {
  OPERATION_STAGE_UNSPECIFIED = 0;
  OPERATION_STAGE_RECORD_ENVIRONMENT = 1;
  OPERATION_STAGE_PROVISION_WORKSPACE = 2;
  OPERATION_STAGE_STAGE_WORKSPACE_GENERATION = 3;
  OPERATION_STAGE_RECORD_STARTING = 4;
  OPERATION_STAGE_ENSURE_RUNNER = 5;
  OPERATION_STAGE_START_VM = 6;
  OPERATION_STAGE_RECORD_RUNNING = 7;
  OPERATION_STAGE_STOP_VM = 8;
  OPERATION_STAGE_RECORD_STOPPED = 9;
  OPERATION_STAGE_GROW_DISK = 10;
  OPERATION_STAGE_RECORD_RESOURCES = 11;
  OPERATION_STAGE_RESTART_VM = 12;
  OPERATION_STAGE_RECORD_RESIZE_OUTCOME = 13;
  OPERATION_STAGE_STAGE_ROLLBACK_GENERATION = 14;
  OPERATION_STAGE_RESTORE_DESIRED_POWER = 15;
  OPERATION_STAGE_RECORD_WORKSPACE_TRANSITION = 16;
  OPERATION_STAGE_PREPARE_DELETE = 17;
  OPERATION_STAGE_MOVE_TO_TRASH = 18;
  OPERATION_STAGE_REMOVE_ENVIRONMENT = 19;
  OPERATION_STAGE_CLEANUP_TRASH = 20;
  OPERATION_STAGE_RECORD_OBSERVATION = 21;
  OPERATION_STAGE_FINALIZING = 22;
  OPERATION_STAGE_COMPLETED = 23;
  OPERATION_STAGE_FAILED = 24;
  OPERATION_STAGE_INTERRUPTED = 25;
  OPERATION_STAGE_BIND_ENVIRONMENT_ACCESS = 26;
  OPERATION_STAGE_REVOKE_ENVIRONMENT_ACCESS = 27;
  OPERATION_STAGE_REQUIRE_ENVIRONMENT_ACCESS = 28;
  reserved 29;
  reserved "OPERATION_STAGE_APPLY_ENVIRONMENT_ACCESS";
  reserved 30;
  reserved "OPERATION_STAGE_RECORD_ENVIRONMENT_ACCESS";
  OPERATION_STAGE_RECORD_ENVIRONMENT_SOURCES = 31;
  OPERATION_STAGE_RECORD_SOURCE_OUTCOME = 32;
  OPERATION_STAGE_APPLY_SOURCE_ACCESS_BINDING = 33;
  OPERATION_STAGE_APPLY_HOST_PORTS = 34;
  OPERATION_STAGE_RECORD_HOST_PORTS = 35;
}

message Operation {
  string operation_id = 1;
  string request_id = 2;
  string environment_id = 3;
  OperationKind kind = 4;
  OperationPhase phase = 5;
  uint32 checkpoint = 6;
  OperationStage stage = 7;
  int64 created_unix_ms = 8;
  int64 updated_unix_ms = 9;
  string error_code = 10;
  OperationResult result = 11;
  uint64 progress_sequence = 12;
  RunnerStage runner_stage = 13;
  uint64 guest_sequence = 14;
  GuestBootStage guest_stage = 15;
  string runner_error_code = 16;
  // The create's workspace image came from the content store, with no
  // registry round trip (#4968).
  bool workspace_image_cached = 17;
  // The start's wait for the guest's agent logins reached its bound before
  // they settled; they land when they arrive (#6123).
  bool agent_logins_arriving = 18;
}

message OperationResult {
  oneof value {
    EnvironmentOperationResult environment = 1;
    DeleteEnvironmentResponse deletion = 2;
    LinuxCwRuntimeStatus cw_runtime = 3;
  }
}

message EnvironmentOperationResult {
  string environment_id = 1;
  string name = 2;
  EnvironmentState state = 3;
  uint64 generation = 4;
  // Set when a start moved the environment onto the installed runtime
  // (#4980).
  RuntimeMove runtime_move = 5;
}

// A start's move of a stopped environment whose boot assets speak an earlier
// guest runtime ABI onto the installed runtime.
message RuntimeMove {
  // What each runtime's guest init declares, such as
  // "seed=10;cw_catalog=1;net=2".
  string from_guest_abi = 1;
  string to_guest_abi = 2;
  // The environment's VM checkpoints the move leaves unrestorable.
  uint32 unrestorable_checkpoints = 3;
}

// Names exactly one operation: by its own ID, or (protocol 22) by the
// lifecycle request ID it was journaled for. An unknown one is NOT_FOUND.
message GetOperationRequest {
  string operation_id = 1;
  string request_id = 2;
}

message WatchOperationRequest {
  string operation_id = 1;
}

message CreateEnvironmentRequest {
  string name = 1;
  // Optional canonical host path for the implicit local input. Empty when the
  // portable project declares repositories.
  string source_path = 2;
  uint32 vcpus = 3;
  uint32 memory_mib = 4;
  uint64 disk_bytes = 5;
  string request_id = 6;
  // Exact canonical codewire-project JSON. The supervisor revalidates both
  // canonical encoding and digest before journaling the create operation.
  bytes project_spec_json = 7;
  string project_spec_sha256 = 8;
  // Private host preparation for the optional implicit --path source. Empty
  // when the portable project declares repositories; otherwise exactly clone
  // or copy after CLI-side auto resolution.
  string implicit_path_mode = 9;
  // Local-only explicit filesystem grants. Source paths are canonical host
  // bytes and never enter the portable project contract or the guest. Copy is
  // supported first; direct remains fail-closed until its VMM attachment and
  // confinement contract is implemented.
  repeated LocalMountInput local_mounts = 10;
  // Canonical creation-time loopback TCP publications. These are local-only
  // host resources and are not part of the placement-neutral ProjectSpec.
  repeated HostPortBinding host_ports = 11;
  // Optional non-secret binding to one exact Mesh network. The supervisor
  // persists only this status-visible metadata; setup authority remains in an
  // isolated host process and never enters this API.
  MeshAttachment mesh = 12;
  // Material-free exact revision resolved from project_spec_json.credentials.profile.
  // Both fields are empty/zero when the project selects no credential access.
  string access_profile_id = 13;
  uint64 access_profile_revision = 14;
  // Dedicated guest-local Docker data disk. Zero disables Docker for this
  // environment; nonzero values are whole-MiB ext4 disk sizes.
  uint64 docker_disk_bytes = 15;
  // Scope/name metadata for the exact resolved ID, verified against authority
  // history before binding. Never used as a fallback identity lookup.
  string access_profile_reference = 16;
  PlatformSourceAuthority platform_source_authority = 17;
  // Paths relative to the implicit source that a copy skips (codewire.yaml
  // workspace.vm_only); they live only on the VM's own disk. Empty when
  // implicit_path_mode is clone, which takes only committed files, and when
  // the project declares repositories or mounts.
  repeated string implicit_vm_only = 18;
  // The network policy the environment selects (#2537, protocol 16): `open`
  // or empty, `web`, `locked`, or a policy in this host's store by NAME, local:NAME
  // or local:id:UUID. A platform policy is not available yet.
  string network_policy = 19;
  // Start from a local disk snapshot (protocol 19, Linux) instead of
  // provisioning: the environment's disks are copies of the snapshot's, and
  // the request names the snapshot's recorded project and workspace inputs
  // exactly. Every source, credential, host port and Mesh choice comes from
  // this request, never from the snapshot.
  SnapshotRestore snapshot = 20;
}

// What a create from a local disk snapshot takes from it.
message SnapshotRestore {
  // The snapshot's ID, never its name.
  string snapshot_id = 1;
  // The new environment's vCPUs and memory: the source's unless overridden.
  // Disk sizes are always the snapshot's.
  uint32 vcpus = 2;
  uint32 memory_mib = 3;
  // Mount the source's direct host folders again, shared with every
  // environment that mounts them. Refused without it.
  bool share_mounts = 4;
  // The platform account the restoring cw is signed in to, or absent. A
  // snapshot captured under another account is refused.
  PlatformAccount account = 5;
  // A fork of a VM checkpoint only: fork once although the checkpoint's disk
  // may hold an earlier sign-in (#6277). Refused on a platform profile.
  bool start_with_uncleared_disk = 6;
}

// A signed-in platform account: its server, organization and user.
message PlatformAccount {
  string server_url = 1;
  string organization_id = 2;
  string user_id = 3;
}

// Authenticated storage identity pinned at selection time, not mutable CLI
// defaults. Fresh launch delegation must recheck this user/org/server tuple;
// it is not a token, an environment credential, or hardware attestation.
message PlatformSourceAuthority {
  string server_url = 1;
  string organization_id = 2;
  string user_id = 3;
  // Exact material-free capability slots from the explicitly selected current
  // profile revision. Empty for no profile, a local profile, or an empty
  // platform profile. The supervisor persists this immutable selection; it
  // never infers client routing from environment variable names.
  repeated string profile_slots = 4;
  // The pinned revision's Anthropic credential kind, captured with the slots:
  // "subscription_token" for a Claude subscription token, "sign_in" for a
  // Claude sign-in, empty for an API key or no Anthropic slot. It chooses
  // Claude Code's form as hosted orchestration does. Never material.
  string anthropic_form = 5;
}

// Narrow source edit. All non-source ProjectSpec fields must remain byte-for-
// byte equivalent after canonicalization; this is not a general config update.
message UpdateEnvironmentSourcesRequest {
  string name = 1;
  string request_id = 2;
  string expected_environment_id = 3;
  uint64 expected_generation = 4;
  string expected_project_spec_sha256 = 5;
  string expected_access_profile_id = 6;
  uint64 expected_access_profile_revision = 7;
  bytes project_spec_json = 8;
  string project_spec_sha256 = 9;
  string access_profile_id = 10;
  uint64 access_profile_revision = 11;
  string access_profile_reference = 12;
  bool allow_restart = 13;
  PlatformSourceAuthority expected_platform_source_authority = 14;
  PlatformSourceAuthority platform_source_authority = 15;
}

message HostPortBinding {
  uint32 host_port = 1;
  uint32 guest_port = 2;
}

message MeshAttachment {
  string mesh_url = 1;
  string organization_id = 2;
  string network_id = 3;
  string node_name = 4;
  // Canonical immutable application-port set admitted for Mesh TCP ingress.
  repeated uint32 guest_ports = 5;
  // Explicit non-secret owner store used to mint one fresh enrollment for
  // every VM generation. Unspecified is always rejected.
  MeshEnrollmentAuthSource auth_source = 6;
}

enum MeshEnrollmentAuthSource {
  MESH_ENROLLMENT_AUTH_SOURCE_UNSPECIFIED = 0;
  MESH_ENROLLMENT_AUTH_SOURCE_STANDALONE_LOCAL = 1;
  MESH_ENROLLMENT_AUTH_SOURCE_HOSTED_CURRENT = 2;
}

enum LocalMountMode {
  LOCAL_MOUNT_MODE_UNSPECIFIED = 0;
  LOCAL_MOUNT_MODE_COPY = 1;
  LOCAL_MOUNT_MODE_DIRECT = 2;
}

message LocalMountInput {
  bytes source_path = 1;
  string destination = 2;
  LocalMountMode mode = 3;
  optional bool read_only = 4;
  // Paths relative to source_path kept only on the VM's own disk
  // (codewire.yaml workspace.vm_only): a copy skips them, and the guest binds
  // a VM-disk directory over each in a read-write direct share. Empty for a
  // read-only direct mount.
  repeated string vm_only = 5;
}

message EnvironmentSelector {
  string name = 1;
  // Required only for mutating lifecycle RPCs. Read-only lookups leave this
  // empty so retries cannot accidentally acquire mutation semantics.
  string request_id = 2;
  // Optional stable identity precondition. Public adapters set this so a
  // delete-and-recreate race can never redirect a mutation by name.
  string environment_id = 3;
  // StartEnvironment only: start once although the VM's state disk could not
  // be cleared of an earlier sign-in (#6277). Refused for a VM on a platform
  // profile; every other RPC ignores it.
  bool start_with_uncleared_disk = 4;
}

message UpdateHostPortsRequest {
  string name = 1;
  string request_id = 2;
  // Optional stable identity precondition.
  string environment_id = 3;
  // Bindings to publish. A host port must not already be published.
  repeated HostPortBinding add = 4;
  // Published host ports to withdraw.
  repeated uint32 remove = 5;
}

message ResizeEnvironmentRequest {
  string name = 1;
  uint32 vcpus = 2;
  uint32 memory_mib = 3;
  uint64 disk_bytes = 4;
  string request_id = 5;
  // Optional stable identity precondition for public-coordinate adapters.
  string environment_id = 6;
  // Exact public idempotency key when request_id is its deterministic local
  // UUID projection. Empty for callers of the private local API.
  string public_request_id = 7;
  // Empty for private callers; otherwise one of live_only or allow_restart.
  string public_disruption_policy = 8;
}

message Environment {
  string id = 1;
  string name = 2;
  EnvironmentState state = 3;
  uint32 vcpus = 4;
  uint32 memory_mib = 5;
  uint64 disk_bytes = 6;
  uint64 generation = 7;
  reserved 8, 9;
  reserved "workspace_commit", "source_path";
  bool selected = 10;
  // Digest of the required canonical project intent stored for this environment.
  string project_spec_sha256 = 11;
  string workspace_plan_sha256 = 12;
  uint32 workspace_input_count = 13;
  // Canonical session default from the recorded portable project intent.
  string working_directory = 14;
  repeated HostPortBinding host_ports = 15;
  MeshAttachment mesh = 16;
  // Bounded machine-readable cause reported by the current runner. Empty
  // unless state is ENVIRONMENT_STATE_ERROR and the runner remains owned.
  string error_code = 17;
  // Logical scope-qualified profile reference selected for this environment.
  // The placement-private profile ID remains supervisor/authority metadata.
  string access_profile = 18;
  // Exact bound revision safe to display. The placement-private profile ID is
  // deliberately omitted.
  uint64 access_profile_revision = 19;
  // Environment-owned immutable skill snapshot identity and explicit refresh
  // generation. Empty/zero means the project selected no skills.
  string skill_snapshot_sha256 = 20;
  uint64 skill_snapshot_generation = 21;
  uint32 skill_snapshot_count = 22;
  // Dedicated guest-local Docker data disk. Zero means Docker is disabled.
  uint64 docker_disk_bytes = 23;
  // Material-free startup hint. True when lifecycle/session operations need
  // the local credential authority for an access profile or protected secret
  // selection.
  bool requires_credential_authority = 24;
  // Owner-only canonical configuration/selection metadata, never resolved
  // application values. Used to construct an exact source-update CAS.
  bytes project_spec_json = 25;
  string access_profile_id = 26;
  PlatformSourceAuthority platform_source_authority = 27;
  // The network policy it selects and what its running VM enforces (#2537).
  EnvironmentNetworkPolicy network_policy = 28;
  // How the process whose exit failed the environment closed ended, read
  // from its runner while it still reports error_code (#4953).
  RunnerExit runner_exit = 29;
  // Read from the running VM's runner when the environment is shown (#4965).
  EgressUnavailable egress_unavailable = 30;
  // Read from the running VM's runner when the environment is shown (#4912,
  // #5216).
  Interception interception = 31;
  // Read from the running VM's runner when the environment is shown
  // (#5058); absent when nothing was refused.
  EgressRefusalSummary egress_refusals = 32;
}

message ListEnvironmentsRequest {}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message ListOrphansRequest {}

message Orphan {
  string kind = 1;
  string path = 2;
  string reason = 3;
  uint64 reclaimable_bytes = 4;
}

message ListOrphansResponse {
  repeated Orphan orphans = 1;
  uint64 reclaimable_bytes = 2;
}

message DeleteEnvironmentResponse {
  string name = 1;
  bool removed = 2;
  // True means the environment is destroyed but an unsafe or unknown object
  // remains quarantined for read-only orphan inspection.
  bool cleanup_pending = 3;
}

// The capability is intentionally returned only over an admitted owner-only
// Unix socket. Callers must keep it in memory and must never serialize or log
// this message.
// What the local HTTPS router is doing (#4316).
enum LocalHttpsState {
  LOCAL_HTTPS_STATE_UNSPECIFIED = 0;
  // No environment has a labelled port, so nothing listens.
  LOCAL_HTTPS_STATE_UNUSED = 1;
  LOCAL_HTTPS_STATE_SERVING = 2;
  // This user may not listen on the port: on Linux, a port below
  // net.ipv4.ip_unprivileged_port_start.
  LOCAL_HTTPS_STATE_NOT_PERMITTED = 3;
  // Another program listens on the port.
  LOCAL_HTTPS_STATE_IN_USE = 4;
  // The user turned local HTTPS off.
  LOCAL_HTTPS_STATE_OFF = 5;
  // Listening failed otherwise, or the local CA could not be loaded.
  LOCAL_HTTPS_STATE_FAILED = 6;
}

message LocalHttps {
  LocalHttpsState state = 1;
  // The port the router serves on, or tries to. Zero when it is off.
  uint32 port = 2;
  // The CA certificate a browser must trust.
  string ca_certificate_path = 3;
  // Why listening failed, for LOCAL_HTTPS_STATE_FAILED. Carries no key
  // material.
  string failure = 4;
  // The named environment's labelled ports, in guest port order.
  repeated LocalHttpsHost hosts = 5;
}

message LocalHttpsHost {
  uint32 guest_port = 1;
  string label = 2;
  // Empty when the label and the environment's name make no hostname.
  string hostname = 3;
}

message PrepareLocalHttpsCaRequest {
  // Replace the CA with a new key and certificate.
  bool rotate = 1;
}

message SetLocalHttpsPortRequest {
  // The port to listen on; zero turns local HTTPS off.
  uint32 port = 1;
}

message DaemonAccess {
  string hybrid_socket = 1;
  uint32 guest_port = 2;
  string generation_capability = 3;
  // The private socket through which this generation's credential brokers
  // pair with the environment's front door (#3999), presenting the boot's
  // pairing secret (GetBootSecrets). Empty when the environment has no front
  // door.
  string front_door_socket = 4;
}

message CredentialBrokerRuntime {
  string environment_id = 1;
  uint64 environment_generation = 2;
  bool running = 3;
}

message AdoptRunnerRequest {
  string environment_id = 1;
}

message GetRunnerInfoRequest {}

message RunnerInfo {
  string environment_id = 1;
  EnvironmentState state = 2;
  uint64 generation = 3;
  // Exact immutable runtime bundle selected when this runner process started.
  string artifact_generation = 4;
  // Bounded machine-readable cause for an error state. Empty for every
  // non-error state.
  string error_code = 5;
  // Actual owned VMM attachment. Empty when no catalog disk is running.
  string cw_runtime_catalog_generation = 6;
  // How the process whose exit set error_code ended. Unset for every other
  // error and state (#4953).
  RunnerExit exit = 7;
  EgressUnavailable egress_unavailable = 8;
  Interception interception = 9;
  // Absent unless the running VM refused something (#5058).
  EgressRefusalSummary egress_refusals = 10;
}

// The VM's egress broker is past its deadline, so its network worker refuses
// each request on time (#4965): set from the first refusal until a request
// is answered again.
message EgressUnavailable {
  // Requests refused because the broker answered late, in all.
  uint64 late_answers = 1;
  // When the refusing began.
  int64 since_unix_ms = 2;
}

// Whether a running boot keeps agents' real credentials out of the VM, and
// why not (#4912). Absent for a stopped VM: only a running boot reports it.
enum InterceptionState {
  INTERCEPTION_STATE_UNSPECIFIED = 0;
  // The switch was on and the boot intercepts: agents hold placeholders.
  INTERCEPTION_STATE_INTERCEPTED = 1;
  // The switch was on but the boot does not intercept; reason says why.
  INTERCEPTION_STATE_NOT_INTERCEPTED = 2;
  // The per-host switch was off for this boot.
  INTERCEPTION_STATE_OFF = 3;
  // The boot intercepted, but its front door ended after the start: requests
  // to agent hosts now fail closed until the VM restarts.
  INTERCEPTION_STATE_LOST = 4;
}

// Why a switched-on boot does not intercept. Set only with NOT_INTERCEPTED.
enum InterceptionReason {
  INTERCEPTION_REASON_UNSPECIFIED = 0;
  // The credentials come from the platform; goes away with #4909.
  INTERCEPTION_REASON_PLATFORM_CREDENTIALS = 1;
  // No credential broker: no agent credential is selected.
  INTERCEPTION_REASON_NO_CREDENTIALS = 2;
  // The running credential authority predates boot secrets.
  INTERCEPTION_REASON_CREDENTIAL_SERVICE_OUTDATED = 3;
  // The boot was told to intercept but bound nothing: none of its selected
  // credentials goes through the front door yet, as GitHub's does not
  // (#5087). The runner reports it, never the supervisor (#5670).
  INTERCEPTION_REASON_NOTHING_TO_INTERCEPT = 4;
}

message Interception {
  InterceptionState state = 1;
  InterceptionReason reason = 2;
}

// How one of a runner's processes (the VMM or a sidecar) ended.
message RunnerExit {
  // Its exit status; absent when a signal ended it.
  optional int32 status = 1;
  // That status's name in the process's own exit-code table, in the
  // error_code vocabulary; empty when the table has none.
  string reason = 2;
  // The signal that ended it; absent when it exited with a status (#4953).
  optional int32 signal = 3;
}

enum RunnerStage {
  RUNNER_STAGE_UNSPECIFIED = 0;
  RUNNER_STAGE_WAITING_ADOPTION = 1;
  RUNNER_STAGE_READY = 2;
  RUNNER_STAGE_PREPARING_VM = 3;
  RUNNER_STAGE_STARTING_VMM = 4;
  RUNNER_STAGE_WAITING_GUEST = 5;
  RUNNER_STAGE_GUEST_INIT = 6;
  RUNNER_STAGE_DAEMON_READY = 7;
  RUNNER_STAGE_STOPPING_VM = 8;
  RUNNER_STAGE_STOPPED = 9;
  RUNNER_STAGE_GROWING_DISK = 10;
  RUNNER_STAGE_RETIRING = 11;
  RUNNER_STAGE_ERROR = 12;
}

enum GuestBootStage {
  GUEST_BOOT_STAGE_UNSPECIFIED = 0;
  GUEST_BOOT_STAGE_STATE_MOUNTED = 1;
  GUEST_BOOT_STAGE_CGROUPS_READY = 2;
  GUEST_BOOT_STAGE_DISKS_ADMITTED = 3;
  GUEST_BOOT_STAGE_ROOT_MOUNTED = 4;
  GUEST_BOOT_STAGE_SETUP_HEADER_READY = 5;
  GUEST_BOOT_STAGE_SETUP_CONTENT_READY = 6;
  GUEST_BOOT_STAGE_ROOT_LAYERS_READY = 7;
  GUEST_BOOT_STAGE_WORKSPACE_PLAN_READY = 8;
  GUEST_BOOT_STAGE_OWNERSHIP_READY = 9;
  GUEST_BOOT_STAGE_CONTAINER_CONTROL_READY = 10;
  GUEST_BOOT_STAGE_ROOT_GENERATION_READY = 11;
  GUEST_BOOT_STAGE_PERSISTENT_LAYOUT_READY = 12;
  GUEST_BOOT_STAGE_RUNC_LAUNCHING = 13;
  GUEST_BOOT_STAGE_RUNC_RUNNING = 14;
  GUEST_BOOT_STAGE_WORKSPACE_RUNNING = 15;
  GUEST_BOOT_STAGE_DAEMON_STARTED = 16;
  GUEST_BOOT_STAGE_SETUP_FAILED = 17;
  GUEST_BOOT_STAGE_WORKSPACE_FAILED = 18;
}

message WatchRunnerRequest {
  string environment_id = 1;
}

message RunnerEvent {
  uint64 sequence = 1;
  RunnerInfo runner = 2;
  RunnerStage stage = 3;
  uint64 guest_sequence = 4;
  GuestBootStage guest_stage = 5;
  string error_code = 6;
  // With error_code credential_broker_unavailable, a cause the runner
  // inferred: the closed name of what it saw, in the error_code vocabulary.
  // Empty with every other error code.
  string error_observed = 7;
}

message StartVmRequest {
  string environment_id = 1;
  uint64 generation = 2;
  uint32 vsock_cid = 3;
  uint32 daemon_vsock_port = 4;
  uint64 state_disk_bytes = 5;
  uint32 vcpus = 6;
  uint32 memory_mib = 7;
  // Host storage identity for the selected OCI/root-format generation. It
  // binds the OCI content, root-disk policy, and exact runtime artifact set,
  // and is independent from the monotonically increasing VM boot generation.
  string root_generation = 8;
  uint64 root_disk_bytes = 9;
  // Optional one-boot, credential-free setup-pack binding. Both fields must
  // be absent/zero or valid together; the runner derives the exact private
  // generation path and never accepts an arbitrary host pathname.
  uint64 setup_total_bytes = 10;
  string setup_header_sha256 = 11;
  // OCI content identity carried by the setup header and one-boot seed. It is
  // separate from root_generation so a runtime artifact change rotates host
  // storage without changing the verified registry/content identity.
  string setup_root_generation = 12;
  // Exact durable loopback TCP bindings selected by the supervisor for this
  // boot. The runner atomically reserves them before starting the VMM.
  repeated HostPortBinding host_ports = 13;
  // Non-secret network identity and immutable guest-port admission for this
  // generation. No enrollment or steady-state credential is allowed.
  MeshAttachment mesh = 14;
  // Exact host-only direct-share admissions for this generation. Source paths
  // and filesystem identity never enter the guest-visible plan or VMM argv.
  repeated DirectShareAttachment direct_shares = 15;
  // Digest of the canonical immutable skill-snapshot plan embedded in the
  // selected root generation. Empty means the project selected no skills.
  string skill_snapshot_sha256 = 16;
  // Dedicated preformatted Docker data disk. Zero means no Docker device is
  // attached and the guest must not start dockerd.
  uint64 docker_disk_bytes = 17;
  reserved 18, 19, 20;
  reserved "workload_secret_total_bytes", "workload_secret_sha256", "workload_secret_entry_count";
  // Current canonical environment source selection, never a built-root value
  // file. Empty means no application-secret projection is selected.
  string environment_projection_sha256 = 21;
  // Closed material-free client selection from the exact pinned profile.
  // Explicit v1:none is required when no managed credential client is selected.
  string managed_credential_clients = 22;
  // Lowercase SHA-256 of the independently admitted private runtime catalog.
  // The runner derives its fixed disk path; empty is allowed for raw fixtures.
  string cw_runtime_catalog_generation = 23;
  // The selected network policy's canonical document for this boot (#2537):
  // the revision the egress broker enforces. Empty means the built-in `open`.
  bytes network_policy_document = 24;
  // Restore this boot from the VM checkpoint the supervisor placed in
  // vms/<id>/checkpoints/in instead of booting it (#3046 R4, runner
  // protocol 10). vsock_cid is then the checkpoint's.
  CheckpointBoot checkpoint = 25;
  // Intercept the agent hosts through this boot's TLS front door (#3999),
  // off by default. The runner binds the front door's route hosts on 443 in
  // the egress broker and carries the front door's CA certificate to the
  // guest in the seed; no binding or key reaches the guest. A runner that
  // cannot start the front door refuses the boot.
  bool intercept = 26;
  // The bootstrap catalog a move takes this environment off (#4980; runner
  // protocol 13), sent only with a staged catalog: the guest rebuilds a
  // runtime cache bound to exactly this one. Empty for every other boot.
  string cw_runtime_moved_from_generation = 27;

  // With intercept, this environment's placeholder for each Anthropic form
  // its binding grants (#3999), and the github slot's while the boot binds
  // GitHub's hosts (#4001), which the seed carries beside the CA. Empty
  // otherwise. Not a credential: it only names one to the environment's own
  // broker.
  repeated SeedCredentialPlaceholder credential_placeholders = 28;

  // The supervisor starts a credential broker for this generation. The
  // runner uses it only to say, when the start fails, whether that broker
  // ever came for the generation's daemon access.
  bool credential_broker = 29;

  // What this boot starts with (#4912): intercepted exactly when intercept
  // is set, otherwise off or not intercepted with its reason; never lost.
  // The runner reports it in RunnerInfo while the boot runs, as lost once
  // its front door ends unasked. Absent from an older supervisor: the
  // runner then reports only lost.
  Interception interception = 30;

  // How the supervisor names network_policy_document (#5058).
  NetworkPolicyLabel network_policy_label = 31;
  // The policy of the allowed hosts the supervisor sends this boot's
  // credential authority, as it recorded them: the only label an
  // intercepted host's refusal by the network policy takes (#5058).
  NetworkPolicyLabel credential_policy_label = 32;
}

message SeedCredentialPlaceholder {
  // 1: the Anthropic API key (ANTHROPIC_AUTH_TOKEN); 2: the Claude
  // subscription token (CLAUDE_CODE_OAUTH_TOKEN); 3: the github slot (Git's
  // credential helper and GH_TOKEN), sent only for a boot that binds
  // GitHub's hosts, and the runner binds them only with it (#4001).
  uint32 slot = 1;
  string placeholder = 2;
}

message CheckpointBoot {
  string checkpoint_id = 1;
  // The environment the checkpoint captured: its paths name that VM.
  string source_environment_id = 2;
  // The VMM files placed in checkpoints/in, as captured.
  string config_sha256 = 3;
  string state_sha256 = 4;
  uint64 memory_bytes = 5;
  // The captured boot's setup disk, when it had one; zero otherwise.
  uint64 setup_disk_bytes = 6;
  // The VMM the checkpoint restores only into.
  string vmm_sha256 = 7;
  // What the captured guest applied at boot; this boot's must be the same.
  CheckpointBootBindings boot = 8;
  // The captured boot's generation: the restored guest moves past it.
  uint64 source_generation = 9;
  // On a Mac, the identity of the saved state the supervisor cloned into
  // checkpoints/in, from the clone's open descriptor right after it cloned a
  // checked source. The runner skips its digest when the file it opens has
  // exactly this identity (#6124). Absent: the runner digests.
  CheckpointStateIdentity state_identity = 10;
}

message CheckpointStateIdentity {
  uint64 device = 1;
  uint64 inode = 2;
  uint64 size = 3;
  int64 birth_seconds = 4;
  int64 birth_nanoseconds = 5;
  int64 change_seconds = 6;
  int64 change_nanoseconds = 7;
  uint32 mode = 8;
  // The saved state's sha256 this identity vouches for: it holds only for
  // a restore that expects exactly this digest.
  string sha256 = 9;
}

message DirectShareAttachment {
  bytes source_path = 1;
  uint32 device_major = 2;
  uint32 device_minor = 3;
  uint64 inode = 4;
  uint64 mount_id = 5;
  uint32 owner_uid = 6;
  sint64 filesystem_magic = 7;
  string destination = 8;
  bool read_only = 9;
  // Share-relative paths the guest backs with its own disk and binds over the
  // share; part of the digest-bound guest plan. Empty when read_only.
  repeated string vm_only = 10;
}

message StopVmRequest {
  // Skip the guest's graceful poweroff and shut the VMM down directly; the
  // disks are still released when the VMM exits. Set only by a Stop the
  // supervisor admitted for a VM checkpoint restore, which discards the
  // guest's state (#3046).
  bool discard_guest_state = 1;
}
message GrowStateDiskRequest {
  string environment_id = 1;
  uint64 disk_bytes = 2;
}
message GrowStateDiskResponse {
  uint64 disk_bytes = 1;
}
message SetHostPortsRequest {
  string environment_id = 1;
  uint64 generation = 2;
  repeated HostPortBinding host_ports = 3;
}
message SetHostPortsResponse {}
message ReplaceNetworkPolicyRequest {
  string environment_id = 1;
  uint64 generation = 2;
  // The canonical policy document, as in StartVmRequest.
  bytes network_policy_document = 3;
  // How the supervisor names it (#5058).
  NetworkPolicyLabel network_policy_label = 4;
  // The policy of the allowed hosts the supervisor sends the credential
  // authority next, as in StartVmRequest (#5058).
  NetworkPolicyLabel credential_policy_label = 5;
}
message ReplaceNetworkPolicyResponse {
  // The digest the broker acknowledged.
  bytes enforced_digest = 1;
}
message PrepareRetireRunnerRequest {}
message PrepareRetireRunnerResponse {}
message ShutdownRunnerRequest {
  string environment_id = 1;
  uint64 generation = 2;
}
message ShutdownRunnerResponse {}
message GetDaemonAccessRequest {}

message GetGenerationDaemonAccessRequest {
  string environment_id = 1;
  uint64 generation = 2;
}

message GetBootSecretsRequest {
  string environment_id = 1;
  uint64 generation = 2;
}

message GetBootSecretsResponse {
  repeated BootSecret secrets = 1;
}

// One per-boot secret (#3999): 32 random bytes the runner mints for an
// intercepting boot, in memory only.
message BootSecret {
  BootSecretPurpose purpose = 1;
  bytes value = 2 [debug_redact = true];
}

enum BootSecretPurpose {
  BOOT_SECRET_PURPOSE_UNSPECIFIED = 0;
  // Presented on the runner's pairing socket by each of the generation's
  // credential brokers.
  BOOT_SECRET_PURPOSE_FRONT_DOOR_PAIRING = 1;
}

// Retained images (protocol 21, #4262): after its last environment is
// removed, the newest pulled image of each of at most two repositories stays
// in the host's content store, so the next create of it pulls nothing.
service LocalImageCacheService {
  // Forget the retained images, and every failed create's download cache, and
  // collect: whatever no environment, pending create or snapshot still uses
  // is deleted. With dry_run, report only.
  rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);
}

message PruneImagesRequest {
  bool dry_run = 1;
}

message PruneImagesResponse {
  // The images retained before this request, most recently used first.
  repeated RetainedImage images = 1;
  // What deleting them frees: the bytes no environment, pending create or
  // snapshot also uses.
  uint64 reclaimable_bytes = 2;
  // Without dry_run: the images are forgotten, but the collection that frees
  // their disk did not finish now; the supervisor's collector runs it once
  // the VM work in flight ends. Always false with dry_run.
  bool collection_pending = 3;
}

message RetainedImage {
  // The registry and repository path, without a tag or digest.
  string repository = 1;
  uint64 bytes = 2;
  // The part of `bytes` nothing else uses.
  uint64 reclaimable_bytes = 3;
}
