[package]
name = "codewire-local-vmm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
description = "Codewire-owned host runtime for isolated local microVM environments"
build = "build.rs"

[features]
synthetic-oci-input-smoke = []

[[bin]]
name = "codewire-local-oci-import-smoke"
path = "src/bin/codewire-local-oci-import-smoke.rs"
required-features = ["synthetic-oci-input-smoke"]

[dependencies]
prost = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
axum = { workspace = true }
async-trait = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
bytes = { workspace = true }
codewire-access = { workspace = true }
codewire-client = { workspace = true }
codewire-cw-release = { workspace = true }
codewire-local-credentials = { workspace = true }
codewire-proto = { workspace = true }
codewire-project = { workspace = true }
codewire-project-proto = { workspace = true }
codewire-tailnet = { workspace = true }
codewire-daemon = { workspace = true }
codewire-daemon-bridge = { workspace = true }
codewire-egress-broker = { workspace = true }
codewire-egress-policy = { workspace = true }
codewire-ext4-scrub = { workspace = true }
codewire-netstack = { workspace = true }
codewire-daemon-proto = { workspace = true }
codewire-vmm-guest-probe = { workspace = true }
codewire-workspace-access = { workspace = true }
codewire-workspace-image = { workspace = true }
connectrpc = { workspace = true, features = ["axum", "client"] }
futures = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true }
libc = "0.2"
oci-spec = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
rusqlite = { workspace = true }
russh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssh-key = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
hmac = { workspace = true }
codewire-access = { workspace = true }
tokio-stream = { workspace = true }
codewire-protected-store = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { workspace = true, features = ["client"] }
prost-types = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
codewire-workspace-hack.workspace = true

[lints]
workspace = true
