[package]
name = "codewire-coordinator"
version.workspace = true
edition.workspace = true
# Server-side crate: AGPL like the other backend services.
license = "AGPL-3.0-only"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
codewire-server-core = { workspace = true }
codewire-proto = { workspace = true }
codewire-tailnet = { path = "../codewire-tailnet" }
connectrpc = { workspace = true, features = ["axum"] }
futures-util = "0.3"
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
buffa-types = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { workspace = true, features = ["axum", "client"] }
reqwest = { workspace = true }
tower = { workspace = true }
