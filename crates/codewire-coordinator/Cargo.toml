[package]
name = "codewire-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Server-side crate: AGPL like the other backend services.
license = "AGPL-3.0-only"

[features]
# Enables KIND_DERP_BROKER_HOST so Kind can advertise a verified-TLS in-cluster
# DERP node beside the host-facing ingress node (#6387). Never enabled in
# promotable images.
kind-e2e = []

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
# `otel`: a session's admission exports OpenTelemetry spans when
# OTEL_EXPORTER_OTLP_ENDPOINT is set (codewire-server-core/src/obs.rs).
codewire-server-core = { workspace = true, features = ["otel"] }
codewire-proto = { workspace = true }
codewire-tailnet = { path = "../codewire-tailnet" }
connectrpc = { workspace = true, features = ["axum"] }
futures-util = "0.3"
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
codewire-derp = { workspace = true }
buffa-types = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { workspace = true, features = ["axum", "client"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
codewire-workspace-hack.workspace = true

[lints]
workspace = true
