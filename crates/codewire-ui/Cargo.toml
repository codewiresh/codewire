[package]
name = "codewire-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
authors = ["Sonica"]
description = "Reusable GPUI components for the Codewire desktop app"

[lib]
name = "codewire_ui"

[dependencies]
gpui = { package = "gpui-ce", git = "https://github.com/noeljackson/gpui-ce.git", rev = "9bc7447ed57c9d0f8a3e4e0ca25da7c15982304a" }
unicode-segmentation = "1"

[patch.crates-io]
gpui_util = { git = "https://github.com/noeljackson/gpui-ce.git", rev = "9bc7447ed57c9d0f8a3e4e0ca25da7c15982304a" }
