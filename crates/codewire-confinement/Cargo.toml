[package]
name = "codewire-confinement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
description = "Process confinement primitives for Codewire's single-purpose host workers"

[features]
# Accessors that only tests of the crates using it need.
test-support = []

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
codewire-workspace-hack.workspace = true

[lints]
workspace = true
