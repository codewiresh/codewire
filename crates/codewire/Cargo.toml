[package]
name = "codewire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT"
description = "The Codewire Rust SDK: an ergonomic client for the public codewire.v1 API over Codewire's generated Connect-RPC stubs."
repository = "https://github.com/codewiresh/codewire"
keywords = ["codewire", "sandbox", "sdk", "connect-rpc"]
categories = ["api-bindings", "development-tools"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# Published, so each version is a floor rather than the workspace's exact
# pin; the lock still decides what CI builds (codewire#3511).
buffa = { version = "0.9.1", features = ["json"] }
buffa-types = { version = "0.9.1", features = ["json"] }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["client", "gzip", "json"] }
futures-util = "0.3"
http = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
# RUSTSEC-2026-0346 to 0349.
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
url = { workspace = true }
uuid = { workspace = true }
# RUSTSEC-2026-0381.
webpki-roots = "1.0.10"
x509-parser = { workspace = true }

[dev-dependencies]
# The deployment CA tests sign their own certificates.
rcgen = "0.13"
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
