[package]
name = "codewire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT"
description = "The Codewire Rust SDK: an ergonomic client for the public codewire.v1 API over Codewire's generated Connect-RPC stubs."
# Publishing, the MIT license and the crate's own version come with the
# release job (codewire#3511, private-docs: designs/2026-11-16-rust-sdk.md).
publish = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
connectrpc = { workspace = true, features = ["client"] }
futures-util = "0.3"
http = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
url = { workspace = true }
uuid = { workspace = true }
webpki-roots = "=1.0.10"
x509-parser = { workspace = true }

[dev-dependencies]
# The deployment CA tests sign their own certificates.
rcgen = "0.13"
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
