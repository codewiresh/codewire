[package]
name = "codewire-derp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Explicit permissive license (not the MIT workspace default): DERP is part of
# the extractable tailnet stack, matching codewire-tailnet (BSD-3-Clause).
license = "BSD-3-Clause"
authors.workspace = true
description = "Rust DERP relay core for Codewire tailnet migration."
repository = "https://github.com/codewiresh/codewire"

[dependencies]
codewire-tailnet = { workspace = true }
futures-util = "0.3"
crc32fast = { workspace = true }
rand = { workspace = true }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
