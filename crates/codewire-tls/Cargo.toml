[package]
name = "codewire-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Bounded mounted-file TLS transport for Codewire service identities"

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
futures = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
# Already locked through reqwest. No default features: the caller's
# ring-backed rustls configuration is the only crypto provider it uses.
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "http2", "tls12"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
rcgen = { version = "0.13", optional = true }
tempfile = { workspace = true, optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Synthetic PKI and a TLS test listener for other crates' tests.
test-support = ["dep:rcgen", "dep:tempfile"]

[dev-dependencies]
bytes = { workspace = true }
http-body-util = { workspace = true }
rcgen = "0.13"
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
codewire-workspace-hack.workspace = true

[lints]
workspace = true
