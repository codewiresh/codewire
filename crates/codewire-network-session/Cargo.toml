[package]
name = "codewire-network-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "The authenticated network session between an environment's guest and its host egress worker."

[dependencies]
hmac = { workspace = true }
rustix = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "macros", "time"] }
uuid = { workspace = true }
zeroize = { workspace = true }

# A hosted guest's routing (`hosted::routing`), for `cw` and its daemon only:
# off by default, so the guest init, which depends on this crate, never links
# netlink.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = { workspace = true, optional = true }
netlink-packet-route = { workspace = true, optional = true }
netlink-sys = { workspace = true, optional = true }

[features]
# A hosted Sandbox's egress loop and its connector to cw-egress (#4000): off
# by default for the same reason, so the guest init compiles neither.
hosted-guest = ["rustix/rand", "tokio/fs"]
hosted-routing = [
    "dep:netlink-packet-core",
    "dep:netlink-packet-route",
    "dep:netlink-sys",
    "rustix/net",
]

[dev-dependencies]
codewire-workspace-hack.workspace = true
serde_json = { workspace = true }

[lints]
workspace = true
