[package]
name = "codewire-mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Rust Codewire Mesh service."

[[bin]]
name = "codewire-mesh"
path = "src/main.rs"

[lib]
name = "codewire_mesh"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
buffa-types = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
codewire-proto = { workspace = true, features = ["client"] }
codewire-tailnet = { workspace = true }
codewire-server-core = { workspace = true }
futures-util = "0.3"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tower = { workspace = true }
