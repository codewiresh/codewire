[package]
name = "codewire-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
authors = ["Sonica"]
description = "Desktop app for Codewire (gpui)"

[[bin]]
name = "codewire"
path = "src/main.rs"

[dependencies]
codewire-client = { path = "../codewire-client", features = ["desktop-keyring", "desktop-pkce-loopback"] }
codewire-types = { path = "../codewire-types" }
codewire-ui = { path = "../codewire-ui" }
gpui = { package = "gpui-ce", git = "https://github.com/noeljackson/gpui-ce.git", rev = "26813dad6cbc4a5e1a2f56ef46e27d0f16ea30ff" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/noeljackson/gpui-ce.git", rev = "26813dad6cbc4a5e1a2f56ef46e27d0f16ea30ff", features = ["font-kit", "wayland", "x11"] }
alacritty_terminal = "0.25"
dirs = "5"
futures = "0.3"
open = "5"
portable-pty = "0.9"
schemars = "1"
rfd = "0.15"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }
wry = { git = "https://github.com/tauri-apps/wry.git", rev = "327242ae73301c5e34dcc158e31ae453e8afe837" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.19.0"
gdkx11 = "=0.19.0"
x11-dl = "=2.21.0"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[dev-dependencies]
gpui = { package = "gpui-ce", git = "https://github.com/noeljackson/gpui-ce.git", rev = "26813dad6cbc4a5e1a2f56ef46e27d0f16ea30ff", features = ["test-support"] }

[patch.crates-io]
webkit2gtk = { git = "https://github.com/tauri-apps/webkit2gtk-rs.git", rev = "61cfcd4dd79ae24f37a20c31b1848476fd80caba" }
webkit2gtk-sys = { git = "https://github.com/tauri-apps/webkit2gtk-rs.git", rev = "61cfcd4dd79ae24f37a20c31b1848476fd80caba" }
