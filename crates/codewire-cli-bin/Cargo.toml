[package]
name = "codewire-cli-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Codewire cw CLI binary wrapper."

[features]
local-broker-synthetic-smoke = ["codewire-cli/local-broker-synthetic-smoke"]

[[bin]]
name = "cw"
path = "src/main.rs"

[dependencies]
codewire-cli = { path = "../codewire-cli" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
codewire-derp = { workspace = true }
codewire-mesh = { path = "../codewire-mesh" }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
axum = { workspace = true }
codewire-client = { workspace = true }
codewire-derp = { workspace = true }
codewire-egress-broker = { workspace = true }
codewire-egress-policy = { workspace = true }
codewire-local-vmm = { path = "../codewire-local-vmm" }
codewire-mesh = { path = "../codewire-mesh" }
codewire-proto = { workspace = true, features = ["client"] }
codewire-server-core = { workspace = true }
codewire-tailnet = { workspace = true }
codewire-vmm-guest-probe = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
futures = { workspace = true }
libc = "0.2"
rand = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
codewire-egress-broker = { workspace = true }
codewire-local-vmm = { path = "../codewire-local-vmm" }
codewire-vmm-guest-probe = { workspace = true }
libc = "0.2"
tempfile = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
