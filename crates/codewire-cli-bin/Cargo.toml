[package]
name = "codewire-cli-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Codewire cw CLI binary wrapper."

[features]
local-broker-synthetic-smoke = ["codewire-cli/local-broker-synthetic-smoke"]

[[bin]]
name = "cw"
path = "src/main.rs"

[dependencies]
codewire-cli = { path = "../codewire-cli" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
codewire-derp = { workspace = true }
codewire-local-vmm = { path = "../codewire-local-vmm" }
codewire-mesh = { path = "../codewire-mesh" }
tracing-subscriber = { workspace = true }

# `cw __hosted-egress-tun`, a hosted Sandbox's init container (#4000).
[target.'cfg(target_os = "linux")'.dependencies]
codewire-network-session = { workspace = true, features = ["hosted-routing"] }
codewire-vmm-guest-probe = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
buffa = { workspace = true }
codewire-client = { workspace = true }
codewire-credential-bridge = { workspace = true }
codewire-daemon-proto = { workspace = true }
codewire-derp = { workspace = true }
codewire-egress-broker = { workspace = true }
codewire-egress-policy = { workspace = true }
codewire-local-vmm = { path = "../codewire-local-vmm" }
codewire-mesh = { path = "../codewire-mesh" }
codewire-proto = { workspace = true, features = ["client"] }
codewire-server-core = { workspace = true }
codewire-tailnet = { workspace = true }
codewire-vmm-guest-probe = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
futures = { workspace = true }
libc = "0.2"
rand = { workspace = true }
rustix = { workspace = true, features = ["net"] }
# The front door's own ring-only Rustls, for a client that trusts only the
# environment CA.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tonic = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
codewire-workspace-hack.workspace = true
codewire-workspace-image = { workspace = true }

[lints]
workspace = true
