[package]
name = "codewire-cli-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Codewire cw CLI binary wrapper."

[features]
local-broker-synthetic-smoke = ["codewire-cli/local-broker-synthetic-smoke"]

[[bin]]
name = "cw"
path = "src/main.rs"

[dependencies]
codewire-cli = { path = "../codewire-cli" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
