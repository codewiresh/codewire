[package]
name = "codewire-credential-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
description = "Isolated provider credential brokerage for Codewire environments"

[features]
default = ["local"]
local = ["dep:codewire-local-credentials", "dep:codewire-protected-store"]
local-broker-synthetic-smoke = []

[dependencies]
async-trait = { workspace = true }
av-credential-proxy = { workspace = true }
bytes = { workspace = true }
codewire-access = { workspace = true }
codewire-daemon = { workspace = true }
codewire-gateway-proto = { workspace = true }
codewire-local-credentials = { workspace = true, optional = true }
codewire-protected-store = { workspace = true, optional = true }
futures = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
codewire-local-credentials = { workspace = true }
codewire-protected-store = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
