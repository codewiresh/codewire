[package]
name = "codewire-credential-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
description = "Isolated provider credential brokerage for Codewire environments"

[features]
default = ["local"]
local = ["dep:codewire-local-credentials", "dep:codewire-protected-store"]
platform = ["dep:codewire-platform-credentials", "dep:codewire-protected-store", "dep:tonic"]
codex-enrollment = ["dep:rustix"]
ssh-agent = ["dep:rustix", "dep:codewire-protected-store", "codewire-protected-store/ssh-material"]
local-broker-synthetic-smoke = []
host-agent-synthetic-smoke = ["local", "local-broker-synthetic-smoke", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:rand", "dep:subtle", "dep:rustix"]

[[bin]]
name = "codewire-host-agent-smoke"
path = "src/bin/codewire-host-agent-smoke.rs"
required-features = ["host-agent-synthetic-smoke"]

[dependencies]
prost = { workspace = true }
async-trait = { workspace = true }
av-credential-proxy = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
codewire-access = { workspace = true }
codewire-daemon = { workspace = true }
codewire-gateway-proto = { workspace = true }
codewire-local-credentials = { workspace = true, optional = true }
codewire-platform-credentials = { workspace = true, optional = true }
codewire-protected-store = { workspace = true, optional = true }
codewire-workload-secrets = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "server"] }
hyper-util = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true }
rustix = { workspace = true, optional = true, features = ["pipe"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
codewire-server-core = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
codewire-local-credentials = { workspace = true }
codewire-protected-store = { workspace = true, features = ["platform-test-support"] }
sqlx = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
