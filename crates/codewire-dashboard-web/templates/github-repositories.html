<section aria-label="GitHub repository results" data-github-results-page>
  {% if !error.is_empty() %}
  <p class="cw-field-error" role="alert">{{ error }}</p>
  {% else %}
  {% if repositories.is_empty() %}<p role="status">No repositories are available on this page for your GitHub account.</p>{% endif %}
  <ul class="cw-github-repository-list">
    {% for repository in repositories %}
    <li><button class="cw-row-button" type="button" data-select-github-repository data-repository-url="{{ repository.clone_url }}" data-repository-branch="{{ repository.default_branch }}" data-repository-name="{{ repository.full_name }}" data-repository-private="{{ repository.is_private }}"{% if repository.disabled %} data-repository-unavailable disabled{% endif %}><span class="cw-github-repository-copy"><span class="cw-sr-only" data-github-repository-verb>Add</span> <strong>{{ repository.full_name }}</strong> <span class="cw-github-repository-badges">{% if repository.is_private %}<span class="cw-badge" data-tone="purple">Private</span>{% else %}<span class="cw-badge">Public</span>{% endif %}{% if repository.archived %} <span class="cw-badge" data-tone="warning">Archived</span>{% endif %}{% if repository.disabled %} <span class="cw-badge">Unavailable</span>{% endif %}</span></span><span class="cw-github-repository-action" aria-hidden="true" data-github-repository-action>+ Add</span></button></li>
    {% endfor %}
  </ul>
  {% if !next_page_token.is_empty() %}<button class="cw-button cw-button--outline" type="button" data-github-next data-page-token="{{ next_page_token }}">Next page</button>{% endif %}
  {% endif %}
</section>
