<div class="cw-field"><label class="cw-label" for="{{ resize_fields_id }}-cpu">CPU</label><select class="cw-select" id="{{ resize_fields_id }}-cpu" name="cpu_millicores" required>{% for choice in resize_sandbox.cpu_resize_choices() %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}{% if choice.off_catalog %} data-resize-current{% endif %}>{{ choice.label }}</option>{% endfor %}</select></div>
<div class="cw-field"><label class="cw-label" for="{{ resize_fields_id }}-memory">Memory</label><select class="cw-select" id="{{ resize_fields_id }}-memory" name="memory_mb" required>{% for choice in resize_sandbox.memory_resize_choices() %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}{% if choice.off_catalog %} data-resize-current{% endif %}>{{ choice.label }}</option>{% endfor %}</select></div>
<div class="cw-field"><label class="cw-label" for="{{ resize_fields_id }}-disk">Disk (GiB)</label><input class="cw-input" id="{{ resize_fields_id }}-disk" name="disk_gb" type="number" min="1" max="{{ resize_sandbox.disk_resize_max() }}" value="{{ resize_sandbox.disk_gb }}" required></div>
