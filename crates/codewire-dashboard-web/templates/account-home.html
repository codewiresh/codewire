<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="/assets/codewire/theme-v1.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":true}]}' >
    <title>Welcome to Codewire</title>
    <link rel="stylesheet" href="/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/dashboard-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/organizations-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/environments-v2.css">
    <link rel="stylesheet" href="/assets/codewire/routes/billing-admin-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/overview-v1.css">
    <script src="/assets/codewire/htmx-2.0.10.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" defer></script>
    <script src="/assets/codewire/dashboard-v1.js" defer></script>
  </head>
  <body class="cw-body" data-route="overview">
    <div class="cw-app" data-dashboard-app data-mobile-open="false" data-sidebar-collapsed="{{ view.sidebar_collapsed }}">
      <aside class="cw-sidebar-slot">{% include "sidebar.html" %}</aside>
      <header class="cw-mobile-bar"><button class="cw-mobile-toggle" type="button" data-sidebar-toggle aria-label="Toggle sidebar"><svg class="cw-icon" aria-hidden="true"><use href="/assets/codewire/icons-v2.svg#icon-menu"/></svg></button><a class="cw-brand" href="/dashboard/"><img src="/assets/codewire/console-logo-v1.svg" alt=""><span class="cw-sr-only">Codewire</span></a></header>
      <button class="cw-mobile-overlay" type="button" data-sidebar-close aria-label="Close sidebar"></button>
      <aside class="cw-mobile-drawer">{% include "sidebar.html" %}</aside>
      <main class="cw-main">
        <header class="cw-console-header"><div class="cw-console-breadcrumb"><strong>home</strong></div>{% include "console-account.html" %}</header>
        <div class="cw-main-inner"><div class="cw-page cw-page--wide">
          <header class="cw-page-header"><div class="cw-list-title"><h1 class="cw-page-title">Welcome to Codewire</h1></div></header>
          <div class="cw-overview" id="account-overview" hx-get="/dashboard/_fragments/overview?current={{ view.selected_organization_slug }}" hx-trigger="load, account-overview-retry" hx-swap="innerHTML" aria-busy="true" data-account-overview>
            <p class="cw-help" role="status"><span class="cw-spinner" aria-hidden="true" data-account-overview-spinner></span> <span data-account-overview-status>Loading your organizations…</span></p>
            <p hidden data-account-overview-failed><button class="cw-button cw-button--outline cw-button--small" type="button" data-account-overview-retry>Retry</button></p>
            <ul class="cw-org-overview" aria-hidden="true" data-account-overview-skeleton>{% for organization in view.organizations %}<li class="cw-card"><div class="cw-card-body"><div class="cw-row-skeleton"><span class="cw-skeleton"></span><span class="cw-skeleton"></span></div><div class="cw-row-skeleton"><span class="cw-skeleton"></span><span class="cw-skeleton"></span></div></div></li>{% endfor %}</ul>
          </div>
        </div></div>
      </main>
    </div>
  </body>
</html>
