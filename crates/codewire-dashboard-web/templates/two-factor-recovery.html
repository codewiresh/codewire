<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="/assets/codewire/theme-v1.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save recovery codes · Codewire</title>
    <link rel="stylesheet" href="/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/auth-v2.css">
  </head>
  <body class="cw-body cw-auth-body" data-route="two-factor-recovery">
    <main class="cw-auth-shell">
      <a class="cw-auth-brand" href="/" aria-label="Codewire home"><img src="/assets/codewire/brand-icon-v1.svg" width="48" height="48" alt="Codewire"></a>
      <section class="cw-auth-panel" aria-labelledby="recovery-title">
        <header class="cw-auth-header">
          <h1 id="recovery-title" class="cw-page-title">Two-factor authentication enabled</h1>
          <p class="cw-auth-copy">Save these recovery codes now. Each code works once, and Codewire will not show this set again.</p>
        </header>
        <div class="cw-setup-grid">
          <section aria-labelledby="backup-title">
            <h2 id="backup-title" class="cw-card-title">Save recovery codes</h2>
            <ul class="cw-backup-codes">
              {% for code in view.backup_codes %}<li><code data-testid="recovery-code">{{ code }}</code></li>{% endfor %}
            </ul>
          </section>
          <a class="cw-button cw-button--pill cw-button--large cw-auth-submit" href="{{ view.return_to }}">Continue to Codewire</a>
        </div>
      </section>
    </main>
  </body>
</html>
