{% if !view.sandbox_rail_available %}
<p class="cw-rail-status" role="status">Sandbox status is temporarily unavailable.</p>
{% else if view.sandboxes.is_empty() %}
<p class="cw-rail-status">No Sandboxes yet.</p>
{% else %}
<div class="cw-rail-list">
  {% for sandbox in view.sandboxes %}
  <a class="cw-rail-row" href="/{{ view.selected_organization_slug }}/{{ sandbox.id }}/" data-search-item data-search-text="{{ sandbox.name }} {{ sandbox.id }} {{ sandbox.state }}">
    <span class="cw-rail-dot" data-tone="{{ sandbox.state_tone }}" aria-hidden="true"></span>
    <span class="cw-rail-name">{{ sandbox.name }}</span>
    <span class="cw-rail-state">{{ sandbox.state }}</span>
  </a>
  {% endfor %}
</div>
{% endif %}
