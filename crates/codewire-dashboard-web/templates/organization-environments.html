<html lang="en">

    <link rel="stylesheet" href="/assets/codewire/routes/dashboard-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/organizations-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/environments-v2.css">
    <link rel="stylesheet" href="/assets/codewire/xterm-6.0.0.css" integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD">

    <script src="/assets/codewire/htmx-2.0.10.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" defer></script>
    <script src="/assets/codewire/xterm-6.0.0.js" integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4" defer></script>

    <script src="/assets/codewire/addon-web-links-0.12.0.js" integrity="sha384-0IIwkXq0LAkIxEVKxlOxWbje2g/VT+5CzVTZiEukyiZ02pOl/O+M0fkpEKAYqto9" defer></script>

    <script src="/assets/codewire/terminal-v1.js" defer></script>
  </head>
  <body class="cw-body" data-route="organization" data-terminal-websocket-origin="{{ terminal_websocket_origin }}">
    <div class="cw-app" data-dashboard-app data-mobile-open="false">
      <aside class="cw-sidebar-slot">{% include "sidebar.html" %}</aside>
      <header class="cw-mobile-bar"><button class="cw-mobile-toggle" type="button" data-sidebar-toggle aria-label="Toggle sidebar"><svg class="cw-icon" aria-hidden="true"><use href="/assets/codewire/icons-v2.svg#icon-menu"/></svg></button><a class="cw-brand" href="/dashboard"><img src="/assets/codewire/logo-v1.svg" alt=""><span>Codewire</span></a></header>
      <button class="cw-mobile-overlay" type="button" data-sidebar-close aria-label="Close sidebar"></button>
      <aside class="cw-mobile-drawer">{% include "sidebar.html" %}</aside>
      <main class="cw-main"><div class="cw-main-inner"><div class="cw-page">
        <a class="cw-back-link" href="/dashboard"><svg class="cw-icon" aria-hidden="true"><use href="/assets/codewire/icons-v2.svg#icon-chevron-left"/></svg>Dashboard</a>
        <header class="cw-org-header"><h1 class="cw-page-title">{{ organization.name }}</h1><span class="cw-badge">{{ organization.role }}</span></header>
        {% include "organization-tabs.html" %}
        {% include "organization-environments-content.html" %}
      </div></div></main>
    </div>
    <section class="cw-terminal-drawer" data-terminal-drawer aria-label="Environment terminal" hidden>
      <header class="cw-terminal-header">
        <div class="cw-terminal-heading"><svg class="cw-icon" aria-hidden="true"><use href="/assets/codewire/icons-v2.svg#icon-terminal"/></svg><strong data-terminal-title>Terminal</strong><span class="cw-status" data-terminal-state></span></div>
        <div class="cw-terminal-actions"><a class="cw-button cw-button--outline cw-button--small" href="/dashboard" data-terminal-fullscreen>Full screen</a><button class="cw-button cw-button--ghost cw-button--small" type="button" data-terminal-close aria-label="Close terminal">Close</button></div>
      </header>
      <div class="cw-terminal-panel" data-terminal-root data-terminal-running="false" aria-label="Interactive terminal"><p class="cw-terminal-status" data-terminal-status>Choose a running environment.</p></div>
    </section>
  </body>
</html>
