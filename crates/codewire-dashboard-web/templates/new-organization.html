<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":true}]}' >
    <title>Create Organization · Codewire</title>
    <link rel="stylesheet" href="/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/dashboard-v1.css">
    <script src="/assets/codewire/htmx-2.0.10.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" defer></script>
    <script src="/assets/codewire/dashboard-v1.js" defer></script>
  </head>
  <body class="cw-body" data-route="organization-create">
    <div class="cw-app" data-dashboard-app data-mobile-open="false" data-sidebar-collapsed="{{ view.sidebar_collapsed }}">
      <aside class="cw-sidebar-slot">
        {% include "sidebar.html" %}
      </aside>
      <header class="cw-mobile-bar">
        <button class="cw-mobile-toggle" type="button" data-sidebar-toggle aria-label="Toggle sidebar">
          <svg class="cw-icon" aria-hidden="true"><use href="/assets/codewire/icons-v2.svg#icon-menu"/></svg>
        </button>
        <a class="cw-brand" href="/dashboard/"><img src="/assets/codewire/console-logo-v1.svg" alt=""><span class="cw-sr-only">Codewire</span></a>
      </header>
      <button class="cw-mobile-overlay" type="button" data-sidebar-close aria-label="Close sidebar"></button>
      <aside class="cw-mobile-drawer">
        {% include "sidebar.html" %}
      </aside>
      <main class="cw-main">{% let crumb_scope = "account" %}{% let crumb_page = "new organization" %}{% include "console-header.html" %}
        <div class="cw-main-inner">
          <div class="cw-page cw-form-page">
            <a class="cw-back-link" href="/dashboard/">
              <svg class="cw-icon" aria-hidden="true"><use href="/assets/codewire/icons-v2.svg#icon-chevron-left"/></svg>
              Back to Dashboard
            </a>
            <section class="cw-card" aria-labelledby="create-organization-title">
              <header class="cw-card-header cw-form-header">
                <h1 id="create-organization-title" class="cw-page-title">Create Organization</h1>
              </header>
              {% include "organization-form.html" %}
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
