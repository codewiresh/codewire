{% if let Some(banner) = banner %}<aside class="cw-banner" data-tone="{{ banner.tone }}" aria-label="Billing" hx-get="/{{ slug }}/_fragments/billing-banner" hx-trigger="codewire:live:credit from:body, codewire:live:resync from:body" hx-swap="outerHTML"><p>{{ banner.text }}</p>{% if let Some(action) = banner.action %}<a class="cw-banner-action" href="{{ action.url }}">{{ action.label }}</a>{% endif %}</aside>{% else %}<div hidden hx-get="/{{ slug }}/_fragments/billing-banner" hx-trigger="codewire:live:credit from:body, codewire:live:resync from:body" hx-swap="outerHTML"></div>{% endif %}
