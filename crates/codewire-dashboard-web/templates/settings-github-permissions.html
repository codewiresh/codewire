{% if !pending.is_empty() %}<section class="cw-alert cw-alert--warning" aria-label="GitHub permissions">{% for pending in pending %}<p>GitHub is waiting for you to accept Codewire's updated permissions on {{ pending.account }}.{% if !pending.url.is_empty() %} <a class="cw-link-button" href="{{ pending.url }}" target="_blank" rel="noopener noreferrer">Review on GitHub</a>{% endif %}</p>{% endfor %}</section>{% endif %}
