<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.environment.name }} · Terminal · Codewire</title>
    <link rel="stylesheet" href="/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="/assets/codewire/xterm-6.0.0.css" integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD">
    <link rel="stylesheet" href="/assets/codewire/routes/terminal-v1.css">
    <script src="/assets/codewire/xterm-6.0.0.js" integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4" defer></script>
    <script src="/assets/codewire/addon-fit-0.11.0.js" integrity="sha384-txoiwu4RR2GD3qySbaj+BbzibkLbSJRcfqGYMu6z1EqHil4A2dyBiBW5dlacG6OR" defer></script>
    <script src="/assets/codewire/addon-web-links-0.12.0.js" integrity="sha384-0IIwkXq0LAkIxEVKxlOxWbje2g/VT+5CzVTZiEukyiZ02pOl/O+M0fkpEKAYqto9" defer></script>
    <script src="/assets/codewire/terminal-v1.js" defer></script>
  </head>
  <body class="cw-body cw-terminal-page" data-terminal-websocket-origin="{{ page.websocket_origin }}">
    <header class="cw-terminal-header cw-terminal-page-header">
      <div class="cw-terminal-heading">
        <a class="cw-terminal-back" href="{{ page.environments_url }}" aria-label="Back to dashboard">←</a>
        <strong>{{ page.environment.name }}</strong>
        <span class="cw-status" data-tone="{{ page.environment.state_tone }}">{{ page.environment.state }}</span>
      </div>
      <div class="cw-terminal-actions"><button class="cw-button cw-button--outline cw-button--small" type="button" data-terminal-disconnect>Disconnect</button><a class="cw-button cw-button--outline cw-button--small" href="{{ page.environments_url }}">Dashboard</a></div>
    </header>
    <main class="cw-terminal-page-main">
      <div class="cw-terminal-panel cw-terminal-panel--fullscreen" data-terminal-root data-terminal-org-id="{{ page.organization_id }}" data-terminal-environment-id="{{ page.environment.id }}" data-terminal-running="{{ page.environment.can_stop }}" aria-label="Interactive terminal"><p class="cw-terminal-status" data-terminal-status>Connecting…</p></div>
      <noscript><section class="cw-terminal-fallback"><h1>Use the CLI terminal</h1><p>The browser terminal needs JavaScript. You can connect without it:</p><code>cw shell {{ page.environment.id }}</code></section></noscript>
    </main>
    <footer class="cw-terminal-footer"><span>{{ page.environment.resources }}</span><span>{{ page.environment.running_time }}</span><span>{{ page.environment.hourly_rate }}</span></footer>
  </body>
</html>
