<dialog class="cw-dialog" data-dialog data-sandbox-resize id="sandbox-resize"
  data-resize-account-id="{{ page.account_id }}" data-resize-environment-id="{{ page.environment.id }}"
  data-resize-org-slug="{{ organization.slug }}" aria-labelledby="sandbox-resize-title">
  <header class="cw-dialog-header"><h2 id="sandbox-resize-title">Resize {{ page.environment.name }}</h2></header>
  <section class="cw-dialog-body" aria-label="Resize resources" data-resize-content>
    <p>Review the proposed change before applying it. Some changes require a restart.</p>
    <form data-resize-plan-form>
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <fieldset data-resize-inputs><legend>Requested resources</legend>
        <label for="resize-cpu">CPU (millicores)</label><input class="cw-input" id="resize-cpu" name="cpu_millicores" type="number" min="100" max="128000" value="{{ page.environment.cpu_millicores }}" required>
        <p class="cw-field-help">1,000 millicores is one vCPU.</p>
        <label for="resize-memory">Memory (MiB)</label><input class="cw-input" id="resize-memory" name="memory_mb" type="number" min="128" max="1048576" value="{{ page.environment.memory_mb }}" required>
        <label for="resize-disk">Disk (GiB)</label><input class="cw-input" id="resize-disk" name="disk_gb" type="number" min="1" max="16384" value="{{ page.environment.disk_gb }}" required>
        <button class="cw-button" type="submit" data-resize-review>Review resize</button>
      </fieldset>
    </form>
    <section aria-labelledby="resize-review-title" data-resize-plan hidden>
      <h3 id="resize-review-title">Proposed change</h3>
      <p data-resize-summary></p><p data-resize-mode></p>
      <p class="cw-alert" data-resize-disk-warning hidden>Growing the workspace disk cannot be undone. You cannot shrink it back to its previous size.</p>
      <form data-resize-apply-form>
        <fieldset data-resize-consents><legend>Confirm this change</legend>
          <label data-resize-restart-consent hidden><input type="checkbox" name="allow_restart">Allow a restart of this Sandbox.</label>
          <label data-resize-session-consent hidden><input type="checkbox" name="force">Allow the active terminal sessions shown in this review to end.</label>
          <button class="cw-button" type="submit" data-resize-apply>Apply resize</button>
        </fieldset>
      </form>
    </section>
    <p role="status" data-resize-status></p>
    <button class="cw-button cw-button--outline" type="button" data-resize-observe hidden>Check resize status</button>
  </section>
  <footer class="cw-dialog-actions"><button class="cw-button cw-button--outline" type="button" data-dialog-close autofocus>Close</button></footer>
</dialog>
