<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · Codewire</title>
    <link rel="stylesheet" href="/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/auth-v2.css">
    <link rel="stylesheet" href="/assets/codewire/cosmos-v1.css">
    <script src="/assets/codewire/cosmos-v1.js" defer></script>
  </head>
  <body class="cw-body cw-auth-body" data-route="auth-status">
    <div class="cw-cosmos" aria-hidden="true">
      <canvas id="cosmos-canvas"></canvas>
    </div>
    <main class="cw-auth-shell">
      <a class="cw-auth-brand" href="/" aria-label="Codewire home"><img src="/assets/codewire/brand-icon-v1.svg" width="48" height="48" alt="Codewire"></a>
      <section class="cw-auth-panel" aria-labelledby="status-title">
        <header class="cw-auth-header">
          <h1 id="status-title" class="cw-page-title">{{ title }}</h1>
          <p class="cw-auth-copy">{{ description }}</p>
        </header>
        <a class="cw-button cw-button--pill cw-button--large cw-auth-submit" href="{{ primary_url }}">{{ primary_label }}</a>
      </section>
    </main>
  </body>
</html>
