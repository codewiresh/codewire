<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · Codewire</title>
    <link rel="stylesheet" href="/assets/codewire/design-v1.css">
    <link rel="stylesheet" href="/assets/codewire/routes/auth-v1.css">
  </head>
  <body class="cw-body cw-auth-body" data-route="auth-status">
    <main class="cw-auth-shell">
      <a class="cw-auth-brand" href="/"><img src="/assets/codewire/logo-v1.svg" alt=""><span>Codewire</span></a>
      <section class="cw-card cw-auth-card">
        <header class="cw-card-header cw-auth-header">
          <div class="cw-auth-mark cw-auth-mark--success" aria-hidden="true"><svg class="cw-icon"><use href="/assets/codewire/icons-v2.svg#icon-check"/></svg></div>
          <h1 class="cw-page-title">{{ title }}</h1>
          <p class="cw-card-description">{{ description }}</p>
        </header>
        <div class="cw-card-content"><a class="cw-button cw-auth-submit" href="{{ primary_url }}">{{ primary_label }}</a></div>
      </section>
    </main>
  </body>
</html>
