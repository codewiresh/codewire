[package]
name = "codewire-credential-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
description = "Concrete private platform credential service authority"

[[bin]]
name = "codewire-credential-service"
path = "src/main.rs"
required-features = ["enrollment"]

[features]
default = []
# Non-promotable Kind image only: lets the production runtime use the
# in-memory test KEK instead of OpenBao (CODEWIRE_KIND_CREDENTIAL_TEST_KEK).
kind-e2e = ["codewire-protected-store/platform-test-support"]
enrollment = [
    "codewire-credential-broker/codex-enrollment",
    "dep:codewire-proto",
    "dep:connectrpc",
    "dep:futures",
    "dep:tokio-util",
]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
buffa = { workspace = true }
codewire-access = { workspace = true }
# The workspace's existing broker edge enables local by default. This isolated
# service explicitly selects platform without changing any existing consumer.
codewire-credential-broker = { path = "../codewire-credential-broker", default-features = false, features = ["platform", "ssh-agent"] }
codewire-gateway-proto = { workspace = true }
codewire-platform-credentials = { workspace = true }
codewire-project = { workspace = true }
codewire-protected-store = { workspace = true, features = ["platform", "ssh-material"] }
codewire-proto = { workspace = true, optional = true }
codewire-server-core = { workspace = true, features = ["kubernetes-identity"] }
codewire-tls = { workspace = true }
codewire-workload-secrets = { workspace = true }
connectrpc = { workspace = true, features = ["axum"], optional = true }
futures = { workspace = true, optional = true }
http = { workspace = true }
http-body = "=1.0.1"
k8s-openapi = { workspace = true }
kube = { workspace = true }
libc = "0.2"
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
codewire-client = { workspace = true }
codewire-gateway-proto = { workspace = true }
codewire-protected-store = { workspace = true, features = ["platform-test-support"] }
flate2 = { workspace = true }
rcgen = "0.13"
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
