[package]
name = "codewire-platform-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
authors = ["Sonica"]
description = "Native SSH transport helper for Codewire clients"

[features]
default = ["ssh"]
ssh = []

[dependencies]
codewire-types = { path = "../codewire-types" }
dirs = "5"
russh = "0.61"
tokio = { version = "1", features = ["full"] }
