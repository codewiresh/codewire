[package]
name = "codewire-platform-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sonica"]
description = "Native platform helpers for Codewire clients (reqwest, russh, keyring)"

[features]
# Keep the old codewire-core adapters buildable only for the dormant legacy
# implementation. Native consumers select the standalone SSH helper instead.
default = ["legacy-core", "ssh"]
legacy-core = ["dep:codewire-core"]
ssh = []

[dependencies]
codewire-core = { path = "../codewire-core", optional = true }
codewire-types = { path = "../codewire-types" }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"
keyring = "3"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
russh = "0.61"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Platform-specific keyring backends
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
