[package]
name = "codewire-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Shared ergonomic Rust client over Codewire's generated Connect-RPC stubs."

[features]
kind-e2e = []
desktop-keyring = ["dep:keyring"]
desktop-pkce-loopback = ["dep:open", "dep:tiny_http"]

[[example]]
name = "coordinator-ingress-smoke"
required-features = ["kind-e2e"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
codewire-proto = { workspace = true, features = ["client"] }
codewire-tailnet = { workspace = true }
chrono = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
open = { workspace = true, optional = true }
tiny_http = { workspace = true, optional = true }
rustls = { version = "=0.23.40", default-features = false, features = ["ring"] }
rustls-pki-types = "=1.14.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tower = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
webpki-roots = "=1.0.7"

tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
wiremock = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, optional = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, optional = true, features = ["linux-native-sync-persistent"] }

[dev-dependencies]
tempfile = { workspace = true }
