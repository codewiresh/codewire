services:
  # Build-only source for the dashboard's named Rust toolchain context. Zero
  # replicas keep it out of `docker compose up` while Compose can still build
  # `web` without bypassing the canonical shared build base.
  rust-base:
    build:
      context: .
      dockerfile: deployments/docker/rust-base.Dockerfile
    deploy:
      replicas: 0

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: codewire-postgres
    environment:
      POSTGRES_USER: codewire
      POSTGRES_PASSWORD: codewire
      POSTGRES_DB: codewire
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codewire -d codewire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production-equivalent Rust dashboard and generated documentation.
  web:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      additional_contexts:
        codewire-rust-base: service:rust-base
    container_name: codewire-web
    ports:
      - "5173:5173"
    environment:
      CODEWIRE_PUBLIC_ORIGIN: ${CODEWIRE_PUBLIC_ORIGIN:-http://127.0.0.1:5173}
      CODEWIRE_API_ORIGIN: ${CODEWIRE_API_ORIGIN:-http://host.docker.internal:8080}
      CODEWIRE_IDENTITY_ORIGIN: ${CODEWIRE_IDENTITY_ORIGIN:-http://host.docker.internal:8080}
      CODEWIRE_BILLING_ORIGIN: ${CODEWIRE_BILLING_ORIGIN:-http://host.docker.internal:8081}
      CODEWIRE_BROWSER_API_ORIGIN: ${CODEWIRE_BROWSER_API_ORIGIN:-http://127.0.0.1:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
