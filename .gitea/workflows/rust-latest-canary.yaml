name: Rust latest-stable compatibility canary

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-latest-canary
  cancel-in-progress: true

jobs:
  latest-stable:
    name: Non-authoritative latest-stable check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://forgejo.example.invalid/noel/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: stable

      - name: Install pinned protoc
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"

      - name: Check workspace with moving latest stable
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$(scripts/ci/verify/resolve-cargo-target-dir.sh)"
          cargo +stable check --locked --workspace --all-targets
