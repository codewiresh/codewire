name: Publish Production Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical vMAJOR.MINOR.PATCH tag to recover
        required: true
        type: string
      in_job_build:
        description: Recovery only, when the trusted BuildKit builder is down. Build the release's amd64 support pair in the job instead of on the builder.
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-prod-release
  cancel-in-progress: false

enable-openid-connect: true

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  ARM64_BUILDKIT_HOST: ${{ vars.ARM64_BUILDKIT_HOST }}
  OPENBAO_ROLE: codewire-source-prod-publisher
  OPENBAO_AUDIENCE: openbao-codewire-source-prod-publisher
  OPENBAO_GHCR_ROLE: codewire-source-prod-publisher
  OPENBAO_GHCR_AUDIENCE: openbao-codewire-source-prod-publisher

jobs:
  release-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Verify canonical release tag
    runs-on: ci-lite
    outputs:
      release_tag: ${{ steps.select.outputs.release_tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Refuse recovery control outside protected main
        if: github.event_name == 'workflow_dispatch'
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/main' ]
          [ "$GITHUB_REF_NAME" = 'main' ]
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      # Recovery control stays on protected main. Release source is checked
      # out separately from the exact tag and is the only source built below.
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Select exact canonical release source
        id: select
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
          # Reads Forgejo's signature verification for the release tag.
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          selected_tag="$GITHUB_REF_NAME"
          source_dir='.'
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            selected_tag="$RECOVERY_TAG"
            source_dir='.release-source'
          fi
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${selected_tag}" \
            "refs/tags/${selected_tag}^{}")"
          remote_object_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}" '$2 == ref { print $1 }')"
          remote_peeled_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}^{}" '$2 == ref { print $1 }')"
          canonical_main_sha="$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          source_sha="$(git -C "$source_dir" rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${selected_tag}:refs/tags/${selected_tag}"
          scripts/ci/release/verify-release-tag-ref.sh \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" \
            "$GITHUB_REF_NAME" \
            "$RECOVERY_TAG" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$source_sha" \
            "$remote_object_sha" \
            "$remote_peeled_sha" \
            "$canonical_main_sha"
          printf 'release_tag=%s\n' "$selected_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  build-daemon-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Alias Existing Daemon Image
    runs-on: ci-protected
    needs: [release-selection]
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Reuse and alias daemon image
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          REQUIRE_EXISTING_SOURCE_IMAGE: '1'
        run: scripts/ci/images/build-push-image.sh daemon .release-source/deployments/docker/daemon.Dockerfile .release-source

  build-derp:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Alias Existing DERP Relay Image
    runs-on: ci-protected
    needs: [release-selection]
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Reuse and alias DERP image
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          REQUIRE_EXISTING_SOURCE_IMAGE: '1'
        run: scripts/ci/images/build-push-image.sh derp .release-source/deployments/docker/derp.Dockerfile .release-source

  build-services-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Alias Existing Rust Services Image
    runs-on: ci-protected
    needs: [release-selection]
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Reuse and alias services image
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          REQUIRE_EXISTING_SOURCE_IMAGE: '1'
        run: scripts/ci/images/build-push-image.sh services .release-source/deployments/docker/services.Dockerfile .release-source

  build-mesh-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Alias Existing Hosted Mesh Image
    runs-on: ci-protected
    needs: [release-selection]
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Reuse and alias hosted Mesh image
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          REQUIRE_EXISTING_SOURCE_IMAGE: '1'
        run: scripts/ci/images/build-push-image.sh mesh .release-source/deployments/docker/mesh.Dockerfile .release-source

  build-dashboard-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Alias Existing Dashboard Image
    runs-on: ci-protected
    needs: [release-selection]
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Reuse and alias dashboard image
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          REQUIRE_EXISTING_SOURCE_IMAGE: '1'
        run: scripts/ci/images/build-push-image.sh dashboard .release-source/apps/dashboard/Dockerfile .release-source

  # A release reuses the support pair main published for its exact source.
  # Otherwise the pair is built here exactly as support-images.yaml builds it:
  # one job per platform, linux/arm64 on the protected arm64 BuildKit node over
  # mutual TLS, never under emulation, then one join that verifies the whole
  # index before it is tagged and published.
  support-pair-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Select the release support pair
    runs-on: ci-protected
    timeout-minutes: 15
    needs: [release-selection]
    outputs:
      build: ${{ steps.select.outputs.build }}
      base_amd64_digest: ${{ steps.select.outputs.base_amd64_digest }}
      base_arm64_digest: ${{ steps.select.outputs.base_arm64_digest }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Reuse the published support pair or build it natively
        id: select
        env:
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: scripts/ci/images/release-support-pair-state.sh "$SOURCE_SHA"

  build-support-amd64:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Build the release support pair (linux/amd64)
    runs-on: ci-protected
    timeout-minutes: 120
    needs: [release-selection, support-pair-selection]
    if: ${{ needs.support-pair-selection.outputs.build == 'true' }}
    outputs:
      base_digest: ${{ steps.build.outputs.base_digest }}
      # Only a passing workspace contract reports the digest the join consumes.
      workspace_digest: ${{ steps.contract.outputs.workspace_digest }}
    env:
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a
      # secret. The arm64 leg builds on the remote node and keeps the
      # canonical snapshots.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
      # amd64 builds on the trusted BuildKit builder and fails fast when it is
      # unreachable; only the owner's in_job_build dispatch builds it here.
      CODEWIRE_IN_JOB_BUILD: ${{ (inputs.in_job_build == true || inputs.in_job_build == 'true') && '1' || '0' }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Build the linux/amd64 base and workspace by digest
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          SUPPORT_PLATFORM_BUDGET_MINUTES: '110'
          # Set only when a base index for this source is already published.
          SUPPORT_PLATFORM_BASE_DIGEST: ${{ needs.support-pair-selection.outputs.base_amd64_digest }}
        run: scripts/ci/images/build-support-platform.sh linux/amd64

      # The release tag's own contract, version-locked to its agent pins, runs
      # inside the exact image the build pushed, never on the host, before the
      # join can publish it (scripts/ci/images/run-workspace-contract-on-image.sh).
      - name: Run the workspace contract on the exact image
        id: contract
        env:
          WORKSPACE_DIGEST: ${{ steps.build.outputs.workspace_digest }}
        run: |
          set -euo pipefail
          release_source_sha="$(git -C .release-source rev-parse HEAD)"
          scripts/ci/images/run-workspace-contract-on-image.sh \
            "registry.example.invalid/codewire/workspace@$WORKSPACE_DIGEST" "$release_source_sha" \
            .release-source/scripts/ci/verify/workspace-agent-contract.sh

  build-support-arm64:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Build the release support pair (linux/arm64)
    runs-on: ci-protected
    timeout-minutes: 120
    needs: [release-selection, support-pair-selection]
    if: ${{ needs.support-pair-selection.outputs.build == 'true' }}
    outputs:
      base_digest: ${{ steps.build.outputs.base_digest }}
      workspace_digest: ${{ steps.build.outputs.workspace_digest }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      # The production publisher reads the arm64 node's client certificate.
      - name: Build the linux/arm64 base and workspace by digest
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          SUPPORT_PLATFORM_BUDGET_MINUTES: '110'
          # Set only when a base index for this source is already published.
          SUPPORT_PLATFORM_BASE_DIGEST: ${{ needs.support-pair-selection.outputs.base_arm64_digest }}
        run: scripts/ci/images/build-support-platform.sh linux/arm64

  publish-support-release-images:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # The platform digests are only pointers: each join verifies the whole
    # index (both platforms, and only those, with the release source's
    # protected provenance and an SBOM each) before it tags or reports a
    # candidate. A reused pair must already exist; this job never builds.
    name: Join and Publish Exact Support Release Images
    runs-on: ci-protected
    timeout-minutes: 30
    needs: [release-selection, support-pair-selection, build-support-amd64, build-support-arm64]
    if: ${{ always() && needs.release-selection.result == 'success' && needs.support-pair-selection.result == 'success' && (needs.support-pair-selection.outputs.build == 'false' || (needs.build-support-amd64.result == 'success' && needs.build-support-arm64.result == 'success')) }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Join and verify the base index, or reuse the published one
        id: base
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          BUILD_SUPPORT_PAIR: ${{ needs.support-pair-selection.outputs.build }}
          AMD64_DIGEST: ${{ needs.build-support-amd64.outputs.base_digest }}
          ARM64_DIGEST: ${{ needs.build-support-arm64.outputs.base_digest }}
        run: scripts/ci/images/join-release-support-image.sh base .release-source/images/base/Dockerfile .release-source/images/base

      - name: Join and verify the workspace index, or reuse the published one
        id: workspace
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          BUILD_SUPPORT_PAIR: ${{ needs.support-pair-selection.outputs.build }}
          AMD64_DIGEST: ${{ needs.build-support-amd64.outputs.workspace_digest }}
          ARM64_DIGEST: ${{ needs.build-support-arm64.outputs.workspace_digest }}
        run: scripts/ci/images/join-release-support-image.sh workspace .release-source/images/workspace/Dockerfile .release-source

      - name: Publish both support release manifests to Harbor without rebuilding
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${{ steps.base.outputs.source_sha }}" == "$SOURCE_SHA" ]]
          [[ "${{ steps.workspace.outputs.source_sha }}" == "$SOURCE_SHA" ]]
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.base.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/base \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.workspace.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/workspace \
            "$SOURCE_SHA" "$RELEASE_TAG"

      # Harbor serves every consumer; the public GHCR copy never gates release.
      - name: Mirror both support release manifests to GHCR without gating release
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.base.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/base \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.workspace.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/workspace \
            "$SOURCE_SHA" "$RELEASE_TAG"

  publish-runtime-images:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Validate and Publish Exact Runtime Bundle
    runs-on: ci-protected
    needs:
      - release-selection
      - build-daemon-image
      - build-derp
      - build-services-image
      - build-mesh-image
      - build-dashboard-image
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Validate and publish the production bundle to Harbor
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP:?}/codewire-prod-image-bundle.json"
          scripts/ci/images/image-bundle.py create \
            --environment prod \
            --source-sha "$SOURCE_SHA" \
            --output "$bundle" \
            --candidate dashboard "${{ needs.build-dashboard-image.outputs.source_sha }}" "${{ needs.build-dashboard-image.outputs.candidate_ref }}" \
            --candidate derp "${{ needs.build-derp.outputs.source_sha }}" "${{ needs.build-derp.outputs.candidate_ref }}" \
            --candidate daemon "${{ needs.build-daemon-image.outputs.source_sha }}" "${{ needs.build-daemon-image.outputs.candidate_ref }}" \
            --candidate services "${{ needs.build-services-image.outputs.source_sha }}" "${{ needs.build-services-image.outputs.candidate_ref }}" \
            --candidate mesh "${{ needs.build-mesh-image.outputs.source_sha }}" "${{ needs.build-mesh-image.outputs.candidate_ref }}"
          # Production reuses the images the protected Dev delivery built. A
          # delivery can push and then stop before signing, so every image
          # must carry its delivery signature for this exact source, with
          # main CI's verdict (dev.codewire.verified=main-ci, #2892).
          scripts/ci/images/verify-runtime-image-signatures.sh \
            "$bundle" scripts/ci/trust/codewire-runtime-signing.pub
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ needs.build-dashboard-image.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/dashboard \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ needs.build-derp.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/derp \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ needs.build-daemon-image.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/daemon \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ needs.build-services-image.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/services \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ needs.build-mesh-image.outputs.candidate_ref }}" \
            registry.example.invalid/codewire/mesh \
            "$SOURCE_SHA" "$RELEASE_TAG"

      - name: Mirror the runtime release to GHCR without gating release
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-dashboard-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/dashboard \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-derp.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/derp \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-daemon-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/daemon \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-services-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/services \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-mesh-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/mesh \
            "$SOURCE_SHA" "$RELEASE_TAG"

  dispatch-deploy-prod:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Dispatch Signed Tag to Deploy
    runs-on: ci-protected
    timeout-minutes: 15
    needs:
      - release-selection
      - publish-runtime-images
      - publish-support-release-images
    # A reused support pair skips both platform builds; the release still
    # dispatches only after every direct prerequisite succeeded.
    if: ${{ always() && needs.release-selection.result == 'success' && needs.publish-runtime-images.result == 'success' && needs.publish-support-release-images.result == 'success' }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Dispatch only the canonical signed release tag
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
        run: scripts/ci/deploy/dispatch-deploy-prod.sh "$RELEASE_TAG"
