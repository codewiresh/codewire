name: Publish Production Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical vMAJOR.MINOR.PATCH tag to recover
        required: true
        type: string
      in_job_build:
        description: Recovery only, when the trusted BuildKit builder is down. Build the release's amd64 support pair in the job instead of on the builder.
        required: false
        default: false
        type: boolean

  # A pushed, signed release tag is picked up within five minutes (owner,
  # 2026-10-23, #2892). A scheduled run is main's workflow; its first job only
  # looks, and everything after it runs only for a pending tag.
  schedule:
    - cron: '*/5 * * * *'

# No group and no cancel: Forgejo 17 neither queues a run behind another nor
# cancels one (UnlimitedConcurrency in ConfigureActionRunConcurrency). The
# first job's release turn keeps deliveries one at a time (release-turn.py;
# owner, 2026-11-12, #3013). Both halves matter:
#   - with no block, a scheduled run counts as a push event, so each 5-minute
#     tick cancels the earlier scheduled run, mid-delivery (cli-release 46578,
#     v0.4.17, 2026-11-13);
#   - with a group, every run queues behind the running one; a per-run group
#     cannot exist, as `github.run_id` is empty when Forgejo evaluates it.
# The group is present for the workflow schema; Forgejo treats an empty one as
# none.
concurrency:
  group: ''
  cancel-in-progress: false

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  ARM64_BUILDKIT_HOST: ${{ vars.ARM64_BUILDKIT_HOST }}
  CODEWIRE_IMAGE_REGISTRY: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}
  CODEWIRE_SOURCE_URL: ${{ vars.CODEWIRE_SOURCE_URL }}
  CODEWIRE_RELEASE_TAGGER: ${{ vars.CODEWIRE_RELEASE_TAGGER }}
  OPENBAO_ROLE: ${{ github.event_name == 'schedule' && 'codewire-source-prod-publisher-schedule' || 'codewire-source-prod-publisher' }}
  OPENBAO_AUDIENCE: ${{ github.event_name == 'schedule' && 'openbao-codewire-source-prod-publisher-schedule' || 'openbao-codewire-source-prod-publisher' }}
  OPENBAO_GHCR_ROLE: ${{ github.event_name == 'schedule' && 'codewire-source-prod-publisher-schedule' || 'codewire-source-prod-publisher' }}
  OPENBAO_GHCR_AUDIENCE: ${{ github.event_name == 'schedule' && 'openbao-codewire-source-prod-publisher-schedule' || 'openbao-codewire-source-prod-publisher' }}

jobs:
  # The schedule and a dispatch both start here. This job holds only the
  # job token and runs main's code: it names the release to deliver, or none,
  # and nothing after it runs without one (find-pending-release.sh).
  pending:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Find the release to deliver
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # A dispatch may wait for a release in flight (release-turn.py).
    timeout-minutes: 190
    outputs:
      release_tag: ${{ steps.find.outputs.release_tag }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # One delivery at a time, with no queue of runs that find nothing: a
      # scheduled run that finds another run looking or delivering ends here,
      # and a dispatch waits its turn (release-turn.py; owner, 2026-11-12,
      # #3013). Nothing running is ever cancelled.
      - name: Take this run's release turn
        id: turn
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/release/release-turn.py deploy-prod

      - name: Find the pending release
        if: ${{ steps.turn.outputs.turn == 'go' }}
        id: find
        env:
          GITEA_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ inputs.release_tag }}
        run: scripts/ci/release/find-pending-release.sh deploy-prod

  release-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Verify canonical release tag
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 25
    needs: [pending]
    if: ${{ needs.pending.outputs.release_tag != '' }}
    outputs:
      release_tag: ${{ steps.select.outputs.release_tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      tag_object_sha: ${{ steps.select.outputs.tag_object_sha }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Refuse release control outside protected main
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/main' ]
          [ "$GITHUB_REF_NAME" = 'main' ]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      # Recovery control stays on protected main. Release source is checked
      # out separately from the exact tag and is the only source built below.
      - name: Select exact canonical release source
        id: select
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.release_tag }}
          # Reads Forgejo's signature verification for the release tag.
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag is verified from main's checkout before anything checks
          # out or runs its content: it must name a commit on main and carry
          # its own signature by the release tagger's account. Fetching it
          # only adds its objects; nothing here checks it out.
          selected_tag="$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${selected_tag}" \
            "refs/tags/${selected_tag}^{}")"
          remote_object_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}" '$2 == ref { print $1 }')"
          remote_peeled_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}^{}" '$2 == ref { print $1 }')"
          canonical_main_sha="$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          source_sha="$remote_peeled_sha"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${selected_tag}:refs/tags/${selected_tag}"
          scripts/ci/release/verify-release-tag-ref.sh \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" \
            "$GITHUB_REF_NAME" \
            "$selected_tag" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$source_sha" \
            "$remote_object_sha" \
            "$remote_peeled_sha" \
            "$canonical_main_sha"
          # Release selection composes proofs (#2892):
          # - the tag's own signature, by the release tagger's account:
          #   verify-release-tag-ref.sh, above;
          # - the workspace image the release ships: the pin check;
          # - main CI and the dry run of the exact commit, and Kind while
          #   RELEASE_REQUIRES_KIND in the receipt says so (waived, owner,
          #   2026-10-25, #3013): the receipt's source evidence;
          # - Dev acceptance: promote-prod, which dispatch-deploy-prod.sh waits
          #   for and cli-release requires.
          python3 scripts/ci/images/workspace-image-pin.py check --release --commit "$source_sha"
          receipt="$(PREFLIGHT_RELEASE_TAG_REF="refs/tags/${selected_tag}" \
            PREFLIGHT_RELEASE_TAG_OBJECT_SHA="$remote_object_sha" \
            PREFLIGHT_PUSH_REMOTE_NAME=origin \
            scripts/ci/receipts/verify-release-tag-receipt.sh --source-evidence)"
          printf '%s\n' "$receipt"
          grep -Fxq 'release_tag_receipt=accepted' <<<"$receipt"
          grep -Fxq 'release_tag_scope=source-evidence' <<<"$receipt"
          printf 'release_tag=%s\n' "$selected_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tag_object_sha=%s\n' "$remote_object_sha" >> "$GITHUB_OUTPUT"

  # One protected job carries the common release end to end: it selects the
  # support pair, aliases the five runtime images side by side, validates and
  # publishes the runtime bundle and, when the release reuses the support pair
  # main published, publishes that pair and delivers the release to Production.
  # Every protected job first waits for a runner, so a release uses as few as
  # its trust boundaries allow (#3246). Only a support pair that must be built
  # takes more: the native platform builds run release-source code and stay in
  # their own jobs, away from the deploy credential, and finish-built-release
  # then delivers the release.
  publish-release:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Publish the release and deliver it to Production
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    # Aliases and publication take minutes; the delivery then waits up to 45
    # minutes for promote-prod's verdict, so the work keeps 45 of its own.
    timeout-minutes: 90
    needs: [release-selection]
    outputs:
      build: ${{ steps.pair.outputs.build }}
      base_amd64_digest: ${{ steps.pair.outputs.base_amd64_digest }}
      base_arm64_digest: ${{ steps.pair.outputs.base_arm64_digest }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      # An old release run's jobs can be rerun, keeping that run's selection;
      # they publish only while the tag is still the newest release (#2892).
      - name: Refuse a release that is no longer the newest
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          GITEA_TOKEN: ${{ github.token }}
        run: scripts/ci/release/require-current-release.sh "$RELEASE_TAG"

      # A release reuses the support pair main published for its exact source.
      # Otherwise the pair is built natively, exactly as support-images.yaml
      # builds it: one job per platform, linux/arm64 on the protected arm64
      # BuildKit node over mutual TLS, never under emulation.
      - name: Reuse the published support pair or build it natively
        id: pair
        env:
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: scripts/ci/images/release-support-pair-state.sh "$SOURCE_SHA"

      - name: Alias the five existing runtime images side by side
        id: alias
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          REQUIRE_EXISTING_SOURCE_IMAGE: '1'
        run: scripts/ci/release/alias-release-images.sh

      - name: Validate and publish the production bundle to Harbor
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP:?}/codewire-prod-image-bundle.json"
          scripts/ci/images/image-bundle.py create \
            --environment prod \
            --source-sha "$SOURCE_SHA" \
            --output "$bundle" \
            --candidate dashboard "${{ steps.alias.outputs.dashboard_source_sha }}" "${{ steps.alias.outputs.dashboard_candidate_ref }}" \
            --candidate derp "${{ steps.alias.outputs.derp_source_sha }}" "${{ steps.alias.outputs.derp_candidate_ref }}" \
            --candidate daemon "${{ steps.alias.outputs.daemon_source_sha }}" "${{ steps.alias.outputs.daemon_candidate_ref }}" \
            --candidate services "${{ steps.alias.outputs.services_source_sha }}" "${{ steps.alias.outputs.services_candidate_ref }}" \
            --candidate mesh "${{ steps.alias.outputs.mesh_source_sha }}" "${{ steps.alias.outputs.mesh_candidate_ref }}"
          # Production reuses the images the protected Dev delivery built. A
          # delivery can push and then stop before signing, so every image
          # must carry its delivery signature for this exact source, with
          # main CI's verdict (dev.codewire.verified=main-ci, #2892).
          scripts/ci/images/verify-runtime-image-signatures.sh \
            "$bundle" scripts/ci/trust/codewire-runtime-signing.pub
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.alias.outputs.dashboard_candidate_ref }}" \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/dashboard" \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.alias.outputs.derp_candidate_ref }}" \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/derp" \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.alias.outputs.daemon_candidate_ref }}" \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/daemon" \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.alias.outputs.services_candidate_ref }}" \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/services" \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.alias.outputs.mesh_candidate_ref }}" \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/mesh" \
            "$SOURCE_SHA" "$RELEASE_TAG"

      # Harbor serves every consumer; the public GHCR copy never gates release.
      - name: Mirror the runtime release to GHCR without gating release
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.alias.outputs.dashboard_candidate_ref }}" \
            ghcr.io/codewiresh/dashboard \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.alias.outputs.derp_candidate_ref }}" \
            ghcr.io/codewiresh/derp \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.alias.outputs.daemon_candidate_ref }}" \
            ghcr.io/codewiresh/daemon \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.alias.outputs.services_candidate_ref }}" \
            ghcr.io/codewiresh/services \
            "$SOURCE_SHA" "$RELEASE_TAG"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.alias.outputs.mesh_candidate_ref }}" \
            ghcr.io/codewiresh/mesh \
            "$SOURCE_SHA" "$RELEASE_TAG"

      - name: Publish the reused support pair and deliver the release to Production
        if: ${{ steps.pair.outputs.build == 'false' }}
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          BUILD_SUPPORT_PAIR: 'false'
          # The commit the reused pair was built from: the source, or the
          # earlier commit main aliased it from (#3504), which the pair step
          # proved has the same base and workspace inputs.
          SUPPORT_PROVENANCE_REVISION: ${{ steps.pair.outputs.provenance_revision }}
        run: scripts/ci/release/finish-prod-release.sh

  build-support-amd64:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Build the release support pair (linux/amd64)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 120
    needs: [release-selection, publish-release]
    if: ${{ needs.publish-release.outputs.build == 'true' }}
    outputs:
      base_digest: ${{ steps.build.outputs.base_digest }}
      # Only a passing workspace contract reports the digest the join consumes.
      workspace_digest: ${{ steps.contract.outputs.workspace_digest }}
    env:
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a
      # secret. The arm64 leg reads the same cache over the Tailnet.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
      # amd64 builds on the trusted BuildKit builder and fails fast when it is
      # unreachable; only the owner's in_job_build dispatch builds it here.
      CODEWIRE_IN_JOB_BUILD: ${{ (inputs.in_job_build == true || inputs.in_job_build == 'true') && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Build the linux/amd64 base and workspace by digest
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          SUPPORT_PLATFORM_BUDGET_MINUTES: '110'
          # Set only when a base index for this source is already published.
          SUPPORT_PLATFORM_BASE_DIGEST: ${{ needs.publish-release.outputs.base_amd64_digest }}
        run: scripts/ci/images/build-support-platform.sh linux/amd64

      # The release tag's own contract, version-locked to its agent pins, runs
      # inside the exact image the build pushed, never on the host, before the
      # join can publish it (scripts/ci/images/run-workspace-contract-on-image.sh).
      - name: Run the workspace contract on the exact image
        id: contract
        env:
          WORKSPACE_DIGEST: ${{ steps.build.outputs.workspace_digest }}
        run: |
          set -euo pipefail
          release_source_sha="$(git -C .release-source rev-parse HEAD)"
          scripts/ci/images/run-workspace-contract-on-image.sh \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/workspace@$WORKSPACE_DIGEST" "$release_source_sha" \
            .release-source/scripts/ci/verify/workspace-agent-contract.sh

  build-support-arm64:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Build the release support pair (linux/arm64)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 120
    needs: [release-selection, publish-release]
    if: ${{ needs.publish-release.outputs.build == 'true' }}
    outputs:
      base_digest: ${{ steps.build.outputs.base_digest }}
      workspace_digest: ${{ steps.build.outputs.workspace_digest }}
    env:
      # The same apt snapshot cache as the amd64 leg, passed to BuildKit as a
      # secret. The remote ci-arm64-builder node is outside the cluster, so it
      # reaches the cache on the Tailnet front door, the one address and port
      # its Tailnet identity is admitted to besides the registry. The cache
      # keeps serving stored snapshots when upstream fails; APT still verifies
      # each signed InRelease and every package hash, and falls back to the
      # canonical snapshots when the cache is unavailable.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://10.47.0.10:8080
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      # The production publisher reads the arm64 node's client certificate.
      - name: Build the linux/arm64 base and workspace by digest
        id: build
        env:
          CODEWIRE_RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CODEWIRE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          SUPPORT_PLATFORM_BUDGET_MINUTES: '110'
          # Set only when a base index for this source is already published.
          SUPPORT_PLATFORM_BASE_DIGEST: ${{ needs.publish-release.outputs.base_arm64_digest }}
        run: scripts/ci/images/build-support-platform.sh linux/arm64

  # A release whose support pair had to be built joins the two platform
  # digests the builds verified, publishes the pair and delivers the release.
  finish-built-release:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Publish the built support pair and deliver the release to Production
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    # The join and publication take minutes; the delivery then waits up to 45
    # minutes for promote-prod's verdict.
    timeout-minutes: 65
    needs: [release-selection, publish-release, build-support-amd64, build-support-arm64]
    if: ${{ always() && needs.release-selection.result == 'success' && needs.publish-release.result == 'success' && needs.publish-release.outputs.build == 'true' && needs.build-support-amd64.result == 'success' && needs.build-support-arm64.result == 'success' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      # An old release run's jobs can be rerun, keeping that run's selection;
      # they publish only while the tag is still the newest release (#2892).
      - name: Refuse a release that is no longer the newest
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          GITEA_TOKEN: ${{ github.token }}
        run: scripts/ci/release/require-current-release.sh "$RELEASE_TAG"

      - name: Publish the built support pair and deliver the release to Production
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CODEWIRE_SOURCE_DIR: .release-source
          BUILD_SUPPORT_PAIR: 'true'
          BASE_AMD64_DIGEST: ${{ needs.build-support-amd64.outputs.base_digest }}
          BASE_ARM64_DIGEST: ${{ needs.build-support-arm64.outputs.base_digest }}
          WORKSPACE_AMD64_DIGEST: ${{ needs.build-support-amd64.outputs.workspace_digest }}
          WORKSPACE_ARM64_DIGEST: ${{ needs.build-support-arm64.outputs.workspace_digest }}
        run: scripts/ci/release/finish-prod-release.sh
