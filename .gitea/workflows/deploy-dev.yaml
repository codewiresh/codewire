# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; runner profiles, job-scoped OIDC, and server-side integrations enforce capabilities.
name: Build and deliver Dev

on:
  push:
    branches: [main]

# Dev runs only commits whose main CI passed (#2892). This push run builds and
# pushes the runtime images by digest, unsigned. Its publish job signs and
# dispatches them only after main CI's verdict for this exact commit, and only
# while the commit descends from the source Dev runs; when main CI finishes
# later, its final job reruns that publish job. One Dev delivery is in flight
# at a time and always finishes; at most one waits behind it, the newest, and
# a newer commit replaces the waiting one (owner, 2026-11-10, #4071; replaces
# the 2026-10-21 and 2026-10-24 cancel rules). The "Dev delivery turn" job
# decides; no delivery is ever cancelled. A run still waiting near its runner's
# 25-minute cap defers, and the delivery in flight hands the turn on when it
# ends (#4476). Runs of different commits never queue
# behind each other through concurrency: each commit has its own group, so
# only a rerun of the same commit queues. Leaving the block out would cancel on
# every push.
concurrency:
  group: deploy-dev-${{ github.sha }}
  cancel-in-progress: false

# Site configuration from repository Actions variables (docs/dev/CI-CONFIGURATION.md).
env:
  CODEWIRE_IMAGE_REGISTRY: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}
  CODEWIRE_SOURCE_URL: ${{ vars.CODEWIRE_SOURCE_URL }}
  CODEWIRE_R2_CACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
  CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}

jobs:
  deploy-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    # Its OIDC token mints the Deploy integration (write:repository on
    # codewire/deploy) to read Dev's baseline, and the publisher role would
    # accept it too, so it runs only on the trusted runner (#3758).
    name: Deploy selection
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 15
    outputs:
      deploy_dev: ${{ steps.select.outputs.deploy_dev }}
      reason: ${{ steps.select.outputs.reason }}
      matched_categories: ${{ steps.select.outputs.matched_categories }}
      dashboard_image_state: ${{ steps.select.outputs.dashboard_image_state }}
      daemon_image_state: ${{ steps.select.outputs.daemon_image_state }}
      derp_image_state: ${{ steps.select.outputs.derp_image_state }}
      services_image_state: ${{ steps.select.outputs.services_image_state }}
      mesh_image_state: ${{ steps.select.outputs.mesh_image_state }}
      baseline_sha: ${{ steps.select.outputs.baseline_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      head_tree: ${{ steps.select.outputs.head_tree }}
      ci_plan_sha256: ${{ steps.select.outputs.ci_plan_sha256 }}
      ci_policy_sha256: ${{ steps.select.outputs.ci_policy_sha256 }}
      baseline_valid: ${{ steps.select.outputs.baseline_valid }}
      dev_release_tree_state: ${{ steps.select.outputs.dev_release_tree_state }}
      egress_image_fingerprint: ${{ steps.select.outputs.egress_image_fingerprint }}
      pod_runtime_image_fingerprint: ${{ steps.select.outputs.pod_runtime_image_fingerprint }}
      kvm_device_plugin_image_fingerprint: ${{ steps.select.outputs.kvm_device_plugin_image_fingerprint }}
      workspace_disk_image_fingerprint: ${{ steps.select.outputs.workspace_disk_image_fingerprint }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify sealed Rust toolchain
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Resolve untrusted deployed Dev source
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/codewire-deployed-source-candidate.json"
          scripts/ci/deploy/resolve-deployed-source.sh "$candidate" "$GITHUB_SHA"

      - name: Plan and select atomic Dev deployment
        id: select
        run: |
          set -euo pipefail
          plan="$(mktemp)"
          trap 'rm -f "$plan"' EXIT
          python3 scripts/ci/plan/planner.py \
            --repository . \
            --target-base "$GITHUB_SHA" \
            --head "$GITHUB_SHA" \
            --trusted-policy "$GITHUB_SHA" \
            --deployed-source-candidate "$RUNNER_TEMP/codewire-deployed-source-candidate.json" \
            --output "$plan"
          if jq -e '.degraded_reasons | length > 0' "$plan" >/dev/null; then
            echo 'Runtime artifact planner degraded; the atomic set remains selected:'
            jq -c '.degraded_reasons' "$plan"
          fi
          python3 scripts/ci/plan/apply-deploy-plan.py \
            --plan "$plan" \
            --head "$GITHUB_SHA" \
            --head-tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

      - name: Remove untrusted deployed-source candidate
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/codewire-deployed-source-candidate.json"

  # One delivery in flight at a time; the newest waits, and a newer commit
  # replaces the waiting one (owner, 2026-11-10, #4071). This only waits,
  # defers or steps aside; it never stops another run, and anything unreadable
  # lets this run build.
  dev-delivery-turn:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job reads run state with the job token only.
    name: Dev delivery turn
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # The light runner's own cap: the turn defers after 20 minutes of waiting,
    # and the delivery in flight hands the turn on (#4476).
    timeout-minutes: 25
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      turn: ${{ steps.turn.outputs.turn }}
    steps:
      # The script reads run state only; it orders runs by run ID, not ancestry.
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for this delivery's turn
        id: turn
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/deploy/wait-for-dev-delivery-turn.py

  # The runtime set builds in two protected halves on separate workers: the
  # daemon's static CW producer is the longest single build, so it runs beside
  # the service images instead of before them. The halves share no image, so
  # they never race for an immutable source tag; publish-runtime-images joins
  # them by the exact digests they report.
  build-service-images:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the service runtime images
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 110
    needs: [deploy-selection, dev-delivery-turn]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    outputs:
      dashboard_candidate_ref: ${{ steps.build.outputs.dashboard_candidate_ref }}
      dashboard_built_from: ${{ steps.build.outputs.dashboard_built_from }}
      derp_candidate_ref: ${{ steps.build.outputs.derp_candidate_ref }}
      derp_built_from: ${{ steps.build.outputs.derp_built_from }}
      services_candidate_ref: ${{ steps.build.outputs.services_candidate_ref }}
      services_built_from: ${{ steps.build.outputs.services_built_from }}
      mesh_candidate_ref: ${{ steps.build.outputs.mesh_candidate_ref }}
      mesh_built_from: ${{ steps.build.outputs.mesh_built_from }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      # The images build on the trusted BuildKit builder and fail fast when it
      # is unreachable. Only the owner's recovery builds them in this job: the
      # repository variable CODEWIRE_IN_JOB_BUILD_SHA naming this exact commit,
      # then a rerun of all jobs (this run passes no artifacts between jobs).
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The protected R2 compiler cache is best effort: when this job cannot
      # obtain its protected credential, the selector chooses the job-local
      # cache, and run-rust-build.sh compiles locally on any R2 outage.
      - name: Select the protected R2 compiler cache
        id: compiler-cache
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build and push the service runtime images
        id: build
        env:
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
          # Trusted planner change context for selective rebuilds. A family
          # the planner certifies unaffected carries its exact deployed
          # digest forward instead of rebuilding. The gate stays 0 until
          # codewire/deploy accepts carried provenance (issue #2353); every
          # ambiguity fails closed to a full source build.
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_IMAGE_STATE_DASHBOARD: ${{ needs.deploy-selection.outputs.dashboard_image_state }}
          CODEWIRE_IMAGE_STATE_DERP: ${{ needs.deploy-selection.outputs.derp_image_state }}
          CODEWIRE_IMAGE_STATE_SERVICES: ${{ needs.deploy-selection.outputs.services_image_state }}
          CODEWIRE_IMAGE_STATE_MESH: ${{ needs.deploy-selection.outputs.mesh_image_state }}
        run: scripts/ci/images/build-push-runtime-images.sh services

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

  build-daemon-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the daemon runtime image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 110
    needs: [deploy-selection, dev-delivery-turn]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    outputs:
      daemon_candidate_ref: ${{ steps.build.outputs.daemon_candidate_ref }}
      daemon_built_from: ${{ steps.build.outputs.daemon_built_from }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      # The images build on the trusted BuildKit builder and fail fast when it
      # is unreachable. Only the owner's recovery builds them in this job: the
      # repository variable CODEWIRE_IN_JOB_BUILD_SHA naming this exact commit,
      # then a rerun of all jobs (this run passes no artifacts between jobs).
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The protected R2 compiler cache is best effort: when this job cannot
      # obtain its protected credential, the selector chooses the job-local
      # cache, and run-rust-build.sh compiles locally on any R2 outage.
      - name: Select the protected R2 compiler cache
        id: compiler-cache
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build and push the daemon runtime image
        id: build
        env:
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
          # Carry-forward stays gated (issue #2353); see the service images.
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_IMAGE_STATE_DAEMON: ${{ needs.deploy-selection.outputs.daemon_image_state }}
        run: scripts/ci/images/build-push-runtime-images.sh daemon

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

  # The only job that signs or dispatches. It runs after both build halves,
  # and again whenever main CI's final job reruns it for this commit
  # (rerun-dev-publish.py); a rerun keeps this push run's event and actor,
  # which the publisher identity requires, and its build jobs' outputs.
  publish-runtime-images:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Publish the exact runtime image set
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 45
    needs: [deploy-selection, dev-delivery-turn, build-service-images, build-daemon-image]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      OPENBAO_GHCR_ROLE: codewire-source-dev-publisher
      OPENBAO_GHCR_AUDIENCE: openbao-codewire-source-dev-publisher
    steps:
      # The descent checks compare this commit with Dev's source in main's
      # history.
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Main CI's verdict for this exact commit, from its own ci.yaml push run
      # on main (main-ci-verdict.py). Waiting for it, a red verdict, a
      # superseded run or no run at all signs nothing and still succeeds; an
      # unreadable verdict fails this job and signs nothing.
      - name: Read main CI's verdict for this commit
        id: verdict
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/plan/main-ci-verdict.py check \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --github-output

      # Each candidate is the exact digest its build job's Bake pushed, passed
      # through this run's job outputs. Publication confirms that each
      # source-SHA tag names that digest; it never takes a digest from a tag.
      - name: Publish the complete runtime set to Harbor without rebuilding
        id: publish
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP:?}/codewire-dev-image-bundle.json"
          scripts/ci/images/image-bundle.py create \
            --source-sha "$GITHUB_SHA" \
            --output "$bundle" \
            --candidate dashboard "$GITHUB_SHA" "${{ needs.build-service-images.outputs.dashboard_candidate_ref }}" \
            --candidate derp "$GITHUB_SHA" "${{ needs.build-service-images.outputs.derp_candidate_ref }}" \
            --candidate daemon "$GITHUB_SHA" "${{ needs.build-daemon-image.outputs.daemon_candidate_ref }}" \
            --candidate services "$GITHUB_SHA" "${{ needs.build-service-images.outputs.services_candidate_ref }}" \
            --candidate mesh "$GITHUB_SHA" "${{ needs.build-service-images.outputs.mesh_candidate_ref }}"
          # The build jobs pushed all five images to Harbor, the registry every
          # deployment pulls from. Confirm each source-SHA tag and prove each
          # digest with the consumer pull identity. The public GHCR mirror
          # follows delivery and never gates it.
          scripts/ci/images/publish-image-to-harbor.sh \
            --runtime-bundle "$bundle"
          # Sandboxes default to the published workspace pin; keep it in
          # Harbor before Dev references it. A pin Harbor lacks is imported
          # once from the public mirror.
          scripts/ci/images/publish-image-to-harbor.sh --pinned-defaults

      # A verified commit delivers even after main moved on, as long as it
      # moves Dev forward; one Dev already runs or has passed signs nothing,
      # so a rerun of an older run signs only while Dev is still behind it.
      - name: Require this commit to move Dev forward before signing
        id: descent-before-signing
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        run: scripts/ci/deploy/require-dev-descent.sh signing

      # The signature records main CI's verdict: dev.codewire.verified=main-ci
      # and the verifying ci.yaml run, which deploy-prod requires.
      - name: Sign the exact runtime set
        if: ${{ steps.descent-before-signing.outputs.deliver == 'true' }}
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_BUILT_FROM_DASHBOARD: ${{ needs.build-service-images.outputs.dashboard_built_from }}
          CODEWIRE_BUILT_FROM_DERP: ${{ needs.build-service-images.outputs.derp_built_from }}
          CODEWIRE_BUILT_FROM_DAEMON: ${{ needs.build-daemon-image.outputs.daemon_built_from }}
          CODEWIRE_BUILT_FROM_SERVICES: ${{ needs.build-service-images.outputs.services_built_from }}
          CODEWIRE_BUILT_FROM_MESH: ${{ needs.build-service-images.outputs.mesh_built_from }}
        run: |
          scripts/ci/images/sign-runtime-image-set.sh \
            "${RUNNER_TEMP:?}/codewire-dev-image-bundle.json" \
            scripts/ci/trust/codewire-runtime-signing.pub

      # Dev never moves backwards: a descendant may have reached Dev while
      # this set was signed. promote-dev checks descent again.
      - name: Require this commit to move Dev forward before dispatch
        id: descent-before-dispatch
        if: ${{ steps.descent-before-signing.outputs.deliver == 'true' }}
        run: scripts/ci/deploy/require-dev-descent.sh dispatching

      - name: Dispatch only the canonical source SHA
        id: dispatch
        if: ${{ steps.descent-before-dispatch.outputs.deliver == 'true' }}
        run: scripts/ci/deploy/dispatch-deploy-dev.sh "${GITHUB_SHA:?}"

      # The public GHCR mirror is best effort: Dev already pulls from Harbor,
      # so an unreachable ghcr.io must never block or fail delivery.
      - name: Mirror the runtime set to GHCR without gating delivery
        id: ghcr-mirror
        if: ${{ steps.dispatch.outcome == 'success' }}
        continue-on-error: true
        run: |
          scripts/ci/images/publish-image-to-ghcr.sh \
            --runtime-bundle "${RUNNER_TEMP:?}/codewire-dev-image-bundle.json"

      - name: Sign the GHCR mirror without gating delivery
        if: ${{ steps.ghcr-mirror.outcome == 'success' }}
        continue-on-error: true
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_BUILT_FROM_DASHBOARD: ${{ needs.build-service-images.outputs.dashboard_built_from }}
          CODEWIRE_BUILT_FROM_DERP: ${{ needs.build-service-images.outputs.derp_built_from }}
          CODEWIRE_BUILT_FROM_DAEMON: ${{ needs.build-daemon-image.outputs.daemon_built_from }}
          CODEWIRE_BUILT_FROM_SERVICES: ${{ needs.build-service-images.outputs.services_built_from }}
          CODEWIRE_BUILT_FROM_MESH: ${{ needs.build-service-images.outputs.mesh_built_from }}
        run: |
          scripts/ci/images/sign-runtime-image-set.sh --ghcr-mirror \
            "${RUNNER_TEMP:?}/codewire-dev-image-bundle.json" \
            scripts/ci/trust/codewire-runtime-signing.pub

      # The OS-package scan of each published runtime digest (codewire#5402,
      # step 1: scan only). It runs after the rollout is dispatched, so it
      # delays nothing, and it blocks nothing yet: a finding or a failure is
      # read from the run and reported on the issue. The job image's own
      # supplychain (scan-runtime-image-os.sh) reads the pushed digest from
      # Harbor with this job's pull-only identity, written to a private
      # registry config for these steps and shredded after them.
      - name: Prepare the image scan's Harbor pull login
        id: scan-auth
        if: ${{ steps.dispatch.outcome == 'success' }}
        continue-on-error: true
        env:
          SERVICES_REF: ${{ steps.publish.outputs.services_harbor_ref }}
        run: scripts/ci/images/image-scan-login.sh prepare "$SERVICES_REF"

      - name: Scan the dashboard image's OS packages (report only)
        if: ${{ steps.scan-auth.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCKER_CONFIG: ${{ steps.scan-auth.outputs.docker_config }}
          IMAGE: ${{ steps.publish.outputs.dashboard_harbor_ref }}
        run: scripts/ci/images/scan-runtime-image-os.sh dashboard "$IMAGE"

      - name: Scan the derp image's OS packages (report only)
        if: ${{ steps.scan-auth.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCKER_CONFIG: ${{ steps.scan-auth.outputs.docker_config }}
          IMAGE: ${{ steps.publish.outputs.derp_harbor_ref }}
        run: scripts/ci/images/scan-runtime-image-os.sh derp "$IMAGE"

      - name: Scan the daemon image's OS packages (report only)
        if: ${{ steps.scan-auth.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCKER_CONFIG: ${{ steps.scan-auth.outputs.docker_config }}
          IMAGE: ${{ steps.publish.outputs.daemon_harbor_ref }}
        run: scripts/ci/images/scan-runtime-image-os.sh daemon "$IMAGE"

      - name: Scan the services image's OS packages (report only)
        if: ${{ steps.scan-auth.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCKER_CONFIG: ${{ steps.scan-auth.outputs.docker_config }}
          IMAGE: ${{ steps.publish.outputs.services_harbor_ref }}
        run: scripts/ci/images/scan-runtime-image-os.sh services "$IMAGE"

      - name: Scan the mesh image's OS packages (report only)
        if: ${{ steps.scan-auth.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCKER_CONFIG: ${{ steps.scan-auth.outputs.docker_config }}
          IMAGE: ${{ steps.publish.outputs.mesh_harbor_ref }}
        run: scripts/ci/images/scan-runtime-image-os.sh mesh "$IMAGE"

      - name: Remove the image scan's Harbor pull login
        if: ${{ always() && steps.scan-auth.outputs.docker_config != '' }}
        env:
          SCAN_DOCKER_CONFIG: ${{ steps.scan-auth.outputs.docker_config }}
        run: scripts/ci/images/image-scan-login.sh remove "$SCAN_DOCKER_CONFIG"

  # cw-egress is built and signed here but never delivered: only a merged pin
  # in deployments/k8s/egress decides what runs (private-docs
  # designs/hosted-egress.md, "The image and its deployment"). Its build starts
  # once the publish job has finished or been skipped, so it never competes
  # with a delivery for the trusted builder, and nothing on the delivery path
  # needs either job. It builds only when no signed image of its inputs'
  # fingerprint exists.
  build-egress-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the cw-egress image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 110
    needs: [deploy-selection, publish-runtime-images]
    if: ${{ always() && needs.deploy-selection.result == 'success' && needs.deploy-selection.outputs.egress_image_fingerprint != '' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.egress_candidate_ref }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      CODEWIRE_EGRESS_FINGERPRINT: ${{ needs.deploy-selection.outputs.egress_image_fingerprint }}
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # A fp- tag exists only once a build of these inputs was signed
      # (egress-image-tag.sh), so a present one means there is nothing to build.
      - name: Look for a signed image of these inputs
        id: existing
        run: |
          set -euo pipefail
          state="$(scripts/ci/images/egress-image-tag.sh exists "$CODEWIRE_EGRESS_FINGERPRINT")"
          echo "cw-egress image for fingerprint $CODEWIRE_EGRESS_FINGERPRINT: $state"
          echo "state=$state" >>"$GITHUB_OUTPUT"

      - name: Select the protected R2 compiler cache
        id: compiler-cache
        if: ${{ steps.existing.outputs.state == 'absent' }}
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build and push the cw-egress image
        id: build
        if: ${{ steps.existing.outputs.state == 'absent' }}
        env:
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
        run: scripts/ci/images/build-push-runtime-images.sh egress

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

  # Signs only the digest this run's build reported, after main CI's verdict
  # for this exact commit, as the publish job does. A verdict that comes later
  # reaches it when main CI's last job reruns it (rerun-dev-publish.py).
  sign-egress-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Sign the cw-egress image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [deploy-selection, build-egress-image]
    if: ${{ always() && needs.build-egress-image.result == 'success' && needs.build-egress-image.outputs.candidate_ref != '' }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read main CI's verdict for this commit
        id: verdict
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/plan/main-ci-verdict.py check \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --github-output

      # Signs nothing a tag points at: only the build's reported digest, and
      # only while this commit's source tag still names it.
      - name: Sign the exact cw-egress image this run built
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_EGRESS_CANDIDATE: ${{ needs.build-egress-image.outputs.candidate_ref }}
          CODEWIRE_EGRESS_FINGERPRINT: ${{ needs.deploy-selection.outputs.egress_image_fingerprint }}
        run: |
          set -euo pipefail
          source_digest="$(scripts/ci/images/egress-image-tag.sh source-digest "$GITHUB_SHA")"
          [[ "$source_digest" == "${CODEWIRE_EGRESS_CANDIDATE##*@}" ]] || {
            echo "::error::the cw-egress source tag names $source_digest, not the digest this run built" >&2
            exit 1
          }
          scripts/ci/images/sign-runtime-image-set.sh --egress "$CODEWIRE_EGRESS_CANDIDATE" \
            scripts/ci/trust/codewire-runtime-signing.pub
          scripts/ci/images/egress-image-tag.sh tag "$CODEWIRE_EGRESS_CANDIDATE" "$CODEWIRE_EGRESS_FINGERPRINT"

  # The /dev/kvm device plugin's own image (#6202) is built and signed here and
  # never delivered, exactly as cw-egress is: only a merged pin in
  # deployments/k8s/kvm-device-plugin/image.digest decides what a deployment
  # runs. Its fingerprint is the plugin crate's own closure and its Dockerfile,
  # so it builds rarely, and only on the run that holds the delivery turn, so
  # a deferred or replaced commit never builds.
  build-kvm-device-plugin-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the kvm device plugin image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 60
    needs: [deploy-selection, dev-delivery-turn, publish-runtime-images]
    if: ${{ always() && needs.deploy-selection.result == 'success' && needs.dev-delivery-turn.result == 'success' && needs.dev-delivery-turn.outputs.turn == 'go' && needs.deploy-selection.outputs.kvm_device_plugin_image_fingerprint != '' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.kvm-device-plugin_candidate_ref }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      CODEWIRE_KVM_DEVICE_PLUGIN_FINGERPRINT: ${{ needs.deploy-selection.outputs.kvm_device_plugin_image_fingerprint }}
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # A fp- tag exists only once a build of these inputs was signed
      # (kvm-device-plugin-image-tag.sh), so a present one means there is
      # nothing to build.
      - name: Look for a signed image of these inputs
        id: existing
        run: |
          set -euo pipefail
          state="$(scripts/ci/images/kvm-device-plugin-image-tag.sh exists "$CODEWIRE_KVM_DEVICE_PLUGIN_FINGERPRINT")"
          echo "kvm device plugin image for fingerprint $CODEWIRE_KVM_DEVICE_PLUGIN_FINGERPRINT: $state"
          echo "state=$state" >>"$GITHUB_OUTPUT"

      - name: Build and push the kvm device plugin image
        id: build
        if: ${{ steps.existing.outputs.state == 'absent' }}
        # No protected R2 compiler cache: the plugin's closure is small and
        # builds rarely, so the job holds no cache credential.
        env:
          CODEWIRE_SCCACHE_MODE: local
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
        run: scripts/ci/images/build-push-runtime-images.sh kvm-device-plugin

  # Signs only the digest this run's build reported, after main CI's verdict
  # for this exact commit, as sign-egress-image does.
  sign-kvm-device-plugin-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Sign the kvm device plugin image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [deploy-selection, build-kvm-device-plugin-image]
    if: ${{ always() && needs.build-kvm-device-plugin-image.result == 'success' && needs.build-kvm-device-plugin-image.outputs.candidate_ref != '' }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read main CI's verdict for this commit
        id: verdict
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/plan/main-ci-verdict.py check \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --github-output

      # Signs nothing a tag points at: only the build's reported digest, and
      # only while this commit's source tag still names it.
      - name: Sign the exact kvm device plugin image this run built
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_KVM_DEVICE_PLUGIN_CANDIDATE: ${{ needs.build-kvm-device-plugin-image.outputs.candidate_ref }}
          CODEWIRE_KVM_DEVICE_PLUGIN_FINGERPRINT: ${{ needs.deploy-selection.outputs.kvm_device_plugin_image_fingerprint }}
        run: |
          set -euo pipefail
          source_digest="$(scripts/ci/images/kvm-device-plugin-image-tag.sh source-digest "$GITHUB_SHA")"
          [[ "$source_digest" == "${CODEWIRE_KVM_DEVICE_PLUGIN_CANDIDATE##*@}" ]] || {
            echo "::error::the kvm device plugin source tag names $source_digest, not the digest this run built" >&2
            exit 1
          }
          scripts/ci/images/sign-runtime-image-set.sh --kvm-device-plugin "$CODEWIRE_KVM_DEVICE_PLUGIN_CANDIDATE" \
            scripts/ci/trust/codewire-runtime-signing.pub
          scripts/ci/images/kvm-device-plugin-image-tag.sh tag "$CODEWIRE_KVM_DEVICE_PLUGIN_CANDIDATE" "$CODEWIRE_KVM_DEVICE_PLUGIN_FINGERPRINT"

  # The standard pod-runtime image (#5602) is built and signed here and never
  # delivered, exactly as cw-egress is: only a merged pin in
  # deployments/k8s/orchestration/pod-runtime-image.digest decides what a
  # deployment runs. It builds only on the run that holds the delivery turn,
  # once its publish job has finished or been skipped, so a deferred or
  # replaced commit never builds and nothing on the delivery path needs it.
  # Its local runtime takes the kernels from the release parts cache and
  # never builds one: a cache miss skips the image for this commit, and the
  # pin stays where it was.
  build-pod-runtime-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the pod-runtime image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    # The local runtime's Linux side took 23 to 33 minutes in the last three
    # releases with the kernels cached and four cw build jobs; at two jobs a
    # build it is estimated at 40 to 60, and the image adds a few minutes.
    timeout-minutes: 90
    needs: [deploy-selection, dev-delivery-turn, publish-runtime-images]
    if: ${{ always() && needs.deploy-selection.result == 'success' && needs.dev-delivery-turn.result == 'success' && needs.dev-delivery-turn.outputs.turn == 'go' && needs.deploy-selection.outputs.pod_runtime_image_fingerprint != '' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.pod-runtime_candidate_ref }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      CODEWIRE_POD_RUNTIME_FINGERPRINT: ${{ needs.deploy-selection.outputs.pod_runtime_image_fingerprint }}
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # One pod-runtime build at a time: while another Deploy Dev run's build
      # is running, this one builds nothing, and a later delivery builds the
      # newest commit, so Dev's standard-VM daemon trails main by up to one
      # build. It fails open to building when the API cannot be read.
      - name: Skip while another pod-runtime build runs
        id: in-flight
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/deploy/pod-runtime-build-in-flight.py

      # A fp- tag exists only once a build of these inputs was signed
      # (pod-runtime-image-tag.sh), so a present one means there is nothing to build.
      - name: Look for a signed image of these inputs
        id: existing
        if: ${{ steps.in-flight.outputs.in_flight == 'false' }}
        run: |
          set -euo pipefail
          state="$(scripts/ci/images/pod-runtime-image-tag.sh exists "$CODEWIRE_POD_RUNTIME_FINGERPRINT")"
          echo "pod-runtime image for fingerprint $CODEWIRE_POD_RUNTIME_FINGERPRINT: $state"
          echo "state=$state" >>"$GITHUB_OUTPUT"

      # The release's own Linux side, from this commit: the guest root and the
      # sealed cw runtime built here in their pinned Rust containers (never on
      # the runner's toolchain), the kernels only from the parts cache
      # (LOCAL_RUNTIME_NO_BUILD), whose miss exits 4 and skips the image.
      # The image needs only the Linux x86_64 target, so the aarch64 parts the
      # macOS target needs are left out (LOCAL_RUNTIME_LINUX_X86_64_ONLY).
      # Each Rust builder container gets four cores (LOCAL_RUNTIME_CPUS, docker
      # --cpus, which build scripts and linkers cannot exceed) and four Cargo
      # jobs to match (LOCAL_RUNTIME_JOBS for the cw runtime, CARGO_BUILD_JOBS
      # for the guest root). The one chain's builds run one after the other, so
      # the build takes about four cores beside the delivery's own builds.
      - name: Build the local runtime's Linux side
        id: runtime
        if: ${{ steps.existing.outputs.state == 'absent' }}
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/.local-runtime"
          mkdir -m 0700 "$work" "$work/tmp"
          status=0
          TMPDIR="$work/tmp" LOCAL_RUNTIME_JOB_CONTAINER="${HOSTNAME:?}" LOCAL_RUNTIME_NO_BUILD=1 \
            LOCAL_RUNTIME_LINUX_X86_64_ONLY=1 LOCAL_RUNTIME_CPUS=4 LOCAL_RUNTIME_JOBS=4 CARGO_BUILD_JOBS=4 \
            scripts/ci/release/build-local-runtime.sh linux --source-sha "$GITHUB_SHA" \
            --version "v0.0.0-main.${GITHUB_SHA:0:12}" --output "$work/linux" || status=$?
          if [ "$status" -eq 4 ]; then
            echo "::warning::a runtime kernel is not in the parts cache; no pod-runtime image for this commit"
            echo 'built=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo 'built=true' >>"$GITHUB_OUTPUT"

      # The context sits inside this checkout, so the image's provenance names
      # this commit as every runtime image's does, under the ignored
      # .local-runtime/ beside the runtime it is made from: a protected build
      # refuses any untracked file in its source tree.
      - name: Assemble the image's context
        if: ${{ steps.runtime.outputs.built == 'true' }}
        run: |
          python3 -I scripts/ci/images/pod-runtime-context.py \
            --runtime "$GITHUB_WORKSPACE/.local-runtime/linux/linux-x86_64" \
            --output "$GITHUB_WORKSPACE/.local-runtime/pod-runtime-context"

      - name: Build and push the pod-runtime image
        id: build
        if: ${{ steps.runtime.outputs.built == 'true' }}
        env:
          CODEWIRE_POD_RUNTIME_CONTEXT: ${{ github.workspace }}/.local-runtime/pod-runtime-context
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
        run: scripts/ci/images/build-push-runtime-images.sh pod-runtime

  # Signs only the digest this run's build reported, after main CI's verdict
  # for this exact commit, as sign-egress-image does.
  sign-pod-runtime-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Sign the pod-runtime image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [deploy-selection, build-pod-runtime-image]
    if: ${{ always() && needs.build-pod-runtime-image.result == 'success' && needs.build-pod-runtime-image.outputs.candidate_ref != '' }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read main CI's verdict for this commit
        id: verdict
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/plan/main-ci-verdict.py check \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --github-output

      # Signs nothing a tag points at: only the build's reported digest, and
      # only while this commit's source tag still names it.
      - name: Sign the exact pod-runtime image this run built
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_POD_RUNTIME_CANDIDATE: ${{ needs.build-pod-runtime-image.outputs.candidate_ref }}
          CODEWIRE_POD_RUNTIME_FINGERPRINT: ${{ needs.deploy-selection.outputs.pod_runtime_image_fingerprint }}
        run: |
          set -euo pipefail
          source_digest="$(scripts/ci/images/pod-runtime-image-tag.sh source-digest "$GITHUB_SHA")"
          [[ "$source_digest" == "${CODEWIRE_POD_RUNTIME_CANDIDATE##*@}" ]] || {
            echo "::error::the pod-runtime source tag names $source_digest, not the digest this run built" >&2
            exit 1
          }
          scripts/ci/images/sign-runtime-image-set.sh --pod-runtime "$CODEWIRE_POD_RUNTIME_CANDIDATE" \
            scripts/ci/trust/codewire-runtime-signing.pub
          scripts/ci/images/pod-runtime-image-tag.sh tag "$CODEWIRE_POD_RUNTIME_CANDIDATE" "$CODEWIRE_POD_RUNTIME_FINGERPRINT"

  # The standard workspace disk (#5602; docs/dev/CODEWIRE-GUARD-RUNTIME-PROFILES.md,
  # "Building the workspace disk in CI") is built on the KVM runner, then
  # pushed and signed here, and never delivered: only a merged pin of
  # SANDBOX_STANDARD_IMAGE_DISK decides what a deployment runs. Like the
  # pod-runtime image it builds only on the run that holds the delivery turn,
  # once its publish job has finished or been skipped, and nothing on the
  # delivery path needs it. This job prepares the build's inputs where the
  # registry login is, so the KVM job holds no credential.
  prepare-workspace-disk-inputs:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Prepare the workspace disk's build inputs
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 60
    needs: [deploy-selection, dev-delivery-turn, publish-runtime-images]
    if: ${{ always() && needs.deploy-selection.result == 'success' && needs.dev-delivery-turn.result == 'success' && needs.dev-delivery-turn.outputs.turn == 'go' && needs.deploy-selection.outputs.workspace_disk_image_fingerprint != '' }}
    outputs:
      inputs_sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      CODEWIRE_WORKSPACE_DISK_FINGERPRINT: ${{ needs.deploy-selection.outputs.workspace_disk_image_fingerprint }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # A fp- tag exists only once a disk of these inputs was signed
      # (workspace-disk-image-tag.sh), so a present one means there is nothing to build.
      - name: Look for a signed disk of these inputs
        id: existing
        run: |
          set -euo pipefail
          state="$(scripts/ci/images/workspace-disk-image-tag.sh exists "$CODEWIRE_WORKSPACE_DISK_FINGERPRINT")"
          echo "workspace disk for fingerprint $CODEWIRE_WORKSPACE_DISK_FINGERPRINT: $state"
          echo "state=$state" >>"$GITHUB_OUTPUT"

      # The proto build scripts need the pinned protoc; the job image's own is
      # too old for the options the protos use.
      - name: Install pinned protoc for Rust builds
        if: ${{ steps.existing.outputs.state == 'absent' }}
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip" \
            6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7 /tmp/protoc.zip
          rm -rf "$HOME/.proto-tools/protoc"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Build codewire-local-vmm-smoke
        if: ${{ steps.existing.outputs.state == 'absent' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.local-runtime/disk-target" CARGO_BUILD_JOBS=4 \
            cargo build --locked --profile runtime -p codewire-local-vmm --bin codewire-local-vmm-smoke

      # The disk boots over the runtime of the signed pod-runtime image this
      # source pins, checked against main CI's signature before it is pulled,
      # with the job's pull-only Harbor identity in a private Docker config.
      - name: Take the runtime from the pinned, signed pod-runtime image
        if: ${{ steps.existing.outputs.state == 'absent' }}
        run: |
          set -euo pipefail
          ref="${CODEWIRE_IMAGE_REGISTRY:?}/codewire/pod-runtime@$(<deployments/k8s/orchestration/pod-runtime-image.digest)"
          scripts/ci/images/verify-runtime-image-signatures.sh --pod-runtime "$ref" \
            scripts/ci/trust/codewire-runtime-signing.pub >/dev/null
          work="$GITHUB_WORKSPACE/.local-runtime/disk-runtime"
          mkdir -m 0700 "$work" "$work/docker"
          trap 'find "$work/docker" "$work/harbor-username" "$work/harbor-password" -type f -exec shred -u {} + 2>/dev/null || true' EXIT
          scripts/ci/setup/fetch-openbao-harbor-credentials.sh --pull "$work/harbor-username" "$work/harbor-password"
          DOCKER_CONFIG="$work/docker" docker login "$CODEWIRE_IMAGE_REGISTRY" \
            --username "$(<"$work/harbor-username")" --password-stdin <"$work/harbor-password" >/dev/null
          shred -u "$work/harbor-password"
          DOCKER_CONFIG="$work/docker" docker pull "$ref" >/dev/null
          container="$(docker create "$ref")"
          docker cp "$container:/opt/codewire/runtime" "$work/runtime"
          docker rm "$container" >/dev/null

      - name: Pack the inputs, with their modes
        id: pack
        if: ${{ steps.existing.outputs.state == 'absent' }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$GITHUB_WORKSPACE/.local-runtime/disk-handoff"
          sha256="$(python3 -I scripts/ci/images/workspace-disk-inputs.py pack-inputs \
            --runtime "$GITHUB_WORKSPACE/.local-runtime/disk-runtime/runtime" \
            --smoke "$GITHUB_WORKSPACE/.local-runtime/disk-target/runtime/codewire-local-vmm-smoke" \
            --output "$GITHUB_WORKSPACE/.local-runtime/disk-handoff/inputs.tar")"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      - name: Hand the inputs to the KVM job
        if: ${{ steps.pack.outputs.sha256 != '' }}
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: workspace-disk-inputs-${{ github.run_id }}
          path: .local-runtime/disk-handoff/inputs.tar
          # The upload action skips hidden paths unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The one CI runner with /dev/kvm, whose jobs run on the host kernel
  # (infra docs/ci/runners.md section 2.6b). It holds no credential: its
  # inputs arrive by sha256, the workspace image comes anonymously from its
  # public mirror by the pinned digest, and the disk goes back by sha256 for
  # the publisher to push and sign. Its /work is a volume that outlives the
  # Pod, so the job clears its own directory there first and removes it last.
  build-workspace-disk:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job requests no OIDC token and reads no credential.
    name: Build the workspace disk on the KVM runner
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM_KVM || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM_KVM' }}
    timeout-minutes: 60
    needs: [deploy-selection, prepare-workspace-disk-inputs]
    if: ${{ always() && needs.prepare-workspace-disk-inputs.result == 'success' && needs.prepare-workspace-disk-inputs.outputs.inputs_sha256 != '' }}
    outputs:
      disk_sha256: ${{ steps.handback.outputs.sha256 }}
    env:
      # At most 28 bytes for the scratch parent, which holds the VM's sockets
      # (workspace-disk.sh).
      DISK_WORK: /work/cw-disk
      INPUTS_SHA256: ${{ needs.prepare-workspace-disk-inputs.outputs.inputs_sha256 }}
    steps:
      - name: Clear this job's work directory
        run: |
          set -euo pipefail
          rm -rf -- "${DISK_WORK:?}"
          mkdir -m 0700 "$DISK_WORK" "$DISK_WORK/scratch" "$DISK_WORK/handback" "$DISK_WORK/upload-tmp"

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Receive the inputs
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: workspace-disk-inputs-${{ github.run_id }}
          path: ${{ env.DISK_WORK }}/received

      - name: Check and unpack the inputs
        run: |
          python3 -I scripts/ci/images/workspace-disk-inputs.py unpack-inputs \
            --tar "$DISK_WORK/received/inputs.tar" --sha256 "$INPUTS_SHA256" --output "$DISK_WORK/inputs"

      - name: Build the disk of the pinned workspace image
        run: |
          set -euo pipefail
          image="$(python3 -I scripts/ci/images/workspace-disk-source.py show public-image)"
          [[ "${image##*@}" == "$(python3 -I scripts/ci/images/workspace-disk-source.py show digest)" ]] || {
            echo "::error::the pinned public workspace image is not the pinned digest" >&2
            exit 1
          }
          scripts/ci/images/workspace-disk.sh build \
            --smoke "$DISK_WORK/inputs/codewire-local-vmm-smoke" \
            --artifact-root "$DISK_WORK/inputs/runtime/artifacts" \
            --artifact-lock "$DISK_WORK/inputs/runtime/artifacts.lock" \
            --image "$image" --output "$DISK_WORK/disk" --scratch-parent "$DISK_WORK/scratch"

      - name: Pack the disk to hand back
        id: handback
        run: |
          set -euo pipefail
          sha256="$(python3 -I scripts/ci/images/workspace-disk-inputs.py pack-disk \
            --dir "$DISK_WORK/disk" --output "$DISK_WORK/handback/disk.tar")"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      - name: Hand the disk back
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        env:
          # The upload gzips the disk into a file in os.tmpdir() first. The
          # runner's /tmp is a 1Gi emptyDir, and filling it evicts the runner.
          TMPDIR: ${{ env.DISK_WORK }}/upload-tmp
        with:
          name: workspace-disk-${{ github.run_id }}
          path: ${{ env.DISK_WORK }}/handback/disk.tar
          if-no-files-found: error
          retention-days: 1

      - name: Remove this job's work directory
        if: ${{ always() }}
        run: rm -rf -- "${DISK_WORK:?}"

  # Pushes only the disk the KVM job handed back, checked by its sha256, the
  # way the pod-runtime image is pushed.
  publish-workspace-disk:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Push the workspace disk
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 60
    needs: [deploy-selection, build-workspace-disk]
    if: ${{ always() && needs.build-workspace-disk.result == 'success' && needs.build-workspace-disk.outputs.disk_sha256 != '' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.workspace-disk_candidate_ref }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Receive the disk
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: workspace-disk-${{ github.run_id }}
          path: .local-runtime/disk-received

      # The context sits inside this checkout, so the disk's provenance names
      # this commit as every runtime image's does. Remove the received tarball
      # right after unpacking so the light runner does not hold two ~6.5 GiB
      # copies during the BuildKit upload.
      - name: Check and unpack the disk
        env:
          DISK_SHA256: ${{ needs.build-workspace-disk.outputs.disk_sha256 }}
        run: |
          set -euo pipefail
          python3 -I scripts/ci/images/workspace-disk-inputs.py unpack-disk \
            --tar "$GITHUB_WORKSPACE/.local-runtime/disk-received/disk.tar" --sha256 "$DISK_SHA256" \
            --output "$GITHUB_WORKSPACE/.local-runtime/workspace-disk-context"
          rm -rf -- "$GITHUB_WORKSPACE/.local-runtime/disk-received"

      - name: Build and push the workspace disk
        id: build
        env:
          CODEWIRE_WORKSPACE_DISK_CONTEXT: ${{ github.workspace }}/.local-runtime/workspace-disk-context
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
        run: scripts/ci/images/build-push-runtime-images.sh workspace-disk

      # The SANDBOX_STANDARD_IMAGE_DISK value for this disk, for the pin that
      # follows its signature (docs/CONFIGURATION.md).
      - name: Name the disk's configuration line
        env:
          DISK_REF: ${{ steps.build.outputs.workspace-disk_candidate_ref }}
        run: |
          set -euo pipefail
          line="$(scripts/ci/images/workspace-disk.sh line --disk "$DISK_REF" \
            --image "$(python3 -I scripts/ci/images/workspace-disk-source.py show harbor-image)" \
            --dir "$GITHUB_WORKSPACE/.local-runtime/workspace-disk-context")"
          echo "SANDBOX_STANDARD_IMAGE_DISK=$line"
          printf 'SANDBOX_STANDARD_IMAGE_DISK=`%s`\n' "$line" >>"$GITHUB_STEP_SUMMARY"

      - name: Remove unpacked workspace disk files
        if: ${{ always() }}
        run: rm -rf -- "$GITHUB_WORKSPACE/.local-runtime/disk-received" "$GITHUB_WORKSPACE/.local-runtime/workspace-disk-context"

  # Signs only the digest this run's push reported, after main CI's verdict
  # for this exact commit, as sign-pod-runtime-image does: family
  # workspace-disk with the runtime key (owner, 2026-11-24, recorded on #5602).
  sign-workspace-disk:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Sign the workspace disk
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [deploy-selection, publish-workspace-disk]
    if: ${{ always() && needs.publish-workspace-disk.result == 'success' && needs.publish-workspace-disk.outputs.candidate_ref != '' }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read main CI's verdict for this commit
        id: verdict
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/plan/main-ci-verdict.py check \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --github-output

      # Signs nothing a tag points at: only the push's reported digest, and
      # only while this commit's source tag still names it.
      - name: Sign the exact workspace disk this run pushed
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_WORKSPACE_DISK_CANDIDATE: ${{ needs.publish-workspace-disk.outputs.candidate_ref }}
          CODEWIRE_WORKSPACE_DISK_FINGERPRINT: ${{ needs.deploy-selection.outputs.workspace_disk_image_fingerprint }}
        run: |
          set -euo pipefail
          source_digest="$(scripts/ci/images/workspace-disk-image-tag.sh source-digest "$GITHUB_SHA")"
          [[ "$source_digest" == "${CODEWIRE_WORKSPACE_DISK_CANDIDATE##*@}" ]] || {
            echo "::error::the workspace disk source tag names $source_digest, not the digest this run pushed" >&2
            exit 1
          }
          scripts/ci/images/sign-runtime-image-set.sh --workspace-disk "$CODEWIRE_WORKSPACE_DISK_CANDIDATE" \
            scripts/ci/trust/codewire-runtime-signing.pub
          scripts/ci/images/workspace-disk-image-tag.sh tag "$CODEWIRE_WORKSPACE_DISK_CANDIDATE" \
            "$CODEWIRE_WORKSPACE_DISK_FINGERPRINT"

  # A run that deferred builds nothing; this job's success is how the delivery
  # in flight knows to hand it the turn (wait-for-dev-delivery-turn.py).
  dev-delivery-deferred:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job holds no credential and runs no script.
    name: Deferred to the delivery in flight
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 5
    needs: [deploy-selection, dev-delivery-turn]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'deferred' }}
    steps:
      - name: Wait for the delivery in flight to hand the turn on
        run: echo "this delivery deferred; the delivery in flight hands it the turn when it ends"

  # The delivery that had the turn hands it to the newest one that deferred
  # behind it, however this one ended (#4476; owner, 2026-11-10, #4071: when
  # the in-flight delivery finishes, the waiting one starts). It reruns that
  # run's turn job with the job token, as main CI's Dev delivery job does.
  dev-delivery-hand-on:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token reads runs and reruns one Deploy Dev turn job.
    name: Hand the Dev delivery turn on
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 15
    needs: [deploy-selection, dev-delivery-turn, build-service-images, build-daemon-image, publish-runtime-images]
    if: ${{ always() && needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Rerun the turn of the newest delivery that deferred
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/deploy/wait-for-dev-delivery-turn.py --hand-on
