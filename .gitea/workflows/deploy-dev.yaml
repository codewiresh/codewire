name: Deploy Dev

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  ALLOW_NON_MAIN_IMAGE_BUILD: "1"

jobs:
  deploy-selection:
    name: Deploy selection
    runs-on: ubuntu-latest
    outputs:
      deploy_dev: ${{ steps.select.outputs.deploy_dev }}
      reason: ${{ steps.select.outputs.reason }}
      matched_categories: ${{ steps.select.outputs.matched_categories }}
      dashboard_image_state: ${{ steps.select.outputs.dashboard_image_state }}
      gateway_image_state: ${{ steps.select.outputs.gateway_image_state }}
      derp_image_state: ${{ steps.select.outputs.derp_image_state }}
      services_image_state: ${{ steps.select.outputs.services_image_state }}
      mesh_image_state: ${{ steps.select.outputs.mesh_image_state }}
      baseline_sha: ${{ steps.select.outputs.baseline_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      head_tree: ${{ steps.select.outputs.head_tree }}
      ci_plan_sha256: ${{ steps.select.outputs.ci_plan_sha256 }}
      ci_policy_sha256: ${{ steps.select.outputs.ci_policy_sha256 }}
      baseline_valid: ${{ steps.select.outputs.baseline_valid }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.91.1

      - name: Resolve untrusted deployed Dev source
        env:
          CODEWIRE_DEPLOY_PROMOTION_TOKEN: ${{ secrets.CODEWIRE_DEPLOY_PROMOTION_TOKEN }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/codewire-deployed-source-candidate.json"
          scripts/ci/deploy/resolve-deployed-source.sh "$candidate" "$GITHUB_SHA"

      - name: Plan and select atomic Dev deployment
        id: select
        run: |
          set -euo pipefail
          plan="$(mktemp)"
          trap 'rm -f "$plan"' EXIT
          python3 scripts/ci/plan/planner.py \
            --repository . \
            --target-base "$GITHUB_SHA" \
            --head "$GITHUB_SHA" \
            --trusted-policy "$GITHUB_SHA" \
            --deployed-source-candidate "$RUNNER_TEMP/codewire-deployed-source-candidate.json" \
            --output "$plan"
          if jq -e '.degraded_reasons | length > 0' "$plan" >/dev/null; then
            echo 'Runtime artifact planner degraded; the atomic set remains selected:'
            jq -c '.degraded_reasons' "$plan"
          fi
          python3 scripts/ci/plan/apply-deploy-plan.py \
            --plan "$plan" \
            --head "$GITHUB_SHA" \
            --head-tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

      - name: Remove untrusted deployed-source candidate
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/codewire-deployed-source-candidate.json"

  build-gateway-image:
    name: Build Gateway Image
    runs-on: ubuntu-latest
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build and push gateway image
        id: build
        run: scripts/ci/images/build-push-image.sh gateway deployments/docker/gateway.Dockerfile .

  build-dashboard-image:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build and push dashboard image
        id: build
        run: scripts/ci/images/build-push-image.sh dashboard apps/dashboard/Dockerfile .

  build-derp:
    name: Build DERP Relay Image
    runs-on: ubuntu-latest
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build and push DERP image
        id: build
        run: scripts/ci/images/build-push-image.sh derp deployments/docker/derp.Dockerfile .

  build-services-image:
    name: Build Rust Services Image
    runs-on: ubuntu-latest
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build and push services image
        id: build
        run: scripts/ci/images/build-push-image.sh services deployments/docker/services.Dockerfile .

  build-mesh-image:
    name: Build Hosted Mesh Image
    runs-on: ubuntu-latest
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      candidate_ref: ${{ steps.build.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build and push hosted Mesh image
        id: build
        run: scripts/ci/images/build-push-image.sh mesh deployments/docker/mesh.Dockerfile .

  publish-runtime-images:
    name: Publish exact runtime manifests to GHCR
    runs-on: ubuntu-latest
    needs:
      - deploy-selection
      - build-gateway-image
      - build-dashboard-image
      - build-derp
      - build-services-image
      - build-mesh-image
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Copy the complete runtime set without rebuilding
        env:
          GHCR_PUBLISH_USERNAME: ${{ vars.GHCR_PUBLISH_USERNAME }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP:?}/codewire-dev-image-bundle.json"
          scripts/ci/images/image-bundle.py create \
            --source-sha "$GITHUB_SHA" \
            --output "$bundle" \
            --candidate dashboard "$GITHUB_SHA" "${{ needs.build-dashboard-image.outputs.candidate_ref }}" \
            --candidate derp "$GITHUB_SHA" "${{ needs.build-derp.outputs.candidate_ref }}" \
            --candidate gateway "$GITHUB_SHA" "${{ needs.build-gateway-image.outputs.candidate_ref }}" \
            --candidate services "$GITHUB_SHA" "${{ needs.build-services-image.outputs.candidate_ref }}" \
            --candidate mesh "$GITHUB_SHA" "${{ needs.build-mesh-image.outputs.candidate_ref }}"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-dashboard-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/dashboard \
            "$GITHUB_SHA"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-derp.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/derp \
            "$GITHUB_SHA"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-gateway-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/gateway \
            "$GITHUB_SHA"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-services-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/services \
            "$GITHUB_SHA"
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ needs.build-mesh-image.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/mesh \
            "$GITHUB_SHA"

  dispatch-deploy-dev:
    name: Dispatch exact source to deploy
    runs-on: ubuntu-latest
    needs:
      - deploy-selection
      - publish-runtime-images
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && github.ref == 'refs/heads/main' && needs.publish-runtime-images.result == 'success' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Require the exact current canonical main commit
        run: |
          set -euo pipefail
          canonical_main_sha="$(
            git ls-remote origin refs/heads/main |
              awk '$2 == "refs/heads/main" { print $1 }'
          )"
          [[ "$canonical_main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$canonical_main_sha" == "$GITHUB_SHA" ]]

      - name: Dispatch only the canonical source SHA
        env:
          CODEWIRE_DEPLOY_PROMOTION_TOKEN: ${{ secrets.CODEWIRE_DEPLOY_PROMOTION_TOKEN }}
        run: scripts/ci/deploy/dispatch-deploy-dev.sh "${GITHUB_SHA:?}"
