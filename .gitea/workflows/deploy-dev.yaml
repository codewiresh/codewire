# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; runner profiles, job-scoped OIDC, and server-side integrations enforce capabilities.
name: Build and deliver Dev

on:
  push:
    branches: [main]

# Dev runs only commits whose main CI passed (#2892). This push run builds and
# pushes the runtime images by digest, unsigned. Its publish job signs and
# dispatches them only after main CI's verdict for this exact commit, and only
# while the commit descends from the source Dev runs; when main CI finishes
# later, its final job reruns that publish job. One Dev delivery is in flight
# at a time and always finishes; at most one waits behind it, the newest, and
# a newer commit replaces the waiting one (owner, 2026-11-10, #4071; replaces
# the 2026-10-21 and 2026-10-24 cancel rules). The "Dev delivery turn" job
# decides; no delivery is ever cancelled. A run still waiting near its runner's
# 25-minute cap defers, and the delivery in flight hands the turn on when it
# ends (#4476). Runs of different commits never queue
# behind each other through concurrency: each commit has its own group, so
# only a rerun of the same commit queues. Leaving the block out would cancel on
# every push.
concurrency:
  group: deploy-dev-${{ github.sha }}
  cancel-in-progress: false

# Site configuration from repository Actions variables (docs/dev/CI-CONFIGURATION.md).
env:
  CODEWIRE_IMAGE_REGISTRY: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}
  CODEWIRE_SOURCE_URL: ${{ vars.CODEWIRE_SOURCE_URL }}
  CODEWIRE_R2_CACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
  CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}

jobs:
  deploy-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    # Its OIDC token mints the Deploy integration (write:repository on
    # codewire/deploy) to read Dev's baseline, and the publisher role would
    # accept it too, so it runs only on the trusted runner (#3758).
    name: Deploy selection
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 15
    outputs:
      deploy_dev: ${{ steps.select.outputs.deploy_dev }}
      reason: ${{ steps.select.outputs.reason }}
      matched_categories: ${{ steps.select.outputs.matched_categories }}
      dashboard_image_state: ${{ steps.select.outputs.dashboard_image_state }}
      daemon_image_state: ${{ steps.select.outputs.daemon_image_state }}
      derp_image_state: ${{ steps.select.outputs.derp_image_state }}
      services_image_state: ${{ steps.select.outputs.services_image_state }}
      mesh_image_state: ${{ steps.select.outputs.mesh_image_state }}
      baseline_sha: ${{ steps.select.outputs.baseline_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      head_tree: ${{ steps.select.outputs.head_tree }}
      ci_plan_sha256: ${{ steps.select.outputs.ci_plan_sha256 }}
      ci_policy_sha256: ${{ steps.select.outputs.ci_policy_sha256 }}
      baseline_valid: ${{ steps.select.outputs.baseline_valid }}
      dev_release_tree_state: ${{ steps.select.outputs.dev_release_tree_state }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify sealed Rust toolchain
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Resolve untrusted deployed Dev source
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/codewire-deployed-source-candidate.json"
          scripts/ci/deploy/resolve-deployed-source.sh "$candidate" "$GITHUB_SHA"

      - name: Plan and select atomic Dev deployment
        id: select
        run: |
          set -euo pipefail
          plan="$(mktemp)"
          trap 'rm -f "$plan"' EXIT
          python3 scripts/ci/plan/planner.py \
            --repository . \
            --target-base "$GITHUB_SHA" \
            --head "$GITHUB_SHA" \
            --trusted-policy "$GITHUB_SHA" \
            --deployed-source-candidate "$RUNNER_TEMP/codewire-deployed-source-candidate.json" \
            --output "$plan"
          if jq -e '.degraded_reasons | length > 0' "$plan" >/dev/null; then
            echo 'Runtime artifact planner degraded; the atomic set remains selected:'
            jq -c '.degraded_reasons' "$plan"
          fi
          python3 scripts/ci/plan/apply-deploy-plan.py \
            --plan "$plan" \
            --head "$GITHUB_SHA" \
            --head-tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

      - name: Remove untrusted deployed-source candidate
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/codewire-deployed-source-candidate.json"

  # One delivery in flight at a time; the newest waits, and a newer commit
  # replaces the waiting one (owner, 2026-11-10, #4071). This only waits,
  # defers or steps aside; it never stops another run, and anything unreadable
  # lets this run build.
  dev-delivery-turn:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job reads run state with the job token only.
    name: Dev delivery turn
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # The light runner's own cap: the turn defers after 20 minutes of waiting,
    # and the delivery in flight hands the turn on (#4476).
    timeout-minutes: 25
    needs: [deploy-selection]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' }}
    outputs:
      turn: ${{ steps.turn.outputs.turn }}
    steps:
      # The script reads run state only; it orders runs by run ID, not ancestry.
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for this delivery's turn
        id: turn
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/deploy/wait-for-dev-delivery-turn.py

  # The runtime set builds in two protected halves on separate workers: the
  # daemon's static CW producer is the longest single build, so it runs beside
  # the service images instead of before them. The halves share no image, so
  # they never race for an immutable source tag; publish-runtime-images joins
  # them by the exact digests they report.
  build-service-images:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the service runtime images
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 110
    needs: [deploy-selection, dev-delivery-turn]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    outputs:
      dashboard_candidate_ref: ${{ steps.build.outputs.dashboard_candidate_ref }}
      dashboard_built_from: ${{ steps.build.outputs.dashboard_built_from }}
      derp_candidate_ref: ${{ steps.build.outputs.derp_candidate_ref }}
      derp_built_from: ${{ steps.build.outputs.derp_built_from }}
      services_candidate_ref: ${{ steps.build.outputs.services_candidate_ref }}
      services_built_from: ${{ steps.build.outputs.services_built_from }}
      mesh_candidate_ref: ${{ steps.build.outputs.mesh_candidate_ref }}
      mesh_built_from: ${{ steps.build.outputs.mesh_built_from }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      # The images build on the trusted BuildKit builder and fail fast when it
      # is unreachable. Only the owner's recovery builds them in this job: the
      # repository variable CODEWIRE_IN_JOB_BUILD_SHA naming this exact commit,
      # then a rerun of all jobs (this run passes no artifacts between jobs).
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The protected R2 compiler cache is best effort: when this job cannot
      # obtain its protected credential, the selector chooses the job-local
      # cache, and run-rust-build.sh compiles locally on any R2 outage.
      - name: Select the protected R2 compiler cache
        id: compiler-cache
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build and push the service runtime images
        id: build
        env:
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
          # Trusted planner change context for selective rebuilds. A family
          # the planner certifies unaffected carries its exact deployed
          # digest forward instead of rebuilding. The gate stays 0 until
          # codewire/deploy accepts carried provenance (issue #2353); every
          # ambiguity fails closed to a full source build.
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_IMAGE_STATE_DASHBOARD: ${{ needs.deploy-selection.outputs.dashboard_image_state }}
          CODEWIRE_IMAGE_STATE_DERP: ${{ needs.deploy-selection.outputs.derp_image_state }}
          CODEWIRE_IMAGE_STATE_SERVICES: ${{ needs.deploy-selection.outputs.services_image_state }}
          CODEWIRE_IMAGE_STATE_MESH: ${{ needs.deploy-selection.outputs.mesh_image_state }}
        run: scripts/ci/images/build-push-runtime-images.sh services

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

  build-daemon-image:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Build and push the daemon runtime image
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 110
    needs: [deploy-selection, dev-delivery-turn]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    outputs:
      daemon_candidate_ref: ${{ steps.build.outputs.daemon_candidate_ref }}
      daemon_built_from: ${{ steps.build.outputs.daemon_built_from }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      # The images build on the trusted BuildKit builder and fail fast when it
      # is unreachable. Only the owner's recovery builds them in this job: the
      # repository variable CODEWIRE_IN_JOB_BUILD_SHA naming this exact commit,
      # then a rerun of all jobs (this run passes no artifacts between jobs).
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The protected R2 compiler cache is best effort: when this job cannot
      # obtain its protected credential, the selector chooses the job-local
      # cache, and run-rust-build.sh compiles locally on any R2 outage.
      - name: Select the protected R2 compiler cache
        id: compiler-cache
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build and push the daemon runtime image
        id: build
        env:
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
          # Carry-forward stays gated (issue #2353); see the service images.
          CODEWIRE_RUNTIME_CARRY_FORWARD: '0'
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_IMAGE_STATE_DAEMON: ${{ needs.deploy-selection.outputs.daemon_image_state }}
        run: scripts/ci/images/build-push-runtime-images.sh daemon

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

  # The only job that signs or dispatches. It runs after both build halves,
  # and again whenever main CI's final job reruns it for this commit
  # (rerun-dev-publish.py); a rerun keeps this push run's event and actor,
  # which the publisher identity requires, and its build jobs' outputs.
  publish-runtime-images:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this protected job receives only its job-scoped OIDC and allowlisted server-side capabilities.
    name: Publish the exact runtime image set
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 45
    needs: [deploy-selection, dev-delivery-turn, build-service-images, build-daemon-image]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    env:
      OPENBAO_ROLE: codewire-source-dev-publisher
      CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
      OPENBAO_AUDIENCE: openbao-codewire-source-dev-publisher
      OPENBAO_GHCR_ROLE: codewire-source-dev-publisher
      OPENBAO_GHCR_AUDIENCE: openbao-codewire-source-dev-publisher
    steps:
      # The descent checks compare this commit with Dev's source in main's
      # history.
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Main CI's verdict for this exact commit, from its own ci.yaml push run
      # on main (main-ci-verdict.py). Waiting for it, a red verdict, a
      # superseded run or no run at all signs nothing and still succeeds; an
      # unreadable verdict fails this job and signs nothing.
      - name: Read main CI's verdict for this commit
        id: verdict
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/plan/main-ci-verdict.py check \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --github-output

      # Each candidate is the exact digest its build job's Bake pushed, passed
      # through this run's job outputs. Publication confirms that each
      # source-SHA tag names that digest; it never takes a digest from a tag.
      - name: Publish the complete runtime set to Harbor without rebuilding
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP:?}/codewire-dev-image-bundle.json"
          scripts/ci/images/image-bundle.py create \
            --source-sha "$GITHUB_SHA" \
            --output "$bundle" \
            --candidate dashboard "$GITHUB_SHA" "${{ needs.build-service-images.outputs.dashboard_candidate_ref }}" \
            --candidate derp "$GITHUB_SHA" "${{ needs.build-service-images.outputs.derp_candidate_ref }}" \
            --candidate daemon "$GITHUB_SHA" "${{ needs.build-daemon-image.outputs.daemon_candidate_ref }}" \
            --candidate services "$GITHUB_SHA" "${{ needs.build-service-images.outputs.services_candidate_ref }}" \
            --candidate mesh "$GITHUB_SHA" "${{ needs.build-service-images.outputs.mesh_candidate_ref }}"
          # The build jobs pushed all five images to Harbor, the registry every
          # deployment pulls from. Confirm each source-SHA tag and prove each
          # digest with the consumer pull identity. The public GHCR mirror
          # follows delivery and never gates it.
          scripts/ci/images/publish-image-to-harbor.sh \
            --runtime-bundle "$bundle"
          # Sandboxes default to the published workspace pin; keep it in
          # Harbor before Dev references it. A pin Harbor lacks is imported
          # once from the public mirror.
          scripts/ci/images/publish-image-to-harbor.sh --pinned-defaults

      # A verified commit delivers even after main moved on, as long as it
      # moves Dev forward; one Dev already runs or has passed signs nothing,
      # so a rerun of an older run signs only while Dev is still behind it.
      - name: Require this commit to move Dev forward before signing
        id: descent-before-signing
        if: ${{ steps.verdict.outputs.verified == 'true' }}
        run: scripts/ci/deploy/require-dev-descent.sh signing

      # The signature records main CI's verdict: dev.codewire.verified=main-ci
      # and the verifying ci.yaml run, which deploy-prod requires.
      - name: Sign the exact runtime set
        if: ${{ steps.descent-before-signing.outputs.deliver == 'true' }}
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_BUILT_FROM_DASHBOARD: ${{ needs.build-service-images.outputs.dashboard_built_from }}
          CODEWIRE_BUILT_FROM_DERP: ${{ needs.build-service-images.outputs.derp_built_from }}
          CODEWIRE_BUILT_FROM_DAEMON: ${{ needs.build-daemon-image.outputs.daemon_built_from }}
          CODEWIRE_BUILT_FROM_SERVICES: ${{ needs.build-service-images.outputs.services_built_from }}
          CODEWIRE_BUILT_FROM_MESH: ${{ needs.build-service-images.outputs.mesh_built_from }}
        run: |
          scripts/ci/images/sign-runtime-image-set.sh \
            "${RUNNER_TEMP:?}/codewire-dev-image-bundle.json" \
            scripts/ci/trust/codewire-runtime-signing.pub

      # Dev never moves backwards: a descendant may have reached Dev while
      # this set was signed. promote-dev checks descent again.
      - name: Require this commit to move Dev forward before dispatch
        id: descent-before-dispatch
        if: ${{ steps.descent-before-signing.outputs.deliver == 'true' }}
        run: scripts/ci/deploy/require-dev-descent.sh dispatching

      - name: Dispatch only the canonical source SHA
        id: dispatch
        if: ${{ steps.descent-before-dispatch.outputs.deliver == 'true' }}
        run: scripts/ci/deploy/dispatch-deploy-dev.sh "${GITHUB_SHA:?}"

      # The public GHCR mirror is best effort: Dev already pulls from Harbor,
      # so an unreachable ghcr.io must never block or fail delivery.
      - name: Mirror the runtime set to GHCR without gating delivery
        id: ghcr-mirror
        if: ${{ steps.dispatch.outcome == 'success' }}
        continue-on-error: true
        run: |
          scripts/ci/images/publish-image-to-ghcr.sh \
            --runtime-bundle "${RUNNER_TEMP:?}/codewire-dev-image-bundle.json"

      - name: Sign the GHCR mirror without gating delivery
        if: ${{ steps.ghcr-mirror.outcome == 'success' }}
        continue-on-error: true
        env:
          CODEWIRE_MAIN_CI_RUN: ${{ steps.verdict.outputs.ci_run }}
          CODEWIRE_DEPLOY_BASELINE_SHA: ${{ needs.deploy-selection.outputs.baseline_sha }}
          CODEWIRE_BUILT_FROM_DASHBOARD: ${{ needs.build-service-images.outputs.dashboard_built_from }}
          CODEWIRE_BUILT_FROM_DERP: ${{ needs.build-service-images.outputs.derp_built_from }}
          CODEWIRE_BUILT_FROM_DAEMON: ${{ needs.build-daemon-image.outputs.daemon_built_from }}
          CODEWIRE_BUILT_FROM_SERVICES: ${{ needs.build-service-images.outputs.services_built_from }}
          CODEWIRE_BUILT_FROM_MESH: ${{ needs.build-service-images.outputs.mesh_built_from }}
        run: |
          scripts/ci/images/sign-runtime-image-set.sh --ghcr-mirror \
            "${RUNNER_TEMP:?}/codewire-dev-image-bundle.json" \
            scripts/ci/trust/codewire-runtime-signing.pub

  # A run that deferred builds nothing; this job's success is how the delivery
  # in flight knows to hand it the turn (wait-for-dev-delivery-turn.py).
  dev-delivery-deferred:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job holds no credential and runs no script.
    name: Deferred to the delivery in flight
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 5
    needs: [deploy-selection, dev-delivery-turn]
    if: ${{ needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'deferred' }}
    steps:
      - name: Wait for the delivery in flight to hand the turn on
        run: echo "this delivery deferred; the delivery in flight hands it the turn when it ends"

  # The delivery that had the turn hands it to the newest one that deferred
  # behind it, however this one ended (#4476; owner, 2026-11-10, #4071: when
  # the in-flight delivery finishes, the waiting one starts). It reruns that
  # run's turn job with the job token, as main CI's Dev delivery job does.
  dev-delivery-hand-on:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token reads runs and reruns one Deploy Dev turn job.
    name: Hand the Dev delivery turn on
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 15
    needs: [deploy-selection, dev-delivery-turn, build-service-images, build-daemon-image, publish-runtime-images]
    if: ${{ always() && needs.deploy-selection.outputs.deploy_dev == 'true' && needs.dev-delivery-turn.outputs.turn == 'go' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Rerun the turn of the newest delivery that deferred
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/deploy/wait-for-dev-delivery-turn.py --hand-on
