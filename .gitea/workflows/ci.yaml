# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; runner profiles and server-side integrations enforce capabilities.
name: CI

on:
  push:
    branches: [main]
  # Adding or removing a label (ci-full) starts a fresh run with the
  # new labels; the concurrency group below cancels the superseded one.
  # Closing or merging a pull request starts a run that does nothing, so the
  # same group cancels the pull request's run still in flight, which no one
  # needs any more and which holds metal guests main is waiting for.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      verification:
        description: Product family
        required: false
        default: policy
      rust_cache:
        description: Rust image-build cache mode (auto, local, or disabled)
        required: false
        default: auto
      layer_cache:
        description: Workspace layer cache mode (auto, local, or disabled)
        required: false
        default: local
      source_sha:
        description: With verification=edge_kind, a main commit to verify instead of main's head (dispatch-source.sh)
        required: false
        default: ''
  # No schedule: the four-hourly Kind run is off (owner, 2026-10-25: "Stop
  # running the KIND suite right now. Just disable it. We'll deal with it
  # later."). Kind runs only on a dispatch or a pull request labelled ci-full.

# A newer push to a pull request supersedes its older run. Runs on main
# are the post-merge confirmation, so each one finishes, and each main commit
# has its own group: a push to main starts at once beside a main run still
# verifying, and only a rerun of the same commit waits. A main run never
# trusts another that has not finished: a push verifies from the newest main
# commit whose own run verified it (#3176), and Dev delivery is forward-only
# whatever order verdicts land in (#2892). Scheduled and dispatched runs have
# their own groups, so they never cancel or wait for a push to main; a newer
# scheduled run cancels an older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || github.event_name == 'workflow_dispatch' && '-dispatch' || github.event_name == 'push' && '-push-' || '' }}${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  ARM64_BUILDKIT_HOST: ${{ vars.ARM64_BUILDKIT_HOST }}
  CODEWIRE_IMAGE_REGISTRY: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}
  CODEWIRE_SOURCE_URL: ${{ vars.CODEWIRE_SOURCE_URL }}
  CODEWIRE_R2_CACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
  CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
  KUSTOMIZE_VERSION: v5.4.3
  HELM_VERSION: v3.16.4
  CADDY_VERSION: 2.10.2
  KIND_VERSION: v0.30.0
  KUBECTL_VERSION: v1.34.0
  CARGO_INCREMENTAL: '0'
  AGENT_SANDBOX_SHA: c94d9c62aef662d8445fbce487d9b1c889ed7ff6
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: 0.23.0

# Forgejo assigns static jobs before their step conditions can make them cheap.
# The trusted selector therefore emits an empty or one-cell matrix for each
# bounded capability group. Unselected groups create no runner task; selected
# groups retain their fixed capability profile and timeout. Candidate policy
# cannot reduce work because PR matrices come from the exact trusted base.
# A canonical squash whose tree exactly matches a fully green PR head emits
# empty matrices. Receipt-control changes always take the full path, and every
# rejected receipt falls back to the ordinary selected suite.
# A pull request runs every family its paths select, as a push to main does,
# except Kind, which it runs only with the ci-full label (#3119 step 2.1).
# Temporarily (owner decision 2026-10-20) a push to main runs no Kind while
# scripts/ci/select/main-push-switch.sh says so. Kind still runs on a
# dispatched release candidate, on a ci-full pull request, and on the
# four-hourly schedule, which runs Kind alone.
# Forgejo hands jobs to runners first in, first out. A main push's Heavy jobs
# select the trusted runner variables (CODEWIRE_CI_RUNNER_TRUSTED_HEAVY,
# _MEDIUM and _KIND), whose runners serve main first, so main never waits behind queued
# pull requests; every other run, a scheduled one included, selects the
# untrusted ones. Runner labels are repository Actions variables
# (docs/dev/CI-CONFIGURATION.md); an unset one leaves the job queued on an
# `unset-<variable>` label that no runner advertises.
jobs:
  verification-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job receives no write-capable integration.
    name: Verification selection
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # A closed pull request verifies nothing; every other job needs this one.
    if: ${{ github.event.action != 'closed' }}
    outputs:
      selector_version: ${{ steps.select.outputs.selector_version }}
      classification: ${{ steps.select.outputs.classification }}
      selection: ${{ steps.select.outputs.selection }}
      required_local_mode: ${{ steps.select.outputs.required_local_mode }}
      ci_head_commit: ${{ steps.select.outputs.ci_head_commit }}
      push_verified_base: ${{ steps.select.outputs.push_verified_base }}
      ci_head_tree: ${{ steps.select.outputs.ci_head_tree }}
      cw_package_state: ${{ steps.select.outputs.cw_package_state }}
      cw_package_selected: ${{ steps.select.outputs.cw_package_selected }}
      desktop_package_state: ${{ steps.select.outputs.desktop_package_state }}
      desktop_package_selected: ${{ steps.select.outputs.desktop_package_selected }}
      tested_tree_receipt: ${{ steps.receipt.outputs.tested_tree_receipt }}
      tested_tree_reason: ${{ steps.receipt.outputs.tested_tree_reason }}
      tested_tree_pr: ${{ steps.receipt.outputs.tested_tree_pr }}
      tested_tree_head: ${{ steps.receipt.outputs.tested_tree_head }}
      tested_tree_run: ${{ steps.receipt.outputs.tested_tree_run }}
      policy_expected: ${{ steps.dispatch.outputs.policy_expected }}
      # Contracts left Standard for its own job (infra#1534). A trusted base
      # that predates the split runs it whenever it runs Standard; the job's
      # steps then do nothing unless Contracts is selected.
      contracts_expected: ${{ steps.dispatch.outputs.contracts_expected || steps.dispatch.outputs.standard_expected }}
      standard_expected: ${{ steps.dispatch.outputs.standard_expected }}
      tooling_expected: ${{ steps.dispatch.outputs.tooling_expected }}
      rust_compile_expected: ${{ steps.dispatch.outputs.rust_compile_expected }}
      # A trusted base that predates the separate shard decision runs the
      # shards with the Rust group.
      rust_shards_expected: ${{ steps.dispatch.outputs.rust_shards_expected || steps.dispatch.outputs.rust_transport_expected }}
      rust_transport_expected: ${{ steps.dispatch.outputs.rust_transport_expected }}
      database_expected: ${{ steps.dispatch.outputs.database_expected }}
      services_control_expected: ${{ steps.dispatch.outputs.services_control_expected }}
      services_runtime_expected: ${{ steps.dispatch.outputs.services_runtime_expected }}
      edge_kind_expected: ${{ steps.dispatch.outputs.edge_kind_expected }}
      superseded: ${{ steps.superseded.outputs.superseded }}
      superseded_by: ${{ steps.superseded.outputs.superseded_by }}
      kind_workspace_source: ${{ steps.kind-workspace.outputs.kind_workspace_source }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # The commit this run verifies: its own, or, for a Kind dispatch, the
      # earlier main commit it names, so a release candidate is verified while
      # main moves on. Every later step and job uses that commit's checkout;
      # the release tag receipt reads the line this prints.
      - name: Choose the commit this run verifies
        id: source
        env:
          DISPATCH_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          VERIFICATION_REQUEST: ${{ github.event.inputs.verification }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_SOURCE_SHA:-}" ] && [ "${VERIFICATION_REQUEST:-}" != edge_kind ]; then
            echo '::error::source_sha verifies Kind only: dispatch it with verification=edge_kind'
            exit 1
          fi
          scripts/ci/select/dispatch-source.sh .gitea/workflows/ci.yaml

      - name: Check out the commit this run verifies
        env:
          VERIFICATION_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: git checkout -q --detach "$VERIFICATION_SOURCE_SHA"

      - name: Verify CI runner image contract
        run: |
          scripts/ci/setup/assert-ci-runner-image.sh
          scripts/ci/tests/test-ci-runner-image-contract.sh

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ci-policy
          fetch-depth: 0
          persist-credentials: false

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        with:
          ref: ${{ github.event.before }}
          path: .trusted-ci-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Verify sealed Rust toolchain for trusted artifact planning
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      # A scheduled run checks Kind against the commit the last successful
      # scheduled run checked. Only a scheduled run reads it.
      - name: Find the last successful scheduled run
        id: schedule-baseline
        if: ${{ github.event_name == 'schedule' }}
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/select/last-scheduled-run.py --workflow ci.yaml --github-output

      - name: Select capabilities and artifact facts
        id: select
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          SCHEDULE_BASELINE_SHA: ${{ steps.schedule-baseline.outputs.schedule_baseline }}
          VERIFICATION_REQUEST: ${{ github.event.inputs.verification }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFICATION_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          # A push to main reads whether its previous main run verified that
          # commit (plan-main-push.py); no other event receives the token here.
          GITEA_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: |
          set -euo pipefail
          case "${VERIFICATION_REQUEST:-}" in
            rust-stack|go-tailnet)
              echo "::error::manual diagnostics are retired; run scripts/ci/verify/rust-stack-rehearsal.sh or scripts/ci/verify/tailnet-parity.sh locally"
              exit 1
              ;;
          esac

          workflow_output="$GITHUB_OUTPUT"
          capability_output="$(mktemp)"
          plan_output="$(mktemp)"
          facts_output="$(mktemp)"
          trap 'rm -f "$capability_output" "$plan_output" "$facts_output"' EXIT
          capability_selector='scripts/ci/select/select-verification.sh'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            capability_selector='.trusted-ci-policy/scripts/ci/select/select-verification.sh'
          fi
          [ -f "$capability_selector" ]
          # A push to main verifies everything since the newest main commit
          # whose own run verified it: a superseded run verified nothing
          # (#3176). Without such a commit, or when it cannot be read, the
          # push selects all product verification.
          selector_before="$PUSH_BEFORE_SHA"
          push_base_unverified=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            base_output="$(mktemp)"
            verified_base=''
            if python3 -I -B scripts/ci/plan/main-ci-verdict.py base \
                --head "$GITHUB_SHA" --before "$PUSH_BEFORE_SHA" --output "$base_output"; then
              verified_base="$(sed -n 's/^push_verified_base=//p' "$base_output")"
            fi
            rm -f "$base_output"
            if [[ "$verified_base" =~ ^[0-9a-f]{40}$ ]]; then
              selector_before="$verified_base"
            else
              verified_base=''
              push_base_unverified=true
            fi
            printf 'push_verified_base=%s\n' "$verified_base" >> "$workflow_output"
          fi
          PUSH_BEFORE_SHA="$selector_before" PUSH_BASE_UNVERIFIED="$push_base_unverified" \
            GITHUB_OUTPUT="$capability_output" "$capability_selector"
          grep -Fxq 'selector_version=v3' "$capability_output"
          cat "$capability_output" >> "$workflow_output"
          # The artifact facts go to their own file first; see the end.
          export GITHUB_OUTPUT="$facts_output"

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            trusted_planner='.trusted-ci-policy/scripts/ci/plan/planner.py'
            python3 "$trusted_planner" \
              --repository . \
              --target-base "$PR_BASE_SHA" \
              --head "$GITHUB_SHA" \
              --trusted-policy "$PR_BASE_SHA" \
              --output "$plan_output"
            if jq -e '.degraded_reasons | length > 0' "$plan_output" >/dev/null; then
              echo 'Trusted artifact planner degraded; affected artifacts remain selected:'
              jq -c '.degraded_reasons' "$plan_output"
            fi
            trusted_adapter='.trusted-ci-policy/scripts/ci/plan/apply-verification-plan.py'
            python3 "$trusted_adapter" --plan "$plan_output"
          else
            # A push to main plans its artifact facts with the previous main's
            # trusted policy, against that commit when its own run verified
            # it (plan-main-push.py). A dispatch, a policy that predates the
            # planner, or any planner failure keeps every artifact selected.
            main_push_planner='.trusted-ci-policy/scripts/ci/plan/plan-main-push.py'
            if [ "$GITHUB_EVENT_NAME" = push ] && [ -f "$main_push_planner" ] \
                && python3 -I -B "$main_push_planner" \
                  --repository . \
                  --head "$GITHUB_SHA" \
                  --before "$PUSH_BEFORE_SHA" \
                  --output "$plan_output"; then
              cat "$plan_output" >> "$GITHUB_OUTPUT"
            else
              echo 'main artifact facts: no trusted main-push plan; every artifact stays selected'
              python3 scripts/ci/plan/apply-verification-plan.py \
                --unclassified \
                --head "$VERIFICATION_SOURCE_SHA" \
                --head-tree "$(git rev-parse "$VERIFICATION_SOURCE_SHA^{tree}")"
            fi
          fi
          # The trusted selector's workspace-pin change class (owner,
          # 2026-10-24) changes only the pin's constants, which Policy's pin
          # check proves are the generator's exact output: no cw or desktop
          # build can break on it, so those artifact facts are cleared.
          if grep -q '^selection=.*|change_class_workspace_pin|' "$capability_output"; then
            echo 'artifact facts: workspace-pin change class; the cw and desktop packages build nothing'
            sed -E 's/^(cw_package_selected|desktop_package_selected)=.*/\1=false/' "$facts_output" >> "$workflow_output"
          else
            cat "$facts_output" >> "$workflow_output"
          fi

      - name: Verify exact tested-tree receipt
        id: receipt
        env:
          GITEA_TOKEN: ${{ github.token }}
          # A receipt covers only its pull request's change, so it stands for
          # a push only when main CI verified the commit it merged onto.
          PUSH_VERIFIED_BASE: ${{ steps.select.outputs.push_verified_base }}
        run: |
          set -euo pipefail
          receipt_checker='scripts/ci/receipts/verify-tested-tree-receipt.sh'
          if [ -f .trusted-ci-policy/scripts/ci/receipts/verify-tested-tree-receipt.sh ]; then
            receipt_checker='.trusted-ci-policy/scripts/ci/receipts/verify-tested-tree-receipt.sh'
          fi
          "$receipt_checker"

      # Main runs start at once, each in its own group. A main push whose
      # selection starts after main moved on records which commit superseded
      # it and dispatches no capability group: the newer commit's run verifies
      # the cumulative change, because a push selects from the newest commit
      # main CI verified (#3176), walking past any run that is still pending.
      # The run for main's tip always verifies everything selected, and a run
      # that has started its groups is never stopped.
      - name: Skip a superseded main commit
        id: superseded
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != push ] || [ "$EVENT_REF" != refs/heads/main ]; then
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          canonical_main_sha="$(
            git ls-remote origin refs/heads/main |
              awk '$2 == "refs/heads/main" { print $1 }'
          )"
          [[ "$canonical_main_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$canonical_main_sha" == "$GITHUB_SHA" ]]; then
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'superseded=true\nsuperseded_by=%s\n' "$canonical_main_sha" >> "$GITHUB_OUTPUT"
          message="superseded by ${canonical_main_sha}: main's queued run verifies this commit's changes"
          echo "$message"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kind runs the published, digest-pinned workspace image unless this
      # change alters the image definition (images/base, images/workspace).
      # The sandbox daemon `cw` comes from the exact-source daemon image, so the
      # workspace's own `cw` is not under test. The exact-source workspace
      # image is verified where it is built: in support-images, which runs the
      # workspace contract on the image it publishes from main (#3119 A12).
      - name: Choose the Kind workspace image source
        id: kind-workspace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          VERIFICATION_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          base=''
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
          esac
          python3 -B scripts/ci/verify/kind-build-artifacts.py workspace-source \
            --head "$VERIFICATION_SOURCE_SHA" --base "$base" --github-output

      - name: Emit trusted capability dispatch decisions
        id: dispatch
        env:
          VERIFICATION_SUPERSEDED: ${{ steps.superseded.outputs.superseded }}
          VERIFICATION_SELECTION: ${{ steps.select.outputs.selection }}
          VERIFICATION_TESTED_TREE_RECEIPT: ${{ steps.receipt.outputs.tested_tree_receipt }}
          CW_PACKAGE_SELECTED: ${{ steps.select.outputs.cw_package_selected }}
          DESKTOP_PACKAGE_SELECTED: ${{ steps.select.outputs.desktop_package_selected }}
          # Read only by a pull request's trusted dispatcher that predates the
          # removal of Container contract verification (#3119 A12).
          WORKSPACE_IMAGE_SELECTED: ${{ steps.select.outputs.workspace_image_selected }}
        run: |
          set -euo pipefail
          dispatch_selector='scripts/ci/select/emit-verification-matrices.sh'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            trusted_dispatch_selector='.trusted-ci-policy/scripts/ci/select/emit-verification-matrices.sh'
            if [ -x "$trusted_dispatch_selector" ]; then
              dispatch_selector="$trusted_dispatch_selector"
            else
              # Conservative bootstrap for a base predating dynamic dispatch:
              # run every group so candidate code cannot omit required work.
              for group in \
                  policy contracts standard tooling rust_compile rust_shards rust_transport database \
                  services_control services_runtime edge_kind; do
                echo "${group}_expected=true" >> "$GITHUB_OUTPUT"
              done
              exit 0
            fi
          fi
          "$dispatch_selector"

  policy:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    # Baseline repository contracts are non-Docker checks over sealed tools.
    # They admit owner-private checkouts and temp roots, which only a metal
    # guest's job-private /data and /tmp provide; the light runner's emptyDir
    # roots are world-writable. So Policy runs on the medium class (infra#1534:
    # each job on exactly the slot it needs), not light. The measured full
    # ShellCheck phase joins the tooling group only when trusted selection
    # requests it.
    name: Policy verification
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM') }}
    timeout-minutes: 30
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.policy_expected == 'true' }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'policy content verification inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          fetch-depth: 0

      - name: Bound cargo jobs by memory
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/bound-cargo-jobs.sh

      - name: Verify sealed policy tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|policy|') }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Run Policy
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|policy|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh policy-core

  contracts:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    # Contracts in its own job, beside Standard (infra#1534): it ran alone at
    # the head of Standard for about 175 s on main (run 23934) before any
    # other Standard family started. It regenerates the checked-in generated
    # code (libs/gen-go, libs/gen-python, packages/codewire-proto-ts/src/gen)
    # in its own checkout and fails when that differs from what is checked
    # in, so the other families read the checked-in code and the run's
    # verdict is the same. Medium, as Standard: it needs the warm Rust cache.
    name: Contracts verification
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM') }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.contracts_expected == 'true' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'contracts content verification inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          fetch-depth: 0

      # On a main push or a pull request in a metal guest, start from that
      # guest's warm Rust and Go caches (infra#1534); anywhere else this
      # changes nothing.
      - name: Select the warm Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          CODEWIRE_WARM_CACHE_EPOCH: ${{ vars.CODEWIRE_WARM_CACHE_EPOCH }}
        run: scripts/ci/setup/select-warm-rust-cache.sh

      - name: Bound cargo jobs by memory
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/bound-cargo-jobs.sh

      - name: Set up Go 1.27.3
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        run: scripts/ci/setup/setup-go.sh 1.27.3

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select best-effort shared Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - uses: noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        with:
          bun-version: '1.4.4'

      # run-product-verification.sh contracts installs its own pinned buf,
      # protoc and protoc plugins (install_contract_toolchain).
      - name: Run Contracts
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          VERIFICATION_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFICATION_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci/verify/run-product-verification.sh contracts

      - name: Report and clean Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Report the warm Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/finish-warm-rust-cache.sh

  standard:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    # Medium, not light (infra#1534): it needs Docker (DinD) and the warm Rust
    # cache at /ci-cache, which the cloud light runner has neither of.
    name: Standard verification
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM') }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.standard_expected == 'true' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'standard content verification inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          fetch-depth: 0

      # On a main push or a pull request in a metal guest, start from that
      # guest's warm Rust and Go caches (infra#1534); anywhere else this
      # changes nothing.
      - name: Select the warm Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          CODEWIRE_WARM_CACHE_EPOCH: ${{ vars.CODEWIRE_WARM_CACHE_EPOCH }}
        run: scripts/ci/setup/select-warm-rust-cache.sh

      - name: Bound cargo jobs by memory
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/bound-cargo-jobs.sh

      - name: Set up Go 1.27.3
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|go_support|') || contains(needs.verification-selection.outputs.selection, '|sdk_go|')) }}
        run: scripts/ci/setup/setup-go.sh 1.27.3

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|go_tailnet|') || contains(needs.verification-selection.outputs.selection, '|go_consumer_interop|')) }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select best-effort shared Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|go_tailnet|') || contains(needs.verification-selection.outputs.selection, '|go_consumer_interop|') || contains(needs.verification-selection.outputs.selection, '|web|')) }}
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Install pinned protoc for Rust-backed standard checks
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|go_tailnet|') || contains(needs.verification-selection.outputs.selection, '|go_consumer_interop|')) }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          rm -rf "$HOME/.proto-tools/protoc"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - uses: noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|web|') }}
        with:
          bun-version: '1.4.4'

      # A pinned, checksum-verified Node.js from nodejs.org: the setup-node
      # action first waited 133 s for github.com, which CI cannot reach.
      - name: Set up Node.js 22.23.4
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|sdk_ts|') }}
        run: scripts/ci/setup/setup-node.sh 22.23.4

      # The selected Standard families in one step (run-product-verification.sh
      # standard owns each family's selection condition, as its own step had):
      # Web side by side with Go support, Docs, the three SDKs and iOS in
      # order, so the job takes the longer of the two. Contracts runs in its
      # own job beside this one. The first failure stops the rest (#3013).
      - name: Run the selected Standard families side by side
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          VERIFICATION_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFICATION_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci/verify/run-product-verification.sh standard

      - name: Report and clean Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|go_tailnet|') || contains(needs.verification-selection.outputs.selection, '|go_consumer_interop|') || contains(needs.verification-selection.outputs.selection, '|web|')) }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Report the warm Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/finish-warm-rust-cache.sh

  tooling:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    # Give repository tooling and delivery-contract checks an independent
    # general-heavy slot so an all-selected policy change does not serialize
    # them behind language and SDK verification. These checks still need the
    # dependency egress and compute budget intentionally absent from the light runner.
    name: Tooling / delivery contract verification
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM') }}
    timeout-minutes: 30
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.tooling_expected == 'true' }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'tooling content verification inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          fetch-depth: 0

      - name: Bound cargo jobs by memory
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/bound-cargo-jobs.sh

      - name: Set up Go 1.27.3 for security checks
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|security_go|') }}
        run: scripts/ci/setup/setup-go.sh 1.27.3

      - uses: noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|dev_smoke_script_tests|') }}
        with:
          bun-version: '1.4.4'

      - name: Verify sealed delivery-contract tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|deploy|') || contains(needs.verification-selection.outputs.selection, '|release|') || contains(needs.verification-selection.outputs.selection, '|security|')) }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      # The selected Tooling families run side by side in one step, so the job
      # takes its slowest family's time rather than their sum (infra#1534),
      # and the first failure stops the rest (#3013). run-product-verification.sh
      # tooling owns each family's selection condition and gives each the
      # environment its own step had:
      # - ShellCheck: on policy_shell, or policy without policy_shell_omittable;
      #   a pull request checks only the scripts it changes, and a push to main
      #   those changed since the newest main commit main CI verified, the base
      #   its selection compared with (#3119 A7, M1); an unverified main base
      #   leaves it empty, and every script is checked;
      # - confidential and Dev smoke script tests, delivery (release), Deploy,
      #   the workspace agents check (a lockfile-only change to the workspace
      #   image's agents installs that lockfile and starts each agent; owner,
      #   2026-10-24), Security and Edge: each on its own token;
      # - Edge static verification needs no cluster, so it runs here rather
      #   than in a Kind shard, and an edge-only selection starts no Kind leg;
      #   the Kind tool tests follow only when the selection names them
      #   (#3119 R8).
      - name: Run the selected Tooling families side by side
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          CODEWIRE_SHELL_POLICY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verification-selection.outputs.push_verified_base) || '' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: scripts/ci/verify/run-product-verification.sh tooling

  rust-compile:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job requests no identity and reads no protected credential: it builds in its build runner's own warm folder, never the shared cache.
    # Compile once (infra#1632): every run builds its test archives on a build
    # runner, whose persistent build disk keeps a warm build folder. It runs
    # build-once.sh's legs, every test archive at once under one jobserver,
    # and publishes each leg's archive to an archive store; the test jobs run
    # from those archives and compile nothing. The checks that build no
    # archive run beside the tests in Rust checks. A main push uses the main
    # build runner, its build folder /ci-cache/main and the main archive
    # store, which only main's guests reach; every other run uses the pull
    # request build runner, /ci-cache/pr and the pull request archive store.
    name: Build test archives
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_BUILD || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_BUILD') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_BUILD || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_BUILD') }}
    # A cold build of every leg, after a lockfile or toolchain change, took
    # 27 min with its legs one after another (run 22438); they now all run at
    # once. Warm builds stay far below; the bound holds a cold one under the
    # 90-minute task budget.
    timeout-minutes: 60
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.rust_compile_expected == 'true' }}
    outputs:
      archive_sha256: ${{ steps.publish.outputs.archive_sha256 }}
      database_sha256: ${{ steps.publish.outputs.database_sha256 }}
      services_control_sha256: ${{ steps.publish.outputs.services_control_sha256 }}
      services_runtime_sha256: ${{ steps.publish.outputs.services_runtime_sha256 }}
      features_sha256: ${{ steps.publish.outputs.features_sha256 }}
      local_vmm_sha256: ${{ steps.publish.outputs.local_vmm_sha256 }}
    env:
      # The build runner's warm build folder (build-once.sh prepare).
      BUILD_ONCE_TREE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/ci-cache/main' || '/ci-cache/pr' }}
      CARGO_HOME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/ci-cache/main/cargo-home' || '/ci-cache/pr/cargo-home' }}
      ARCHIVE_STORE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_ARCHIVE_STORE_TRUSTED || 'http://ci-archive-main.forgejo-ci-archive.svc:8090') || 'http://ci-archive-pr.forgejo-ci-archive.svc:8090' }}
      # The build legs of Rust / transport verification's local-vmm shard and
      # its artifact-selected desktop package (build-once.sh).
      BUILD_ONCE_LOCAL_VMM: ${{ contains(needs.verification-selection.outputs.selection, '|transport|') || contains(needs.verification-selection.outputs.selection, '|rust_pkg_codewire_desktop|') || needs.verification-selection.outputs.desktop_package_selected == 'true' }}
      DESKTOP_PACKAGE_SELECTED: ${{ needs.verification-selection.outputs.desktop_package_selected }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'Rust compilation inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      # The disk bound keeps the legs this job is about to build, which the
      # selection decides.
      - name: Bring the warm build folder to this commit
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/setup/build-once.sh prepare "$GITHUB_WORKSPACE" build

      # The legs build-once.sh lists; a leg wanted only for a selected family
      # (selected:TOKEN) reads the selection.
      - name: Run the build legs
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/setup/build-once.sh build "$RUNNER_TEMP/build-once-out"

      - name: Publish the test archives
        id: publish
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/build-once.sh publish "$RUNNER_TEMP/build-once-out"

  rust-checks:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job requests no identity and reads no protected credential: it checks in its build runner's own warm folder, never the shared cache.
    # Compile once (infra#1632): the Rust checks that build no test archive,
    # on the build runner that just built this run's archives (main's for a
    # main push), all at once under one jobserver, each in its own warm target
    # folder of the build folder (build-once.sh checks):
    # compile-all-targets (clippy over every target with default and all
    # features, and the curated image workspaces), the feature graphs' lints
    # and dependency checks, the local-vmm shard's checks (its Darwin
    # cross-check, the static guest's reproducibility proof, the desktop check
    # and package) and the cw Darwin cross-check (run-rust-checks.sh). One
    # after another they used 6.6 of the runner's cores (run 24112, #3494). It
    # starts once Build test archives ends; the test jobs do not wait for it,
    # and Required verification does. On a medium guest with only the shared
    # compiler cache it took about 12 min, against 52 s warm here.
    name: Rust checks
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_BUILD || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_BUILD') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_BUILD || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_BUILD') }}
    timeout-minutes: 45
    needs: [verification-selection, rust-compile]
    if: ${{ needs.verification-selection.outputs.rust_compile_expected == 'true' }}
    env:
      # The build runner's warm build folder (build-once.sh prepare).
      BUILD_ONCE_TREE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/ci-cache/main' || '/ci-cache/pr' }}
      CARGO_HOME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/ci-cache/main/cargo-home' || '/ci-cache/pr/cargo-home' }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'Rust checks inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Bring the warm build folder to this commit
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/build-once.sh prepare "$GITHUB_WORKSPACE" checks

      # The macOS cw and the local VMM link Apple frameworks, so only the
      # protected Mac runner links them (cli-release.yaml and
      # cw-release-dry-run.yaml). Here they are compiled for the Mac targets
      # without the SDK (#3119 A13), with these pinned tools.
      - name: Set up pinned Darwin C cross-check tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (needs.verification-selection.outputs.cw_package_selected == 'true' || contains(needs.verification-selection.outputs.selection, '|transport_pkg_codewire_local_vmm|')) }}
        run: |
          set -euo pipefail
          zig_url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLo zig.tar.xz "$zig_url"
          echo "${ZIG_X86_64_LINUX_SHA256}  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Run the Rust checks
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          CW_PACKAGE_SELECTED: ${{ needs.verification-selection.outputs.cw_package_selected }}
          BUILD_ONCE_LOCAL_VMM: ${{ contains(needs.verification-selection.outputs.selection, '|transport|') || contains(needs.verification-selection.outputs.selection, '|rust_pkg_codewire_desktop|') || needs.verification-selection.outputs.desktop_package_selected == 'true' }}
          DESKTOP_PACKAGE_SELECTED: ${{ needs.verification-selection.outputs.desktop_package_selected }}
        run: scripts/ci/setup/build-once.sh checks

  rust-packages:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    name: Rust / transport packages
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_MEDIUM') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_MEDIUM') }}
    enable-openid-connect: true
    timeout-minutes: 30
    # Compile once (infra#1632): this shard runs the selected packages' tests
    # from the test archive the compile job built on a build runner, fetched
    # and verified by the digest that job reported from the archive store of
    # the run's kind (main or pull request), and compiles nothing. When the
    # store no longer holds it, it warns and compiles here: a miss costs
    # time, never a red run.
    needs: [verification-selection, rust-compile]
    if: ${{ always() && needs.verification-selection.result == 'success' && needs.verification-selection.outputs.rust_shards_expected == 'true' && needs.rust-compile.result == 'success' }}
    env:
      CARGO_HOME: ${{ github.workspace }}/target/ci-rust-cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
      ARCHIVE_STORE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_ARCHIVE_STORE_TRUSTED || 'http://ci-archive-main.forgejo-ci-archive.svc:8090') || 'http://ci-archive-pr.forgejo-ci-archive.svc:8090' }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'Rust packages shard verification inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      # On a main push or a pull request in a metal guest, start from that
      # guest's warm Rust cache (infra#1534); anywhere else this changes nothing.
      - name: Select the warm Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          CODEWIRE_WARM_CACHE_EPOCH: ${{ vars.CODEWIRE_WARM_CACHE_EPOCH }}
        run: scripts/ci/setup/select-warm-rust-cache.sh

      - name: Bound cargo jobs by memory
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: scripts/ci/setup/bound-cargo-jobs.sh

      # Only a metal Kata guest mounts the ext4 warm cache at /ci-cache
      # (infra#1534); a cloud runner can serve the same label. That guest's
      # kernel has no CONFIG_UNIX_DIAG, so native_network_confinement's
      # descriptor proofs skip there and run in the Linux release host check
      # (owner, 2026-10-21, codewire#2940).
      - name: Declare a metal Kata guest
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        run: |
          if [[ "$(stat -f -c %T /ci-cache 2>/dev/null)" == ext2/ext3 ]]; then
            echo 'CODEWIRE_CI_METAL_KATA_GUEST=1' >> "$GITHUB_ENV"
          fi

