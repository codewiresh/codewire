    if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.superseded != 'true' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      CODEWIRE_VERIFICATION_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
      CODEWIRE_IMAGE_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          persist-credentials: false

      - name: Verify sealed producer tools
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select existing compiler cache
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local' || github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Build exact Kind service images
        run: scripts/ci/images/build-kind-images.sh dashboard services mesh

      - name: Clean compiler cache credentials
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Export non-promotable product images
        id: export
        run: python3 -B scripts/ci/verify/kind-build-artifacts.py produce product "$RUNNER_TEMP/kind-product-out"

      - name: Upload successful product output
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-product-out/
          if-no-files-found: error
          retention-days: 1

  kind-daemon:
    # zizmor: ignore[excessive-permissions] Existing untrusted cache identity only; non-promotable image.
    # The daemon image carries the static CW from the sealed producer. It builds
    # on its own worker, beside the three service images.
    name: Kind daemon image build
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_KIND') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_KIND') }}
    enable-openid-connect: true
    timeout-minutes: 35
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.superseded != 'true' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      CODEWIRE_VERIFICATION_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
      CODEWIRE_IMAGE_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          persist-credentials: false

      - name: Verify sealed producer tools
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select existing compiler cache
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local' || github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Build exact Kind daemon image
        run: scripts/ci/images/build-kind-images.sh daemon

      - name: Clean compiler cache credentials
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Export non-promotable daemon image
        id: export
        run: python3 -B scripts/ci/verify/kind-build-artifacts.py produce daemon "$RUNNER_TEMP/kind-daemon-out"

      - name: Upload successful daemon output
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-daemon-out/
          if-no-files-found: error
          retention-days: 1

  kind-smokes:
    # zizmor: ignore[excessive-permissions] Existing untrusted cache identity only; synthetic test binaries.
    name: Kind smoke binary build
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_KIND') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_KIND') }}
    enable-openid-connect: true
    timeout-minutes: 35
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.superseded != 'true' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      CODEWIRE_VERIFICATION_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/kind-ci
      RUN_DIR: ${{ github.workspace }}/.tmp/kind-smoke-build
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          persist-credentials: false

      - name: Verify sealed producer tools
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select existing compiler cache
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local' || github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Install pinned protoc for Rust compilation
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Build all host smoke and contract binaries
        run: |
          mkdir -p "$RUN_DIR"
          scripts/ci/images/build-kind-smokes.sh "$RUN_DIR/billing-contract-build.jsonl"

      - name: Clean compiler cache credentials
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Export only completed smoke executables
        id: export
        run: python3 -B scripts/ci/verify/kind-build-artifacts.py produce smokes "$RUNNER_TEMP/kind-smokes-out"

      - name: Upload successful smoke output
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-smokes-out/
          if-no-files-found: error
          retention-days: 1

  edge-kind:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    name: Edge / Kind verification (${{ matrix.shard.slug }})
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_KIND') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_KIND') }}
    # Builds run on independent producers; every shard leg imports the exact
    # same outputs, brings up its own disposable cluster, and runs only its
    # mapped retained suites, so the gate's wall time is its longest shard
    # instead of their serial sum. Required verification needs the one matrix
    # job, so every shard must be green.
    timeout-minutes: 45
    needs: [verification-selection, kind-workspace, kind-product, kind-daemon, kind-smokes]
    if: ${{ always() && needs.verification-selection.result == 'success' && needs.verification-selection.outputs.edge_kind_expected == 'true' && (needs.verification-selection.outputs.tested_tree_receipt == 'accepted' || !contains(needs.verification-selection.outputs.selection, '|kind|') || ((needs.kind-workspace.result == 'success' || (needs.verification-selection.outputs.kind_workspace_source == 'pinned' && needs.kind-workspace.result == 'skipped')) && needs.kind-product.result == 'success' && needs.kind-daemon.result == 'success' && needs.kind-smokes.result == 'success')) }}
    strategy:
      fail-fast: true
      matrix:
        shard:
          # environment: service/exec/FileService/resize, Temporal workflow and
          # final fencing, then product-runtime acceptance, including the
          # reconciler TTL gate with its nested sandbox supply-chain
          # observation. This is the serial gate's order. Sandbox supply-chain
          # provenance is observed only while the TTL acceptance's
          # product-created workspace is alive; a standalone invocation would
          # see only self-cleaned workspace-service fixtures and fail by design.
          - slug: environment
            suites: workspace-services final-fencing runtime-acceptance
          # dashboard: the full Rust dashboard Playwright suite. Its per-worker
          # identities (#2381) let the suite run four workers in this leg, as
          # make kind-test does; the full local gate keeps one.
          - slug: dashboard
            suites: dashboard-browser
            playwright_workers: 4
          # workspace: the synthetic credential journey (bootstrap, native
          # acceptance and the Claude stages) alone. It is the longest suite,
          # so it shares its leg with nothing (#2970).
          - slug: workspace
            suites: credentials
          # edge: host-key/edge/Connect contract plus the coordinator runtime
          # and billing Connect contract (the integrated gate's remainder).
          - slug: edge
            suites: edge-contract integrated
    env:
      CODEWIRE_VERIFICATION_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
      CODEWIRE_EXPECTED_SOURCE_SHA: ${{ needs.verification-selection.outputs.ci_head_commit }}
      CODEWIRE_EXPECTED_SOURCE_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
      CODEWIRE_PLAYWRIGHT_SNAPSHOT_ENV: ubuntu24-cft145
      KIND_INGRESS_CONTROLLER_IMAGE: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}/oci-approved/ingress-nginx/controller@sha256:5c2a1b6c03c4d18ecf14685d21a32bf6763a022f6f8cc07e9578f6cd5eca6180
      KIND_INGRESS_CERTGEN_IMAGE: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}/oci-approved/ingress-nginx/kube-webhook-certgen@sha256:334191231352856e1ec0c3e50f966edb59ec94a51906453d09f5820789e8b053
      KIND_AGENT_SANDBOX_IMAGE: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}/oci-approved/codewire/agent-sandbox-controller@sha256:fb3b81ff40a5ef07a455f1e81f2af3a9b0884ed801238e018008184520044595
      KIND_WORKSPACE_IMAGE: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}/oci-approved/codewire/workspace@sha256:cf91240f0706a5b3da81485fbf87d65973b18d4f1067f630bc5fd513b38d1510
      KIND_DIND_IMAGE: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}/oci-approved/docker/dind@sha256:66fd272fc375aad4c8fa06351c414e15bffe8cb015c171e1b8a8efe36a72cc1e
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/kind-ci
      CODEWIRE_KIND_PRODUCT_IMAGE_MODE: prebuilt-ci
      CODEWIRE_KIND_PRODUCT_MANIFEST_SHA256: ${{ needs.kind-product.outputs.manifest_sha256 }}
      CODEWIRE_KIND_DAEMON_MANIFEST_SHA256: ${{ needs.kind-daemon.outputs.manifest_sha256 }}
      CODEWIRE_KIND_SMOKES_MANIFEST_SHA256: ${{ needs.kind-smokes.outputs.manifest_sha256 }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'edge and Kind content verification inherited from the exact tested PR-head tree'

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - uses: noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && matrix.shard.slug == 'dashboard' }}
        with:
          bun-version: '1.4.4'

      - name: Install locked dashboard browser-test dependencies
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && matrix.shard.slug == 'dashboard' }}
        run: |
          set -euo pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 bun install --frozen-lockfile --ignore-scripts
          chromium="$(scripts/ci/install-pinned-playwright-chromium.sh)"
          "$chromium" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium" >> "$GITHUB_ENV"

      - name: Verify Kind runner tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh
          mkdir -p "$HOME/.local/bin"
          cd /tmp
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          install kubectl "$HOME/.local/bin/kubectl"
          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Require fresh artifact download directories outside the checkout
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        run: |
          set -euo pipefail
          CODEWIRE_KIND_ARTIFACT_ROOT="$RUNNER_TEMP/kind-inputs"
          test ! -e "$CODEWIRE_KIND_ARTIFACT_ROOT"
          test ! -L "$CODEWIRE_KIND_ARTIFACT_ROOT"
          case "$(realpath "$RUNNER_TEMP")" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) exit 1 ;;
          esac
          mkdir -m 700 "$CODEWIRE_KIND_ARTIFACT_ROOT"
          printf 'CODEWIRE_KIND_ARTIFACT_ROOT=%s\n' "$CODEWIRE_KIND_ARTIFACT_ROOT" >> "$GITHUB_ENV"

      - name: Download exact workspace producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned' }}
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: ${{ needs.kind-workspace.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/workspace

      # The same producer the Kind workspace job runs, for the pinned workspace:
      # it writes only the pin record (no Docker), and the gate pulls that digest.
      - name: Write the pinned workspace record
        id: pinned-workspace
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source == 'pinned' }}
        env:
          CODEWIRE_KIND_WORKSPACE_SOURCE: pinned
        run: python3 -B scripts/ci/verify/kind-build-artifacts.py produce workspace "$CODEWIRE_KIND_ARTIFACT_ROOT/workspace"

      - name: Download exact product producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: ${{ needs.kind-product.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/product

      - name: Download exact daemon producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: ${{ needs.kind-daemon.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/daemon

      - name: Download exact smoke producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: ${{ needs.kind-smokes.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/smokes

      - name: Run the shard Kind gate
        # up and the suites must share one process: the remote DinD network
        # attachment and loopback forwarders are process state, so separate
        # steps would strand the shard's cluster before its first suite.
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        env:
          KIND_CLUSTER_NAME: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CLUSTER: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CODEWIRE_KIND_PROFILE_ROOT: ${{ runner.temp }}/kind-profiles
          KIND_SHARD_SUITES: ${{ matrix.shard.suites }}
          CODEWIRE_KIND_DASHBOARD_WORKERS: ${{ matrix.shard.playwright_workers }}
          # The workspace manifest comes from this shard's own pin record when
          # the workspace is pinned, and from the workspace job otherwise.
          CODEWIRE_KIND_WORKSPACE_MANIFEST_SHA256: ${{ needs.verification-selection.outputs.kind_workspace_source == 'pinned' && steps.pinned-workspace.outputs.manifest_sha256 || needs.kind-workspace.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          read -r -a suites <<<"$KIND_SHARD_SUITES"
          scripts/ci/verify/kind-e2e.sh shard "${suites[@]}"

      - name: Upload dashboard browser test results on failure
        # The dashboard leg's Playwright error contexts (error-context.md,
        # screenshots, traces) are the only rendered-DOM evidence when a
        # browser spec fails on a shard cluster. Upload them before teardown.
        if: ${{ failure() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && matrix.shard.slug == 'dashboard' }}
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: kind-dashboard-test-results-${{ github.run_id }}-${{ matrix.shard.slug }}
          path: apps/dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload dashboard browser JSON report
        # Every test's duration, retries and outcome, from every dashboard
        # run, green or red, so slow and flaky tests are visible (#2974).
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && matrix.shard.slug == 'dashboard' }}
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: kind-dashboard-json-report-${{ github.run_id }}-${{ matrix.shard.slug }}
          path: apps/dashboard/test-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete the shard Kind cluster
        # The saved profile proves nonce and node identity before deletion;
        # startup refusal never grants authority over a same-named cluster.
        # Keep teardown best-effort on a transient DinD failure.
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        env:
          KIND_CLUSTER_NAME: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CLUSTER: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CODEWIRE_KIND_PROFILE_ROOT: ${{ runner.temp }}/kind-profiles
        run: scripts/ci/verify/kind-e2e.sh down || true

  required-verification:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this aggregator receives no write-capable integration.
    name: Required verification
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    if: ${{ always() && github.event.action != 'closed' }}
    needs:
      - verification-selection
      - policy
      - contracts
      - standard
      - tooling
      - rust-compile
      - rust-checks
      - rust-packages
      - rust-features
      - rust-transport
      - database
      - services-control
      - services-runtime
      - edge-kind
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Require capability groups
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          VERIFICATION_SELECTION_RESULT: ${{ needs.verification-selection.result }}
          VERIFICATION_TESTED_TREE_RECEIPT: ${{ needs.verification-selection.outputs.tested_tree_receipt }}
          VERIFICATION_TESTED_TREE_REASON: ${{ needs.verification-selection.outputs.tested_tree_reason }}
          VERIFICATION_TESTED_TREE_PR: ${{ needs.verification-selection.outputs.tested_tree_pr }}
          VERIFICATION_TESTED_TREE_HEAD: ${{ needs.verification-selection.outputs.tested_tree_head }}
          VERIFICATION_TESTED_TREE_RUN: ${{ needs.verification-selection.outputs.tested_tree_run }}
          VERIFICATION_POLICY_EXPECTED: ${{ needs.verification-selection.outputs.policy_expected }}
          VERIFICATION_POLICY_RESULT: ${{ needs.policy.result }}
          VERIFICATION_CONTRACTS_EXPECTED: ${{ needs.verification-selection.outputs.contracts_expected }}
          VERIFICATION_CONTRACTS_RESULT: ${{ needs.contracts.result }}
          VERIFICATION_STANDARD_EXPECTED: ${{ needs.verification-selection.outputs.standard_expected }}
          VERIFICATION_STANDARD_RESULT: ${{ needs.standard.result }}
          VERIFICATION_TOOLING_EXPECTED: ${{ needs.verification-selection.outputs.tooling_expected }}
          VERIFICATION_TOOLING_RESULT: ${{ needs.tooling.result }}
          VERIFICATION_RUST_TRANSPORT_EXPECTED: ${{ needs.verification-selection.outputs.rust_transport_expected }}
          VERIFICATION_RUST_TRANSPORT_RESULT: ${{ needs.rust-transport.result }}
          VERIFICATION_RUST_COMPILE_EXPECTED: ${{ needs.verification-selection.outputs.rust_compile_expected }}
          VERIFICATION_RUST_COMPILE_RESULT: ${{ needs.rust-compile.result }}
          VERIFICATION_RUST_CHECKS_RESULT: ${{ needs.rust-checks.result }}
          VERIFICATION_RUST_SHARDS_EXPECTED: ${{ needs.verification-selection.outputs.rust_shards_expected }}
          VERIFICATION_RUST_PACKAGES_RESULT: ${{ needs.rust-packages.result }}
          VERIFICATION_RUST_FEATURES_RESULT: ${{ needs.rust-features.result }}
          VERIFICATION_DATABASE_EXPECTED: ${{ needs.verification-selection.outputs.database_expected }}
          VERIFICATION_DATABASE_RESULT: ${{ needs.database.result }}
          VERIFICATION_SERVICES_CONTROL_EXPECTED: ${{ needs.verification-selection.outputs.services_control_expected }}
          VERIFICATION_SERVICES_CONTROL_RESULT: ${{ needs.services-control.result }}
          VERIFICATION_SERVICES_RUNTIME_EXPECTED: ${{ needs.verification-selection.outputs.services_runtime_expected }}
          VERIFICATION_SERVICES_RUNTIME_RESULT: ${{ needs.services-runtime.result }}
          VERIFICATION_EDGE_KIND_EXPECTED: ${{ needs.verification-selection.outputs.edge_kind_expected }}
          VERIFICATION_EDGE_KIND_RESULT: ${{ needs.edge-kind.result }}
        run: scripts/ci/select/require-verification-results.sh

      # Main CI's verdict for its own commit (#2892), printed only after every
      # selected group succeeded or an exact tested-tree receipt was accepted.
      # Dev delivers only a commit whose push run printed it; a superseded run
      # verified nothing and prints none (main-ci-verdict.py).
      - name: Record main CI's verdict for this commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CODEWIRE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CODEWIRE_HEAD_COMMIT: ${{ needs.verification-selection.outputs.ci_head_commit }}
          CODEWIRE_HEAD_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
          VERIFICATION_SUPERSEDED: ${{ needs.verification-selection.outputs.superseded }}
          VERIFICATION_SUPERSEDED_BY: ${{ needs.verification-selection.outputs.superseded_by }}
          VERIFICATION_TESTED_TREE_RECEIPT: ${{ needs.verification-selection.outputs.tested_tree_receipt }}
          VERIFICATION_TESTED_TREE_PR: ${{ needs.verification-selection.outputs.tested_tree_pr }}
          VERIFICATION_TESTED_TREE_RUN: ${{ needs.verification-selection.outputs.tested_tree_run }}
        run: python3 -I -B scripts/ci/plan/main-ci-verdict.py emit

      - name: Emit exact-head verification receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CODEWIRE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEWIRE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          CODEWIRE_HEAD_COMMIT: ${{ needs.verification-selection.outputs.ci_head_commit }}
          CODEWIRE_HEAD_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/receipts/emit-verification-receipt.py

  # A pull request's run stops at its first failed job (infra#1632); main runs
  # every job. This watcher, which nothing needs, cancels the run once another
  # job has ended in failure: Forgejo's run cancel stops only unfinished jobs,
  # so the failed one keeps its result and log (#3126, #3119 A17), and
  # Required verification ends cancelled, which still blocks the merge.
  # Any failed check stops the run (owner, 2026-10-25: "Again, if any of these
  # things fail, then we just stop everything"). On a pull request the first
  # failure cancels the run; on a push to main a test job that failed on its
  # first attempt is rerun once at once, and any other failure cancels it
  # (scripts/ci/select/fail-fast-watch.py). A light runner stops a task after
  # 25 minutes, so the watch is a chain of links of 22 minutes each, every
  # link starting when the one before reaches its deadline: 88 minutes in all.
  fail-fast:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token only reads this run's jobs, reruns a failed test job on main and cancels this run.
    name: Stop at the first failed job
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # Below the light runner's 25-minute task limit; the watcher itself ends
    # quietly at 22 minutes (fail-fast-watch.py DEADLINE_SECONDS).
    timeout-minutes: 24
    needs: [verification-selection]
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed' || github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.verification-selection.result == 'success' }}
    outputs:
      continue: ${{ steps.watch.outputs.continue }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Stop this run once a check has failed
        id: watch
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/select/fail-fast-watch.py

  fail-fast-2:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token only reads this run's jobs, reruns a failed test job on main and cancels this run.
    name: Stop at the first failed job (2)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # Below the light runner's 25-minute task limit; the watcher itself ends
    # quietly at 22 minutes (fail-fast-watch.py DEADLINE_SECONDS).
    timeout-minutes: 24
    needs: [verification-selection, fail-fast]
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed' || github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.verification-selection.result == 'success' && needs.fail-fast.outputs.continue == 'true' }}
    outputs:
      continue: ${{ steps.watch.outputs.continue }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Stop this run once a check has failed
        id: watch
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/select/fail-fast-watch.py

  fail-fast-3:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token only reads this run's jobs, reruns a failed test job on main and cancels this run.
    name: Stop at the first failed job (3)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # Below the light runner's 25-minute task limit; the watcher itself ends
    # quietly at 22 minutes (fail-fast-watch.py DEADLINE_SECONDS).
    timeout-minutes: 24
    needs: [verification-selection, fail-fast-2]
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed' || github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.verification-selection.result == 'success' && needs.fail-fast-2.outputs.continue == 'true' }}
    outputs:
      continue: ${{ steps.watch.outputs.continue }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Stop this run once a check has failed
        id: watch
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/select/fail-fast-watch.py

  fail-fast-4:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token only reads this run's jobs, reruns a failed test job on main and cancels this run.
    name: Stop at the first failed job (4)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # Below the light runner's 25-minute task limit; the watcher itself ends
    # quietly at 22 minutes (fail-fast-watch.py DEADLINE_SECONDS).
    timeout-minutes: 24
    needs: [verification-selection, fail-fast-3]
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed' || github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.verification-selection.result == 'success' && needs.fail-fast-3.outputs.continue == 'true' }}
    outputs:
      continue: ${{ steps.watch.outputs.continue }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Stop this run once a check has failed
        id: watch
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/select/fail-fast-watch.py

  # The final job of a push to main (#2892): after a green verdict for this
  # exact commit, start Dev delivery. Deploy Dev's publish job for the same
  # commit signs and dispatches only on that verdict and only while the commit
  # moves Dev forward; when it already ran while this run was still verifying,
  # this reruns exactly that job, with the job token. Nothing waits for CI.
  deliver-to-dev:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the job token reads runs and reruns one Deploy Dev job.
    name: Start Dev delivery of the verified commit
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 15
    needs: [verification-selection, required-verification]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.required-verification.result == 'success' && needs.verification-selection.outputs.superseded == 'false' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}

      - name: Rerun this commit's Deploy Dev publish job
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/deploy/rerun-dev-publish.py
