      - name: Select best-effort shared Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' && steps.services-archives.outputs.ready != 'true' }}
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Install pinned protoc for Rust compilation
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' && steps.services-archives.outputs.ready != 'true' }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      # PostgreSQL and NATS from the guest's Docker store or its warm cache;
      # pulled by digest from Docker Hub only when neither holds it
      # (infra#1534).
      - name: Make the fixture images present
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' }}
        env:
          CODEWIRE_TOOL_CACHE: ${{ github.workspace }}/target/ci-rust-cargo-home/codewire-tools
        run: scripts/ci/setup/load-fixture-images.sh postgres nats

      - name: Start integration Postgres
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' }}
        run: |
          set -euo pipefail
          container="codewire-integration-${GITHUB_RUN_ID:?}-${GITHUB_JOB:?}"
          echo "POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
          docker rm -f "$container" >/dev/null 2>&1 || true
          mapfile -t networks < <(
            docker inspect --format '{{json .NetworkSettings.Networks}}' \
              "${HOSTNAME:?}" | jq -er 'keys[]'
          )
          if [ "${#networks[@]}" -ne 1 ] || [[ "${networks[0]}" =~ [^A-Za-z0-9_.-] ]]; then
            echo 'job container must have exactly one bounded Docker network' >&2
            exit 1
          fi
          postgres_host="codewire-integration-postgres"
          # The lock table fits the side-by-side migration tests (#3198); the
          # setting matches scripts/ci/verify/integration-postgres.sh.
          docker run -d --name "$container" --pids-limit 2048 \
            --network "${networks[0]}" --network-alias "$postgres_host" \
            -e POSTGRES_USER=codewire -e POSTGRES_PASSWORD=codewire \
            -e POSTGRES_DB=codewire "${INTEGRATION_POSTGRES_IMAGE:?}" \
            -c max_locks_per_transaction=1024
          echo "POSTGRES_HOST=$postgres_host" >> "$GITHUB_ENV"
          echo "INTEGRATION_DOCKER_NETWORK=${networks[0]}" >> "$GITHUB_ENV"

      - name: Wait for integration Postgres
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' }}
        env:
          PGPASSWORD: codewire
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if psql -h "$POSTGRES_HOST" -p 5432 -U codewire -d codewire -c 'select 1' >/dev/null 2>&1; then
              echo "DATABASE_URL=postgres://codewire:codewire@${POSTGRES_HOST}:5432/codewire?sslmode=disable" >> "$GITHUB_ENV"
              echo "DATABASE_URL_RUST=postgres://codewire:codewire@${POSTGRES_HOST}:5432/codewire" >> "$GITHUB_ENV"
              base=$((62000 + ((${GITHUB_RUN_ID:-0} % 100) * 10)))
              echo "VERIFICATION_PORT_BASE=$base" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs "$POSTGRES_CONTAINER" || true
          exit 1

      - name: Unpack the service runtime-plane archives
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' && steps.services-archives.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/service-archives"
          tar -xf "$RUNNER_TEMP/services.tar" -C "$RUNNER_TEMP/service-archives"
          rm -f "$RUNNER_TEMP/services.tar"
          tar -xzf "$RUNNER_TEMP/service-archives/binaries.tar.gz" -C "$RUNNER_TEMP/service-archives"
          rm -f "$RUNNER_TEMP/service-archives/binaries.tar.gz"

      - name: Install pinned cargo-nextest
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' && steps.services-archives.outputs.ready == 'true' }}
        env:
          # As in the Database job: the warm cache keeps the verified tarball.
          CODEWIRE_TOOL_CACHE: ${{ github.workspace }}/target/ci-rust-cargo-home/codewire-tools
        run: scripts/ci/setup/install-cargo-nextest.sh "$RUNNER_TEMP/nextest"

      - name: Run Service integration
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          RUST_SERVICE_ARCHIVES: ${{ steps.services-archives.outputs.ready == 'true' && format('{0}/service-archives', runner.temp) || '' }}
          RUST_TEST_NEXTEST: ${{ runner.temp }}/nextest/cargo-nextest
        run: scripts/ci/verify/run-integration-verification.sh services-runtime

      - name: Stop integration Postgres
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && always() && steps.service-scope.outputs.selected == 'true' }}
        run: docker rm -f "${POSTGRES_CONTAINER:-missing}" >/dev/null 2>&1 || true

      - name: Report and clean Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' && steps.services-archives.outputs.ready != 'true' }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

  # Independent build groups use private workers. Native same-run artifacts
  # carry exact outputs; the consumer never treats cache entries as proof.

      - name: Report the warm Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.service-scope.outputs.selected == 'true' }}
        run: scripts/ci/setup/finish-warm-rust-cache.sh

  kind-workspace:
    # zizmor: ignore[excessive-permissions] Existing untrusted cache identity only; no publication.
    name: Kind workspace build
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_KIND') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_KIND') }}
    enable-openid-connect: true
    # Sized for a fully cold build, as measured in run 13275 (e45c39c40):
    # workspace-image verification took 51 minutes with no layer cache, and
    # the 8.9 GB artifact upload took about 15 more, about 68 minutes in all.
    # The Heavy runner and dispatcher stop a task at 90 minutes, which leaves
    # 10 minutes for cancellation and cleanup.
    timeout-minutes: 80
    needs: [verification-selection]
    # With the pinned workspace (its definition unchanged), no job builds it:
    # each Kind shard writes the pin record itself and pulls that digest.
    if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.superseded != 'true' && contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned' }}
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      CODEWIRE_VERIFICATION_SOURCE_SHA: ${{ needs.verification-selection.outputs.source_sha }}
      CODEWIRE_EXPECTED_SOURCE_SHA: ${{ needs.verification-selection.outputs.ci_head_commit }}
      CODEWIRE_EXPECTED_SOURCE_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a secret.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verification-selection.outputs.source_sha }}
          persist-credentials: false

      - name: Verify sealed producer tools and isolated Buildx load
        run: |
          scripts/ci/setup/assert-ci-runner-image.sh
          scripts/ci/verify/rehearse-build-local-image.sh

      - name: Select independent workspace caches
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local' || github.event.inputs.rust_cache }}
          CODEWIRE_BUILDKIT_CACHE_REQUEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local' || github.event.inputs.layer_cache }}
        run: scripts/ci/setup/select-untrusted-workspace-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Build and verify exact source workspace
        run: scripts/ci/verify/verify-workspace-image.sh

      - name: Clean workspace cache credentials
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Export verified workspace
        id: export
        run: python3 -B scripts/ci/verify/kind-build-artifacts.py produce workspace "$RUNNER_TEMP/kind-workspace-out"

      - name: Upload successful workspace output
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-workspace-out/
          if-no-files-found: error
          retention-days: 1

  kind-product:
    # zizmor: ignore[excessive-permissions] Existing untrusted cache identity only; non-promotable images.
    name: Kind product image build
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.CODEWIRE_CI_RUNNER_TRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_KIND') || (vars.CODEWIRE_CI_RUNNER_UNTRUSTED_KIND || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_KIND') }}
    enable-openid-connect: true
    timeout-minutes: 35
