        run: |
          if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GITEA_TOKEN:-}" ]; then
            echo 'fail-fast: run identity or token unavailable; run not cancelled' >&2
            exit 0
          fi
          echo "fail-fast: job ${GITHUB_JOB:-unknown} failed; requesting cancellation of run ${GITHUB_RUN_ID}" >&2
          # The cancel revokes this ephemeral runner's registration in the
          # same transaction, severing log upload: lines echoed after the
          # POST below never reach the job log (infra#1229). The runner
          # ships buffered rows once a second; hold the cancel briefly so
          # this evidence stays durable.
          sleep "${FAIL_FAST_FLUSH_SECONDS:-5}"
          umask 077
          auth="$(mktemp)"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$auth"
          unset GITEA_TOKEN
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
