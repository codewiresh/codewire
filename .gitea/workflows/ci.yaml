          # the verified tarball between jobs on a metal guest.
          CODEWIRE_TOOL_CACHE: ${{ github.workspace }}/target/ci-rust-cargo-home/codewire-tools
        run: scripts/ci/setup/install-cargo-nextest.sh "$RUNNER_TEMP/nextest"

      - name: Run Database
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|database|') }}
        env:
          RUST_DATABASE_ARCHIVES: ${{ steps.database-archives.outputs.ready == 'true' && format('{0}/database-archives', runner.temp) || '' }}
