# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; runner profiles and server-side integrations enforce capabilities.
name: CI

on:
  push:
    branches: [main]
  # Adding or removing a label (ci-full, kind-e2e) starts a fresh run with the
  # new labels; the concurrency group below cancels the superseded one.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      verification:
        description: Product family
        required: false
        default: policy
      rust_cache:
        description: Rust image-build cache mode (auto, local, or disabled)
        required: false
        default: auto
      layer_cache:
        description: Workspace layer cache mode (auto, local, or disabled)
        required: false
        default: local

# A newer push to a pull request supersedes its older run. Runs on main
# are the post-merge confirmation, so each one finishes; later main runs
# queue behind it instead of cancelling it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  ARM64_BUILDKIT_HOST: ${{ vars.ARM64_BUILDKIT_HOST }}
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  KUSTOMIZE_VERSION: v5.4.3
  HELM_VERSION: v3.16.4
  CADDY_VERSION: 2.10.2
  KIND_VERSION: v0.30.0
  KUBECTL_VERSION: v1.34.0
  CARGO_INCREMENTAL: '0'
  AGENT_SANDBOX_SHA: c94d9c62aef662d8445fbce487d9b1c889ed7ff6
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: 0.23.0

# Forgejo assigns static jobs before their step conditions can make them cheap.
# The trusted selector therefore emits an empty or one-cell matrix for each
# bounded capability group. Unselected groups create no runner task; selected
# groups retain their fixed capability profile and timeout. Candidate policy
# cannot reduce work because PR matrices come from the exact trusted base.
# A canonical squash whose tree exactly matches a fully green PR head emits
# empty matrices. Receipt-control changes always take the full path, and every
# rejected receipt falls back to the ordinary selected suite.
# A pull request runs only the quick families (policy, ShellCheck and
# compiling every Rust target, plus Kind when opted in) unless it carries the
# ci-full label, which runs what a push to main would. A quick run emits no
# receipt, so main verifies that change in full after merge.
# Forgejo hands jobs to runners first in, first out. A main push's Heavy jobs
# select ci-heavy-main, which three Heavy runners take exclusively and the
# others also take, so main never waits behind queued pull requests; every
# other run selects ci-heavy.
jobs:
  verification-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job receives no write-capable integration.
    name: Verification selection
    runs-on: ci-lite
    outputs:
      selector_version: ${{ steps.select.outputs.selector_version }}
      classification: ${{ steps.select.outputs.classification }}
      selection: ${{ steps.select.outputs.selection }}
      required_local_mode: ${{ steps.select.outputs.required_local_mode }}
      ci_head_commit: ${{ steps.select.outputs.ci_head_commit }}
      ci_head_tree: ${{ steps.select.outputs.ci_head_tree }}
      cw_package_state: ${{ steps.select.outputs.cw_package_state }}
      cw_package_selected: ${{ steps.select.outputs.cw_package_selected }}
      desktop_package_state: ${{ steps.select.outputs.desktop_package_state }}
      desktop_package_selected: ${{ steps.select.outputs.desktop_package_selected }}
      workspace_image_state: ${{ steps.select.outputs.workspace_image_state }}
      workspace_image_selected: ${{ steps.select.outputs.workspace_image_selected }}
      tested_tree_receipt: ${{ steps.receipt.outputs.tested_tree_receipt }}
      tested_tree_reason: ${{ steps.receipt.outputs.tested_tree_reason }}
      tested_tree_pr: ${{ steps.receipt.outputs.tested_tree_pr }}
      tested_tree_head: ${{ steps.receipt.outputs.tested_tree_head }}
      tested_tree_run: ${{ steps.receipt.outputs.tested_tree_run }}
      policy_expected: ${{ steps.dispatch.outputs.policy_expected }}
      standard_expected: ${{ steps.dispatch.outputs.standard_expected }}
      tooling_expected: ${{ steps.dispatch.outputs.tooling_expected }}
      rust_compile_expected: ${{ steps.dispatch.outputs.rust_compile_expected }}
      # A trusted base that predates the separate shard decision runs the
      # shards with the Rust group.
      rust_shards_expected: ${{ steps.dispatch.outputs.rust_shards_expected || steps.dispatch.outputs.rust_transport_expected }}
      rust_transport_expected: ${{ steps.dispatch.outputs.rust_transport_expected }}
      database_expected: ${{ steps.dispatch.outputs.database_expected }}
      services_control_expected: ${{ steps.dispatch.outputs.services_control_expected }}
      services_runtime_expected: ${{ steps.dispatch.outputs.services_runtime_expected }}
      edge_kind_expected: ${{ steps.dispatch.outputs.edge_kind_expected }}
      cw_release_assets_expected: ${{ steps.dispatch.outputs.cw_release_assets_expected }}
      workspace_image_expected: ${{ steps.dispatch.outputs.workspace_image_expected }}
      superseded: ${{ steps.superseded.outputs.superseded }}
      superseded_by: ${{ steps.superseded.outputs.superseded_by }}
      workspace_cache_experiment: ${{ steps.cache-experiment.outputs.workspace_cache_experiment }}
      workspace_cache_measurement_matrix: ${{ steps.cache-experiment.outputs.workspace_cache_measurement_matrix }}
      kind_workspace_source: ${{ steps.kind-workspace.outputs.kind_workspace_source }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify CI runner image contract
        run: |
          scripts/ci/setup/assert-ci-runner-image.sh
          scripts/ci/tests/test-ci-runner-image-contract.sh

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ci-policy
          fetch-depth: 0
          persist-credentials: false

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        with:
          ref: ${{ github.event.before }}
          path: .trusted-ci-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Verify sealed Rust toolchain for trusted artifact planning
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select capabilities and artifact facts
        id: select
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          VERIFICATION_REQUEST: ${{ github.event.inputs.verification }}
          # Hosted pull-request CI selects the quick families unless the pull
          # request carries ci-full. Pushes and dispatches ignore it, and local
          # merge qualification leaves it unset.
          VERIFICATION_PR_SCOPE: quick
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A push to main reads whether its previous main run verified that
          # commit (plan-main-push.py); no other event receives the token here.
          GITEA_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: |
          set -euo pipefail
          case "${VERIFICATION_REQUEST:-}" in
            rust-stack|go-tailnet)
              echo "::error::manual diagnostics moved to the Manual diagnostics workflow"
              exit 1
              ;;
          esac

          workflow_output="$GITHUB_OUTPUT"
          capability_output="$(mktemp)"
          plan_output="$(mktemp)"
          trap 'rm -f "$capability_output" "$plan_output"' EXIT
          capability_selector='scripts/ci/select/select-verification.sh'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            capability_selector='.trusted-ci-policy/scripts/ci/select/select-verification.sh'
          fi
          [ -f "$capability_selector" ]
          GITHUB_OUTPUT="$capability_output" "$capability_selector"
          grep -Fxq 'selector_version=v3' "$capability_output"
          cat "$capability_output" >> "$workflow_output"
          export GITHUB_OUTPUT="$workflow_output"

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            trusted_planner='.trusted-ci-policy/scripts/ci/plan/planner.py'
            python3 "$trusted_planner" \
              --repository . \
              --target-base "$PR_BASE_SHA" \
              --head "$GITHUB_SHA" \
              --trusted-policy "$PR_BASE_SHA" \
              --output "$plan_output"
            if jq -e '.degraded_reasons | length > 0' "$plan_output" >/dev/null; then
              echo 'Trusted artifact planner degraded; affected artifacts remain selected:'
              jq -c '.degraded_reasons' "$plan_output"
            fi
            trusted_adapter='.trusted-ci-policy/scripts/ci/plan/apply-verification-plan.py'
            python3 "$trusted_adapter" --plan "$plan_output"
          else
            # A push to main plans its artifact facts with the previous main's
            # trusted policy, against that commit when its own run verified
            # it (plan-main-push.py). A dispatch, a policy that predates the
            # planner, or any planner failure keeps every artifact selected.
            main_push_planner='.trusted-ci-policy/scripts/ci/plan/plan-main-push.py'
            if [ "$GITHUB_EVENT_NAME" = push ] && [ -f "$main_push_planner" ] \
                && python3 -I -B "$main_push_planner" \
                  --repository . \
                  --head "$GITHUB_SHA" \
                  --before "$PUSH_BEFORE_SHA" \
                  --output "$plan_output"; then
              cat "$plan_output" >> "$GITHUB_OUTPUT"
            else
              echo 'main artifact facts: no trusted main-push plan; every artifact stays selected'
              python3 scripts/ci/plan/apply-verification-plan.py \
                --unclassified \
                --head "$GITHUB_SHA" \
                --head-tree "$(git rev-parse "$GITHUB_SHA^{tree}")"
            fi
          fi

      - name: Verify exact tested-tree receipt
        id: receipt
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_checker='scripts/ci/receipts/verify-tested-tree-receipt.sh'
          if [ -f .trusted-ci-policy/scripts/ci/receipts/verify-tested-tree-receipt.sh ]; then
            receipt_checker='.trusted-ci-policy/scripts/ci/receipts/verify-tested-tree-receipt.sh'
          fi
          "$receipt_checker"

      # Main runs queue one at a time and Forgejo keeps every queued run. A
      # main push that starts after main moved on runs this selection, records
      # which commit superseded it, and dispatches no capability group: the
      # newer commit's run, queued behind it, verifies the cumulative change.
      # The run for main's tip always verifies everything selected, and a run
      # that has started its groups is never stopped.
      - name: Skip a superseded main commit
        id: superseded
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != push ] || [ "$EVENT_REF" != refs/heads/main ]; then
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          canonical_main_sha="$(
            git ls-remote origin refs/heads/main |
              awk '$2 == "refs/heads/main" { print $1 }'
          )"
          [[ "$canonical_main_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$canonical_main_sha" == "$GITHUB_SHA" ]]; then
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'superseded=true\nsuperseded_by=%s\n' "$canonical_main_sha" >> "$GITHUB_OUTPUT"
          message="superseded by ${canonical_main_sha}: main's queued run verifies this commit's changes"
          echo "$message"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kind runs the published, digest-pinned workspace image unless this
      # change alters the image definition (images/base, images/workspace).
      # The sandbox daemon `cw` comes from the exact-source daemon image, so the
      # workspace's own `cw` is not under test. When Kind takes the pin, the
      # selected exact-source workspace verification runs in Container contract
      # verification instead (in support-images on a push to main), so no check
      # is dropped.
      - name: Choose the Kind workspace image source
        id: kind-workspace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=''
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
          esac
          python3 -B scripts/ci/verify/kind-build-artifacts.py workspace-source \
            --head "$GITHUB_SHA" --base "$base" --github-output

      - name: Emit trusted capability dispatch decisions
        id: dispatch
        env:
          VERIFICATION_SUPERSEDED: ${{ steps.superseded.outputs.superseded }}
          VERIFICATION_SELECTION: ${{ steps.select.outputs.selection }}
          VERIFICATION_TESTED_TREE_RECEIPT: ${{ steps.receipt.outputs.tested_tree_receipt }}
          CW_PACKAGE_SELECTED: ${{ steps.select.outputs.cw_package_selected }}
          DESKTOP_PACKAGE_SELECTED: ${{ steps.select.outputs.desktop_package_selected }}
          WORKSPACE_IMAGE_SELECTED: ${{ steps.select.outputs.workspace_image_selected }}
          KIND_WORKSPACE_SOURCE: ${{ steps.kind-workspace.outputs.kind_workspace_source }}
          # A push to main leaves the exact-source workspace image to
          # support-images, which runs the workspace contract on the exact
          # image it publishes (#2892). Same value as the container scope below.
          WORKSPACE_IMAGE_OWNER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'support-images' || 'ci' }}
        run: |
          set -euo pipefail
          dispatch_selector='scripts/ci/select/emit-verification-matrices.sh'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            trusted_dispatch_selector='.trusted-ci-policy/scripts/ci/select/emit-verification-matrices.sh'
            if [ -x "$trusted_dispatch_selector" ]; then
              dispatch_selector="$trusted_dispatch_selector"
            else
              # Conservative bootstrap for a base predating dynamic dispatch:
              # run every group so candidate code cannot omit required work.
              for group in \
                  policy standard tooling rust_compile rust_shards rust_transport database \
                  services_control services_runtime edge_kind \
                  cw_release_assets workspace_image; do
                echo "${group}_expected=true" >> "$GITHUB_OUTPUT"
              done
              exit 0
            fi
          fi
          "$dispatch_selector"

      - name: Select opt-in workspace cache experiment
        id: cache-experiment
        env:
          CODEWIRE_EXPECTED_SOURCE_SHA: ${{ steps.select.outputs.ci_head_commit }}
          CODEWIRE_EXPECTED_SOURCE_TREE: ${{ steps.select.outputs.ci_head_tree }}
          CODEWIRE_BUILDKIT_CACHE_REQUEST: ${{ github.event.inputs.layer_cache }}
        run: python3 scripts/ci/setup/select-workspace-cache-experiment.py --github-output

  cw-release-assets:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    name: CW release-assets verification
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-heavy-main' || 'ci-heavy' }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.cw_release_assets_expected == 'true' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/cw-cross-ci
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'CW release-assets verification inherited from the exact tested PR-head tree'

      - name: CW release assets not selected
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected != 'true' }}
        run: echo 'CW release assets are unaffected; no checkout or tool installation required'

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select best-effort shared Rust cache
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event.inputs.rust_cache }}
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Install pinned protobuf compiler
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Set up pinned cross-build tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh
          zig_url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLo zig.tar.xz "$zig_url"
          echo "${ZIG_X86_64_LINUX_SHA256}  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      # The macOS cw links Apple frameworks, so only the protected mac-runner
      # runner links it (cli-release.yaml and cw-release-dry-run.yaml, which
      # also verify the four-target delivery on every main change). Pull
      # requests compile it for both Mac targets without the SDK.
      - name: Compile the macOS cw for both Mac targets
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: scripts/ci/verify/check-darwin-cross.sh --cli

      - name: Package Linux dry-run assets
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: |
          set -euo pipefail
          # Build both Linux targets in one Cargo invocation, side by side and
          # sharing their host build scripts, with the environment
          # package-cw-release.sh builds with. Packaging then finds each target
          # fresh, and only admits and packages it.
          source_digest="$(python3 scripts/ci/release/cw_release.py source-digest --source-root .)"
          env -u CODEWIRE_LOCAL_RUNTIME \
            CODEWIRE_VERSION=v0.0.0-ci \
            CODEWIRE_SOURCE_REVISION="$(git rev-parse HEAD)" \
            CODEWIRE_SOURCE_TREE_SHA256="$source_digest" \
            cargo zigbuild --locked --profile ci -p codewire-cli-bin --bin cw \
              --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-gnu
          CW_RELEASE_PROFILE=ci \
            CW_RELEASE_BUILD_CMD='cargo zigbuild' \
            CW_RELEASE_TARGETS='x86_64-unknown-linux-musl aarch64-unknown-linux-gnu' \
            scripts/ci/release/package-cw-release.sh v0.0.0-ci 2>&1 | tee "$RUNNER_TEMP/package-cw-release.log"
          if grep -q 'Compiling codewire-cli-bin' "$RUNNER_TEMP/package-cw-release.log"; then
            echo '::warning::packaging rebuilt cw: the side-by-side build no longer matches package-cw-release.sh'
          fi
          "dist/cw-release/cw-v0.0.0-ci-x86_64-unknown-linux-musl" --version | grep -F 'v0.0.0-ci'
          [ "$(wc -l < dist/cw-release/SHA256SUMS)" -eq 2 ]
          (cd dist/cw-release && sha256sum --check --ignore-missing SHA256SUMS)

      - name: Report and clean Rust cache
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Cancel the run after this failure
        # Fail fast: a failed required group cancels the rest of the run
        # instead of letting slower groups (Rust, Kind) run on. Best effort;
        # the job has already failed and this step never changes that result.
        if: ${{ failure() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GITEA_TOKEN:-}" ]; then
            echo 'fail-fast: run identity or token unavailable; run not cancelled' >&2
            exit 0
          fi
          echo "fail-fast: job ${GITHUB_JOB:-unknown} failed; requesting cancellation of run ${GITHUB_RUN_ID}" >&2
          # The cancel revokes this ephemeral runner's registration in the
          # same transaction, severing log upload: lines echoed after the
          # POST below never reach the job log (infra#1229). The runner
          # ships buffered rows once a second; hold the cancel briefly so
          # this evidence stays durable.
          sleep "${FAIL_FAST_FLUSH_SECONDS:-5}"
          umask 077
          auth="$(mktemp)"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$auth"
          unset GITEA_TOKEN
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 --config "$auth" --request POST \
            "${GITHUB_SERVER_URL:?}/api/v1/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel")" || true
          rm -f "$auth"
          echo "fail-fast: requested cancellation of run ${GITHUB_RUN_ID} (HTTP ${status:-000})"

  workspace-image:
    enable-openid-connect: true
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    name: Container contract verification
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-heavy-main' || 'ci-heavy' }}
    # Workspace verification uses only the existing untrusted cache identity.
    # With apt packages from the in-cluster snapshot cache (#2803) this job
    # took 35 minutes cold (run 14199) and 22 warm (run 14254), most of it the
    # CW producer and the arm64 cw cross-compile; the apt steps fell from 52
    # minutes to seconds. The ceiling leaves the runner its cleanup margin.
    # A push to main builds no workspace image here: support-images runs the
    # contract on the exact image it publishes (#2892), so on main this job
    # runs only the standalone dashboard image and the iOS tests.
    timeout-minutes: 55
    needs: [verification-selection]
    if: ${{ needs.verification-selection.outputs.workspace_image_expected == 'true' }}
    outputs:
      workspace_cache_seed: ${{ steps.cache-seed-report.outputs.workspace_cache_seed }}
    env:
      CODEWIRE_EXPECTED_SOURCE_SHA: ${{ needs.verification-selection.outputs.ci_head_commit }}
      CODEWIRE_EXPECTED_SOURCE_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a secret.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'container contract verification inherited from the exact tested PR-head tree'

      - name: Resolve container contract scope
        id: container-scope
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          WORKSPACE_IMAGE_SELECTED: ${{ needs.verification-selection.outputs.workspace_image_selected }}
          KIND_WORKSPACE_SOURCE: ${{ needs.verification-selection.outputs.kind_workspace_source }}
          # Same value as the dispatch decision's owner.
          WORKSPACE_IMAGE_OWNER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'support-images' || 'ci' }}
        run: |
          set -euo pipefail
          owner="${WORKSPACE_IMAGE_OWNER:-ci}"
          case "$owner" in
            ci|support-images) ;;
            *) echo "::error::workspace image owner is invalid: $owner" >&2; exit 1 ;;
          esac
          # This job builds and verifies the exact-source workspace only when
          # CI owns it: a push to main leaves it to support-images, which runs
          # the contract on the exact image it publishes. Selected Kind owns it
          # unless it runs the published pin; then this job keeps it.
          workspace=false
          if [ "$owner" = ci ] && [ "$WORKSPACE_IMAGE_SELECTED" = true ] \
              && { [[ "$VERIFICATION_SELECTION" != *'|kind|'* ]] || [ "${KIND_WORKSPACE_SOURCE:-}" = pinned ]; }; then
            workspace=true
          fi
          # The standalone dashboard image and the iOS tests run on every event.
          selected=false
          if [ "$workspace" = true ] \
              || [[ "$VERIFICATION_SELECTION" == *'|ios|'* ]] \
              || { [[ "$VERIFICATION_SELECTION" == *'|web|'* ]] \
                && [[ "$VERIFICATION_SELECTION" != *'|kind|'* ]]; }; then
            selected=true
          fi
          printf 'workspace=%s\nselected=%s\n' "$workspace" "$selected" >> "$GITHUB_OUTPUT"

      - name: Container contracts not selected
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.selected != 'true' }}
        run: echo 'standalone container work is unaffected, owned by selected Kind, or on main owned by support-images; no checkout, download, installation, or build required'

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.selected == 'true' }}

      - name: Prove isolated Buildx load contract
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.workspace == 'true' }}
        run: |
          scripts/ci/tests/test-build-local-image.sh
          scripts/ci/tests/test-workspace-agent-contract.sh
          scripts/ci/verify/rehearse-build-local-image.sh

      - name: Select independent workspace caches
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.workspace == 'true' }}
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ github.event.inputs.rust_cache }}
          CODEWIRE_BUILDKIT_CACHE_REQUEST: ${{ github.event.inputs.layer_cache }}
        run: scripts/ci/setup/select-untrusted-workspace-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Prove labeled R2 backend compatibility
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.workspace == 'true' && env.CODEWIRE_WORKSPACE_CACHE_CANARY == 'true' }}
        run: |
          set -euo pipefail
          [[ "$CODEWIRE_BUILDKIT_CACHE_MODE" == r2 ]] || { echo 'Labeled R2 canary could not obtain its existing cache identity' >&2; exit 1; }
          scripts/ci/tests/canary-workspace-r2-cache.sh \
            "$CODEWIRE_SCCACHE_CREDENTIALS_FILE" "$RUNNER_TEMP/workspace-r2-cache-canary"

      - name: Prepare selected workspace cache seed
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.workspace_cache_experiment == 'true' && steps.container-scope.outputs.workspace == 'true' }}
        run: scripts/ci/setup/prepare-workspace-cache-measurement.sh seed

      - name: Build and inspect without publication
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.workspace == 'true' }}
        run: scripts/ci/verify/verify-workspace-image.sh

      - name: Clean workspace cache credentials
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && steps.container-scope.outputs.workspace == 'true' }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Finalize selected workspace cache seed
        id: cache-seed-report
        if: ${{ success() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.workspace_cache_experiment == 'true' && steps.container-scope.outputs.workspace == 'true' }}
        run: python3 scripts/ci/verify/workspace-cache-report.py finalize "$CODEWIRE_WORKSPACE_CACHE_REPORT_DIR" "$GITHUB_WORKSPACE/.tmp/codewire-workspace-image-verification.json"

      - name: Build and inspect the standalone dashboard image
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|web|') && !contains(needs.verification-selection.outputs.selection, '|kind|') }}
        env:
          # This direct bake does not receive the workspace compiler secret.
          CODEWIRE_SCCACHE_MODE: disabled
        run: scripts/ci/verify/run-product-verification.sh dashboard-image

      - name: Run iOS package tests in the pinned Swift image
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|ios|') }}
        run: |
          scripts/ci/verify/run-product-verification.sh ios-config
          docker build --file - apps/ios <<'DOCKERFILE'
          FROM swift@sha256:0ff707a48519cf1473616c759e019bcff21cfbafa3d2687bf8fd41a2757adc9a
          WORKDIR /workspace
          COPY . .
          RUN swift test --scratch-path /tmp/codewire-ios-build
          DOCKERFILE

      - name: Cancel the run after this failure
        # Fail fast: a failed required group cancels the rest of the run
        # instead of letting slower groups (Rust, Kind) run on. Best effort;
        # the job has already failed and this step never changes that result.
        if: ${{ failure() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GITEA_TOKEN:-}" ]; then
            echo 'fail-fast: run identity or token unavailable; run not cancelled' >&2
            exit 0
          fi
          echo "fail-fast: job ${GITHUB_JOB:-unknown} failed; requesting cancellation of run ${GITHUB_RUN_ID}" >&2
          # The cancel revokes this ephemeral runner's registration in the
          # same transaction, severing log upload: lines echoed after the
          # POST below never reach the job log (infra#1229). The runner
          # ships buffered rows once a second; hold the cancel briefly so
          # this evidence stays durable.
          sleep "${FAIL_FAST_FLUSH_SECONDS:-5}"
          umask 077
          auth="$(mktemp)"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$auth"
          unset GITEA_TOKEN
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 --config "$auth" --request POST \
            "${GITHUB_SERVER_URL:?}/api/v1/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel")" || true
          rm -f "$auth"
          echo "fail-fast: requested cancellation of run ${GITHUB_RUN_ID} (HTTP ${status:-000})"

  policy:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
