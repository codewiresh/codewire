  edge-kind:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    name: Edge / Kind verification (${{ matrix.shard.slug }})
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-heavy-main' || 'ci-heavy' }}
    # Builds run on independent producers; every shard leg imports the exact
    # same outputs, brings up its own disposable cluster, and runs only its
    # mapped retained suites, so the gate's wall time is its longest shard
    # instead of their serial sum. Required verification needs the one matrix
    # job, so every shard must be green.
    timeout-minutes: 45
    needs: [verification-selection, kind-workspace, kind-product, kind-daemon, kind-smokes]
    if: ${{ always() && needs.verification-selection.result == 'success' && needs.verification-selection.outputs.edge_kind_expected == 'true' && (needs.verification-selection.outputs.tested_tree_receipt == 'accepted' || !contains(needs.verification-selection.outputs.selection, '|kind|') || ((needs.kind-workspace.result == 'success' || (needs.verification-selection.outputs.kind_workspace_source == 'pinned' && needs.kind-workspace.result == 'skipped')) && needs.kind-product.result == 'success' && needs.kind-daemon.result == 'success' && needs.kind-smokes.result == 'success')) }}
    strategy:
      fail-fast: true
      matrix:
        shard:
          # environment: product-runtime acceptance, including the reconciler
          # TTL gate with its nested sandbox supply-chain observation.
          - slug: environment
            suites: runtime-acceptance
          # dashboard: the full Rust dashboard Playwright suite. Its per-worker
          # identities (#2381) let the suite run four workers in this leg;
          # the config default stays 1 for local runs.
          - slug: dashboard
            suites: dashboard-browser
            playwright_workers: 4
          # workspace: service/exec/FileService/resize, Temporal workflow and
          # final fencing, and the synthetic credential journey (bootstrap
          # plus native acceptance). Sandbox supply-chain provenance is
          # observed by the environment shard's TTL acceptance while its
          # product-created workspace is alive; a standalone invocation here
          # would see only self-cleaned fixtures and fail by design.
          - slug: workspace
            suites: workspace-services final-fencing credentials
          # edge: host-key/edge/Connect contract plus the coordinator runtime
          # and billing Connect contract (the integrated gate's remainder).
          - slug: edge
            suites: edge-contract integrated
    env:
      CODEWIRE_EXPECTED_SOURCE_SHA: ${{ needs.verification-selection.outputs.ci_head_commit }}
      CODEWIRE_EXPECTED_SOURCE_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
      CODEWIRE_PLAYWRIGHT_SNAPSHOT_ENV: ubuntu24-cft145
      KIND_INGRESS_CONTROLLER_IMAGE: registry.example.invalid/oci-approved/ingress-nginx/controller@sha256:5c2a1b6c03c4d18ecf14685d21a32bf6763a022f6f8cc07e9578f6cd5eca6180
      KIND_INGRESS_CERTGEN_IMAGE: registry.example.invalid/oci-approved/ingress-nginx/kube-webhook-certgen@sha256:334191231352856e1ec0c3e50f966edb59ec94a51906453d09f5820789e8b053
      KIND_AGENT_SANDBOX_IMAGE: registry.example.invalid/oci-approved/codewire/agent-sandbox-controller@sha256:fb3b81ff40a5ef07a455f1e81f2af3a9b0884ed801238e018008184520044595
      KIND_WORKSPACE_IMAGE: registry.example.invalid/oci-approved/codewire/workspace@sha256:cf91240f0706a5b3da81485fbf87d65973b18d4f1067f630bc5fd513b38d1510
      KIND_DIND_IMAGE: registry.example.invalid/oci-approved/docker/dind@sha256:66fd272fc375aad4c8fa06351c414e15bffe8cb015c171e1b8a8efe36a72cc1e
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/kind-ci
      CODEWIRE_KIND_PRODUCT_IMAGE_MODE: prebuilt-ci
      CODEWIRE_KIND_PRODUCT_MANIFEST_SHA256: ${{ needs.kind-product.outputs.manifest_sha256 }}
      CODEWIRE_KIND_DAEMON_MANIFEST_SHA256: ${{ needs.kind-daemon.outputs.manifest_sha256 }}
      CODEWIRE_KIND_SMOKES_MANIFEST_SHA256: ${{ needs.kind-smokes.outputs.manifest_sha256 }}
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'edge and Kind content verification inherited from the exact tested PR-head tree'

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - uses: https://git.example.invalid/noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && matrix.shard.slug == 'dashboard' }}
        with:
          bun-version: '1.3.9'

      - name: Install locked dashboard browser-test dependencies
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && matrix.shard.slug == 'dashboard' }}
        run: |
          set -euo pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 bun install --frozen-lockfile --ignore-scripts
          chromium="$(scripts/ci/install-pinned-playwright-chromium.sh)"
          "$chromium" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium" >> "$GITHUB_ENV"

      - name: Verify Kind runner tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh
          mkdir -p "$HOME/.local/bin"
          cd /tmp
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          install kubectl "$HOME/.local/bin/kubectl"
          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Require fresh artifact download directories outside the checkout
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        run: |
          set -euo pipefail
          CODEWIRE_KIND_ARTIFACT_ROOT="$RUNNER_TEMP/kind-inputs"
          test ! -e "$CODEWIRE_KIND_ARTIFACT_ROOT"
          test ! -L "$CODEWIRE_KIND_ARTIFACT_ROOT"
          case "$(realpath "$RUNNER_TEMP")" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) exit 1 ;;
          esac
          mkdir -m 700 "$CODEWIRE_KIND_ARTIFACT_ROOT"
          printf 'CODEWIRE_KIND_ARTIFACT_ROOT=%s\n' "$CODEWIRE_KIND_ARTIFACT_ROOT" >> "$GITHUB_ENV"

      - name: Download exact workspace producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned' }}
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.kind-workspace.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/workspace

      # The same producer the Kind workspace job runs, for the pinned workspace:
      # it writes only the pin record (no Docker), and the gate pulls that digest.
      - name: Write the pinned workspace record
        id: pinned-workspace
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source == 'pinned' }}
        env:
          CODEWIRE_KIND_WORKSPACE_SOURCE: pinned
        run: python3 -B scripts/ci/verify/kind-build-artifacts.py produce workspace "$CODEWIRE_KIND_ARTIFACT_ROOT/workspace"

      - name: Download exact product producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.kind-product.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/product

      - name: Download exact daemon producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.kind-daemon.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/daemon

      - name: Download exact smoke producer output
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.kind-smokes.outputs.artifact_name }}
          path: ${{ runner.temp }}/kind-inputs/smokes

      - name: Run the shard Kind gate
        # up and the suites must share one process: the remote DinD network
        # attachment and loopback forwarders are process state, so separate
        # steps would strand the shard's cluster before its first suite.
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        env:
          KIND_CLUSTER_NAME: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CLUSTER: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CODEWIRE_KIND_PROFILE_ROOT: ${{ runner.temp }}/kind-profiles
          KIND_SHARD_SUITES: ${{ matrix.shard.suites }}
          CODEWIRE_KIND_DASHBOARD_WORKERS: ${{ matrix.shard.playwright_workers }}
          # The workspace manifest comes from this shard's own pin record when
          # the workspace is pinned, and from the workspace job otherwise.
          CODEWIRE_KIND_WORKSPACE_MANIFEST_SHA256: ${{ needs.verification-selection.outputs.kind_workspace_source == 'pinned' && steps.pinned-workspace.outputs.manifest_sha256 || needs.kind-workspace.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          read -r -a suites <<<"$KIND_SHARD_SUITES"
          scripts/ci/verify/kind-e2e.sh shard "${suites[@]}"

      - name: Upload dashboard browser test results on failure
        # The dashboard leg's Playwright error contexts (error-context.md,
        # screenshots, traces) are the only rendered-DOM evidence when a
        # browser spec fails on a shard cluster. Upload them before teardown.
        if: ${{ failure() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && matrix.shard.slug == 'dashboard' }}
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: kind-dashboard-test-results-${{ github.run_id }}-${{ matrix.shard.slug }}
          path: apps/dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 5

      - name: Delete the shard Kind cluster
        # The saved profile proves nonce and node identity before deletion;
        # startup refusal never grants authority over a same-named cluster.
        # Keep teardown best-effort on a transient DinD failure.
        if: ${{ always() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|kind|') }}
        env:
          KIND_CLUSTER_NAME: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CLUSTER: codewire-e2e-ci-${{ github.run_id }}-${{ matrix.shard.slug }}
          CODEWIRE_KIND_PROFILE_ROOT: ${{ runner.temp }}/kind-profiles
        run: scripts/ci/verify/kind-e2e.sh down || true

      - name: Cancel the run after this failure
        # Fail fast: a failed required group cancels the rest of the run
        # instead of letting slower groups (Rust, Kind) run on. Best effort;
        # the job has already failed and this step never changes that result.
        if: ${{ failure() && needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GITEA_TOKEN:-}" ]; then
            echo 'fail-fast: run identity or token unavailable; run not cancelled' >&2
            exit 0
          fi
          echo "fail-fast: job ${GITHUB_JOB:-unknown} failed; requesting cancellation of run ${GITHUB_RUN_ID}" >&2
          # The cancel revokes this ephemeral runner's registration in the
          # same transaction, severing log upload: lines echoed after the
          # POST below never reach the job log (infra#1229). The runner
          # ships buffered rows once a second; hold the cancel briefly so
          # this evidence stays durable.
          sleep "${FAIL_FAST_FLUSH_SECONDS:-5}"
          umask 077
          auth="$(mktemp)"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$auth"
          unset GITEA_TOKEN
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 --config "$auth" --request POST \
            "${GITHUB_SERVER_URL:?}/api/v1/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel")" || true
          rm -f "$auth"
          echo "fail-fast: requested cancellation of run ${GITHUB_RUN_ID} (HTTP ${status:-000})"

  workspace-cache-measurement:
    # This experiment uses the existing untrusted PR cache identity only.
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job obtains only the reviewed untrusted cache identity.
    name: Workspace cache experiment (${{ matrix.case }})
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-heavy-main' || 'ci-heavy' }}
    enable-openid-connect: true
    timeout-minutes: 55
    needs: [verification-selection, workspace-image, kind-workspace]
    if: ${{ always() && needs.verification-selection.result == 'success' && needs.verification-selection.outputs.workspace_cache_experiment == 'true' && (((contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned') && needs.kind-workspace.result == 'success' && needs.kind-workspace.outputs.workspace_cache_seed != '') || (!(contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned') && needs.workspace-image.result == 'success' && needs.workspace-image.outputs.workspace_cache_seed != '')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verification-selection.outputs.workspace_cache_measurement_matrix) }}
    env:
      CODEWIRE_EXPECTED_SOURCE_SHA: ${{ needs.verification-selection.outputs.ci_head_commit }}
      CODEWIRE_EXPECTED_SOURCE_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a secret.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.verification-selection.outputs.ci_head_commit }}
          persist-credentials: false

      - name: Verify sealed measurement tools
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Bind successful exact-source producer
        env:
          KIND_SELECTED: ${{ (contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned') }}
          KIND_RESULT: ${{ needs.kind-workspace.result }}
          WORKSPACE_RESULT: ${{ needs.workspace-image.result }}
          KIND_SEED: ${{ needs.kind-workspace.outputs.workspace_cache_seed }}
          WORKSPACE_SEED: ${{ needs.workspace-image.outputs.workspace_cache_seed }}
        run: |
          set -euo pipefail
          if [[ "$KIND_SELECTED" == true ]]; then
            [[ "$KIND_RESULT" == success && -z "$WORKSPACE_SEED" ]]
            seed="$KIND_SEED"
          else
            [[ "$WORKSPACE_RESULT" == success && -z "$KIND_SEED" ]]
            seed="$WORKSPACE_SEED"
          fi
          CODEWIRE_WORKSPACE_CACHE_SEED_REPORT="$seed" python3 scripts/ci/verify/workspace-cache-report.py seed-id
          printf 'CODEWIRE_WORKSPACE_CACHE_SEED_REPORT=%s\n' "$seed" >> "$GITHUB_ENV"

      - name: Select independent measurement caches
        env:
          CODEWIRE_SCCACHE_REQUEST: ${{ matrix.compiler == 'r2' && 'auto' || 'disabled' }}
          CODEWIRE_BUILDKIT_CACHE_REQUEST: ${{ matrix.layers == 'r2' && 'auto' || 'disabled' }}
        run: scripts/ci/setup/select-untrusted-workspace-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Bind measurement modes and source
        env:
          MEASUREMENT_CASE: ${{ matrix.case }}
        run: scripts/ci/setup/prepare-workspace-cache-measurement.sh "$MEASUREMENT_CASE"

      - name: Verify measured workspace
        run: scripts/ci/verify/verify-workspace-image.sh

      - name: Clean measurement cache credential
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Finalize workspace measurement
        run: python3 scripts/ci/verify/workspace-cache-report.py finalize "$CODEWIRE_WORKSPACE_CACHE_REPORT_DIR" "$GITHUB_WORKSPACE/.tmp/codewire-workspace-image-verification.json"

  workspace-cache-probes:
    # Cost-only opt-in, after all measured workers stop using the shared cache.
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job obtains only the reviewed untrusted cache identity.
    name: Opt-in workspace cache experiment probes
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-heavy-main' || 'ci-heavy' }}
    enable-openid-connect: true
    timeout-minutes: 55
    needs: [verification-selection, workspace-image, kind-workspace, workspace-cache-measurement]
    if: ${{ always() && needs.verification-selection.result == 'success' && needs.verification-selection.outputs.workspace_cache_experiment == 'true' && needs.workspace-cache-measurement.result == 'success' && (((contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned') && needs.kind-workspace.result == 'success' && needs.kind-workspace.outputs.workspace_cache_seed != '') || (!(contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned') && needs.workspace-image.result == 'success' && needs.workspace-image.outputs.workspace_cache_seed != '')) }}
    env:
      CODEWIRE_EXPECTED_SOURCE_SHA: ${{ needs.verification-selection.outputs.ci_head_commit }}
      CODEWIRE_EXPECTED_SOURCE_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a secret.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.verification-selection.outputs.ci_head_commit }}
          persist-credentials: false

      - name: Verify sealed probe tools
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Bind successful exact-source probe producer
        env:
          KIND_SELECTED: ${{ (contains(needs.verification-selection.outputs.selection, '|kind|') && needs.verification-selection.outputs.kind_workspace_source != 'pinned') }}
          KIND_RESULT: ${{ needs.kind-workspace.result }}
          WORKSPACE_RESULT: ${{ needs.workspace-image.result }}
          KIND_SEED: ${{ needs.kind-workspace.outputs.workspace_cache_seed }}
          WORKSPACE_SEED: ${{ needs.workspace-image.outputs.workspace_cache_seed }}
        run: |
          set -euo pipefail
          if [[ "$KIND_SELECTED" == true ]]; then
            [[ "$KIND_RESULT" == success && -z "$WORKSPACE_SEED" ]]
            seed="$KIND_SEED"
          else
            [[ "$WORKSPACE_RESULT" == success && -z "$KIND_SEED" ]]
            seed="$WORKSPACE_SEED"
          fi
          CODEWIRE_WORKSPACE_CACHE_SEED_REPORT="$seed" python3 scripts/ci/verify/workspace-cache-report.py seed-id
          printf 'CODEWIRE_WORKSPACE_CACHE_SEED_REPORT=%s\n' "$seed" >> "$GITHUB_ENV"

      - name: Select existing probe cache identity once
        env:
          CODEWIRE_SCCACHE_REQUEST: auto
          CODEWIRE_BUILDKIT_CACHE_REQUEST: auto
        run: scripts/ci/setup/select-untrusted-workspace-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Run bounded cache effect probes
        run: scripts/ci/tests/probe-workspace-r2-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws" "$RUNNER_TEMP/workspace-cache-probes"

      - name: Clean probe cache credential
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Finalize separate cache probe report
        run: python3 scripts/ci/verify/workspace-cache-probes.py finalize "$RUNNER_TEMP/workspace-cache-probes"

  required-verification:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this aggregator receives no write-capable integration.
    name: Required verification
    runs-on: ci-lite
    if: ${{ always() }}
    needs:
      - verification-selection
      - cw-release-assets
      - workspace-image
      - policy
      - standard
      - tooling
      - rust-compile
      - rust-packages
      - rust-features
      - rust-transport
      - database
      - services-control
      - services-runtime
      - edge-kind
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Require capability groups
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          VERIFICATION_SELECTION_RESULT: ${{ needs.verification-selection.result }}
          VERIFICATION_TESTED_TREE_RECEIPT: ${{ needs.verification-selection.outputs.tested_tree_receipt }}
          VERIFICATION_TESTED_TREE_REASON: ${{ needs.verification-selection.outputs.tested_tree_reason }}
          VERIFICATION_TESTED_TREE_PR: ${{ needs.verification-selection.outputs.tested_tree_pr }}
          VERIFICATION_TESTED_TREE_HEAD: ${{ needs.verification-selection.outputs.tested_tree_head }}
          VERIFICATION_TESTED_TREE_RUN: ${{ needs.verification-selection.outputs.tested_tree_run }}
          VERIFICATION_POLICY_EXPECTED: ${{ needs.verification-selection.outputs.policy_expected }}
          VERIFICATION_POLICY_RESULT: ${{ needs.policy.result }}
          VERIFICATION_STANDARD_EXPECTED: ${{ needs.verification-selection.outputs.standard_expected }}
          VERIFICATION_STANDARD_RESULT: ${{ needs.standard.result }}
          VERIFICATION_TOOLING_EXPECTED: ${{ needs.verification-selection.outputs.tooling_expected }}
          VERIFICATION_TOOLING_RESULT: ${{ needs.tooling.result }}
          VERIFICATION_RUST_TRANSPORT_EXPECTED: ${{ needs.verification-selection.outputs.rust_transport_expected }}
          VERIFICATION_RUST_TRANSPORT_RESULT: ${{ needs.rust-transport.result }}
          VERIFICATION_RUST_COMPILE_EXPECTED: ${{ needs.verification-selection.outputs.rust_compile_expected }}
          VERIFICATION_RUST_COMPILE_RESULT: ${{ needs.rust-compile.result }}
          VERIFICATION_RUST_SHARDS_EXPECTED: ${{ needs.verification-selection.outputs.rust_shards_expected }}
          VERIFICATION_RUST_PACKAGES_RESULT: ${{ needs.rust-packages.result }}
          VERIFICATION_RUST_FEATURES_RESULT: ${{ needs.rust-features.result }}
          VERIFICATION_DATABASE_EXPECTED: ${{ needs.verification-selection.outputs.database_expected }}
          VERIFICATION_DATABASE_RESULT: ${{ needs.database.result }}
          VERIFICATION_SERVICES_CONTROL_EXPECTED: ${{ needs.verification-selection.outputs.services_control_expected }}
          VERIFICATION_SERVICES_CONTROL_RESULT: ${{ needs.services-control.result }}
          VERIFICATION_SERVICES_RUNTIME_EXPECTED: ${{ needs.verification-selection.outputs.services_runtime_expected }}
          VERIFICATION_SERVICES_RUNTIME_RESULT: ${{ needs.services-runtime.result }}
          VERIFICATION_EDGE_KIND_EXPECTED: ${{ needs.verification-selection.outputs.edge_kind_expected }}
          VERIFICATION_EDGE_KIND_RESULT: ${{ needs.edge-kind.result }}
          VERIFICATION_CW_RELEASE_ASSETS_EXPECTED: ${{ needs.verification-selection.outputs.cw_release_assets_expected }}
          VERIFICATION_CW_RELEASE_ASSETS_RESULT: ${{ needs.cw-release-assets.result }}
          VERIFICATION_WORKSPACE_IMAGE_EXPECTED: ${{ needs.verification-selection.outputs.workspace_image_expected }}
          VERIFICATION_WORKSPACE_IMAGE_RESULT: ${{ needs.workspace-image.result }}
        run: scripts/ci/select/require-verification-results.sh

      - name: Emit exact-head verification receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CODEWIRE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEWIRE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          CODEWIRE_HEAD_COMMIT: ${{ needs.verification-selection.outputs.ci_head_commit }}
          CODEWIRE_HEAD_TREE: ${{ needs.verification-selection.outputs.ci_head_tree }}
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/receipts/emit-verification-receipt.py
