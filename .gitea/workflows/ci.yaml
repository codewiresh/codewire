name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: Product family
        required: false
        default: policy

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  KUSTOMIZE_VERSION: v5.4.3
  HELM_VERSION: v3.16.4
  CADDY_VERSION: 2.10.2
  KIND_VERSION: v0.30.0
  KUBECTL_VERSION: v1.34.0
  CARGO_INCREMENTAL: '0'
  AGENT_SANDBOX_SHA: 4c528d3940ac5eb7c0194ce537fc4f4067417c72
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: 0.23.0

# Gitea assigns static jobs to runners before evaluating job-level conditions.
# Keep the selector's family precision, but execute it through four fixed
# capability groups instead of creating one runner task per family. The groups
# preserve parallelism between standard, Rust transport, integration, and Kind
# verification while step conditions keep unselected commands dormant.
# A canonical squash whose tree exactly matches a fully green PR head runs only
# each group's receipt sentinel. Receipt-control changes always take the full
# path, and every rejected receipt falls back to the ordinary selected suite.
jobs:
  verification-selection:
    name: Verification selection
    runs-on: ubuntu-latest
    outputs:
      selector_version: ${{ steps.select.outputs.selector_version }}
      classification: ${{ steps.select.outputs.classification }}
      selection: ${{ steps.select.outputs.selection }}
      required_local_mode: ${{ steps.select.outputs.required_local_mode }}
      ci_head_commit: ${{ steps.select.outputs.ci_head_commit }}
      ci_head_tree: ${{ steps.select.outputs.ci_head_tree }}
      cw_package_state: ${{ steps.select.outputs.cw_package_state }}
      cw_package_selected: ${{ steps.select.outputs.cw_package_selected }}
      desktop_package_state: ${{ steps.select.outputs.desktop_package_state }}
      desktop_package_selected: ${{ steps.select.outputs.desktop_package_selected }}
      workspace_image_state: ${{ steps.select.outputs.workspace_image_state }}
      workspace_image_selected: ${{ steps.select.outputs.workspace_image_selected }}
      tested_tree_receipt: ${{ steps.receipt.outputs.tested_tree_receipt }}
      tested_tree_reason: ${{ steps.receipt.outputs.tested_tree_reason }}
      tested_tree_pr: ${{ steps.receipt.outputs.tested_tree_pr }}
      tested_tree_head: ${{ steps.receipt.outputs.tested_tree_head }}
      tested_tree_run: ${{ steps.receipt.outputs.tested_tree_run }}
    steps:
      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify CI runner image contract
        run: |
          scripts/ci/setup/assert-ci-runner-image.sh
          scripts/ci/tests/test-ci-runner-image-contract.sh

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ci-policy
          fetch-depth: 0
          persist-credentials: false

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        with:
          ref: ${{ github.event.before }}
          path: .trusted-ci-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Verify sealed Rust toolchain for trusted artifact planning
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Select capabilities and artifact facts
        id: select
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          VERIFICATION_REQUEST: ${{ github.event.inputs.verification }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "${VERIFICATION_REQUEST:-}" in
            rust-stack|go-tailnet)
              echo "::error::manual diagnostics moved to the Manual diagnostics workflow"
              exit 1
              ;;
          esac

          workflow_output="$GITHUB_OUTPUT"
          capability_output="$(mktemp)"
          plan_output="$(mktemp)"
          trap 'rm -f "$capability_output" "$plan_output"' EXIT
          capability_selector='scripts/ci/select/select-verification.sh'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            capability_selector='.trusted-ci-policy/scripts/ci/select/select-verification.sh'
          fi
          [ -f "$capability_selector" ]
          GITHUB_OUTPUT="$capability_output" "$capability_selector"
          grep -Fxq 'selector_version=v3' "$capability_output"
          cat "$capability_output" >> "$workflow_output"
          export GITHUB_OUTPUT="$workflow_output"

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            trusted_planner='.trusted-ci-policy/scripts/ci/plan/planner.py'
            python3 "$trusted_planner" \
              --repository . \
              --target-base "$PR_BASE_SHA" \
              --head "$GITHUB_SHA" \
              --trusted-policy "$PR_BASE_SHA" \
              --output "$plan_output"
            if jq -e '.degraded_reasons | length > 0' "$plan_output" >/dev/null; then
              echo 'Trusted artifact planner degraded; affected artifacts remain selected:'
              jq -c '.degraded_reasons' "$plan_output"
            fi
            trusted_adapter='.trusted-ci-policy/scripts/ci/plan/apply-verification-plan.py'
            python3 "$trusted_adapter" --plan "$plan_output"
          else
            baseline="$GITHUB_SHA"
            if git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
              baseline="$(git rev-parse "$GITHUB_SHA^")"
            fi
            python3 scripts/ci/plan/apply-verification-plan.py \
              --unclassified \
              --head "$GITHUB_SHA" \
              --head-tree "$(git rev-parse "$GITHUB_SHA^{tree}")"
          fi

      - name: Verify exact tested-tree receipt
        id: receipt
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_checker='scripts/ci/receipts/verify-tested-tree-receipt.sh'
          if [ -f .trusted-ci-policy/scripts/ci/receipts/verify-tested-tree-receipt.sh ]; then
            receipt_checker='.trusted-ci-policy/scripts/ci/receipts/verify-tested-tree-receipt.sh'
          fi
          "$receipt_checker"

  cw-release-assets:
    name: CW release-assets verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verification-selection]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/cw-cross-ci
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'CW release-assets verification inherited from the exact tested PR-head tree'

      - name: CW release assets not selected
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected != 'true' }}
        run: echo 'CW release assets are unaffected; no checkout or tool installation required'

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install pinned protobuf compiler
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Set up pinned cross-build tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh
          zig_url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLo zig.tar.xz "$zig_url"
          echo "${ZIG_X86_64_LINUX_SHA256}  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Reject Darwin SDK framework dependencies
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: scripts/ci/release/check-cw-darwin-sdkless.sh

      - name: Package four-target dry-run assets
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.cw_package_selected == 'true' }}
        run: |
          set -euo pipefail
          CW_RELEASE_PROFILE=ci \
            CW_RELEASE_BUILD_CMD='cargo zigbuild' \
            CW_RELEASE_REQUIRE_SIGNATURE=0 \
            CW_RELEASE_TARGETS='x86_64-unknown-linux-musl aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin' \
            scripts/ci/release/package-cw-release.sh v0.0.0-ci
          "dist/cw-release/cw-v0.0.0-ci-x86_64-unknown-linux-musl" --version | grep -F 'v0.0.0-ci'
          [ "$(wc -l < dist/cw-release/SHA256SUMS)" -eq 4 ]
          (cd dist/cw-release && sha256sum --check --ignore-missing SHA256SUMS)

  workspace-image:
    name: Workspace image verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verification-selection]
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'workspace image verification inherited from the exact tested PR-head tree'

      - name: Workspace image not selected
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.workspace_image_selected != 'true' }}
        run: echo 'workspace image is unaffected; no checkout, download, installation, or build required'

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.workspace_image_selected == 'true' }}

      - name: Prove isolated Buildx load contract
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.workspace_image_selected == 'true' }}
        run: |
          scripts/ci/tests/test-build-local-image.sh
          scripts/ci/tests/test-workspace-agent-contract.sh
          scripts/ci/verify/rehearse-build-local-image.sh

      - name: Build and inspect without publication
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.workspace_image_selected == 'true' }}
        run: scripts/ci/verify/verify-workspace-image.sh

  standard:
    name: Standard verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verification-selection]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'standard content verification inherited from the exact tested PR-head tree'

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}
        with:
          fetch-depth: 0

      - name: Set up Go 1.26.5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|contracts|') || contains(needs.verification-selection.outputs.selection, '|go_support|') || contains(needs.verification-selection.outputs.selection, '|sdk_go|') || contains(needs.verification-selection.outputs.selection, '|security_go|')) }}
        run: scripts/ci/setup/setup-go.sh 1.26.5

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|policy|') || contains(needs.verification-selection.outputs.selection, '|contracts_proto|') || contains(needs.verification-selection.outputs.selection, '|go_tailnet|') || contains(needs.verification-selection.outputs.selection, '|go_consumer_interop|') || contains(needs.verification-selection.outputs.selection, '|deploy|')) }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install pinned protoc for Rust-backed standard checks
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|contracts_proto|') || contains(needs.verification-selection.outputs.selection, '|go_tailnet|') || contains(needs.verification-selection.outputs.selection, '|go_consumer_interop|')) }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' \
            | sha256sum -c -
          rm -rf "$HOME/.proto-tools/protoc"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - uses: https://forgejo.example.invalid/noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|contracts|') || contains(needs.verification-selection.outputs.selection, '|web|')) }}
        with:
          bun-version: '1.3.9'

      - uses: https://forgejo.example.invalid/noel/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|sdk_ts|') }}
        with:
          node-version: '20'

      - name: Run Policy
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|policy|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh policy

      - name: Run Contracts
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|contracts|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
          VERIFICATION_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFICATION_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci/verify/run-product-verification.sh contracts

      - name: Run Go support
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|go_support|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh go-support

      - name: Run Web
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|web|') }}
        run: scripts/ci/verify/run-product-verification.sh web

      - name: Run iOS package tests
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|ios|') }}
        run: |
          scripts/ci/verify/run-product-verification.sh ios-config
          docker build --file - apps/ios <<'DOCKERFILE'
          FROM swift@sha256:0ff707a48519cf1473616c759e019bcff21cfbafa3d2687bf8fd41a2757adc9a
          WORKDIR /workspace
          COPY . .
          RUN swift test --scratch-path /tmp/codewire-ios-build
          DOCKERFILE

      - name: Run SDK Go
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|sdk_go|') }}
        run: scripts/ci/verify/run-product-verification.sh sdk-go

      - name: Run SDK TypeScript typecheck and unit suite
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|sdk_ts|') }}
        run: scripts/ci/verify/run-product-verification.sh sdk-ts

      - name: Run SDK Python
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|sdk_python|') }}
        run: scripts/ci/verify/run-product-verification.sh sdk-python

      - name: Run API key smoke tooling
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|service_apikey_smoke|') }}
        run: scripts/ci/verify/run-product-verification.sh service-apikey-smoke

      - name: Run Confidential runtime tooling
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|runtime_confidential|') }}
        run: scripts/ci/verify/run-product-verification.sh runtime-confidential

      - name: Run Dev smoke tooling
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|runtime_dev_smoke|') }}
        run: scripts/ci/verify/run-product-verification.sh runtime-dev-smoke

      - name: Run Release provenance
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|release|') }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: scripts/ci/verify/run-product-verification.sh release

      - name: Run Deploy
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|deploy|') }}
        run: scripts/ci/verify/run-product-verification.sh deploy

      - name: Run Security
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|security|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh security

  rust-transport:
    name: Rust / transport verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verification-selection]
    env:
      CARGO_HOME: ${{ github.workspace }}/target/ci-rust-cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
      CODEWIRE_DESKTOP_CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/desktop-release
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'Rust and transport content verification inherited from the exact tested PR-head tree'

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|rust|') || contains(needs.verification-selection.outputs.selection, '|rust_curated_locks|') || contains(needs.verification-selection.outputs.selection, '|transport|') || needs.verification-selection.outputs.desktop_package_selected == 'true') }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Verify Rust protobuf compiler
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|rust|') || contains(needs.verification-selection.outputs.selection, '|transport|')) }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh

      - name: Verify GPUI and Wry build prerequisites
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.desktop_package_selected == 'true' }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh

      - name: Verify Rust cache capacity
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && (contains(needs.verification-selection.outputs.selection, '|rust|') || contains(needs.verification-selection.outputs.selection, '|rust_curated_locks|') || contains(needs.verification-selection.outputs.selection, '|transport|') || needs.verification-selection.outputs.desktop_package_selected == 'true') }}
        run: scripts/ci/setup/assert-cargo-cache-capacity.sh "$CARGO_HOME"

      - name: Verify curated Rust image workspace locks
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|rust_curated_locks|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh rust-curated-locks

      - name: Set up Go 1.26.5 for DERP interop
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|transport_derp_contract|') }}
        run: scripts/ci/setup/setup-go.sh 1.26.5

      - name: Run Rust
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|rust|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh rust

      - name: Run artifact-selected desktop package
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && needs.verification-selection.outputs.desktop_package_selected == 'true' && !contains(needs.verification-selection.outputs.selection, '|rust_pkg_codewire_desktop|') }}
        env:
          VERIFICATION_SELECTION: '|valid:v3|rust_pkg_codewire_desktop|complete|'
        run: scripts/ci/verify/run-product-verification.sh rust

      - name: Run Rust transport
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|transport|') }}
        env:
          VERIFICATION_SELECTION: ${{ needs.verification-selection.outputs.selection }}
        run: scripts/ci/verify/run-product-verification.sh transport

  database:
    name: Database verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verification-selection]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
      CODEWIRE_CARGO_CI_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-ci
    steps:
      - name: Reuse exact PR-head content verification
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt == 'accepted' }}
        run: echo 'database content verification inherited from the exact tested PR-head tree'

      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' }}

      - name: Verify sealed Rust toolchain
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|database|') }}
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Verify integration tools
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|database|') }}
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh

      - name: Start integration Postgres
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|database|') }}
        run: |
          set -euo pipefail
          container="codewire-integration-${GITHUB_RUN_ID:?}"
          echo "POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
          docker rm -f "$container" >/dev/null 2>&1 || true
          mapfile -t networks < <(
            docker inspect --format '{{json .NetworkSettings.Networks}}' \
              "${HOSTNAME:?}" | jq -er 'keys[]'
          )
          if [ "${#networks[@]}" -ne 1 ] || [[ "${networks[0]}" =~ [^A-Za-z0-9_.-] ]]; then
            echo 'job container must have exactly one bounded Docker network' >&2
            exit 1
          fi
          postgres_host="codewire-integration-postgres"
          docker run -d --name "$container" --pids-limit 2048 \
            --network "${networks[0]}" --network-alias "$postgres_host" \
            -e POSTGRES_USER=codewire -e POSTGRES_PASSWORD=codewire \
            -e POSTGRES_DB=codewire postgres:17-alpine
          echo "POSTGRES_HOST=$postgres_host" >> "$GITHUB_ENV"

      - name: Wait for integration Postgres
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|database|') }}
        env:
          PGPASSWORD: codewire
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if psql -h "$POSTGRES_HOST" -p 5432 -U codewire -d codewire -c 'select 1' >/dev/null 2>&1; then
              echo "DATABASE_URL=postgres://codewire:codewire@${POSTGRES_HOST}:5432/codewire?sslmode=disable" >> "$GITHUB_ENV"
              echo "DATABASE_URL_RUST=postgres://codewire:codewire@${POSTGRES_HOST}:5432/codewire" >> "$GITHUB_ENV"
              base=$((62000 + ((${GITHUB_RUN_ID:-0} % 100) * 10)))
              echo "VERIFICATION_PORT_BASE=$base" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs "$POSTGRES_CONTAINER" || true
          exit 1

      - name: Run Database
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|database|') }}
        run: scripts/ci/verify/run-integration-verification.sh database

      - name: Stop integration Postgres
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && always() && contains(needs.verification-selection.outputs.selection, '|database|') }}
        run: docker rm -f "${POSTGRES_CONTAINER:-missing}" >/dev/null 2>&1 || true

