        run: scripts/ci/verify/run-product-verification.sh web

      - name: Run SDK Go
        if: ${{ needs.verification-selection.outputs.tested_tree_receipt != 'accepted' && contains(needs.verification-selection.outputs.selection, '|sdk_go|') }}
        run: scripts/ci/verify/run-product-verification.sh sdk-go

