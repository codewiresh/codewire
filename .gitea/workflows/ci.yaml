        env:
          ARCHIVE_SHA256: ${{ needs.rust-compile.outputs.database_sha256 }}
        run: scripts/ci/setup/fetch-test-archive.sh --or-build "$ARCHIVE_SHA256" "$RUNNER_TEMP/database.tar"

