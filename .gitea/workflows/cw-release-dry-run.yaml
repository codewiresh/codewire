name: cw four-target dry run

# The macOS cw links Apple frameworks, so pull requests only compile it
# (ci.yaml) and only the protected mac-runner runner links it. Every change to
# the cw on main is therefore built and assembled here exactly as a release
# is (cli-release.yaml): the macOS pair natively on the Mac, through the
# release's macOS signing job with an rcodesign stand-in in place of Apple
# signing and notarization, and the Linux pair beside the unsigned four-target
# delivery, which is verified. Nothing is signed or published, and no job
# holds a credential.
#
# The macOS arm64 cw embeds the local VM runtime (#2539). When one of the
# runtime's inputs changed (local_runtime_parts.py RUNTIME_INPUTS), or on
# dispatch, the runtime is built as a release builds it but only from cached
# slow parts, and the delivery embeds it. The Linux side also builds the
# Linux x86_64 target (#2733), the linux fragment, which the delivery does not
# embed yet. Otherwise each side only checks its slow parts are cached. A
# missing part is a warning: the next release builds it. The Developer
# ID-signed VZ helper (#1905) is one of them: a helper whose recipe no release
# signed yet is built and passed through the release's helper signing job with
# the stand-in, and never packed.

on:
  push:
    branches: [main]
    # Only a change to what a release builds starts a dry run: the crates cw
    # links (test-cli-release-workflow.py derives them from the workspace
    # manifests and fails when they change) and the files outside them its
    # build reads, the runtime recipes, and the release scripts and
    # workflows. A server, dashboard or SDK change starts none.
    # dry-run-superseded.sh reads this list; keep it one entry per line.
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/codewire-access/**'
      - 'crates/codewire-cli/**'
      - 'crates/codewire-cli-bin/**'
      - 'crates/codewire-client/**'
      - 'crates/codewire-credential-bridge/**'
      - 'crates/codewire-credential-broker/**'
      - 'crates/codewire-cw-release/**'
      - 'crates/codewire-daemon/**'
      - 'crates/codewire-daemon-bridge/**'
      - 'crates/codewire-daemon-proto/**'
      - 'crates/codewire-derp/**'
      - 'crates/codewire-egress-broker/**'
      - 'crates/codewire-egress-policy/**'
      - 'crates/codewire-local-credentials/**'
      - 'crates/codewire-local-vmm/**'
      - 'crates/codewire-mesh/**'
      - 'crates/codewire-netstack/**'
      - 'crates/codewire-platform-credentials/**'
      - 'crates/codewire-project/**'
      - 'crates/codewire-project-proto/**'
      - 'crates/codewire-protected-store/**'
      - 'crates/codewire-proto/**'
      - 'crates/codewire-server-core/**'
      - 'crates/codewire-tailnet/**'
      - 'crates/codewire-tls/**'
      - 'crates/codewire-vmm-guest-probe/**'
      - 'crates/codewire-workload-secrets/**'
      - 'crates/codewire-workspace-access/**'
      - 'crates/codewire-workspace-image/**'
      - 'libs/daemon-proto/**'
      - 'proto/**'
      - 'apps/cli/GPG_PUBLIC_KEY.asc'
      - 'images/cw-runtime/**'
      - 'scripts/ci/release/**'
      - 'scripts/ci/tests/fixtures/rcodesign-stand-in.sh'
      - 'scripts/ci/select/**'
      - 'scripts/ci/verify/build-local-vmm-initramfs.sh'
      - 'scripts/ci/verify/build-linux-vmm-kernel.py'
      - 'scripts/ci/verify/linux-vmm-kernel/**'
      - 'scripts/dev/build-native-managed-agent.py'
      - 'scripts/dev/cw-runtime-image.py'
      - 'scripts/dev/linux-local-runtime.py'
      - 'scripts/dev/macos-local-runtime.py'
      - 'scripts/dev/macos-ext4-tool.py'
      - 'scripts/dev/macos-command-owner.py'
      - 'scripts/dev/macos-git-tool.py'
      - '.gitea/workflows/cli-release.yaml'
      - '.gitea/workflows/cw-release-dry-run.yaml'
  workflow_dispatch:

# A newer main push must never cancel a running dry run. Without this block
# Forgejo cancels the older push run of the same workflow and ref. With a group
# and `cancel-in-progress: false` it queues: one run at a time, in push order,
# and each one finishes. Forgejo keeps every queued run, so a queued run that
# starts after main moved on builds nothing when a newer queued run covers it
# (see "Skip a superseded commit").
concurrency:
  group: cw-release-dry-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: 0.23.0
  # The release's exact rcodesign pin (cli-release.yaml).
  RCODESIGN_VERSION: 0.29.0
  RCODESIGN_X86_64_LINUX_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
  # Cargo fetches git dependencies (noeljackson/av, tauri-apps/wry and
  # others) from github.com. Without a bound, a stalled connection holds
  # the job until its deadline (#2691). This bound fails a stalled connect,
  # TLS handshake or transfer in 20 s, and cargo logs and retries it.
  CARGO_HTTP_TIMEOUT: '20'
  CARGO_NET_RETRY: '5'
  DRY_RUN_VERSION: v0.0.0

jobs:
  protected-main:
    # Both builders are protected. Refuse any ref but main on a lite runner,
    # before any job reaches mac-runner or ci-protected; a dispatch from a
    # feature branch must not run its code there.
    name: Refuse anything but protected main
    runs-on: ci-lite
    steps:
      - name: Refuse anything but protected main
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/main' ]
          [ "$GITHUB_REF_NAME" = 'main' ]

  superseded:
    # Only the newest queued commit needs the protected builders and the
    # single Mac runner: scripts/ci/release/dry-run-superseded.sh says when an
    # older one may skip without losing a check. Each builder job decides
    # again when it starts, so a run that main passes while it waits for the
    # Mac (behind a release, say) gives the runner up in seconds.
    name: Skip a superseded commit
    needs: [protected-main]
    runs-on: ci-lite
    outputs:
      superseded: ${{ steps.canonical.outputs.superseded }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Skip a superseded commit
        id: canonical
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/release/dry-run-superseded.sh "$GITHUB_SHA" "$BEFORE"

  build-runtime-linux:
    name: Build or check the local runtime's Linux side
    needs: [protected-main, superseded]
    if: needs.superseded.outputs.superseded == 'false'
    runs-on: ci-protected
    # A wedged step must not hold this workflow's one-at-a-time queue until
    # the runner's 330-minute limit (run 13161 waited 5.5 h on a git fetch).
    # Each job's limit is about three times its recent successful runs:
    # Linux side 9.6-9.8 min before it built the x86_64 guest root and both
    # cw runtimes (#2733), which build-native-managed-agent.py bounds at
    # 20 min each; macOS 18.9-22.2 min, assembly 30.4-31.9 min.
    timeout-minutes: 75
    outputs:
      superseded: ${{ steps.superseded.outputs.superseded }}
      mode: ${{ steps.select.outputs.mode }}
      present: ${{ steps.build.outputs.present }}
      linux_sha256: ${{ steps.build.outputs.linux_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # Main may have moved on while this run waited for a builder: decide
      # again, by the same rule, before using one. A superseded commit skips
      # the rest of this job in seconds, and the jobs after it skip.
      - name: Skip a superseded commit
        id: superseded
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/release/dry-run-superseded.sh "$GITHUB_SHA" "$BEFORE"

      - name: Select the local runtime check
        id: select
        if: steps.superseded.outputs.superseded == 'false'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mode=full
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] &&
            [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            mode="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" |
              python3 scripts/ci/release/local_runtime_parts.py runtime-mode)"
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Verify sealed Rust toolchain and release targets
        if: steps.superseded.outputs.superseded == 'false' && steps.select.outputs.mode == 'full'
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install protoc (pinned)
        if: steps.superseded.outputs.superseded == 'false' && steps.select.outputs.mode == 'full'
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip" \
            6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7 /tmp/protoc.zip
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Build the Linux side from cached parts
        id: build
        if: steps.superseded.outputs.superseded == 'false' && steps.select.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # The kernel build's container reaches only this job's workspace.
          work="$GITHUB_WORKSPACE/.local-runtime"
          mkdir -m 0700 "$work" "$work/tmp"
          status=0
          TMPDIR="$work/tmp" LOCAL_RUNTIME_NO_BUILD=1 LOCAL_RUNTIME_JOB_CONTAINER="${HOSTNAME:?}" \
            scripts/ci/release/build-local-runtime.sh linux --source-sha "$GITHUB_SHA" \
            --version "$DRY_RUN_VERSION" --output "$work/linux" || status=$?
          case "$status" in
            0) ;;
            4) echo '::warning::A slow runtime part is not cached; the next release builds it. This dry run embeds no runtime.'
               echo 'present=false' >> "$GITHUB_OUTPUT"
               exit 0 ;;
            *) exit "$status" ;;
          esac
          tar -C "$work" -cf "$work/runtime-linux.tar" linux
          printf 'present=true\nlinux_sha256=%s\n' \
            "$(sha256sum "$work/runtime-linux.tar" | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Check the Linux side's slow parts are cached
        if: steps.superseded.outputs.superseded == 'false' && steps.select.outputs.mode == 'parts'
        run: |
          set -euo pipefail
          status=0
          scripts/ci/release/build-local-runtime.sh linux --check || status=$?
          case "$status" in
            0) ;;
            4) echo '::warning::A slow runtime part is not cached; the next release builds it.' ;;
            *) exit "$status" ;;
          esac

      - name: Hand the Linux side to the macOS build
        if: steps.superseded.outputs.superseded == 'false' && steps.build.outputs.present == 'true'
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-dry-run-runtime-linux-${{ github.run_id }}
          path: .local-runtime/runtime-linux.tar
          # The upload action skips hidden paths unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-helper-darwin:
    # The release's helper build (cli-release.yaml): the VZ helper's recipe
    # and, when no release has signed it yet, the helper built unsigned for
    # the stand-in signer.
    name: Build the VZ helper for signing
    needs: [protected-main, superseded]
    if: needs.superseded.outputs.superseded == 'false'
    runs-on: macos-arm64
    timeout-minutes: 30
    outputs:
      superseded: ${{ steps.superseded.outputs.superseded }}
      unsigned_sha256: ${{ steps.build.outputs.unsigned_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # The single Mac runner: decide again before holding it for a commit
      # main has passed while this run waited (as build-darwin does).
      - name: Skip a superseded commit
        id: superseded
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/release/dry-run-superseded.sh "$GITHUB_SHA" "$BEFORE"

      - name: Build the helper unless its recipe is signed
        id: build
        if: steps.superseded.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/codewire-vz-runner"
          scripts/ci/release/build-local-runtime.sh helper --output "$work"
          if [ -f "$work/codewire-vz-runner" ]; then
            echo '::warning::No release has signed the VZ helper for this recipe; the next release signs it.'
            mkdir -m 0700 .vz-runner-unsigned
            cp "$work/codewire-vz-runner" .vz-runner-unsigned/codewire-vz-runner
            printf 'unsigned_sha256=%s\n' \
              "$(shasum -a 256 .vz-runner-unsigned/codewire-vz-runner | cut -c1-64)" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the unsigned helper to signing
        if: steps.superseded.outputs.superseded == 'false' && steps.build.outputs.unsigned_sha256 != ''
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-dry-run-vz-runner-unsigned-${{ github.run_id }}
          path: .vz-runner-unsigned/codewire-vz-runner
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sign-helper:
    # The release's helper signing job with the recording rcodesign stand-in
    # and synthetic keys. It signs nothing, holds no credential and reaches no
    # Apple service, and nothing packs what it hands back: the macOS build
    # packs only a helper a release signed.
    name: Sign the VZ helper with the rcodesign stand-in (never signs)
    needs: [protected-main, build-helper-darwin]
    if: needs.build-helper-darwin.outputs.superseded == 'false'
    runs-on: ci-protected
    timeout-minutes: 20
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Receive the unsigned helper
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-dry-run-vz-runner-unsigned-${{ github.run_id }}
          path: vz-runner-unsigned

      - name: Verify the received helper is the built helper
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        env:
          UNSIGNED_SHA256: ${{ needs.build-helper-darwin.outputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          [[ "$UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum vz-runner-unsigned/codewire-vz-runner | cut -c1-64)" = "$UNSIGNED_SHA256" ]

      - name: Install rcodesign (pinned)
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        run: |
          set -euo pipefail
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          scripts/ci/release/fetch-pinned.sh \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz" \
            "$RCODESIGN_X86_64_LINUX_SHA256" rcodesign.tar.gz
          mkdir -m 0700 .rcodesign
          tar -xzf rcodesign.tar.gz -C .rcodesign --strip-components=1 "${archive}/rcodesign"
          .rcodesign/rcodesign --version

      - name: Sign the helper with the rcodesign stand-in
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        run: |
          set -euo pipefail
          stand_in="$(mktemp -d "${RUNNER_TEMP:?}/codewire-rcodesign-stand-in.XXXXXX")"
          scripts/ci/tests/fixtures/rcodesign-stand-in.sh --install "$stand_in"
          scripts/ci/release/sign-macos-helper.sh "$stand_in/bin/rcodesign" "$stand_in/keys" \
            vz-runner-unsigned/codewire-vz-runner \
            crates/codewire-local-vmm/macos-vz-runner/developer-entitlements.plist vz-runner-signed
          # One signature, verified and read, then one notarization.
          [ "$(cut -d' ' -f1 "$stand_in/calls" | tr '\n' ' ')" = \
            'sign verify print-signature-info encode-app-store-connect-api-key notary-submit ' ]

  build-darwin:
    name: Build the macOS cw natively
    needs: [protected-main, superseded, build-runtime-linux, build-helper-darwin, sign-helper]
    if: needs.superseded.outputs.superseded == 'false' && needs.build-runtime-linux.outputs.superseded == 'false' && needs.build-helper-darwin.outputs.superseded == 'false'
    runs-on: macos-arm64
    timeout-minutes: 60
    outputs:
      superseded: ${{ steps.superseded.outputs.superseded }}
      darwin_sums_sha256: ${{ steps.build.outputs.darwin_sums_sha256 }}
      runtime: ${{ steps.runtime.outputs.present }}
      # The one local runtime document every cw embeds (#2733).
      document_sha256: ${{ steps.runtime.outputs.document_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # Main may have moved on while this run waited for a builder: decide
      # again, by the same rule, before using one. A superseded commit skips
      # the rest of this job in seconds, and the jobs after it skip.
      - name: Skip a superseded commit
        id: superseded
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/release/dry-run-superseded.sh "$GITHUB_SHA" "$BEFORE"

      - name: Install protoc (pinned)
        if: steps.superseded.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-osx-aarch_64.zip" \
            193289af0470c6a1aada357d4fba0bbf8d78bfaac8b5e42ca30af2ef75583de2 "$HOME/protoc.zip"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q "$HOME/protoc.zip" -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Receive the local runtime's Linux side
        if: steps.superseded.outputs.superseded == 'false' && needs.build-runtime-linux.outputs.present == 'true'
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-dry-run-runtime-linux-${{ github.run_id }}
          path: .local-runtime-linux

      - name: Build the local VM runtime from cached parts
        id: runtime
        if: steps.superseded.outputs.superseded == 'false' && needs.build-runtime-linux.outputs.present == 'true'
        env:
          LINUX_SHA256: ${{ needs.build-runtime-linux.outputs.linux_sha256 }}
        run: |
          set -euo pipefail
          [[ "$LINUX_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(shasum -a 256 .local-runtime-linux/runtime-linux.tar | cut -c1-64)" = "$LINUX_SHA256" ]
          work="${RUNNER_TEMP:?}/codewire-local-runtime"
          mkdir -m 0700 "$work"
          tar -xf .local-runtime-linux/runtime-linux.tar -C "$work"
          status=0
          LOCAL_RUNTIME_NO_BUILD=1 scripts/ci/release/build-local-runtime.sh macos --linux "$work/linux" \
            --source-sha "$GITHUB_SHA" --output "$work/macos" || status=$?
          case "$status" in
            0) echo "CW_RELEASE_LOCAL_RUNTIME_DIR=$work/macos/runtime" >> "$GITHUB_ENV"
               echo 'present=true' >> "$GITHUB_OUTPUT"
               printf 'document_sha256=%s\n' \
                 "$(shasum -a 256 "$work/macos/runtime/local-runtime.json" | cut -c1-64)" >> "$GITHUB_OUTPUT" ;;
            4) echo '::warning::A slow runtime part is not cached; the next release builds it. This dry run embeds no runtime.' ;;
            *) exit "$status" ;;
          esac

      - name: Check the Mac side's slow parts are cached
        if: steps.superseded.outputs.superseded == 'false' && needs.build-runtime-linux.outputs.present != 'true'
        run: |
          set -euo pipefail
          status=0
          scripts/ci/release/build-local-runtime.sh macos --check || status=$?
          case "$status" in
            0) ;;
            4) echo '::warning::A slow runtime part is not cached; the next release builds it.' ;;
            *) exit "$status" ;;
          esac

      - name: Build the macOS pair
        id: build
        if: steps.superseded.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          CW_RELEASE_TARGETS='aarch64-apple-darwin x86_64-apple-darwin' \
            scripts/ci/release/package-cw-release.sh "$DRY_RUN_VERSION"
          (cd dist/cw-release && shasum -a 256 -c SHA256SUMS)
          printf 'darwin_sums_sha256=%s\n' \
            "$(shasum -a 256 dist/cw-release/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the macOS pair to the assembly
        if: steps.superseded.outputs.superseded == 'false'
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-dry-run-darwin-${{ github.run_id }}
          path: dist/cw-release/
          if-no-files-found: error
          retention-days: 1

  sign-darwin:
    # The release's macOS signing job with the recording rcodesign stand-in
    # and synthetic keys (scripts/ci/tests/fixtures/rcodesign-stand-in.sh).
    # It signs nothing, holds no credential and reaches no Apple service, but
    # proves the release's pinned rcodesign still installs, sign-macos-cw.sh
    # still runs, and the assembly packages exactly the pair it hands over.
    name: Sign the macOS pair with the rcodesign stand-in (never signs)
    needs: [protected-main, build-darwin]
    if: needs.build-darwin.outputs.superseded == 'false'
    runs-on: ci-protected
    timeout-minutes: 20
    outputs:
      darwin_sums_sha256: ${{ steps.sign.outputs.darwin_sums_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Receive the macOS pair
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-dry-run-darwin-${{ github.run_id }}
          path: dist-darwin

      - name: Verify the received macOS pair is the built pair
        env:
          UNSIGNED_SUMS_SHA256: ${{ needs.build-darwin.outputs.darwin_sums_sha256 }}
        run: |
          set -euo pipefail
          [[ "$UNSIGNED_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum dist-darwin/SHA256SUMS | cut -c1-64)" = "$UNSIGNED_SUMS_SHA256" ]
          (cd dist-darwin && sha256sum --check SHA256SUMS)

      - name: Install rcodesign (pinned)
        run: |
          set -euo pipefail
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          scripts/ci/release/fetch-pinned.sh \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz" \
            "$RCODESIGN_X86_64_LINUX_SHA256" rcodesign.tar.gz
          mkdir -m 0700 .rcodesign
          tar -xzf rcodesign.tar.gz -C .rcodesign --strip-components=1 "${archive}/rcodesign"
          .rcodesign/rcodesign --version

      - name: Sign the macOS pair with the rcodesign stand-in
        id: sign
        run: |
          set -euo pipefail
          stand_in="$(mktemp -d "${RUNNER_TEMP:?}/codewire-rcodesign-stand-in.XXXXXX")"
          scripts/ci/tests/fixtures/rcodesign-stand-in.sh --install "$stand_in"
          scripts/ci/release/sign-macos-cw.sh "$stand_in/bin/rcodesign" "$stand_in/keys" \
            dist-darwin dist-darwin-signed "$DRY_RUN_VERSION"
          # Two signatures, each verified and read, then one notarization.
          [ "$(cut -d' ' -f1 "$stand_in/calls" | tr '\n' ' ')" = \
            'sign sign verify print-signature-info verify print-signature-info encode-app-store-connect-api-key notary-submit ' ]
          (cd dist-darwin-signed && sha256sum --check SHA256SUMS)
          printf 'darwin_sums_sha256=%s\n' \
            "$(sha256sum dist-darwin-signed/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the stand-in-signed macOS pair to the assembly
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-dry-run-darwin-signed-${{ github.run_id }}
          path: dist-darwin-signed/
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and verify the unsigned four-target delivery
    needs: [protected-main, build-darwin, sign-darwin]
    runs-on: ci-protected
    timeout-minutes: 90
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # Main may have moved on while this run waited for a builder: decide
      # again, by the same rule, before using one. A superseded commit skips
      # the rest of this job in seconds, and the jobs after it skip.
      - name: Skip a superseded commit
        id: superseded
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/release/dry-run-superseded.sh "$GITHUB_SHA" "$BEFORE"

      - name: Verify sealed Rust toolchain and release targets
        if: steps.superseded.outputs.superseded == 'false'
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install protoc (pinned)
        if: steps.superseded.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip" \
            6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7 /tmp/protoc.zip
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Set up cross-build tools
        if: steps.superseded.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          zig_url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          scripts/ci/release/fetch-pinned.sh "$zig_url" "$ZIG_X86_64_LINUX_SHA256" zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Receive the stand-in-signed macOS pair
        if: steps.superseded.outputs.superseded == 'false'
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-dry-run-darwin-signed-${{ github.run_id }}
          path: dist-darwin

      - name: Verify the received macOS pair is the stand-in-signed pair
        if: steps.superseded.outputs.superseded == 'false'
        env:
          DARWIN_SUMS_SHA256: ${{ needs.sign-darwin.outputs.darwin_sums_sha256 }}
          DOCUMENT_SHA256: ${{ needs.build-darwin.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DARWIN_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum dist-darwin/SHA256SUMS | cut -c1-64)" = "$DARWIN_SUMS_SHA256" ]
          (cd dist-darwin && sha256sum --check SHA256SUMS)
          # The runtime the Linux cws embed is exactly the one the macOS job packed.
          if [ -n "$DOCUMENT_SHA256" ]; then
            [[ "$DOCUMENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [ "$(sha256sum dist-darwin/local-runtime/local-runtime.json | cut -c1-64)" = "$DOCUMENT_SHA256" ]
          else
            [ ! -e dist-darwin/local-runtime ]
          fi

      - name: Package and verify the unsigned delivery
        if: steps.superseded.outputs.superseded == 'false'
        env:
          RUNTIME: ${{ needs.build-darwin.outputs.runtime }}
          DOCUMENT_SHA256: ${{ needs.build-darwin.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          CW_RELEASE_BUILD_CMD='cargo zigbuild' \
            CW_RELEASE_TARGETS='x86_64-unknown-linux-musl aarch64-unknown-linux-gnu' \
            CW_RELEASE_IMPORT_DIR=dist-darwin \
            scripts/ci/release/package-cw-release.sh "$DRY_RUN_VERSION"
          [ "$(wc -l < dist/cw-release/SHA256SUMS)" -eq 4 ]
          (cd dist/cw-release && sha256sum --check SHA256SUMS)
          [ "$(find dist/cw-release/delivery/identities -name '*.json' | wc -l)" -eq 4 ]
          verified="$(python3 scripts/ci/release/cw_release.py verify --dist dist/cw-release --unsigned)"
          grep -Fx "cw-release: verified targets=4 version=$DRY_RUN_VERSION runtime_equal=true signed=false" <<<"$verified"
          # Every cw embeds the one runtime exactly when one was built.
          if [ "$RUNTIME" = true ]; then
            grep -q "^cw-release: local runtime document_sha256=$DOCUMENT_SHA256 " <<<"$verified"
          else
            [ ! -e dist/cw-release/delivery/local-runtime ]
          fi
