# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; runner profiles and server-side integrations enforce capabilities.
name: Merge check

# Merge qualification on a CI worker (#3055). A pull request labelled
# merge-check runs scripts/dev/preflight.sh --for-merge --emit-receipt (the
# same selection, policy core and lanes as a local run) on its exact head
# merged with the current main. Every push to the labelled pull request runs
# it again, so bringing the branch up to date refreshes it; adding any other
# label does not. Before merging, scripts/ci/receipts/ci-merge-check.py verify
# --pr N checks the receipt against the current head and main.
#
# Trust. The Merge check job is pull-request code. It runs only as a
# pull_request event and holds no credential. Its OIDC identity is the
# pull-request role, which reads canonical main's compiler cache read-only
# and writes no remote cache (infra#1544).
#
# The receipt comes from the Merge-check receipt job, which pull-request code
# cannot reach:
# - It runs on a separate runner and executes nothing from the pull request.
#   It runs ci-merge-check.py from a checkout of the trusted base and reads the
#   candidate only as Git data.
# - It runs only when Forgejo reports the first job successful.
# - It recomputes the merged tree and checks that the main was canonical.
# - It refuses a pull request that changes the merge check's own machinery:
#   this workflow, that tool, preflight, the selector, the runners.
#   Such a pull request qualifies locally instead.
on:
  pull_request:
    branches: [main]
    # Closing or merging the pull request cancels a merge check in flight: the
    # run it starts takes no runner, and the group below cancels the old one.
    types: [opened, synchronize, reopened, labeled, closed]

concurrency:
  group: merge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  CARGO_INCREMENTAL: '0'
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: 0.23.0

jobs:
  merge-check:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this untrusted job has no protected credential.
    name: Merge check
    # Forgejo evaluates this on the server, so an unlabelled pull request
    # takes no runner.
    if: ${{ (github.event.action == 'labeled' && github.event.label.name == 'merge-check') || (github.event.action != 'labeled' && github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'merge-check')) }}
    # The pull-request Heavy class on the metal guests (infra#1534), as in
    # ci.yaml. A pull_request event never uses the main variant.
    runs-on: ci-heavy-cpu10-ram17g
    enable-openid-connect: true
    timeout-minutes: 85
    outputs:
      head: ${{ steps.merge.outputs.head }}
      main: ${{ steps.merge.outputs.main }}
      tree: ${{ steps.merge.outputs.tree }}
    env:
      # The same Cargo paths as ci.yaml's Rust jobs: the warm cache links them,
      # and compiles hit main's compiler cache.
      CARGO_HOME: ${{ github.workspace }}/target/ci-rust-cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
      CODEWIRE_CARGO_CI_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-ci
      CODEWIRE_DESKTOP_CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/desktop-release
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # As in ci.yaml: cargo's parallel rustc processes fit the memory of the
      # runner this job landed on, a metal guest or a cloud overflow worker.
      - name: Bound cargo jobs by memory
        run: scripts/ci/setup/bound-cargo-jobs.sh

      - name: Verify sealed Rust toolchain
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Merge current main into the exact head
        id: merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I -B scripts/ci/receipts/ci-merge-check.py merge --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" --github-output

      - name: Explain the selection
        id: explain
        run: |
          set -euo pipefail
          explanation="$(scripts/dev/preflight.sh --explain)"
          printf '%s\n' "$explanation"
          selection="$(sed -n 's/^preflight selection: //p' <<<"$explanation")"
          mode="$(sed -n 's/^preflight required local mode: //p' <<<"$explanation")"
          [[ "$selection" == '|valid:v3|'*'|complete|' && "$mode" =~ ^(default|integration|kind|full)$ ]]
          printf 'selection=%s\nmode=%s\n' "$selection" "$mode" >> "$GITHUB_OUTPUT"

      # On a metal guest, start from its warm Rust cache, shared with ci.yaml's
      # Rust jobs (infra#1534); elsewhere this changes nothing. A merge check
      # ships and publishes nothing.
      - name: Select the warm Rust cache
        env:
          CODEWIRE_WARM_CACHE_EPOCH: ${{ vars.CODEWIRE_WARM_CACHE_EPOCH }}
        run: scripts/ci/setup/select-warm-rust-cache.sh

      # As in ci.yaml's Rust packages job: only a metal Kata guest mounts the
      # ext4 warm cache, and its kernel has no CONFIG_UNIX_DIAG, so
      # native_network_confinement's descriptor proofs skip there (owner,
      # 2026-10-21, codewire#2940).
      - name: Declare a metal Kata guest
        run: |
          if [[ "$(stat -f -c %T /ci-cache 2>/dev/null)" == ext2/ext3 ]]; then
            echo 'CODEWIRE_CI_METAL_KATA_GUEST=1' >> "$GITHUB_ENV"
          fi

      - name: Set up Go 1.26.10
        run: scripts/ci/setup/setup-go.sh 1.26.10

      - uses: https://git.example.invalid/noel/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'

      - uses: https://git.example.invalid/noel/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install pinned protoc
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  $RUNNER_TEMP/protoc.zip" \
            | sha256sum -c -
          rm -rf "$HOME/.proto-tools/protoc"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q "$RUNNER_TEMP/protoc.zip" -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Set up pinned Darwin C cross-check tools
        if: ${{ steps.explain.outputs.mode == 'full' || contains(steps.explain.outputs.selection, '|transport_pkg_codewire_local_vmm|') }}
        run: |
          set -euo pipefail
          zig_url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" "$zig_url"
          echo "${ZIG_X86_64_LINUX_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Rust cache capacity
        run: scripts/ci/setup/assert-cargo-cache-capacity.sh "$CARGO_HOME"

      - name: Select main's read-only Rust cache
        run: scripts/ci/setup/select-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      # Each integration lane starts its own PostgreSQL on the job's network
      # (scripts/ci/verify/integration-postgres.sh).
      - name: Give integration lanes the job network
        if: ${{ steps.explain.outputs.mode == 'full' || contains(steps.explain.outputs.selection, '|database|') || contains(steps.explain.outputs.selection, '|service_integration|') }}
        run: |
          set -euo pipefail
          mapfile -t networks < <(
            docker inspect --format '{{json .NetworkSettings.Networks}}' \
              "${HOSTNAME:?}" | jq -er 'keys[]'
          )
          if [ "${#networks[@]}" -ne 1 ] || [[ "${networks[0]}" =~ [^A-Za-z0-9_.-] ]]; then
            echo 'job container must have exactly one bounded Docker network' >&2
            exit 1
          fi
          echo "INTEGRATION_DOCKER_NETWORK=${networks[0]}" >> "$GITHUB_ENV"

      - name: Run merge qualification
        run: |
          set -euo pipefail
          scripts/dev/preflight.sh --for-merge --emit-receipt 2>&1 | tee "$RUNNER_TEMP/preflight.out"

      # fj reads job logs but not artifacts, so a failed family's whole log
      # goes into the job log too.
      - name: Show failed family logs
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          sed -nE 's/^preflight: .* FAILED \(exit [0-9]+ after [0-9]+s; log (.*)\)$/\1/p' \
            "$RUNNER_TEMP/preflight.out" 2>/dev/null | sort -u | while IFS= read -r log; do
              [ -f "$log" ] || continue
              echo "::group::${log##*/}"
              cat "$log"
              echo '::endgroup::'
            done

      - name: Upload family logs after a failure
        if: ${{ failure() }}
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: merge-check-family-logs
          path: ${{ github.workspace }}/.tmp/preflight/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report and clean Rust cache
        if: ${{ always() }}
        run: scripts/ci/setup/finish-untrusted-rust-cache.sh "$RUNNER_TEMP/codewire-sccache-r2.aws"

      - name: Report the warm Rust cache
        if: ${{ always() }}
        run: scripts/ci/setup/finish-warm-rust-cache.sh

  merge-check-receipt:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job runs no pull-request code and holds no credential.
    name: Merge-check receipt
    # Runs only when Forgejo reports the Merge check job successful.
    needs: [merge-check]
    runs-on: ci-lite
    timeout-minutes: 10
    steps:
      - name: Check out the candidate as data
        uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the trusted base
        uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Attest the merge check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAIN_SHA: ${{ needs.merge-check.outputs.main }}
          TREE: ${{ needs.merge-check.outputs.tree }}
          RESULT: ${{ needs.merge-check.result }}
        run: |
          set -euo pipefail
          tool=trusted/scripts/ci/receipts/ci-merge-check.py
          if [ ! -f "$tool" ]; then
            echo '::error::the base predates the merge-check receipt; qualify this pull request locally' >&2
            exit 1
          fi
          python3 -I -B "$tool" attest --repo candidate --pr "$PR_NUMBER" \
            --head "$PR_HEAD_SHA" --main "$MAIN_SHA" --tree "$TREE" --result "$RESULT" \
            --attested-by "$BASE_SHA" --output-dir "$RUNNER_TEMP/merge-check-receipt"

      - name: Upload the receipt
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: merge-check-receipt
          path: ${{ runner.temp }}/merge-check-receipt/
          if-no-files-found: error
          retention-days: 7
