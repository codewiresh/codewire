name: Verify workspace image

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'images/base/**'
      - 'images/workspace/**'
      - 'crates/codewire-cli/**'
      - 'crates/codewire-cli-bin/**'
      - 'crates/codewire-client/**'
      - 'crates/codewire-daemon/**'
      - 'crates/codewire-gateway-proto/**'
      - 'crates/codewire-orchestration/**'
      - 'crates/codewire-proto/**'
      - 'crates/codewire-tailnet/**'
      - 'libs/gateway-proto/**'
      - 'proto/**'
      - 'apps/dashboard/src/components/env-create-form.tsx'
      - 'apps/dashboard/src/lib/agents.ts'
      - 'scripts/ci/images/build-local-image.sh'
      - 'scripts/ci/tests/test-build-local-image.sh'
      - 'scripts/ci/tests/test-workspace-agent-contract.sh'
      - 'scripts/ci/tests/test-workspace-image-verify-workflow.sh'
      - 'scripts/ci/verify/rehearse-build-local-image.sh'
      - 'scripts/ci/verify/verify-workspace-image.sh'
      - 'scripts/ci/verify/workspace-agent-contract.sh'
      - '.gitea/workflows/workspace-image-verify.yaml'

permissions:
  contents: read

jobs:
  workspace-image:
    name: Build and verify workspace image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Prove isolated Buildx load contract
        run: |
          scripts/ci/tests/test-build-local-image.sh
          scripts/ci/tests/test-workspace-agent-contract.sh
          scripts/ci/verify/rehearse-build-local-image.sh

      - name: Build and inspect without publication
        run: scripts/ci/verify/verify-workspace-image.sh
