name: Debug Infisical Auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-auth:
    name: Debug Infisical OIDC
    runs-on: ubuntu-latest
    steps:
      - name: Debug token claims
        run: |
          echo "INFISICAL_API_URL: ${INFISICAL_API_URL}"
          echo "INFISICAL_IDENTITY_ID: ${INFISICAL_IDENTITY_ID}"
          echo "Token file exists: $(test -f ${INFISICAL_SA_TOKEN_PATH} && echo yes || echo no)"
          echo "Token claims:"
          cat ${INFISICAL_SA_TOKEN_PATH} | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '{sub, aud, iss}' || true

      - name: Authenticate to Infisical
        run: |
          RESPONSE=$(curl -s -X POST "${INFISICAL_API_URL}/v1/auth/oidc-auth/login" \
            -H "Content-Type: application/json" \
            -d "{
              \"identityId\": \"${INFISICAL_IDENTITY_ID}\",
              \"jwt\": \"$(cat ${INFISICAL_SA_TOKEN_PATH})\"
            }")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to authenticate to Infisical"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Successfully authenticated to Infisical"
