name: Mirror GitHub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-github
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main and tags to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Configure GitHub mirror remote
        env:
          MIRROR_GITHUB_APP_ID: ${{ secrets.MIRROR_GITHUB_APP_ID }}
          MIRROR_GITHUB_INSTALLATION_ID: ${{ secrets.MIRROR_GITHUB_INSTALLATION_ID }}
          MIRROR_GITHUB_PRIVATE_KEY: ${{ secrets.MIRROR_GITHUB_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for name in MIRROR_GITHUB_APP_ID MIRROR_GITHUB_INSTALLATION_ID MIRROR_GITHUB_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "${name} is required"
              exit 1
            fi
          done

          jwt="$(
            node <<'NODE'
          const crypto = require("crypto");

          function b64url(input) {
            return Buffer.from(input)
              .toString("base64")
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/g, "");
          }

          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: "RS256", typ: "JWT" }));
          const payload = b64url(JSON.stringify({
            iat: now - 60,
            exp: now + 540,
            iss: process.env.MIRROR_GITHUB_APP_ID,
          }));
          const unsigned = `${header}.${payload}`;
          const key = process.env.MIRROR_GITHUB_PRIVATE_KEY.replace(/\\n/g, "\n");
          const signature = crypto.createSign("RSA-SHA256").update(unsigned).sign(key);

          console.log(`${unsigned}.${b64url(signature)}`);
          NODE
          )"

          token_json="$(
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${jwt}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/app/installations/${MIRROR_GITHUB_INSTALLATION_ID}/access_tokens"
          )"
          mirror_token="$(printf '%s' "${token_json}" | node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); if (!body.token) process.exit(1); process.stdout.write(body.token);')"

          git remote add github "https://x-access-token:${mirror_token}@github.com/codewiresh/codewire.git"

      - name: Push mirror refs
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main)
              git push github HEAD:refs/heads/main
              scripts/ci/release/mirror-git-tags.sh github
              ;;
            refs/tags/v*)
              scripts/ci/release/mirror-canonical-release-tag.sh \
                origin github "$GITHUB_REF"
              ;;
            *)
              echo "Nothing to mirror for ${GITHUB_REF}"
              ;;
          esac
