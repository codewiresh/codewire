name: Mirror GitHub

on:
  push:
    branches: [main]

permissions:
  contents: read

enable-openid-connect: true

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  OPENBAO_GITHUB_ROLE: codewire-source-github-mirror
  OPENBAO_GITHUB_AUDIENCE: openbao-codewire-source-github-mirror

concurrency:
  group: mirror-github
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main and signed tags to GitHub
    runs-on: ci-protected
    timeout-minutes: 15
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Mirror with an OpenBao-backed GitHub App token
        env:
          # Private names the content gate refuses; the gate fails closed when empty.
          MIRROR_PRIVATE_CONTENT_PATTERNS: ${{ vars.MIRROR_PRIVATE_CONTENT_PATTERNS }}
        run: scripts/ci/release/mirror-github.sh "${GITHUB_REF:?}"
