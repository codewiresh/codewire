name: Mirror GitHub

on:
  push:
    branches: [main]

permissions:
  contents: read

enable-openid-connect: true

env:
  OPENBAO_GITHUB_ROLE: codewire-source-github-mirror
  OPENBAO_GITHUB_AUDIENCE: openbao-codewire-source-github-mirror

concurrency:
  group: mirror-github
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main and signed tags to GitHub
    runs-on: ci-protected
    timeout-minutes: 15
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Bootstrap the create-only OpenBao GitHub App tuple
        env:
          MIRROR_GITHUB_APP_ID: ${{ secrets.MIRROR_GITHUB_APP_ID }}
          MIRROR_GITHUB_INSTALLATION_ID: ${{ secrets.MIRROR_GITHUB_INSTALLATION_ID }}
          MIRROR_GITHUB_PRIVATE_KEY: ${{ secrets.MIRROR_GITHUB_PRIVATE_KEY }}
        run: scripts/ci/setup/bootstrap-openbao-github-mirror-credentials.sh

      - name: Mirror with an OpenBao-backed GitHub App token
        run: scripts/ci/release/mirror-github.sh "${GITHUB_REF:?}"
