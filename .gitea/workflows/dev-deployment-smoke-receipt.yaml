# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this workflow is a credential-free receipt validator.
name: Dev deployment smoke receipt

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Codewire source commit the deploy run promoted, or failed to
        required: true
        type: string
      deploy_commit:
        description: Exact deploy receipt commit; for promotion_failure, the deploy main commit the failed run started from
        required: true
        type: string
      deploy_run_id:
        description: Deploy Actions run that owns the smoke
        required: true
        type: string
      smoke_status:
        description: Exact deploy-owned result; promotion_failure means no release was committed (#3820)
        required: true
        type: choice
        options:
          - success
          - failure
          - promotion_failure

jobs:
  receipt:
    # zizmor: ignore[excessive-permissions] This validation job has no OIDC, checkout, network access, or write-capable integration.
    name: Record deploy-owned dev smoke result
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    steps:
      - name: Validate immutable receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_COMMIT: ${{ inputs.deploy_commit }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          SMOKE_STATUS: ${{ inputs.smoke_status }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" != "0000000000000000000000000000000000000000" ]]
          [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_COMMIT" != "0000000000000000000000000000000000000000" ]]
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          case "$SMOKE_STATUS" in
            success|failure|promotion_failure) ;;
            *) echo "::error::smoke_status must be success, failure or promotion_failure"; exit 2 ;;
          esac
          printf 'Deploy run %s reported %s for source %s at deploy commit %s.\n' \
            "$DEPLOY_RUN_ID" "$SMOKE_STATUS" "$SOURCE_SHA" "$DEPLOY_COMMIT"
          case "$SMOKE_STATUS" in
            failure)
              echo "::error::deploy-owned dev smoke failed"
              exit 1
              ;;
            promotion_failure)
              # The deploy run failed before committing a release, so Dev
              # still runs its previous source (#3820).
              echo "::error::deploy run $DEPLOY_RUN_ID did not promote source $SOURCE_SHA; Dev stays on its previous source"
              exit 1
              ;;
          esac
