# zizmor: ignore[excessive-permissions] Forgejo ignores permissions; job profile and job-scoped OIDC enforce support-image capabilities.
name: Build support images

# Every main commit gets the support pair a release tag needs
# (verify-release-support-pair.sh): a commit whose base and workspace inputs
# changed builds it, and any other commit publishes its tags as aliases of the
# published pair with the same inputs ("Alias the published support pair").
# A dispatch of main with source_sha runs the same selection for an earlier
# first-parent main commit, to backfill one: it aliases, or refuses when that
# commit's inputs need a build (dispatch-source.sh --main-history).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: An earlier main commit to publish the support pair for (dispatch-source.sh --main-history)
        required: false
        default: ''

# A support build that is already running finishes when main moves on: main
# pushes arrive faster than the build, so cancelling it left no pair published
# all day (owner, 2026-10-21). A newer push's run waits behind it instead of
# building beside it on the trusted builder. When it starts, a commit main has
# already moved past builds nothing ("Skip a superseded commit"), and the
# newest commit plans against the pair just published, so it builds only
# changed inputs.
concurrency:
  group: support-images-${{ github.ref }}
  cancel-in-progress: false

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  ARM64_BUILDKIT_HOST: ${{ vars.ARM64_BUILDKIT_HOST }}
  CODEWIRE_IMAGE_REGISTRY: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}
  CODEWIRE_SOURCE_URL: ${{ vars.CODEWIRE_SOURCE_URL }}
  CODEWIRE_R2_CACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
  CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}

jobs:
  support-selection:
    # zizmor: ignore[excessive-permissions] This credential-free selection uses protected Docker only for the preloaded, pinned Skopeo runtime.
    name: Support image selection
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      superseded: ${{ steps.canonical.outputs.superseded }}
      build_support_images: ${{ steps.select.outputs.build_support_images }}
      build_confidential_probe_image: ${{ steps.select.outputs.build_confidential_probe_image }}
      reason: ${{ steps.select.outputs.reason }}
      matched_categories: ${{ steps.select.outputs.matched_categories }}
      base_image_state: ${{ steps.select.outputs.base_image_state }}
      workspace_image_state: ${{ steps.select.outputs.workspace_image_state }}
      confidential_probe_image_state: ${{ steps.select.outputs.confidential_probe_image_state }}
      baseline_sha: ${{ steps.select.outputs.baseline_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      head_tree: ${{ steps.select.outputs.head_tree }}
      ci_plan_sha256: ${{ steps.select.outputs.ci_plan_sha256 }}
      ci_policy_sha256: ${{ steps.select.outputs.ci_policy_sha256 }}
      baseline_valid: ${{ steps.select.outputs.baseline_valid }}
      alias_support_pair: ${{ steps.select.outputs.alias_support_pair }}
      alias_source_sha: ${{ steps.select.outputs.alias_source_sha }}
      alias_base_digest: ${{ steps.select.outputs.alias_base_digest }}
      alias_workspace_digest: ${{ steps.select.outputs.alias_workspace_digest }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify sealed Rust toolchain
        run: scripts/ci/setup/assert-ci-runner-image.sh

      # A push publishes for its own commit. A dispatch of main may name an
      # earlier first-parent main commit; main's planner and publishers then
      # serve it, so its workflow file may differ from main's.
      - name: Choose the commit this run publishes for
        id: source
        env:
          DISPATCH_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: scripts/ci/select/dispatch-source.sh --main-history

      # A run that starts after main moved on publishes nothing: the newer
      # commit's run is queued behind this one and plans against the
      # published pair, so it publishes the cumulative change. Each build job
      # asks again when it starts (support-superseded.sh). The run already
      # building when main moves on still finishes.
      - name: Skip a superseded commit
        id: canonical
        run: scripts/ci/images/support-superseded.sh

      # A push plans against the latest pair; a dispatch against the pair of
      # its commit's newest first-parent ancestor.
      - name: Resolve untrusted published support pair
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/codewire-published-support-candidate.json"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            scripts/ci/images/resolve-published-support-pair.sh "$candidate" "$SOURCE_SHA"
          else
            scripts/ci/images/resolve-published-support-pair.sh "$candidate"
          fi

      - name: Plan atomic support build from validated baseline
        id: select
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          plan="$(mktemp)"
          trap 'rm -f "$plan"' EXIT
          python3 scripts/ci/plan/planner.py \
            --repository . \
            --target-base "$SOURCE_SHA" \
            --head "$SOURCE_SHA" \
            --trusted-policy "$SOURCE_SHA" \
            --baseline-candidate "$RUNNER_TEMP/codewire-published-support-candidate.json" \
            --output "$plan"
          if jq -e '.degraded_reasons | length > 0' "$plan" >/dev/null; then
            echo 'Support artifact planner degraded; the atomic pair remains selected:'
            jq -c '.degraded_reasons' "$plan"
          fi
          python3 scripts/ci/plan/apply-support-plan.py \
            --plan "$plan" \
            --head "$SOURCE_SHA" \
            --head-tree "$(git rev-parse "$SOURCE_SHA^{tree}")"

      # The build jobs build only the dispatched commit itself (an earlier
      # commit's confidential probe is not part of the release pair). An
      # earlier commit whose pair inputs differ from its newest published
      # ancestor pair is refused here, not silently skipped: a release builds
      # that pair natively (deploy-prod.yaml).
      - name: Refuse a build for an earlier commit
        if: ${{ steps.source.outputs.source_sha != github.sha && steps.select.outputs.build_support_images == 'true' }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          echo "::error::the support inputs of $SOURCE_SHA differ from its newest published ancestor pair, so it needs a build, which this dispatch of $GITHUB_SHA does not run"
          exit 1

      - name: Remove untrusted registry candidate
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/codewire-published-support-candidate.json"

  # Each platform of the support pair builds in its own job, with its own time
  # budget below the protected runner's ceiling, and streams every build step
  # into its log. amd64 builds on the trusted BuildKit builder over mutual TLS
  # and also builds the admitted static CW producer there. arm64 builds
  # natively on the protected arm64 BuildKit node over mutual TLS, never under
  # emulation. Both push only by digest; the join below publishes them as one
  # index.
  build-support-amd64:
    # zizmor: ignore[excessive-permissions] This exact protected job receives the scoped publisher identity for its platform of the pair.
    name: Build exact support pair (linux/amd64)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 120
    needs: [support-selection]
    if: ${{ needs.support-selection.outputs.build_support_images == 'true' && needs.support-selection.outputs.superseded == 'false' && needs.support-selection.outputs.source_sha == github.sha }}
    outputs:
      superseded: ${{ steps.canonical.outputs.superseded }}
      base_digest: ${{ steps.build.outputs.base_digest }}
      # Only a passing workspace contract reports the digest the joins consume.
      workspace_digest: ${{ steps.contract.outputs.workspace_digest }}
    env:
      OPENBAO_ROLE: codewire-source-support-publisher
      OPENBAO_AUDIENCE: openbao-codewire-source-support-publisher
      # In-cluster cache of the dated apt snapshots, passed to BuildKit as a
      # secret. The arm64 leg builds on the remote ci-arm64-builder node,
      # outside the cluster, and keeps the canonical snapshots.
      CODEWIRE_APT_SNAPSHOT_MIRROR: http://apt-snapshot-cache.forgejo-runner-control.svc.cluster.local:8080
      # The trusted builder fails fast when unreachable; only the owner's
      # recovery variable naming this exact commit, then a rerun of all jobs,
      # builds in this job.
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # A build job can wait minutes for a protected runner after selection.
      # When main moved on meanwhile, it builds nothing: six pairs on
      # 2026-10-23 and 2026-10-24 started both platforms after their commit
      # was superseded (infra#1534). A build that has started still finishes.
      - name: Skip a superseded commit
        id: canonical
        run: scripts/ci/images/support-superseded.sh

      # The one Codewire CI cache, written only by main-only builders
      # (infra#1544). It is best effort: without the credential the selector
      # chooses the job-local cache.
      - name: Select the protected R2 compiler cache
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        id: compiler-cache
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build the linux/amd64 base and workspace by digest
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        id: build
        env:
          SUPPORT_PLATFORM_BUDGET_MINUTES: '110'
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
        run: scripts/ci/images/build-support-platform.sh linux/amd64

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      # The agent contract runs on the exact image the build pushed, before
      # anything publishes it, with no compiler credential left on disk. The
      # pull robot's Docker configuration is gone before the image runs.
      - name: Run the workspace contract on the exact image
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        id: contract
        env:
          WORKSPACE_DIGEST: ${{ steps.build.outputs.workspace_digest }}
        run: |
          scripts/ci/images/run-workspace-contract-on-image.sh \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/workspace@$WORKSPACE_DIGEST" "$GITHUB_SHA" \
            scripts/ci/verify/workspace-agent-contract.sh

  build-support-arm64:
    # zizmor: ignore[excessive-permissions] This exact protected job receives the scoped publisher identity for its platform of the pair.
    name: Build exact support pair (linux/arm64)
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    # The job's OIDC also reads the arm64 node's client certificate.
    enable-openid-connect: true
    timeout-minutes: 120
    needs: [support-selection]
    if: ${{ needs.support-selection.outputs.build_support_images == 'true' && needs.support-selection.outputs.superseded == 'false' && needs.support-selection.outputs.source_sha == github.sha }}
    outputs:
      superseded: ${{ steps.canonical.outputs.superseded }}
      base_digest: ${{ steps.build.outputs.base_digest }}
      workspace_digest: ${{ steps.build.outputs.workspace_digest }}
    env:
      OPENBAO_ROLE: codewire-source-support-publisher
      OPENBAO_AUDIENCE: openbao-codewire-source-support-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # As in the amd64 leg: a build job that starts after main moved on
      # builds nothing.
      - name: Skip a superseded commit
        id: canonical
        run: scripts/ci/images/support-superseded.sh

      # The same protected R2 compiler cache as the amd64 leg. The credential
      # reaches the remote arm64 BuildKit node only as a BuildKit secret over
      # the mutual-TLS session; that node already receives the registry publish
      # credentials for this job.
      - name: Select the protected R2 compiler cache
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        id: compiler-cache
        run: |
          scripts/ci/setup/select-protected-rust-cache.sh \
            "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

      - name: Build the linux/arm64 base and workspace by digest
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        id: build
        env:
          SUPPORT_PLATFORM_BUDGET_MINUTES: '110'
          CODEWIRE_SCCACHE_MODE: ${{ steps.compiler-cache.outputs.mode == 'r2' && 'r2' || 'local' }}
          SCCACHE_BUCKET: ${{ vars.CODEWIRE_CI_SCCACHE_BUCKET_PROTECTED }}
          SCCACHE_ENDPOINT: ${{ vars.CODEWIRE_R2_CACHE_ENDPOINT }}
          CODEWIRE_SCCACHE_PREFIX: protected/codewire/v1
          CODEWIRE_SCCACHE_CREDENTIALS_FILE: ${{ runner.temp }}/codewire-sccache-r2-protected.aws
        run: scripts/ci/images/build-support-platform.sh linux/arm64

      - name: Remove the protected R2 compiler-cache credential
        if: ${{ always() }}
        run: |
          shred -u -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws" 2>/dev/null ||
            rm -f -- "$RUNNER_TEMP/codewire-sccache-r2-protected.aws"

  publish-support-images:
    # zizmor: ignore[excessive-permissions] This exact protected job receives the scoped publisher identity for the atomic pair.
    # The platform digests are only pointers: each join verifies the whole
    # index (both platforms, and only those, with this commit's protected
    # provenance and an SBOM each) before it tags or reports a candidate, and
    # publication consumes only those same-job candidates.
    name: Join and publish exact support pair
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 30
    needs: [build-support-amd64, build-support-arm64]
    # Only a pair both of whose platforms built joins: a platform job that
    # found its commit superseded built nothing.
    if: ${{ needs.build-support-amd64.outputs.superseded == 'false' && needs.build-support-arm64.outputs.superseded == 'false' }}
    outputs:
      workspace_ref: ${{ steps.workspace.outputs.candidate_ref }}
      workspace_mirrored: ${{ steps.mirror.outcome == 'success' }}
    env:
      OPENBAO_ROLE: codewire-source-support-publisher
      OPENBAO_AUDIENCE: openbao-codewire-source-support-publisher
      OPENBAO_GHCR_ROLE: codewire-source-support-publisher
      OPENBAO_GHCR_AUDIENCE: openbao-codewire-source-support-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Join and verify the canonical base index
        id: base
        env:
          CODEWIRE_IMAGE_JOIN: ${{ needs.build-support-amd64.outputs.base_digest }} ${{ needs.build-support-arm64.outputs.base_digest }}
        run: scripts/ci/images/build-push-image.sh base images/base/Dockerfile images/base

      - name: Join and verify the workspace index
        id: workspace
        env:
          CODEWIRE_IMAGE_JOIN: ${{ needs.build-support-amd64.outputs.workspace_digest }} ${{ needs.build-support-arm64.outputs.workspace_digest }}
        run: scripts/ci/images/build-push-image.sh workspace images/workspace/Dockerfile .

      - name: Publish the verified support pair to Harbor without rebuilding
        run: |
          set -euo pipefail
          [[ "${{ steps.base.outputs.source_sha }}" == "$GITHUB_SHA" ]]
          [[ "${{ steps.workspace.outputs.source_sha }}" == "$GITHUB_SHA" ]]
          scripts/ci/images/publish-image-to-harbor.sh \
            --support-pair \
            "${{ steps.base.outputs.candidate_ref }}" \
            "${{ steps.workspace.outputs.candidate_ref }}" \
            "$GITHUB_SHA"

      # Harbor serves every consumer; the public GHCR copy never gates it.
      - name: Mirror the support pair to GHCR without gating delivery
        id: mirror
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ci/images/publish-image-to-ghcr.sh \
            --support-pair \
            "${{ steps.base.outputs.candidate_ref }}" \
            "${{ steps.workspace.outputs.candidate_ref }}" \
            "$GITHUB_SHA"

  publish-confidential-probe:
    # zizmor: ignore[excessive-permissions] This independent protected job receives the same scoped publisher identity only for the probe.
    name: Build and publish exact confidential probe
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    needs: [support-selection]
    if: ${{ needs.support-selection.outputs.build_confidential_probe_image == 'true' && needs.support-selection.outputs.superseded == 'false' && needs.support-selection.outputs.source_sha == github.sha }}
    env:
      OPENBAO_ROLE: codewire-source-support-publisher
      OPENBAO_AUDIENCE: openbao-codewire-source-support-publisher
      OPENBAO_GHCR_ROLE: codewire-source-support-publisher
      OPENBAO_GHCR_AUDIENCE: openbao-codewire-source-support-publisher
      # The probe builds on the trusted BuildKit builder, so this job pulls no
      # BuildKit image of its own; only the owner's recovery variable naming
      # this exact commit builds it in the job.
      CODEWIRE_TRUSTED_BUILDKIT: '1'
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # As in the amd64 leg: a build job that starts after main moved on
      # builds nothing.
      - name: Skip a superseded commit
        id: canonical
        run: scripts/ci/images/support-superseded.sh

      - name: Build confidential bootstrap probe image
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        id: confidential_probe
        run: scripts/ci/images/build-push-image.sh confidential-probe images/confidential-probe/Dockerfile images/confidential-probe

      - name: Publish confidential bootstrap probe to Harbor without rebuilding
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        run: |
          set -euo pipefail
          [[ "${{ steps.confidential_probe.outputs.source_sha }}" == "$GITHUB_SHA" ]]
          scripts/ci/images/publish-image-to-harbor.sh \
            "${{ steps.confidential_probe.outputs.candidate_ref }}" \
            "$CODEWIRE_IMAGE_REGISTRY/codewire/confidential-probe" \
            "$GITHUB_SHA"

      - name: Mirror confidential bootstrap probe to GHCR without gating delivery
        if: ${{ steps.canonical.outputs.superseded == 'false' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/ci/images/publish-image-to-ghcr.sh \
            "${{ steps.confidential_probe.outputs.candidate_ref }}" \
            ghcr.io/codewiresh/confidential-probe \
            "$GITHUB_SHA"

  propose-workspace-image-pin:
    # zizmor: ignore[excessive-permissions] This exact protected job reads only the workspace-pin bot token, just in time.
    # The workspace-pin bot's token is the only capability: it pushes one
    # automation branch and opens or updates one pull request, which starts CI
    # like a person's. The bot cannot merge. The checkout keeps no job token,
    # so git sends only the bot's credential (runbooks/workspace-image-pin.md).
    name: Propose the published workspace image pin
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    needs: [publish-support-images]
    if: ${{ needs.publish-support-images.outputs.workspace_mirrored == 'true' }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Propose the pin as the workspace-pin bot
        env:
          WORKSPACE_REF: ${{ needs.publish-support-images.outputs.workspace_ref }}
        run: |
          set -euo pipefail
          bot_work="$(mktemp -d "$RUNNER_TEMP/workspace-pin-bot.XXXXXX")"
          trap 'find "$bot_work" -type f -exec shred -u {} +; rm -rf "$bot_work"' EXIT
          scripts/ci/setup/fetch-openbao-workspace-pin-bot-token.sh "$bot_work/token"
          WORKSPACE_PIN_BOT_TOKEN_FILE="$bot_work/token" \
            scripts/ci/images/propose-workspace-image-pin.sh "$WORKSPACE_REF"

  # A commit whose base and workspace fingerprints equal the published pair's
  # the planner validated gets that pair's exact indexes under its own commit
  # tag, in Harbor and the GHCR mirror, with the join's publisher identity: no
  # rebuild, and never the moving latest. The alias holds for a superseded
  # commit too, since its inputs are what they are.
  alias-support-pair:
    # zizmor: ignore[excessive-permissions] This exact protected job receives the scoped publisher identity to tag the planned pair.
    name: Alias the published support pair to this commit
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 20
    needs: [support-selection]
    if: ${{ needs.support-selection.outputs.alias_support_pair == 'true' }}
    env:
      OPENBAO_ROLE: codewire-source-support-publisher
      OPENBAO_AUDIENCE: openbao-codewire-source-support-publisher
      OPENBAO_GHCR_ROLE: codewire-source-support-publisher
      OPENBAO_GHCR_AUDIENCE: openbao-codewire-source-support-publisher
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Tag the identical published pair for this commit and verify it
        env:
          SOURCE_SHA: ${{ needs.support-selection.outputs.source_sha }}
          ALIAS_FROM_SHA: ${{ needs.support-selection.outputs.alias_source_sha }}
          ALIAS_BASE_DIGEST: ${{ needs.support-selection.outputs.alias_base_digest }}
          ALIAS_WORKSPACE_DIGEST: ${{ needs.support-selection.outputs.alias_workspace_digest }}
        run: |
          scripts/ci/images/alias-support-pair.sh \
            "$SOURCE_SHA" "$ALIAS_FROM_SHA" "$ALIAS_BASE_DIGEST" "$ALIAS_WORKSPACE_DIGEST"
