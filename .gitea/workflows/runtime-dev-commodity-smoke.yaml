name: Runtime Dev Commodity Smoke

on:
  workflow_dispatch:
    inputs:
      retain_environment:
        description: Retain the diagnosed environment for explicit inspection and cleanup
        required: false
        default: "false"
      packet_diagnostics:
        description: Capture value-blind host-network UDP request/reply metadata for the fixed dev peer relay
        required: false
        default: "false"

permissions:
  contents: read

env:
  KUBECTL_VERSION: v1.34.0
  CODEWIRE_SERVER_URL: https://codewire-dev.sh
  KUBE_CONTEXT: codewire-dev
  CODEWIRE_SERVER_NAMESPACE: dev
  SANDBOX_NAMESPACE: dev-sandboxes
  EXPECTED_NODE: cw-dev-prod-node-1
  REQUIRE_TAILNET_PATH_PROBE: "1"
  EXPECTED_TAILNET_PATH_TRANSPORT: peer_relay
  EXPECTED_TAILNET_PEER_RELAY_ENDPOINT: 192.0.2.35:41641
  SMOKE_DERP_FALLBACK: "1"
  SMOKE_TAILNET_DIRECT_WAIT: 5s
  SMOKE_SSH_CONNECT_TIMEOUT: "60"
  EXPECTED_KATA_COCO_INIT_DATA_ANNOTATION: "0"
  SMOKE_TIMEOUT_SECONDS: "1200"
  INFISICAL_WORKSPACE_SLUG: codewire
  INFISICAL_ENVIRONMENT: dev
  INFISICAL_SECRET_PATH: /
  SMOKE_TMP_PARENT: ${{ runner.temp }}/codewire-runtime-smoke-evidence
  SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/codewire-runtime-smoke-artifact

jobs:
  smoke:
    name: Commodity Dev Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: stable

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          # Keep version + checksum in lockstep with Makefile's
          # PROTOC_VERSION / PROTOC_SHA256_LINUX_X86_64, CI, and cli-release.
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Build cw CLI for smoke
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          timeout 10m cargo build --locked --profile ci -p codewire-cli-bin --bin cw
          cp target/ci/cw "$GITHUB_WORKSPACE/.tmp/cw-runtime-smoke"
          echo "CW_BIN=$GITHUB_WORKSPACE/.tmp/cw-runtime-smoke" >> "$GITHUB_ENV"

      - name: Install smoke tools
        env:
          PACKET_DIAGNOSTICS: ${{ inputs.packet_diagnostics }}
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            APT="sudo apt-get"
          else
            APT="apt-get"
          fi
          $APT update -qq || true
          packages=(ca-certificates curl jq openssh-client)
          case "$PACKET_DIAGNOSTICS" in
            true) packages+=(iproute2 tcpdump) ;;
            false) ;;
            *) echo "::error::packet_diagnostics must be true or false"; exit 2 ;;
          esac
          $APT install -y -qq "${packages[@]}"
          if ! command -v kubectl >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
            echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
            install -m 0755 kubectl "$HOME/.local/bin/kubectl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          jq --version
          ssh -V
          kubectl version --client=true

      - name: Configure dev Kubernetes context
        run: scripts/ci/setup/setup-kubeconfig.sh

      - name: Export smoke secrets from Infisical
        run: scripts/ci/setup/export-infisical-secrets.sh CODEWIRE_DEV_SMOKE_API_KEY EXPECTED_CODEWIRE_SMOKE_USER_EMAIL

      - name: Run commodity smoke
        id: runtime-smoke
        env:
          RETAIN_ENVIRONMENT: ${{ inputs.retain_environment }}
          PACKET_DIAGNOSTICS: ${{ inputs.packet_diagnostics }}
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_TMP_PARENT" "$SMOKE_ARTIFACT_DIR"
          args=()
          case "$RETAIN_ENVIRONMENT" in
            true) args+=(--keep) ;;
            false) ;;
            *) echo "::error::retain_environment must be true or false"; exit 2 ;;
          esac
          case "$PACKET_DIAGNOSTICS" in
            true)
              if [[ "$RETAIN_ENVIRONMENT" == "true" ]]; then
                echo "::error::packet diagnostics own cleanup; retain_environment must be false"
                exit 2
              fi
              export SMOKE_PACKET_DIAGNOSTICS=1
              args+=(--only kube --only doctor)
              ;;
            false) export SMOKE_PACKET_DIAGNOSTICS=0 ;;
            *) echo "::error::packet_diagnostics must be true or false"; exit 2 ;;
          esac
          scripts/ci/verify/runtime-dev-commodity-smoke.sh "${args[@]}"

      - name: Verify packet-diagnostic environment cleanup
        if: ${{ always() && inputs.packet_diagnostics == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          environment_file="$SMOKE_ARTIFACT_DIR/environment.json"
          cleanup_file="$SMOKE_ARTIFACT_DIR/environment-cleanup.json"
          if [[ ! -s "$environment_file" ]]; then
            jq -n '{state: "not_created", absent: true}' >"$cleanup_file"
            exit 0
          fi

          environment_id="$(jq -er '.environment_id' "$environment_file")"
          export CODEWIRE_API_KEY="$CODEWIRE_DEV_SMOKE_API_KEY"
          timeout 30s "$CW_BIN" --server "$CODEWIRE_SERVER_URL" \
            env rm --yes "$environment_id" \
            >/dev/null 2>&1 || true

          list_file="$SMOKE_TMP_PARENT/environment-cleanup-list.json"
          for _ in $(seq 1 30); do
            timeout 30s "$CW_BIN" --server "$CODEWIRE_SERVER_URL" \
              env list --output json \
              >"$list_file"
            if jq -e --arg id "$environment_id" \
                'all(.[]?; (.id // "") != $id)' "$list_file" >/dev/null; then
              jq -n --arg environment_id "$environment_id" \
                '{environment_id: $environment_id, state: "absent", absent: true}' \
                >"$cleanup_file"
              exit 0
            fi
            sleep 2
          done
          echo "::error::packet-diagnostic environment remains after cleanup"
          exit 1

      - name: Upload value-blind smoke failure evidence
        if: ${{ always() && ((failure() && steps.runtime-smoke.outcome == 'failure') || inputs.retain_environment == 'true' || inputs.packet_diagnostics == 'true') }}
        uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 from actions/upload-artifact v7.0.1
        with:
          name: runtime-dev-commodity-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/codewire-runtime-smoke-artifact
          if-no-files-found: error
          retention-days: 7
