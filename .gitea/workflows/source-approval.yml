name: Supply-chain scan

# The pull-request workflow comes from protected base, not from the candidate.
# Candidate files are scanned as data only; no repository script, hook,
# dependency installer, build system, Dockerfile, or binary is executed.
# The private-content scan runs the protected base's check-mirror-content.sh and
# patterns over the candidate's history, the scan the GitHub mirror runs after
# merge, so private names and home directories never reach main.
on:
  # zizmor: ignore[dangerous-triggers] The protected-base workflow executes only sealed scanners over candidate data.
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  source-approval: # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the disposable runner and network policy enforce no write.
    name: Supply-chain scan
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 15
    steps:
      - name: Select exact source and trusted policy base
        id: selection
        shell: bash
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          EVENT_PATH: ${{ forgejo.event_path }}
          EVENT_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              head_sha="$(jq -er '.pull_request.head.sha | strings | select(test("^[0-9a-f]{40}$"))' "$EVENT_PATH")"
              base_sha="$(jq -er '.pull_request.base.sha | strings | select(test("^[0-9a-f]{40}$"))' "$EVENT_PATH")"
              ;;
            push)
              head_sha="$EVENT_SHA"
              base_sha="$EVENT_SHA"
              ;;
            *)
              echo 'unsupported source-approval event' >&2
              exit 64
              ;;
          esac
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ && "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
          } >> "$FORGEJO_OUTPUT"

      - name: Check out protected policy base
        uses: noel/actions-checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.selection.outputs.base_sha }}
          path: .source-approval-base
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Check out exact candidate source as data
        uses: noel/actions-checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.selection.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Check out candidate history as data for the content scan
        if: forgejo.event_name == 'pull_request_target'
        uses: noel/actions-checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.selection.outputs.head_sha }}
          path: .content-scan
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Refuse private content before merge
        if: forgejo.event_name == 'pull_request_target'
        shell: bash
        working-directory: .content-scan
        env:
          BASE_SHA: ${{ steps.selection.outputs.base_sha }}
          EVENT_PATH: ${{ forgejo.event_path }}
          HEAD_SHA: ${{ steps.selection.outputs.head_sha }}
          # The mirror's own private patterns. A finding names only the commit and
          # the pattern number; an empty variable fails closed.
          MIRROR_PRIVATE_CONTENT_PATTERNS: ${{ vars.MIRROR_PRIVATE_CONTENT_PATTERNS }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=core.hooksPath
          export GIT_CONFIG_VALUE_0=/dev/null
          export GIT_OPTIONAL_LOCKS=0

          [[ "$(git rev-parse --verify HEAD^{commit})" == "$HEAD_SHA" ]]
          trusted="$GITHUB_WORKSPACE/.source-approval-base/scripts/ci/release"
          for input in "$trusted/check-mirror-content.sh" "$trusted/public-content-patterns.txt"; do
            [[ -f "$input" && ! -L "$input" ]] || {
              echo "protected-base content scan input is not a regular file: $input" >&2
              exit 65
            }
          done
          # The squash commit's message comes from the title and body.
          text="$(mktemp)"
          jq -r '[.pull_request.title // "", .pull_request.body // ""] | join("\n")' \
            "$EVENT_PATH" >"$text"
          CI=true bash "$trusted/check-mirror-content.sh" --pull-request --no-gitleaks \
            --patterns "$trusted/public-content-patterns.txt" --message-file "$text" \
            "$BASE_SHA" "$HEAD_SHA"

      - name: Verify the mounted advisory bundle
        id: advisories
        shell: bash
        env:
          # infra#1630: every untrusted light runner pod mounts the hourly supplychain
          # advisory bundle read-only here. A bundle that is absent, altered
          # or more than 24 hours old fails the scan closed. Codewire takes
          # only its IOC and OSM data; OSV stays live against api.osv.dev.
          ADVISORIES: /opt/supplychain/advisories
          MAX_AGE_SECONDS: "86400"
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/supplychain-data.XXXXXX")"
          python3 -I - "$ADVISORIES" "$MAX_AGE_SECONDS" "$data_dir" <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          root, max_age, data_dir = Path(sys.argv[1]), int(sys.argv[2]), Path(sys.argv[3])


          def refuse(reason):
              print("advisory bundle refused: " + reason, file=sys.stderr)
              sys.exit(65)


          manifest_path = root / "manifest.json"
          if not manifest_path.is_file() or manifest_path.is_symlink():
              refuse("no manifest.json at " + str(root) + "; the bundle is not mounted")
          raw = manifest_path.read_bytes()
          try:
              manifest = json.loads(raw)
              built = datetime.datetime.fromisoformat(manifest["built_at"].replace("Z", "+00:00"))
              listed = {item["path"]: item for item in manifest["files"]}
          except (ValueError, KeyError, TypeError, AttributeError):
              refuse("manifest.json is malformed")
          if manifest.get("schema") != 1 or built.tzinfo is None:
              refuse("manifest.json has an unknown schema or time")
          age = int((datetime.datetime.now(datetime.timezone.utc) - built).total_seconds())
          if not -300 <= age <= max_age:
              refuse(f"the bundle built at {manifest['built_at']} is {age} s old; the limit is {max_age} s")
          present = sorted(path.relative_to(root).as_posix() for path in root.rglob("*")
                           if not path.is_dir() or path.is_symlink())
          if present != sorted([*listed, "manifest.json"]):
              refuse("the bundle's files differ from its manifest")
          required = {f"osv-scanner/{name}/all.zip" for name in ("crates.io", "Go", "npm", "PyPI")}
          required |= {"data/iocs/manifest.json", "data/osm-cache.json"}
          if not required <= set(listed):
              refuse("the bundle lacks a required database or data file")
          for name, item in sorted(listed.items()):
              path = root / name
              digest = hashlib.sha256()
              with open(path, "rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      digest.update(block)
              if digest.hexdigest() != item.get("sha256") or path.stat().st_size != item.get("bytes"):
                  refuse(name + " differs from the manifest")
          # supplychain writes its registry caches beside the data, so it gets
          # a private writable copy of the verified IOC and OSM files.
          # copytree also copies the bundle's read-only mode onto data_dir itself.
          shutil.copytree(root / "data", data_dir, dirs_exist_ok=True)
          for path in [data_dir, *data_dir.rglob("*")]:
              path.chmod(0o700 if path.is_dir() else 0o600)
          receipt = {
              "manifest_sha256": hashlib.sha256(raw).hexdigest(),
              "built_at": manifest["built_at"],
              "age_seconds": age,
              "osv_last_modified": {name: value.get("last_modified") for name, value in sorted(manifest.get("osv", {}).items())},
          }
          print("advisory bundle receipt: " + json.dumps(receipt, sort_keys=True))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("### Advisory bundle\n\n```json\n" + json.dumps(receipt, indent=2, sort_keys=True) + "\n```\n")
          PY
          echo "data_dir=$data_dir" >> "$FORGEJO_OUTPUT"

      - name: Run the sealed supply-chain scan
        shell: bash
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.selection.outputs.base_sha }}
          EVENT_NAME: ${{ forgejo.event_name }}
          EXPECTED_SUPPLYCHAIN: cf1984547d9af47807e4f27766baa2cc7f84579d
          HEAD_SHA: ${{ steps.selection.outputs.head_sha }}
          SUPPLYCHAIN_DATA_DIR: ${{ steps.advisories.outputs.data_dir }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=core.hooksPath
          export GIT_CONFIG_VALUE_0=/dev/null
          export GIT_OPTIONAL_LOCKS=0

          [[ "$(git rev-parse --verify HEAD^{commit})" == "$HEAD_SHA" ]]
          [[ "$(git -C "$GITHUB_WORKSPACE/.source-approval-base" rev-parse --verify HEAD^{commit})" == "$BASE_SHA" ]]
          [[ "$(supplychain version)" == "supplychain $EXPECTED_SUPPLYCHAIN" ]]

          source_policy=.supplychain/source-policy.json
          gitleaks_config=.gitleaks.toml
          bun_baseline=.supplychain/bun-baseline.json
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            install_trusted_input() {
              local source="$1"
              local destination="$2"
              local description="$3"
              [[ -f "$source" && ! -L "$source" ]] || {
                echo "protected-base $description is not a regular file" >&2
                exit 65
              }
              rm -f -- "$destination"
              install -m 0444 -- "$source" "$destination"
              git add -f -- "$destination"
            }

            source_policy=.trusted-base-source-policy.json
            gitleaks_config=.trusted-base-gitleaks.toml
            bun_baseline=.trusted-base-bun-baseline.json
            install_trusted_input \
              "$GITHUB_WORKSPACE/.source-approval-base/.supplychain/source-policy.json" \
              "$source_policy" \
              'source policy'
            install_trusted_input \
              "$GITHUB_WORKSPACE/.source-approval-base/.gitleaks.toml" \
              "$gitleaks_config" \
              'Gitleaks policy'
            install_trusted_input \
              "$GITHUB_WORKSPACE/.source-approval-base/.supplychain/bun-baseline.json" \
              "$bun_baseline" \
              'Bun review baseline'
          else
            for input in "$source_policy" "$gitleaks_config" "$bun_baseline"; do
              [[ -f "$input" && ! -L "$input" ]] || {
                echo "canonical source-approval input is not a regular file: $input" >&2
                exit 65
              }
            done
          fi

          supplychain \
            --source-policy="$source_policy" \
            ci \
            --policy=strict \
            --gitleaks-config="$gitleaks_config" \
            --baseline="$bun_baseline" \
            .
