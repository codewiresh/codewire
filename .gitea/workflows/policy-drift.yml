name: Policy drift

# The pre-merge policy drift check (#3821): a pull request's tree against the
# boundaries codewire/deploy and the infrastructure repository own, so a
# change one of them would refuse fails here, not at the next Dev promotion or
# Pod admission. CODEWIRE_POLICY_DRIFT_INFRA_REPOSITORY names that repository
# and CODEWIRE_IMAGE_REGISTRY the hosted registry; both are repository Actions
# variables (docs/dev/CI-CONFIGURATION.md).
#
# The workflow comes from protected base main. The candidate is checked out as
# data only: the scripts that run are base's, deploy's guards come from deploy
# main, and render.py refuses Kustomize inputs that are not local. OIDC is
# enabled for this workflow alone, so the read-only codewire-policy-drift-read
# integration (infra access/forgejo-codewire-policy-drift-authorized-
# integration.json) is reachable only from this job. Its claims bind
# pull_request_target and this file at refs/heads/main, which Forgejo sets
# from the base branch for that event. The supply-chain scan, which parses
# untrusted content, runs in another workflow without OIDC. A pull request
# based on another branch is therefore never checked here: it fails at once,
# naming its base, and is checked by the next push after it targets main.
on:
  # zizmor: ignore[dangerous-triggers] The protected-base workflow runs only base scripts and deploy main's guards over candidate data.
  pull_request_target:
    types: [opened, synchronize, reopened]

enable-openid-connect: true

jobs:
  policy-drift: # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; the integration is read-only on exactly two repositories.
    name: Policy drift
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    timeout-minutes: 15
    steps:
      - name: Select the candidate and the protected base
        id: selection
        shell: bash
        env:
          EVENT_PATH: ${{ forgejo.event_path }}
        run: |
          set -euo pipefail
          # The integration admits only main's copy of this workflow, and
          # pull_request_target runs the base branch's copy, so a pull request
          # based on another branch (a stacked one) cannot read deploy's guards.
          # It asks for no token and fails, naming its base: a pass here would
          # stay on its head when it is retargeted to main, which starts no run
          # (#4686). Into main, the next push runs the check.
          base_ref="$(jq -er '.pull_request.base.ref | strings' "$EVENT_PATH")"
          if [[ "$base_ref" != main ]]; then
            [[ "$base_ref" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || base_ref='another branch'
            echo "::error::Policy drift not checked: base is $base_ref. After retargeting to main, push again (or merge main in) to run the check (#4686)."
            exit 1
          fi
          head_sha="$(jq -er '.pull_request.head.sha | strings | select(test("^[0-9a-f]{40}$"))' "$EVENT_PATH")"
          base_sha="$(jq -er '.pull_request.base.sha | strings | select(test("^[0-9a-f]{40}$"))' "$EVENT_PATH")"
          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
          } >> "$FORGEJO_OUTPUT"

      - name: Check out protected base
        uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.base_sha }}
          path: .policy-drift-base
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Check out the candidate as data
        uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Check the candidate against deploy's guards and the clusters' sandbox policy
        shell: bash
        env:
          CODEWIRE_POLICY_DRIFT_INFRA_REPOSITORY: ${{ vars.CODEWIRE_POLICY_DRIFT_INFRA_REPOSITORY }}
          CODEWIRE_IMAGE_REGISTRY: ${{ vars.CODEWIRE_IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          base="$PWD/.policy-drift-base"
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/policy-drift.XXXXXX")"
          mkdir "$work/sources"
          # The runner image seals the official Kyverno CLI 1.17.1 off PATH;
          # this runner's egress has no GitHub to fetch it from (#3821).
          kyverno=/usr/local/libexec/kyverno-1.17.1
          if [[ ! -f "$kyverno" || ! -x "$kyverno" ]]; then
            echo "::error::the runner image has no sealed Kyverno CLI at $kyverno (runner image v10 seals it)"
            exit 1
          fi
          printf '%s  %s\n' 31388ab9b889429cfb48923d00e46159a9cecd30cdc906edbef725a60a7e587e "$kyverno" |
            sha256sum --check --strict --quiet -
          "$base/scripts/ci/setup/fetch-forgejo-policy-drift-token.sh" "$work/token"
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
          "$base/scripts/ci/verify/clone-policy-drift-sources.sh" "$work/token" "$work/sources"
          "$base/scripts/ci/verify/check-policy-drift.sh" \
            "$PWD/candidate" "$work/sources/deploy" "$work/sources/infra" "$kyverno"
