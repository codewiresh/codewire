name: Claude E2E

# Gated: real Anthropic API call per run. Don't trigger from every PR.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  claude-parity:
    name: Run claude in all three SDKs
    runs-on: ubuntu-latest
    # Uses ANTHROPIC_API_KEY (sk-ant-api…), not the OAuth token. The established
    # Codewire Infisical exporter selects the codewire project root: dev for a
    # manually dispatched branch and prod for a signed release tag. The cw CLI
    # forwards $ANTHROPIC_API_KEY into the container automatically.
    #
    # Tests run against Haiku — cheapest model, plenty for an "is it alive"
    # smoke check. Each parity run = three short Haiku calls.
    env:
      CW_EXAMPLE_IMAGE: ghcr.io/codewiresh/workspace@sha256:93623453cf2046fbca5f77a8f24d606e9dde9e5d9514e84d4b110a19f9661145
      CW_EXAMPLE_CMD: 'claude --model haiku -p "Reply with exactly one word: hello"'
      INFISICAL_WORKSPACE_SLUG: codewire
      INFISICAL_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
      INFISICAL_SECRET_PATH: /
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: stable

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.4'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            libs/sdk-ts/package-lock.json
            libs/sdk-examples/run-claude/typescript/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Build cw binary
        run: cargo build --locked --profile ci -p codewire-cli-bin --bin cw && cp target/ci/cw "$GITHUB_WORKSPACE/cw"

      - name: Pre-pull the full image
        run: docker pull "$CW_EXAMPLE_IMAGE"

      - name: Install Python SDK with hash-pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r libs/sdk-python/requirements.lock
          python -m pip install --no-deps -e libs/sdk-python

      - name: Build TypeScript SDK
        run: |
          npm --prefix libs/sdk-ts ci --ignore-scripts
          npm --prefix libs/sdk-ts run build

      - name: Install TypeScript example deps
        run: npm --prefix libs/sdk-examples/run-claude/typescript ci --ignore-scripts

      - name: Export Anthropic API key from Codewire Infisical
        run: scripts/ci/setup/export-infisical-secrets.sh ANTHROPIC_API_KEY

      - name: Run claude through all three SDKs
        env:
          CW_BIN: ${{ github.workspace }}/cw
        run: GOWORK=off make sdk-run-claude

      - name: Clean up any orphan local instances
        if: always()
        env:
          CW_BIN: ${{ github.workspace }}/cw
        run: |
          instances_json="$($CW_BIN local list --json 2>/dev/null)" || instances_json='[]'
          python -c "import json,sys; print('\n'.join(i['name'] for i in json.load(sys.stdin) if i['name'].startswith('cw-example-')))" \
            <<<"$instances_json" \
            | xargs -r -n1 $CW_BIN local rm --json 2>&1 || true
