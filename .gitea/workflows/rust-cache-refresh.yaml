name: Rust dependency cache refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dependency-cache-main
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239

jobs:
  plan:
    name: Plan Rust dependency caches
    runs-on: ubuntu-latest
    outputs:
      head_commit: ${{ steps.plan.outputs.rust_cache_head_commit }}
      head_tree: ${{ steps.plan.outputs.rust_cache_head_tree }}
      host_debug_compatibility: ${{ steps.plan.outputs.rust_cache_host_debug_compatibility }}
      host_ci_compatibility: ${{ steps.plan.outputs.rust_cache_host_ci_compatibility }}
      kind_ci_compatibility: ${{ steps.plan.outputs.rust_cache_kind_ci_compatibility }}
      cw_cross_ci_compatibility: ${{ steps.plan.outputs.rust_cache_cw_cross_ci_compatibility }}
      desktop_release_compatibility: ${{ steps.plan.outputs.rust_cache_desktop_release_compatibility }}
      previous_receipt: ${{ steps.previous.outputs.rust_cache_receipt }}
      previous_host_debug_key: ${{ steps.previous.outputs.rust_cache_host_debug_key }}
      previous_host_debug_compatibility: ${{ steps.previous.outputs.rust_cache_host_debug_compatibility }}
      previous_host_ci_key: ${{ steps.previous.outputs.rust_cache_host_ci_key }}
      previous_host_ci_compatibility: ${{ steps.previous.outputs.rust_cache_host_ci_compatibility }}
      previous_kind_ci_key: ${{ steps.previous.outputs.rust_cache_kind_ci_key }}
      previous_kind_ci_compatibility: ${{ steps.previous.outputs.rust_cache_kind_ci_compatibility }}
      previous_cw_cross_ci_key: ${{ steps.previous.outputs.rust_cache_cw_cross_ci_key }}
      previous_cw_cross_ci_compatibility: ${{ steps.previous.outputs.rust_cache_cw_cross_ci_compatibility }}
      previous_desktop_release_key: ${{ steps.previous.outputs.rust_cache_desktop_release_key }}
      previous_desktop_release_compatibility: ${{ steps.previous.outputs.rust_cache_desktop_release_compatibility }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify immutable runner contract
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.91.1

      - name: Plan exact current compatibility identities
        id: plan
        run: |
          set -euo pipefail
          plan_file="$(mktemp)"
          trap 'rm -f "$plan_file"' EXIT
          python3 scripts/ci/plan/planner.py \
            --repository . \
            --target-base "$GITHUB_SHA" \
            --head "$GITHUB_SHA" \
            --trusted-policy "$GITHUB_SHA" \
            --output "$plan_file"
          python3 scripts/ci/plan/apply-rust-cache-plan.py --plan "$plan_file"

      - name: Resolve previous exact canonical receipt
        id: previous
        env:
          GITEA_TOKEN: ${{ github.token }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            source_sha="${PUSH_BEFORE_SHA:-}"
          fi
          CODEWIRE_CACHE_SOURCE_SHA="$source_sha" \
            scripts/ci/receipts/verify-rust-cache-receipt.sh

  host-debug:
    name: Refresh Rust cache / host debug
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
      actions: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select exact key
        id: key
        run: scripts/ci/cache/select-rust-cache-key.sh host-debug generic '${{ needs.plan.outputs.host_debug_compatibility }}' '${{ needs.plan.outputs.previous_host_debug_compatibility }}' '${{ needs.plan.outputs.previous_host_debug_key }}'
      - name: Probe immutable exact cache
        id: probe
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/host-debug
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        with:
          toolchain: 1.91.1
          components: rustfmt,clippy
      - name: Verify immutable runner contract
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh
      - name: Build dependency cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-debug
        run: scripts/ci/cache/prepare-rust-dependency-cache.sh host-debug
      - name: Save immutable exact cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        uses: actions/cache/save@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/host-debug
          key: ${{ steps.key.outputs.key }}

  host-ci:
    name: Refresh Rust cache / host CI
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
      actions: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select exact key
        id: key
        run: scripts/ci/cache/select-rust-cache-key.sh host-ci generic '${{ needs.plan.outputs.host_ci_compatibility }}' '${{ needs.plan.outputs.previous_host_ci_compatibility }}' '${{ needs.plan.outputs.previous_host_ci_key }}'
      - name: Probe immutable exact cache
        id: probe
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/host-ci
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        with:
          toolchain: 1.91.1
      - name: Verify immutable runner contract
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh
      - name: Build dependency cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/host-ci
        run: scripts/ci/cache/prepare-rust-dependency-cache.sh host-ci
      - name: Save immutable exact cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        uses: actions/cache/save@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/host-ci
          key: ${{ steps.key.outputs.key }}

  kind-ci:
    name: Refresh Rust cache / Kind CI
    runs-on: kind-e2e
    needs: [plan]
    permissions:
      contents: read
      actions: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select exact key
        id: key
        run: scripts/ci/cache/select-rust-cache-key.sh kind-ci kind '${{ needs.plan.outputs.kind_ci_compatibility }}' '${{ needs.plan.outputs.previous_kind_ci_compatibility }}' '${{ needs.plan.outputs.previous_kind_ci_key }}'
      - name: Probe immutable exact cache
        id: probe
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/kind-ci
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        with:
          toolchain: 1.91.1
      - name: Verify immutable runner contract
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh
      - name: Build dependency cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/kind-ci
        run: scripts/ci/cache/prepare-rust-dependency-cache.sh kind-ci
      - name: Save immutable exact cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        uses: actions/cache/save@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/kind-ci
          key: ${{ steps.key.outputs.key }}

  cw-cross-ci:
    name: Refresh Rust cache / cw cross-target CI
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
      actions: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select exact key
        id: key
        run: scripts/ci/cache/select-rust-cache-key.sh cw-cross-ci generic '${{ needs.plan.outputs.cw_cross_ci_compatibility }}' '${{ needs.plan.outputs.previous_cw_cross_ci_compatibility }}' '${{ needs.plan.outputs.previous_cw_cross_ci_key }}'
      - name: Probe immutable exact cache
        id: probe
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/cw-cross-ci
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        with:
          toolchain: 1.91.1
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin
      - name: Verify immutable runner contract
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh
      - name: Set up pinned Zig
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        run: |
          set -euo pipefail
          curl -fsSLo zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_X86_64_LINUX_SHA256}  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build dependency cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/cw-cross-ci
        run: scripts/ci/cache/prepare-rust-dependency-cache.sh cw-cross-ci
      - name: Save immutable exact cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        uses: actions/cache/save@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/cw-cross-ci
          key: ${{ steps.key.outputs.key }}

  desktop-release:
    name: Refresh Rust cache / desktop release
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
      actions: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select exact key
        id: key
        run: scripts/ci/cache/select-rust-cache-key.sh desktop-release generic '${{ needs.plan.outputs.desktop_release_compatibility }}' '${{ needs.plan.outputs.previous_desktop_release_compatibility }}' '${{ needs.plan.outputs.previous_desktop_release_key }}'
      - name: Probe immutable exact cache
        id: probe
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/desktop-release
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        with:
          toolchain: 1.91.1
      - name: Verify immutable runner contract
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        run: scripts/ci/setup/assert-ci-runner-image.sh
      - name: Build dependency cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cache/desktop-release
        run: scripts/ci/cache/prepare-rust-dependency-cache.sh desktop-release
      - name: Save immutable exact cache
        if: ${{ steps.probe.outputs.cache-hit == '' }}
        uses: actions/cache/save@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/desktop-release
          key: ${{ steps.key.outputs.key }}

  generic-availability:
    name: Prove generic Rust cache availability
    runs-on: ubuntu-latest
    needs: [host-debug, host-ci, cw-cross-ci, desktop-release]
    permissions:
      contents: read
      actions: read
    outputs:
      host_debug_key: ${{ steps.availability.outputs.host_debug_key }}
      host_debug_available: ${{ steps.availability.outputs.host_debug_available }}
      host_ci_key: ${{ steps.availability.outputs.host_ci_key }}
      host_ci_available: ${{ steps.availability.outputs.host_ci_available }}
      cw_cross_ci_key: ${{ steps.availability.outputs.cw_cross_ci_key }}
      cw_cross_ci_available: ${{ steps.availability.outputs.cw_cross_ci_available }}
      desktop_release_key: ${{ steps.availability.outputs.desktop_release_key }}
      desktop_release_available: ${{ steps.availability.outputs.desktop_release_available }}
    steps:
      - name: Prove exact host debug cache
        id: host-debug
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/host-debug
          key: ${{ needs.host-debug.outputs.key }}
          lookup-only: true
      - name: Prove exact host CI cache
        id: host-ci
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/host-ci
          key: ${{ needs.host-ci.outputs.key }}
          lookup-only: true
      - name: Prove exact CW cross-target cache
        id: cw-cross-ci
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/cw-cross-ci
          key: ${{ needs.cw-cross-ci.outputs.key }}
          lookup-only: true
      - name: Prove exact desktop release cache
        id: desktop-release
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/desktop-release
          key: ${{ needs.desktop-release.outputs.key }}
          lookup-only: true
      - name: Record generic exact cache availability
        id: availability
        env:
          HOST_DEBUG_KEY: ${{ needs.host-debug.outputs.key }}
          HOST_DEBUG_HIT: ${{ steps.host-debug.outputs.cache-hit }}
          HOST_CI_KEY: ${{ needs.host-ci.outputs.key }}
          HOST_CI_HIT: ${{ steps.host-ci.outputs.cache-hit }}
          CW_CROSS_CI_KEY: ${{ needs.cw-cross-ci.outputs.key }}
          CW_CROSS_CI_HIT: ${{ steps.cw-cross-ci.outputs.cache-hit }}
          DESKTOP_RELEASE_KEY: ${{ needs.desktop-release.outputs.key }}
          DESKTOP_RELEASE_HIT: ${{ steps.desktop-release.outputs.cache-hit }}
        run: |
          set -euo pipefail
          record() {
            local name="$1" key="$2" hit="$3"
            case "$hit" in
              true) printf '%s_key=%s\n%s_available=true\n' "$name" "$key" "$name" >> "$GITHUB_OUTPUT" ;;
              false|'') printf '%s_key=\n%s_available=false\n' "$name" "$name" >> "$GITHUB_OUTPUT" ;;
              *) echo "unexpected exact cache probe state for $name" >&2; exit 1 ;;
            esac
          }
          record host_debug "$HOST_DEBUG_KEY" "$HOST_DEBUG_HIT"
          record host_ci "$HOST_CI_KEY" "$HOST_CI_HIT"
          record cw_cross_ci "$CW_CROSS_CI_KEY" "$CW_CROSS_CI_HIT"
          record desktop_release "$DESKTOP_RELEASE_KEY" "$DESKTOP_RELEASE_HIT"

  kind-availability:
    name: Prove Kind Rust cache availability
    runs-on: kind-e2e
    needs: [kind-ci]
    permissions:
      contents: read
      actions: read
    outputs:
      kind_ci_key: ${{ steps.availability.outputs.kind_ci_key }}
      kind_ci_available: ${{ steps.availability.outputs.kind_ci_available }}
    steps:
      - name: Prove exact Kind cache
        id: kind-ci
        uses: actions/cache/restore@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: target/ci-cache/kind-ci
          key: ${{ needs.kind-ci.outputs.key }}
          lookup-only: true
      - name: Record Kind exact cache availability
        id: availability
        env:
          KIND_CI_KEY: ${{ needs.kind-ci.outputs.key }}
          KIND_CI_HIT: ${{ steps.kind-ci.outputs.cache-hit }}
        run: |
          set -euo pipefail
          case "$KIND_CI_HIT" in
            true) printf 'kind_ci_key=%s\nkind_ci_available=true\n' "$KIND_CI_KEY" >> "$GITHUB_OUTPUT" ;;
            false|'') printf 'kind_ci_key=\nkind_ci_available=false\n' >> "$GITHUB_OUTPUT" ;;
            *) echo 'unexpected exact cache probe state for kind_ci' >&2; exit 1 ;;
          esac

  receipt:
    name: Publish Rust cache receipt
    runs-on: ubuntu-latest
    needs: [plan, generic-availability, kind-availability]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Emit exact cache receipt
        env:
          CODEWIRE_CACHE_HEAD_COMMIT: ${{ needs.plan.outputs.head_commit }}
          CODEWIRE_CACHE_HEAD_TREE: ${{ needs.plan.outputs.head_tree }}
          CODEWIRE_RUST_CACHE_HOST_DEBUG_COMPATIBILITY: ${{ needs.plan.outputs.host_debug_compatibility }}
          CODEWIRE_RUST_CACHE_HOST_DEBUG_AVAILABLE: ${{ needs.generic-availability.outputs.host_debug_available }}
          CODEWIRE_RUST_CACHE_HOST_DEBUG_KEY: ${{ needs.generic-availability.outputs.host_debug_key }}
          CODEWIRE_RUST_CACHE_HOST_CI_COMPATIBILITY: ${{ needs.plan.outputs.host_ci_compatibility }}
          CODEWIRE_RUST_CACHE_HOST_CI_AVAILABLE: ${{ needs.generic-availability.outputs.host_ci_available }}
          CODEWIRE_RUST_CACHE_HOST_CI_KEY: ${{ needs.generic-availability.outputs.host_ci_key }}
          CODEWIRE_RUST_CACHE_KIND_CI_COMPATIBILITY: ${{ needs.plan.outputs.kind_ci_compatibility }}
          CODEWIRE_RUST_CACHE_KIND_CI_AVAILABLE: ${{ needs.kind-availability.outputs.kind_ci_available }}
          CODEWIRE_RUST_CACHE_KIND_CI_KEY: ${{ needs.kind-availability.outputs.kind_ci_key }}
          CODEWIRE_RUST_CACHE_CW_CROSS_CI_COMPATIBILITY: ${{ needs.plan.outputs.cw_cross_ci_compatibility }}
          CODEWIRE_RUST_CACHE_CW_CROSS_CI_AVAILABLE: ${{ needs.generic-availability.outputs.cw_cross_ci_available }}
          CODEWIRE_RUST_CACHE_CW_CROSS_CI_KEY: ${{ needs.generic-availability.outputs.cw_cross_ci_key }}
          CODEWIRE_RUST_CACHE_DESKTOP_RELEASE_COMPATIBILITY: ${{ needs.plan.outputs.desktop_release_compatibility }}
          CODEWIRE_RUST_CACHE_DESKTOP_RELEASE_AVAILABLE: ${{ needs.generic-availability.outputs.desktop_release_available }}
          CODEWIRE_RUST_CACHE_DESKTOP_RELEASE_KEY: ${{ needs.generic-availability.outputs.desktop_release_key }}
        run: python3 scripts/ci/receipts/emit-rust-cache-receipt.py
