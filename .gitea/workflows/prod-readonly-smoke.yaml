name: Prod Read-only Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-readonly-smoke:
    name: Production Read-only Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: https://forgejo.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Configure production kube context
        run: |
          set -euo pipefail
          export KUBECONFIG="${RUNNER_TEMP:-/tmp}/codewire-prod-smoke-${GITHUB_RUN_ID:-manual}.kubeconfig"
          KUBE_TOKEN_PATH_ENV=CODEWIRE_TOKEN_PATH \
            KUBE_SERVER_ENV=CODEWIRE_K8S_SERVER \
            KUBE_CLUSTER=csrke2 \
            KUBE_CONTEXT=csrke2 \
            scripts/ci/setup/setup-kubeconfig.sh

      - name: Run read-only production smoke
        run: |
          set -euo pipefail
          export KUBECONFIG="${RUNNER_TEMP:-/tmp}/codewire-prod-smoke-${GITHUB_RUN_ID:-manual}.kubeconfig"
          scripts/ci/verify/smoke-prod.sh
