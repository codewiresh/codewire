name: Release cw CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical vMAJOR.MINOR.PATCH tag to recover
        required: true
        type: string
      r2_publication:
        description: Immutable R2 publication (requires the admitted release route)
        required: false
        type: choice
        default: none
        options: [none, immutable]
      r2_promote_channel:
        description: Channel to move after exact public readback (default none)
        required: false
        type: choice
        default: none
        options: [none, stable]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2
  ZIG_X86_64_LINUX_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: 0.23.0
  # Signs and notarizes the macOS pair on Linux (#2064).
  RCODESIGN_VERSION: 0.29.0
  RCODESIGN_X86_64_LINUX_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
  # Cargo fetches git dependencies (noeljackson/av, tauri-apps/wry and
  # others) from github.com. Without a bound, a stalled connection holds
  # the job until its deadline (#2691). This bound fails a stalled connect,
  # TLS handshake or transfer in 20 s, and cargo logs and retries it.
  CARGO_HTTP_TIMEOUT: '20'
  CARGO_NET_RETRY: '5'
  OPENBAO_GITHUB_ROLE: codewire-source-cli-github-mirror
  OPENBAO_GITHUB_AUDIENCE: openbao-codewire-source-cli-github-mirror
  # The scoped R2 release route is admitted; publication and channel changes
  # remain explicit dispatch inputs (runbooks/cw-release-delivery.md).
  CW_RELEASE_R2_ROUTE_ADMITTED: 'true'

jobs:
  release-selection:
    name: Verify canonical CLI release tag
    runs-on: ci-lite
    outputs:
      release_tag: ${{ steps.select.outputs.release_tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      tag_object_sha: ${{ steps.select.outputs.tag_object_sha }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Refuse recovery control outside protected main
        if: github.event_name == 'workflow_dispatch'
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/main' ]
          [ "$GITHUB_REF_NAME" = 'main' ]
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Select exact canonical release source
        id: select
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
          # Reads Forgejo's signature verification for the release tag.
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          selected_tag="$GITHUB_REF_NAME"
          source_dir='.'
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            selected_tag="$RECOVERY_TAG"
            source_dir='.release-source'
          fi
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${selected_tag}" \
            "refs/tags/${selected_tag}^{}")"
          remote_object_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}" '$2 == ref { print $1 }')"
          remote_peeled_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}^{}" '$2 == ref { print $1 }')"
          canonical_main_sha="$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          source_sha="$(git -C "$source_dir" rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${selected_tag}:refs/tags/${selected_tag}"
          scripts/ci/release/verify-release-tag-ref.sh \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" \
            "$GITHUB_REF_NAME" \
            "$RECOVERY_TAG" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$source_sha" \
            "$remote_object_sha" \
            "$remote_peeled_sha" \
            "$canonical_main_sha"
          printf 'release_tag=%s\n' "$selected_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tag_object_sha=%s\n' "$remote_object_sha" >> "$GITHUB_OUTPUT"

  build-runtime-linux:
    # The Linux side of the local VM runtime every release cw embeds (#2539,
    # #2733): the arm64 guest root, the arm64 kernel (from the release parts
    # cache, or built in its pinned container), the aarch64 cw runtime and
    # the Linux-side GPL sources; and the Linux x86_64 target as the linux
    # fragment, which build-darwin merges into the one document. Each comes
    # from the release source's own scripts and pins. A source that predates
    # the runtime embeds none. Compilation and pinned downloads only: no
    # OIDC, signing, mirror or R2 write capability exists in this job.
    name: Build the local runtime's Linux side
    needs: [release-selection]
    runs-on: ci-protected
    # Both kernels (about 25 min each when not cached), both guest roots and
    # both cw runtimes (about 15 min each): bounded well below the pool's
    # limit, so a wedged build cannot hold a release for hours.
    timeout-minutes: 165
    outputs:
      present: ${{ steps.build.outputs.present }}
      linux_sha256: ${{ steps.build.outputs.linux_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$(git -C .release-source rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Verify sealed Rust toolchain and release targets
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip" \
            6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7 /tmp/protoc.zip
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Build the Linux side
        id: build
        working-directory: .release-source
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/release/build-local-runtime.sh ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The kernel build's container reaches only this job's workspace.
          work="$GITHUB_WORKSPACE/.local-runtime"
          mkdir -m 0700 "$work" "$work/tmp"
          TMPDIR="$work/tmp" LOCAL_RUNTIME_JOB_CONTAINER="${HOSTNAME:?}" \
            scripts/ci/release/build-local-runtime.sh linux --source-sha "$SOURCE_SHA" \
            --version "$RELEASE_TAG" --output "$work/linux"
          tar -C "$work" -cf "$work/runtime-linux.tar" linux
          printf 'present=true\nlinux_sha256=%s\n' \
            "$(sha256sum "$work/runtime-linux.tar" | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the Linux side to the macOS build
        if: steps.build.outputs.present == 'true'
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-release-runtime-linux-${{ github.run_id }}
          path: .local-runtime/runtime-linux.tar
          # The upload action skips hidden paths unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-darwin:
    # The macOS cw links Apple frameworks (Security, SystemConfiguration), so
    # it is built natively on the protected mac-runner runner: one ephemeral
    # registration per job, as the unprivileged ci account (infra
    # runbooks/macos-arm64-runner.md). Compilation only: no OIDC,
    # signing, mirror or R2 capability exists in this job.
    name: Build the macOS cw natively
    needs: [release-selection, build-runtime-linux]
    runs-on: macos-arm64
    outputs:
      darwin_sums_sha256: ${{ steps.build.outputs.darwin_sums_sha256 }}
      records_sha256: ${{ steps.runtime.outputs.records_sha256 }}
      # The one local runtime document every release cw embeds; build-release
      # requires the runtime it imports to be exactly this one.
      document_sha256: ${{ steps.runtime.outputs.document_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$(git -C .release-source rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-osx-aarch_64.zip" \
            193289af0470c6a1aada357d4fba0bbf8d78bfaac8b5e42ca30af2ef75583de2 "$HOME/protoc.zip"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q "$HOME/protoc.zip" -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Receive the local runtime's Linux side
        if: needs.build-runtime-linux.outputs.present == 'true'
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-release-runtime-linux-${{ github.run_id }}
          path: .local-runtime-linux

      # Every release cw embeds the runtime this step packs: the macOS target
      # merged with the Linux job's linux-x86_64 fragment. The parts either
      # job built (cache misses) go to the publishing job as cache records.
      - name: Build the local VM runtime
        id: runtime
        if: needs.build-runtime-linux.outputs.present == 'true'
        working-directory: .release-source
        env:
          LINUX_SHA256: ${{ needs.build-runtime-linux.outputs.linux_sha256 }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$LINUX_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(shasum -a 256 ../.local-runtime-linux/runtime-linux.tar | cut -c1-64)" = "$LINUX_SHA256" ]
          work="${RUNNER_TEMP:?}/codewire-local-runtime"
          mkdir -m 0700 "$work"
          tar -xf ../.local-runtime-linux/runtime-linux.tar -C "$work"
          scripts/ci/release/build-local-runtime.sh macos --linux "$work/linux" \
            --source-sha "$SOURCE_SHA" --output "$work/macos"
          echo "CW_RELEASE_LOCAL_RUNTIME_DIR=$work/macos/runtime" >> "$GITHUB_ENV"
          mkdir -m 0700 ../.runtime-records
          tar -C "$work/macos/built" -cf ../.runtime-records/runtime-records.tar .
          printf 'records_sha256=%s\n' \
            "$(shasum -a 256 ../.runtime-records/runtime-records.tar | cut -c1-64)" >> "$GITHUB_OUTPUT"
          printf 'document_sha256=%s\n' \
            "$(shasum -a 256 "$work/macos/runtime/local-runtime.json" | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the runtime part records to publication
        if: steps.runtime.outputs.records_sha256 != ''
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-release-runtime-records-${{ github.run_id }}
          path: .runtime-records/runtime-records.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Build the macOS pair
        id: build
        working-directory: .release-source
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CW_RELEASE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CW_RELEASE_TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          CW_RELEASE_TARGETS='aarch64-apple-darwin x86_64-apple-darwin' \
            ../scripts/ci/release/package-cw-release.sh "$RELEASE_TAG"
          (cd dist/cw-release && shasum -a 256 -c SHA256SUMS)
          printf 'darwin_sums_sha256=%s\n' \
            "$(shasum -a 256 dist/cw-release/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the macOS pair to packaging
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-release-darwin-${{ github.run_id }}
          path: .release-source/dist/cw-release/
          if-no-files-found: error
          retention-days: 1

  sign-darwin:
    # Developer ID signing and Apple notarization of the macOS pair (#2064).
    # Each target's identity binds its final bytes, so the pair is signed
    # before the delivery is prepared. Only this job reads the Apple keys; it
    # compiles nothing and holds no OpenPGP, mirror or R2 capability.
    name: Sign and notarize the macOS cw pair
    needs: [release-selection, build-darwin]
    runs-on: ci-protected
    enable-openid-connect: true
    outputs:
      darwin_sums_sha256: ${{ steps.sign.outputs.darwin_sums_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Receive the macOS pair
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-release-darwin-${{ github.run_id }}
          path: dist-darwin

      - name: Verify the received macOS pair is the built pair
        env:
          UNSIGNED_SUMS_SHA256: ${{ needs.build-darwin.outputs.darwin_sums_sha256 }}
        run: |
          set -euo pipefail
          [[ "$UNSIGNED_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum dist-darwin/SHA256SUMS | cut -c1-64)" = "$UNSIGNED_SUMS_SHA256" ]
          (cd dist-darwin && sha256sum --check SHA256SUMS)

      - name: Install rcodesign (pinned)
        run: |
          set -euo pipefail
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          scripts/ci/release/fetch-pinned.sh \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz" \
            "$RCODESIGN_X86_64_LINUX_SHA256" rcodesign.tar.gz
          mkdir -m 0700 .rcodesign
          tar -xzf rcodesign.tar.gz -C .rcodesign --strip-components=1 "${archive}/rcodesign"
          .rcodesign/rcodesign --version

      - name: Sign and notarize the macOS pair
        id: sign
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
        run: |
          set -euo pipefail
          umask 077
          # The Developer ID and notary API keys exist only in OpenBao. They
          # are read here, used only by the signer, and shredded before anything else.
          macos_work="$(mktemp -d "${RUNNER_TEMP:?}/codewire-macos-keys.XXXXXX")"
          cleanup_macos_keys() {
            find "$macos_work" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$macos_work"
          }
          trap cleanup_macos_keys EXIT
          scripts/ci/setup/fetch-openbao-macos-signing.sh "$macos_work/keys"
          scripts/ci/release/sign-macos-cw.sh .rcodesign/rcodesign "$macos_work/keys" \
            dist-darwin dist-darwin-signed "$RELEASE_TAG"
          cleanup_macos_keys
          trap - EXIT
          (cd dist-darwin-signed && sha256sum --check SHA256SUMS)
          printf 'darwin_sums_sha256=%s\n' \
            "$(sha256sum dist-darwin-signed/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the signed macOS pair to packaging
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-release-darwin-signed-${{ github.run_id }}
          path: dist-darwin-signed/
          if-no-files-found: error
          retention-days: 1

  build-release:
    # Compilation and packaging only: no OIDC, signing, mirror or R2
    # capability exists in this job.
    name: Build four-target cw release delivery
    needs: [release-selection, build-darwin, sign-darwin]
    runs-on: ci-protected
    outputs:
      delivery_sha256: ${{ steps.prepare.outputs.delivery_sha256 }}
      verifier_sha256: ${{ steps.verifier.outputs.verifier_sha256 }}
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$(git -C .release-source rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Verify sealed Rust toolchain and release targets
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip" \
            6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7 /tmp/protoc.zip
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Set up cross-build tools
        run: |
          set -euo pipefail
          scripts/ci/setup/assert-ci-runner-image.sh

          zig_url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          scripts/ci/release/fetch-pinned.sh "$zig_url" "$ZIG_X86_64_LINUX_SHA256" zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Receive the signed macOS pair
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-release-darwin-signed-${{ github.run_id }}
          path: .release-source/dist-darwin

      - name: Verify the received macOS pair is the signed pair
        working-directory: .release-source
        env:
          DARWIN_SUMS_SHA256: ${{ needs.sign-darwin.outputs.darwin_sums_sha256 }}
          DOCUMENT_SHA256: ${{ needs.build-darwin.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DARWIN_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum dist-darwin/SHA256SUMS | cut -c1-64)" = "$DARWIN_SUMS_SHA256" ]
          (cd dist-darwin && sha256sum --check SHA256SUMS)
          # The runtime the Linux cws embed is exactly the one the macOS job
          # packed and its cws embed; its blobs are bound by that document.
          if [ -n "$DOCUMENT_SHA256" ]; then
            [[ "$DOCUMENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [ "$(sha256sum dist-darwin/local-runtime/local-runtime.json | cut -c1-64)" = "$DOCUMENT_SHA256" ]
          else
            [ ! -e dist-darwin/local-runtime ]
          fi

      - name: Package unsigned release delivery
        id: prepare
        working-directory: .release-source
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CW_RELEASE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CW_RELEASE_TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
          DOCUMENT_SHA256: ${{ needs.build-darwin.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          # The macOS pair comes from build-darwin, signed by sign-darwin;
          # preparation admits each by its build record exactly as a local
          # build, and signing leaves that record unchanged. The Linux cws
          # embed the imported runtime, and every cw must embed exactly it.
          CW_RELEASE_BUILD_CMD='cargo zigbuild' \
            CW_RELEASE_TARGETS='x86_64-unknown-linux-musl aarch64-unknown-linux-gnu' \
            CW_RELEASE_IMPORT_DIR=dist-darwin \
            ../scripts/ci/release/package-cw-release.sh "$RELEASE_TAG"
          verified="$(python3 ../scripts/ci/release/cw_release.py verify --dist dist/cw-release --unsigned)"
          printf '%s\n' "$verified"
          if [ -n "$DOCUMENT_SHA256" ]; then
            grep -q "^cw-release: local runtime document_sha256=$DOCUMENT_SHA256 " <<<"$verified"
          fi
          (cd dist/cw-release && sha256sum --check --ignore-missing SHA256SUMS)
          printf 'delivery_sha256=%s\n' \
            "$(python3 ../scripts/ci/release/cw_release.py digest --dist dist/cw-release)" >> "$GITHUB_OUTPUT"

      - name: Hand the unsigned delivery to signing
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-release-delivery-${{ github.run_id }}
          path: .release-source/dist/cw-release/
          if-no-files-found: error
          retention-days: 1

      # cw verifies signatures with its own narrow verifier, not GnuPG. The
      # signing job runs this exact build of it before anything is published,
      # and compiles nothing itself while it holds release capabilities.
      - name: Build cw's release-signature verifier
        id: verifier
        working-directory: .release-source
        run: |
          set -euo pipefail
          cargo build --locked --release -p codewire-cw-release \
            --example verify-release-signatures --target-dir target/release-verifier
          mkdir -m 0700 ../.release-verifier
          cp target/release-verifier/release/examples/verify-release-signatures ../.release-verifier/
          printf 'verifier_sha256=%s\n' \
            "$(sha256sum ../.release-verifier/verify-release-signatures | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the signature verifier to signing
        uses: https://git.example.invalid/noel/actions-upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: cw-release-verifier-${{ github.run_id }}
          path: .release-verifier/
          # The upload action skips hidden paths, the named directory
          # included, unless asked; without this the verifier never uploads.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package-release:
    # Signing, mirror and R2 capabilities exist only after a successful build.
    name: Sign and publish cw release
    needs: [release-selection, build-darwin, build-release]
    runs-on: ci-protected
    enable-openid-connect: true
    permissions:
      contents: write
    steps:
      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: https://git.example.invalid/noel/actions-checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Confirm selected release checkout
        env:
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$(git -C .release-source rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Receive the unsigned delivery
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-release-delivery-${{ github.run_id }}
          path: .release-source/dist/cw-release

      - name: Verify the received delivery is the built delivery
        working-directory: .release-source
        env:
          DELIVERY_SHA256: ${{ needs.build-release.outputs.delivery_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(python3 ../scripts/ci/release/cw_release.py digest --dist dist/cw-release)" = "$DELIVERY_SHA256" ]
          python3 ../scripts/ci/release/cw_release.py verify --dist dist/cw-release --unsigned

      - name: Receive cw's release-signature verifier
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-release-verifier-${{ github.run_id }}
          path: .release-verifier

      - name: Verify the received verifier is the built verifier
        env:
          VERIFIER_SHA256: ${{ needs.build-release.outputs.verifier_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERIFIER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum .release-verifier/verify-release-signatures | cut -c1-64)" = "$VERIFIER_SHA256" ]
          chmod 0500 .release-verifier/verify-release-signatures

      - name: Reuse an already-published signed R2 release
        if: ${{ inputs.r2_publication == 'immutable' }}
        working-directory: .release-source
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$CW_RELEASE_R2_ROUTE_ADMITTED" = 'true' ] || {
            echo 'The R2 release route is not admitted; select r2_publication=none' >&2
            exit 1
          }
          r2_work="${RUNNER_TEMP:?}/codewire-release-r2"
          mkdir -m 0700 "$r2_work"
          ../scripts/ci/setup/fetch-openbao-releases-r2-credentials.sh "$r2_work/aws-credentials"
          state="$(python3 ../scripts/ci/release/cw_release_r2.py probe \
            --dist dist/cw-release --version "$RELEASE_TAG" \
            --retain-into dist/cw-release-retained --credentials "$r2_work/aws-credentials")"
          if [ "$state" = retained ]; then
            # A retry keeps the exact signed bytes already published.
            mv dist/cw-release dist/cw-release-rebuilt
            mv dist/cw-release-retained dist/cw-release
          fi
          printf 'CW_RELEASE_R2_STATE=%s\n' "$state" >> "$GITHUB_ENV"

      - name: Sign release delivery
        working-directory: .release-source
        run: |
          set -euo pipefail
          umask 077
          # The signing key exists only in OpenBao. It is read here, used only
          # by the key check and the signer, and shredded before anything else.
          signing_work="$(mktemp -d "${RUNNER_TEMP:?}/codewire-release-signing.XXXXXX")"
          cleanup_signing() {
            find "$signing_work" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$signing_work"
          }
          trap cleanup_signing EXIT
          ../scripts/ci/setup/fetch-openbao-release-signing-key.sh "$signing_work/key"
          (
            CW_RELEASE_GPG_PRIVATE_KEY="$(<"$signing_work/key/private-key.asc")"
            CW_RELEASE_GPG_PASSPHRASE="$(<"$signing_work/key/passphrase")"
            CW_RELEASE_GPG_KEY_ID="$(<"$signing_work/key/key-id")"
            export CW_RELEASE_GPG_PRIVATE_KEY CW_RELEASE_GPG_PASSPHRASE CW_RELEASE_GPG_KEY_ID
            ../scripts/ci/release/verify-cw-release-signing-key.sh apps/cli/GPG_PUBLIC_KEY.asc
            ../scripts/ci/release/sign-cw-release.sh dist/cw-release
          )
          cleanup_signing
          trap - EXIT
          gpg --import apps/cli/GPG_PUBLIC_KEY.asc
          gpg --verify dist/cw-release/SHA256SUMS.asc dist/cw-release/SHA256SUMS
          (cd dist/cw-release && sha256sum --check --ignore-missing SHA256SUMS)

      - name: Verify the signed delivery with cw's built-in verifier
        working-directory: .release-source
        run: |
          set -euo pipefail
          ../.release-verifier/verify-release-signatures apps/cli/GPG_PUBLIC_KEY.asc \
            A38FF6BC6623FCA611A7A32B5EFBF0F4A5870815 dist/cw-release

      - name: Publish immutable R2 release objects
        if: ${{ inputs.r2_publication == 'immutable' }}
        working-directory: .release-source
        env:
          PROMOTE_CHANNEL: ${{ inputs.r2_promote_channel }}
        run: |
          set -euo pipefail
          [ "$CW_RELEASE_R2_ROUTE_ADMITTED" = 'true' ]
          python3 ../scripts/ci/release/cw_release_r2.py publish \
            --dist dist/cw-release --credentials "${RUNNER_TEMP:?}/codewire-release-r2/aws-credentials" \
            --promote "$PROMOTE_CHANNEL"

      - name: Receive the runtime part records
        if: ${{ inputs.r2_publication == 'immutable' && needs.build-darwin.outputs.records_sha256 != '' }}
        uses: https://git.example.invalid/noel/actions-download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: cw-release-runtime-records-${{ github.run_id }}
          path: .runtime-records

      # A record names blobs this release published, so it is written after
      # them; a later release with the same recipe then reuses those bytes.
      - name: Record the runtime parts this release built
        if: ${{ inputs.r2_publication == 'immutable' && needs.build-darwin.outputs.records_sha256 != '' }}
        working-directory: .release-source
        env:
          RECORDS_SHA256: ${{ needs.build-darwin.outputs.records_sha256 }}
        run: |
          set -euo pipefail
          [ "$CW_RELEASE_R2_ROUTE_ADMITTED" = 'true' ]
          [[ "$RECORDS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum ../.runtime-records/runtime-records.tar | cut -c1-64)" = "$RECORDS_SHA256" ]
          if [ "$CW_RELEASE_R2_STATE" = retained ]; then
            echo 'runtime-part: a retained release keeps the records its first run wrote'
            exit 0
          fi
          records="$(mktemp -d "${RUNNER_TEMP:?}/codewire-runtime-records.XXXXXX")"
          tar -xf ../.runtime-records/runtime-records.tar -C "$records"
          python3 ../scripts/ci/release/local_runtime_parts.py publish --dist dist/cw-release \
            --records "$records" --credentials "${RUNNER_TEMP:?}/codewire-release-r2/aws-credentials"

      - name: Remove the R2 publisher credential
        if: ${{ always() && inputs.r2_publication == 'immutable' }}
        run: |
          r2_work="${RUNNER_TEMP:?}/codewire-release-r2"
          [ ! -d "$r2_work" ] || { find "$r2_work" -type f -exec shred -u {} + && rmdir "$r2_work"; }

      - name: Publish signed release assets
        working-directory: .release-source
        env:
          GITEA_TOKEN: ${{ github.token }}
          CW_REQUIRE_GITHUB_MIRROR: '1'
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CW_RELEASE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CW_RELEASE_TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          umask 077
          github_work="$(mktemp -d "${RUNNER_TEMP:?}/codewire-cli-github.XXXXXX")"
          cleanup_github() {
            find "$github_work" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$github_work"
          }
          trap cleanup_github EXIT
          ../scripts/ci/setup/fetch-openbao-github-mirror-credentials.sh \
            "$github_work/app-id" \
            "$github_work/installation-id" \
            "$github_work/private-key"
          ../scripts/ci/release/mint-github-app-token.sh \
            "$github_work/app-id" \
            "$github_work/installation-id" \
            "$github_work/private-key" \
            "$github_work/token"
          export GH_MIRROR_TOKEN_FILE="$github_work/token"
          gpg --verify dist/cw-release/SHA256SUMS.asc dist/cw-release/SHA256SUMS
          ../scripts/ci/release/publish-cw-release.sh "$RELEASE_TAG" dist/cw-release
