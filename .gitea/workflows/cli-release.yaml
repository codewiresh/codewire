name: Release cw CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical vMAJOR.MINOR.PATCH tag to recover
        required: true
        type: string
      r2_publication:
        description: Immutable R2 publication (requires the admitted release route)
        required: false
        type: choice
        default: none
        options: [none, immutable]
      r2_promote_channel:
        description: Channel to move after exact public readback (default none)
        required: false
        type: choice
        default: none
        options: [none, stable]

  # A pushed, signed release tag is picked up within five minutes (owner,
  # 2026-10-23, #2892). A scheduled run is main's workflow; its first job only
  # looks, and everything after it runs only for a pending tag.
  schedule:
    - cron: '2-59/5 * * * *'

# No concurrency group, so Forgejo queues no run behind another: before, every
# scheduled run waited behind the running one only to find nothing. The first
# job's release turn keeps deliveries one at a time instead (release-turn.py;
# owner, 2026-11-12, #3013). A group cannot be per run: Forgejo evaluates it
# before the run has an ID, so `github.run_id` is empty there and every run
# shared one group.

env:
  CODEWIRE_OPENBAO_ADDR: ${{ vars.CODEWIRE_OPENBAO_ADDR }}
  EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE: ${{ vars.EXPECTED_TAILNET_DIRECT_UDP_TRANSPORT_ZONE }}
  CODEWIRE_FORGEJO_INTERNAL_URL: ${{ vars.CODEWIRE_FORGEJO_INTERNAL_URL }}
  CONFIDENTIAL_SNP_NODE: ${{ vars.CONFIDENTIAL_SNP_NODE }}
  ARM64_BUILDKIT_HOST: ${{ vars.ARM64_BUILDKIT_HOST }}
  CODEWIRE_R2_RELEASES_ENDPOINT: ${{ vars.CODEWIRE_R2_RELEASES_ENDPOINT }}
  CODEWIRE_SOURCE_URL: ${{ vars.CODEWIRE_SOURCE_URL }}
  CODEWIRE_RELEASE_TAGGER: ${{ vars.CODEWIRE_RELEASE_TAGGER }}
  # Signs and notarizes the macOS pair and the VZ helper on Linux (#2064, #1905).
  RCODESIGN_VERSION: 0.29.0
  RCODESIGN_X86_64_LINUX_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
  # Cargo fetches git dependencies (noeljackson/av, tauri-apps/wry and
  # others) from github.com. Without a bound, a stalled connection holds
  # the job until its deadline (#2691). This bound fails a stalled connect,
  # TLS handshake or transfer in 20 s, and cargo logs and retries it.
  CARGO_HTTP_TIMEOUT: '20'
  CARGO_NET_RETRY: '5'
  OPENBAO_GITHUB_ROLE: ${{ github.event_name == 'schedule' && 'codewire-source-cli-github-mirror-schedule' || 'codewire-source-cli-github-mirror' }}
  OPENBAO_GITHUB_AUDIENCE: ${{ github.event_name == 'schedule' && 'openbao-codewire-source-cli-github-mirror-schedule' || 'openbao-codewire-source-cli-github-mirror' }}
  # The scoped R2 release route is admitted; publication and channel changes
  # remain explicit dispatch inputs (runbooks/cw-release-delivery.md).
  CW_RELEASE_R2_ROUTE_ADMITTED: 'true'

jobs:
  # The schedule and a dispatch both start here. This job holds only the
  # job token and runs main's code: it names the release to deliver, or none,
  # and nothing after it runs without one (find-pending-release.sh).
  pending:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Find the release to deliver
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    # A dispatch may wait for a release in flight (release-turn.py).
    timeout-minutes: 190
    outputs:
      release_tag: ${{ steps.find.outputs.release_tag }}
      r2_publication: ${{ steps.find.outputs.r2_publication }}
      r2_promote_channel: ${{ steps.find.outputs.r2_promote_channel }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # One delivery at a time, with no queue of runs that find nothing: a
      # scheduled run that finds another run looking or delivering ends here,
      # and a dispatch waits its turn (release-turn.py; owner, 2026-11-12,
      # #3013). Nothing running is ever cancelled.
      - name: Take this run's release turn
        id: turn
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/release/release-turn.py cli-release

      - name: Find the pending release
        if: ${{ steps.turn.outputs.turn == 'go' }}
        id: find
        env:
          GITEA_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ inputs.release_tag }}
          DISPATCHED_R2_PUBLICATION: ${{ inputs.r2_publication }}
          DISPATCHED_R2_PROMOTE_CHANNEL: ${{ inputs.r2_promote_channel }}
        run: scripts/ci/release/find-pending-release.sh cli-release

  release-selection:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    name: Verify canonical CLI release tag
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_UNTRUSTED_LIGHT' }}
    needs: [pending]
    if: ${{ needs.pending.outputs.release_tag != '' }}
    outputs:
      # A scheduled release publishes immutably and moves stable (owner,
      # 2026-10-23); a dispatch publishes as its inputs say.
      r2_publication: ${{ needs.pending.outputs.r2_publication }}
      r2_promote_channel: ${{ needs.pending.outputs.r2_promote_channel }}
      release_tag: ${{ steps.select.outputs.release_tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      tag_object_sha: ${{ steps.select.outputs.tag_object_sha }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Refuse release control outside protected main
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/main' ]
          [ "$GITHUB_REF_NAME" = 'main' ]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Select exact canonical release source
        id: select
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.release_tag }}
          # Reads Forgejo's signature verification for the release tag.
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag is verified from main's checkout before anything checks
          # out or runs its content: it must name a commit on main and carry
          # its own signature by the release tagger's account. Fetching it
          # only adds its objects; nothing here checks it out.
          selected_tag="$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${selected_tag}" \
            "refs/tags/${selected_tag}^{}")"
          remote_object_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}" '$2 == ref { print $1 }')"
          remote_peeled_sha="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${selected_tag}^{}" '$2 == ref { print $1 }')"
          canonical_main_sha="$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          source_sha="$remote_peeled_sha"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${selected_tag}:refs/tags/${selected_tag}"
          scripts/ci/release/verify-release-tag-ref.sh \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" \
            "$GITHUB_REF_NAME" \
            "$selected_tag" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$source_sha" \
            "$remote_object_sha" \
            "$remote_peeled_sha" \
            "$canonical_main_sha"
          # Release selection composes proofs (#2892):
          # - the tag's own signature, by the release tagger's account:
          #   verify-release-tag-ref.sh, above;
          # - the workspace image the release ships: the pin check;
          # - main CI and the dry run of the exact commit, and Kind while
          #   RELEASE_REQUIRES_KIND in the receipt says so (waived, owner,
          #   2026-10-25, #3013): the receipt's source evidence;
          # - Dev acceptance: promote-prod, which dispatch-deploy-prod.sh waits
          #   for and cli-release requires.
          python3 scripts/ci/images/workspace-image-pin.py check --release --commit "$source_sha"
          receipt="$(PREFLIGHT_RELEASE_TAG_REF="refs/tags/${selected_tag}" \
            PREFLIGHT_RELEASE_TAG_OBJECT_SHA="$remote_object_sha" \
            PREFLIGHT_PUSH_REMOTE_NAME=origin \
            scripts/ci/receipts/verify-release-tag-receipt.sh --source-evidence)"
          printf '%s\n' "$receipt"
          grep -Fxq 'release_tag_receipt=accepted' <<<"$receipt"
          grep -Fxq 'release_tag_scope=source-evidence' <<<"$receipt"
          # One version for web and CLI: a CLI ships only after Production
          # accepted the same release.
          scripts/ci/release/require-production-accepted.sh "$selected_tag" "$remote_object_sha" "$source_sha"
          printf 'release_tag=%s\n' "$selected_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tag_object_sha=%s\n' "$remote_object_sha" >> "$GITHUB_OUTPUT"

  build-runtime-linux:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # The Linux side of the local VM runtime every release cw embeds (#2539,
    # #2733): the arm64 guest root, the arm64 kernel (from the release parts
    # cache, or built in its pinned container), the aarch64 cw runtime and
    # the Linux-side GPL sources; and the Linux x86_64 target as the linux
    # fragment, which pack-runtime merges into the one document. Each comes
    # from the release source's own scripts and pins. A source that predates
    # the runtime embeds none. Compilation and pinned downloads only: no
    # OIDC, signing, mirror or R2 write capability exists in this job.
    name: Build the local runtime's Linux side
    needs: [release-selection]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    # Both kernels (about 20 min, side by side, when not cached), then each
    # target's guest root and cw runtime beside the other's (about 25 min):
    # bounded well below the pool's limit, so a wedged build cannot hold a
    # release for hours.
    timeout-minutes: 165
    outputs:
      present: ${{ steps.build.outputs.present }}
      linux_sha256: ${{ steps.build.outputs.linux_sha256 }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Verify sealed Rust toolchain and release targets
        run: scripts/ci/setup/assert-ci-runner-image.sh

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip" \
            6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7 /tmp/protoc.zip
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q /tmp/protoc.zip -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Build the Linux side
        id: build
        working-directory: .release-source
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/release/build-local-runtime.sh ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The kernel build's container reaches only this job's workspace.
          work="$GITHUB_WORKSPACE/.local-runtime"
          mkdir -m 0700 "$work" "$work/tmp"
          TMPDIR="$work/tmp" LOCAL_RUNTIME_JOB_CONTAINER="${HOSTNAME:?}" \
            scripts/ci/release/build-local-runtime.sh linux --source-sha "$SOURCE_SHA" \
            --version "$RELEASE_TAG" --output "$work/linux"
          tar -C "$work" -cf "$work/runtime-linux.tar" linux
          printf 'present=true\nlinux_sha256=%s\n' \
            "$(sha256sum "$work/runtime-linux.tar" | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the Linux side to the macOS build
        if: steps.build.outputs.present == 'true'
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-runtime-linux-${{ github.run_id }}
          path: .local-runtime/runtime-linux.tar
          # The upload action skips hidden paths unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-helper-darwin:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # The local runtime's Virtualization.framework helper (#1905). Every
    # release cw's runtime document pins its digest, so sign-helper signs it
    # with the Developer ID before build-darwin packs the runtime, and only
    # once per recipe: this job reports the recipe and, when the parts cache
    # has no signed helper for it, builds the helper unsigned. A source that
    # predates this signs its helper ad hoc in build-darwin. Compilation
    # only: no OIDC, signing, mirror or R2 capability exists in this job.
    name: Build the VZ helper for signing
    needs: [release-selection]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_MACOS || 'unset-CODEWIRE_CI_RUNNER_MACOS' }}
    timeout-minutes: 30
    outputs:
      present: ${{ steps.build.outputs.present }}
      recipe: ${{ steps.build.outputs.recipe }}
      unsigned_sha256: ${{ steps.build.outputs.unsigned_sha256 }}
      build_runner: ${{ steps.build.outputs.build_runner }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Build the helper unless its recipe is signed
        id: build
        working-directory: .release-source
        run: |
          set -euo pipefail
          # A source that predates the signed helper packs one signed ad hoc.
          if ! grep -q '"vz-runner-macos"' scripts/ci/release/local_runtime_parts.py; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          work="${RUNNER_TEMP:?}/codewire-vz-runner"
          scripts/ci/release/build-local-runtime.sh helper --output "$work"
          printf 'present=true\nrecipe=%s\nbuild_runner=%s\n' "$(cat "$work/recipe")" "${RUNNER_NAME:-$(hostname -s)}" \
            >> "$GITHUB_OUTPUT"
          if [ -f "$work/codewire-vz-runner" ]; then
            mkdir -m 0700 ../.vz-runner-unsigned
            cp "$work/codewire-vz-runner" ../.vz-runner-unsigned/codewire-vz-runner
            printf 'unsigned_sha256=%s\n' \
              "$(shasum -a 256 ../.vz-runner-unsigned/codewire-vz-runner | cut -c1-64)" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the unsigned helper to signing
        if: steps.build.outputs.unsigned_sha256 != ''
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-vz-runner-unsigned-${{ github.run_id }}
          path: .vz-runner-unsigned/codewire-vz-runner
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sign-helper:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # Developer ID signing and Apple notarization of the VZ helper (#1905),
    # only when build-helper-darwin built one; otherwise build-darwin takes
    # the helper signed for the same recipe from the parts cache. Only this
    # job and sign-darwin read the Apple keys; it compiles nothing and holds
    # no OpenPGP, mirror or R2 capability.
    name: Sign and notarize the VZ helper
    needs: [release-selection, build-helper-darwin]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 45
    outputs:
      signed_sha256: ${{ steps.sign.outputs.signed_sha256 }}
      notary_submission_id: ${{ steps.sign.outputs.notary_submission_id }}
      sign_runner: ${{ steps.sign.outputs.sign_runner }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source

      - name: Confirm selected release checkout
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Receive the unsigned helper
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-vz-runner-unsigned-${{ github.run_id }}
          path: vz-runner-unsigned

      - name: Verify the received helper is the built helper
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        env:
          UNSIGNED_SHA256: ${{ needs.build-helper-darwin.outputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          [[ "$UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum vz-runner-unsigned/codewire-vz-runner | cut -c1-64)" = "$UNSIGNED_SHA256" ]

      - name: Install rcodesign (pinned)
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        run: |
          set -euo pipefail
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          scripts/ci/release/fetch-pinned.sh \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz" \
            "$RCODESIGN_X86_64_LINUX_SHA256" rcodesign.tar.gz
          mkdir -m 0700 .rcodesign
          tar -xzf rcodesign.tar.gz -C .rcodesign --strip-components=1 "${archive}/rcodesign"
          .rcodesign/rcodesign --version

      - name: Sign and notarize the helper
        id: sign
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        run: |
          set -euo pipefail
          umask 077
          # The Developer ID and notary API keys exist only in OpenBao. They
          # are read here, used only by the signer, and shredded before anything else.
          macos_work="$(mktemp -d "${RUNNER_TEMP:?}/codewire-macos-keys.XXXXXX")"
          cleanup_macos_keys() {
            find "$macos_work" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$macos_work"
          }
          trap cleanup_macos_keys EXIT
          scripts/ci/setup/fetch-openbao-macos-signing.sh "$macos_work/keys"
          scripts/ci/release/sign-macos-helper.sh .rcodesign/rcodesign "$macos_work/keys" \
            vz-runner-unsigned/codewire-vz-runner \
            .release-source/crates/codewire-local-vmm/macos-vz-runner/developer-entitlements.plist vz-runner-signed
          cleanup_macos_keys
          trap - EXIT
          printf 'signed_sha256=%s\nsign_runner=%s\n' \
            "$(sha256sum vz-runner-signed/codewire-vz-runner | cut -c1-64)" "${RUNNER_NAME:-$(hostname -s)}" >> "$GITHUB_OUTPUT"
          if [ -f vz-runner-signed/notary-submission-id ]; then
            printf 'notary_submission_id=%s\n' "$(cat vz-runner-signed/notary-submission-id)" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the signed helper to the macOS build
        if: needs.build-helper-darwin.outputs.unsigned_sha256 != ''
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-vz-runner-signed-${{ github.run_id }}
          path: vz-runner-signed/codewire-vz-runner
          if-no-files-found: error
          retention-days: 1

  pack-runtime:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # The one local runtime document every release cw embeds, and the only
    # output the four cw builds wait for: the macOS target packed on the Mac
    # from the Linux side and the signed helper, merged with the Linux job's
    # linux-x86_64 fragment. Packed in its own short job, so the macOS pair
    # and both Linux cws then build at the same time. Compilation only: no
    # OIDC, signing, mirror or R2 capability exists in this job.
    name: Pack the local runtime
    needs: [release-selection, build-runtime-linux, build-helper-darwin, sign-helper]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_MACOS || 'unset-CODEWIRE_CI_RUNNER_MACOS' }}
    timeout-minutes: 45
    outputs:
      present: ${{ steps.runtime.outputs.present }}
      records_sha256: ${{ steps.runtime.outputs.records_sha256 }}
      # Every release cw embeds exactly this document; it binds every blob.
      document_sha256: ${{ steps.runtime.outputs.document_sha256 }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Receive the local runtime's Linux side
        if: needs.build-runtime-linux.outputs.present == 'true'
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-runtime-linux-${{ github.run_id }}
          path: .local-runtime-linux

      - name: Receive the signed VZ helper
        if: needs.sign-helper.outputs.signed_sha256 != ''
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-vz-runner-signed-${{ github.run_id }}
          path: .vz-runner-signed

      # Every release cw embeds the runtime this step packs: the macOS target
      # merged with the Linux job's linux-x86_64 fragment, with the helper
      # sign-helper signed in this run or one the parts cache holds for the
      # same recipe. The parts either side built (cache misses) and a helper
      # signed here go to the publishing job as cache records.
      - name: Build the local VM runtime
        id: runtime
        if: needs.build-runtime-linux.outputs.present == 'true'
        working-directory: .release-source
        env:
          LINUX_SHA256: ${{ needs.build-runtime-linux.outputs.linux_sha256 }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          HELPER_RECIPE: ${{ needs.build-helper-darwin.outputs.recipe }}
          HELPER_BUILD_RUNNER: ${{ needs.build-helper-darwin.outputs.build_runner }}
          SIGNED_HELPER_SHA256: ${{ needs.sign-helper.outputs.signed_sha256 }}
          HELPER_SIGN_RUNNER: ${{ needs.sign-helper.outputs.sign_runner }}
          HELPER_NOTARY_SUBMISSION_ID: ${{ needs.sign-helper.outputs.notary_submission_id }}
        run: |
          set -euo pipefail
          [[ "$LINUX_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(shasum -a 256 ../.local-runtime-linux/runtime-linux.tar | cut -c1-64)" = "$LINUX_SHA256" ]
          work="${RUNNER_TEMP:?}/codewire-local-runtime"
          mkdir -m 0700 "$work"
          tar -xf ../.local-runtime-linux/runtime-linux.tar -C "$work"
          helper=()
          if [ -n "$SIGNED_HELPER_SHA256" ]; then
            [[ "$SIGNED_HELPER_SHA256" =~ ^[0-9a-f]{64}$ ]] && [[ "$HELPER_RECIPE" =~ ^[0-9a-f]{64}$ ]]
            [ "$(shasum -a 256 ../.vz-runner-signed/codewire-vz-runner | cut -c1-64)" = "$SIGNED_HELPER_SHA256" ]
            mkdir -m 0700 "$work/vz-runner-signed"
            install -m 0755 ../.vz-runner-signed/codewire-vz-runner "$work/vz-runner-signed/codewire-vz-runner"
            printf '%s\n' "$HELPER_RECIPE" > "$work/vz-runner-signed/recipe"
            provenance=(--set "source_sha=$SOURCE_SHA" --set "version=$RELEASE_TAG" --set "run_id=$GITHUB_RUN_ID"
                        --set "build_runner=$HELPER_BUILD_RUNNER" --set "sign_runner=$HELPER_SIGN_RUNNER")
            [ -z "$HELPER_NOTARY_SUBMISSION_ID" ] ||
              provenance+=(--set "notary_submission_id=$HELPER_NOTARY_SUBMISSION_ID")
            python3 scripts/ci/release/local_runtime_parts.py provenance \
              --file "$work/vz-runner-signed/provenance.json" "${provenance[@]}"
            helper=(--helper "$work/vz-runner-signed")
          fi
          scripts/ci/release/build-local-runtime.sh macos --linux "$work/linux" \
            --source-sha "$SOURCE_SHA" ${helper[@]+"${helper[@]}"} --output "$work/macos"
          mkdir -m 0700 ../.local-runtime
          cp -R "$work/macos/runtime/." ../.local-runtime/
          printf 'present=true\n' >> "$GITHUB_OUTPUT"
          mkdir -m 0700 ../.runtime-records
          tar -C "$work/macos/built" -cf ../.runtime-records/runtime-records.tar .
          printf 'records_sha256=%s\n' \
            "$(shasum -a 256 ../.runtime-records/runtime-records.tar | cut -c1-64)" >> "$GITHUB_OUTPUT"
          printf 'document_sha256=%s\n' \
            "$(shasum -a 256 ../.local-runtime/local-runtime.json | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the local runtime to the cw builds
        if: steps.runtime.outputs.present == 'true'
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-runtime-${{ github.run_id }}
          path: .local-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Hand the runtime part records to publication
        if: steps.runtime.outputs.records_sha256 != ''
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-runtime-records-${{ github.run_id }}
          path: .runtime-records/runtime-records.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-darwin:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # The macOS cw links Apple frameworks (Security, SystemConfiguration), so
    # it is built natively on the protected mac-runner runner: one ephemeral
    # registration per job, as the unprivileged ci account (infra
    # macOS runner runbook). Both targets
    # build in one Cargo invocation, side by side, beside the two Linux cws.
    # Compilation only: no OIDC, signing, mirror or R2 capability exists in
    # this job.
    name: Build the macOS cw natively
    needs: [release-selection, pack-runtime]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_MACOS || 'unset-CODEWIRE_CI_RUNNER_MACOS' }}
    timeout-minutes: 60
    outputs:
      darwin_sums_sha256: ${{ steps.build.outputs.darwin_sums_sha256 }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Install protoc (pinned)
        run: |
          set -euo pipefail
          scripts/ci/release/fetch-pinned.sh "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-osx-aarch_64.zip" \
            193289af0470c6a1aada357d4fba0bbf8d78bfaac8b5e42ca30af2ef75583de2 "$HOME/protoc.zip"
          mkdir -p "$HOME/.proto-tools/protoc"
          unzip -o -q "$HOME/protoc.zip" -d "$HOME/.proto-tools/protoc"
          echo "$HOME/.proto-tools/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.proto-tools/protoc/bin/protoc" --version

      - name: Receive the local runtime
        if: needs.pack-runtime.outputs.present == 'true'
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-runtime-${{ github.run_id }}
          path: .local-runtime

      # Its document binds every blob; packaging checks them against it.
      - name: Verify the received runtime is the packed runtime
        if: needs.pack-runtime.outputs.present == 'true'
        env:
          DOCUMENT_SHA256: ${{ needs.pack-runtime.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DOCUMENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(shasum -a 256 .local-runtime/local-runtime.json | cut -c1-64)" = "$DOCUMENT_SHA256" ]
          echo "CW_RELEASE_LOCAL_RUNTIME_DIR=$PWD/.local-runtime" >> "$GITHUB_ENV"

      - name: Build the macOS pair
        id: build
        working-directory: .release-source
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CW_RELEASE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CW_RELEASE_TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          CW_RELEASE_TARGETS='aarch64-apple-darwin x86_64-apple-darwin' \
            ../scripts/ci/release/package-cw-release.sh "$RELEASE_TAG"
          (cd dist/cw-release && shasum -a 256 -c SHA256SUMS)
          printf 'darwin_sums_sha256=%s\n' \
            "$(shasum -a 256 dist/cw-release/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the macOS pair to packaging
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-darwin-${{ github.run_id }}
          path: .release-source/dist/cw-release/
          if-no-files-found: error
          retention-days: 1

  sign-darwin:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # Developer ID signing and Apple notarization of the macOS pair (#2064).
    # Each target's identity binds its final bytes, so the pair is signed
    # before the delivery is prepared. Only this job reads the Apple keys; it
    # compiles nothing and holds no OpenPGP, mirror or R2 capability.
    name: Sign and notarize the macOS cw pair
    needs: [release-selection, build-darwin]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    outputs:
      darwin_sums_sha256: ${{ steps.sign.outputs.darwin_sums_sha256 }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Receive the macOS pair
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-darwin-${{ github.run_id }}
          path: dist-darwin

      - name: Verify the received macOS pair is the built pair
        env:
          UNSIGNED_SUMS_SHA256: ${{ needs.build-darwin.outputs.darwin_sums_sha256 }}
        run: |
          set -euo pipefail
          [[ "$UNSIGNED_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum dist-darwin/SHA256SUMS | cut -c1-64)" = "$UNSIGNED_SUMS_SHA256" ]
          (cd dist-darwin && sha256sum --check SHA256SUMS)

      - name: Install rcodesign (pinned)
        run: |
          set -euo pipefail
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          scripts/ci/release/fetch-pinned.sh \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz" \
            "$RCODESIGN_X86_64_LINUX_SHA256" rcodesign.tar.gz
          mkdir -m 0700 .rcodesign
          tar -xzf rcodesign.tar.gz -C .rcodesign --strip-components=1 "${archive}/rcodesign"
          .rcodesign/rcodesign --version

      - name: Sign and notarize the macOS pair
        id: sign
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
        run: |
          set -euo pipefail
          umask 077
          # The Developer ID and notary API keys exist only in OpenBao. They
          # are read here, used only by the signer, and shredded before anything else.
          macos_work="$(mktemp -d "${RUNNER_TEMP:?}/codewire-macos-keys.XXXXXX")"
          cleanup_macos_keys() {
            find "$macos_work" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$macos_work"
          }
          trap cleanup_macos_keys EXIT
          scripts/ci/setup/fetch-openbao-macos-signing.sh "$macos_work/keys"
          scripts/ci/release/sign-macos-cw.sh .rcodesign/rcodesign "$macos_work/keys" \
            dist-darwin dist-darwin-signed "$RELEASE_TAG"
          cleanup_macos_keys
          trap - EXIT
          (cd dist-darwin-signed && sha256sum --check SHA256SUMS)
          printf 'darwin_sums_sha256=%s\n' \
            "$(sha256sum dist-darwin-signed/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Hand the signed macOS pair to packaging
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-darwin-signed-${{ github.run_id }}
          path: dist-darwin-signed/
          if-no-files-found: error
          retention-days: 1

  build-linux-musl:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # One Linux cw, built from the runtime document beside the macOS pair
    # and the other Linux cw, compiled on the trusted BuildKit builder
    # (#3119): this job submits the build, receives the executable and
    # verifies it. OIDC is on for one login, the builder's client
    # certificate. Forgejo's claims name the workflow, not the job, so
    # build-cw-linux.sh drops the ID-token request credentials as soon as
    # that login is done and before anything compiles, and its in-job
    # recovery compiles under an environment without the job's tokens.
    name: Build the Linux x86_64 cw
    needs: [release-selection, pack-runtime]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 60
    env:
      OPENBAO_ROLE: ${{ github.event_name == 'schedule' && 'codewire-source-cli-release-build-schedule' || 'codewire-source-cli-release-build' }}
      OPENBAO_AUDIENCE: ${{ github.event_name == 'schedule' && 'openbao-codewire-source-cli-release-build-schedule' || 'openbao-codewire-source-cli-release-build' }}
      # The owner's recovery (trusted-buildkit.sh): build in the job when the
      # repository variable CODEWIRE_IN_JOB_BUILD_SHA names this run's commit.
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    outputs:
      cw_sha256: ${{ steps.build.outputs.cw_sha256 }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Receive the local runtime
        if: needs.pack-runtime.outputs.present == 'true'
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-runtime-${{ github.run_id }}
          path: .local-runtime

      # Its document binds every blob; packaging checks them against it.
      - name: Verify the received runtime is the packed runtime
        if: needs.pack-runtime.outputs.present == 'true'
        env:
          DOCUMENT_SHA256: ${{ needs.pack-runtime.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DOCUMENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum .local-runtime/local-runtime.json | cut -c1-64)" = "$DOCUMENT_SHA256" ]
          echo "CW_RELEASE_LOCAL_RUNTIME_DIR=$PWD/.local-runtime" >> "$GITHUB_ENV"

      - name: Build the cw
        id: build
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          CW_RELEASE_SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          CW_RELEASE_TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/build-cw-linux.sh .release-source "$RELEASE_TAG" x86_64-unknown-linux-musl .cw-linux

      - name: Hand the cw to packaging
        uses: noel/actions-upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: cw-release-x86_64-unknown-linux-musl-${{ github.run_id }}
          path: .cw-linux/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-linux-gnu:
    # zizmor: ignore[excessive-permissions] Forgejo ignores permissions; this job's capabilities come from its runner label and whether it requests OIDC.
    # One Linux cw, built from the runtime document beside the macOS pair
    # and the other Linux cw, compiled on the trusted BuildKit builder
    # (#3119): this job submits the build, receives the executable and
    # verifies it. OIDC is on for one login, the builder's client
    # certificate. Forgejo's claims name the workflow, not the job, so
    # build-cw-linux.sh drops the ID-token request credentials as soon as
    # that login is done and before anything compiles, and its in-job
    # recovery compiles under an environment without the job's tokens.
    name: Build the Linux arm64 cw
    needs: [release-selection, pack-runtime]
    runs-on: ${{ vars.CODEWIRE_CI_RUNNER_TRUSTED_LIGHT || 'unset-CODEWIRE_CI_RUNNER_TRUSTED_LIGHT' }}
    enable-openid-connect: true
    timeout-minutes: 60
    env:
      OPENBAO_ROLE: ${{ github.event_name == 'schedule' && 'codewire-source-cli-release-build-schedule' || 'codewire-source-cli-release-build' }}
      OPENBAO_AUDIENCE: ${{ github.event_name == 'schedule' && 'openbao-codewire-source-cli-release-build-schedule' || 'openbao-codewire-source-cli-release-build' }}
      # The owner's recovery (trusted-buildkit.sh): build in the job when the
      # repository variable CODEWIRE_IN_JOB_BUILD_SHA names this run's commit.
      CODEWIRE_IN_JOB_BUILD: ${{ vars.CODEWIRE_IN_JOB_BUILD_SHA == github.sha && '1' || '0' }}
    outputs:
      cw_sha256: ${{ steps.build.outputs.cw_sha256 }}
    steps:
      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: noel/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.release-selection.outputs.release_tag }}
          path: .release-source
          fetch-depth: 0

      - name: Confirm selected release checkout
        env:
          RELEASE_TAG: ${{ needs.release-selection.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-selection.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.release-selection.outputs.tag_object_sha }}
        run: scripts/ci/release/confirm-release-checkout.sh .release-source

      - name: Receive the local runtime
        if: needs.pack-runtime.outputs.present == 'true'
        uses: noel/actions-download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59
        with:
          name: cw-release-runtime-${{ github.run_id }}
          path: .local-runtime

      # Its document binds every blob; packaging checks them against it.
      - name: Verify the received runtime is the packed runtime
        if: needs.pack-runtime.outputs.present == 'true'
        env:
          DOCUMENT_SHA256: ${{ needs.pack-runtime.outputs.document_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DOCUMENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum .local-runtime/local-runtime.json | cut -c1-64)" = "$DOCUMENT_SHA256" ]
