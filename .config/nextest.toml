# cargo-nextest configuration (infra#1632: compile once, run tests from an
# archive). It keeps `cargo test`'s semantics:
# - ignored tests stay ignored unless a run asks for them (`--run-ignored`),
#   which is how the #[ignore] convention keeps the database, service and
#   fixture tests out of a default run;
# - no retries, so a flaky test fails as it does under cargo test;
# - no timeout kills a test; a slow one is reported.
# Feature sets are chosen when the archive is built: CI tests the default
# features, and each explicit feature lane (for example the credential broker
# with --no-default-features --features platform) gets its own archive.
# `--all-features` turns on smoke-only features such as
# local-broker-synthetic-smoke, which change cw itself, so no archive uses it.

[profile.default]
retries = 0
slow-timeout = { period = "60s" }

# CI runs every test and reports each one, so one failure never hides the rest.
[profile.ci]
retries = 0
fail-fast = false
# One run of the whole archive mixes every binary's tests; cargo test runs one
# binary at a time. At the guest's 60 threads, I/O- and timing-bound tests
# (durable writes within a deadline, poll races) missed their marks on a busy
# metal guest (codewire runs 21672, 21687), so a CI run uses half of them.
test-threads = 32
slow-timeout = { period = "60s" }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Nextest starts higher-priority tests first, across every binary, and fills
# the remaining threads with the rest. The longest tests start first, so the
# run ends near the longest test's own time, not that time after everything
# else (main run 26920: the 32 s, 16 s and 15 s tests started 85-104 s in,
# and the run took 120 s for 43 s of work per thread; #3602).
#
# A real two-endpoint journey (two cw hosts, direct UDP and TLS DERP) runs for
# about a minute. Beside about 45 other tests in one nextest run it timed out
# (codewire runs 21593 and 21646, on a heavy guest that sized nothing from its
# CPU share), so it reserves 16 threads: it runs beside at most 16 others
# (main's 32 threads). Where a run has 16 threads or fewer, as on a pull
# request's medium guest, it runs alone.
[[profile.ci.overrides]]
filter = 'binary_id(codewire-cli-bin::host_member_control) & test(=host_members_two_real_endpoints_direct_and_tls_derp)'
priority = 100
threads-required = 16
# Its report names any wait for a member request to settle (#3774), so a slow
# run shows a number and not just a pass.
success-output = "final"

# Each took 15-32 s in main runs 26814 and 26920.
[[profile.ci.overrides]]
filter = """
(binary_id(codewire-local-credentials) & test(=rpc_tests::repository_preparation_outlasts_the_control_request_deadline))
| (binary_id(codewire-local-vmm) & test(=supervisor::snapshots::linux::tests::capture_removes_every_delivered_sign_in_from_the_copy_only))
| (binary_id(codewire-workspace-access) & test(=daemon_tailnet::tests::access_is_renewed_at_half_life_and_each_token_reproves_the_session))
| (binary_id(codewire-daemon::conformance) & test(=silent_attachment_emits_periodic_status_heartbeat))
"""
priority = 50
