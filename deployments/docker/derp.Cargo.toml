[workspace]
resolver = "2"
members = [
    "crates/codewire-derp",
    "crates/codewire-netstack",
    "crates/codewire-proto",
    "crates/codewire-tailnet",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "BSD-3-Clause"
authors = ["Sonica"]

[workspace.dependencies]
codewire-netstack = { path = "crates/codewire-netstack" }
codewire-proto = { path = "crates/codewire-proto", default-features = false }
codewire-tailnet = { path = "crates/codewire-tailnet" }

buffa = { version = "=0.8.1", features = ["json"] }
buffa-types = { version = "=0.8.1", features = ["json"] }
connectrpc = "=0.8.1"
connectrpc-build = "=0.8.0"
crc32fast = "1"
http = "1"
hyper-util = { version = "=0.1.20", features = ["server-auto", "server-graceful", "tokio"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
