[workspace]
resolver = "2"
members = [
    "crates/codewire-derp",
    "crates/codewire-netstack",
    "crates/codewire-proto",
    "crates/codewire-tailnet",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "BSD-3-Clause"
authors = ["Sonica"]

[workspace.dependencies]
codewire-netstack = { path = "crates/codewire-netstack" }
codewire-proto = { path = "crates/codewire-proto", default-features = false }
codewire-tailnet = { path = "crates/codewire-tailnet" }

buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
# Without the default zstd codec: we never negotiate it, and zstd 0.13
# carries RUSTSEC-2026-0391..0410 with no fix in connectrpc 0.9.1's range.
connectrpc = { version = "=0.9.1", default-features = false, features = ["gzip", "json"] }
connectrpc-build = "=0.9.0"
crc32fast = "1"
http = "1"
hyper-util = { version = "=0.1.20", features = ["server-auto", "server-graceful", "tokio"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The same table as the workspace Cargo.toml's [profile.runtime], which every
# image builds; scripts/ci/tests/test-runtime-profile.py keeps the two equal.
[profile.runtime]
inherits = "release"
lto = false
codegen-units = 16
strip = true
