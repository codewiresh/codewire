[workspace]
resolver = "2"
members = [
    "crates/codewire-client",
    "crates/codewire-gateway",
    "crates/codewire-gateway-proto",
    "crates/codewire-proto",
    "crates/codewire-tailnet",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Sonica"]

[workspace.dependencies]
codewire-client = { path = "crates/codewire-client" }
codewire-gateway-proto = { path = "crates/codewire-gateway-proto" }
codewire-proto = { path = "crates/codewire-proto", default-features = false }
codewire-tailnet = { path = "crates/codewire-tailnet" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
connectrpc = { git = "https://github.com/connectrpc/connect-rust.git", rev = "4da239d7a18b7dfeb40002b00f1f37e93891db17" }
connectrpc-build = "=0.8.0"
crc32fast = "1"
ed25519-dalek = "2"
filetime = "0.2"
http = "1"
http-body-util = "=0.1.3"
hyper-util = { version = "=0.1.20", features = ["server-auto", "server-graceful", "tokio"] }
portable-pty = "0.9"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }
russh = "0.61"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
buffa = { version = "=0.8.1", features = ["json"] }
buffa-types = { version = "=0.8.1", features = ["json"] }
shell-words = "1"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519"] }
subtle = "=2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wiremock = "=0.6.5"

tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
