[workspace]
resolver = "2"
members = [
    "crates/codewire-access",
    "crates/codewire-client",
    "crates/codewire-credential-bridge",
    "crates/codewire-credential-broker",
    "crates/codewire-daemon",
    "crates/codewire-gateway",
    "crates/codewire-gateway-proto",
    "crates/codewire-local-credentials",
    "crates/codewire-netstack",
    "crates/codewire-platform-credentials",
    "crates/codewire-project",
    "crates/codewire-protected-store",
    "crates/codewire-proto",
    "crates/codewire-server-core",
    "crates/codewire-tailnet",
    "crates/codewire-tls",
    "crates/codewire-workload-secrets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "AGPL-3.0-only"
authors = ["Sonica"]

[workspace.dependencies]
codewire-access = { path = "crates/codewire-access" }
codewire-client = { path = "crates/codewire-client" }
codewire-credential-bridge = { path = "crates/codewire-credential-bridge" }
codewire-daemon = { path = "crates/codewire-daemon" }
codewire-gateway-proto = { path = "crates/codewire-gateway-proto" }
codewire-local-credentials = { path = "crates/codewire-local-credentials" }
codewire-netstack = { path = "crates/codewire-netstack" }
codewire-platform-credentials = { path = "crates/codewire-platform-credentials" }
codewire-project = { path = "crates/codewire-project" }
codewire-protected-store = { path = "crates/codewire-protected-store" }
codewire-proto = { path = "crates/codewire-proto", default-features = false }
codewire-server-core = { path = "crates/codewire-server-core" }
codewire-tailnet = { path = "crates/codewire-tailnet" }
codewire-tls = { path = "crates/codewire-tls" }
codewire-workload-secrets = { path = "crates/codewire-workload-secrets" }

aes-gcm = "=0.10.3"
anyhow = "1"
async-io = "2"
async-nats = "0.47"
async-trait = "0.1"
av-credential-proxy = { git = "https://github.com/noeljackson/av.git", rev = "32ef60cbbe58dfb00a3ffda76f7b2e3b8900baaa", default-features = false }
axum = { version = "0.8", features = ["macros", "json"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
connectrpc = "=0.9.1"
connectrpc-build = "=0.9.0"
crc32fast = "1"
ed25519-dalek = "2"
futures = "0.3"
futures-lite = "2"
filetime = "0.2"
http = "1"
http-body-util = "=0.1.3"
hmac = "0.12"
hyper = "1"
hyper-util = { version = "=0.1.20", features = ["server-auto", "server-graceful", "tokio"] }
jsonschema = { version = "0.46.6", default-features = false }
keyring = "3"
k8s-openapi = { version = "0.27", features = ["latest"] }
kube = { version = "3", default-features = false, features = ["client", "rustls-tls", "ws"] }
open = "5"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
portable-pty = "0.9"
prometheus = "0.14"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
russh = "0.63.2"
russh-sftp = "2"
rustix = { version = "=1.1.4", features = ["fs", "process", "thread"] }
schemars = { version = "1", features = ["derive"] }
secret-service = "5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
shell-words = "1"
sha2 = "0.10"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519"] }
subtle = "=2.6.1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "json", "uuid", "chrono"] }
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "catch-panic"] }
tracing = "0.1"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wiremock = "=0.6.5"
zeroize = { version = "1", features = ["serde"] }

tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
