# Values for the local Kind cluster (`make kind-*`): the chart's equivalent of
# deployments/k8s/overlays/local-kind, checked against it by
# scripts/ci/tests/test-deploy-helm-chart.py. Render it in the namespace
# `default`. Nothing in it is a real credential.

# The keys deployments/k8s/overlays/local-kind/configmap-patch.yaml sets over
# the defaults.
config:
  PORT: "8080"
  DATABASE_URL: "postgres://codewire:codewire@postgres:5432/codewire?sslmode=disable"
  LIFECYCLE_ORCHESTRATOR: "temporal-primary"
  ENVIRONMENT_ORCHESTRATOR: "temporal-primary"
  TEMPORAL_HOST_PORT: "temporal-frontend.temporal-system.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "codewire-lifecycle"
  TEMPORAL_UI_URL: "http://temporal-web.temporal-system.svc.cluster.local:8080"
  DERP_HOST: "127.0.0.1"
  DERP_PORT: "8443"
  STUN_HOST: ""
  STUN_PORT: "3478"
  ENVIRONMENT: "local"
  CODEWIRE_SES_FROM: ""
  CODEWIRE_SES_REGION: ""
  FRONTEND_URL: "http://127.0.0.1:8080"
  PUBLIC_OIDC_ISSUER_URL: "http://127.0.0.1:8080"
  SANDBOX_RUNTIME_PROFILE: "none"
  SANDBOX_ALLOW_DIAGNOSTIC_RUNTIME: "true"
  SANDBOX_DOCKER_MODE: "local-dind-direct"
  SANDBOX_NETWORK_POLICY_MANAGEMENT: "Unmanaged"
  # Kind's built-in local-path StorageClass. The setting has no default
  # (docs/CONFIGURATION.md).
  SANDBOX_WORKSPACE_STORAGE_CLASS: "standard"
  # No shared warm pool here (Program #2238 C4): pool templates admit no
  # ingress before adoption, so they need Managed network policy, and this
  # overlay's daemon image is a local tag without a registry digest. The
  # retained harness cluster (tests/e2e/kind, make kind-up) runs pools.
  SANDBOX_WARM_POOL_SHAPES: ""
  CODEWIRE_API_URL: "http://codewire-orchestration.default.svc.cluster.local:8084"
  CODEWIRE_COORDINATOR_URL: "http://codewire-coordinator.default.svc.cluster.local:8090"
  NAMESPACE_PREFIX: "local-tenant"
  CODEWIRE_KIND_TENANT_SECRET_TEST_PROVIDER: "true"
  # Organization network policies (#4000): Kind tests the store and `cw --cloud policy`.
  # Nothing enforces them until cw-egress does; Production keeps the switch off.
  CODEWIRE_PLATFORM_NETWORK_POLICIES_ENABLED: "true"
  # Local clusters pull the workspace image from its public mirror
  # (docs/CONFIGURATION.md).
  CODEWIRE_WORKSPACE_IMAGE_REPOSITORY: "ghcr.io/codewiresh/workspace"
  SANDBOX_NAMESPACE: "dev-sandboxes"
  BILLING_CONTROLLER_ENABLED: "true"
  BILLING_CONTROLLER_NAMESPACE: "dev-sandboxes"
  BILLING_CONTROLLER_REQUEUE_SECONDS: "60"
  BILLING_SESSION_LEDGER_CANONICAL: "true"
  SANDBOX_IMAGE_PULL_SECRET: ""
  SANDBOX_DAEMON_IMAGE: "git.example.com/codewire/daemon:local"
  SANDBOX_DIND_ENABLED: "true"
  PREVIEW_BASE_DOMAIN: "codewire-dev.local"
  SKIP_2FA_SETUP: "true"
  DERP_MESH_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"

# Kind's services read the synthetic local Secret, pull no image, and admit
# Kind's edge, ingress-nginx.
publicOrigin: http://127.0.0.1:8080
sandboxNamespace: dev-sandboxes
sharedSecret: codewire-local-secrets

edge:
  peers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx

# deployments/k8s/overlays/local-kind/coordinator-deployment-patch.yaml
coordinator:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  env:
    - name: COORDINATOR_PORT
      value: "8090"
    - name: COORDINATOR_DERP_VERIFY_ADDR
      value: "0.0.0.0:8097"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
  initContainers: &waitForPostgres
    - name: wait-for-postgres
      image: postgres:17-alpine
      command:
        - sh
        - -c
        - until pg_isready -h postgres -p 5432 -U codewire -d codewire; do sleep 1; done
      env:
        - name: PGPASSWORD
          value: codewire
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
  startupProbe: &startupProbe
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90

# deployments/k8s/overlays/local-kind/idp-deployment-patch.yaml
idp:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  imagePullPolicy: IfNotPresent
  env:
    - name: IDP_PORT
      value: "8091"
    - name: IDP_SIGNING_KEK_DIR
      value: /var/run/secrets/codewire/idp-signing-keks
    - name: IDP_SIGNING_ACTIVE_KEK_ID
      value: v1
    - name: IDP_TURNSTILE_BYPASS_EMAIL
      value: codewire-e2e@example.test
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  initContainers: *waitForPostgres
  startupProbe: *startupProbe

# deployments/k8s/overlays/local-kind/billing-deployment-patch.yaml
billing:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  imagePullPolicy: IfNotPresent
  env:
    - name: BILLING_PORT
      value: "8081"
    - name: STRIPE_SECRET_KEY
      value: sk_test_buildtest_dummy
    - name: STRIPE_WEBHOOK_SECRET
      value: whsec_test_secret
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    # Mount the Connect conformance probe (connect-rpc/03 D8)
    # — local-kind/e2e manifests only, never base or production.
    - name: CONNECT_TESTING_SURFACE
      value: "1"

# deployments/k8s/overlays/local-kind/credential-service-origin-patch.yaml:
# one node, so a single broker keeps local logs and debugging simple.
credentialService:
  replicas: 1
  # Kind's overlay leaves the source's pull secret here, unlike the other
  # services'; nothing is pulled on Kind, so it is never used. Removed at
  # Kind's cut-over to the chart (#5169).
  imagePullSecrets:
    - name: harbor-registry

# deployments/k8s/overlays/local-kind/orchestration-deployment-patch.yaml and
# the overlay's patches of orchestration's objects.
orchestration:
  strategy:
    type: Recreate
    rollingUpdate: null
  imagePullPolicy: IfNotPresent
  extraEnvFrom:
    - secretRef:
        name: codewire-local-anthropic
        optional: true
  env:
    - name: ORCHESTRATION_PORT
      value: "8084"
    # TLS-only internal listener; scripts/dev/kind/local-internal-tls.sh
    # provisions the mounted leaf and its roots on this cluster.
    - name: ORCHESTRATION_INTERNAL_TLS_PORT
      value: "8088"
    - name: ORCHESTRATION_INTERNAL_TLS_CERT_FILE
      value: /run/codewire-orchestration-internal-tls/tls.crt
    - name: ORCHESTRATION_INTERNAL_TLS_KEY_FILE
      value: /run/codewire-orchestration-internal-tls/tls.key
    - name: ORCHESTRATION_WORKSPACE_BINDING_PORT
      value: "8087"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: POD_SERVICE_ACCOUNT_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: TEMPORAL_HOST_PORT
      value: temporal-frontend.temporal-system.svc.cluster.local:7233
    # The image cache admission policy reads the same ConfigMap.
    - name: CODEWIRE_APPROVED_IMAGE_REGISTRIES
      valueFrom:
        configMapKeyRef:
          name: codewire-image-registries
          key: CODEWIRE_APPROVED_IMAGE_REGISTRIES
    # The warm-pool template admission policy reads the same ConfigMap.
    - name: CODEWIRE_HOSTED_EGRESS_ENABLED
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_ENABLED
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: ""
    # Mount the Connect conformance probe (connect-rpc/03 D8)
    # — local-kind/e2e manifests only, never base or production.
    - name: CONNECT_TESTING_SURFACE
      value: "1"
  initContainers: *waitForPostgres
  # Warm-pool members on Kind run a diagnostic runtime: runc, or the node
  # default ('') when SANDBOX_RUNTIME_PROFILE is none.
  warmPoolRuntimeClasses: [commodity, commodity-32g, runc, ""]
  # The public workspace mirror and Docker Official Images.
  approvedImageRegistries: ghcr.io/codewiresh/,docker.io/library/
  # No cert-manager here: scripts/dev/kind/local-internal-tls.sh creates the
  # orchestration internal leaf Secret and roots instead. Nor is there a UDP
  # relay, so orchestration needs no allocator client certificate; its mounts
  # are optional.
  internalCertificate: false
  udpRelayAllocatorClientCertificate: false

# deployments/k8s/overlays/local-kind/derp-deployment-patch.yaml and
# derp-service-patch.yaml: one relay, reached on fixed node ports.
derp:
  replicas: 1
  imagePullPolicy: IfNotPresent
  tlsHosts: 127.0.0.1,localhost
  # Kind's patch sets imagePullSecrets: [], but in a strategic-merge patch an
  # empty list removes nothing, so the source's pull secret stays; nothing is
  # pulled on Kind. Removed at Kind's cut-over to the chart (#5169).
  imagePullSecrets:
    - name: harbor-registry
  service:
    type: NodePort
    nodePorts:
      http: 30444
      https: 30443
      stun: 30445

# No UDP relay on Kind.
udpRelay:
  enabled: false

# deployments/k8s/overlays/local-kind: only its own hostless routes
# (ingress.yaml). The source tree renders no public route (#6250).
ingress:
  routes:
    dashboard: false
    derp: false
    preview: false
    coordinatorConnect: false
    meshCoordinatorGrpc: false
    environmentSessionGrpc: false
    idp: false
    billing: false
    connect: false
  local:
    enabled: true
    previewHost: "*.codewire-dev.local"
    tlsSecret: codewire-kind-ingress-tls

# deployments/k8s/agent-sandbox/overlays/local-kind: Kind's own controller build.
agentSandbox:
  image: agent-sandbox-controller:local

# No VM runtimes on Kind: its Sandboxes run under runc or the node default.
runtimeProfiles:
  enabled: false

dashboardPublicConfig:
  # The non-promotable Kind credential fixture provides this fixed synthetic
  # App itself.
  GITHUB_APP_SLUG: codewire-synthetic
  GITHUB_APP_CLIENT_ID: Iv1.kindsynthetic

images:
  dashboard:
    repository: codewire-dashboard
    tag: local
  services:
    repository: codewire-services
    tag: local
  derp:
    repository: codewire-derp
    tag: local

# Kind's dashboard is a smaller, older shape than production's: its own
# labels, numbered probe ports, no resources, preStop delay or pull secret, a
# Service named `dashboard` on 5173, and no NetworkPolicy. Each null removes a
# default it does not have.
dashboard:
  replicas: 1
  selectorLabels:
    app.kubernetes.io/component: null
    app.kubernetes.io/name: null
    app: codewire-dashboard
  labels: null
  origins:
    browserApi: http://127.0.0.1:8080
  portName: null
  livenessProbe:
    httpGet:
      port: 5173
    initialDelaySeconds: null
    periodSeconds: null
  readinessProbe:
    httpGet:
      port: 5173
    initialDelaySeconds: null
    periodSeconds: null
  lifecycle: null
  resources: null
  terminationGracePeriodSeconds: null
  service:
    name: dashboard
    type: null
    port: 5173
    portName: null
  networkPolicy:
    enabled: false
