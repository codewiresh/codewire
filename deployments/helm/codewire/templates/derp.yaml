{{- with .Values.derp }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-derp
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
spec:
  replicas: {{ .replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: derp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: derp
    spec:
      imagePullSecrets: {{ toYaml (.imagePullSecrets | default $.Values.imagePullSecrets) | nindent 8 }}
      # Its own identity, so the coordinator's 8097 lookup admits DERP by
      # service account rather than by a label (#5962). It reads no API.
      serviceAccountName: codewire-derp
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # A mounted TLS Secret is readable by the image's 65532 group only.
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: derp
          image: {{ include "codewire.image" (dict "family" "derp" "images" $.Values.images) }}
          {{- with .imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
            - containerPort: 3478
              protocol: UDP
              name: stun
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Serve only node keys the platform coordinator or Mesh has
            # registered for a live session (#2844). A key either knows is
            # admitted; Mesh may be absent (local Kind).
            - name: DERP_VERIFY_CLIENT_URLS
              value: http://codewire-coordinator.$(POD_NAMESPACE).svc.cluster.local:8097,http://codewire-mesh-http.$(POD_NAMESPACE).svc.cluster.local:8097
            - name: DERP_MESH_HOSTNAME
              value: codewire-derp-mesh.{{ $.Release.Namespace }}.svc.cluster.local
            - name: TLS_PORT
              value: "8443"
            - name: TLS_HOSTS
              value: {{ .tlsHosts | quote }}
            - name: DERP_MESH_KEY
              valueFrom:
                secretKeyRef:
                  name: codewire-secrets
                  key: DERP_MESH_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            # The relay writes nothing: its settings come from the
            # environment and its self-signed certificate is made in memory.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /derp/latency-check
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: codewire-derp
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
spec:
  type: {{ .service.type }}
  selector:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      {{- with index .service.nodePorts "http" }}
      nodePort: {{ . }}
      {{- end }}
    - port: 8443
      targetPort: 8443
      name: https
      {{- with index .service.nodePorts "https" }}
      nodePort: {{ . }}
      {{- end }}
    - port: 3478
      targetPort: 3478
      protocol: UDP
      name: stun
      {{- with index .service.nodePorts "stun" }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: codewire-derp-mesh
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: codewire-derp
  namespace: {{ $.Release.Namespace }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: derp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-derp
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
automountServiceAccountToken: false
{{- end }}
{{- end }}
