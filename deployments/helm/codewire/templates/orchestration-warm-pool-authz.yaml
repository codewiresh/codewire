  labels:
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: codewire-orchestration-warm-pool-template
  validationActions: [Deny]
  # The hosted-egress switch, from the namespace orchestration runs in.
  # Kustomize writes that namespace (kustomizeconfig.yaml); a missing
  # ConfigMap denies every pool template.
  paramRef:
    name: codewire-hosted-egress
    namespace: {{ $.Release.Namespace }}
    parameterNotFoundAction: Deny
  # No mutable namespace selector: orchestration can update namespace labels.
  # The identity match bounds the policy; it follows the writer everywhere.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codewire-orchestration-warm-pool-member
  labels:
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
spec:
  failurePolicy: Fail
  # The hosted-egress switch (codewire-hosted-egress, hosted-egress.yaml), as
  # the template policy reads it.
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  matchConditions:
    - name: orchestration-service-account
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:codewire-orchestration$')
  # The reconciler deletes stale members by UID and resourceVersion; DELETE is
  # not matched. Bootstrap and resize patch only Sandboxes a claim adopted,
  # which carry neither the pool label nor a pool owner.
  variables:
    - name: hostedEgress
      expression: >-
        has(params.data) && 'CODEWIRE_HOSTED_EGRESS_ENABLED' in params.data &&
        params.data['CODEWIRE_HOSTED_EGRESS_ENABLED'] == 'true'
    - name: broker
      expression: >-
        has(object.spec.podTemplate) && has(object.spec.podTemplate.metadata) &&
        has(object.spec.podTemplate.metadata.labels) &&
        'codewire.sh/egress' in object.spec.podTemplate.metadata.labels &&
        object.spec.podTemplate.metadata.labels['codewire.sh/egress'] == 'broker'
    - name: wasBroker
      expression: >-
        has(oldObject.spec.podTemplate) && has(oldObject.spec.podTemplate.metadata) &&
        has(oldObject.spec.podTemplate.metadata.labels) &&
        'codewire.sh/egress' in oldObject.spec.podTemplate.metadata.labels &&
        oldObject.spec.podTemplate.metadata.labels['codewire.sh/egress'] == 'broker'
    # The runtime classes that are not a VM: runc, and none at all ('' as a
    # class name). Any other class counts as a VM, one this policy does not
    # know included, so the rule fails closed (egress/pre_switch.rs decides
    # the same way).
    - name: directRuntimeClasses
      expression: "['runc', '']"
  validations:
    - expression: >-
        !(has(object.metadata.labels) && 'agents.x-k8s.io/warm-pool-sandbox' in object.metadata.labels) &&
        !(has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o, o.kind == 'SandboxWarmPool'))
      message: orchestration never creates or changes an unclaimed warm-pool member; only the controller writes it
    - expression: >-
        request.operation != 'UPDATE' ||
        (!(has(oldObject.metadata.labels) && 'agents.x-k8s.io/warm-pool-sandbox' in oldObject.metadata.labels) &&
        !(has(oldObject.metadata.ownerReferences) &&
        oldObject.metadata.ownerReferences.exists(o, o.kind == 'SandboxWarmPool')))
      message: orchestration never strips an unclaimed warm-pool member's pool label or owner
    # codewire#5002: a Sandbox whose pod template is broker-mode stays so. A
    # Pod without the label escapes the fence, cw-egress and the self-check,
    # so no update by orchestration may take it off. A Sandbox made before
    # hosted egress, without it, is held by the next rule.
    - expression: >-
        request.operation != 'UPDATE' ||
        !(has(oldObject.spec.podTemplate) && has(oldObject.spec.podTemplate.metadata) &&
        has(oldObject.spec.podTemplate.metadata.labels) &&
        'codewire.sh/egress' in oldObject.spec.podTemplate.metadata.labels &&
        oldObject.spec.podTemplate.metadata.labels['codewire.sh/egress'] == 'broker') ||
        has(object.spec.podTemplate) && has(object.spec.podTemplate.metadata) &&
        has(object.spec.podTemplate.metadata.labels) &&
        'codewire.sh/egress' in object.spec.podTemplate.metadata.labels &&
        object.spec.podTemplate.metadata.labels['codewire.sh/egress'] == 'broker'
      message: orchestration never takes broker mode (codewire.sh/egress=broker) off a Sandbox's pod template
    # codewire#4000: nor puts it on. The label alone, without the TUN init and
    # the rest of the broker shape, would pass a direct template off as
    # broker-mode, and the next rule would then start it. With the switch on,
    # no update adds it, a stop included; only create renders it.
    - expression: >-
        request.operation != 'UPDATE' || !variables.hostedEgress || !variables.broker || variables.wasBroker
      message: orchestration never adds broker mode to an existing Sandbox; only create renders it
    # codewire#4000 (private-docs designs/hosted-egress.md, "A Sandbox made
    # before the switch"): a start builds the Pod from the Sandbox's own pod
    # template, so a VM Sandbox made while the switch was off would come back
    # with direct egress. With the switch on, orchestration may only stop it
    # (Suspended), so the environment can still be stopped and removed; it is
    # recreated, never started. Either side of the update under a VM class
    # counts, so a runtime class change cannot slip past; a Pod with no
    # runtime class is not a VM. Off, nothing changes.
    - expression: >-
        request.operation != 'UPDATE' || !variables.hostedEgress || variables.broker ||
        has(object.spec.operatingMode) && object.spec.operatingMode == 'Suspended' ||
        ![object, oldObject].exists(s, has(s.spec.podTemplate) && has(s.spec.podTemplate.spec) &&
        has(s.spec.podTemplate.spec.runtimeClassName) &&
        !(s.spec.podTemplate.spec.runtimeClassName in variables.directRuntimeClasses))
      message: with hosted egress on, orchestration never starts or changes a Sandbox made before it; the environment must be recreated
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codewire-orchestration-warm-pool-member
  labels:
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
spec:
  policyName: codewire-orchestration-warm-pool-member
  validationActions: [Deny]
  # The hosted-egress switch, from the namespace orchestration runs in.
  # Kustomize writes that namespace (kustomizeconfig.yaml); a missing
  # ConfigMap denies every orchestration Sandbox write.
  paramRef:
    name: codewire-hosted-egress
    namespace: {{ $.Release.Namespace }}
    parameterNotFoundAction: Deny
  # No mutable namespace selector: orchestration can update namespace labels.
  # The identity match bounds the policy; it follows the writer everywhere.
{{- end }}
