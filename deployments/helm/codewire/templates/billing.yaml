{{- with .Values.billing }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-billing
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codewire.labels" "billing" | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  strategy:
    {{- toYaml .strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "codewire.selectorLabels" "billing" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codewire.selectorLabels" "billing" | nindent 8 }}
      annotations:
        # Increment with a successful dedicated SES key rotation. Environment
        # variables are fixed at container start, so this rolls the workload
        # onto the verified next credential generation.
        codewire.sh/ses-credential-generation: "1"
    spec:
      {{- include "codewire.servicePod" (dict "root" $ "service" .) | nindent 6 }}
      containers:
        - name: billing
          # Runs from the shared codewire/services image (one image, many
          # entrypoints); the codewire-billing binary is selected by `command`.
          command: ["/codewire-billing"]
          {{- include "codewire.serviceContainer" (dict "root" $ "service" .) | nindent 10 }}
          ports:
            - containerPort: 8081
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: codewire-billing
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codewire.labels" "billing" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "codewire.selectorLabels" "billing" | nindent 4 }}
  ports:
    - port: 8081
      targetPort: 8081
      name: http
{{- end }}
{{- end }}
