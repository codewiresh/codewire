{{- /* The VM runtime profiles' RuntimeClasses (runtimeProfiles), each with its own switch. */}}
{{- with .Values.runtimeProfiles }}
{{- if .enabled }}
{{- if .commodity }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: commodity
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-handler: kata-clh
    codewire.sh/runtime-tier: commodity
handler: kata-clh
# Kata's sizing guide (docs/how-to/how-to-size-sandbox-overhead-runtime-rs.md):
# podFixed must cover guest- and host-side overhead, and operators measure it.
# A guest with full RAM leaves the Pod cgroup only this margin for the VMM,
# virtiofsd and the host page cache of their writes; past it the host kills the
# VM. The margin needed grows with the VM, so each memory tier is its own class
# (`commodity_runtime_class`); this one takes workspaces up to 16 GiB. Measured
# on Dev with guest RAM forced full and two buffered writers, MGLRU on (#3718):
# at 1 GiB, 4+2 and 8+4 GiB (workspace + DinD) survived 0 of 3 and 16+4 GiB 2 of
# 6; at 1.5 GiB each survived 3 of 3. The worst writeback seen was 1.31 GiB
# (1.5 GiB in one earlier 16+4 round at a smaller margin).
overhead:
  podFixed:
    cpu: 250m
    memory: 1536Mi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
{{- end }}
---
{{- if .commodity32g }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: commodity-32g
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-handler: kata-clh
    codewire.sh/runtime-tier: commodity
handler: kata-clh
# The commodity class for workspaces over 16 GiB (`commodity_runtime_class`);
# it differs from `commodity` only in overhead, which runtime-class-commodity.yaml
# explains. Measured on Dev at 32+4 GiB (workspace + DinD), guest RAM forced full
# and two buffered writers, MGLRU on (#3718): 1 GiB survived 0 of 3, 2 GiB 1 of 3
# and 3 GiB 2 of 3, with dirty and writeback up to 5.9 GiB; 4 GiB 3 of 3, but
# with dirty and writeback peaking at 4.24-4.33 GiB, at or past the margin. 5 GiB
# leaves headroom over that peak. Block workspaces with host direct I/O replace
# this margin.
overhead:
  podFixed:
    cpu: 250m
    memory: 5Gi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
{{- end }}
---
{{- if .confidential }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: confidential
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-handler: kata-qemu-snp
    codewire.sh/runtime-tier: confidential
handler: kata-qemu-snp
# Kata runtime-rs sizes the guest as workload memory plus 2048 MiB of guest
# overhead. Preserve upstream qemu-snp's 1920 MiB host-side margin (its 2048
# MiB RuntimeClass budget minus the upstream 128 MiB guest overhead), because
# QEMU runs inside the pod cgroup: 2048 + (2048 - 128) = 3968 MiB.
#
# Measured on 2026-11-11 (#3723): a 16 GB environment holding guest RAM full
# while writing 45 GiB to /workspace peaked at 851-853 MiB of host memory
# beyond the guest, in 3 of 3 runs, so the 1920 MiB margin holds. It holds
# because QEMU opens every writable disk with O_DIRECT (read from its fdinfo),
# so disk writes leave no host page cache in the pod cgroup. The Kata
# configuration says block_device_cache_direct = false, so nothing here
# guarantees that; the ConfidentialSandboxHostPageCache alert (infra#2436)
# fires if a build goes back to buffered I/O.
overhead:
  podFixed:
    cpu: "1"
    memory: 3968Mi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
    node.codewire.sh/confidential-snp: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
{{- end }}
---
{{- if .standard }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: standard
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-handler: runc
    codewire.sh/runtime-tier: standard
handler: runc
# Codewire's own VM runtime inside the Pod (#5602): the node's ordinary handler
# starts one non-root container, and the VM that container boots is the
# boundary. The VM process runs inside the container, so its memory and CPU sit
# beside the guest's in the container's limits, never its requests, and
# podFixed reserves the same room for the scheduler. These values are an
# estimate, to be measured on Dev before an organization moves to `standard`.
overhead:
  podFixed:
    cpu: "1"
    memory: 1Gi
# No node selector: only a node whose device plugin advertises codewire.sh/kvm
# can take the Pod, and the plugin's DaemonSet chooses those nodes.
scheduling:
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
{{- end }}
{{- end }}
{{- end }}
