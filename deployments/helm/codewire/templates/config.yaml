apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codewire.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.sharedLabels | nindent 4 }}
data:
  {{- toYaml .Values.config | nindent 2 }}
---
# Separate from codewire-config, which many services import with envFrom. The
# only public consumer is the dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codewire.dashboardPublicConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.sharedLabels | nindent 4 }}
data:
  {{- toYaml .Values.dashboardPublicConfig | nindent 2 }}
