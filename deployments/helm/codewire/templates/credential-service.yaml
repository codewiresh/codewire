{{- with .Values.credentialService }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-credential-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codewire.labels" "credential-service" | nindent 4 }}
spec:
  # Two replicas so a restart, rollout or node loss never takes every
  # Sandbox's proxied provider calls down at once. Each bridge epoch is pinned
  # to one replica; authority, material and refresh are serialized in
  # PostgreSQL, so replicas share no in-memory state.
  replicas: {{ .replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: credential-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: credential-service
    spec:
      imagePullSecrets: {{ toYaml (.imagePullSecrets | default $.Values.imagePullSecrets) | nindent 8 }}
      serviceAccountName: codewire-credential-service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: codewire
              app.kubernetes.io/component: credential-service
      # Required in-cluster Kubernetes identity, confined by the separate SA's
      # TokenReview/own-TokenRequest/exact sandbox metadata permissions.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credential-service
          image: {{ include "codewire.image" (dict "family" "services" "images" $.Values.images) }}
          command: ["/codewire-credential-service"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8086
            - name: broker-tls
              containerPort: 9443
          # No shared app Secret/config envFrom, signing secret, DB owner,
          # saved login, or generic OpenBao token enters this process. The
          # one optional GitHub App authorization Secret is dedicated to this
          # service; it is never a mirror credential, PAT, or deploy key.
          env:
            - name: CREDENTIAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codewire-credential-database
                  key: url
            - name: CREDENTIAL_HTTP_LISTEN_ADDR
              value: "0.0.0.0:8086"
            - name: CREDENTIAL_PUBLIC_ORIGIN
              value: {{ required "publicOrigin is required" $.Values.publicOrigin | quote }}
            - name: CREDENTIAL_BROKER_TLS_LISTEN_ADDR
              value: "0.0.0.0:9443"
            - name: CREDENTIAL_BROKER_TLS_CERT_FILE
              value: /run/codewire-credential-tls/tls.crt
            - name: CREDENTIAL_BROKER_TLS_KEY_FILE
              value: /run/codewire-credential-tls/tls.key
            - name: CREDENTIAL_GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: codewire-github-app-authorization
                  key: client-id
                  optional: true
            - name: CREDENTIAL_GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codewire-github-app-authorization
                  key: client-secret
                  optional: true
            - name: CREDENTIAL_GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  name: codewire-github-app-authorization
                  key: slug
                  optional: true
            - name: CREDENTIAL_RUNTIME_DIR
              value: /run/codewire-credentials
            - name: CREDENTIAL_BAO_ADDR
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_ADDR
            - name: CREDENTIAL_BAO_AUTH_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_AUTH_MOUNT
            - name: CREDENTIAL_BAO_ROLE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_ROLE
            - name: CREDENTIAL_BAO_TRANSIT_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_TRANSIT_MOUNT
            - name: CREDENTIAL_APPLICATION_BAO_ROLE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_APPLICATION_BAO_ROLE
            - name: CREDENTIAL_APPLICATION_BAO_TRANSIT_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_APPLICATION_BAO_TRANSIT_MOUNT
            - name: CREDENTIAL_BAO_EXPECTED_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_EXPECTED_CLUSTER_ID
            - name: CREDENTIAL_BAO_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_AUDIENCE
            - name: OPENBAO_KUBERNETES_API_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: OPENBAO_KUBERNETES_API_AUDIENCE
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Initialization validates DB, OpenBao, provider DNS and current TLS
          # before either listener opens. Do not let ordinary liveness race it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: enrollment-runtime
              mountPath: /run/codewire-credentials
            - name: broker-tls
              mountPath: /run/codewire-credential-tls
              readOnly: true
            - name: database-roots
              mountPath: /run/codewire-credential-db-roots
              readOnly: true
      volumes:
        - name: enrollment-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: broker-tls
          secret:
            secretName: codewire-credential-broker-tls
            defaultMode: 0440
        # Public root input for verify-full PostgreSQL URLs, not a credential.
        - name: database-roots
          configMap:
            name: codewire-credential-database-roots
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-credential-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codewire.labels" "credential-service" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codewire-credential-service-tokenreview
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codewire-credential-service-tokenreview
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codewire-credential-service-tokenreview
subjects:
  - kind: ServiceAccount
    name: codewire-credential-service
    namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-credential-service-tokenrequest
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["codewire-credential-service"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-credential-service-tokenrequest
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-credential-service-tokenrequest
subjects:
  - kind: ServiceAccount
    name: codewire-credential-service
    namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-credential-service-runtime
  namespace: {{ required "sandboxNamespace is required" $.Values.sandboxNamespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-credential-service-runtime
  namespace: {{ required "sandboxNamespace is required" $.Values.sandboxNamespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-credential-service-runtime
subjects:
  - kind: ServiceAccount
    name: codewire-credential-service
    namespace: {{ $.Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: codewire-credential-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codewire.labels" "credential-service" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: credential-service
  ports:
    - name: http
      port: 8086
      targetPort: http
    - name: broker-tls
      port: 9443
      targetPort: broker-tls
---
# The namespace-local Issuer and its dedicated CA are provisioned by the
# infrastructure owner. Never use the gateway or Trustee CA for this purpose.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-credential-broker
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
spec:
  secretName: codewire-credential-broker-tls
  issuerRef:
    name: codewire-credential-broker
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - codewire-credential-service.{{ $.Release.Namespace }}.svc.cluster.local
  duration: 24h
  renewBefore: 8h
  isCA: false
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
---
# The public Connect mutation API is reachable through the normal ingress edge
# and directly from the same-namespace dashboard BFF.
# Private broker TLS is reachable only from same-namespace orchestration, the
# credential relay (design §4), never from a sandbox. Application
# authentication independently checks the relay identity and the exact
# workspace Pod lineage. This policy makes no claim to restrict provider egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codewire-credential-service
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: credential-service
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "codewire.edgePeers" $ | nindent 8 }}
        {{- include "codewire.podPeer" (dict "labels" $.Values.dashboard.selectorLabels "from" "dashboard.selectorLabels") | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8086
    - from:
        {{- include "codewire.podPeer" (dict "labels" (include "codewire.selectorLabels" "orchestration" | fromYaml) "from" "orchestration's selector labels") | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9443
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: codewire-credential-service
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/part-of: codewire
spec:
  # Keep one broker serving through voluntary disruptions such as node drains.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: credential-service
{{- end }}
{{- end }}
