{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- merge (deepCopy .Values.namespace.labels) .Values.sharedLabels | toYaml | nindent 4 }}
  # Flux must never prune this Namespace, even when a source change stops
  # declaring it (infra#1671), and a Helm uninstall or upgrade must never
  # delete it either: the clusters' deletion guard refuses that (#3542).
  # Removing it means deleting it on purpose.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
{{- end }}
