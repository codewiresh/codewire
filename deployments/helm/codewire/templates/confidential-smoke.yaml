{{- /*
The confidential runtime smoke (confidentialSmoke): its control ConfigMap,
whose phase the smoke's tooling reads, and in the confidential-snp phase the
three smoke Jobs, which need AMD SEV-SNP runtime nodes. Off by default.
*/}}
{{- with .Values.confidentialSmoke }}
{{- if .enabled }}
{{- if not (has .phase (list "inactive" "confidential-snp")) }}
{{- fail (printf "confidentialSmoke.phase is %q: it is inactive or confidential-snp" .phase) }}
{{- end }}
{{- /* The measured confidential policy (cc_init_data) is built for one probe image. */}}
{{- if and (eq .phase "confidential-snp") (not $.Values.images.confidentialProbe.digest) }}
{{- fail "images.confidentialProbe.digest is required in the confidential-snp phase" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: codewire-confidential-snp-smoke-control
  namespace: {{ $.Values.confidentialSmoke.namespace }}
  labels:
    app.kubernetes.io/name: codewire-confidential-snp-smoke-control
    app.kubernetes.io/part-of: codewire
data:
  phase: {{ .phase | quote }}
{{- if eq .phase "confidential-snp" }}
---
# Rendered only in the confidential-snp phase (confidentialSmoke.phase). Its `linstor-local`
# volume matches the commodity class that the confidential activation profile
# keeps for commodity workspaces (codewire#2321).
apiVersion: batch/v1
kind: Job
metadata:
  name: codewire-commodity-runtime-smoke-v76
  namespace: {{ $.Values.confidentialSmoke.namespace }}
  labels:
    app.kubernetes.io/name: codewire-commodity-runtime-smoke
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: commodity
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire-commodity-runtime-smoke
        app.kubernetes.io/part-of: codewire
        codewire.sh/runtime-tier: commodity
    spec:
      automountServiceAccountToken: false
      runtimeClassName: commodity
      # The Dev release names the probe node (#1383).
      nodeSelector:
        kubernetes.io/hostname: example-node-1
      restartPolicy: Never
      # The workspace volume's fresh filesystem root is the probe user's to
      # write; without it the write is refused (#3718).
      securityContext:
        fsGroup: 65532
      volumes:
        - name: workspace
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: linstor-local
                resources:
                  requests:
                    storage: 1Gi
      containers:
        - name: smoke
          image: registry.k8s.io/e2e-test-images/busybox@sha256:caec39cad3b12c26600baf6e67ba811ac15d28a9288d0ccdfffb4b318992c3bb
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "runtimeClass=commodity"
              uname -a
              test -r /proc/cpuinfo
              marker="linstor-local-workspace-ok"
              printf '%s\n' "$marker" > /workspace/marker
              test "$(cat /workspace/marker)" = "$marker"
              printf '%s\n' "$marker"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
---
apiVersion: batch/v1
kind: Job
metadata:
  name: codewire-confidential-runtime-smoke-v76
  namespace: {{ $.Values.confidentialSmoke.namespace }}
  labels:
    app.kubernetes.io/name: codewire-confidential-runtime-smoke
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: confidential
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire-confidential-runtime-smoke
        app.kubernetes.io/part-of: codewire
        codewire.sh/runtime-tier: confidential
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      automountServiceAccountToken: false
      runtimeClassName: confidential
      nodeSelector:
        node.codewire.sh/confidential-snp: "true"
      restartPolicy: Never
      # genpolicy models containerd's guest-pull supplementary groups. Keep
      # the declared Pod identity identical to the measured Agent request.
      securityContext:
        supplementalGroups:
          - 0
      containers:
        - name: smoke
          image: {{ include "codewire.image" (dict "family" "confidentialProbe" "images" $.Values.images) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -lc
            - |
              echo "runtimeClass=confidential"
              uname -a
              test -r /proc/cpuinfo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: codewire-confidential-snp-attestation-v76
  namespace: {{ $.Values.confidentialSmoke.namespace }}
  labels:
    app.kubernetes.io/name: codewire-confidential-snp-attestation
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: confidential
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire-confidential-snp-attestation
        app.kubernetes.io/part-of: codewire
        codewire.sh/runtime-tier: confidential
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      automountServiceAccountToken: false
      runtimeClassName: confidential
      nodeSelector:
        node.codewire.sh/confidential-snp: "true"
      restartPolicy: Never
      # The probe deliberately runs privileged to create /dev/sev-guest.
      # Declare the image-derived wheel group so guest-pull and genpolicy use
      # the same process identity.
      securityContext:
        supplementalGroups:
          - 10
      containers:
        - name: attest
          image: {{ include "codewire.image" (dict "family" "confidentialProbe" "images" $.Values.images) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            # This disposable one-container confidential VM needs containerd's
            # privileged device rule to open the guest-created /dev/sev-guest.
            # The measured Agent policy still pins Talos's exact grantable
            # capability set instead of accepting arbitrary capabilities.
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "runtimeClass=confidential"
              uname -a
              if [ ! -e /dev/sev-guest ]; then
                sev_guest_minor="$(awk '$2 == "sev-guest" { print $1 }' /proc/misc)"
                test -n "$sev_guest_minor"
                mknod /dev/sev-guest c 10 "$sev_guest_minor"
                chmod 0600 /dev/sev-guest
              fi
              test -e /dev/sev-guest
              ls -l /dev/sev-guest
              /usr/local/bin/snpguest report /tmp/attestation-report.bin /tmp/report-data.bin --random
              test -s /tmp/attestation-report.bin
              test -s /tmp/report-data.bin
              wc -c /tmp/attestation-report.bin /tmp/report-data.bin
              sha256sum /tmp/attestation-report.bin /tmp/report-data.bin
              /usr/local/bin/snpguest display report /tmp/attestation-report.bin
              printf 'attestation_report_base64_begin\n'
              base64 /tmp/attestation-report.bin
              printf '\nattestation_report_base64_end\n'
              printf 'report_data_base64_begin\n'
              base64 /tmp/report-data.bin
              printf '\nreport_data_base64_end\n'
              echo "snp-attestation-report-ok"
{{- end }}
{{- end }}
{{- end }}
