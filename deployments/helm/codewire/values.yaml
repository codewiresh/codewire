# The Codewire chart's defaults (#2908). They are production's shape with no
# site host, image or secret in them: an environment's values file sets those,
# and says where it differs, with null for a key it does not have.
#
# The chart is being built one component at a time while the Kustomize trees
# under deployments/k8s still deploy everything; each component it renders is
# checked against them by scripts/ci/tests/test-deploy-helm-chart.py.

# The release namespace as an object, as the Kustomize trees declare it.
namespace:
  create: true
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/managed-by: kustomize

# Labels on the shared configuration and the namespace.
sharedLabels:
  app.kubernetes.io/name: codewire
  app.kubernetes.io/part-of: codewire

# codewire-config, which the services read with envFrom. Every value is a
# string. Its name ends in a hash of its data, as Kustomize's generator names
# it, so a change rolls every service that reads it.
config:
  PORT: "8080"
  DERP_HOST: ""
  STUN_HOST: ""
  STUN_PORT: "3478"
  PREVIEW_BASE_DOMAIN: ""
  LIFECYCLE_ORCHESTRATOR: "temporal-primary"
  ENVIRONMENT_ORCHESTRATOR: "temporal-primary"
  TEMPORAL_HOST_PORT: "temporal-frontend.temporal-system.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "codewire-lifecycle"
  TEMPORAL_UI_URL: ""
  ENVIRONMENT: "production"
  # SES sender selection is public configuration. The matching AWS sender
  # credential projection supplies CODEWIRE_SES_ENABLED separately to only the
  # IDP and billing workloads; without that marker, email delivery is disabled.
  # The From line people see: Codewire's name on the verified address (#4553).
  CODEWIRE_SES_FROM: ""
  CODEWIRE_SES_REGION: "eu-west-1"
  TERRAFORM_DIR: "/terraform"
  NAMESPACE_PREFIX: "prod-tenant"
  BAO_ADDR: ""
  OPENBAO_KUBERNETES_API_AUDIENCE: ""
  TENANT_SECRET_BAO_AUTH_MOUNT: "kubernetes-codewire"
  TENANT_SECRET_BAO_ROLE: ""
  TENANT_SECRET_BAO_AUDIENCE: ""
  TENANT_SECRET_BAO_TRANSIT_MOUNT: "transit"
  TENANT_SECRET_BAO_TRANSIT_KEY: "tenant-dek"
  TENANT_SECRET_BAO_EXPECTED_CLUSTER_ID: ""
  SANDBOX_RUNTIME_PROFILE: "commodity"
  CODEWIRE_UDP_RELAY_ADVERTISE_ADDRS: ""
  CODEWIRE_UDP_RELAY_ALLOCATOR_URL: ""
  CODEWIRE_UDP_RELAY_BIND_ADDRS: ""
  CODEWIRE_RUNTIME_TRANSPORT_ZONES_JSON: ""
  CODEWIRE_DIRECT_UDP_LB_ENABLED: "false"
  CODEWIRE_DIRECT_UDP_LB_IP: ""
  CODEWIRE_DIRECT_UDP_LB_PORT_START: "32000"
  CODEWIRE_DIRECT_UDP_LB_PORT_END: "60999"
  CODEWIRE_DIRECT_UDP_LB_CLASS: "io.cilium/l2-announcer"
  CODEWIRE_DIRECT_UDP_LB_SHARING_KEY: "codewire-direct-udp"
  CODEWIRE_DIRECT_UDP_TRANSPORT_ZONE: ""
  SANDBOX_DOCKER_MODE: "profile-default"
  # Shared warm pools (Program #2238 C4): comma-separated exact shapes,
  # <cpu>m/<memory>Mi/<disk>Gi=<members>. Empty keeps the reconciler and create
  # routing inert; each overlay that runs pools sets its own shapes.
  SANDBOX_WARM_POOL_SHAPES: ""
  # StorageClass for commodity workspace volumes. Required, with no default:
  # orchestration refuses to start while it is empty, unless the runtime profile
  # is confidential (docs/CONFIGURATION.md). Each overlay sets its own.
  SANDBOX_WORKSPACE_STORAGE_CLASS: ""
  # VolumeSnapshotClass of hosted disk snapshots. Empty refuses them; each overlay
  # that offers them sets its own.
  SANDBOX_VOLUME_SNAPSHOT_CLASS: ""
  SANDBOX_KATA_AGENT_POLICY_ENABLED: "false"
  SANDBOX_KATA_COCO_INIT_DATA_ENABLED: "false"
  SANDBOX_KATA_COCO_KBS_URL: ""
  SANDBOX_KATA_COCO_KBS_PEER: ""
  SANDBOX_KATA_COCO_IMAGE_REGISTRY_AUTH_URI: ""
  SANDBOX_KATA_COCO_TEST_RESOURCE_URI: ""
  SANDBOX_KATA_COCO_TEST_RESOURCE_PATH: ""
  # Each overlay names the repository its workspace image is pulled from;
  # orchestration refuses to start without one (docs/CONFIGURATION.md).
  CODEWIRE_WORKSPACE_IMAGE_REPOSITORY: ""
  BILLING_CONTROLLER_ENABLED: "true"
  BILLING_CONTROLLER_NAMESPACE: ""
  BILLING_CONTROLLER_REQUEUE_SECONDS: "60"
  BILLING_SESSION_LEDGER_CANONICAL: "true"
  SANDBOX_CONFIDENTIAL_STORAGE_ENABLED: "false"
  # Organization network policies (#4000). Off until cw-egress enforces them
  # (docs/CONFIGURATION.md).
  CODEWIRE_PLATFORM_NETWORK_POLICIES_ENABLED: "false"
  # Hosted interception (#4001): off until observed working on Dev; needs hosted
  # egress, whose switch is in the codewire-hosted-egress ConfigMap.
  CODEWIRE_HOSTED_INTERCEPTION_ENABLED: "false"
  CONFIDENTIAL_STORAGE_BAO_ADDR: ""
  CONFIDENTIAL_STORAGE_BAO_AUTH_MOUNT: "kubernetes-codewire"
  CONFIDENTIAL_STORAGE_BAO_ROLE: ""
  CONFIDENTIAL_STORAGE_BAO_AUDIENCE: ""
  CONFIDENTIAL_STORAGE_BAO_KV_MOUNT: ""
  CONFIDENTIAL_STORAGE_BAO_EXPECTED_CLUSTER_ID: ""
  CONFIDENTIAL_STORAGE_KBS_URL: ""
  CONFIDENTIAL_STORAGE_KBS_CA_PATH: ""
  CONFIDENTIAL_STORAGE_KBS_ADMIN_TOKEN_FILE: "/var/run/secrets/codewire-confidential-storage/kbs-admin-token"

# codewire-dashboard-public-config: the public identifiers only the dashboard
# reads. It is named by a hash of its data, as codewire-config is.
dashboardPublicConfig:
  TURNSTILE_SITE_KEY: ""
  # Public App identifiers only; the client secret remains solely in
  # credential-service's dedicated authorization Secret.
  GITHUB_APP_SLUG: ""
  GITHUB_APP_CLIENT_ID: ""

# The site's public origin, which browsers load and the dashboard and the
# credential service name. Required.
publicOrigin: ""

# The namespace Sandboxes run in, where the services hold the Roles that let
# them read their Sandboxes. Required.
sandboxNamespace: ""

# The shared Secret every service reads with envFrom, beside codewire-config.
sharedSecret: codewire-secrets

# Pull secrets for the services' Pods.
imagePullSecrets: []

# The cluster's public edge: the peers the dashboard's and the IdP's network
# policies admit. Each names the edge by a non-empty selector or an ipBlock.
edge:
  peers: []

# The coordinator: tailnet coordination and DERP's client admission lookup.
coordinator:
  enabled: true
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Empty leaves the cluster's default.
  imagePullPolicy: ""
  # The container's own environment, beside codewire-config and the shared
  # Secret; an environment that differs replaces the whole list.
  env:
    - name: COORDINATOR_PORT
      value: "8090"
    - name: COORDINATOR_DERP_VERIFY_ADDR
      value: "0.0.0.0:8097"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: codewire-db-app
          key: password
    - name: NATS_TOKEN
      valueFrom:
        secretKeyRef:
          name: nats-auth-token
          key: token
    # The coordinator's own NATS user, once infra issues it (#3542). It
    # wins over the shared token above; until the Secret exists the
    # token is used.
    - name: NATS_USER
      valueFrom:
        secretKeyRef:
          name: nats-coordinator-login
          key: user
          optional: true
    - name: NATS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nats-coordinator-login
          key: password
          optional: true
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  initContainers: []
  startupProbe: null

# The identity provider.
idp:
  enabled: true
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Empty leaves the cluster's default.
  imagePullPolicy: ""
  # The container's own environment, beside codewire-config and the shared
  # Secret; an environment that differs replaces the whole list.
  env:
    # These explicit values override any broad envFrom input. The SES
    # client rejects configured endpoint overrides and cannot use IMDS.
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
    - name: AWS_IGNORE_CONFIGURED_ENDPOINT_URLS
      value: "true"
    # The IdP receives only its own SES key pair plus the activation
    # marker. These fields are optional: without the marker, email
    # delivery is disabled; with it, the client requires the complete
    # SES projection.
    - name: CODEWIRE_SES_ENABLED
      valueFrom:
        secretKeyRef:
          name: codewire-idp-ses
          key: CODEWIRE_SES_ENABLED
          optional: true
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: codewire-idp-ses
          key: AWS_ACCESS_KEY_ID
          optional: true
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: codewire-idp-ses
          key: AWS_SECRET_ACCESS_KEY
          optional: true
    # Sign in with GitHub or Google (#4062). Every key is optional:
    # with none the providers are off, and half a provider's pair
    # stops the IdP at start. Infra projects the Secret from OpenBao.
    - name: CODEWIRE_OAUTH_GITHUB_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: codewire-idp-oauth
          key: CODEWIRE_OAUTH_GITHUB_CLIENT_ID
          optional: true
    - name: CODEWIRE_OAUTH_GITHUB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: codewire-idp-oauth
          key: CODEWIRE_OAUTH_GITHUB_CLIENT_SECRET
          optional: true
    - name: CODEWIRE_OAUTH_GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: codewire-idp-oauth
          key: CODEWIRE_OAUTH_GOOGLE_CLIENT_ID
          optional: true
    - name: CODEWIRE_OAUTH_GOOGLE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: codewire-idp-oauth
          key: CODEWIRE_OAUTH_GOOGLE_CLIENT_SECRET
          optional: true
    - name: IDP_PORT
      value: "8091"
    - name: IDP_SIGNING_KEK_DIR
      value: /var/run/secrets/codewire/idp-signing-keks
    - name: IDP_SIGNING_ACTIVE_KEK_ID
      value: v1
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: codewire-db-app
          key: password
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  initContainers: []
  startupProbe: null

# Billing.
billing:
  enabled: true
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Empty leaves the cluster's default.
  imagePullPolicy: ""
  # The container's own environment, beside codewire-config and the shared
  # Secret; an environment that differs replaces the whole list.
  env:
    # These explicit values override any broad envFrom input. The SES
    # client rejects configured endpoint overrides and cannot use IMDS.
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
    - name: AWS_IGNORE_CONFIGURED_ENDPOINT_URLS
      value: "true"
    # Billing receives only its own SES key pair plus the activation
    # marker. These fields are optional: without the marker, email
    # delivery is disabled; with it, the client requires the complete
    # SES projection.
    - name: CODEWIRE_SES_ENABLED
      valueFrom:
        secretKeyRef:
          name: codewire-billing-ses
          key: CODEWIRE_SES_ENABLED
          optional: true
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: codewire-billing-ses
          key: AWS_ACCESS_KEY_ID
          optional: true
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: codewire-billing-ses
          key: AWS_SECRET_ACCESS_KEY
          optional: true
    - name: BILLING_PORT
      value: "8081"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: codewire-db-app
          key: password
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  initContainers: []
  startupProbe: null

# The credential service and broker. It reads neither codewire-config nor the
# shared Secret: everything it is given is its own.
credentialService:
  enabled: true
  replicas: 2
  # Kind only, until #5169: its own pull secrets, where Kind's differ from
  # imagePullSecrets'. Null uses those.
  imagePullSecrets: null

# Orchestration: the API, the Temporal worker and the Sandbox reconcilers.
orchestration:
  enabled: true
  # Single replica: the Temporal worker scales horizontally and the loops
  # elect their own leader, so one is sufficient and keeps reasoning simple.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  imagePullPolicy: ""
  # Sources read with envFrom after codewire-config and the shared Secret.
  extraEnvFrom:
    # Infra owns these non-secret IDs, URLs, and runtime settings.
    # They remain optional so standard deployments do not depend on
    # the disabled confidential-storage stack. The public KBS CA has
    # a separate trust-manager-owned ConfigMap mounted below.
    - configMapRef:
        name: codewire-confidential-storage-openbao
        optional: true
    - configMapRef:
        name: codewire-confidential-storage-kbs
        optional: true
  env:
    - name: ORCHESTRATION_PORT
      value: "8084"
    - name: ORCHESTRATION_INTERNAL_TLS_PORT
      value: "8088"
    - name: ORCHESTRATION_INTERNAL_TLS_CERT_FILE
      value: /run/codewire-orchestration-internal-tls/tls.crt
    - name: ORCHESTRATION_INTERNAL_TLS_KEY_FILE
      value: /run/codewire-orchestration-internal-tls/tls.key
    - name: ORCHESTRATION_WORKSPACE_BINDING_PORT
      value: "8087"
    # Client certificate and relay roots for the UDP relay allocator,
    # which allocates only over mutual TLS (#4011). Read again for
    # every allocation.
    - name: CODEWIRE_UDP_RELAY_ALLOCATOR_ROOTS_FILE
      value: /run/codewire-udp-relay-allocator-roots/ca.crt
    - name: CODEWIRE_UDP_RELAY_ALLOCATOR_CLIENT_CERT_FILE
      value: /run/codewire-udp-relay-allocator-client-tls/tls.crt
    - name: CODEWIRE_UDP_RELAY_ALLOCATOR_CLIENT_KEY_FILE
      value: /run/codewire-udp-relay-allocator-client-tls/tls.key
    # Public trust only. The separate infrastructure owner provisions
    # the broker bundle before rollout.
    - name: SANDBOX_CREDENTIAL_BROKER_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: POD_SERVICE_ACCOUNT_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: codewire-db-app
          key: password
    # Temporal plane: point at the temporal frontend service.
    # Required (the service errors at startup without it).
    - name: TEMPORAL_HOST_PORT
      value: "temporal-frontend.temporal-system.svc.cluster.local:7233"
    # The image cache admission policy reads the same ConfigMap.
    - name: CODEWIRE_APPROVED_IMAGE_REGISTRIES
      valueFrom:
        configMapKeyRef:
          name: codewire-image-registries
          key: CODEWIRE_APPROVED_IMAGE_REGISTRIES
    # cw-egress (#4000): off until hosted egress is observed working
    # on Dev. The warm-pool template admission policy reads the same
    # ConfigMap, so a template's arm follows this switch.
    - name: CODEWIRE_HOSTED_EGRESS_ENABLED
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_ENABLED
    # What a broker-mode render reads while the switch is on (#4000);
    # optional, so a ConfigMap without them starts with it off.
    - name: CODEWIRE_HOSTED_EGRESS_GATEWAY_NAMESPACE
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_GATEWAY_NAMESPACE
          optional: true
    - name: CODEWIRE_HOSTED_EGRESS_GATEWAY_NAME
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_GATEWAY_NAME
          optional: true
    - name: CODEWIRE_HOSTED_EGRESS_GATEWAY_OWNER_NAMESPACE
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_GATEWAY_OWNER_NAMESPACE
          optional: true
    - name: CODEWIRE_HOSTED_EGRESS_GATEWAY_PORT
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_GATEWAY_PORT
          optional: true
    - name: CODEWIRE_HOSTED_EGRESS_GATEWAY_SERVICE
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_GATEWAY_SERVICE
          optional: true
    - name: CODEWIRE_HOSTED_EGRESS_GATEWAY_CLUSTER_IP
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_GATEWAY_CLUSTER_IP
          optional: true
    - name: CODEWIRE_HOSTED_EGRESS_FENCE_REVISION
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_HOSTED_EGRESS_FENCE_REVISION
          optional: true
    - name: CODEWIRE_CLUSTER_DNS_IP
      valueFrom:
        configMapKeyRef:
          name: codewire-hosted-egress
          key: CODEWIRE_CLUSTER_DNS_IP
          optional: true
    # What a `standard` workspace runs (#5602); optional, so a ConfigMap
    # without them starts with no standard workspace.
    - name: SANDBOX_STANDARD_RUNTIME_IMAGE
      valueFrom:
        configMapKeyRef:
          name: codewire-standard-runtime
          key: SANDBOX_STANDARD_RUNTIME_IMAGE
          optional: true
    - name: SANDBOX_STANDARD_IMAGE_DISK
      valueFrom:
        configMapKeyRef:
          name: codewire-standard-runtime
          key: SANDBOX_STANDARD_IMAGE_DISK
          optional: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  initContainers: []
  startupProbe: null
  # The RuntimeClasses warm-pool members may run under (the warm-pool template
  # admission policy's runtimeClasses).
  warmPoolRuntimeClasses: [commodity, commodity-32g]
  # The registries the image cache may hold images from, comma-separated
  # (docs/CONFIGURATION.md). Empty admits none.
  approvedImageRegistries: ""
  # The cert-manager Certificates for the internal TLS listener and the UDP
  # relay allocator's client. An environment without cert-manager provides
  # those Secrets itself.
  internalCertificate: true
  udpRelayAllocatorClientCertificate: true

# The hosted-egress switch (#4000) and what the warm-pool template admission
# policy needs for its broker arm: codewire-hosted-egress. Off, so only today's
# templates are admitted. Turning it on also sets the daemon image's
# repository (no tag, no digest) and the public gateway's proxies; an empty or
# malformed value admits no broker template. docs/CONFIGURATION.md documents
# each key. Every value is a string.
hostedEgress:
  CODEWIRE_HOSTED_EGRESS_ENABLED: "false"
  CODEWIRE_HOSTED_EGRESS_DAEMON_REPOSITORY: ""
  CODEWIRE_HOSTED_EGRESS_GATEWAY_NAMESPACE: ""
  CODEWIRE_HOSTED_EGRESS_GATEWAY_NAME: ""
  CODEWIRE_HOSTED_EGRESS_GATEWAY_OWNER_NAMESPACE: ""
  CODEWIRE_HOSTED_EGRESS_GATEWAY_PORT: ""
  CODEWIRE_HOSTED_EGRESS_GATEWAY_SERVICE: ""
  CODEWIRE_HOSTED_EGRESS_GATEWAY_CLUSTER_IP: ""
  CODEWIRE_HOSTED_EGRESS_FENCE_REVISION: ""
  CODEWIRE_CLUSTER_DNS_IP: ""

# What a `standard` workspace runs (#5602): codewire-standard-runtime. Both
# empty, so no `standard` workspace renders; a deployment that turns the
# profile on sets both. docs/CONFIGURATION.md documents each key. Every value
# is a string.
standardRuntime:
  SANDBOX_STANDARD_RUNTIME_IMAGE: ""
  SANDBOX_STANDARD_IMAGE_DISK: ""

# DERP, the relay sandbox and client tailnets fall back to.
derp:
  enabled: true
  replicas: 3
  imagePullPolicy: ""
  # Kind only, until #5169: its own pull secrets, where Kind's differ from
  # imagePullSecrets'. Null uses those.
  imagePullSecrets: null
  # The names DERP's certificate covers.
  tlsHosts: codewire-derp.prod.svc.cluster.local,codewire-derp.dev.svc.cluster.local,codewire-derp.default.svc.cluster.local,127.0.0.1,localhost
  service:
    type: ClusterIP
    # Node ports by port name (http, https, stun), for a NodePort Service.
    nodePorts: {}

# The UDP relay, which allocates direct UDP paths only over mutual TLS (#4011).
udpRelay:
  enabled: true

# Mesh, rendered by the Mesh chart's own templates (#2908). Off: Dev and
# Production deploy apps/cli/charts/codewire-mesh as its own release until the
# cut-over (slice 7).
mesh:
  enabled: false
  # The release name Mesh's objects carry in their names and selectors.
  release: codewire-mesh
  # The Mesh chart's values, exactly as apps/cli/charts/codewire-mesh/values.yaml
  # defines them.
  values:
    mesh:
      baseURL: ""  # Required: e.g. https://mesh.example.com
      derpURL: ""  # Set when the packet relay is separate from the Mesh API.
      listenAddr: "0.0.0.0:8080"
      # Cluster-internal lookup a Codewire DERP relay uses to serve only keys of
      # live Mesh sessions (DERP_VERIFY_CLIENT_URLS). Never route it through an
      # ingress. 0 turns it off.
      derpVerifyPort: 8097

    database:
      enabled: false
      secretName: "codewire-mesh-db-app"
      uriKey: "uri"

    # Hosted Mesh requires this cluster-local primary-control-plane authorization
    # hop whenever it owns a database. Standalone `cw mesh up` supplies its own
    # explicit local identity and does not use these chart values.
    meshAuthorization:
      url: ""
      # https only (orchestration's internal listener is TLS-only), verified with
      # the public roots in this ConfigMap (key ca.crt); required with url.
      tlsRootsConfigMap: ""
      hmacSecretRef:
        name: ""
        key: "SESSION_SECRET"
        optional: false

    image:
      repository: ghcr.io/codewiresh/codewire
      tag: ""  # Defaults to appVersion
      digest: ""  # If set, renders repository@digest and takes precedence over tag
      pullPolicy: IfNotPresent

    imagePullSecrets: []

    # More than 1 needs nats.url: replicas then share their live registry
    # through NATS, so any of them serves any session (codewire#3542). Mesh keeps
    # no files: durable state is in the database, so it has no volume and can run
    # on any node.
    replicaCount: 1

    # The NATS server replicas share their live registry through (codewire#3542).
    # Empty runs one replica on its own in-memory registry.
    nats:
      url: ""
      # Replicas of the shared bucket: 1, 3 or 5, at most the NATS cluster size.
      kvReplicas: 1
      # A Secret with keys user and password: Mesh's own NATS user, in its own
      # NATS account. Required with url.
      loginSecret: ""

    # STUN nodes Mesh advertises beside its DERP relay, as host or host:port
    # (CODEWIRE_MESH_STUN_SERVERS).
    stunServers: []

    # The size of the retired data volume's claim, kept unmounted where an older
    # release created one (templates/retained-data-pvc.yaml). Empty renders none.
    retainedDataClaim:
      size: ""

    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: mesh.example.com
          paths:
            - path: /
              pathType: Prefix
      tls: []

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    serviceAccount:
      create: true
      annotations: {}
      name: ""

    podAnnotations: {}
    podLabels: {}

    nodeSelector: {}
    tolerations: []
    affinity: {}

    monitoring:
      enabled: false

# The public edge's Ingresses, each with its own switch (ingress.routes).
ingress:
  # The site's host and its TLS Secret, for every route but DERP's and the
  # previews'. Required while one of those routes is on.
  host: ""
  tlsSecret: ""
  # DERP's host and TLS Secret, served by its own ingress class.
  derp:
    host: ""
    tlsSecret: ""
  # The preview wildcard host, such as "*.example.dev", and its TLS Secret.
  preview:
    host: ""
    tlsSecret: ""
  routes:
    dashboard: true
    derp: true
    preview: true
    coordinatorConnect: true
    meshCoordinatorGrpc: true
    environmentSessionGrpc: true
    idp: true
    billing: true
    connect: true
  # A single-node cluster's hostless edge on 127.0.0.1, as local Kind uses:
  # its preview wildcard host, and the host and TLS Secret of its gRPC routes.
  local:
    enabled: false
    previewHost: ""
    tlsHost: localhost
    tlsSecret: ""

# The agent-sandbox controller and its CRDs (files/agent-sandbox, the pinned
# release). Every CRD and the controller's Namespace is kept by a Helm
# uninstall or upgrade.
agentSandbox:
  enabled: true
  crds: true
  # A controller image of the environment's own; empty runs the pinned release.
  image: ""

# The runc RuntimeClass, the node default that diagnostic and Kind Sandboxes
# run under. Not kept, as the VM profiles' are not.
runcRuntimeClass: true

# The VM runtime profiles' RuntimeClasses, each with its own switch. Unlike the
# CRDs, they carry no resource-policy keep: a RuntimeClass holds no data,
# running Pods keep running without it, and applying the chart restores it.
runtimeProfiles:
  enabled: true
  commodity: true
  commodity32g: true
  confidential: true
  standard: true

# The confidential runtime smoke: its control ConfigMap, in the probe
# namespace, and in the confidential-snp phase the smoke Jobs, which need AMD
# SEV-SNP runtime nodes. phase is inactive or confidential-snp.
confidentialSmoke:
  enabled: false
  phase: inactive
  namespace: codewire-runtime-probes

# Image families. A digest, when set, pins the image and replaces the tag.
images:
  dashboard:
    repository: ""
    tag: ""
    digest: ""
  derp:
    repository: ""
    tag: ""
    digest: ""
  # The confidential runtime probe the smoke Jobs run.
  confidentialProbe:
    repository: ghcr.io/codewiresh/confidential-probe
    tag: ""
    digest: sha256:8a4a55dbbcaaef4f34c5b35a20b667d99328db77e3e14bedd5718703d7530517
  # The shared Rust services image; each service selects its binary.
  services:
    repository: ""
    tag: ""
    digest: ""

dashboard:
  enabled: true
  replicas: 2
  # The Pods' labels, which the Deployment, Service and NetworkPolicy select.
  selectorLabels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/name: codewire
  # Labels on the Deployment and the Service themselves.
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/name: codewire
  origins:
    # The origin browsers call the API on. Required.
    browserApi: ""
    api: http://codewire-orchestration:8084
    credential: http://codewire-credential-service:8086
    identity: http://codewire-idp:8091
    billing: http://codewire-billing:8081
  portName: http
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  lifecycle:
    preStop:
      sleep:
        seconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  imagePullSecrets: []
  terminationGracePeriodSeconds: 40
  service:
    name: codewire-dashboard
    type: ClusterIP
    port: 80
    portName: http
  networkPolicy:
    # It admits the public edge (edge.peers) only.
    enabled: true
