apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-config
  namespace: agent-sandbox-system
data:
  # agent-sandbox validates SandboxClaim additionalPodMetadata labels against
  # this allowlist before propagating them to Sandbox pods. Codewire relies on
  # codewire.sh/* labels for environment and gateway/workspace service selection.
  allowed-label-domains: |
    sandbox.users.io
    codewire.sh
