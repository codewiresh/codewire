apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-credential-service
spec:
  # One node; a single broker keeps local logs and debugging simple.
  replicas: 1
  template:
    spec:
      containers:
        - name: credential-service
          env:
            - name: CREDENTIAL_PUBLIC_ORIGIN
              value: "http://127.0.0.1:8080"
