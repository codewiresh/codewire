apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codewire-dashboard
  template:
    metadata:
      labels:
        app: codewire-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: codewire-dashboard:local
          env:
            - name: CODEWIRE_PUBLIC_ORIGIN
              value: "http://127.0.0.1:8080"
            - name: CODEWIRE_API_ORIGIN
              value: "http://codewire-orchestration:8084"
            - name: CODEWIRE_CREDENTIAL_ORIGIN
              value: "http://codewire-credential-service:8086"
            - name: CODEWIRE_IDENTITY_ORIGIN
              value: "http://codewire-idp:8091"
            - name: CODEWIRE_BILLING_ORIGIN
              value: "http://codewire-billing:8081"
            - name: CODEWIRE_BROWSER_API_ORIGIN
              value: "http://127.0.0.1:8080"
          ports:
            - containerPort: 5173
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5173
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector:
    app: codewire-dashboard
  ports:
    - port: 5173
      targetPort: 5173
