apiVersion: v1
kind: Service
metadata:
  name: codewire-derp
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30444
      name: http
    - port: 8443
      targetPort: 8443
      nodePort: 30443
      name: https
    - port: 3478
      targetPort: 3478
      protocol: UDP
      nodePort: 30445
      name: stun
