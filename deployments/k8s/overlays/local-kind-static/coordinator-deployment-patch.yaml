- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/strategy
  value:
    type: Recreate
- op: replace
  path: /spec/template/spec/imagePullSecrets
  value: []
- op: replace
  path: /spec/template/spec/containers/0/command
  value:
    - /codewire-coordinator
- op: replace
  path: /spec/template/spec/containers/0/env
  value:
    - name: COORDINATOR_PORT
      value: "8090"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
- op: replace
  path: /spec/template/spec/containers/0/envFrom
  value:
    - configMapRef:
        name: codewire-config
    - secretRef:
        name: codewire-local-secrets
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: wait-for-postgres
      image: postgres:17-alpine
      command:
        - sh
        - -c
        - until pg_isready -h postgres -p 5432 -U codewire -d codewire; do sleep 1; done
      env:
        - name: PGPASSWORD
          value: codewire
- op: add
  path: /spec/template/spec/containers/0/startupProbe
  value:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
