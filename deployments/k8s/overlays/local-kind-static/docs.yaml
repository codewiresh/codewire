apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codewire-docs
  template:
    metadata:
      labels:
        app: codewire-docs
    spec:
      containers:
        - name: docs
          image: codewire-docs:local
          command: ["sh", "-c", "cd /app && bun run --cwd apps/docs dev -- --host --port 4321"]
          ports:
            - containerPort: 4321
---
apiVersion: v1
kind: Service
metadata:
  name: docs
spec:
  type: NodePort
  selector:
    app: codewire-docs
  ports:
    - port: 4321
      targetPort: 4321
      nodePort: 30321
