- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/strategy
  value:
    type: Recreate
- op: replace
  path: /spec/template/spec/imagePullSecrets
  value: []
- op: add
  path: /spec/template/spec/containers/0/command
  value:
    - /codewire-idp
- op: add
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: IfNotPresent
- op: replace
  path: /spec/template/spec/containers/0/env
  value:
    - name: IDP_PORT
      value: "8091"
    - name: IDP_SIGNING_KEK_DIR
      value: /var/run/secrets/codewire/idp-signing-keks
    - name: IDP_SIGNING_ACTIVE_KEK_ID
      value: v1
    - name: IDP_TURNSTILE_BYPASS_EMAIL
      value: codewire-e2e@example.test
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
- op: replace
  path: /spec/template/spec/containers/0/envFrom
  value:
    - configMapRef:
        name: codewire-config
    - secretRef:
        name: codewire-local-secrets
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: wait-for-postgres
      image: postgres:17-alpine
      command:
        - sh
        - -c
        - until pg_isready -h postgres -p 5432 -U codewire -d codewire; do sleep 1; done
      env:
        - name: PGPASSWORD
          value: codewire
- op: add
  path: /spec/template/spec/containers/0/startupProbe
  value:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
