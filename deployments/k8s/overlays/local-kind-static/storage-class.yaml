# Alias for example-volumes so PVC-backed workspaces work in Kind.
# In production this is the Hetzner CSI driver; here we use the
# Kind-bundled local-path provisioner with the same binding mode.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: example-volumes
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

