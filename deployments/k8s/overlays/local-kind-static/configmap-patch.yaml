apiVersion: v1
kind: ConfigMap
metadata:
  name: codewire-config
data:
  PORT: "8080"
  DATABASE_URL: "postgres://codewire:codewire@postgres:5432/codewire?sslmode=disable"
  LIFECYCLE_ORCHESTRATOR: "temporal-primary"
  ENVIRONMENT_ORCHESTRATOR: "temporal-primary"
  TEMPORAL_HOST_PORT: "temporal-frontend.temporal-system.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "codewire-lifecycle"
  TEMPORAL_UI_URL: "http://temporal-web.temporal-system.svc.cluster.local:8080"
  DERP_HOST: "127.0.0.1"
  DERP_PORT: "8443"
  STUN_HOST: ""
  STUN_PORT: "3478"
  ENVIRONMENT: "local"
  FRONTEND_URL: "http://127.0.0.1:8080"
  PUBLIC_OIDC_ISSUER_URL: "http://127.0.0.1:8080"
  SANDBOX_RUNTIME_PROFILE: "none"
  SANDBOX_RUNTIME_CLASS: ""
  SANDBOX_ALLOW_DIAGNOSTIC_RUNTIME: "true"
  SANDBOX_DOCKER_MODE: "local-dind-direct"
  SANDBOX_NETWORK_POLICY_MANAGEMENT: "Unmanaged"
  CODEWIRE_API_URL: "http://codewire-orchestration.default.svc.cluster.local:8084"
  CODEWIRE_COORDINATOR_URL: "http://codewire-coordinator.default.svc.cluster.local:8090"
  NAMESPACE_PREFIX: "local-tenant"
  TENANT_SECRET_STORE: "local"
  SANDBOX_REGISTRY_HOST: "git.example.com"
  SANDBOX_NAMESPACE: "dev-sandboxes"
  BILLING_CONTROLLER_ENABLED: "true"
  BILLING_CONTROLLER_NAMESPACE: "dev-sandboxes"
  BILLING_CONTROLLER_REQUEUE_SECONDS: "60"
  BILLING_SESSION_LEDGER_CANONICAL: "true"
  SANDBOX_IMAGE_PULL_SECRET: ""
  SANDBOX_GATEWAY_IMAGE: "git.example.com/codewire/gateway:local"
  SANDBOX_DIND_ENABLED: "true"
  SANDBOX_FULL_WARM_PROFILES: "500:1024:10:4"
  PREVIEW_BASE_DOMAIN: "codewire-dev.local"
  SKIP_2FA_SETUP: "true"
  DERP_MESH_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
