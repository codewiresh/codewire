apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base
  - ../../derp
  - ../../coordinator
  - ../../idp
  - ../../billing
  - ../../orchestration
  - ../../credential-service
  - ingress.yaml
  - local-secret.yaml
  - idp-signing-keks.yaml
  - postgres.yaml
  - dashboard.yaml
  # The `standard` profile's class, without the Kata classes Kind cannot run.
  - ../../runtime-profiles/standard

# The /dev/kvm device plugin (#5602).
components:
  - ../../kvm-device-plugin

# Keep the static Kind renderer on the same synthetic browser App contract as
# the managed fixture; the secret-bearing configuration remains test-only.
configMapGenerator:
  - name: codewire-dashboard-public-config
    behavior: merge
    literals:
      - GITHUB_APP_SLUG=codewire-synthetic
      - GITHUB_APP_CLIENT_ID=Iv1.kindsynthetic

images:
  - name: git.example.com/codewire/derp
    newName: codewire-derp
    newTag: local
  - name: git.example.com/codewire/services
    newName: codewire-services
    newTag: local

patches:
  # Kind's one node is labelled as the sandbox pool, not as a runtime node.
  - patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          codewire.sh/node-pool: sandbox
    target:
      kind: DaemonSet
      name: codewire-kvm-device-plugin
  - path: credential-service-origin-patch.yaml
    target:
      kind: Deployment
      name: codewire-credential-service
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: codewire-config
  # The registries the image cache may hold images from: the public
  # workspace mirror and Docker Official Images (docs/CONFIGURATION.md).
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: codewire-image-registries
      data:
        CODEWIRE_APPROVED_IMAGE_REGISTRIES: ghcr.io/codewiresh/,docker.io/library/
    target:
      kind: ConfigMap
      name: codewire-image-registries
  - path: derp-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-derp
  - path: derp-service-patch.yaml
    target:
      kind: Service
      name: codewire-derp
  - path: coordinator-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-coordinator
  - path: idp-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-idp
  - path: billing-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-billing
  - path: orchestration-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-orchestration
  # No cert-manager here: scripts/dev/kind/local-internal-tls.sh creates the
  # orchestration internal leaf Secret and roots instead of this Certificate.
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: unused
    target:
      group: cert-manager.io
      kind: Certificate
      name: codewire-orchestration-internal
  # Nor is there a UDP relay here, so orchestration needs no client
  # certificate for its allocator; the Deployment's mounts are optional.
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: unused
    target:
      group: cert-manager.io
      kind: Certificate
      name: codewire-orchestration-udp-relay-allocator-client
  # Warm-pool members on Kind run a diagnostic runtime: runc, or the node
  # default ('') when SANDBOX_RUNTIME_PROFILE is none. The test op pins the
  # variable's position in the base policy.
  - target:
      group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
      name: codewire-orchestration-warm-pool-template
    patch: |-
      - op: test
        path: /spec/variables/0/name
        value: runtimeClasses
      - op: replace
        path: /spec/variables/0/expression
        value: "['commodity', 'commodity-32g', 'runc', '']"

# Namespace transforms do not rewrite DNS SANs inside custom resources.
replacements:
  - source:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: codewire-credential-broker
      fieldPath: metadata.namespace
    targets:
      - select:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: codewire-credential-broker
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1

transformers:
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-workspace-binding-peers
    patch: |-
      - op: replace
        path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: dev-sandboxes
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-orchestration-workspace-binding
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-credential-service-peers
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ingress-nginx
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-credential-service
  # Kind's edge is ingress-nginx, and its dashboard is this overlay's own,
  # labelled app=codewire-dashboard (#3297).
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-idp-peers
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/1/podSelector/matchLabels
        value:
          app: codewire-dashboard
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-idp
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-billing-peers
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/1/podSelector/matchLabels
        value:
          app: codewire-dashboard
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-billing
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-sandbox-roles-dev-sandboxes
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-sandboxes
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role|RoleBinding
      name: codewire-(orchestration-(internal-roots|image-cache|sandboxes)|credential-service-runtime)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-sandbox-roles-default-subject
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: codewire-(orchestration-(internal-roots|image-cache|sandboxes)|credential-service-runtime)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-sandbox-roles-admission-cluster-scope
    patch: |-
      - op: remove
        path: /metadata/namespace
    target:
      group: admissionregistration.k8s.io
      version: v1
      # Every admission policy and binding is cluster-scoped, so the target
      # is the kinds, not a list of names a new policy could miss (#5002).
      kind: ValidatingAdmissionPolicy|ValidatingAdmissionPolicyBinding
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-image-cache-dev-sandboxes
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-sandboxes
    target:
      kind: ServiceAccount|NetworkPolicy
      name: cw-image-cache
