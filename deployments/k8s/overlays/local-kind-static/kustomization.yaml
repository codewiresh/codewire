apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base
  - ../../derp
  - ../../coordinator
  - ../../idp
  - ../../billing
  - ../../orchestration
  - ../../credential-service
  - ingress.yaml
  - local-secret.yaml
  - idp-signing-keks.yaml
  - postgres.yaml
  - dashboard.yaml
  - storage-class.yaml

# Keep the static Kind renderer on the same synthetic browser App contract as
# the managed fixture; the secret-bearing configuration remains test-only.
configMapGenerator:
  - name: codewire-dashboard-public-config
    behavior: merge
    literals:
      - GITHUB_APP_SLUG=codewire-synthetic
      - GITHUB_APP_CLIENT_ID=Iv1.kindsynthetic

images:
  - name: git.example.com/codewire/derp
    newName: codewire-derp
    newTag: local
  - name: git.example.com/codewire/services
    newName: codewire-services
    newTag: local

patches:
  - path: credential-service-origin-patch.yaml
    target:
      kind: Deployment
      name: codewire-credential-service
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: codewire-config
  - path: derp-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-derp
  - path: derp-service-patch.yaml
    target:
      kind: Service
      name: codewire-derp
  - path: coordinator-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-coordinator
  - path: idp-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-idp
  - path: billing-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-billing
  - path: orchestration-deployment-patch.yaml
    target:
      kind: Deployment
      name: codewire-orchestration
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
    target:
      kind: Ingress
      name: codewire-dashboard
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
    target:
      kind: Ingress
      name: codewire-derp
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
    target:
      kind: Ingress
      name: codewire-coordinator
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
    target:
      kind: Ingress
      name: codewire-idp
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
    target:
      kind: Ingress
      name: codewire-billing

# Namespace transforms do not rewrite DNS SANs inside custom resources.
replacements:
  - source:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: codewire-credential-broker
      fieldPath: metadata.namespace
    targets:
      - select:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: codewire-credential-broker
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1

transformers:
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-credential-service-peers
    patch: |-
      - op: replace
        path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: dev-sandboxes
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ingress-nginx
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-credential-service
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-gateway-host-key-dev-sandboxes
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-sandboxes
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role|RoleBinding
      name: codewire-(orchestration-(gateway-host-key|credential-bootstrap)|credential-service-runtime)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-gateway-host-key-default-subject
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: codewire-(orchestration-(gateway-host-key|credential-bootstrap)|credential-service-runtime)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-gateway-host-key-admission-cluster-scope
    patch: |-
      - op: remove
        path: /metadata/namespace
    target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingAdmissionPolicy|ValidatingAdmissionPolicyBinding
      name: codewire-orchestration-(gateway-host-key|credential-bootstrap|credential-leaf-cleanup)
