apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-local
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "*.codewire-dev.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
    - http:
        paths:
          - path: /api/v1/networks
            pathType: Exact
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 5173
---
# Tailnet coordinate paths → codewire-coordinator. Separate ingress because
# these need regex matching; nginx gives regex locations priority over the
# /api prefix above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-coordinator-local
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/organizations/[^/]+/environments/[^/]+/coordinate
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
          - path: /api/v1/internal/gateway/coordinate
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
---
# Native coordinator Connect bidi stream. Keep this separate from the
# WebSocket Ingress above because backend-protocol applies to the whole object.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-coordinator-connect-local
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /coordinator\.v1\.CoordinatorService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
---
# Native environment-session bidi stream. TLS+ALPN proves HTTP/2 on the
# client leg; GRPC retains HTTP/2 from ingress-nginx to orchestration.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-environment-session-grpc-local
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: codewire-kind-ingress-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /codewire\.v1\.EnvironmentSessionService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration-grpc
                port:
                  name: grpc
---
# OIDC provider paths → codewire-idp. Longest-prefix wins over /api above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-idp-local
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/oauth
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          # Rust IdP owns the ported auth paths below. Keep this explicit
          # list in lockstep with the base/local-kind-static IdP ingress copies.
          - path: /api/auth/two-factor
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/verify-email
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/forget-password
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/reset-password
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/send-verification-email
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/sign-up
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/sign-in
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/sign-out
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/get-session
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/oidc
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/openid-configuration
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
---
# Billing service paths → codewire-billing (Rust). Local-overlay variant
# of the prod ingress, hostless. Plain Prefix is fine; /api/v1/admin/...
# is more specific than the /api prefix the main ingress has.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-billing-local
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/admin/billing/catalog$
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          # Catalog plan/price/settings write CRUD + subscription-
          # migrations (#168, #38). Scoped to the write subpaths so the
          # bare /catalog read above keeps its own rule.
          - path: /api/v1/admin/billing/catalog/(plans|prices|settings|subscription-migrations)
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/billing/plans
            pathType: Prefix
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing/invoices
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing/events
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing$
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing/(checkout|portal|setup)
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/environments/usage
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /codewire\.console\.v1\.BillingService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/webhooks/stripe
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          # D8 probe routing proof (docs/plans/connect-rpc/03 WI-4): both
          # binaries mount codewire.testing.v1.PingService; routing
          # PublicPing to billing proves a billing-owned Connect regex
          # beats the /codewire\. orchestration fallback (D5 ordering).
          - path: /codewire\.testing\.v1\.PingService/PublicPing$
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
---
# Connect-RPC path routing (docs/plans/connect-rpc/03, D5) — the local twin
# of base's codewire-connect Ingress. The D8 probe's billing routing
# proof lives in the codewire-billing-local Ingress above (production
# topology: billing-owned Connect rules ride the billing regex Ingress);
# every other Connect path reaches orchestration here. Request and response
# buffering are off and the ingress body-size limit is disabled for typed
# streaming RPCs. Drift-checked by scripts/checks/repo_checks.py
# connect-edge-routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-connect-local
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /codewire\.admin\.v1\.AdminService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /codewire\.admin\.v1\.BillingCatalogService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /codewire\.
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
