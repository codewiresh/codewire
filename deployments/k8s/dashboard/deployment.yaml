apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-dashboard
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: dashboard
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: dashboard
          image: git.example.com/codewire/dashboard:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
