apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-dashboard
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: nexus-registry
      containers:
        - name: dashboard
          image: git.example.com/codewire/dashboard:latest
          env:
            - name: CODEWIRE_PUBLIC_ORIGIN
              value: https://codewire.sh
            - name: CODEWIRE_API_ORIGIN
              value: http://codewire-orchestration:8084
            - name: CODEWIRE_CREDENTIAL_ORIGIN
              value: http://codewire-credential-service:8086
            - name: CODEWIRE_IDENTITY_ORIGIN
              value: http://codewire-idp:8091
            - name: CODEWIRE_BILLING_ORIGIN
              value: http://codewire-billing:8081
            - name: CODEWIRE_BROWSER_API_ORIGIN
              value: https://codewire.sh
            # The public widget key comes from the dedicated generated
            # ConfigMap. Its optional empty state leaves access requests
            # fail-closed until the separate rollout supplies both key and secret.
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: codewire-dashboard-public-config
                  key: TURNSTILE_SITE_KEY
                  optional: true
          ports:
            - containerPort: 5173
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
