apiVersion: batch/v1
kind: Job
metadata:
  name: codewire-confidential-snp-attestation-v75
  namespace: codewire-runtime-probes
  labels:
    app.kubernetes.io/name: codewire-confidential-snp-attestation
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: confidential
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire-confidential-snp-attestation
        app.kubernetes.io/part-of: codewire
        codewire.sh/runtime-tier: confidential
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      automountServiceAccountToken: false
      runtimeClassName: confidential
      nodeSelector:
        node.codewire.sh/confidential-snp: "true"
      restartPolicy: Never
      # The probe deliberately runs privileged to create /dev/sev-guest.
      # Declare the image-derived wheel group so guest-pull and genpolicy use
      # the same process identity.
      securityContext:
        supplementalGroups:
          - 10
      containers:
        - name: attest
          image: ghcr.io/codewiresh/confidential-probe
          imagePullPolicy: IfNotPresent
          securityContext:
            # This disposable one-container confidential VM needs containerd's
            # privileged device rule to open the guest-created /dev/sev-guest.
            # The measured Agent policy still pins Talos's exact grantable
            # capability set instead of accepting arbitrary capabilities.
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "runtimeClass=confidential"
              uname -a
              if [ ! -e /dev/sev-guest ]; then
                sev_guest_minor="$(awk '$2 == "sev-guest" { print $1 }' /proc/misc)"
                test -n "$sev_guest_minor"
                mknod /dev/sev-guest c 10 "$sev_guest_minor"
                chmod 0600 /dev/sev-guest
              fi
              test -e /dev/sev-guest
              ls -l /dev/sev-guest
              /usr/local/bin/snpguest report /tmp/attestation-report.bin /tmp/report-data.bin --random
              test -s /tmp/attestation-report.bin
              test -s /tmp/report-data.bin
              wc -c /tmp/attestation-report.bin /tmp/report-data.bin
              sha256sum /tmp/attestation-report.bin /tmp/report-data.bin
              /usr/local/bin/snpguest display report /tmp/attestation-report.bin
              printf 'attestation_report_base64_begin\n'
              base64 /tmp/attestation-report.bin
              printf '\nattestation_report_base64_end\n'
              printf 'report_data_base64_begin\n'
              base64 /tmp/report-data.bin
              printf '\nreport_data_base64_end\n'
              echo "snp-attestation-report-ok"
