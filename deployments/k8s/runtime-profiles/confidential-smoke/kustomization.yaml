# This is an activation template, not the active Kustomization. A reviewed
# source PR copies it to kustomization.yaml with the confidential runtime
# profile template. The release-bound Flux child prunes the Jobs on reversion.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - confidential-smoke-control.yaml
  - commodity-smoke-job.yaml
  - confidential-smoke-job.yaml
  - confidential-attestation-job.yaml
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: codewire-confidential-snp-smoke-control
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: codewire-confidential-snp-smoke-control
      data:
        phase: confidential-snp
