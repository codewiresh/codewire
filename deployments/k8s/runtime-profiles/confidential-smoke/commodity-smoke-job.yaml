# Rendered only by kustomization.confidential-snp.yaml. Its `linstor-local`
# volume matches the commodity class that the confidential activation profile
# keeps for commodity workspaces (codewire#2321).
apiVersion: batch/v1
kind: Job
metadata:
  name: codewire-commodity-runtime-smoke-v75
  namespace: codewire-runtime-probes
  labels:
    app.kubernetes.io/name: codewire-commodity-runtime-smoke
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: commodity
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire-commodity-runtime-smoke
        app.kubernetes.io/part-of: codewire
        codewire.sh/runtime-tier: commodity
    spec:
      automountServiceAccountToken: false
      runtimeClassName: commodity
      # The Dev release names the probe node (#1383).
      nodeSelector:
        kubernetes.io/hostname: example-node-1
      restartPolicy: Never
      volumes:
        - name: workspace
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: linstor-local
                resources:
                  requests:
                    storage: 1Gi
      containers:
        - name: smoke
          image: registry.k8s.io/e2e-test-images/busybox@sha256:caec39cad3b12c26600baf6e67ba811ac15d28a9288d0ccdfffb4b318992c3bb
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -lc
            - |
              echo "runtimeClass=commodity"
              uname -a
              test -r /proc/cpuinfo
              marker="linstor-workspace-ok"
              printf '%s\n' "$marker" > /workspace/marker
              test "$(cat /workspace/marker)" = "$marker"
              printf '%s\n' "$marker"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
