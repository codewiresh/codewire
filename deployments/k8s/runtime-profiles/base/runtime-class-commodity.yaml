apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: commodity
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: commodity
    codewire.sh/runtime-handler: kata-clh
handler: kata-clh
# Kata's sizing guide (docs/how-to/how-to-size-sandbox-overhead-runtime-rs.md):
# podFixed must cover guest- and host-side overhead, and operators measure it.
# A guest with full RAM leaves the Pod cgroup only this margin for the VMM,
# virtiofsd and the host page cache of their writes; past it the host kills the
# VM. The margin needed grows with the VM, so each memory tier is its own class
# (`commodity_runtime_class`); this one takes workspaces up to 16 GiB. Measured
# on Dev with guest RAM forced full and two buffered writers, MGLRU on (#3718):
# at 1 GiB, 4+2 and 8+4 GiB (workspace + DinD) survived 0 of 3 and 16+4 GiB 2 of
# 6; at 1.5 GiB each survived 3 of 3. The worst writeback seen was 1.31 GiB
# (1.5 GiB in one earlier 16+4 round at a smaller margin).
overhead:
  podFixed:
    cpu: 250m
    memory: 1536Mi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
