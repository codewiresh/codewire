apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: commodity
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: commodity
    codewire.sh/runtime-handler: kata-clh
handler: kata-clh
# Kata's sizing guide (docs/how-to/how-to-size-sandbox-overhead-runtime-rs.md):
# podFixed must cover guest- and host-side overhead, and operators measure it.
# A guest with full RAM leaves the Pod cgroup only this margin for the VMM,
# virtiofsd and the host page cache of their writes; past it the host kills the
# VM. Measured with scripts/runtime/dev/prove-dev-runtime-memory-fill.sh on 4+2
# and 16+4 GiB shapes (#3718): 130 and 512 MiB are killed, 1 GiB survives.
# Larger VMs are not measured.
overhead:
  podFixed:
    cpu: 250m
    memory: 1Gi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
