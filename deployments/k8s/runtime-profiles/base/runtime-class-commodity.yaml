apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: commodity
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: commodity
    codewire.sh/runtime-handler: kata-clh
handler: kata-clh
# Match Kata's clh-runtime-rs RuntimeClass accounting. Without PodOverhead,
# kubelet constrains the VM/runtime processes to the workload-only cgroup limit.
overhead:
  podFixed:
    cpu: 250m
    memory: 130Mi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
