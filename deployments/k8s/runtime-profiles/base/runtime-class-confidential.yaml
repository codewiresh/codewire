apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: confidential
  labels:
    app.kubernetes.io/name: codewire-runtime-profile
    app.kubernetes.io/part-of: codewire
    codewire.sh/runtime-tier: confidential
    codewire.sh/runtime-handler: kata-qemu-snp
handler: kata-qemu-snp
# Kata runtime-rs sizes the guest as workload memory plus 2048 MiB of guest
# overhead. Preserve upstream qemu-snp's 1920 MiB host-side margin (its 2048
# MiB RuntimeClass budget minus the upstream 128 MiB guest overhead), because
# QEMU runs inside the pod cgroup: 2048 + (2048 - 128) = 3968 MiB.
overhead:
  podFixed:
    cpu: "1"
    memory: 3968Mi
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
    node.codewire.sh/runtime-candidate: "true"
    node.codewire.sh/confidential-snp: "true"
  tolerations:
    - key: node.codewire.sh/runtime-candidate
      operator: Equal
      value: "true"
      effect: NoSchedule
