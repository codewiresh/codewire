fullnameOverride: codewire-mesh

image:
  # A source placeholder: codewire/deploy sets the configured registry's
  # repository and the release's immutable digest.
  repository: git.example.com/codewire/mesh
  tag: latest
  digest: ""

imagePullSecrets:
  - name: harbor-registry

# Infra owns Cluster/dev/codewire-mesh-db and CNPG generates this Secret.
# Keep it separate from codewire-db because Mesh owns its SQLx history.
database:
  enabled: true
  secretName: "codewire-mesh-db-app"
  uriKey: "uri"

meshAuthorization:
  url: "https://codewire-orchestration.dev.svc.cluster.local:8088"
  tlsRootsConfigMap: "codewire-orchestration-internal-roots"
  hmacSecretRef:
    name: "codewire-secrets"
    key: "SESSION_SECRET"
    optional: false

mesh:
  baseURL: https://mesh.codewire-dev.sh
  derpURL: https://derp.codewire-dev.sh
  listenAddr: "0.0.0.0:8080"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-codewire
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: mesh.codewire-dev.sh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mesh.codewire-dev.sh
      secretName: mesh-codewire-dev-tls

# Kept unmounted, annotated keep, at its existing size (codewire#3542).
retainedDataClaim:
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
