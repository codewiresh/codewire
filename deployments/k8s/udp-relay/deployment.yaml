apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-udp-relay
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: udp-relay
spec:
  # Relay allocations and VNI bindings are in-memory. Keep one replica until
  # relay sharding or shared state is implemented.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: udp-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: udp-relay
    spec:
      imagePullSecrets:
        - name: harbor-registry
      terminationGracePeriodSeconds: 15
      # The TLS leaf is readable by the image's 65532 group only.
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: udp-relay
          image: git.example.com/codewire/services:latest
          command: ["/codewire-udp-relay"]
          ports:
            - containerPort: 41641
              protocol: UDP
              name: udp
            # The allocator, over TLS, for orchestration's client certificate
            # only (#4011). There is no plain allocator port.
            - containerPort: 8097
              name: allocator-tls
            # Probes and metrics. The PodMonitor scrapes the port named http.
            - containerPort: 8096
              name: http
          # This Pod parses UDP from the internet and needs no secret to do it,
          # so it takes none of codewire-secrets (#3926). Its only Secret is
          # its own TLS identity for the allocator.
          envFrom:
            - configMapRef:
                name: codewire-config
          env:
            - name: CODEWIRE_UDP_RELAY_ALLOCATOR_TLS_CERT
              value: /run/codewire-udp-relay-allocator-tls/tls.crt
            - name: CODEWIRE_UDP_RELAY_ALLOCATOR_TLS_KEY
              value: /run/codewire-udp-relay-allocator-tls/tls.key
            - name: CODEWIRE_UDP_RELAY_ALLOCATOR_CLIENT_ROOTS
              value: /run/codewire-udp-relay-allocator-roots/ca.crt
            # The name on orchestration's client certificate. It names a
            # caller, not a host, so it is the same in every namespace.
            - name: CODEWIRE_UDP_RELAY_ALLOCATOR_CLIENT_NAME
              value: orchestration.udp-relay-allocator.codewire.internal
          volumeMounts:
            - name: allocator-tls
              mountPath: /run/codewire-udp-relay-allocator-tls
              readOnly: true
            - name: allocator-roots
              mountPath: /run/codewire-udp-relay-allocator-roots
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: allocator-tls
          secret:
            secretName: codewire-udp-relay-allocator-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: allocator-roots
          configMap:
            name: codewire-udp-relay-allocator-roots
            items:
              - key: ca.crt
                path: ca.crt
