# Ingress to the UDP relay (#3926). Relay data on UDP 41641 is public: the
# relay's LoadBalancer sends the internet here, and each side proves its disco
# key before anything is forwarded. The allocator on TCP 8095 has no token yet and
# only orchestration calls it. TCP 8096 is read-only: probes and metrics.
#
# 8096 lists no source because Prometheus runs on host networking on both
# clusters. Cilium sees it as a node, which no Pod selector matches, and a
# NetworkPolicy has no way to name a node. Sandboxes stay denied every TCP port
# here by the platform's deny policy.
#
# A NetworkPolicy isolates its Pod on every port, so 41641 is listed. Traffic from
# the Pod's own node is never blocked on Cilium, so a host-network process there
# can reach the allocator; only a token closes that.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codewire-udp-relay
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: udp-relay
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: 41641
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codewire
              app.kubernetes.io/component: orchestration
      ports:
        - protocol: TCP
          port: 8095
    - ports:
        - protocol: TCP
          port: 8096
