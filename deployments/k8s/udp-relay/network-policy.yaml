# Ingress to the UDP relay (#3926). Relay data on UDP 41641 is public: the
# relay's LoadBalancer sends the internet here, and each side proves its disco
# key before anything is forwarded. The HTTP listener on TCP 8095 serves the
# allocator, which only orchestration calls, and metrics for Prometheus.
#
# A NetworkPolicy isolates its Pod on every port, so 41641 is listed. The kubelet
# probes on 8095 come from the Pod's own node, which a policy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codewire-udp-relay
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: udp-relay
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: 41641
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codewire
              app.kubernetes.io/component: orchestration
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8095
