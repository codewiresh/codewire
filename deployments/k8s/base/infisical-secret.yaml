apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: codewire-secrets
  namespace: prod
spec:
  # Override this in environment-specific overlays or cluster config.
  hostAPI: https://infisical.example.com/api
  resyncInterval: 60
  authentication:
    # Universal Auth for app secrets on your Infisical instance.
    # NOTE: Tenant secrets use a separate dedicated Infisical instance with K8s Auth
    # (http://infisical-backend.codewire-infisical.svc.cluster.local:8080) — see
    # INFISICAL_TENANT_K8S_AUTH_IDENTITY_ID in config.env. No static credentials needed.
    universalAuth:
      secretsScope:
        projectSlug: codewire
        envSlug: prod
        secretsPath: /
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: prod
  managedKubeSecretReferences:
    - secretName: codewire-secrets
      secretNamespace: prod
      creationPolicy: Owner
      secretType: Opaque
