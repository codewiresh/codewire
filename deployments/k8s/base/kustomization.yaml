apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - runtime-class-runc.yaml
  - infisical-secret.yaml
  - ingress.yaml

configMapGenerator:
  - name: codewire-config
    envs:
      - config.env

labels:
  - pairs:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/part-of: codewire
