apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - runtime-class-runc.yaml
  - ingress.yaml

configMapGenerator:
  - name: codewire-config
    envs:
      - config.env
  # This ConfigMap is intentionally separate from codewire-config, which many
  # services import with envFrom. The only public consumer is the dashboard.
  - name: codewire-dashboard-public-config
    literals:
      - TURNSTILE_SITE_KEY=
      # A public App slug only; its client ID and client secret belong solely
      # to credential-service's dedicated authorization Secret.
      - GITHUB_APP_SLUG=

labels:
  - pairs:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/part-of: codewire
