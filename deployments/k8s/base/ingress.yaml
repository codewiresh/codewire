apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-dashboard
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          # Explicit transitional owner while MeshNetworkService is not
          # mounted publicly yet. Keep this exact route ahead of /api.
          - path: /api/v1/networks
            pathType: Exact
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /.well-known/apple-app-site-association
            pathType: Exact
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /install.sh
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-derp
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
