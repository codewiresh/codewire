---
# App preview hosts route by Host header and are served by Rust
# orchestration's preview proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-preview
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.cwpreview.sh"
      secretName: cwpreview-tls
  rules:
    - host: "*.cwpreview.sh"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
---
# Routes the tailnet coordinate paths to codewire-coordinator (deployed from
# deployments/k8s/coordinator, like derp). Separate Ingress because these
# paths need regex matching; nginx gives regex locations priority over the
# /api fallback in the main ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-coordinator
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Coordinate WebSockets stay open for the life of the tunnel.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /api/v1/organizations/[^/]+/environments/[^/]+/coordinate
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
          - path: /api/v1/internal/gateway/coordinate
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
---
# Native coordinator Connect bidi stream. This must remain a separate
# Ingress from codewire-coordinator above: backend-protocol applies to the
# whole object, while the existing coordinate WebSockets need HTTP/1.1.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-coordinator-connect
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /coordinator\.v1\.CoordinatorService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
---
# Native environment-session bidi stream. This must remain separate from the
# general Connect Ingress: backend-protocol applies to the whole object, while
# every ordinary product service remains Connect-only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-environment-session-grpc
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /codewire\.v1\.EnvironmentSessionService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration-grpc
                port:
                  name: grpc
---
# Routes the OIDC provider paths to codewire-idp (deployed from
# deployments/k8s/idp). Plain prefix paths: nginx prefers the longest
# matching prefix, so /api/oauth and /api/oidc win over the /api fallback in
# the main ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-idp
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /api/oauth
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          # Rust IdP owns the ported auth paths below. Keep this explicit
          # list in lockstep with the local-kind IdP ingress copies.
          - path: /api/auth/two-factor
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/verify-email
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/forget-password
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/reset-password
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/send-verification-email
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/sign-up
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/sign-in
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/sign-out
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/get-session
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/oidc
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/openid-configuration
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
---
# Billing service paths → codewire-billing (deployed from
# deployments/k8s/billing). These are the permanent billing routes that
# override the main /api orchestration fallback. use-regex turns every path in
# THIS Ingress into an anchored case-insensitive regex (location ~* "^<path>")
# so the org-scoped billing paths can stay concise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-billing
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /api/v1/admin/billing/catalog$
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          # Catalog plan/price/settings write CRUD + subscription-
          # migrations (#168, #38). Scoped to the write subpaths so the
          # bare /catalog read above keeps its own rule.
          - path: /api/v1/admin/billing/catalog/(plans|prices|settings|subscription-migrations)
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/billing/plans
            pathType: Prefix
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing/invoices
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing/events
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing$
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/billing/(checkout|portal|setup)
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/v1/organizations/[^/]+/environments/usage
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /codewire\.console\.v1\.BillingService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/webhooks/stripe
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
---
# Connect-RPC path routing (docs/plans/connect-rpc/03, D5). Connect routes
# are /{package}.{Service}/{Method}; packages span binaries, so routing is
# per-Service. Billing-owned Services gain regex rules in the billing Ingress
# above as their protos land. CoordinatorService has its own h2
# Ingress beside the WebSocket object. This regex fallback sends every other
# Connect path to orchestration so an unmatched RPC gets a
# Connect-shaped answer from a service, never dashboard HTML (the `/`
# Prefix rule it would otherwise hit). Response and request buffering are off
# so server-streaming RPCs (Stream*/Watch*) and client-streaming RPCs cross the
# edge incrementally. Streaming uploads have no ingress body-size limit; the
# service consumes them incrementally. Verified in kind by
# scripts/ci/verify/kind-e2e.sh's streaming probes.
# codewire.testing.v1.PingService is deliberately never routed here (D8);
# its proof rules live in the kind/local-kind manifests only. The rules
# are drift-checked against proto/ by scripts/checks/repo_checks.py connect-edge-routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-connect
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /codewire\.admin\.v1\.AdminService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /codewire\.admin\.v1\.BillingCatalogService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /codewire\.
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
