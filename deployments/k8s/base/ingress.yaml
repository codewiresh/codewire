apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-dashboard
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /api/v1/github/oauth/callback
            pathType: Exact
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /.well-known/apple-app-site-association
            pathType: Exact
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /install.sh
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-derp
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx-derp
  tls:
    - hosts:
        - derp.codewire.sh
      secretName: codewire-derp-tls
  rules:
    - host: derp.codewire.sh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-derp
                port:
                  name: http
---
# App preview hosts route by Host header and are served by Rust
# orchestration's preview proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-preview
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.cwpreview.sh"
      secretName: cwpreview-tls
  rules:
    - host: "*.cwpreview.sh"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
---
# Native coordinator generated bidi stream.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-coordinator-connect
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-codewire
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codewire.sh
      secretName: codewire-tls
  rules:
    - host: codewire.sh
      http:
        paths:
          - path: /codewire\.internal\.v1\.CoordinatorService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
---
