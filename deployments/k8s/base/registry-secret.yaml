apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: gitea-registry-sync
  namespace: prod
spec:
  hostAPI: https://infisical.example.com/api
  resyncInterval: 3600  # Hourly (credentials don't change often)
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: shared
        envSlug: prod
        secretsPath: /ci
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: prod
  managedSecretReference:
    secretName: gitea-registry
    secretNamespace: prod
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        .dockerconfigjson: '{"auths":{"git.example.com":{"username":"ci","password":"{{ .GITEA_REGISTRY_TOKEN.Value }}","auth":"{{ printf "ci:%s" .GITEA_REGISTRY_TOKEN.Value | b64enc }}"}}}'
