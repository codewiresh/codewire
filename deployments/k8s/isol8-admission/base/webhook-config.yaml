apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: isol8-pod-memory
  annotations:
    cert-manager.io/inject-ca-from: isol8-system/isol8-webhook-tls
webhooks:
  - name: memory.isol8.codewire.sh
    clientConfig:
      url: https://127.0.0.1:9443/mutate
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    matchConditions:
      - name: only-isol8-runtime-class
        expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == "isol8"
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    sideEffects: None
    timeoutSeconds: 5
    admissionReviewVersions: ["v1"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: isol8-runtime-admission
  annotations:
    cert-manager.io/inject-ca-from: isol8-system/isol8-webhook-tls
webhooks:
  - name: runtimeclass.isol8.codewire.sh
    clientConfig:
      url: https://127.0.0.1:9443/validate
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        isol8.codewire.sh/enforce-runtime-class: "isol8"
    matchConditions:
      - name: exclude-control-plane-namespaces
        expression: '!(request.namespace in ["kube-system", "kube-public", "kube-node-lease", "isol8-system"])'
      - name: only-isol8-runtime-class
        expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == "isol8"
    failurePolicy: Fail
    sideEffects: None
    timeoutSeconds: 5
    admissionReviewVersions: ["v1"]
