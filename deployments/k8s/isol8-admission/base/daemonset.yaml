apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: isol8-webhook
  namespace: isol8-system
spec:
  selector:
    matchLabels:
      app: isol8-webhook
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: isol8-webhook
        app.kubernetes.io/name: isol8-webhook
    spec:
      serviceAccountName: isol8-webhook
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: gitea-registry
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: webhook
          image: git.example.invalid/codewire/isol8-webhook:d9c4015ac89a3bbf1cc2c472d8fbbbf10d7dbadb
          env:
            - name: WEBHOOK_PORT
              value: "9443"
          ports:
            - name: https
              containerPort: 9443
              hostPort: 9443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: tls
          secret:
            secretName: isol8-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: isol8-webhook
  namespace: isol8-system
spec:
  ports:
    - name: https
      port: 443
      targetPort: https
  selector:
    app: isol8-webhook
