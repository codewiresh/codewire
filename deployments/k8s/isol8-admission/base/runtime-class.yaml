apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: isol8
handler: isol8
scheduling:
  nodeSelector:
    isol8.codewire.sh/enabled: "true"
  tolerations:
    - key: isol8.codewire.sh/xen
      operator: Equal
      value: "true"
      effect: NoSchedule
overhead:
  podFixed:
    cpu: 10m
    memory: 16Mi
