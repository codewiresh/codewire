# cw-egress's identity. Its projected token (audience
# codewire.internal.egress-node.v1) is what orchestration's EgressService
# reviews; it is bound to no Role or ClusterRole, and it never reads the
# Kubernetes API itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-egress
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: egress
automountServiceAccountToken: false
