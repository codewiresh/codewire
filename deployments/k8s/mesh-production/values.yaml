fullnameOverride: codewire-mesh

image:
  repository: ghcr.io/codewiresh/codewire
  # Keep this empty when pinning by digest.
  tag: ""
  # Set this to the exact released Mesh image digest for production rollouts.
  digest: ""

database:
  enabled: true
  secretName: "codewire-mesh-db-app"
  uriKey: "uri"

meshAuthorization:
  url: "https://codewire-orchestration.prod.svc.cluster.local:8088"
  tlsRootsConfigMap: "codewire-orchestration-internal-roots"
  hmacSecretRef:
    name: "codewire-secrets"
    key: "SESSION_SECRET"
    optional: false

mesh:
  baseURL: https://mesh.codewire.sh
  listenAddr: "0.0.0.0:8080"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: mesh.codewire.sh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mesh.codewire.sh
      secretName: mesh-codewire-tls

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
