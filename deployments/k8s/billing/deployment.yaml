apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-billing
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: billing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: billing
    spec:
      imagePullSecrets:
        - name: nexus-registry
      containers:
        - name: billing
          # Runs from the shared codewire/services image (one image, many
          # entrypoints); the codewire-billing binary is selected by `command`.
          image: git.example.com/codewire/services:latest
          command: ["/codewire-billing"]
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: codewire-config
            - secretRef:
                name: codewire-secrets
          env:
            - name: BILLING_PORT
              value: "8081"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codewire-db-app
                  key: password
            # OTel exporter is opt-in via the `otel` cargo feature; the
            # endpoint here is only read when the feature is compiled in.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc:4317"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
