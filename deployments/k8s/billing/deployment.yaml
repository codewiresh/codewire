apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-billing
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: billing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: billing
      annotations:
        # Increment with a successful dedicated SES key rotation. Environment
        # variables are fixed at container start, so this rolls the workload
        # onto the verified next credential generation.
        codewire.sh/ses-credential-generation: "1"
    spec:
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing
          # Runs from the shared codewire/services image (one image, many
          # entrypoints); the codewire-billing binary is selected by `command`.
          image: git.example.com/codewire/services:latest
          command: ["/codewire-billing"]
          # The binary writes no file, so nothing in the container is
          # writable (#5505).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            # The API: the edge and the dashboard only (network-policy.yaml).
            - containerPort: 8081
              name: api
            # Metrics only, scraped by the PodMonitor's port named http from
            # any source: Prometheus runs on host networking (#4901, #4546).
            - containerPort: 8083
              name: http
          envFrom:
            - configMapRef:
                name: codewire-config
            - secretRef:
                name: codewire-secrets
          env:
            # These explicit values override any broad envFrom input. The SES
            # client rejects configured endpoint overrides and cannot use IMDS.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_IGNORE_CONFIGURED_ENDPOINT_URLS
              value: "true"
            # Billing receives only its own SES key pair plus the activation
            # marker. These fields are optional: without the marker, email
            # delivery is disabled; with it, the client requires the complete
            # SES projection.
            - name: CODEWIRE_SES_ENABLED
              valueFrom:
                secretKeyRef:
                  name: codewire-billing-ses
                  key: CODEWIRE_SES_ENABLED
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: codewire-billing-ses
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: codewire-billing-ses
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: BILLING_PORT
              value: "8081"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codewire-db-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
