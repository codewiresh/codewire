apiVersion: v1
kind: Service
metadata:
  name: codewire-derp
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: derp
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8443
      targetPort: 8443
      name: https
    - port: 3478
      targetPort: 3478
      protocol: UDP
      name: stun
