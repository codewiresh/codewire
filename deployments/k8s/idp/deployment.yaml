apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-idp
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: idp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: idp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: idp
      annotations:
        # Increment with a successful dedicated SES key rotation. Environment
        # variables are fixed at container start, so this rolls the workload
        # onto the verified next credential generation.
        codewire.sh/ses-credential-generation: "1"
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: idp
          # The Rust OIDC provider. Runs from the shared codewire/services
          # image (one image, many entrypoints) — the codewire-idp binary is
          # selected by `command`. Shares the jwks / sessions /
          # oidc_refresh_tokens / oidc_clients tables with the retired Go
          # provider, so the cutover preserves keys/sessions/tokens and
          # rollback is a one-line image revert.
          image: git.example.com/codewire/services:latest
          command: ["/codewire-idp"]
          ports:
            - containerPort: 8091
              name: http
          envFrom:
            - configMapRef:
                name: codewire-config
            - secretRef:
                name: codewire-secrets
          env:
            # These explicit values override any broad envFrom input. The SES
            # client rejects configured endpoint overrides and cannot use IMDS.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_IGNORE_CONFIGURED_ENDPOINT_URLS
              value: "true"
            # The IdP receives only its own SES key pair plus the activation
            # marker. These fields stay optional while the reviewed Resend
            # rollback path remains installed; if the marker is present, the
            # client requires the complete SES projection and never falls back.
            - name: CODEWIRE_SES_ENABLED
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-ses
                  key: CODEWIRE_SES_ENABLED
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-ses
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-ses
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            # Sign in with GitHub or Google (#4062). Every key is optional:
            # with none the providers are off, and half a provider's pair
            # stops the IdP at start. Infra projects the Secret from OpenBao.
            - name: CODEWIRE_OAUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-oauth
                  key: CODEWIRE_OAUTH_GITHUB_CLIENT_ID
                  optional: true
            - name: CODEWIRE_OAUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-oauth
                  key: CODEWIRE_OAUTH_GITHUB_CLIENT_SECRET
                  optional: true
            - name: CODEWIRE_OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-oauth
                  key: CODEWIRE_OAUTH_GOOGLE_CLIENT_ID
                  optional: true
            - name: CODEWIRE_OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codewire-idp-oauth
                  key: CODEWIRE_OAUTH_GOOGLE_CLIENT_SECRET
                  optional: true
            - name: IDP_PORT
              value: "8091"
            - name: IDP_SIGNING_KEK_DIR
              value: /var/run/secrets/codewire/idp-signing-keks
            - name: IDP_SIGNING_ACTIVE_KEK_ID
              value: v1
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codewire-db-app
                  key: password
          volumeMounts:
            - name: idp-signing-keks
              mountPath: /var/run/secrets/codewire/idp-signing-keks
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: idp-signing-keks
          secret:
            secretName: codewire-idp-signing-keks
