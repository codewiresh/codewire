apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-credential-service
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: credential-service
spec:
  # Two replicas so a restart, rollout or node loss never takes every
  # Sandbox's proxied provider calls down at once. Each bridge epoch is pinned
  # to one replica; authority, material and refresh are serialized in
  # PostgreSQL, so replicas share no in-memory state.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: credential-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: credential-service
    spec:
      imagePullSecrets:
        - name: nexus-registry
        - name: harbor-registry
      serviceAccountName: codewire-credential-service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: codewire
              app.kubernetes.io/component: credential-service
      # Required in-cluster Kubernetes identity, confined by the separate SA's
      # TokenReview/own-TokenRequest/exact sandbox metadata permissions.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credential-service
          image: git.example.com/codewire/services:latest
          command: ["/codewire-credential-service"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8086
            - name: broker-tls
              containerPort: 9443
          # No shared app Secret/config envFrom, signing secret, DB owner,
          # saved login, or generic OpenBao token enters this process. The
          # one optional GitHub App authorization Secret is dedicated to this
          # service; it is never a mirror credential, PAT, or deploy key.
          env:
            - name: CREDENTIAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codewire-credential-database
                  key: url
            - name: CREDENTIAL_HTTP_LISTEN_ADDR
              value: "0.0.0.0:8086"
            - name: CREDENTIAL_PUBLIC_ORIGIN
              value: https://codewire.sh
            - name: CREDENTIAL_BROKER_TLS_LISTEN_ADDR
              value: "0.0.0.0:9443"
            - name: CREDENTIAL_BROKER_TLS_CERT_FILE
              value: /run/codewire-credential-tls/tls.crt
            - name: CREDENTIAL_BROKER_TLS_KEY_FILE
              value: /run/codewire-credential-tls/tls.key
            - name: CREDENTIAL_CODEX_EXECUTABLE
              value: /usr/local/bin/codex
            - name: CREDENTIAL_GITHUB_EXECUTABLE
              value: /usr/local/bin/gh
            - name: CREDENTIAL_GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: codewire-github-app-authorization
                  key: client-id
                  optional: true
            - name: CREDENTIAL_GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codewire-github-app-authorization
                  key: client-secret
                  optional: true
            - name: CREDENTIAL_GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  name: codewire-github-app-authorization
                  key: slug
                  optional: true
            - name: CREDENTIAL_RUNTIME_DIR
              value: /run/codewire-credentials
            - name: CREDENTIAL_BAO_ADDR
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_ADDR
            - name: CREDENTIAL_BAO_AUTH_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_AUTH_MOUNT
            - name: CREDENTIAL_BAO_ROLE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_ROLE
            - name: CREDENTIAL_BAO_TRANSIT_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_TRANSIT_MOUNT
            - name: CREDENTIAL_APPLICATION_BAO_ROLE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_APPLICATION_BAO_ROLE
            - name: CREDENTIAL_APPLICATION_BAO_TRANSIT_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_APPLICATION_BAO_TRANSIT_MOUNT
            - name: CREDENTIAL_BAO_EXPECTED_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_EXPECTED_CLUSTER_ID
            - name: CREDENTIAL_BAO_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: CREDENTIAL_BAO_AUDIENCE
            - name: OPENBAO_KUBERNETES_API_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: codewire-credential-service-config
                  key: OPENBAO_KUBERNETES_API_AUDIENCE
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Initialization validates DB, OpenBao, provider DNS and current TLS
          # before either listener opens. Do not let ordinary liveness race it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: enrollment-runtime
              mountPath: /run/codewire-credentials
            - name: broker-tls
              mountPath: /run/codewire-credential-tls
              readOnly: true
            - name: database-roots
              mountPath: /run/codewire-credential-db-roots
              readOnly: true
      volumes:
        - name: enrollment-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: broker-tls
          secret:
            secretName: codewire-credential-broker-tls
            defaultMode: 0440
        # Public root input for verify-full PostgreSQL URLs, not a credential.
        - name: database-roots
          configMap:
            name: codewire-credential-database-roots
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-credential-service
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: credential-service
