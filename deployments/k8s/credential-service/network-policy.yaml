# The public Connect mutation API is reachable through the normal ingress edge
# and directly from the same-namespace dashboard BFF.
# Private broker TLS is reachable only from same-namespace orchestration, the
# credential relay (design §4), never from a sandbox. Application
# authentication independently checks the relay identity and the exact
# workspace Pod lineage. This policy makes no claim to restrict provider egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codewire-credential-service
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: credential-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rke2-ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codewire
              app.kubernetes.io/component: dashboard
      ports:
        - protocol: TCP
          port: 8086
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codewire
              app.kubernetes.io/component: orchestration
      ports:
        - protocol: TCP
          port: 9443
