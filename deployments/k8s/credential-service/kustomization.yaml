apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - deployment.yaml
  - service.yaml
  - rbac.yaml
  - certificate.yaml
  - network-policy.yaml
transformers:
  - runtime-namespace.transformer.yaml
labels:
  - pairs:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/part-of: codewire
