apiVersion: builtin
kind: PatchTransformer
metadata:
  name: codewire-credential-service-runtime-namespace
patch: |-
  - op: replace
    path: /metadata/namespace
    value: prod-sandboxes
target:
  group: rbac.authorization.k8s.io
  version: v1
  kind: Role|RoleBinding
  name: codewire-credential-service-runtime
