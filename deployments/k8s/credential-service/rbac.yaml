apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codewire-credential-service-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codewire-credential-service-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codewire-credential-service-tokenreview
subjects:
  - kind: ServiceAccount
    name: codewire-credential-service
    namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-credential-service-tokenrequest
  namespace: prod
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["codewire-credential-service"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-credential-service-tokenrequest
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-credential-service-tokenrequest
subjects:
  - kind: ServiceAccount
    name: codewire-credential-service
    namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-credential-service-runtime
  namespace: prod-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-credential-service-runtime
  namespace: prod-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-credential-service-runtime
subjects:
  - kind: ServiceAccount
    name: codewire-credential-service
    namespace: prod
