apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - deployment.yaml
  - service.yaml
  - rbac.yaml
  - certificate.yaml
  - internal-roots-authz.yaml
  - image-cache-authz.yaml
  - warm-pool-authz.yaml
  - workspace-binding-network-policy.yaml

transformers:
  # These run after the package namespace transformer. Parent overlays repeat
  # the small environment-specific transform after their own namespace pass.
  - sandbox-roles-prod-sandboxes.transformer.yaml
  - admission-cluster-scope.transformer.yaml
  - image-cache-prod-sandboxes.transformer.yaml

labels:
  - pairs:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/part-of: codewire
