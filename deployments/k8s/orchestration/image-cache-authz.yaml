# Runtime-node image cache (Program #2238 A2b). Orchestration reconciles one
# DaemonSet, cw-image-cache, in the shared sandbox namespace. It holds one idle
# container per image orchestration renders (workspace default, gateway and
# daemon-init, DinD) for the current and previous release, on every
# katacontainers.io/kata-runtime node, so a sandbox start after a release
# does not wait for a pull.
#
# The Pods run under the node's default runtime (runc), not Kata: they only
# keep images referenced. They run as the dedicated cw-image-cache identity,
# which has no token and no RBAC, never codewire-sandbox.
#
# The sandbox namespace is used because its Kyverno policy
# (codewire-shared-sandbox-runtime-security) re-applies Pod Security baseline
# to every Pod there and restricts runc only for Pods carrying the Sandbox
# label, which these Pods do not carry. The harbor-registry pull Secret is
# already delivered to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cw-image-cache
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/component: image-cache
automountServiceAccountToken: false
---
# Deny all traffic to and from the idle cache Pods. They serve nothing and
# fetch nothing; the kubelet pulls images outside the Pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cw-image-cache
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/component: image-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cw-image-cache
  policyTypes:
    - Ingress
    - Egress
---
# Create a DaemonSet (admission binds the name), and read or change only
# cw-image-cache. No list, watch or delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-orchestration-image-cache
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["cw-image-cache"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-orchestration-image-cache
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-orchestration-image-cache
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
---
# Every DaemonSet write by the orchestration identity must be the exact idle
# image cache: its name, a runc Pod with the dedicated tokenless identity,
# only emptyDir volumes, no host namespaces, no privilege, only the idle
# commands, and only digest-pinned images from Harbor or Docker Official
# Images. The image expression is mirrored by
# crates/codewire-orchestration/src/sandbox/image_cache.rs is_approved_image.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codewire-orchestration-image-cache
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets"]
  matchConditions:
    - name: orchestration-service-account
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:codewire-orchestration$')
  variables:
    - name: pod
      expression: object.spec.template.spec
    # filter(c, false) keeps both branches the same typed list.
    - name: initContainers
      expression: >-
        has(object.spec.template.spec.initContainers) ?
        object.spec.template.spec.initContainers :
        object.spec.template.spec.containers.filter(c, false)
    - name: containers
      expression: object.spec.template.spec.containers + variables.initContainers
  validations:
    - expression: request.name == 'cw-image-cache'
      message: codewire-orchestration may only manage the DaemonSet named cw-image-cache
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] == 'cw-image-cache' &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'codewire' &&
        has(object.spec.selector.matchLabels) &&
        object.spec.selector.matchLabels == {'app.kubernetes.io/name': 'cw-image-cache'} &&
        !has(object.spec.selector.matchExpressions) &&
        !has(object.spec.template.metadata.annotations)
      message: the image cache must keep its exact labels and selector and carry no Pod annotations
    - expression: >-
        has(variables.pod.serviceAccountName) &&
        variables.pod.serviceAccountName == 'cw-image-cache' &&
        (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == 'cw-image-cache')
      message: the image cache must run as its dedicated cw-image-cache ServiceAccount, never codewire-sandbox or any other identity
    - expression: >-
        has(variables.pod.automountServiceAccountToken) &&
        variables.pod.automountServiceAccountToken == false
      message: the image cache must not mount a ServiceAccount token
    - expression: "!has(variables.pod.runtimeClassName)"
      message: the image cache must run under the node's default runtime, with no runtimeClassName
    - expression: >-
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC)
      message: the image cache must not share host namespaces
    - expression: >-
        has(variables.pod.volumes) &&
        variables.pod.volumes.all(v, has(v.emptyDir)) &&
        !has(variables.pod.resourceClaims)
      message: the image cache may mount only emptyDir volumes, with no hostPath, Secret, projected or device sources
    - expression: >-
        variables.containers.all(c,
        c.image.matches('^(registry[.]example[.]invalid|docker[.]io/library)/[a-z0-9]+([._/-][a-z0-9]+)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[0-9a-f]{64}$'))
      message: image cache images must be digest-pinned references from registry.example.invalid or docker.io/library
    - expression: >-
        variables.containers.all(c,
        has(c.securityContext) &&
        (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
        has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
        c.securityContext.capabilities.drop == ['ALL'] &&
        !has(c.securityContext.capabilities.add) &&
        (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser > 0) &&
        (!has(c.securityContext.runAsNonRoot) || c.securityContext.runAsNonRoot) &&
        !has(c.securityContext.seLinuxOptions) &&
        !has(c.securityContext.windowsOptions) &&
        !has(c.securityContext.appArmorProfile) &&
        (!has(c.securityContext.procMount) || c.securityContext.procMount == 'Default') &&
        (!has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type == 'RuntimeDefault'))
      message: image cache containers must be unprivileged, drop all capabilities, forbid privilege escalation and use a read-only root filesystem
    - expression: >-
        has(variables.pod.securityContext) &&
        has(variables.pod.securityContext.runAsNonRoot) && variables.pod.securityContext.runAsNonRoot &&
        has(variables.pod.securityContext.runAsUser) && variables.pod.securityContext.runAsUser > 0 &&
        has(variables.pod.securityContext.seccompProfile) &&
        variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        !has(variables.pod.securityContext.seLinuxOptions) &&
        !has(variables.pod.securityContext.windowsOptions) &&
        !has(variables.pod.securityContext.appArmorProfile) &&
        !has(variables.pod.securityContext.sysctls)
      message: the image cache Pod must run as a non-root user under the RuntimeDefault seccomp profile
    - expression: >-
        object.spec.template.spec.containers.all(c,
        has(c.command) &&
        c.command == ['/cw-image-cache/ld-musl-x86_64.so.1', '/cw-image-cache/busybox', 'sleep', '2147483647'] &&
        !has(c.args)) &&
        size(variables.initContainers) == 1 &&
        variables.initContainers.all(c,
        has(c.command) &&
        c.command == ['/bin/busybox', 'cp', '/bin/busybox', '/lib/ld-musl-x86_64.so.1', '/cw-image-cache/'] &&
        !has(c.args) && !has(c.restartPolicy))
      message: image cache containers may only idle, and its one init container may only copy the idle binaries
    - expression: >-
        variables.containers.all(c,
        !has(c.env) && !has(c.envFrom) && !has(c.ports) && !has(c.volumeDevices) &&
        !has(c.lifecycle) && !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe))
      message: image cache containers take no environment, ports, devices, hooks or probes
    - expression: >-
        has(variables.pod.nodeSelector) && size(variables.pod.nodeSelector) > 0 &&
        (!has(variables.pod.tolerations) || variables.pod.tolerations.all(t,
        has(t.key) && t.key == 'node.codewire.sh/runtime-candidate' &&
        has(t.effect) && t.effect == 'NoSchedule')) &&
        !has(variables.pod.priorityClassName)
      message: the image cache must select nodes and tolerate only the runtime-candidate NoSchedule taint, without a priority class
    - expression: >-
        !has(variables.pod.imagePullSecrets) ||
        variables.pod.imagePullSecrets.all(s, has(s.name) && s.name == 'harbor-registry')
      message: the image cache may use only the harbor-registry pull Secret
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codewire-orchestration-image-cache
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
spec:
  policyName: codewire-orchestration-image-cache
  validationActions: [Deny]
  # No mutable namespace selector: orchestration can update namespace labels.
  # The exact namespace Role bounds the grant; admission follows the identity.
