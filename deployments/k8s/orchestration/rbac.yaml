# RBAC for the codewire-orchestration ServiceAccount.
#
# The Rust orchestration service took over environment lifecycle work
# (SandboxClaim/SandboxTemplate creation, pod exec, sandbox probing)
# that the Go monolith performed under the codewire-server SA. That SA's
# ClusterRole grants these verbs, but its ClusterRoleBinding only lists
# codewire-server as a subject — so the new orchestration SA had no
# claim/exec permission. With the Temporal worker running primary, the
# create activity (and the exec/file proxy routes) call the kube API as
# this SA, so it needs its own grant.
#
# Least-privilege: only the resources orchestration's create/exec/probe
# paths touch. It owns Sandbox CRDs plus the per-environment gateway companion
# Deployment, ClusterIP Services, and NetworkPolicies. Gateway host-key Secret
# creation/deletion is granted separately in the shared sandbox namespace and
# constrained by admission. It still does NOT get the full codewire-server
# surface such as ingresses, secret reads/writes, or RBAC authoring.
#
# The ClusterRoleBinding's subject namespace is rewritten per overlay by
# kustomize's namespace transformer (prod here, codewire-e2e in the kind
# e2e overlay), so one definition serves every environment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codewire-orchestration
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  # Exact-audience gateway binding and OpenBao Kubernetes Auth validate their
  # presented workload JWTs through the cluster TokenReview API as this
  # ServiceAccount. They need only TokenReview creation; SubjectAccessReview
  # and broader auth-delegator access are not required.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Sandbox namespaces must exist before a claim lands in them.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Pod exec/probe/file-cat/port-forward for the environment proxy routes,
  # plus the lifecycle probe that resolves pod IP/name and readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Live CPU/memory changes use the dedicated resize subresource. Delete on
  # the parent Pod remains a separate, explicitly consented restart path.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # Environment deletion independently proves and removes retained workspace
  # storage after the Sandbox/SandboxClaim controllers have quiesced. Resize
  # may only patch the existing claim's requested capacity.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # Confidential key deletion is gated on read-only proof that Kubernetes and
  # Longhorn have both removed the backing volume.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch"]
  # Disk growth is admitted only when the PVC's StorageClass explicitly
  # advertises allowVolumeExpansion.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  # Gateway binding selects transport-zone capabilities from the scheduled
  # runtime node labels. The warm-pool reconciler (Program #2238 C2) lists
  # runtime nodes for the 25% node cap and to find cordoned ones. Read-only.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # The warm-pool node cap reads the pool RuntimeClass's fixed overhead and
  # node selector. Read-only.
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  # Agent Sandbox CRDs — the create/start/stop/delete lifecycle.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Split gateway/workspace runtime companions. Orchestration creates these
  # alongside the SandboxClaim and removes them on stop/destroy.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codewire-orchestration
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codewire-orchestration
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
---
# TokenRequest is namespaced and limited to this workload's own ServiceAccount.
# The default in-cluster identity may mint only a short-lived replacement for
# itself; application code binds every request to the current Pod name and UID
# and fixes the two accepted audiences.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-orchestration-tokenrequest
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["codewire-orchestration"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-orchestration-tokenrequest
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-orchestration-tokenrequest
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
---
# The runtime image cache orders its image sets by release: the revision of
# the ReplicaSet that controls this Pod (a rollback renumbers the reused
# ReplicaSet). Read-only, in orchestration's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-orchestration-release-revision
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-orchestration-release-revision
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-orchestration-release-revision
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
