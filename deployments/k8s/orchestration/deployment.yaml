apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-orchestration
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
spec:
  # Single replica: the Temporal worker scales horizontally and the
  # loops elect their own leader, so one is sufficient and keeps
  # reasoning simple. Scale out if worker throughput demands it.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: orchestration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: orchestration
    spec:
      imagePullSecrets:
        - name: gitea-registry
      serviceAccountName: codewire-orchestration
      containers:
        - name: orchestration
          # Runs from the shared codewire/services image (one image, many
          # entrypoints); the codewire-orchestration binary is selected by
          # `command`.
          image: git.example.com/codewire/services:latest
          command: ["/codewire-orchestration"]
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 8085
              name: internal-api
          envFrom:
            - configMapRef:
                name: codewire-config
            - secretRef:
                name: codewire-secrets
          env:
            - name: ORCHESTRATION_PORT
              value: "8084"
            - name: ORCHESTRATION_INTERNAL_CONNECT_PORT
              value: "8085"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codewire-db-app
                  key: password
            # Temporal plane: point at the temporal frontend service.
            # Required (the service errors at startup without it).
            - name: TEMPORAL_HOST_PORT
              value: "temporal-frontend.temporal-system.svc.cluster.local:7233"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-orchestration
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
