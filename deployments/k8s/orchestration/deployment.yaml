apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewire-orchestration
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
spec:
  # Single replica: the Temporal worker scales horizontally and the
  # loops elect their own leader, so one is sufficient and keeps
  # reasoning simple. Scale out if worker throughput demands it.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codewire
      app.kubernetes.io/component: orchestration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codewire
        app.kubernetes.io/component: orchestration
    spec:
      imagePullSecrets:
        - name: nexus-registry
        - name: harbor-registry
      serviceAccountName: codewire-orchestration
      containers:
        - name: orchestration
          # Runs from the shared codewire/services image (one image, many
          # entrypoints); the codewire-orchestration binary is selected by
          # `command`.
          image: git.example.com/codewire/services:latest
          command: ["/codewire-orchestration"]
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 8085
              name: internal-api
          envFrom:
            - configMapRef:
                name: codewire-config
            - secretRef:
                name: codewire-secrets
            # Infra owns these non-secret IDs, URLs, and runtime settings.
            # They remain optional so standard deployments do not depend on
            # the disabled confidential-storage stack. The public KBS CA has
            # a separate trust-manager-owned ConfigMap mounted below.
            - configMapRef:
                name: codewire-confidential-storage-openbao
                optional: true
            - configMapRef:
                name: codewire-confidential-storage-kbs
                optional: true
          env:
            - name: ORCHESTRATION_PORT
              value: "8084"
            - name: ORCHESTRATION_INTERNAL_CONNECT_PORT
              value: "8085"
            # Public trust only. The separate infrastructure owner provisions
            # both bundles and the namespace-local gateway Issuer before rollout.
            - name: SANDBOX_CREDENTIAL_BROKER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_CREDENTIAL_GATEWAY_ROOTS_CONFIGMAP
              value: codewire-credential-gateway-roots
            - name: SANDBOX_CREDENTIAL_BROKER_ROOTS_CONFIGMAP
              value: codewire-credential-broker-roots
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codewire-db-app
                  key: password
            # Temporal plane: point at the temporal frontend service.
            # Required (the service errors at startup without it).
            - name: TEMPORAL_HOST_PORT
              value: "temporal-frontend.temporal-system.svc.cluster.local:7233"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            # Platform-only Trustee administration credential. This volume is
            # never projected into tenant Secrets or sandbox Pods.
            - name: confidential-storage-kbs-admin
              mountPath: /var/run/secrets/codewire-confidential-storage
              readOnly: true
            - name: confidential-storage-kbs-ca
              mountPath: /etc/codewire/confidential-storage-kbs
              readOnly: true
      volumes:
        - name: confidential-storage-kbs-admin
          secret:
            secretName: codewire-confidential-storage-kbs-admin
            optional: true
            items:
              - key: CONFIDENTIAL_STORAGE_KBS_ADMIN_TOKEN
                path: kbs-admin-token
        - name: confidential-storage-kbs-ca
          configMap:
            name: codewire-trustee-kbs-ca
            optional: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-orchestration
  namespace: prod
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
