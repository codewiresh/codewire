# IssueGatewayDaemonCredential (Program #2238 B1) authenticates a gateway by
# its full ownership chain: the reviewed gateway Pod's controlling ReplicaSet
# and that ReplicaSet's controlling Deployment cw-gateway-<env>, all in the
# shared sandbox namespace. The cluster role already reads Pods and
# Deployments; this adds ReplicaSet get there and nothing else. It grants no
# list or watch, and orchestration's own-namespace ReplicaSet read
# (codewire-orchestration-release-revision) is unchanged.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-orchestration-gateway-replicaset
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-orchestration-gateway-replicaset
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-orchestration-gateway-replicaset
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
