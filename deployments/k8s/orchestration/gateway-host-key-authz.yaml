# The orchestration service may create and delete only its deterministic
# per-environment gateway host-key Secret family, and only in the configured
# shared sandbox namespace. Reads remain exclusively with the gateway mount
# path and independent operator/test identities.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-orchestration-gateway-host-key
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-orchestration-gateway-host-key
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-orchestration-gateway-host-key
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codewire-orchestration-gateway-host-key
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: orchestration-service-account
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:codewire-orchestration$')
  validations:
    - expression: request.name.startsWith('cw-gateway-host-key-')
      message: codewire-orchestration may only create or delete gateway host-key Secrets
    - expression: request.operation != 'CREATE' || object.type == 'Opaque'
      message: gateway host-key Secrets must use type Opaque
    - expression: >-
        request.operation != 'CREATE' ||
        (has(object.metadata.labels) &&
        object.metadata.labels['app.kubernetes.io/name'] == 'codewire-gateway' &&
        object.metadata.labels['app.kubernetes.io/component'] == 'gateway-host-key' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'codewire' &&
        object.metadata.labels['codewire.sh/type'] == 'gateway-host-key' &&
        request.name == 'cw-gateway-host-key-' + object.metadata.labels['codewire.sh/environment-id'])
      message: gateway host-key Secrets must retain the renderer's management labels
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codewire-orchestration-gateway-host-key
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
spec:
  policyName: codewire-orchestration-gateway-host-key
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        codewire.sh/resource-type: sandbox
