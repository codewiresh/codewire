# Public per-environment bootstrap intent only. No signer administration,
# CertificateRequest, Secret read, or trust-bundle write authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codewire-orchestration-credential-bootstrap
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "create", "update", "delete"]
  # get also reads codewire-orchestration-internal-roots at startup, which
  # must verify orchestration's internal TLS leaf before it serves.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codewire-orchestration-credential-bootstrap
  namespace: prod-sandboxes
  labels:
    app.kubernetes.io/name: codewire
    app.kubernetes.io/component: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codewire-orchestration-credential-bootstrap
subjects:
  - kind: ServiceAccount
    name: codewire-orchestration
    namespace: prod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codewire-orchestration-credential-bootstrap
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["certificates"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: orchestration-service-account
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:codewire-orchestration$')
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: labels
      expression: variables.target.metadata.labels
    - name: environment
      expression: variables.labels['codewire.sh/environment-id']
    - name: prefix
      expression: "request.resource.resource == 'certificates' ? 'cw-credential-gateway-' : 'cw-credential-codex-'"
  validations:
    - expression: >-
        variables.environment.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') &&
        request.name == variables.prefix + variables.environment &&
        variables.target.metadata.namespace == request.namespace &&
        variables.labels['app.kubernetes.io/name'] == 'codewire' &&
        variables.labels['app.kubernetes.io/managed-by'] == 'codewire' &&
        variables.labels['codewire.sh/type'] == 'credential-bootstrap' &&
        size(variables.labels['codewire.sh/org-id']) > 0
      message: credential bootstrap must retain its exact environment-owned coordinates
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(oldObject.metadata.labels) &&
        oldObject.metadata.labels['codewire.sh/environment-id'] == variables.environment &&
        oldObject.metadata.labels['codewire.sh/org-id'] == variables.labels['codewire.sh/org-id'] &&
        oldObject.metadata.labels['app.kubernetes.io/name'] == 'codewire' &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'codewire' &&
        oldObject.metadata.labels['codewire.sh/type'] == 'credential-bootstrap')
      message: credential bootstrap updates cannot adopt or reassign another owner's object
    - expression: >-
        request.operation == 'DELETE' || request.resource.resource != 'configmaps' ||
        (has(object.data) && size(object.data) == 1 && 'config.toml' in object.data &&
        !has(object.binaryData))
      message: only the per-environment public Codex config is writable; public trust bundles are not
    # CEL requires homogeneous literal types; dyn keeps the mixed JSON map
    # well-typed while exact equality still checks every value and entry.
    - expression: >-
        request.operation == 'DELETE' || request.resource.resource != 'certificates' ||
        (object.spec.secretName == request.name &&
        object.spec.issuerRef == {'name':'codewire-credential-gateway','kind':'Issuer','group':'cert-manager.io'} &&
        object.spec.dnsNames == ['cw-gateway-svc-' + variables.environment + '.' + request.namespace + '.svc.cluster.local'] &&
        object.spec.isCA == false &&
        object.spec.usages == ['digital signature', 'server auth'] &&
        object.spec.duration == '24h' && object.spec.renewBefore == '8h' &&
        object.spec.privateKey == {'algorithm':dyn('ECDSA'),'size':dyn(256),'encoding':dyn('PKCS8'),'rotationPolicy':dyn('Always')} &&
        object.spec.revisionHistoryLimit == 1)
      message: only the exact environment gateway leaf under the dedicated Issuer may be requested
    - expression: >-
        request.operation == 'DELETE' || request.resource.resource != 'certificates' ||
        (!has(object.spec.subject) && !has(object.spec.literalSubject) && !has(object.spec.commonName) &&
        !has(object.spec.ipAddresses) && !has(object.spec.uris) && !has(object.spec.emailAddresses) &&
        !has(object.spec.otherNames) && !has(object.spec.nameConstraints) &&
        !has(object.spec.keystores) && !has(object.spec.additionalOutputFormats) &&
        !has(object.spec.renewBeforePercentage) &&
        object.spec.secretTemplate.labels == variables.labels &&
        !has(object.spec.secretTemplate.annotations))
      message: credential leaves cannot request alternate subjects, identities, outputs or Secret annotations
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codewire-orchestration-credential-bootstrap
spec:
  policyName: codewire-orchestration-credential-bootstrap
  validationActions: [Deny]
  # No mutable namespace selector: orchestration can update namespace labels.
  # Its exact namespace Roles bound the grant; admission follows the identity.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codewire-orchestration-credential-leaf-cleanup
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: orchestration-service-account
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:codewire-orchestration$')
    - name: credential-leaf-family
      expression: request.name.startsWith('cw-credential-gateway-')
  validations:
    - expression: request.operation == 'DELETE'
      message: only cert-manager may write credential leaf Secrets
    - expression: >-
        request.operation != 'DELETE' ||
        (oldObject.type == 'kubernetes.io/tls' &&
        oldObject.metadata.namespace == request.namespace &&
        has(oldObject.metadata.labels) &&
        oldObject.metadata.labels['codewire.sh/environment-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') &&
        request.name == 'cw-credential-gateway-' + oldObject.metadata.labels['codewire.sh/environment-id'] &&
        oldObject.metadata.labels['app.kubernetes.io/name'] == 'codewire' &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'codewire' &&
        oldObject.metadata.labels['codewire.sh/type'] == 'credential-bootstrap' &&
        size(oldObject.metadata.labels['codewire.sh/org-id']) > 0 &&
        has(oldObject.metadata.ownerReferences) &&
        oldObject.metadata.ownerReferences.exists(owner,
          owner.apiVersion == 'cert-manager.io/v1' && owner.kind == 'Certificate' &&
          owner.name == request.name && size(owner.uid) > 0 && has(owner.controller) && owner.controller))
      message: deleting a credential leaf requires its existing exact managed Certificate ownership
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codewire-orchestration-credential-leaf-cleanup
spec:
  policyName: codewire-orchestration-credential-leaf-cleanup
  validationActions: [Deny]
