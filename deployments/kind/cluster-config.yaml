kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 16443
# A device the kubelet adds to a container belongs to that container's own
# user, so the `standard` profile's non-root container can open /dev/kvm,
# which is root:kvm 0660 inside the node (#5602).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri"]
      device_ownership_from_security_context = true
# The `standard` profile's Pod mounts the workspace image's disk as an image
# volume (#5602). Kind's Kubernetes 1.34 has the gate off, and the API server
# then drops the volume and its mount without an error.
featureGates:
  ImageVolume: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx HTTP (canonical local entrypoint)
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # codewire-derp HTTPS (NodePort 30443 → host 8443)
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      # STUN edge (host-network 3478 → host 3478)
      - containerPort: 3478
        hostPort: 3478
        protocol: UDP
    extraMounts:
      # CodeWire repo root for workspace-aware Air hot reload
      - hostPath: .
        containerPath: /src/codewire
      # Sibling workspace repo required by codewire/go.work
      - hostPath: ../agent-sandbox
        containerPath: /src/agent-sandbox
