# The values that render what deployments/k8s/base, dashboard, coordinator,
# idp and billing declare together, the source tree Production's overlay builds
# on. They hold the site hosts, images, pull secrets and edge the chart's
# defaults leave out. Only scripts/ci/tests/test-deploy-helm-chart.py reads
# this file; it goes when Production's own values are checked against
# Production's overlay (#2908).
config:
  DERP_HOST: derp.codewire.sh
  STUN_HOST: stun.codewire.sh
  PREVIEW_BASE_DOMAIN: cwpreview.sh
  CODEWIRE_SES_FROM: Codewire <hello@codewire.sh>

images:
  dashboard:
    repository: git.example.com/codewire/dashboard
    tag: latest
  services:
    repository: git.example.com/codewire/services
    tag: latest

imagePullSecrets:
  - name: harbor-registry

edge:
  peers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-ingress-nginx

dashboard:
  origins:
    public: https://codewire.sh
    browserApi: https://codewire.sh
  imagePullSecrets:
    - name: harbor-registry
