# Where the CLI crates (codewire-cli, codewire-cli-bin) behave differently on
# Linux and macOS, and why (#3797). This file is the home of those reasons.
# `scripts/checks/repo_checks.py os-splits` fails when a file has a
# single-OS `target_os` split that is not listed here with its exact count,
# or when a CLI crate gates a workspace crate to one OS although that crate has
# no OS-specific code and no recorded reason. A split shared by Linux and
# macOS together (`any(target_os = "linux", target_os = "macos")`) is the
# local VM boundary against other OSes and is not counted.
#
# To change a split: fix it if it is an accident (one product, shared code),
# or update its count here, and its group's reason if that changed.

[groups.member]
reason = """Delegated member control (cw control, cw member, --member) must find and \
stop orphaned descendants. Linux does it with pidfds and a subreaper; macOS has no public \
API for it (docs/dev/MACOS-CLI.md), so it is refused there."""

[groups.hosted]
reason = """Roles that run only inside a hosted Sandbox, which is Linux: the platform cw \
runtime, platform agent control and peer, the environment launcher, the hosted daemon and \
access, and snapshot clearing. A Mac never runs them."""

[groups.credentials]
reason = """Local credential confinement and stores: Landlock, seccomp and Secret Service \
on Linux; Seatbelt and the Keychain on macOS. Storage prompts name the actual backend \
and call the host a Mac on macOS. One product, two kernel mechanisms."""

[groups.terminal-tests]
reason = """Protected-input PTY journeys verify terminal restoration on both OSes. \
Darwin's stock stty raw/-g round-trip changes the transient PENDIN redraw bit, so only \
macOS masks that bit. ECHO, ICANON and every other terminal attribute remain exact."""

[groups.vm-backend]
reason = """The local VM backend and host facts: Cloud Hypervisor and /proc on Linux; \
Virtualization.framework and sysctl on macOS."""

[groups.snapshots]
reason = """Local disk snapshots and VM checkpoints are not yet implemented on macOS \
(#3803): a missing implementation, refused with that reason."""

[groups.executable]
reason = """The running executable: Linux opens its image through /proc/self/exe even \
after its path is replaced; macOS has no such handle."""

[groups.browser]
reason = "Opening a browser: open on macOS, xdg-open on Linux."

[groups.mesh]
reason = """The local Mesh owner's launch: only Linux has PR_SET_NO_NEW_PRIVS. The \
owner model itself is shared (owner.rs)."""

[groups.dispatch]
reason = """Role dispatch and module lists for the groups above: each line routes to, \
or declares, code of one of them."""

[groups.linux-tests]
reason = """Tests of Linux-only behaviour (the groups above) or that use a Linux-only \
proof such as a subreaper, pidfds or /proc. Their macOS counterparts are the macOS tests \
and journeys listed in docs/dev/MACOS-CLI.md."""

