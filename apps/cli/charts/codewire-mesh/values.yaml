mesh:
  baseURL: ""  # Required: e.g. https://mesh.example.com
  derpURL: ""  # Set when the packet relay is separate from the Mesh API.
  listenAddr: "0.0.0.0:8080"
  # Cluster-internal lookup a Codewire DERP relay uses to serve only keys of
  # live Mesh sessions (DERP_VERIFY_CLIENT_URLS). Never route it through an
  # ingress. 0 turns it off.
  derpVerifyPort: 8097

database:
  enabled: false
  secretName: "codewire-mesh-db-app"
  uriKey: "uri"

# Hosted Mesh requires this cluster-local primary-control-plane authorization
# hop whenever it owns a database. Standalone `cw mesh up` supplies its own
# explicit local identity and does not use these chart values.
meshAuthorization:
  url: ""
  # https only (orchestration's internal listener is TLS-only), verified with
  # the public roots in this ConfigMap (key ca.crt); required with url.
  tlsRootsConfigMap: ""
  hmacSecretRef:
    name: ""
    key: "SESSION_SECRET"
    optional: false

image:
  repository: ghcr.io/codewiresh/codewire
  tag: ""  # Defaults to appVersion
  digest: ""  # If set, renders repository@digest and takes precedence over tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mesh.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

monitoring:
  enabled: false
