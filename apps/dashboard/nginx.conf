server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /install.sh {
        return 307 https://raw.githubusercontent.com/codewiresh/codewire/main/install.sh;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        return 200 '{"webcredentials":{"apps":["PXQZM3GLP5.sh.codewire.ios"]}}';
    }

    location ^~ /docs {
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
