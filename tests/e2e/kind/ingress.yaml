  name: codewire-connect-tls-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: codewire-kind-ingress-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /codewire\.admin\.v1\.AdminService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /codewire\.admin\.v1\.BillingCatalogService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /codewire\.v1\.MeshNetworkService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshNodeService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshInviteService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshGroupService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshKeyValueService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.
            pathType: ImplementationSpecific
