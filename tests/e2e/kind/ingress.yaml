# E2E ingress mirrors the shipped routing shape: the Rust dashboard owns the
# browser route tree, preview hosts and the broad /api fallback go to
# codewire-orchestration, and the service-specific ingresses below retain their
# permanent overrides.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-preview-e2e
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "*.codewire-dev.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
    - http:
        paths:
          - path: /api/v1/github/oauth/callback
            pathType: Exact
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewire-dashboard
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-billing-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /codewire\.console\.v1\.BillingService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /api/webhooks/stripe
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          # D8 probe routing proof (docs/plans/connect-rpc/03 WI-4): both
          # binaries mount codewire.testing.v1.PingService; routing
          # PublicPing to billing proves a billing-owned Connect regex
          # beats the /codewire\. orchestration fallback (D5 ordering).
          - path: /codewire\.testing\.v1\.PingService/PublicPing$
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http

---
# Native generated coordinator bidi stream. TLS+ALPN proves HTTP/2 on the
# client leg; GRPC retains HTTP/2 from ingress-nginx to the coordinator.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-coordinator-connect-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: codewire-kind-ingress-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /codewire\.internal\.v1\.CoordinatorService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-coordinator
                port:
                  name: http
---
# Native generated Mesh coordinator bidi stream.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-mesh-coordinator-grpc-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: codewire-kind-ingress-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /codewire\.internal\.v1\.MeshCoordinatorService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
---
# Native environment-session and owner-credential-delegation bidi streams.
# TLS+ALPN proves HTTP/2 on the client leg; GRPC retains it to each exact backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-environment-session-grpc-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: codewire-kind-ingress-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /codewire\.v1\.EnvironmentSessionService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration-grpc
                port:
                  name: grpc
          - path: /codewire\.v1\.CredentialDelegationService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-credential-service
                port:
                  name: http
---
# Connect-RPC path routing (docs/plans/connect-rpc/03, D5) — the e2e twin
# of base's codewire-connect Ingress. The D8 probe's billing routing proof
# lives in codewire-billing-e2e above (production topology: billing-owned
# Connect rules ride the billing regex Ingress); every other Connect path
# reaches orchestration here. Request and response buffering are off and the
# ingress body-size limit is disabled for typed streaming RPCs —
# scripts/ci/verify/kind-e2e.sh's stream probes assert the live behavior.
# Drift-checked by scripts/checks/repo_checks.py connect-edge-routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewire-connect-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /codewire\.admin\.v1\.AdminService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
          - path: /codewire\.admin\.v1\.BillingCatalogService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-billing
                port:
                  name: http
          - path: /codewire\.v1\.MeshNetworkService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshNodeService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshInviteService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshGroupService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.MeshKeyValueService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-mesh
                port:
                  name: http
          - path: /codewire\.v1\.CredentialMutationService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-credential-service
                port:
                  name: http
          - path: /codewire\.v1\.GithubRepositoryService/
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-credential-service
                port:
                  name: http
          - path: /codewire\.
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-orchestration
                port:
                  name: http
---
# Full Kind OIDC/browser identity plane. These are permanent raw IdP routes;
# generated product calls continue through the Connect ingresses above.
apiVersion: networking.k8s.io/v1
