  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/oauth
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/two-factor
            pathType: Prefix
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /api/auth/verify-email
            pathType: Prefix
            backend:
