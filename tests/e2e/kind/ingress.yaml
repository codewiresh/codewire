                port:
                  name: http
          - path: /.well-known/openid-configuration
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/oauth-authorization-server
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
          - path: /.well-known/jwks.json
            pathType: ImplementationSpecific
            backend:
              service:
                name: codewire-idp
                port:
                  name: http
---
# The hostless ingress above keeps the existing direct HTTP probes. This
