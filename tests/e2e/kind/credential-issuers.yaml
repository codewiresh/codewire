# Disposable Kind only. These independent synthetic roots are generated by
# the real controller; no owner key, Trustee root or provider account is used.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: codewire-kind-credential-bootstrap
  namespace: codewire-e2e
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-kind-credential-broker-root
  namespace: codewire-e2e
spec:
  secretName: codewire-kind-credential-broker-root
  commonName: codewire-kind-credential-broker-root
  isCA: true
  duration: 96h
  renewBefore: 24h
  usages: [cert sign, crl sign]
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: codewire-kind-credential-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: codewire-credential-broker
  namespace: codewire-e2e
spec:
  ca:
    secretName: codewire-kind-credential-broker-root
---
# Orchestration's internal TLS listener: a third independent synthetic root.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-kind-orchestration-internal-root
  namespace: codewire-e2e
spec:
  secretName: codewire-kind-orchestration-internal-root
  commonName: codewire-kind-orchestration-internal-root
  isCA: true
  duration: 96h
  renewBefore: 24h
  usages: [cert sign, crl sign]
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: codewire-kind-credential-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: codewire-orchestration-internal
  namespace: codewire-e2e
spec:
  ca:
    secretName: codewire-kind-orchestration-internal-root
---
# The coordinator's in-cluster HTTPS edge for workspace daemons: a fourth
# independent synthetic root. ingress-nginx serves this leaf under its own
# Service name; daemons verify it with the root's public certificate alone,
# published as codewire-coordinator-extra-roots in the sandbox namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-kind-coordinator-root
  namespace: codewire-e2e
spec:
  secretName: codewire-kind-coordinator-root
  commonName: codewire-kind-coordinator-root
  isCA: true
  duration: 96h
  renewBefore: 24h
  usages: [cert sign, crl sign]
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: codewire-kind-credential-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: codewire-kind-coordinator
  namespace: codewire-e2e
spec:
  ca:
    secretName: codewire-kind-coordinator-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-kind-coordinator-tls
  namespace: codewire-e2e
spec:
  secretName: codewire-kind-coordinator-tls
  commonName: ingress-nginx-controller.ingress-nginx.svc.cluster.local
  dnsNames:
    - ingress-nginx-controller.ingress-nginx.svc.cluster.local
  duration: 96h
  renewBefore: 24h
  usages: [server auth, digital signature]
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: codewire-kind-coordinator
    kind: Issuer
    group: cert-manager.io
---
# Postgres serving certificate. The fake credential-service keeps its
# sslmode=disable URL; the real one (`kind-e2e.sh credentials real`) connects
# with sslmode=verify-full against this root. Postgres reads the pair only at
# start, so both outlive a retained cluster's working days.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-kind-postgres-root
  namespace: codewire-e2e
spec:
  secretName: codewire-kind-postgres-root
  commonName: codewire-kind-postgres-root
  isCA: true
  duration: 720h
  renewBefore: 168h
  usages: [cert sign, crl sign]
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: codewire-kind-credential-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: codewire-kind-postgres
  namespace: codewire-e2e
spec:
  ca:
    secretName: codewire-kind-postgres-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codewire-kind-postgres-tls
  namespace: codewire-e2e
spec:
  secretName: codewire-kind-postgres-tls
  commonName: postgres.codewire-e2e.svc.cluster.local
  dnsNames:
    - postgres
    - postgres.codewire-e2e
    - postgres.codewire-e2e.svc
    - postgres.codewire-e2e.svc.cluster.local
  duration: 720h
  renewBefore: 168h
  usages: [server auth, digital signature]
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: codewire-kind-postgres
    kind: Issuer
    group: cert-manager.io
