# kind e2e overlay: deploys the REAL billing, orchestration, and coordinator
# manifests into the codewire-e2e namespace with only the minimum patched —
# side-loaded image, replica count, and disposable-cluster service wiring.
# The config/secret objects the deployments reference are provided by
# support.yaml rather than patched out, so what runs here is what ships.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codewire-e2e

resources:
  - namespace.yaml
  - ../../../deployments/k8s/dashboard
  - ../../../deployments/k8s/billing
  - ../../../deployments/k8s/orchestration
  - ../../../deployments/k8s/credential-service
  - ../../../deployments/k8s/coordinator
  - ../../../deployments/k8s/idp
  - mesh.yaml
  - postgres.yaml
  - db-migrate-job.yaml
  - temporal.yaml
  - support.yaml
  - idp-signing-keks.yaml
  - ingress.yaml
  - orchestration-nodeport.yaml
  - coordinator-nodeport.yaml

patches:
  # The registries the image cache may hold images from: the public
  # workspace mirror and Docker Official Images (docs/CONFIGURATION.md).
  - target:
      kind: ConfigMap
      name: codewire-image-registries
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: codewire-image-registries
      data:
        CODEWIRE_APPROVED_IMAGE_REGISTRIES: ghcr.io/codewiresh/,docker.io/library/
  - target:
      kind: Deployment
      name: codewire-credential-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codewire-credential-service
      spec:
        # The managed fixture provisions restricted SQL, synthetic authority,
        # and both trust domains before admitting this process.
        replicas: 0
        template:
          spec:
            containers:
              - name: credential-service
                image: codewire-services:e2e
                imagePullPolicy: Never
  - target:
      kind: Deployment
      name: codewire-dashboard
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codewire-dashboard
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: dashboard
                image: codewire-dashboard:e2e
                imagePullPolicy: Never
                env:
                  - name: CODEWIRE_PUBLIC_ORIGIN
                    value: http://127.0.0.1:8090
                  - name: CODEWIRE_API_ORIGIN
                    value: http://codewire-orchestration:8084
                  - name: CODEWIRE_CREDENTIAL_ORIGIN
                    value: http://codewire-credential-service:8086
                  - name: CODEWIRE_IDENTITY_ORIGIN
                    value: http://codewire-idp:8091
                  - name: CODEWIRE_BILLING_ORIGIN
                    value: http://codewire-billing:8081
                  - name: CODEWIRE_BROWSER_API_ORIGIN
                    value: http://127.0.0.1:8090
  - target:
      kind: Deployment
      name: codewire-orchestration
    # Strategic-merge (keyed by container/env name) so it's robust to env
    # ordering — the prior JSON6902 index patches broke when the NATS env
    # vars were removed (D3, #150). NATS is gone; the only overrides the e2e
    # needs are the in-cluster temporal host and the sandbox wiring.
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codewire-orchestration
      spec:
        template:
          spec:
            containers:
              - name: orchestration
                image: codewire-services:e2e
                imagePullPolicy: Never
                env:
                  # Override the base temporal-system host with the in-cluster
                  # e2e temporal service (temporal.yaml).
                  - name: TEMPORAL_HOST_PORT
                    value: "temporal:7233"
                  # Enables the HTTP create/stop/start triggers (SignalWithStart);
                  # the e2e's codewire-config doesn't carry it.
                  - name: ENVIRONMENT_ORCHESTRATOR
                    value: temporal-primary
                  # Points the create activity's claims at codewire-e2e, where the
                  # agent-sandbox controller reconciles.
                  - name: SANDBOX_NAMESPACE
                    value: dev-sandboxes
                  # kind e2e validates orchestration/reconciler behavior on a
                  # single local cluster; it does not prove sandbox isolation.
                  # Keep the runtime path explicitly diagnostic so production
                  # manifests can reject managed runc by default.
                  - name: SANDBOX_RUNTIME_PROFILE
                    value: runc
                  - name: SANDBOX_ALLOW_DIAGNOSTIC_RUNTIME
                    value: "true"
                  # Workspace Pods run their daemon from the kind-loaded support
                  # image (the compiled-in Harbor default is unpullable in kind
                  # → ImagePullBackOff → env never reaches running).
                  - name: SANDBOX_DAEMON_IMAGE
                    value: codewire-daemon:e2e
                  # Mount the Connect conformance probe (
                  # connect-rpc/03 D8) — kind/e2e manifests only, never
                  # base or production.
                  - name: CONNECT_TESTING_SURFACE
                    value: "1"

  - target:
      kind: Deployment
      name: codewire-billing
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: codewire-services:e2e
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: codewire-billing
    # Override the base temporal-system host (codewire-config) with the
    # in-cluster e2e temporal service so the #38 org-teardown worker
    # connects here, same as the orchestration patch above. Strategic-merge
    # (keyed by container/env name) so it's robust to env ordering.
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codewire-billing
      spec:
        template:
          spec:
            containers:
              - name: billing
                env:
                  - name: TEMPORAL_HOST_PORT
                    value: "temporal:7233"
                  # Mount the Connect conformance probe (
                  # connect-rpc/03 D8) — kind/e2e manifests only, never
                  # base or production.
                  - name: CONNECT_TESTING_SURFACE
                    value: "1"
  - target:
      kind: Deployment
      name: codewire-coordinator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codewire-coordinator
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: coordinator
                image: codewire-services:e2e
                imagePullPolicy: Never
  - target:
      kind: Deployment
      name: codewire-idp
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codewire-idp
      spec:
        # The shared Kind harness starts application services only after the
        # disposable SQLx ledger is complete. Keep IdP in that same lifecycle
        # so OIDC provisioning cannot race the schema baseline.
        replicas: 0
        template:
          spec:
            containers:
              - name: idp
                image: codewire-services:e2e
                imagePullPolicy: Never
  # Warm-pool members on Kind run a diagnostic runtime: runc, or the node
  # default ('') when SANDBOX_RUNTIME_PROFILE is none. They mount the
  # side-loaded daemon image (SANDBOX_DAEMON_IMAGE above), which has no
  # registry digest. The test ops pin each variable's position in the base
  # policy.
  - target:
      group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
      name: codewire-orchestration-warm-pool-template
    patch: |-
      - op: test
        path: /spec/variables/0/name
        value: runtimeClasses
      - op: replace
        path: /spec/variables/0/expression
        value: "['commodity', 'runc', '']"
      - op: test
        path: /spec/variables/1/name
        value: localImages
      - op: replace
        path: /spec/variables/1/expression
        value: "['codewire-daemon:e2e']"
      # SANDBOX_COORDINATOR_EXTRA_ROOTS mounts the coordinator's extra roots.
      - op: test
        path: /spec/variables/2/name
        value: rootsConfigMaps
      - op: replace
        path: /spec/variables/2/expression
        value: "['codewire-orchestration-internal-roots', 'codewire-coordinator-extra-roots']"

# Namespace transforms do not rewrite DNS SANs inside custom resources.
replacements:
  - source:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: codewire-credential-broker
      fieldPath: metadata.namespace
    targets:
      - select:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: codewire-credential-broker
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
  - source:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: codewire-orchestration-internal
      fieldPath: metadata.namespace
    targets:
      - select:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: codewire-orchestration-internal
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 1

transformers:
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-workspace-binding-peers
    patch: |-
      - op: replace
        path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: dev-sandboxes
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-orchestration-workspace-binding
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-credential-service-peers
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ingress-nginx
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: codewire-credential-service
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-sandbox-dev-sandboxes
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-sandboxes
    target:
      version: v1
      kind: ServiceAccount
      name: codewire-sandbox
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-sandbox-roles-dev-sandboxes
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-sandboxes
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role|RoleBinding
      name: codewire-(orchestration-(internal-roots|image-cache)|credential-service-runtime)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-sandbox-roles-codewire-e2e-subject
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: codewire-e2e
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: codewire-(orchestration-(internal-roots|image-cache)|credential-service-runtime)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-orchestration-sandbox-roles-admission-cluster-scope
    patch: |-
      - op: remove
        path: /metadata/namespace
    target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingAdmissionPolicy|ValidatingAdmissionPolicyBinding
      name: codewire-orchestration-(image-cache|warm-pool|warm-pool-template|warm-pool-member)
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: codewire-image-cache-dev-sandboxes
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-sandboxes
    target:
      kind: ServiceAccount|NetworkPolicy
      name: cw-image-cache
