apiVersion: batch/v1
kind: Job
metadata:
  name: codewire-db-migrate
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: codewire-services:e2e
          imagePullPolicy: Never
          command: ["/codewire-db-migrate"]
          env:
            - name: DATABASE_URL
              value: postgres://codewire:codewire@postgres:5432/codewire?sslmode=disable
