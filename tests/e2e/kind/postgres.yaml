# Throwaway Postgres for the kind e2e cluster. Single replica, no
# persistence — the schema and fixture are loaded fresh every run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # Readable Kustomize input. The Kind gate resolves and side-loads
          # its reviewed linux/amd64 digest before cluster creation.
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: codewire
            - name: POSTGRES_PASSWORD
              value: codewire
            - name: POSTGRES_DB
              value: codewire
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "codewire", "-d", "codewire"]
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
