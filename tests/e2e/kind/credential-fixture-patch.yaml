# Strategic Deployment patch selected only after the managed Kind harness
# proves this image is services-ci/non-promotable. Release images omit the
# executable and build the production binary without the Kind-only test-KEK
# switch (`kind-e2e.sh credentials real` uses that switch instead).
spec:
  template:
    spec:
      containers:
        - name: credential-service
          command: [/codewire-kind-fixtures/credential-service]
          args:
            - --exact
            - runtime::kind::serve_kind_credential_fixture
            - --ignored
            - --nocapture
            - --test-threads=1
          env:
            - name: CODEWIRE_KIND_CREDENTIAL_FIXTURE
              value: "1"
            - name: CREDENTIAL_PUBLIC_ORIGIN
              value: http://127.0.0.1:8090
            # The suites assert the fixture's exact provider events, and a
            # retained cluster can hold credentials enrolled in real mode.
            # Keep-alive refreshes stay off unless a test opts in.
            - name: CREDENTIAL_OAUTH_KEEPALIVE_ENABLED
              value: "false"
