# Strategic Deployment patch selected only after the managed Kind harness
# proves this image is services-ci/non-promotable. Release images omit the
# executable, and the production binary has no synthetic switch.
spec:
  template:
    spec:
      containers:
        - name: credential-service
          command: [/codewire-kind-fixtures/credential-service]
          args:
            - --exact
            - runtime::kind::serve_kind_credential_fixture
            - --ignored
            - --nocapture
            - --test-threads=1
          env:
            - name: CODEWIRE_KIND_CREDENTIAL_FIXTURE
              value: "1"
