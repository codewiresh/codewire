# Referenced by imagePullSecrets; never consulted because the image is
# side-loaded into kind with imagePullPolicy: Never.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
---
# The agent-sandbox controller renders every workspace pod with
# serviceAccountName=codewire-sandbox (orchestration's SANDBOX_SERVICE_ACCOUNT,
# crates/codewire-orchestration/src/sandbox/template.rs). In prod/dev that SA
# is provisioned per sandbox namespace; kind never created it, so pod creation
# was rejected ("serviceaccount codewire-sandbox not found") and the env hung
# in `creating`. Keep token automount disabled; the workspace must not inherit
# Kubernetes API credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codewire-sandbox
automountServiceAccountToken: false
---
# kind e2e exercises environment lifecycle, not the real sandbox isolation
# runtime. Product configs can render explicit RuntimeClasses even when the
# handler is kind's default runc, so provide the aliases that local tests need.
# Cluster-scoped — kustomize's namespace transformer leaves these alone.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: runc
handler: runc
---
# The workspace pod's PVC requests storageClassName=example-volumes (Hetzner
# Cloud block storage in prod). kind has no such StorageClass, so the PVC
# stayed unbound and the pod hung in Pending (unschedulable) — the env never
# left `creating`. Alias example-volumes to kind's built-in local-path
# provisioner; WaitForFirstConsumer lets the pod schedule, then the volume
# binds on that node. Cluster-scoped — kustomize won't namespace it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: example-volumes
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
