# Config/secret objects the real billing Deployment (envFrom/secretKeyRef
# in deployments/k8s/billing/deployment.yaml) expects to exist. Supplying
# them — instead of patching the references away — keeps the e2e
# deployment as close to the shipped manifest as possible.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codewire-config
data:
  DATABASE_URL: postgres://codewire:codewire@postgres:5432/codewire?sslmode=disable
  # This disposable overlay runs the non-promotable services-ci image, which
  # is the only image compiled with the synthetic tenant-secret KEK provider.
  # Keep the runtime opt-in here as well as the developer Kind overlays: the
  # full repository harness renders tests/e2e/kind directly.
  CODEWIRE_KIND_TENANT_SECRET_TEST_PROVIDER: "true"
# Browser proofs use the production-equivalent Rust dashboard through Kind.
  FRONTEND_URL: http://127.0.0.1:8090
  # Kind ingress maps HTTP to host port 8090. The IdP advertises this public
  # issuer while the browser uses the Rust dashboard through local ingress.
  PUBLIC_OIDC_ISSUER_URL: http://127.0.0.1:8090
  PREVIEW_BASE_DOMAIN: codewire-dev.local
  SANDBOX_DIND_IMAGE: docker.io/library/docker:29.7.1-dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
  # The image cache's tool image is a hardcoded public DinD reference, so the
  # cache cannot satisfy this gate's sealed local-alias provenance yet; keep
  # it out of the disposable overlay until the tool image follows the
  # configured runtime image.
  SANDBOX_IMAGE_CACHE: disabled
---
# The non-promotable credential fixture owns this public synthetic App slug.
# No App client material is present in the browser or in this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codewire-dashboard-public-config
data:
  TURNSTILE_SITE_KEY: ""
  GITHUB_APP_SLUG: codewire-synthetic
  GITHUB_APP_CLIENT_ID: Iv1.kindsynthetic
---
apiVersion: v1
kind: Secret
metadata:
  name: codewire-secrets
stringData:
  SESSION_SECRET: kind-e2e-not-a-real-secret
  STRIPE_SECRET_KEY: sk_test_buildtest_dummy
  STRIPE_WEBHOOK_SECRET: whsec_test_secret
---
# Referenced by the deployment's DB_PASSWORD secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: codewire-db-app
stringData:
  password: codewire
---
# Referenced unconditionally by the real coordinator Deployment. NATS_URL is
# deliberately unset in this single-replica edge proof, so the value is never
# used to establish a connection.
apiVersion: v1
kind: Secret
metadata:
  name: nats-auth-token
stringData:
  token: kind-e2e-unused-nats-token
---
