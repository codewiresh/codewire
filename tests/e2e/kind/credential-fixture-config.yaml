# Consumed only by the cfg(test) fixture in the non-promotable services-ci
# image. The deployment's production configuration shape is retained, but no
# OpenBao endpoint exists here and synthetic PostgreSQL does not use TLS.
apiVersion: v1
kind: Secret
metadata:
  name: codewire-credential-database
  namespace: codewire-e2e
type: Opaque
stringData:
  url: postgres://codewire_credential_broker:kind-credential-broker-synthetic-only@postgres.codewire-e2e.svc.cluster.local:5432/codewire?sslmode=disable
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codewire-credential-service-config
  namespace: codewire-e2e
data:
  CREDENTIAL_BAO_ADDR: https://kind-fixture-does-not-use-openbao.invalid
  CREDENTIAL_BAO_AUTH_MOUNT: unused-kind-fixture
  CREDENTIAL_BAO_ROLE: unused-kind-fixture
  CREDENTIAL_BAO_TRANSIT_MOUNT: unused-kind-fixture
  CREDENTIAL_APPLICATION_BAO_ROLE: unused-kind-application-fixture
  CREDENTIAL_APPLICATION_BAO_TRANSIT_MOUNT: unused-kind-application-fixture
  CREDENTIAL_BAO_EXPECTED_CLUSTER_ID: unused-kind-fixture
  CREDENTIAL_BAO_AUDIENCE: unused-kind-fixture
  OPENBAO_KUBERNETES_API_AUDIENCE: unused-kind-fixture
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codewire-credential-database-roots
  namespace: codewire-e2e
data:
  # Not a valid root: accidental production use must not acquire a fallback.
  ca.pem: "# Synthetic Kind PostgreSQL has no TLS; this fixture proves no database TLS claim.\n"
