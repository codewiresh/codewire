[workspace]
resolver = "2"
# The root workspace is for server/runtime/shared crates. Desktop app crates
# are excluded so non-desktop Cargo commands never resolve GPUI/font-kit.
members = [
    "crates/codewire-access",
    "crates/codewire-admin-proto",
    "crates/codewire-billing",
    "crates/codewire-client",
    "crates/codewire-dashboard-web",
    "crates/codewire-coordinator",
    "crates/codewire-daemon",
    "crates/codewire-daemon-bridge",
    "crates/codewire-derp",
    "crates/codewire-egress-broker",
    "crates/codewire-egress-policy",
    "crates/codewire-email",
    "crates/codewire-daemon-proto",
    "crates/codewire-idp",
    "crates/codewire-cli",
    "crates/codewire-cli-bin",
    "crates/codewire-credential-broker",
    "crates/codewire-credential-bridge",
    "crates/codewire-credential-service",
    "crates/codewire-cw-release",
    "crates/codewire-local-credentials",
    "crates/codewire-platform-credentials",
    "crates/codewire-local-vmm",
    "crates/codewire-project",
    "crates/codewire-project-proto",
    "crates/codewire-protected-store",
    "crates/codewire-mesh",
    "crates/codewire-netstack",
    "crates/codewire-oidc",
    "crates/codewire-orchestration",
    "crates/codewire-proto",
    "crates/codewire-server-core",
    "crates/codewire-tailnet",
    "crates/codewire-tls",
    "crates/codewire-types",
    "crates/codewire-udp-relay",
    "crates/codewire-vmm-guest-probe",
    "crates/codewire-workload-secrets",
    "crates/codewire-workspace-access",
    "crates/codewire-workspace-image",
]
exclude = [
    "crates/codewire-desktop",
    "crates/codewire-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "AGPL-3.0-only"
authors = ["Sonica"]

[workspace.dependencies]
# Internal crates
codewire-access = { path = "crates/codewire-access" }
codewire-client = { path = "crates/codewire-client" }
codewire-types = { path = "crates/codewire-types" }
codewire-workspace-image = { path = "crates/codewire-workspace-image" }
codewire-server-core = { path = "crates/codewire-server-core" }
codewire-oidc = { path = "crates/codewire-oidc" }
codewire-daemon-proto = { path = "crates/codewire-daemon-proto" }
# default-features = false so server crates can consume the generated
# message/service types without the Connect HTTP client stack; test/client
# consumers opt back in with `features = ["client"]`.
codewire-proto = { path = "crates/codewire-proto", default-features = false }
# Global-administrator contracts have their own descriptor and generated-code
# crate. Customer clients must not pull billing/admin surfaces into their
# dependency graph.
codewire-admin-proto = { path = "crates/codewire-admin-proto", default-features = false }
codewire-daemon = { path = "crates/codewire-daemon" }
codewire-daemon-bridge = { path = "crates/codewire-daemon-bridge" }
codewire-derp = { path = "crates/codewire-derp" }
codewire-egress-broker = { path = "crates/codewire-egress-broker" }
codewire-egress-policy = { path = "crates/codewire-egress-policy" }
codewire-email = { path = "crates/codewire-email" }
codewire-netstack = { path = "crates/codewire-netstack" }
codewire-tailnet = { path = "crates/codewire-tailnet" }
codewire-workspace-access = { path = "crates/codewire-workspace-access" }
codewire-tls = { path = "crates/codewire-tls" }
codewire-udp-relay = { path = "crates/codewire-udp-relay" }
codewire-vmm-guest-probe = { path = "crates/codewire-vmm-guest-probe" }
codewire-project = { path = "crates/codewire-project" }
codewire-project-proto = { path = "crates/codewire-project-proto" }
codewire-protected-store = { path = "crates/codewire-protected-store" }
codewire-credential-broker = { path = "crates/codewire-credential-broker" }
codewire-credential-bridge = { path = "crates/codewire-credential-bridge" }
codewire-credential-service = { path = "crates/codewire-credential-service" }
codewire-cw-release = { path = "crates/codewire-cw-release" }
codewire-local-credentials = { path = "crates/codewire-local-credentials" }
codewire-platform-credentials = { path = "crates/codewire-platform-credentials" }
codewire-workload-secrets = { path = "crates/codewire-workload-secrets" }

# AI/HTTP
av-credential-proxy = { git = "https://github.com/noeljackson/av.git", rev = "32ef60cbbe58dfb00a3ffda76f7b2e3b8900baaa", default-features = false }
oci-spec = { version = "=0.10.0", default-features = false, features = ["image"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }
aws-credential-types = { version = "=1.2.14", default-features = false }
aws-sigv4 = { version = "=1.4.5", default-features = false, features = ["sign-http", "http1"] }
aws-smithy-runtime-api = { version = "=1.12.3", default-features = false, features = ["client", "http-1x"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["system-config", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

# SSH
russh = "0.63.2"
russh-sftp = "2"

# Terminal emulation
alacritty_terminal = "0.25"
portable-pty = "0.9"

# Async utilities
async-io = "2"
async-trait = "0.1"
futures-lite = "2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"

# Time
chrono = { version = "0.4", default-features = false, features = ["now", "serde", "std"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Filesystem
dirs = "5"
filetime = "0.2"
rustix = { version = "=1.1.4", features = ["fs", "process", "thread"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }

# OAuth & Keychain
secret-service = "5.2"
keyring = "3"
tiny_http = "0.12"
open = "5"

# Crypto
aes-gcm = "=0.10.3"
sha2 = "0.10"
hmac = "0.12"
subtle = "=2.6.1"
base64 = "0.22"
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
flate2 = "1"
crc32fast = "1"
tar = { version = "=0.4.46", default-features = false }
shell-words = "1"
ed25519-dalek = "2"
rand = "0.8"
zeroize = { version = "1", features = ["serde"] }
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519"] }

# Bytes for streaming
bytes = "1"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-vsock = "=0.7.2"

# Connect-RPC (client-facing contract; docs/plans/connect-rpc/). Pre-1.0 —
# pinned exact on purpose; bump deliberately, never via `cargo update`.
connectrpc = "=0.9.1"
connectrpc-build = "=0.9.0"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }

# ---------------------------------------------------------------------------
# Server-side stack (used by codewire-server-core and the Phase 2+ services)
# ---------------------------------------------------------------------------
# HTTP framework. axum is the same Tokio/hyper-based framework the
# Phase 0 design discussion identified as the canonical Rust analog of
# huma+chi.
# http2 is deliberate: Connect/gRPC h2c prior-knowledge on the service
# listeners (docs/plans/connect-rpc/03-connect-server-infrastructure.md D2).
axum = { version = "0.8", features = ["macros", "json", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "catch-panic"] }
hyper = "1"
hyper-util = { version = "=0.1.20", features = ["server-auto", "server-graceful", "tokio"] }
http = "1"
http-body-util = "=0.1.3"

# Database. sqlx-postgres + tokio runtime mirrors what pgx/pgxpool gives
# Go services. macros + json so we can use query!/query_as! at compile time.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "json", "uuid", "chrono"] }

# NATS (replaces nats-io/nats.go).
async-nats = "0.47"

# Stripe (replaces stripe/stripe-go). The 1.0 rework of async-stripe —
# NOT the unmaintained 0.x line — split into a client crate plus
# per-API resource crates; core carries the Customer endpoints the
# billing overview needs. rustls to match the rest of the stack.
async-stripe = { version = "1.0.0-rc.6", default-features = false, features = ["rustls-ring", "rustls-tls-webpki-roots"] }
async-stripe-core = { version = "1.0.0-rc.6", features = ["customer", "setup_intent"] }
async-stripe-checkout = { version = "1.0.0-rc.6", features = ["checkout_session"] }
async-stripe-billing = { version = "1.0.0-rc.6", features = ["billing_portal_session", "subscription", "subscription_item", "invoice_item", "invoice"] }
async-stripe-shared = "1.0.0-rc.6"
async-stripe-webhook = "1.0.0-rc.6"
async-stripe-types = "1.0.0-rc.6"

# Temporal (replaces go.temporal.io/sdk for the environment workflow,
# #36 Stage D). Prerelease SDK; pinned exactly.
temporalio-sdk = "=0.5.0"
temporalio-client = "=0.5.0"
temporalio-macros = "=0.5.0"
temporalio-sdk-core = "=0.5.0"
temporalio-common = "=0.5.0"
temporalio-workflow = "=0.5.0"
url = "2"

# Kubernetes (replaces client-go in internal/sandbox). rustls to match
# the stack; latest-supported k8s version feature. "ws" is required for
# the pod exec/port-forward subresources the worker uses during
# environment setup.
kube = { version = "3", default-features = false, features = ["client", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.27", features = ["latest"] }

# Rust-owned request schemas and boundary validation.
schemars = { version = "1", features = ["derive"] }
jsonschema = { version = "0.46.6", default-features = false }

# OpenTelemetry — server-core wires this up so every Rust service has
# distributed tracing out of the box (a capability the Go services
# currently lack).
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.28"

# Auth — JWT signing and ID-token verification. Used by codewire-server-core
# for the bearer-token validator and by the eventual Rust IdP (Phase 3).
jsonwebtoken = "9"

# Config & misc
serde_yaml = "0.9"
toml = "1"
askama = "=0.14.0"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }

# Testing
tempfile = "3"
wiremock = "=0.6.5"
# Match the policy engine revision embedded by the pinned Kata runtime. Agent
# policy is an executable security boundary, so syntax-only assertions are
# insufficient.
regorus = { git = "https://github.com/microsoft/regorus", rev = "898643129e3652efd43e596f978d99f85e770235", default-features = false, features = ["arc", "regex", "std"] }

# Embedded web browser
wry = "0.54"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Native tests hash the actual CW image at admission and custody checks. Keep
# those hashes inside the same deadlines even with an unoptimized debug CW.
[profile.test.package."sha2@0.10.9"]
opt-level = 3

# In-process VMM RPC fixtures admit their own test executable. Omit linked
# debug information so it fits the unchanged 256MiB executable bound.
[profile.test.package.codewire-local-vmm]
strip = "debuginfo"

# CI/dev-drill profile: release semantics without LTO or single-unit
# codegen — host-built test binaries in CI use this (shipped images
# still build the real release profile via the Dockerfiles).
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
