[extend]
useDefault = true

[[allowlists]]
description = "Codewire Rust lockfiles list the crypto_secretbox dependency next to registry checksums"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)Cargo\.lock$''',
  '''(^|/)deployments/docker/(derp|gateway)\.Cargo\.lock$''',
]
regexTarget = "match"
regexes = ['''crypto_secretbox''']

[[allowlists]]
description = "The Tailscale wire-format golden records fixed public test keys derived from labelled seeds"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)tests/fixtures/tailnet/tailscale_golden\.json$''']
regexTarget = "match"
regexes = [
  '''(nodekey|discokey):[0-9a-f]{64}''',
  '''(node_key|remote_key)_hex": "[0-9a-f]{64}"''',
]

[[allowlists]]
description = "Codewire terminal rejection tests use fixed 32-byte hex signing fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-orchestration/src/api/terminal\.rs$''']
regexTarget = "line"
regexes = ['''let[[:space:]]+secret[[:space:]]*=[[:space:]]*"[[:xdigit:]]{32}";''']

[[allowlists]]
description = "Codewire proto JSON tests serialize a fixed API-key-shaped fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-proto/src/lib\.rs$''']
regexTarget = "match"
regexes = ['''key:[[:space:]]*"cw_[0-9a-fA-F]{16}"''']

[[allowlists]]
description = "Codewire managed-agent sanitizer test feeds a synthetic OpenAI-shaped key marked SYNTHETIC"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-cli/src/commands/sessions/agents/turn_failure_tests\.rs$''']
regexTarget = "match"
regexes = ['''sk-proj-SYNTHETIC[[:alnum:]]*''']

[[allowlists]]
description = "The exact xterm 6.0.0 npm member is verified byte-for-byte from its signed registry tarball"
targetRules = ["generic-api-key"]
paths = ['''(^|/)crates/codewire-dashboard-web/assets/xterm/xterm-6\.0\.0\.js$''']

[[allowlists]]
description = "Codewire Kind coordinator smoke test generates a disposable sidecar token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)scripts/ci/verify/kind/common\.sh$''']
regexTarget = "line"
regexes = ['''sidecar_token="[[:alnum:]_.-]{100,200}"''']

[[allowlists]]
description = "Codewire sandbox template tests embed an OpenSSH private-key fixture"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-orchestration/src/sandbox/template/tests\.rs$''']
regexTarget = "match"
regexes = ['''BEGIN[[:space:]]+OPENSSH[[:space:]]+PRIVATE[[:space:]]+KEY''']

[[allowlists]]
description = "Codewire Kind support manifest embeds a disposable EC private-key fixture"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)tests/e2e/kind/support\.yaml$''']
regexTarget = "match"
regexes = ['''BEGIN[[:space:]]+EC[[:space:]]+PRIVATE[[:space:]]+KEY''']

[[allowlists]]
description = "Explicit disposable stock OpenSSH fixtures for bounded SSH import; never account keys"
targetRules = ["private-key"]
condition = "AND"
paths = [
  '''(^|/)crates/codewire-protected-store/src/ssh_material/fixtures/ed25519-aes(128|192|256)-ctr\.openssh$''',
  '''(^|/)crates/codewire-protected-store/src/ssh_material/fixtures/rsa-(2048|3072|4096|8192)(-encrypted)?\.openssh$''',
  '''(^|/)crates/codewire-protected-store/src/ssh_material/fixtures/(rsa-1024|ecdsa)\.openssh$''',
]
regexTarget = "match"
regexes = ['''BEGIN[[:space:]]+OPENSSH[[:space:]]+PRIVATE[[:space:]]+KEY''']

[[allowlists]]
description = "SSH import test asserts literal OpenSSH armor markers, without private key bytes"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-protected-store/src/ssh_material/tests\.rs$''']
regexTarget = "match"
regexes = ['''BEGIN OPENSSH PRIVATE KEY-----\\n"\)\);[[:space:]]+assert!\(actual\.ends_with\(b"\\n-----END OPENSSH PRIVATE KEY''']

[[allowlists]]
description = "The support-image workflow test names the Amp npm package, whose scope is the Sourcegraph token rule's keyword, so its pinned action commit IDs read as tokens"
targetRules = ["sourcegraph-access-token"]
condition = "AND"
paths = ['''(^|/)scripts/ci/tests/test-support-images-workflow\.sh$''']
regexTarget = "line"
regexes = ['''noel/actions-[a-z-]+@[[:xdigit:]]{40}''']

[[allowlists]]
description = "A prose placeholder (not a key) in a curl example of the hosted-egress journey, from #5459; #5534 rewrote it, but the commit stays in the history the mirror scans"
targetRules = ["curl-auth-header"]
condition = "AND"
commits = ["268a2e7f6bbba2aa1e063fc1810c2470055baa75"]
paths = ['''^docs/journeys/network-and-egress\.md$''']
regexTarget = "secret"
regexes = ['''^sk-ant-made-up$''']

[[allowlists]]
description = "Antigravity's public Google Desktop OAuth client_secret constant (installed-app public identifier, owner decision 2026-11-25 on #6555)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-credential-broker/src/provider_oauth/antigravity\.rs$''']
regexTarget = "line"
regexes = ['''^pub\(crate\)[[:space:]]+const[[:space:]]+ANTIGRAVITY_OAUTH_CLIENT_SECRET:[[:space:]]*&str[[:space:]]*=[[:space:]]*"GOCSPX-[A-Za-z0-9_-]{28}";$''']
