[extend]
useDefault = true

[[allowlists]]
description = "Codewire Rust lockfiles list the crypto_secretbox dependency next to registry checksums"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)Cargo\.lock$''',
  '''(^|/)deployments/docker/(derp|gateway)\.Cargo\.lock$''',
]
regexTarget = "match"
regexes = ['''crypto_secretbox''']

[[allowlists]]
description = "Codewire terminal rejection tests use fixed 32-byte hex signing fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-orchestration/src/api/terminal\.rs$''']
regexTarget = "line"
regexes = ['''let[[:space:]]+secret[[:space:]]*=[[:space:]]*"[[:xdigit:]]{32}";''']

[[allowlists]]
description = "Codewire proto JSON tests serialize a fixed API-key-shaped fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-proto/src/lib\.rs$''']
regexTarget = "match"
regexes = ['''key:[[:space:]]*"cw_[0-9a-fA-F]{16}"''']

[[allowlists]]
description = "The exact xterm 6.0.0 npm member is verified byte-for-byte from its signed registry tarball"
targetRules = ["generic-api-key"]
paths = ['''(^|/)crates/codewire-dashboard-web/assets/xterm/xterm-6\.0\.0\.js$''']

[[allowlists]]
description = "Codewire Kind coordinator smoke test generates a disposable sidecar token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)scripts/ci/verify/kind/common\.sh$''']
regexTarget = "line"
regexes = ['''sidecar_token="[[:alnum:]_.-]{100,200}"''']

[[allowlists]]
description = "Codewire sandbox template tests embed an OpenSSH private-key fixture"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-orchestration/src/sandbox/template/tests\.rs$''']
regexTarget = "match"
regexes = ['''BEGIN[[:space:]]+OPENSSH[[:space:]]+PRIVATE[[:space:]]+KEY''']

[[allowlists]]
description = "Codewire Kind support manifest embeds a disposable EC private-key fixture"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)tests/e2e/kind/support\.yaml$''']
regexTarget = "match"
regexes = ['''BEGIN[[:space:]]+EC[[:space:]]+PRIVATE[[:space:]]+KEY''']

[[allowlists]]
description = "Explicit disposable stock OpenSSH fixtures for bounded SSH import; never account keys"
targetRules = ["private-key"]
condition = "AND"
paths = [
  '''(^|/)crates/codewire-protected-store/src/ssh_material/fixtures/ed25519-aes(128|192|256)-ctr\.openssh$''',
  '''(^|/)crates/codewire-protected-store/src/ssh_material/fixtures/rsa-(2048|3072|4096|8192)(-encrypted)?\.openssh$''',
  '''(^|/)crates/codewire-protected-store/src/ssh_material/fixtures/(rsa-1024|ecdsa)\.openssh$''',
]
regexTarget = "match"
regexes = ['''BEGIN[[:space:]]+OPENSSH[[:space:]]+PRIVATE[[:space:]]+KEY''']

[[allowlists]]
description = "SSH import test asserts literal OpenSSH armor markers, without private key bytes"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)crates/codewire-protected-store/src/ssh_material/tests\.rs$''']
regexTarget = "match"
regexes = ['''BEGIN OPENSSH PRIVATE KEY-----\\n"\)\);[[:space:]]+assert!\(actual\.ends_with\(b"\\n-----END OPENSSH PRIVATE KEY''']
