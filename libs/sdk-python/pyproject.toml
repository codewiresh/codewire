[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codewire"
version = "0.1.0"
description = "Codewire SDK — environment-first cloud development"
license = "MIT"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.10"
dependencies = [
    "connectrpc==0.11.1",
    "protobuf==7.35.1",
]
keywords = ["codewire", "sandbox", "environment", "sdk"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.urls]
Homepage = "https://codewire.sh"
Repository = "https://github.com/codewiresh/codewire"

[tool.hatch.build.targets.wheel]
packages = ["codewire"]

[tool.hatch.build.targets.wheel.force-include]
"../gen-python/codewire/v1" = "codewire/v1"
"../gen-python/google" = "google"
