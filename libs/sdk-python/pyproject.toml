[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "codewire"
version = "0.1.0"
description = "Codewire SDK — environment-first cloud development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.10"
dependencies = [
    "connectrpc==0.11.1",
    "protobuf==7.35.1",
]
keywords = ["codewire", "sandbox", "environment", "sdk"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[dependency-groups]
build = [
    "build==1.4.3",
    "hatchling==1.28.0",
]

[project.urls]
Homepage = "https://codewire.sh"
Documentation = "https://codewire.sh/docs"
Repository = "https://github.com/codewiresh/codewire"

[tool.hatch.build.targets.wheel]
packages = ["codewire"]

[tool.hatch.build.targets.sdist]
include = [
    "codewire",
    "hatch_build.py",
    "LICENSE",
    "LICENSE-APACHE",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.hooks.custom]
