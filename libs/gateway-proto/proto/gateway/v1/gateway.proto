// Deprecated: this former gateway control protocol is retained only for the
// bounded Go oracle. Rust uses codewire.internal.v1 instead; see
// docs/plans/connect-rpc/09-admin-internal-packages.md (D6).
syntax = "proto3";

package gateway.v1;

service GatewayService {
  rpc ResolveRoute(ResolveRouteRequest) returns (ResolveRouteResponse);
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
}

message ResolveRouteRequest {
  string organization_id = 1;
  string environment_id = 2;
  string actor_id = 3;
  string transport = 4;
}

message ResolveRouteResponse {
  string environment_id = 1;
  string namespace = 2;
  string pod_name = 3;
  string transport = 4;
  uint32 target_port = 5;
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  string environment_id = 1;
  string scope = 2;
}

message IssueTokenRequest {
  string environment_id = 1;
  string scope = 2;
}

message IssueTokenResponse {
  string token = 1;
}
