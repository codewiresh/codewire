syntax = "proto3";

package daemon.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "codewire/bridge/v1/bridge.proto";

service DaemonService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // Private native host lifecycle operation, not a workload launch. Enabled
  // only by the trusted Local+Runc guest configuration. No command, environment,
  // source selector, or application projection crosses this boundary.
  rpc PoweroffGuest(PoweroffGuestRequest) returns (PoweroffGuestResponse);

  // Replace the environment's exposed application ports, which a bound
  // daemon serves on its tailnet address. Orchestration pushes each change;
  // every access grant the daemon renews also restates the full set.
  rpc SetAppPorts(SetAppPortsRequest) returns (SetAppPortsResponse);

  // Private host-initiated channel for material-free guest credential
  // requests and typed recipient-encrypted application projections. The host
  // authenticates with the generation daemon capability; provider values and
  // plaintext application values never appear in either stream direction.
  rpc CredentialBridge(stream codewire.bridge.v1.CredentialBridgeHostMessage) returns (stream codewire.bridge.v1.CredentialBridgeGuestMessage);

  rpc LaunchSession(LaunchSessionRequest) returns (LaunchSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc RestartSession(RestartSessionRequest) returns (RestartSessionResponse);
  // Requires session_input.v1; timeout is ambiguous and must not be retried.
  rpc SendSessionInput(SendSessionInputRequest) returns (SendSessionInputResponse);
  rpc ReadSessionOutput(ReadSessionOutputRequest) returns (ReadSessionOutputResponse);
  rpc AttachSession(stream SessionAttachMessage) returns (stream SessionAttachMessage);

  rpc ExecSession(stream ExecMessage) returns (stream ExecMessage);
  rpc PtySession(stream PtyMessage) returns (stream PtyMessage);

  // Requires forward.workload_loopback.v1. One TCP connection to a loopback
  // address inside the workload's network namespace, made as the workload
  // user, for an SSH server that runs outside it (a local VM's supervisor).
  // The first request is `open`; the first response is `opened`, or the RPC
  // fails: InvalidArgument or PermissionDenied for a target the daemon
  // refuses, Unavailable when nothing accepted. Then `data` flows both ways
  // and each side sends `end` at its end of stream, as a TCP half-close; the
  // RPC ends once both have.
  rpc ForwardTcp(stream ForwardTcpMessage) returns (stream ForwardTcpMessage);

  rpc List(ListRequest) returns (ListResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc OpenFile(OpenFileRequest) returns (OperationStatus);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Mkdir(MkdirRequest) returns (OperationStatus);
  rpc Remove(RemoveRequest) returns (OperationStatus);
  rpc Rename(RenameRequest) returns (OperationStatus);
  rpc SetStat(SetStatRequest) returns (OperationStatus);
  rpc Readlink(ReadlinkRequest) returns (ReadlinkResponse);
}

// Target-owned trusted-host control. Registered only on the Linux host's
// owner-private UDS, never on guest or platform daemon ingress. The future
// authenticated Mesh adapter supplies its verified principal here; these
// fields are not assertions accepted directly from a network caller. Owner
// grant administration is never a Mesh wire operation.
service HostControlService {
  rpc GetHostControlInfo(HostControlInfoRequest) returns (HostControlInfoResponse);
  rpc PutHostControlGrant(HostControlPutGrantRequest) returns (HostControlGrantsResponse);
  rpc RevokeHostControlGrant(HostControlRevokeGrantRequest) returns (HostControlGrantsResponse);
  rpc ListHostControlGrants(HostControlInfoRequest) returns (HostControlGrantsResponse);
  // Registration is durable. RPC cancellation does not cancel the target's
  // owning task. A lost reply is recovered with Observe, never a new request.
  rpc MutateHostSession(HostControlMutationRequest) returns (HostControlReceipt);
  rpc ObserveHostRequest(HostControlObserveRequest) returns (HostControlReceipt);
  rpc ListHostSessions(HostControlReadRequest) returns (HostControlListSessionsResponse);
  rpc GetHostSession(HostControlReadRequest) returns (GetSessionResponse);
  rpc ReadHostSessionOutput(HostControlReadRequest) returns (ReadSessionOutputResponse);
  // One bounded target-owned managed record or status/inbox snapshot. Native
  // provider protocols stay on the target; frames never carry credentials.
  rpc ReadHostManagedSession(HostControlManagedReadRequest) returns (stream HostControlManagedRecordChunk);
}

enum HostControlVerb {
  HOST_CONTROL_VERB_UNSPECIFIED = 0;
  HOST_CONTROL_VERB_READ = 1;
  HOST_CONTROL_VERB_LAUNCH = 2;
  HOST_CONTROL_VERB_INPUT = 3;
  HOST_CONTROL_VERB_STOP = 4;
  HOST_CONTROL_VERB_MANAGED_LAUNCH = 5;
  HOST_CONTROL_VERB_MANAGED_MESSAGE = 6;
  HOST_CONTROL_VERB_MANAGED_STEER = 7;
  HOST_CONTROL_VERB_MANAGED_INTERRUPT = 8;
  HOST_CONTROL_VERB_MANAGED_STOP = 9;
  HOST_CONTROL_VERB_MANAGED_RESTART = 10;
  HOST_CONTROL_VERB_MANAGED_READ = 11;
}

enum HostControlRequestPhase {
  HOST_CONTROL_REQUEST_PHASE_UNSPECIFIED = 0;
  HOST_CONTROL_REQUEST_PHASE_PENDING = 1;
  HOST_CONTROL_REQUEST_PHASE_ISSUED = 2;
  HOST_CONTROL_REQUEST_PHASE_COMPLETED = 3;
  HOST_CONTROL_REQUEST_PHASE_REJECTED = 4;
  HOST_CONTROL_REQUEST_PHASE_UNKNOWN = 5;
}

message HostControlInfoRequest {}
message HostControlInfoResponse {
  uint32 protocol_version = 1;
  string environment_id = 2;
  repeated HostControlVerb verbs = 3;
  // Zero for owners that have not explicitly enabled the managed adapter.
  uint32 managed_agent_protocol_version = 4;
}

message HostControlGrant {
  string grant_id = 1;
  string environment_id = 2;
  string org_id = 3;
  string network_id = 4;
  bytes caller_key = 5;
  bytes target_key = 6;
  repeated HostControlVerb verbs = 7;
  // Zero only on creation; edits compare this prior revision and increment it.
  uint64 revision = 8;
  bool revoked = 9;
}
message HostControlPutGrantRequest {
  uint64 expected_book_revision = 1;
  HostControlGrant grant = 2;
}
message HostControlRevokeGrantRequest {
  uint64 expected_book_revision = 1;
  string grant_id = 2;
  uint64 expected_grant_revision = 3;
}
message HostControlGrantsResponse {
  string environment_id = 1;
  uint64 book_revision = 2;
  repeated HostControlGrant grants = 3;
}

message HostControlScope {
  string environment_id = 1;
  string org_id = 2;
  string network_id = 3;
  bytes caller_key = 4;
  bytes target_key = 5;
  string grant_id = 6;
  uint64 expected_grant_revision = 7;
}
message HostControlLaunch {
  repeated string command = 1;
  string working_dir = 2;
  bool pty = 3;
  string term = 4;
  int32 width = 5;
  int32 height = 6;
  string name = 7;
}
message HostControlInput {
  string session_id = 1;
  uint64 expected_launch_generation = 2;
  bytes data = 3;
}
message HostControlStop {
  string session_id = 1;
  uint64 expected_launch_generation = 2;
}
message HostControlMutationRequest {
  string request_id = 1;
  HostControlScope scope = 2;
  oneof operation {
    HostControlLaunch launch = 3;
    HostControlInput input = 4;
    HostControlStop stop = 5;
    HostControlManagedLaunch managed_launch = 6;
    HostControlManagedControl managed_control = 7;
  }
}
enum HostManagedAgent {
  HOST_MANAGED_AGENT_UNSPECIFIED = 0;
  HOST_MANAGED_AGENT_CODEX = 1;
  HOST_MANAGED_AGENT_CLAUDE = 2;
}
enum HostManagedAction {
  HOST_MANAGED_ACTION_UNSPECIFIED = 0;
  HOST_MANAGED_ACTION_MESSAGE = 1;
  HOST_MANAGED_ACTION_STEER = 2;
  HOST_MANAGED_ACTION_INTERRUPT = 3;
  HOST_MANAGED_ACTION_STOP = 4;
  HOST_MANAGED_ACTION_RESTART = 5;
}
message HostControlManagedLaunch {
  HostManagedAgent agent = 1;
  string model = 2;
  optional string effort = 3;
  string working_dir = 4;
  string name = 5;
  optional string prompt = 6;
  // Canonical same-target parent; server resolves exact driver and origin.
  string parent_session_id = 7;
  // Required nonzero when parent_session_id is set.
  uint64 expected_parent_launch_generation = 8;
}
message HostControlManagedControl {
  HostManagedAction action = 1;
  string session_id = 2;
  uint64 expected_launch_generation = 3;
  string driver_id = 4;
  string text = 5;
  optional string reply_to = 6;
  optional string expected_turn_id = 7;
  optional string expected_active_message_id = 8;
}
message HostControlManagedReadRequest {
  HostControlScope scope = 1;
  string session_id = 2;
  uint64 expected_launch_generation = 3;
  string driver_id = 4;
  // Empty selects bounded status/inbox summaries; otherwise one full record.
  string message_id = 5;
  // At most100 summaries with an actual total-byte cap; zero selects20.
  uint32 limit = 6;
}
message HostControlManagedRecordChunk {
  string session_id = 1;
  string driver_id = 2;
  uint64 launch_generation = 3;
  string message_id = 4;
  uint64 offset = 5;
  uint64 total_bytes = 6;
  string payload_sha256 = 7;
  // One atomic snapshot, total<=5MiB; the encoded frame, including metadata,
  // must remain<=256KiB. Callers cannot widen the ordinary terminal bound.
  bytes data = 8;
}
message HostControlObserveRequest {
  string request_id = 1;
  HostControlScope scope = 2;
}
message HostControlReceipt {
  string request_id = 1;
  HostControlScope scope = 2;
  string fingerprint_sha256 = 3;
  HostControlVerb verb = 4;
  HostControlRequestPhase phase = 5;
  string session_id = 6;
  uint64 launch_generation = 7;
  SessionLifecycleState session_state = 8;
  optional int32 exit_code = 9;
  bool cleanup_unknown = 10;
  bool input_acknowledged = 11;
  // Fixed material-free code. An absent/unknown receipt is never permission
  // to relaunch or repeat input. Completed Launch means admission settled,
  // not that the durable command exited.
  string reason = 12;
  string driver_id = 13;
  string message_id = 14;
}
message HostControlReadRequest {
  HostControlScope scope = 1;
  string session_id = 2;
  uint64 offset = 3;
  // At most 256KiB; zero selects that default.
  uint64 limit = 4;
  bool allow_history_gap = 5;
  string after_session_id = 6;
  // List pages contain at most eight bounded controlled session records.
  uint32 page_limit = 7;
}
message HostControlListSessionsResponse {
  repeated SessionRecord sessions = 1;
  string next_session_id = 2;
}

enum DaemonState {
  DAEMON_STATE_UNSPECIFIED = 0;
  DAEMON_STATE_UNSUPPORTED = 1;
  DAEMON_STATE_STARTING = 2;
  DAEMON_STATE_READY = 3;
  DAEMON_STATE_UNHEALTHY = 4;
  DAEMON_STATE_UPGRADE_REQUIRED = 5;
}

enum SessionLifecycleState {
  SESSION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  SESSION_LIFECYCLE_STATE_STARTING = 1;
  SESSION_LIFECYCLE_STATE_RUNNING = 2;
  SESSION_LIFECYCLE_STATE_STOPPING = 3;
  SESSION_LIFECYCLE_STATE_STOPPED = 4;
  SESSION_LIFECYCLE_STATE_EXITED = 5;
  SESSION_LIFECYCLE_STATE_FAILED = 6;
  SESSION_LIFECYCLE_STATE_INTERRUPTED = 7;
}

enum SessionOutputStream {
  SESSION_OUTPUT_STREAM_UNSPECIFIED = 0;
  SESSION_OUTPUT_STREAM_STDOUT = 1;
  SESSION_OUTPUT_STREAM_STDERR = 2;
  SESSION_OUTPUT_STREAM_PTY = 3;
}

message GetCapabilitiesRequest {
  // Zero performs discovery without requiring a particular protocol version.
  uint32 protocol_version = 1;
  repeated string required_capabilities = 2;
}

message GetCapabilitiesResponse {
  uint32 protocol_version = 1;
  uint32 minimum_protocol_version = 2;
  string daemon_version = 3;
  repeated string capabilities = 4;
  DaemonState state = 5;
  string message = 6;
  // The workspace's default shell: what a session launched without a command
  // runs, and what an SSH exec request's command line runs through. Empty from
  // a daemon older than this field.
  string default_shell = 7;
}

message GetHealthRequest {}

message PoweroffGuestRequest {}

message PoweroffGuestResponse {}

message SetAppPortsRequest {
  // The complete set, 1-65535 without duplicates. It replaces the previous one.
  repeated int32 ports = 1;
}

message SetAppPortsResponse {}

message HealthDiagnostic {
  string name = 1;
  bool healthy = 2;
  string message = 3;
}

message GetHealthResponse {
  DaemonState state = 1;
  string message = 2;
  repeated HealthDiagnostic diagnostics = 3;
}

message SessionRecord {
  // Stable opaque identity assigned once at launch.
  string session_id = 1;
  SessionLifecycleState state = 2;
  repeated string command = 3;
  string working_dir = 4;
  bool pty = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  optional int32 exit_code = 9;
  uint64 output_end_offset = 10;
  string status_message = 11;
  // Absolute byte cursor of the oldest retained output. Earlier output is unavailable.
  uint64 output_start_offset = 12;
  string name = 13;
  optional string parent_session_id = 14;
  bool cleanup_unknown = 15;
  // Durable per-session launch admission generation; zero means unavailable.
  uint64 launch_generation = 16;
}

message LaunchSessionRequest {
  repeated string command = 1;
  string working_dir = 2;
  repeated string env = 3;
  bool pty = 4;
  string term = 5;
  int32 width = 6;
  int32 height = 7;
  string name = 8;
  optional string parent_session_id = 9;
}

message LaunchSessionResponse {
  SessionRecord session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionRecord sessions = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  SessionRecord session = 1;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {
  SessionRecord session = 1;
}

message RestartSessionRequest {
  string session_id = 1;
  // Compare before cancellation/Stop; requires a known terminal generation.
  optional uint64 expected_launch_generation = 2;
}

message RestartSessionResponse {
  SessionRecord session = 1;
}

message SendSessionInputRequest {
  string session_id = 1;
  // Nonempty and at most 64KiB; success acknowledges write/flush or PTY write.
  bytes data = 2;
}

message SendSessionInputResponse {}

message ReadSessionOutputRequest {
  string session_id = 1;
  uint64 offset = 2;
  uint64 limit = 3;
  bool allow_history_gap = 4;
}

message SessionOutputChunk {
  uint64 offset = 1;
  uint64 next_offset = 2;
  SessionOutputStream stream = 3;
  bytes data = 4;
}

message ReadSessionOutputResponse {
  repeated SessionOutputChunk chunks = 1;
  uint64 next_offset = 2;
  bool eof = 3;
  uint64 retained_start_offset = 4;
  // True when the requested cursor precedes retained_start_offset.
  bool history_gap = 5;
}

message AttachSessionRequest {
  string session_id = 1;
  uint64 output_offset = 2;
}

message DetachSessionRequest {
  string session_id = 1;
}

message SessionInput {
  bytes data = 1;
}

message SessionStatus {
  string session_id = 1;
  SessionLifecycleState state = 2;
  optional int32 exit_code = 3;
  uint64 output_end_offset = 4;
  string message = 5;
  uint64 output_start_offset = 6;
}

message SessionOutputGap {
  uint64 requested_offset = 1;
  uint64 retained_start_offset = 2;
}

message SessionAttachMessage {
  oneof payload {
    AttachSessionRequest attach = 1;
    SessionInput input = 2;
    ResizeRequest resize = 3;
    DetachSessionRequest detach = 4;
    SessionOutputChunk output = 5;
    SessionStatus status = 6;
    SessionOutputGap history_gap = 7;
  }
}

message ExecStartRequest {
  repeated string command = 1;
  string working_dir = 2;
  repeated string env = 3;
}

message PtyStartRequest {
  repeated string command = 1;
  string working_dir = 2;
  repeated string env = 3;
  string term = 4;
  int32 width = 5;
  int32 height = 6;
}

message ResizeRequest {
  int32 width = 1;
  int32 height = 2;
}

message ExitStatus {
  int32 code = 1;
}

message ExecMessage {
  oneof payload {
    ExecStartRequest start = 1;
    bytes stdin = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    ExitStatus exit = 5;
    google.protobuf.Empty close_stdin = 6;
    string error = 7;
  }
}

message ForwardTcpMessage {
  oneof payload {
    ForwardTcpOpen open = 1;
    google.protobuf.Empty opened = 2;
    bytes data = 3;
    google.protobuf.Empty end = 4;
  }
}

// A literal loopback address (127.0.0.0/8 or ::1), never a name.
message ForwardTcpOpen {
  string address = 1;
  uint32 port = 2;
}

message PtyMessage {
  oneof payload {
    PtyStartRequest start = 1;
    bytes stdin = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    ResizeRequest resize = 5;
    ExitStatus exit = 6;
    google.protobuf.Empty close_stdin = 7;
    string error = 8;
  }
}

message FileOpenOptions {
  bool read = 1;
  bool write = 2;
  bool append = 3;
  bool create = 4;
  bool truncate = 5;
  bool exclusive = 6;
}

message FileMetadata {
  string name = 1;
  string path = 2;
  int64 size = 3;
  uint32 mode = 4;
  google.protobuf.Timestamp mod_time = 5;
  string link_target = 6;
}

message OperationStatus {
  string status = 1;
}

message ListRequest {
  string path = 1;
}

message ListResponse {
  repeated FileMetadata entries = 1;
}

message StatRequest {
  string path = 1;
  bool follow = 2;
}

message StatResponse {
  FileMetadata entry = 1;
}

message OpenFileRequest {
  string path = 1;
  FileOpenOptions options = 2;
  uint32 perm = 3;
}

message ReadRequest {
  string path = 1;
  int64 offset = 2;
  int64 length = 3;
}

message ReadResponse {
  bytes data = 1;
}

message WriteRequest {
  string path = 1;
  int64 offset = 2;
  bytes data = 3;
}

message WriteResponse {
  int64 bytes_written = 1;
}

message MkdirRequest {
  string path = 1;
  uint32 perm = 2;
}

message RemoveRequest {
  string path = 1;
  bool dir = 2;
}

message RenameRequest {
  string old_path = 1;
  string new_path = 2;
}

message SetStatRequest {
  string path = 1;
  optional int64 size = 2;
  optional uint32 mode = 3;
  google.protobuf.Timestamp access_time = 4;
  google.protobuf.Timestamp mod_time = 5;
}

message ReadlinkRequest {
  string path = 1;
}

message ReadlinkResponse {
  string target = 1;
}

// Existing daemon.v1 package, imports and ordinary/Host services are unchanged.
// Original captured Pod channel + existing daemon auth, never public user wire.
service PlatformManagedService {
  rpc GetPlatformManagedInfo(PlatformManagedInfoRequest) returns (PlatformManagedInfoResponse);
  rpc MutatePlatformManagedSession(PlatformManagedMutationRequest) returns (PlatformManagedReceipt);
  rpc ObservePlatformManagedRequest(PlatformManagedObserveRequest) returns (PlatformManagedReceipt);
  rpc ListPlatformManagedSessions(PlatformManagedListRequest) returns (PlatformManagedListResponse);
  rpc ReadPlatformManagedSession(PlatformManagedReadRequest) returns (stream PlatformManagedRecordChunk);
}

enum PlatformManagedAgent {
  PLATFORM_MANAGED_AGENT_UNSPECIFIED = 0;
  PLATFORM_MANAGED_AGENT_CODEX = 1;
  PLATFORM_MANAGED_AGENT_CLAUDE = 2;
}
enum PlatformManagedAction {
  PLATFORM_MANAGED_ACTION_UNSPECIFIED = 0;
  PLATFORM_MANAGED_ACTION_MESSAGE = 1;
  PLATFORM_MANAGED_ACTION_STEER = 2;
  PLATFORM_MANAGED_ACTION_INTERRUPT = 3;
  PLATFORM_MANAGED_ACTION_STOP = 4;
  PLATFORM_MANAGED_ACTION_RESTART = 5;
  // A conversation of an earlier Pod of this environment continues in this
  // Pod from its own saved native session (#2705).
  PLATFORM_MANAGED_ACTION_RESUME = 6;
}
enum PlatformManagedRequestPhase {
  PLATFORM_MANAGED_REQUEST_PHASE_UNSPECIFIED = 0;
  PLATFORM_MANAGED_REQUEST_PHASE_PENDING = 1;
  PLATFORM_MANAGED_REQUEST_PHASE_ISSUED = 2;
  PLATFORM_MANAGED_REQUEST_PHASE_COMPLETED = 3;
  PLATFORM_MANAGED_REQUEST_PHASE_REJECTED = 4;
  PLATFORM_MANAGED_REQUEST_PHASE_UNKNOWN = 5;
}
// Immutable platform correlation. The control-plane owner authenticates current
// actor/grant/full DB row/actual PodUID; target Config does NOT discover PodUID.
// Current environment generation is independently journaled by that owner,
// never equated with immutable binding_generation or used as target evidence.
message PlatformManagedScope {
  string environment_id = 1;
  string org_id = 2;
  string pod_uid = 3;
  uint64 binding_generation = 4;
  bytes projection_selection_sha256 = 5; // exactly32 bytes
  bytes support_image_sha256 = 6; // original support CI payload, exactly32
  uint64 support_image_size = 7;
}
// All three values are already known from the original complete binding capture.
// No endpoint/token/path or caller program; Info creates no managed state.
message PlatformManagedInfoRequest {
  string environment_id = 1;
  uint64 binding_generation = 2;
  bytes projection_selection_sha256 = 3;
}
message PlatformManagedAgentSupport {
  PlatformManagedAgent agent = 1;
  bytes provider_sha256 = 2;
  uint64 provider_size = 3;
  string provider_version = 4;
  // True only for the implemented qualified private-home/proxy-only client.
  // Unsupported/missing slots or unqualified clients are absent, not adopted.
  bool proxy_only_qualified = 5;
  bool steer = 6;
  bool interrupt = 7;
}
message PlatformManagedInfoResponse {
  uint32 protocol_version = 1; //1, separate additive managed capability
  string environment_id = 2;
  uint64 binding_generation = 3;
  bytes projection_selection_sha256 = 4;
  bytes support_image_sha256 = 5;
  uint64 support_image_size = 6;
  string support_image_version = 7;
  repeated PlatformManagedAgentSupport agents = 8;
}
message PlatformManagedLaunch {
  PlatformManagedAgent agent = 1;
  string model = 2;
  optional string effort = 3;
  string working_dir = 4; //absolute<=4096 bytes, no caller env/path override
  string name = 5;
  optional string prompt = 6; //semantic<=64KiB, noNUL
  string parent_session_id = 7;
  uint64 expected_parent_launch_generation = 8;
  // Info-derived original native payload, NEVER requested program/URL/home.
  bytes expected_provider_sha256 = 9;
  uint64 expected_provider_size = 10;
  string expected_provider_version = 11;
}
message PlatformManagedControl {
  PlatformManagedAction action = 1;
  string session_id = 2;
  uint64 expected_launch_generation = 3;
  string driver_id = 4;
  string text = 5; //<=64KiB; empty for interrupt/stop/restart
  optional string reply_to = 6;
  optional string expected_turn_id = 7;
  optional string expected_active_message_id = 8;
  // Explicit recovery link; only Stop. Never replay the original request.
  optional string cleanup_of_request_id = 9;
  // Resume only: the earlier Pod the record must name. The control plane
  // derives it from its own journal and proves it absent; never a client value.
  string predecessor_pod_uid = 10;
  // Resume only: the agent and this image's pinned provider, admitted as a
  // launch's are. Empty for every other action.
  PlatformManagedAgent agent = 11;
  bytes expected_provider_sha256 = 12;
  uint64 expected_provider_size = 13;
  string expected_provider_version = 14;
}
message PlatformManagedMutationRequest {
  string request_id = 1; //canonical nonnil UUID; unique target owner
  PlatformManagedScope scope = 2;
  oneof operation {
    PlatformManagedLaunch launch = 3;
    PlatformManagedControl control = 4;
  }
}
message PlatformManagedObserveRequest {
  string request_id = 1;
  PlatformManagedScope scope = 2;
}
message PlatformManagedReceipt {
  string request_id = 1;
  PlatformManagedScope scope = 2;
  string fingerprint_sha256 = 3;
  PlatformManagedRequestPhase phase = 4;
  string session_id = 5;
  string driver_id = 6;
  string message_id = 7;
  uint64 launch_generation = 8;
  SessionLifecycleState session_state = 9;
  optional int32 exit_code = 10;
  bool cleanup_unknown = 11;
  bool pipe_acknowledged = 12;
  bool native_acknowledged = 13;
  string reason = 14; //fixed value-blind code, never provider error/output
  optional string cleanup_of_request_id = 15;
  uint64 cleanup_previous_generation = 16;
  bool cleanup_previous_cleanup_known = 17;
}
message PlatformManagedListRequest {
  PlatformManagedScope scope = 1;
  string after_session_id = 2; //empty first page, otherwise canonical same scope
  uint32 page_limit = 3; //0=>8, maximum8 plus total encoded bound
}
message PlatformManagedListResponse {
  repeated SessionRecord sessions = 1;
  string next_session_id = 2;
}
message PlatformManagedReadRequest {
  PlatformManagedScope scope = 1;
  string session_id = 2;
  string driver_id = 3;
  uint64 expected_launch_generation = 4;
  // Empty => current bounded status/inbox; otherwise one exact saved record.
  // Historical full records need their saved original platform generation;
  // zero/unknown/foreign history cannot be adopted from current session state.
  string message_id = 5;
  uint32 limit = 6; //0=>20, maximum100; actual response byte bound applies
}
message PlatformManagedRecordChunk {
  PlatformManagedScope scope = 1;
  string session_id = 2;
  string driver_id = 3;
  uint64 launch_generation = 4;
  string message_id = 5;
  uint64 offset = 6;
  uint64 total_bytes = 7;
  string payload_sha256 = 8;
  // Single admitted projection, total<=5MiB; each encoded frame<=256KiB.
  // No empty/trailing/missing/retargeted/out-of-order/changed-header frame.
  bytes data = 9;
}
