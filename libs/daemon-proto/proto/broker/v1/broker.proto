syntax = "proto3";

package broker.v1;

import "codewire/bridge/v1/bridge.proto";

// Private gateway-initiated transport for the isolated credential broker.
// Importing the material-free frames does not expose DaemonService or grant
// any daemon capability. This service must never be routed at the public edge.
service CredentialBrokerService {
  // Authenticate the caller before consuming the stream. The first guest
  // message must be Ready, whose protocol/environment/generation coordinates
  // must match that already-authenticated caller; Ready is not identity proof.
  // Return successful stream headers only after this admission. Those headers
  // list the optional operations this broker serves
  // (x-codewire-credential-bridge-capabilities); the gateway copies them into
  // the daemon's Open. Subsequent guest messages are operation or Cancel
  // frames; responses are only typed operation terminals, never
  // HostMessage.open. Protected provider credentials do not appear in either
  // direction, except the one listed direct delivery exception: a Codex login
  // sealed to the daemon's recipient key, opaque to the gateway.
  rpc CredentialBridge(stream codewire.bridge.v1.CredentialBridgeGuestMessage) returns (stream codewire.bridge.v1.CredentialBridgeHostMessage);

  // A front door's session joining an admitted epoch (#4001, #4909). The
  // caller presents the same relay and workspace authorization as that
  // epoch's CredentialBridge, then the epoch's handle from its response
  // headers (x-codewire-credential-bridge-epoch-bin); they are checked in
  // that order, and the handle only among that binding's live epochs. The
  // first guest message must be Ready for the same environment and
  // generation. Requests take the front-door validation (BridgeEntry::
  // FrontDoor) on that epoch's leases, decisions and single refresh, and the
  // stream ends with the epoch. An epoch serves one front-door stream at a
  // time; another is ALREADY_EXISTS. A handle of an ended or other epoch, or
  // another binding's, is PERMISSION_DENIED. The successful response headers
  // list the front-door operations served
  // (x-codewire-credential-bridge-capabilities).
  rpc FrontDoorBridge(stream codewire.bridge.v1.CredentialBridgeGuestMessage) returns (stream codewire.bridge.v1.CredentialBridgeHostMessage);

  // The interception CA of a hosted Pod, made at its first call and the same
  // for the Pod's life (#4001). The one method that takes the relay token
  // alone: orchestration calls it at every egress admission, bound or not.
  // The Pod is checked live in the sandbox namespace: that UID at that name,
  // in broker egress mode, not terminating. Another or missing Pod, or one
  // whose binding was released, is PERMISSION_DENIED. Rate-limited per caller
  // and per Pod (RESOURCE_EXHAUSTED). Returns the certificate only.
  rpc EnsureInterceptionCa(EnsureInterceptionCaRequest) returns (EnsureInterceptionCaResponse);

  // Leaves under the Pod's interception CA for a front door's key (#4001).
  // The caller presents the same relay and workspace authorization as an
  // epoch's CredentialBridge, then that epoch's handle, checked in that order
  // as FrontDoorBridge checks them, without taking the epoch's stream. The
  // environment and Pod come only from that authentication; the hosts only
  // from the interceptable hosts this session's credentials reach, none for
  // a session with none. UNAVAILABLE before the epoch is admitted or while
  // the signer cannot sign. A repeated call for the same Pod, epoch and key
  // returns the same leaves until renew_at_unix.
  rpc SignInterceptionLeaves(SignInterceptionLeavesRequest) returns (SignInterceptionLeavesResponse);
}

message EnsureInterceptionCaRequest {
  string pod_uid = 1;
  string pod_name = 2;
}

message EnsureInterceptionCaResponse {
  bytes ca_certificate_der = 1;
}

message SignInterceptionLeavesRequest {
  // The front door's ECDSA P-256 public key, as a DER SubjectPublicKeyInfo.
  bytes leaf_public_key = 1;
}

message InterceptionLeaf {
  bytes certificate_der = 1;
  repeated string hosts = 2;
}

message SignInterceptionLeavesResponse {
  repeated InterceptionLeaf leaves = 1;
  // Half the leaves' lifetime; ask again at or after it.
  int64 renew_at_unix = 2;
}
