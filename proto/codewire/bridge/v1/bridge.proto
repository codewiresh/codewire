syntax = "proto3";

package codewire.bridge.v1;

// Frames shared by the private native and platform credential bridges. These
// messages carry filtered HTTP bytes, recipient-encrypted application
// projections, public SSH keys and signatures; they never carry plaintext
// application values or provider credentials, with two listed direct delivery
// exceptions (docs/dev/SECRETS-AND-CREDENTIALS.md, "Direct delivery
// exceptions"): CodexLoginResponse seals the Sandbox creator's own personal
// Codex ChatGPT access token, ID token and account ID, and ClaudeLoginResponse
// the creator's own personal Claude sign-in access token with its expiry,
// scopes and plan, each to a recipient key held by the workspace daemon. A
// refresh token is never carried. Relays see only ciphertext.
message CredentialBridgeOpen {
  uint32 protocol_version = 1;
  string environment_id = 2;
  uint64 environment_generation = 3;
  // Optional operations the admitting host can serve on this epoch, such as
  // "codex-login" or "claude-login". A guest sends such an operation only when its epoch's Open
  // lists it: an older host ends the epoch on an unknown frame. Only the host
  // that admits an epoch sets this; it confers no authority, which the broker
  // rederives for every request.
  repeated string capabilities = 4;
}

message CredentialHttpHeader {
  string name = 1;
  bytes value = 2;
}

message CredentialBridgeResponseStart {
  string request_id = 1;
  uint32 status_code = 2;
  repeated CredentialHttpHeader headers = 3;
}

message CredentialBridgeResponseBody {
  string request_id = 1;
  bytes data = 2;
}

message CredentialBridgeResponseEnd {
  string request_id = 1;
}

enum CredentialBridgeFailureReason {
  CREDENTIAL_BRIDGE_FAILURE_REASON_UNSPECIFIED = 0;
  CREDENTIAL_BRIDGE_FAILURE_REASON_DENIED = 1;
  CREDENTIAL_BRIDGE_FAILURE_REASON_UNAVAILABLE = 2;
  CREDENTIAL_BRIDGE_FAILURE_REASON_UPSTREAM_FAILED = 3;
  CREDENTIAL_BRIDGE_FAILURE_REASON_RESPONSE_TOO_LARGE = 4;
}

message CredentialBridgeResponseFailure {
  string request_id = 1;
  CredentialBridgeFailureReason reason = 2;
}

// Frames for a front-door session: a TLS front door outside the environment
// that speaks the guest side of this protocol on its own session, and carries
// a WebSocket's bytes after the upgrade. Nothing sends or serves these yet.
// Every current peer treats each one as an unknown frame and ends the epoch,
// which is also what an older peer does, since it decodes one as an empty
// payload.

// The host dialled the upgrade's destination and it answered 101. From here
// both sides carry only the stream frames below for this request. Nothing
// sends this yet.
message CredentialBridgeUpgradeAccepted {
  string request_id = 1;
  repeated CredentialHttpHeader headers = 2;
}

// Opaque bytes of an upgraded stream, in either direction. They are never
// parsed. The sender sends no more than the credit its peer has granted.
// Nothing sends this yet.
message CredentialBridgeStreamData {
  string request_id = 1;
  bytes data = 2;
}

// Grants the peer this many more bytes of stream data for the request.
// Nothing sends this yet.
message CredentialBridgeStreamCredit {
  string request_id = 1;
  uint32 credit_bytes = 2;
}

enum CredentialBridgeStreamCloseKind {
  CREDENTIAL_BRIDGE_STREAM_CLOSE_KIND_UNSPECIFIED = 0;
  // The sender sends no more data; it still reads what its peer sends.
  CREDENTIAL_BRIDGE_STREAM_CLOSE_KIND_HALF_CLOSE = 1;
  // Both directions end at once, and unsent data is dropped.
  CREDENTIAL_BRIDGE_STREAM_CLOSE_KIND_RESET = 2;
}

// Ends one or both directions of an upgraded stream. Nothing sends this yet.
message CredentialBridgeStreamClose {
  string request_id = 1;
  CredentialBridgeStreamCloseKind kind = 2;
}

// An origin the host learned while answering the request, such as the host a
// provider's routing reply names for later traffic. The front door decides
// from its own fixed list whether to intercept it; the hint confers no
// authority. Nothing sends this yet.
message CredentialBridgeInterceptionHint {
  string request_id = 1;
  string origin = 2;
}

message CredentialBridgeHostMessage {
  oneof payload {
    CredentialBridgeOpen open = 1;
    CredentialBridgeResponseStart response_start = 2;
    CredentialBridgeResponseBody response_body = 3;
    CredentialBridgeResponseEnd response_end = 4;
    CredentialBridgeResponseFailure response_failure = 5;
    EnvironmentProjectionResponse environment_projection = 6;
    CredentialSshResponse ssh = 7;
    CodexLoginResponse codex_login = 8;
    ClaudeLoginResponse claude_login = 9;
    // Front-door session frames; nothing sends them yet.
    CredentialBridgeUpgradeAccepted upgrade_accepted = 10;
    CredentialBridgeStreamData stream_data = 11;
    CredentialBridgeStreamCredit stream_credit = 12;
    CredentialBridgeStreamClose stream_close = 13;
    CredentialBridgeInterceptionHint interception_hint = 14;
  }
}

message CredentialBridgeReady {
  uint32 protocol_version = 1;
  string environment_id = 2;
  uint64 environment_generation = 3;
}

message CredentialBridgeRequest {
  string request_id = 1;
  string method = 2;
  string path = 3;
  string query = 4;
  repeated CredentialHttpHeader headers = 5;
  bytes body = 6;
  // Closed capability/route IDs. Neither field can name a destination or
  // confer authority; the broker rederives the exact selected-profile grant.
  string capability_slot = 7;
  string route = 8;
  // The bound host a front-door request was made to. Empty on every other
  // session, which refuses a request that sets it before any credential
  // lease. Nothing sets it yet.
  string intercepted_host = 9;
}

// A front-door request to upgrade to a WebSocket: the request fields of
// CredentialBridgeRequest without a body. `initial_credit_bytes` is how many
// stream bytes the guest accepts before it grants more. Nothing sends this yet.
message CredentialBridgeUpgrade {
  string request_id = 1;
  string method = 2;
  string path = 3;
  string query = 4;
  repeated CredentialHttpHeader headers = 5;
  string capability_slot = 6;
  string route = 7;
  string intercepted_host = 8;
  uint32 initial_credit_bytes = 9;
}

message CredentialBridgeCancel {
  string request_id = 1;
}

message CredentialBridgeGuestMessage {
  oneof payload {
    CredentialBridgeReady ready = 1;
    CredentialBridgeRequest request = 2;
    CredentialBridgeCancel cancel = 3;
    EnvironmentProjectionRequest environment_projection = 4;
    CredentialSshRequest ssh = 5;
    CodexLoginRequest codex_login = 6;
    ClaudeLoginRequest claude_login = 7;
    // Front-door session frames; nothing sends them yet.
    CredentialBridgeUpgrade upgrade = 8;
    CredentialBridgeStreamData stream_data = 9;
    CredentialBridgeStreamCredit stream_credit = 10;
    CredentialBridgeStreamClose stream_close = 11;
  }
}

// Closed, material-free operations for the selected ssh identity. The authority
// infers slot=ssh, route=ssh-agent and identities/sign permission; callers cannot
// select an arbitrary credential, destination, agent command or provider route.
// The original deadline covers every hop and is never refreshed by a relay.
message CredentialSshRequest {
  string request_id = 1;
  uint64 deadline_unix_ms = 2;
  oneof operation {
    CredentialSshIdentitiesRequest identities = 3;
    CredentialSshSignRequest sign = 4;
  }
}

message CredentialSshIdentitiesRequest {}

message CredentialSshSignRequest {
  bytes public_key_blob = 1;
  bytes data = 2 [debug_redact = true];
  uint32 flags = 3;
}

// Exactly one authority-selected public identity. Imported comments are never
// carried across this boundary. The SSH wire adapter uses a fixed comment.
message CredentialSshIdentity {
  bytes public_key_blob = 1;
}

message CredentialSshSignature {
  // SSH-encoded algorithm and signature, checked by the selected-agent owner.
  bytes signature_blob = 1 [debug_redact = true];
}

message CredentialSshResponse {
  string request_id = 1;
  oneof result {
    CredentialSshIdentity identity = 2;
    CredentialSshSignature signature = 3;
    CredentialBridgeFailureReason failure = 4;
  }
}

// One actual launcher asks for the environment's already-selected application
// sources. No arbitrary key, project, owner or provider is request-selectable.
// The peer checks selection_sha256 against current authoritative metadata,
// authenticates the existing environment generation and rechecks before reply.
message EnvironmentProjectionRequest {
  string request_id = 1;
  bytes recipient_public_key = 2;
  bytes selection_sha256 = 3;
  uint64 deadline_unix_ms = 4;
  // Only an authenticated native owner adds its complete selected LOCAL
  // inventories. A workload request must leave this empty. These names choose
  // no platform scope; the remote authority retains its admitted selection.
  repeated EnvironmentProjectionInventory local_inventories = 5;
}

message EnvironmentProjectionResponse {
  string request_id = 1;
  oneof result {
    bytes sealed_projection = 2;
    CredentialBridgeFailureReason failure = 3;
    // Returned only to the composing native owner, never to a workload.
    EnvironmentProjectionComposition composition = 4;
  }
}

enum EnvironmentProjectionSource {
  ENVIRONMENT_PROJECTION_SOURCE_UNSPECIFIED = 0;
  ENVIRONMENT_PROJECTION_SOURCE_ORGANIZATION = 1;
  ENVIRONMENT_PROJECTION_SOURCE_PROJECT = 2;
  ENVIRONMENT_PROJECTION_SOURCE_USER = 3;
}

// Complete, bounded names for one exact already-selected source. The owning
// request/response field fixes Local or Platform; the sender cannot choose a
// contributor role. No plaintext value or protected-store identifier is here.
message EnvironmentProjectionInventory {
  EnvironmentProjectionSource source = 1;
  string source_identity = 2;
  repeated string keys = 3;
}

message EnvironmentProjectionComposition {
  bytes sealed_platform_fragment = 1;
  repeated EnvironmentProjectionInventory platform_inventories = 2;
}

// The workspace daemon asks for the Sandbox creator's personal Codex ChatGPT
// login, sealed to a fresh recipient key it holds, to write Codex's own
// auth.json. Sent only on an epoch whose Open lists "codex-login". The request
// names no credential, owner or profile: the broker rederives the selected
// Codex grant and delivers only an Active OAuth login owned by the creator,
// selected by the creator's own confirmed profile.
message CodexLoginRequest {
  string request_id = 1;
  bytes recipient_public_key = 2;
  // At most 30 seconds after the request is made, never extended by a relay.
  uint64 deadline_unix_ms = 3;
}

message CodexLoginResponse {
  string request_id = 1;
  oneof result {
    // Recipient-sealed access token, ID token, account ID and refresh time.
    // The plaintext format has no refresh-token field.
    bytes sealed_login = 2 [debug_redact = true];
    // Only DENIED (no deliverable login: an API key, a credential needing
    // Reconnect, a revoked, organization-owned or another user's credential,
    // or Codex not selected) or UNAVAILABLE (retry later).
    CredentialBridgeFailureReason failure = 3;
  }
}

// The workspace daemon asks for the Sandbox creator's personal Claude sign-in,
// sealed to a fresh recipient key it holds, to write Claude Code's own
// claude.ai login (`claudeAiOauth` in ~/.claude/.credentials.json). Sent only
// on an epoch whose Open lists "claude-login". Like CodexLoginRequest, it names
// no credential, owner or profile: the broker rederives the selected Anthropic
// grant and delivers only an Active Claude sign-in owned by the creator,
// selected by the creator's own confirmed profile.
message ClaudeLoginRequest {
  string request_id = 1;
  bytes recipient_public_key = 2;
  // At most 30 seconds after the request is made, never extended by a relay.
  uint64 deadline_unix_ms = 3;
}

message ClaudeLoginResponse {
  string request_id = 1;
  oneof result {
    // Recipient-sealed access token, its expiry, the granted scopes, the plan
    // and rate-limit tier, and the refresh time. The plaintext format has no
    // refresh-token field.
    bytes sealed_login = 2 [debug_redact = true];
    // Only DENIED (no deliverable sign-in: an API key, a Claude subscription
    // token, a credential needing Reconnect, a revoked, organization-owned or
    // another user's credential, or Anthropic not selected) or UNAVAILABLE
    // (retry later).
    CredentialBridgeFailureReason failure = 3;
  }
}
