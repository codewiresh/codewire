syntax = "proto3";

package codewire.internal.v1;

// WorkspaceBindingService binds one identity-free workspace Pod to the
// environment orchestration recorded for it. The caller is identified only
// by TokenReview of a Pod-bound projected token with the exact audience
// codewire.internal.workspace-binding.v1, on the dedicated listener only.
//
// Every method also requires the TCP peer to be the bound Pod's own IP, read
// by the reviewed Pod UID, and the listener serves TLS with the orchestration
// internal identity.
service WorkspaceBindingService {
  // Returns this Pod's binding. An unbound Pod waits up to wait_seconds, then
  // gets not_found and retries. A bound Pod gets the same binding again.
  rpc BindWorkspace(BindWorkspaceRequest) returns (BindWorkspaceResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Issues a fresh access grant to the bound Pod: a new peer token for the
  // binding's environment and operation generation. Daemons call it at half
  // the current token's lifetime.
  rpc RefreshAccess(RefreshAccessRequest) returns (RefreshAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Records the bound Pod's SSH host public key for that Pod, noting the
  // binding's environment and operation generation. Write-once per Pod: the
  // same key again succeeds, a different key is failed_precondition. A Pod
  // that replaces another records its own key.
  rpc RecordHostKey(RecordHostKeyRequest) returns (RecordHostKeyResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Allocates a UDP peer-relay endpoint between the bound environment's
  // tailnet node and one peer, with orchestration's own allocator
  // credential. failed_precondition when the runtime has no peer relay.
  rpc AllocatePeerRelay(AllocatePeerRelayRequest) returns (AllocatePeerRelayResponse);

  // Issues one enrollment code for the bound environment's Mesh network
  // node: one use, 60 seconds, bound to this Pod, the binding's operation
  // generation, and the environment's attachment. The daemon presents it once
  // to open one Mesh peer coordinate stream, and asks again for every new
  // stream. failed_precondition when the environment joins no network or
  // this platform has no hosted Mesh.
  rpc IssueMeshEnrollment(IssueMeshEnrollmentRequest) returns (IssueMeshEnrollmentResponse);

  // Records how far this Pod's Mesh network membership has come.
  rpc ReportMeshAttachment(ReportMeshAttachmentRequest) returns (ReportMeshAttachmentResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message BindWorkspaceRequest {
  // 0-20. The server clamps. Pod identity never travels in the message.
  uint32 wait_seconds = 1;
}

message BindWorkspaceResponse {
  string environment_id = 1;
  // The reviewed Pod UID. The daemon compares it with its downward-API UID.
  string pod_uid = 2;
  // The operation generation captured when the binding was recorded.
  int64 operation_generation = 3;
  // Bearer for the private daemon RPC boundary of this Pod only.
  string daemon_credential = 4 [debug_redact = true];
  // Lowercase hex SHA-256 of the admitted projection selection, or empty.
  string projection_selection_sha256 = 5;
  // Canonical ManagedCredentialClients encoding captured at bind.
  string managed_credential_clients = 6;
  // The environment's tailnet and SSH access for this Pod.
  WorkspaceAccess access = 7;
  // The environment's declared working directory, or empty. Sessions launched
  // without a working directory start here when it exists.
  string working_directory = 8;
}

// WorkspaceAccess is everything the bound daemon needs to serve its
// environment's tailnet peer. It names only public endpoints: the internal
// coordinator, allocator and relay bind addresses never enter the sandbox.
message WorkspaceAccess {
  // Peer token for the coordinator: environment, scope "peer", operation
  // generation and expiry, signed with a key derived for this purpose only.
  string peer_token = 1 [debug_redact = true];
  // Unix seconds at which peer_token expires. Refresh at half its lifetime.
  int64 peer_token_expires_at = 2;
  // The operation generation peer_token is bound to.
  int64 operation_generation = 3;
  // Public https origin of the coordinator (the CoordinatorService route).
  string coordinator_url = 4;
  // host:port endpoints the peer advertises for direct UDP: the
  // environment's own LoadBalancer. Empty when direct UDP is not configured.
  repeated string direct_udp_endpoints = 5;
  // Public host:port endpoints of the UDP peer relay. Empty when the
  // runtime has no peer relay; allocations use AllocatePeerRelay.
  repeated string peer_relay_endpoints = 6;
  // The environment's exposed application ports (1-65535, ascending,
  // without duplicates). The daemon serves exactly these on its tailnet
  // address, forwarded to its own loopback; orchestration also pushes each
  // change to the daemon, and every grant restates the current set.
  repeated int32 app_ports = 7;
  // The hosted Mesh network the environment joins, or absent. Non-secret:
  // the daemon asks IssueMeshEnrollment for the capability to join it.
  WorkspaceMeshAttachment mesh = 8;
}

// WorkspaceMeshAttachment names the one hosted Mesh network node the bound
// environment serves. It holds no credential.
message WorkspaceMeshAttachment {
  // Public https origin of the hosted Mesh service.
  string mesh_url = 1;
  string org_id = 2;
  string network_id = 3;
  // The node's fixed name in the network: the environment's name.
  string node_name = 4;
}

message RefreshAccessRequest {}

message RefreshAccessResponse {
  WorkspaceAccess access = 1;
}

message RecordHostKeyRequest {
  // One OpenSSH public key line: "ssh-ed25519 <base64>", no comment.
  string public_key_openssh = 1;
}

message RecordHostKeyResponse {}

message AllocatePeerRelayRequest {
  // Exactly two disco public keys ("discokey:<64 hex>"): this environment's
  // node first, then the peer's. The order is preserved in the response.
  repeated string disco_keys = 1;
  // The caller's relay-allocation generation, echoed back.
  uint32 relay_generation = 2;
}

message AllocatePeerRelayResponse {
  uint32 relay_generation = 1;
  string server_disco_key = 2;
  repeated string disco_keys = 3;
  uint64 lamport_id = 4;
  uint32 vni = 5;
  uint64 bind_lifetime_ns = 6;
  uint64 steady_state_lifetime_ns = 7;
  // Public host:port addresses of the relay endpoint.
  repeated string addr_ports = 8;
}

message IssueMeshEnrollmentRequest {}

message IssueMeshEnrollmentResponse {
  // One-use Mesh peer enrollment capability ("cw_eenr_<64 hex>").
  string enrollment_code = 1 [debug_redact = true];
  // Unix seconds after which the code is refused.
  int64 expires_at = 2;
  WorkspaceMeshAttachment attachment = 3;
}

// MeshAttachmentReport is what the daemon observed of its Mesh membership.
enum MeshAttachmentReport {
  MESH_ATTACHMENT_REPORT_UNSPECIFIED = 0;
  // The daemon's Mesh peer stream is open.
  MESH_ATTACHMENT_REPORT_ATTACHED = 1;
  MESH_ATTACHMENT_REPORT_MESH_UNREACHABLE = 2;
  MESH_ATTACHMENT_REPORT_NETWORK_NOT_FOUND = 3;
  MESH_ATTACHMENT_REPORT_NOT_A_MEMBER = 4;
  MESH_ATTACHMENT_REPORT_NODE_NAME_TAKEN = 5;
  MESH_ATTACHMENT_REPORT_REVOKED = 6;
  MESH_ATTACHMENT_REPORT_REFUSED = 7;
}

message ReportMeshAttachmentRequest {
  MeshAttachmentReport report = 1;
}

message ReportMeshAttachmentResponse {}
