syntax = "proto3";

package codewire.internal.v1;

// EnvironmentCredentialService authenticates only the active environment's
// Bearer auth_token. Its operations can refresh or return secret-bearing forge
// credentials, so neither is a cacheable read.
service EnvironmentCredentialService {
  rpc IssueGitHubCredentials(IssueGitHubCredentialsRequest) returns (IssueGitHubCredentialsResponse);
  rpc IssueGitCredentials(IssueGitCredentialsRequest) returns (IssueGitCredentialsResponse);
}

message IssueGitHubCredentialsRequest {}

message IssueGitCredentialsRequest {
  // Empty selects github.com, matching the existing raw endpoint.
  string host = 1;
}

message IssueGitHubCredentialsResponse {
  string token = 1;
  string username = 2;
  string host = 3;
}

message IssueGitCredentialsResponse {
  string token = 1;
  string username = 2;
  string host = 3;
}
