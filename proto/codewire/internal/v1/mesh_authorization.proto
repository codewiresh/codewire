syntax = "proto3";

package codewire.internal.v1;

import "codewire/v1/organization.proto";

// MeshAuthorizationService resolves one already-presented caller credential at
// the canonical identity boundary. The credential itself travels only through
// reserved sensitive metadata and never enters these messages.
service MeshAuthorizationService {
  // ResolveMeshAuthorization returns typed context on success and a canonical
  // unauthenticated or permission_denied error on failure. It never returns a
  // boolean decision.
  rpc ResolveMeshAuthorization(ResolveMeshAuthorizationRequest) returns (ResolveMeshAuthorizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum MeshAuthorizationPrincipalKind {
  MESH_AUTHORIZATION_PRINCIPAL_KIND_UNSPECIFIED = 0;
  MESH_AUTHORIZATION_PRINCIPAL_KIND_USER = 1;
  MESH_AUTHORIZATION_PRINCIPAL_KIND_ENVIRONMENT = 2;
}

// MeshAuthorizationCredentialKind classifies the existing caller credential;
// it does not contain or mint secret material.
enum MeshAuthorizationCredentialKind {
  MESH_AUTHORIZATION_CREDENTIAL_KIND_UNSPECIFIED = 0;
  MESH_AUTHORIZATION_CREDENTIAL_KIND_SESSION_COOKIE = 1;
  MESH_AUTHORIZATION_CREDENTIAL_KIND_OAUTH_BEARER = 2;
  MESH_AUTHORIZATION_CREDENTIAL_KIND_API_KEY = 3;
  MESH_AUTHORIZATION_CREDENTIAL_KIND_ENVIRONMENT_TOKEN = 4;
}

message ResolveMeshAuthorizationRequest {
  string org_id = 1;
}

message ResolveMeshAuthorizationResponse {
  MeshAuthorizationContext context = 1;
}

message MeshAuthorizationContext {
  string principal_id = 1;
  MeshAuthorizationPrincipalKind principal_kind = 2;
  string org_id = 3;
  codewire.v1.OrgRole role = 4;
  MeshAuthorizationCredentialKind credential_kind = 5;
}
