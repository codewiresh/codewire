syntax = "proto3";

package codewire.internal.v1;

// GatewayBindingService accepts only a short-lived, exact-audience Kubernetes
// identity projected into the environment's gateway Pod. The handler derives
// the Pod identity exclusively from TokenReview, then issues a fresh
// coordinate-scoped sidecar token for that Pod's bound environment.
service GatewayBindingService {
  // IssueGatewayBinding resolves a pod binding and issues a fresh sidecar
  // token. A not-yet-bound pod receives not_found so the gateway can retry.
  rpc IssueGatewayBinding(IssueGatewayBindingRequest) returns (IssueGatewayBindingResponse);

  // Returns the daemon credential for the environment's currently bound
  // workspace Pod. Unlike IssueGatewayBinding it does not require
  // state=running. It returns not_found until a binding is recorded.
  rpc IssueGatewayDaemonCredential(IssueGatewayDaemonCredentialRequest)
      returns (IssueGatewayDaemonCredentialResponse);
}

message IssueGatewayBindingRequest {
  // Pod identity comes only from the reviewed bearer. Retain the former
  // caller-selected tuple as permanently unavailable wire space.
  reserved 1, 2;
  reserved "pod", "namespace";
}

message IssueGatewayBindingResponse {
  string environment_id = 1;
  string sidecar_token = 2 [debug_redact = true];
  // Empty when the workspace pod IP is not known yet.
  string workspace_pod_ip = 3;
  repeated int32 app_ports = 4;
  // Unset when no enabled transport zone is resolved for the runtime node.
  RuntimeTransport runtime_transport = 5;
}

message IssueGatewayDaemonCredentialRequest {}

message IssueGatewayDaemonCredentialResponse {
  string daemon_credential = 1 [debug_redact = true];
  // Lets the gateway notice a replaced workspace Pod.
  string workspace_pod_uid = 2;
}

// RuntimeTransport is the complete current gateway binding surface. Presence
// of each nested value is significant and is preserved by the generated
// client conversion in WS09 WI-5.
message RuntimeTransport {
  string runtime_region = 1;
  string transport_zone = 2;
  PeerRelayTransport peer_relay = 3;
  DirectUdpTransport direct_udp = 4;
  EndpointList stun = 5;
  EndpointList derp = 6;
}

message PeerRelayTransport {
  repeated string public_endpoints = 1;
  optional string dns = 2;
  string allocator_url = 3;
  repeated string bind_addrs = 4;
}

message DirectUdpTransport {
  optional string vip = 1;
  optional int32 port_start = 2;
  optional int32 port_end = 3;
}

message EndpointList {
  repeated string endpoints = 1;
}
