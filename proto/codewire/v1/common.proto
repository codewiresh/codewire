syntax = "proto3";

// Shared messages for the codewire.v1 package (public-intended surface).
package codewire.v1;

// ScaffoldPlaceholder proved the initial codegen path. It remains deprecated
// because codewire.v1 uses FILE-level breaking checks; new code must not use it.
message ScaffoldPlaceholder {
  option deprecated = true;

  string note = 1;
}

// RepoEntry selects one repository and an optional branch or immutable
// revision during setup. Branch and revision are mutually exclusive.
message RepoEntry {
  string url = 1;
  string branch = 2;
  // Optional normalized checkout directory strictly below /workspace.
  // When omitted, the checkout directory remains /workspace/{repo_name}.
  string mount_path = 3;
  string revision = 4;
}

// AppPort requests one application port during setup. Access is an extensible
// setup vocabulary today; PortAccess is used for persisted environment ports.
message AppPort {
  int32 port = 1;
  string label = 2;
  string access = 3;
}

// SetupAgent enables one setup agent. Type is an extensible agent identifier.
message SetupAgent {
  string type = 1;
}

// SetupConfig is the reusable environment/preset setup configuration.
message SetupConfig {
  reserved 10;
  reserved "agent_env";

  string repo_url = 1;
  string branch = 2;
  repeated RepoEntry repos = 3;
  string install_command = 4;
  string startup_script = 5;
  map<string, string> env_vars = 6;
  repeated SetupAgent agents = 7;
  optional bool install_agents = 8;
  string agent = 9;
  repeated AppPort app_ports = 11;
  optional bool include_org_secrets = 12;
  optional bool include_user_secrets = 13;
  // Canonical versioned project intent. Legacy fields above remain readable;
  // new writers populate this field after normalization.
  ProjectSpec project_spec = 14;
}

// Deprecated wire tombstone for the retired top-level workspace mode. New
// writers leave the field below unspecified; placement-specific filesystem
// behavior is expressed outside the portable project contract.
enum ProjectWorkspaceMode {
  option deprecated = true;
  PROJECT_WORKSPACE_MODE_UNSPECIFIED = 0;
  PROJECT_WORKSPACE_MODE_AUTO = 1;
  PROJECT_WORKSPACE_MODE_CLONE = 2;
  PROJECT_WORKSPACE_MODE_DIRECT = 3;
}

enum ProjectSkillSource {
  PROJECT_SKILL_SOURCE_UNSPECIFIED = 0;
  PROJECT_SKILL_SOURCE_REPOSITORY = 1;
  PROJECT_SKILL_SOURCE_USER = 2;
}

message ProjectAgents {
  optional bool install = 1;
  repeated string tools = 2;
}

message ProjectSkillSelection {
  ProjectSkillSource source = 1;
  string reference = 2;
  repeated string agents = 3;
}

message ProjectResources {
  optional uint32 cpu_millicores = 1;
  optional uint64 memory_mib = 2;
  optional uint64 disk_gib = 3;
}

message ProjectSecretBindings {
  string project = 1;
  // Deprecated preview fields retained only for wire compatibility. Runtime
  // adapters reject their presence; new clients use organization and user.
  optional bool include_org = 2 [deprecated = true];
  optional bool include_user = 3 [deprecated = true];
  bool organization = 4;
  bool user = 5;
}

// Deprecated wire tombstone for the unpublished preview credential map. New
// code must use ProjectAccessBinding.
message ProjectCredentialReference {
  option deprecated = true;

  string provider = 1;
  string account = 2;
}

// ProjectAccessBinding selects one scope-qualified access profile. It carries
// no credential ID, provider material, protected-store reference, or token.
message ProjectAccessBinding {
  string profile = 1;
}

// ProjectSpec is the deterministic, placement-neutral codewire.yaml model.
// It contains guest/workspace intent and opaque bindings only. Resolved host
// paths, secret values, provider tokens, platform credentials, VMM state, and
// backend sockets are intentionally absent.
message ProjectSpec {
  reserved 10;
  reserved "agent_environment";

  uint32 schema_version = 1;
  string preset = 2;
  string image = 3;
  repeated RepoEntry repositories = 4;
  string working_directory = 5;
  string install_command = 6;
  string startup_script = 7;
  map<string, string> environment = 8;
  ProjectAgents agents = 9;
  repeated ProjectSkillSelection skills = 11;
  repeated AppPort application_ports = 12;
  ProjectResources resources = 13;
  ProjectSecretBindings secrets = 14;
  // Deprecated preview fields retained only for wire compatibility. Runtime
  // adapters reject their use; new clients use access and local workspace
  // directives outside this portable message.
  map<string, ProjectCredentialReference> credentials = 15 [deprecated = true];
  ProjectWorkspaceMode workspace_mode = 16 [deprecated = true];
  ProjectAccessBinding access = 17;
}
