syntax = "proto3";

package codewire.v1;

import "codewire/bridge/v1/bridge.proto";

// The isolated platform credential authority serves this owner-OAuth-only
// bridge. It never accepts organization API keys, browser cookies or purported
// Pod identities. The original OAuth authority bounds the entire connection;
// reconnecting requires fresh admission, never replay of an old request.
service CredentialDelegationService {
  rpc DelegateCredentials(stream DelegateCredentialsRequest)
      returns (stream DelegateCredentialsResponse);
}

// An explicit immutable selection, not a credential or transferable grant.
message CredentialDelegationProfile {
  string profile_id = 1;
  uint64 profile_revision = 2;
}

// First and only selection frame. The authenticated owner asserts the native
// environment operation; this is not independent VM attestation. The server
// rechecks current owner, organization, membership, sources and selected profile
// before provider operations or recipient-sealed application delivery.
message CredentialDelegationOpen {
  codewire.bridge.v1.CredentialBridgeOpen runtime = 1;
  string org_id = 2;
  // Digest of the native environment's canonical ProjectSpec, not the distinct
  // platform selection encoding. Neither a digest nor names prove authority.
  bytes selection_sha256 = 3;
  optional string project_id = 4;
  bool user_secrets = 5;
  bool organization_secrets = 6;
  CredentialDelegationProfile profile = 7;
  // Names only: suppress configured winners before any application value read.
  // No environment values, provider credential IDs or protected-store paths.
  repeated string ordinary_environment_keys = 8;
  // Native managed-route reservations supplement the platform-derived set.
  // These can deny a collision, never authorize an otherwise forbidden source.
  repeated string reserved_environment_keys = 9;
}

message DelegateCredentialsRequest {
  oneof input {
    CredentialDelegationOpen open = 1;
    // Ready for the exact admitted runtime must precede operation frames.
    codewire.bridge.v1.CredentialBridgeGuestMessage frame = 2;
  }
}

message DelegateCredentialsResponse {
  oneof output {
    // Only filtered provider traffic, public SSH responses or recipient-bound
    // application ciphertext. There is no raw provider-material read operation.
    codewire.bridge.v1.CredentialBridgeHostMessage frame = 1;
    // Exactly once, before operation responses and only after Ready and the
    // final current-authority check. Echoes the accepted names-only selection;
    // sending Open or receiving HTTP 200 alone never establishes admission.
    CredentialDelegationOpen admitted = 2;
  }
}
