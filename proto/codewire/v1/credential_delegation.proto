syntax = "proto3";

package codewire.v1;

import "codewire/bridge/v1/bridge.proto";

// The isolated platform credential authority serves this owner-OAuth-only
// bridge. It never accepts organization API keys, browser cookies or purported
// Pod identities. The original OAuth authority bounds the entire connection;
// reconnecting requires fresh admission, never replay of an old request.
service CredentialDelegationService {
  rpc DelegateCredentials(stream DelegateCredentialsRequest)
      returns (stream DelegateCredentialsResponse);
  // A local VM's front door joins an admitted delegation epoch (#4909): the
  // same owner OAuth, and that epoch's `front_door_epoch` handle in the
  // request header CREDENTIAL_BRIDGE_EPOCH_HANDLE_HEADER. The platform serves
  // it as the bridge's front-door entry, decided by this method and never by
  // a frame, on that epoch's broker, with the environment of the epoch's
  // admitted selection. An unknown, ended or other owner's handle is
  // PERMISSION_DENIED, the same for each; a second join of a live epoch is
  // ALREADY_EXISTS. It ends with its epoch.
  rpc FrontDoorDelegation(stream FrontDoorDelegationRequest)
      returns (stream FrontDoorDelegationResponse);
  // A local VM's seed placeholders on a platform profile (#4001), asked
  // before the boot starts: for each requested slot the selected profile
  // grants, the placeholder that boot's delegation leases carry. The
  // selection is admitted exactly as DelegateCredentials admits it, before
  // any key is read; a refused one is PERMISSION_DENIED, the same for each
  // reason. A key that can't be read or created is UNAVAILABLE, and more
  // than 30 calls by one user in a minute RESOURCE_EXHAUSTED. Never logged.
  rpc EnvironmentCredentialPlaceholders(EnvironmentCredentialPlaceholdersRequest)
      returns (EnvironmentCredentialPlaceholdersResponse);
  // A local VM's record of its platform sources' bound secrets (#4003),
  // asked before the boot starts and admitted exactly as
  // EnvironmentCredentialPlaceholders is: the same selection checks, the
  // same refusals and the same rate limit. The platform reads the
  // selection's sources once and answers every platform secret its
  // projection would take, bound or plain, and the record's seal. The boot
  // carries both back in its delegation's Open. A selection that can't be
  // read, or a seal key that can't be reached, is UNAVAILABLE; a platform
  // with no seal key answers UNIMPLEMENTED.
  rpc EnvironmentBoundSecrets(EnvironmentBoundSecretsRequest)
      returns (EnvironmentBoundSecretsResponse);
}

message EnvironmentBoundSecretsRequest {
  // The boot's selection, exactly as EnvironmentCredentialPlaceholdersRequest
  // carries it, with no record.
  CredentialDelegationOpen selection = 1;
}

message EnvironmentBoundSecretsResponse {
  LocalBootBoundSecrets record = 1;
}

// A local VM boot's sealed record of its platform sources' secrets (#4003;
// docs/dev/SECRETS-AND-CREDENTIALS.md, "A local VM's platform sources").
// Names, generations, hosts and prefixes only: never a value or a
// placeholder.
message LocalBootBoundSecrets {
  repeated LocalBootBoundSecret secrets = 1;
  // The platform's HMAC over the record, the environment, its generation
  // and the selection, as OpenBao transit's `vault:vN:` string, unchanged.
  string seal = 2;
}

// One platform secret the boot's projection takes. `bound` is set for a
// secret bound at the read.
message LocalBootBoundSecret {
  string path = 1;
  string key = 2;
  uint64 binding_generation = 3;
  LocalBootBinding bound = 4;
}

message LocalBootBinding {
  // The binding's UUID, lowercase and hyphenated.
  string binding_id = 1;
  optional string prefix = 2;
  repeated string hosts = 3;
}

message EnvironmentCredentialPlaceholdersRequest {
  // The boot's selection, exactly as its delegation's Open carries it: the
  // organization, the profile at its revision, the environment ID (a
  // canonical, non-nil UUID) and generation its bridge Ready carries, and
  // the binding's own selection_sha256.
  CredentialDelegationOpen selection = 1;
  // At most 16, each a slot a profile can select, none twice.
  repeated string capability_slots = 2;
}

message EnvironmentCredentialPlaceholder {
  string capability_slot = 1;
  // `cwp1_` and 43 base64url characters. Never logged.
  string placeholder = 2 [debug_redact = true];
}

message EnvironmentCredentialPlaceholdersResponse {
  // Only the requested slots the profile grants, in request order.
  repeated EnvironmentCredentialPlaceholder placeholders = 1;
}

// One front-door bridge frame from the front door, carried unchanged.
message FrontDoorDelegationRequest {
  codewire.bridge.v1.CredentialBridgeGuestMessage frame = 1;
}

message FrontDoorDelegationResponse {
  oneof output {
    // Exactly once, first, after the join is admitted.
    FrontDoorDelegationAdmitted admitted = 1;
    // One front-door bridge frame from the platform broker, unchanged.
    codewire.bridge.v1.CredentialBridgeHostMessage frame = 2;
  }
}

// A join's admission: the front-door operations its epoch serves, which the
// local relay pins and lists, exactly, in its session's Open.
message FrontDoorDelegationAdmitted {
  repeated string capabilities = 1;
}

// An explicit immutable selection, not a credential or transferable grant.
message CredentialDelegationProfile {
  string profile_id = 1;
  uint64 profile_revision = 2;
}

// First and only selection frame. The authenticated owner asserts the native
// environment operation; this is not independent VM attestation. The server
// rechecks current owner, organization, membership, sources and selected profile
// before provider operations or recipient-sealed application delivery.
message CredentialDelegationOpen {
  codewire.bridge.v1.CredentialBridgeOpen runtime = 1;
  string org_id = 2;
  // Digest of the native environment's canonical ProjectSpec, not the distinct
  // platform selection encoding. Neither a digest nor names prove authority.
  bytes selection_sha256 = 3;
  optional string project_id = 4;
  bool user_secrets = 5;
  bool organization_secrets = 6;
  CredentialDelegationProfile profile = 7;
  // Names only: suppress configured winners before any application value read.
  // No environment values, provider credential IDs or protected-store paths.
  repeated string ordinary_environment_keys = 8;
  // Native managed-route reservations supplement the platform-derived set.
  // These can deny a collision, never authorize an otherwise forbidden source.
  repeated string reserved_environment_keys = 9;
  // The boot intercepts its agent hosts (#4909): its relay sets this exactly
  // when the boot's front door is on. The platform then seals this epoch's
  // agent logins with placeholders from the first request, and issues a
  // front-door handle; unset, logins are delivered as before and no front
  // door can join. Part of the exact admission echo.
  bool front_door = 10;
  // The boot's sealed record of its platform sources' bound secrets
  // (#4003), as EnvironmentBoundSecrets answered it. Absent from a boot
  // that has none, which counts as recording nothing. The platform verifies
  // its seal against this Open's environment, generation and selection
  // before anything else. Part of the exact admission echo.
  LocalBootBoundSecrets bound_secrets = 11;
}

// An empty message that keeps an idle admitted stream from being ended by a
// proxy's idle timer. It carries no state, grants nothing and never reaches
// the bridge.
message CredentialDelegationKeepalive {}

message DelegateCredentialsRequest {
  oneof input {
    CredentialDelegationOpen open = 1;
    // Ready for the exact admitted runtime must precede operation frames.
    codewire.bridge.v1.CredentialBridgeGuestMessage frame = 2;
    // Only after admission, and only when the admitted response set
    // accepts_keepalive. At most one may wait for its answer.
    CredentialDelegationKeepalive keepalive = 3;
  }
}

message DelegateCredentialsResponse {
  oneof output {
    // Only filtered provider traffic, public SSH responses or recipient-bound
    // application ciphertext. There is no raw provider-material read operation.
    codewire.bridge.v1.CredentialBridgeHostMessage frame = 1;
    // Exactly once, before operation responses and only after Ready and the
    // final current-authority check. Echoes the accepted names-only selection;
    // sending Open or receiving HTTP 200 alone never establishes admission.
    CredentialDelegationOpen admitted = 2;
    // Exactly one answer per request keepalive; never sent unasked.
    CredentialDelegationKeepalive keepalive = 3;
  }
  // Set only beside `admitted`: this server answers request keepalives.
  // Outside the oneof, so a client that predates it ignores the field, and
  // outside the echoed selection, so the exact admission echo is unchanged.
  bool accepts_keepalive = 4;
  // Set only beside `admitted`, like `accepts_keepalive`: this epoch's
  // handle for FrontDoorDelegation, exactly 32 random bytes. It grants
  // nothing alone and lives only as long as the epoch. Empty means this server
  // joins no front door to the epoch; a client refuses any other length.
  // Never logged.
  bytes front_door_epoch = 5 [debug_redact = true];
}
