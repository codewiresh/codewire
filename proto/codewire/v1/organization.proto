syntax = "proto3";

package codewire.v1;

import "google/protobuf/timestamp.proto";

// OrganizationService manages organizations, membership, assignments, and
// invitations. GetInvitationByToken needs no credential; every other method
// requires an authenticated product credential. ListMyInvitations and
// AcceptInvitation by invitation_id act for the caller's own account, so an
// organization API key cannot call them.
service OrganizationService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc GetMemberAssignments(GetMemberAssignmentsRequest) returns (GetMemberAssignmentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateMemberAssignments(UpdateMemberAssignmentsRequest) returns (UpdateMemberAssignmentsResponse);

  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  // ListMyInvitations lists the pending, unexpired invitations addressed to
  // the caller's own email address. It lists none while that address is
  // unverified.
  rpc ListMyInvitations(ListMyInvitationsRequest) returns (ListMyInvitationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AcceptInvitation joins the caller to the invitation's organization. In
  // either form the caller's email address must be verified and must equal
  // the invitation's, compared case-insensitively; an unverified caller gets
  // failed_precondition. To a caller at another address the invitation is
  // not_found in every state, as an unknown token or id is.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  // GetInvitationByToken resolves an opaque invitation token without a
  // credential. Unknown and incorrect tokens both return not_found.
  rpc GetInvitationByToken(GetInvitationByTokenRequest) returns (GetInvitationByTokenResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum OrgRole {
  ORG_ROLE_UNSPECIFIED = 0;
  ORG_ROLE_OWNER = 1;
  ORG_ROLE_ADMIN = 2;
  ORG_ROLE_MEMBER = 3;
}

enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_PENDING = 1;
  INVITATION_STATUS_ACCEPTED = 2;
  INVITATION_STATUS_REVOKED = 3;
  INVITATION_STATUS_EXPIRED = 4;
}

// OrganizationDeletionState describes the retained organization row while a
// durable deletion operation is running or awaiting an owner retry. Successful
// deletion is represented by the organization becoming not_found.
enum OrganizationDeletionState {
  ORGANIZATION_DELETION_STATE_UNSPECIFIED = 0;
  ORGANIZATION_DELETION_STATE_ACTIVE = 1;
  ORGANIZATION_DELETION_STATE_DELETING = 2;
  ORGANIZATION_DELETION_STATE_DELETE_FAILED = 3;
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Present on GetOrganization while the retained row exists. List and create
  // responses may omit lifecycle fields that are not part of their query.
  optional OrganizationDeletionState deletion_state = 7;
  optional string deletion_operation_id = 8;
  optional string deletion_failure_code = 9;
}

message OrganizationMembership {
  Organization organization = 1;
  OrgRole role = 2;
  // Assignment names are intentionally extensible strings.
  repeated string assignments = 3;
  string billing_plan = 4;
  string billing_status = 5;
  optional google.protobuf.Timestamp trial_ends_at = 6;
}

message OrgMember {
  string id = 1;
  string org_id = 2;
  string user_id = 3;
  OrgRole role = 4;
  string email = 5;
  optional string name = 6;
  optional string image = 7;
  repeated string assignments = 8;
  google.protobuf.Timestamp created_at = 9;
}

message OrgInvitation {
  string id = 1;
  string org_id = 2;
  string org_name = 3;
  string email = 4;
  OrgRole role = 5;
  string invited_by = 6;
  optional string inviter_name = 7;
  reserved 8;
  reserved "token";
  InvitationStatus status = 9;
  google.protobuf.Timestamp expires_at = 10;
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp accepted_at = 12;
  // Set by ListInvitations and ListMyInvitations; empty elsewhere.
  string org_slug = 13;
  // Assignments the invitee receives on acceptance. Set by ListInvitations
  // and ListMyInvitations; empty elsewhere.
  repeated string assignments = 14;
}

message ListOrganizationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListOrganizationsResponse {
  repeated OrganizationMembership organizations = 1;
  string next_page_token = 2;
}

message CreateOrganizationRequest {
  string name = 1;
  string slug = 2;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message GetOrganizationRequest {
  string org_id = 1;
}

message GetOrganizationResponse {
  Organization organization = 1;
  repeated OrgMember members = 2;
}

message DeleteOrganizationRequest {
  string org_id = 1;
}

message DeleteOrganizationResponse {
  string operation_id = 1;
  OrganizationDeletionState state = 2;
}

message ListMembersRequest {
  string org_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListMembersResponse {
  repeated OrgMember members = 1;
  string next_page_token = 2;
}

message UpdateMemberRoleRequest {
  string org_id = 1;
  string user_id = 2;
  OrgRole role = 3;
}

message UpdateMemberRoleResponse {}

message RemoveMemberRequest {
  string org_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message GetMemberAssignmentsRequest {
  string org_id = 1;
  string member_id = 2;
}

message GetMemberAssignmentsResponse {
  repeated string assignments = 1;
}

message UpdateMemberAssignmentsRequest {
  string org_id = 1;
  string member_id = 2;
  repeated string assignments = 3;
}

message UpdateMemberAssignmentsResponse {
  repeated string assignments = 1;
}

message ListInvitationsRequest {
  string org_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListInvitationsResponse {
  repeated OrgInvitation invitations = 1;
  string next_page_token = 2;
}

message CreateInvitationRequest {
  string org_id = 1;
  string email = 2;
  // UNSPECIFIED defaults to MEMBER.
  OrgRole role = 3;
  repeated string assignments = 4;
}

message CreateInvitationResponse {
  OrgInvitation invitation = 1;
  // One-time invitation capability. Only its SHA-256 digest is persisted.
  string token = 2 [debug_redact = true];
}

message RevokeInvitationRequest {
  string org_id = 1;
  string invitation_id = 2;
}

message RevokeInvitationResponse {}

message ListMyInvitationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListMyInvitationsResponse {
  // Only pending invitations whose expiry is still ahead.
  repeated OrgInvitation invitations = 1;
  string next_page_token = 2;
}

// Exactly one of token and invitation_id is set; neither or both is
// invalid_argument.
message AcceptInvitationRequest {
  // One-time bearer capability presented by the invitee, as in the emailed
  // link.
  string token = 1 [debug_redact = true];
  // An invitation from ListMyInvitations. The caller's verified email address
  // stands in for the token.
  string invitation_id = 2;
}

message AcceptInvitationResponse {
  string org_id = 1;
}

message GetInvitationByTokenRequest {
  // One-time bearer capability used to resolve public invitation metadata.
  string token = 1 [debug_redact = true];
}

message GetInvitationByTokenResponse {
  OrgInvitation invitation = 1;
}
