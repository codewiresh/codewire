syntax = "proto3";

package codewire.v1;

// Personal platform credential metadata, served by orchestration without a
// material store or KEK provider. Account sessions and scoped OAuth are allowed;
// organization API keys are not. Authentication determines the owner.
service CredentialService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Served by the isolated credential authority, never by orchestration or the
// gateway. Requires the original codewire.api OAuth bearer throughout each
// operation. No method accepts or returns provider credential material.
service CredentialMutationService {
  // One connection owns the enrollment: one challenge followed by committed
  // metadata. Disconnect cancels unfinished enrollment, not an issued COMMIT.
  // Missing terminal metadata is an uncertain outcome: reconcile by name using
  // GetCredential, never automatically reenroll or revoke the provider login.
  rpc EnrollCodex(EnrollCodexRequest) returns (stream EnrollCodexResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}

enum CredentialAuthenticationKind {
  CREDENTIAL_AUTHENTICATION_KIND_UNSPECIFIED = 0;
  CREDENTIAL_AUTHENTICATION_KIND_OAUTH = 1;
  CREDENTIAL_AUTHENTICATION_KIND_API_KEY = 2;
  CREDENTIAL_AUTHENTICATION_KIND_ACCESS_TOKEN = 3;
  CREDENTIAL_AUTHENTICATION_KIND_GITHUB_APP = 4;
}

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_REVOKED = 2;
  CREDENTIAL_STATUS_EXPIRED = 3;
  CREDENTIAL_STATUS_REFRESH_FAILED = 4;
}

// Metadata only. The owner is the authenticated account and placement is
// platform. Internal material versions and encrypted storage references have
// no public representation.
message Credential {
  string id = 1;
  string name = 2;
  string provider = 3;
  CredentialAuthenticationKind authentication_kind = 4;
  optional string account_hint = 5;
  CredentialStatus status = 6;
  // Optional hard use deadline, not the provider's access-token expiry.
  optional uint64 expires_at_unix = 7;
  uint64 revocation_generation = 8;
}

message ListCredentialsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
  string next_page_token = 2;
}

message GetCredentialRequest {
  oneof selector {
    string credential_id = 1;
    // Exact owner-scoped case-insensitive name, not a fuzzy search.
    string name = 2;
  }
}

message GetCredentialResponse {
  Credential credential = 1;
}

message EnrollCodexRequest {
  // The server selects its pinned official Codex executable and isolated home.
  string name = 1;
}

// The only provider prompt information exposed by enrollment. The one-time
// code is intended for the requesting user, never routine logs or analytics.
message CodexDeviceChallenge {
  string verification_url = 1;
  string user_code = 2;
  // Conservative original deadline; neither challenge delivery nor retries
  // extend the original enrollment or Codewire OAuth authority.
  uint64 expires_at_unix = 3;
}

message EnrollCodexResponse {
  oneof event {
    CodexDeviceChallenge challenge = 1;
    Credential credential = 2;
  }
}

message RevokeCredentialRequest {
  string credential_id = 1;
  uint64 expected_revocation_generation = 2;
}

message RevokeCredentialResponse {
  Credential credential = 1;
}

message DeleteCredentialRequest {
  string credential_id = 1;
  uint64 expected_revocation_generation = 2;
}

// Only revoked, unreferenced records can be deleted. This removes Codewire
// storage; it is not a promise of remote provider logout or revocation.
message DeleteCredentialResponse {}
