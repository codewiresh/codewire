syntax = "proto3";

package codewire.v1;

// Personal platform credential metadata, served by orchestration without a
// material store or KEK provider. Account sessions and scoped OAuth are allowed;
// organization API keys are not. Authentication determines the owner.
service CredentialService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Finite account-owned GitHub discovery, served only by the isolated credential
// authority. Requires an exact-Origin browser session or original codewire.api
// OAuth bearer; organization API keys are denied. The profile must be the
// authenticated owner's active GitHub OAuth identity. Discovery never creates
// an environment, profile, or runtime grant.
service GithubRepositoryService {
  rpc ListGithubRepositories(ListGithubRepositoriesRequest) returns (ListGithubRepositoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The installations of the Codewire GitHub App that have not yet granted
  // what Codewire needs, checked live with the same authenticated owner's
  // own active GitHub connection, under the same authority as
  // ListGithubRepositories. Like discovery, it may renew an expiring App
  // token first. Answers login, installation ID and account kind only.
  rpc ListGithubPendingPermissions(ListGithubPendingPermissionsRequest) returns (ListGithubPendingPermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListGithubPendingPermissionsRequest {}

// Empty when every installation has granted what Codewire needs. Never a
// token, permission set or provider response.
message ListGithubPendingPermissionsResponse {
  repeated GithubAppPendingPermissions pending_permissions = 1;
}

message ListGithubRepositoriesRequest {
  reserved 1;
  reserved 2;
  // Zero selects the server default. Positive values must not exceed 100.
  int32 page_size = 3;
  // Opaque, bounded continuation for this exact credential version.
  // It is not an authority or a provider URL. Empty starts a new listing.
  string page_token = 4;
}

// Allowlisted metadata only, never raw provider JSON, tokens, arbitrary clone
// destinations or provider pagination links. Listing does not guarantee a later
// checkout: current provider access and the selected credential are rechecked.
message GithubRepository {
  string repository_id = 1;
  string full_name = 2;
  string default_branch = 3;
  string clone_url = 4;
  bool is_private = 5;
  bool archived = 6;
  bool disabled = 7;
}

message ListGithubRepositoriesResponse {
  repeated GithubRepository repositories = 1;
  string next_page_token = 2;
}

// Served by the isolated credential authority, never by orchestration or the
// gateway. Requires either the exact signed-in browser session from the
// configured public Origin or the original codewire.api OAuth bearer throughout
// each operation. Organization API keys are denied. Explicit API-key and SSH
// import are write-only; no method returns provider credential material.
service CredentialMutationService {
  // One connection owns the enrollment: one challenge followed by committed
  // metadata. Disconnect cancels unfinished enrollment, not an issued COMMIT.
  // Missing terminal metadata is an uncertain outcome: reconcile by name using
  // GetCredential, never automatically reenroll or revoke the provider login.
  rpc EnrollCodex(EnrollCodexRequest) returns (stream EnrollCodexResponse);
  // Same owned challenge/publication protocol, using the Codewire GitHub
  // App's device login. This remains the device-code path used by `cw`.
  rpc EnrollGithub(EnrollGithubRequest) returns (stream EnrollGithubResponse);
  // Browser GitHub connections use the configured GitHub App installation and
  // user-to-server callback flow. The authorization code is write-only and is
  // exchanged only by the isolated credential authority that holds the App
  // client secret; it never reaches a Sandbox or dashboard response. This
  // method requires the original browser session authority; the `cw` CLI uses
  // EnrollGithub's device-code path instead.
  rpc CompleteGithubAppAuthorization(CompleteGithubAppAuthorizationRequest) returns (CompleteGithubAppAuthorizationResponse);
  rpc AddApiKeyCredential(AddApiKeyCredentialRequest) returns (AddApiKeyCredentialResponse);
  // Write-only Claude subscription token import by paste. The owner runs
  // `claude setup-token` (Claude Pro, Max, Team or Enterprise) and supplies
  // the printed token; Codewire never runs Claude Code's OAuth client. The
  // server stores it as the anthropic provider's OAuth kind with a hard expiry
  // one year after this call. It is personal: organization API keys and
  // organizations are denied. The token is never returned, and it is never
  // delivered to a Sandbox: the credential broker injects it.
  rpc AddClaudeSubscriptionTokenCredential(AddClaudeSubscriptionTokenCredentialRequest) returns (AddClaudeSubscriptionTokenCredentialResponse);
  rpc RenameCredential(RenameCredentialRequest) returns (RenameCredentialResponse);
  rpc RotateApiKeyCredential(RotateApiKeyCredentialRequest) returns (RotateApiKeyCredentialResponse);
  rpc GenerateSshCredential(GenerateSshCredentialRequest) returns (GenerateSshCredentialResponse);
  rpc AddSshCredential(AddSshCredentialRequest) returns (AddSshCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}

enum CredentialAuthenticationKind {
  CREDENTIAL_AUTHENTICATION_KIND_UNSPECIFIED = 0;
  CREDENTIAL_AUTHENTICATION_KIND_OAUTH = 1;
  CREDENTIAL_AUTHENTICATION_KIND_API_KEY = 2;
  CREDENTIAL_AUTHENTICATION_KIND_ACCESS_TOKEN = 3;
  CREDENTIAL_AUTHENTICATION_KIND_GITHUB_APP = 4;
  CREDENTIAL_AUTHENTICATION_KIND_SSH_KEY = 7;
  // Claude Code's own claude.ai sign-in for the anthropic provider: a personal
  // OAuth login whose refresh token Codewire rotates. Distinct from the pasted
  // Claude subscription token, which is the provider's OAUTH kind.
  CREDENTIAL_AUTHENTICATION_KIND_CLAUDE_SIGN_IN = 8;
}

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_REVOKED = 2;
  CREDENTIAL_STATUS_EXPIRED = 3;
  CREDENTIAL_STATUS_REFRESH_FAILED = 4;
}

// Metadata only. The owner is the authenticated account and placement is
// platform. Internal material versions and encrypted storage references have
// no public representation.
message Credential {
  string id = 1;
  string name = 2;
  string provider = 3;
  CredentialAuthenticationKind authentication_kind = 4;
  optional string account_hint = 5;
  CredentialStatus status = 6;
  // Optional hard use deadline, not the provider's access-token expiry.
  optional uint64 expires_at_unix = 7;
  uint64 revocation_generation = 8;
  // Present only for SSH; public registration data, never private key bytes.
  SshPublicKey ssh_public_key = 9;
}

message SshPublicKey {
  string openssh = 1;
  string fingerprint = 2;
}

// The authority generates an Ed25519 identity and protects its private key.
// Enrollment never attaches an identity to a profile or environment.
message GenerateSshCredentialRequest {
  string name = 1;
  optional uint64 expires_at_unix = 2;
}

message GenerateSshCredentialResponse {
  Credential credential = 1;
}

// Explicit write-only OpenSSH import; no paths or ambient agent discovery.
message AddSshCredentialRequest {
  string name = 1;
  bytes private_key = 2 [debug_redact = true];
  optional bytes passphrase = 3 [debug_redact = true];
  optional uint64 expires_at_unix = 4;
}

message AddSshCredentialResponse {
  Credential credential = 1;
}

message ListCredentialsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
  string next_page_token = 2;
}

message GetCredentialRequest {
  oneof selector {
    string credential_id = 1;
    // Exact owner-scoped case-insensitive name, not a fuzzy search.
    string name = 2;
  }
}

message GetCredentialResponse {
  Credential credential = 1;
}

message EnrollCodexRequest {
  // The server runs the Codex device login itself; no provider CLI runs.
  string name = 1;
  // Reconnect the resolved identity. Both fields must be present together and
  // the generation positive. Absence means create-only, never implicit upsert.
  optional string credential_id = 2;
  optional uint64 expected_revocation_generation = 3;
}

message EnrollGithubRequest {
  // The server runs the GitHub App device login itself; no provider CLI runs.
  string name = 1;
  // Both reconnect fields must be present together, with a positive generation.
  // Absence means create-only; reconnect preserves identity and profile bindings.
  optional string credential_id = 2;
  optional uint64 expected_revocation_generation = 3;
}

// Explicit write-only API-key enrollment. Only openai and anthropic are
// admitted in V1; the server chooses the API-key authentication kind.
message AddApiKeyCredentialRequest {
  string provider = 1;
  string name = 2;
  bytes value = 3 [debug_redact = true];
  optional uint64 expires_at_unix = 4;
}

message AddApiKeyCredentialResponse {
  Credential credential = 1;
}

// Shape is checked only: a bounded token without whitespace. No provider call
// is made. Both replacement fields must be present together, with a positive
// generation, the existing credential's exact name and a Claude subscription
// token at that generation; replacement keeps its identity and profile
// bindings, sets status Active and restarts its one-year expiry. Absence
// means create-only, never an implicit upsert.
message AddClaudeSubscriptionTokenCredentialRequest {
  string name = 1;
  bytes token = 2 [debug_redact = true];
  optional string credential_id = 3;
  optional uint64 expected_revocation_generation = 4;
}

message AddClaudeSubscriptionTokenCredentialResponse {
  Credential credential = 1;
}

// Metadata-only rename: preserve identity, material, generations and bindings.
// Both the observed name and generation must still match at publication.
message RenameCredentialRequest {
  string credential_id = 1;
  uint64 expected_revocation_generation = 2;
  string expected_name = 3;
  string name = 4;
}

message RenameCredentialResponse {
  Credential credential = 1;
}

// Explicit owner-requested OpenAI/Anthropic API-key replacement, not refresh.
// Preserves identity and profile bindings and sets status Active, including
// when replacing a revoked credential. Omitted expiry clears the hard deadline.
// Missing acknowledgement is uncertain; inspect metadata before retrying.
message RotateApiKeyCredentialRequest {
  string credential_id = 1;
  uint64 expected_revocation_generation = 2;
  bytes value = 3 [debug_redact = true];
  optional uint64 expires_at_unix = 4;
}

message RotateApiKeyCredentialResponse {
  Credential credential = 1;
}

// The only provider prompt information exposed by enrollment. The one-time
// code is intended for the requesting user, never routine logs or analytics.
message CodexDeviceChallenge {
  string verification_url = 1;
  string user_code = 2 [debug_redact = true];
  // Conservative original deadline; neither challenge delivery nor retries
  // extend the original enrollment or Codewire OAuth authority.
  uint64 expires_at_unix = 3;
}

message EnrollCodexResponse {
  oneof event {
    CodexDeviceChallenge challenge = 1;
    Credential credential = 2;
  }
}

message GithubDeviceChallenge {
  // Always https://github.com/login/device, never a caller-selected URL.
  string verification_url = 1;
  string user_code = 2 [debug_redact = true];
  // Original deadline, never extended by delivery, polling or publication.
  uint64 expires_at_unix = 3;
}

message EnrollGithubResponse {
  oneof event {
    GithubDeviceChallenge challenge = 1;
    Credential credential = 2;
  }
  // Only with `credential`: installations still short of the permissions
  // Codewire needs at connect time. Never stored.
  repeated GithubAppPendingPermissions pending_permissions = 3;
}

// An installation of the Codewire GitHub App that has not granted every
// permission Codewire needs (contents and pull requests: write; metadata:
// read), usually because its owner has not yet accepted the App's updated
// permission request. Public installation metadata only.
message GithubAppPendingPermissions {
  // The user, organization or enterprise login the App is installed on.
  string account = 1;
  uint64 installation_id = 2;
  GithubAppAccountKind account_kind = 3;
}

enum GithubAppAccountKind {
  GITHUB_APP_ACCOUNT_KIND_UNSPECIFIED = 0;
  GITHUB_APP_ACCOUNT_KIND_USER = 1;
  GITHUB_APP_ACCOUNT_KIND_ORGANIZATION = 2;
  // Accepted in the enterprise's own GitHub settings; there is no
  // per-installation page to link.
  GITHUB_APP_ACCOUNT_KIND_ENTERPRISE = 3;
}

message CompleteGithubAppAuthorizationRequest {
  // Opaque GitHub App user-to-server callback code. It is accepted only by
  // the isolated credential authority and is never returned.
  bytes code = 1 [debug_redact = true];
  // Both reconnect fields must be present together, with a positive generation.
  // Absence creates a new credential named from the verified GitHub login.
  optional string credential_id = 2;
  optional uint64 expected_revocation_generation = 3;
}

message CompleteGithubAppAuthorizationResponse {
  Credential credential = 1;
  // Installations still short of the permissions Codewire needs at connect
  // time. Never stored.
  repeated GithubAppPendingPermissions pending_permissions = 2;
}

message RevokeCredentialRequest {
  string credential_id = 1;
  uint64 expected_revocation_generation = 2;
}

message RevokeCredentialResponse {
  Credential credential = 1;
}

message DeleteCredentialRequest {
  string credential_id = 1;
  uint64 expected_revocation_generation = 2;
}

// Only revoked, unreferenced records can be deleted. This removes Codewire
// storage; it is not a promise of remote provider logout or revocation.
message DeleteCredentialResponse {}
