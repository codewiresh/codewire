syntax = "proto3";

package codewire.v1;

import "google/protobuf/timestamp.proto";

// FileService lists and transfers files in a running sandbox environment.
service FileService {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  // Uploads one part of a file, so a large file crosses proxies that cap a
  // request body and resumes after an interruption. A request without chunks
  // only reports the bytes held for the upload.
  rpc UploadFilePart(stream UploadFilePartRequest) returns (UploadFilePartResponse);
}

message ListFilesRequest {
  string org_id = 1;
  string environment_id = 2;
  string path = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
  string next_page_token = 2;
}

message FileEntry {
  string name = 1;
  int64 size = 2;
  bool is_dir = 3;
  uint32 mode = 4;
  google.protobuf.Timestamp mod_time = 5;
}

message DownloadFileRequest {
  string org_id = 1;
  string environment_id = 2;
  string path = 3;
}

message DownloadFileResponse {
  oneof payload {
    FileEntry info = 1;
    bytes chunk = 2;
  }
}

message UploadFileRequest {
  oneof payload {
    UploadFileHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadFileHeader {
  string org_id = 1;
  string environment_id = 2;
  string path = 3;
}

message UploadFileResponse {
  string path = 1;
  int64 size = 2;
}

message UploadFilePartRequest {
  oneof payload {
    UploadFilePartHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadFilePartHeader {
  string org_id = 1;
  string environment_id = 2;
  string path = 3;
  // Names the upload across its parts: 16 to 64 letters, digits, '-' or '_'.
  // The same id must always carry the same file's bytes.
  string upload_id = 4;
  // Where this part's chunks start; it must equal the bytes already held.
  int64 offset = 5;
  // Publish the file at path once this part's chunks are written.
  bool finish = 6;
}

message UploadFilePartResponse {
  string path = 1;
  string upload_id = 2;
  // The bytes held for the upload after this request.
  int64 size = 3;
  // Whether the file is now published at path.
  bool finished = 4;
}
