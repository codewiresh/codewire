syntax = "proto3";

package codewire.v1;

import "google/protobuf/timestamp.proto";

// SecretService manages organization secrets, user secrets, and
// organization-scoped secret projects. Secret values are write-only: no
// response message in this service contains a value field.
service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc RenameSecret(RenameSecretRequest) returns (RenameSecretResponse);

  rpc ListUserSecrets(ListUserSecretsRequest) returns (ListUserSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetUserSecret(SetUserSecretRequest) returns (SetUserSecretResponse);
  rpc DeleteUserSecret(DeleteUserSecretRequest) returns (DeleteUserSecretResponse);
  rpc RenameUserSecret(RenameUserSecretRequest) returns (RenameUserSecretResponse);

  rpc ListSecretProjects(ListSecretProjectsRequest) returns (ListSecretProjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateSecretProject(CreateSecretProjectRequest) returns (CreateSecretProjectResponse);
  rpc DeleteSecretProject(DeleteSecretProjectRequest) returns (DeleteSecretProjectResponse);
  rpc ListProjectSecrets(ListProjectSecretsRequest) returns (ListProjectSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetProjectSecret(SetProjectSecretRequest) returns (SetProjectSecretResponse);
  rpc DeleteProjectSecret(DeleteProjectSecretRequest) returns (DeleteProjectSecretResponse);
  rpc RenameProjectSecret(RenameProjectSecretRequest) returns (RenameProjectSecretResponse);

  // Resolves only key/source metadata for one canonical environment intent.
  // The implementation must not read or return secret values.
  rpc PreviewWorkloadSecretResolution(PreviewWorkloadSecretResolutionRequest) returns (PreviewWorkloadSecretResolutionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// SecretMetadata exposes only a key, backend-provided timestamps and, for a
// secret bound to hosts, its binding. Secret values are never readable
// through the client-facing API.
message SecretMetadata {
  string key = 1;
  optional google.protobuf.Timestamp created_at = 2;
  optional google.protobuf.Timestamp updated_at = 3;
  // Absent for a plain secret.
  optional SecretBinding binding = 4;
}

// The hosts a secret is sent to and how it is presented there (#4003;
// docs/dev/SECRETS-AND-CREDENTIALS.md, "Host-bound application secrets"). The
// environment holds a placeholder, and the front door sends the value only
// on a request to one of these hosts.
message SecretBinding {
  // 1 to 16 exact public DNS names, port 443 only.
  repeated string hosts = 1;
  oneof presentation {
    SecretHeaderPresentation header = 2;
    SecretBasicPresentation basic = 3;
    SecretBasicUserPresentation basic_user = 4;
  }
  // Put before the placeholder; empty for none.
  string prefix = 5;
  // The preset that filled this binding, for display; empty for none.
  string preset = 6;
  // Output only: moves with every change but to the hosts or the value.
  uint64 binding_generation = 7;
}

// `<scheme> <value>` in one or two headers.
message SecretHeaderPresentation {
  // Empty means Authorization.
  repeated string headers = 1;
  // Absent means Bearer; "none" sends the value alone.
  optional string scheme = 2;
}

// HTTP Basic with the value as the password.
message SecretBasicPresentation {
  // Empty means x-access-token.
  string username = 1;
}

// HTTP Basic with the value as the user name and an empty password.
message SecretBasicUserPresentation {}

message ListSecretsRequest {
  string org_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message SetSecretRequest {
  string org_id = 1;
  string key = 2;
  // Empty only for a change to a bound secret that needs no value:
  // removing some of its hosts, or changing its prefix.
  string value = 3 [debug_redact = true];
  // Binds the secret, or changes its binding. Absent with plain false keeps
  // the binding it has, so a new value never unbinds a secret.
  optional SecretBinding binding = 4;
  // Removes every host: the secret becomes plain. Needs the value.
  bool plain = 5;
}

message SetSecretResponse {}

message DeleteSecretRequest {
  string org_id = 1;
  string key = 2;
}

message DeleteSecretResponse {}

message RenameSecretRequest {
  string org_id = 1;
  string key = 2;
  string new_key = 3;
}

message RenameSecretResponse {}

message ListUserSecretsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListUserSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message SetUserSecretRequest {
  string key = 1;
  // Empty only for a change to a bound secret that needs no value:
  // removing some of its hosts, or changing its prefix.
  string value = 2 [debug_redact = true];
  // Binds the secret, or changes its binding. Absent with plain false keeps
  // the binding it has, so a new value never unbinds a secret.
  optional SecretBinding binding = 3;
  // Removes every host: the secret becomes plain. Needs the value.
  bool plain = 4;
}

message SetUserSecretResponse {}

message DeleteUserSecretRequest {
  string key = 1;
}

message DeleteUserSecretResponse {}

message RenameUserSecretRequest {
  string key = 1;
  string new_key = 2;
}

message RenameUserSecretResponse {}

message SecretProject {
  string id = 1;
  string org_id = 2;
  string name = 3;
  int64 secret_count = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListSecretProjectsRequest {
  string org_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretProjectsResponse {
  repeated SecretProject secret_projects = 1;
  string next_page_token = 2;
}

message CreateSecretProjectRequest {
  string org_id = 1;
  string name = 2;
}

message CreateSecretProjectResponse {
  SecretProject secret_project = 1;
}

message DeleteSecretProjectRequest {
  string org_id = 1;
  string secret_project_id = 2;
}

message DeleteSecretProjectResponse {}

message ListProjectSecretsRequest {
  string org_id = 1;
  string secret_project_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListProjectSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message SetProjectSecretRequest {
  string org_id = 1;
  string secret_project_id = 2;
  string key = 3;
  // Empty only for a change to a bound secret that needs no value:
  // removing some of its hosts, or changing its prefix.
  string value = 4 [debug_redact = true];
  // Binds the secret, or changes its binding. Absent with plain false keeps
  // the binding it has, so a new value never unbinds a secret.
  optional SecretBinding binding = 5;
  // Removes every host: the secret becomes plain. Needs the value.
  bool plain = 6;
}

message SetProjectSecretResponse {}

message DeleteProjectSecretRequest {
  string org_id = 1;
  string secret_project_id = 2;
  string key = 3;
}

message DeleteProjectSecretResponse {}

message RenameProjectSecretRequest {
  string org_id = 1;
  string secret_project_id = 2;
  string key = 3;
  string new_key = 4;
}

message RenameProjectSecretResponse {}

enum WorkloadSecretSource {
  WORKLOAD_SECRET_SOURCE_UNSPECIFIED = 0;
  WORKLOAD_SECRET_SOURCE_ORGANIZATION = 1;
  WORKLOAD_SECRET_SOURCE_PROJECT = 2;
  WORKLOAD_SECRET_SOURCE_USER = 3;
  WORKLOAD_SECRET_SOURCE_EXPLICIT_ENVIRONMENT = 4;
}

message PreviewWorkloadSecretResolutionRequest {
  string org_id = 1;
  bool organization = 2;
  string secret_project_id = 3;
  bool user = 4;
  repeated string explicit_environment_keys = 5;
}

message ResolvedWorkloadSecretMetadata {
  string key = 1;
  WorkloadSecretSource source = 2;
  repeated WorkloadSecretSource overridden_sources = 3;
}

message PreviewWorkloadSecretResolutionResponse {
  repeated ResolvedWorkloadSecretMetadata secrets = 1;
}
