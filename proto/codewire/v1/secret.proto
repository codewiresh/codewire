syntax = "proto3";

package codewire.v1;

import "google/protobuf/timestamp.proto";

// SecretService manages organization secrets, user secrets, and
// organization-scoped secret projects. Secret values are write-only: no
// response message in this service contains a value field.
service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc RenameSecret(RenameSecretRequest) returns (RenameSecretResponse);

  rpc ListUserSecrets(ListUserSecretsRequest) returns (ListUserSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetUserSecret(SetUserSecretRequest) returns (SetUserSecretResponse);
  rpc DeleteUserSecret(DeleteUserSecretRequest) returns (DeleteUserSecretResponse);
  rpc RenameUserSecret(RenameUserSecretRequest) returns (RenameUserSecretResponse);

  rpc ListSecretProjects(ListSecretProjectsRequest) returns (ListSecretProjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateSecretProject(CreateSecretProjectRequest) returns (CreateSecretProjectResponse);
  rpc DeleteSecretProject(DeleteSecretProjectRequest) returns (DeleteSecretProjectResponse);
  rpc ListProjectSecrets(ListProjectSecretsRequest) returns (ListProjectSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetProjectSecret(SetProjectSecretRequest) returns (SetProjectSecretResponse);
  rpc DeleteProjectSecret(DeleteProjectSecretRequest) returns (DeleteProjectSecretResponse);
  rpc RenameProjectSecret(RenameProjectSecretRequest) returns (RenameProjectSecretResponse);
}

// SecretMetadata exposes only a key and backend-provided timestamps. Secret
// values are never readable through the client-facing API.
message SecretMetadata {
  string key = 1;
  optional google.protobuf.Timestamp created_at = 2;
  optional google.protobuf.Timestamp updated_at = 3;
}

message ListSecretsRequest {
  string org_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message SetSecretRequest {
  string org_id = 1;
  string key = 2;
  string value = 3 [debug_redact = true];
}

message SetSecretResponse {}

message DeleteSecretRequest {
  string org_id = 1;
  string key = 2;
}

message DeleteSecretResponse {}

message RenameSecretRequest {
  string org_id = 1;
  string key = 2;
  string new_key = 3;
}

message RenameSecretResponse {}

message ListUserSecretsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListUserSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message SetUserSecretRequest {
  string key = 1;
  string value = 2 [debug_redact = true];
}

message SetUserSecretResponse {}

message DeleteUserSecretRequest {
  string key = 1;
}

message DeleteUserSecretResponse {}

message RenameUserSecretRequest {
  string key = 1;
  string new_key = 2;
}

message RenameUserSecretResponse {}

message SecretProject {
  string id = 1;
  string org_id = 2;
  string name = 3;
  int64 secret_count = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListSecretProjectsRequest {
  string org_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretProjectsResponse {
  repeated SecretProject secret_projects = 1;
  string next_page_token = 2;
}

message CreateSecretProjectRequest {
  string org_id = 1;
  string name = 2;
}

message CreateSecretProjectResponse {
  SecretProject secret_project = 1;
}

message DeleteSecretProjectRequest {
  string org_id = 1;
  string secret_project_id = 2;
}

message DeleteSecretProjectResponse {}

message ListProjectSecretsRequest {
  string org_id = 1;
  string secret_project_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListProjectSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

message SetProjectSecretRequest {
  string org_id = 1;
  string secret_project_id = 2;
  string key = 3;
  string value = 4 [debug_redact = true];
}

message SetProjectSecretResponse {}

message DeleteProjectSecretRequest {
  string org_id = 1;
  string secret_project_id = 2;
  string key = 3;
}

message DeleteProjectSecretResponse {}

message RenameProjectSecretRequest {
  string org_id = 1;
  string secret_project_id = 2;
  string key = 3;
  string new_key = 4;
}

message RenameProjectSecretResponse {}
