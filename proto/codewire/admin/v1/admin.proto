syntax = "proto3";

package codewire.admin.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// AdminService exposes global operator reads and the audited organization
// environment-quota writes. Every method requires a browser session or
// OAuth-issued user bearer belonging to a global administrator;
// organization-scoped API keys cannot call this service.
service AdminService {
  // GetStats returns global environment counts and current-month usage totals.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListOrganizations returns every organization ordered by name.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAuditLogs returns newest-first global audit entries.
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListEnvironmentLifecycleJournal returns newest-first lifecycle entries for
  // one environment.
  rpc ListEnvironmentLifecycleJournal(ListEnvironmentLifecycleJournalRequest)
      returns (ListEnvironmentLifecycleJournalResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetEnvironmentStartupSummary returns global startup backlog counts and
  // phase-duration percentiles within the requested window.
  rpc GetEnvironmentStartupSummary(GetEnvironmentStartupSummaryRequest)
      returns (GetEnvironmentStartupSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetEnvironmentStartupTimings returns the latest startup timing for every
  // known phase of one environment.
  rpc GetEnvironmentStartupTimings(GetEnvironmentStartupTimingsRequest)
      returns (GetEnvironmentStartupTimingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetOrganizationEnvironmentQuota returns one organization's explicit
  // environment quota, when it has one, and the quota creates are checked
  // against: none on the Unlimited rate card, else the explicit quota, else
  // the defaults.
  rpc GetOrganizationEnvironmentQuota(GetOrganizationEnvironmentQuotaRequest)
      returns (GetOrganizationEnvironmentQuotaResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetOrganizationEnvironmentQuota creates or replaces one organization's
  // explicit environment quota and writes an audit entry.
  rpc SetOrganizationEnvironmentQuota(SetOrganizationEnvironmentQuotaRequest)
      returns (SetOrganizationEnvironmentQuotaResponse);

  // ClearOrganizationEnvironmentQuota removes one organization's explicit
  // environment quota, so the defaults apply again, and writes an audit
  // entry. Clearing an organization without one changes nothing.
  rpc ClearOrganizationEnvironmentQuota(ClearOrganizationEnvironmentQuotaRequest)
      returns (ClearOrganizationEnvironmentQuotaResponse);

  // GetOrganizationOverview returns what an operator inspects for one
  // organization: identity, members, billing, environment quota, current
  // environment usage and API keys (names and dates only, never key
  // material).
  rpc GetOrganizationOverview(GetOrganizationOverviewRequest)
      returns (GetOrganizationOverviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetDefaultEnvironmentQuota returns the limits an organization without
  // its own quota gets, unless it is on the Unlimited rate card.
  rpc GetDefaultEnvironmentQuota(GetDefaultEnvironmentQuotaRequest)
      returns (GetDefaultEnvironmentQuotaResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetDefaultEnvironmentQuota replaces those defaults and writes an audit
  // entry with the previous and new values.
  rpc SetDefaultEnvironmentQuota(SetDefaultEnvironmentQuotaRequest)
      returns (SetDefaultEnvironmentQuotaResponse);

  // SetOrganizationRateCard assigns one organization's rate card: regular,
  // discounted or unlimited. A change writes an audit entry; assigning the
  // card it already has changes nothing.
  rpc SetOrganizationRateCard(SetOrganizationRateCardRequest)
      returns (SetOrganizationRateCardResponse);

  // SetOrganizationDedicatedCpu sets whether one organization's new sandboxes
  // reserve a CPU per vCPU instead of sharing, and writes an audit entry. A
  // sandbox it already runs keeps its reservation until it is replaced. Setting
  // the value it already has changes nothing.
  rpc SetOrganizationDedicatedCpu(SetOrganizationDedicatedCpuRequest)
      returns (SetOrganizationDedicatedCpuResponse);

  // AdjustOrganizationCredit adds or removes compute credit with a reason,
  // as a ledger entry naming the administrator, and writes an audit entry.
  // A repeated idempotency key for the organization changes nothing.
  rpc AdjustOrganizationCredit(AdjustOrganizationCreditRequest)
      returns (AdjustOrganizationCreditResponse);
}

message GetStatsRequest {}

message GetStatsResponse {
  int64 total_environments = 1;
  int64 active_environments = 2;
  double monthly_cpu_hours = 3;
  double monthly_memory_gb_hours = 4;
  int64 monthly_cost_cents = 5;
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
  // organizations.billing_plan and billing_status, "none" when unset.
  string billing_plan = 5;
  string billing_status = 6;
  // New sandboxes reserve a CPU per vCPU instead of sharing.
  bool dedicated_cpu = 7;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message ListAuditLogsRequest {
  // Zero selects the server default of 50; the maximum is 200.
  int32 limit = 1;
  int32 offset = 2;
  // Empty means no action filter.
  string action = 3;
  // Empty means no severity filter.
  string severity = 4;
}

message AuditLogEntry {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string action = 3;
  optional string user_id = 4;
  optional string user_email = 5;
  optional string ip_address = 6;
  optional string user_agent = 7;
  // Unset when the stored metadata is NULL.
  google.protobuf.Struct metadata = 8;
  string severity = 9;
}

message ListAuditLogsResponse {
  repeated AuditLogEntry audit_logs = 1;
}

message ListEnvironmentLifecycleJournalRequest {
  string environment_id = 1;
  // Zero selects the server default of 100; the maximum is 500.
  int32 limit = 2;
}

message EnvironmentLifecycleJournalEntry {
  string id = 1;
  string environment_id = 2;
  string kind = 3;
  string actor = 4;
  string phase = 5;
  string status = 6;
  string from_state = 7;
  string to_state = 8;
  string checkpoint = 9;
  string reason = 10;
  // Always present; a stored SQL NULL is represented as protobuf null.
  google.protobuf.Value metadata = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ListEnvironmentLifecycleJournalResponse {
  repeated EnvironmentLifecycleJournalEntry entries = 1;
}

message GetEnvironmentStartupSummaryRequest {
  // Unset selects the server default of 240 minutes. Present values must be a
  // whole number of minutes because the existing shared query is minute-based.
  google.protobuf.Duration window = 1;
}

message StartupPhaseSummary {
  string phase = 1;
  int32 sample_count = 2;
  // Unset when the phase has no samples.
  google.protobuf.Duration p50 = 3;
  // Unset when the phase has no samples.
  google.protobuf.Duration p95 = 4;
}

message GetEnvironmentStartupSummaryResponse {
  google.protobuf.Timestamp generated_at = 1;
  google.protobuf.Duration window = 2;
  int32 starting_backlog_count = 3;
  int32 starting_backlog_over_5m_count = 4;
  int32 starting_backlog_over_10m_count = 5;
  int32 running_without_access_ready_count = 6;
  repeated StartupPhaseSummary phase_durations = 7;
}

message GetEnvironmentStartupTimingsRequest {
  string environment_id = 1;
}

message EnvironmentStartupTiming {
  string phase = 1;
  string status = 2;
  string message = 3;
  // Unset when the log entry has no numeric duration.
  google.protobuf.Duration duration = 4;
  // Always present; a stored SQL NULL is represented as protobuf null.
  google.protobuf.Value metadata = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetEnvironmentStartupTimingsResponse {
  string environment_id = 1;
  google.protobuf.Timestamp created_at = 2;
  repeated EnvironmentStartupTiming timings = 3;
}

// EnvironmentQuota bounds one organization's live environments. Each limit is
// -1 for unlimited or a positive value.
message EnvironmentQuota {
  int32 max_concurrent_environments = 1;
  int32 max_concurrent_sandbox = 2;
  int32 max_cpu_millicores = 3;
  int32 max_memory_mb = 4;
}

message GetOrganizationEnvironmentQuotaRequest {
  string organization_id = 1;
}

message GetOrganizationEnvironmentQuotaResponse {
  string organization_id = 1;
  // Unset when the organization has no explicit quota.
  EnvironmentQuota explicit = 2;
  EnvironmentQuota effective = 3;
}

message SetOrganizationEnvironmentQuotaRequest {
  string organization_id = 1;
  EnvironmentQuota quota = 2;
}

message SetOrganizationEnvironmentQuotaResponse {
  string organization_id = 1;
  EnvironmentQuota quota = 2;
}

message ClearOrganizationEnvironmentQuotaRequest {
  string organization_id = 1;
}

message ClearOrganizationEnvironmentQuotaResponse {
  string organization_id = 1;
  // True when an explicit quota existed and was removed.
  bool cleared = 2;
}

message GetOrganizationOverviewRequest {
  string organization_id = 1;
}

message OrganizationMember {
  string user_id = 1;
  string email = 2;
  string role = 3;
  google.protobuf.Timestamp joined_at = 4;
}

message OrganizationSubscription {
  // "environment" or "organization".
  string kind = 1;
  string plan = 2;
  string status = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message OrganizationBilling {
  // organizations.billing_plan and billing_status.
  string billing_plan = 1;
  string billing_status = 2;
  bool billing_exempt = 3;
  // The plan quotas and billing resolve: the newest live environment
  // subscription, else the newest live organization subscription, else a
  // live billing_plan; empty when none applies.
  string effective_plan = 4;
  // Subscriptions in active, trialing or past_due status, newest first.
  repeated OrganizationSubscription subscriptions = 5;
  // The organization's rate card: regular, discounted or unlimited.
  string rate_card = 6;
  // The prepaid compute credit, in nano-euros (1e-9 EUR); below zero when
  // usage outran it.
  int64 credit_balance_nano_eur = 7;
  // The newest credit ledger entries, newest first, at most 20.
  repeated CreditLedgerEntry recent_credit = 8;
}

message CreditLedgerEntry {
  // grant, usage, top_up or adjustment.
  string kind = 1;
  // Signed, in nano-euros: positive adds credit, negative draws it.
  int64 amount_nano_eur = 2;
  google.protobuf.Timestamp created_at = 3;
  // An adjustment's reason; empty for other entries.
  string reason = 4;
  // The administrator who made an adjustment; empty for other entries.
  string actor_user_id = 5;
}

message OrganizationEnvironmentUsage {
  // Environments consuming compute: not destroyed, destroying, error,
  // stopped or archived.
  int64 active_environments = 1;
  int64 active_sandboxes = 2;
  int64 cpu_millicores = 3;
  int64 memory_mb = 4;
}

message OrganizationApiKey {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  // Unset when the key was never used.
  google.protobuf.Timestamp last_used_at = 3;
  bool disabled = 4;
  // Unset when the key never expires.
  google.protobuf.Timestamp expires_at = 5;
}

message GetOrganizationOverviewResponse {
  Organization organization = 1;
  repeated OrganizationMember members = 2;
  OrganizationBilling billing = 3;
  GetOrganizationEnvironmentQuotaResponse quota = 4;
  OrganizationEnvironmentUsage usage = 5;
  // Newest first.
  repeated OrganizationApiKey api_keys = 6;
}

message GetDefaultEnvironmentQuotaRequest {}

message GetDefaultEnvironmentQuotaResponse {
  EnvironmentQuota quota = 1;
  // False when no stored defaults exist and the built-in ones apply.
  bool stored = 2;
}

message SetDefaultEnvironmentQuotaRequest {
  EnvironmentQuota quota = 1;
}

message SetDefaultEnvironmentQuotaResponse {
  EnvironmentQuota quota = 1;
}

message SetOrganizationRateCardRequest {
  string organization_id = 1;
  // regular, discounted or unlimited.
  string rate_card = 2;
}

message SetOrganizationRateCardResponse {
  string organization_id = 1;
  string rate_card = 2;
  string previous_rate_card = 3;
}

message SetOrganizationDedicatedCpuRequest {
  string organization_id = 1;
  bool dedicated_cpu = 2;
}

message SetOrganizationDedicatedCpuResponse {
  string organization_id = 1;
  bool dedicated_cpu = 2;
  bool previous_dedicated_cpu = 3;
}

message AdjustOrganizationCreditRequest {
  string organization_id = 1;
  // Non-zero, at most EUR 100,000 either way, in nano-euros.
  int64 amount_nano_eur = 2;
  // Why, for the ledger and the audit log; 1 to 500 characters.
  string reason = 3;
  // 1 to 128 letters, digits, '-' or '_'; a retry with the same key
  // applies nothing again.
  string idempotency_key = 4;
}

message AdjustOrganizationCreditResponse {
  string organization_id = 1;
  int64 balance_nano_eur = 2;
  // False when the idempotency key had already been applied.
  bool applied = 3;
}
