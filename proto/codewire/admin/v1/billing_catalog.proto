syntax = "proto3";

package codewire.admin.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// BillingCatalogService exposes the platform billing catalog and the
// administrator-only subscription migration commands. It is served by
// codewire-billing, while AdminService in this package is served by
// codewire-orchestration; edge routing is therefore by full service name.
service BillingCatalogService {
  // GetCatalog returns all catalog plans, prices, and settings.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreatePlan creates one catalog plan.
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);

  // UpdatePlan replaces one existing catalog plan.
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);

  // SetPlanArchived changes one catalog plan's archive state.
  rpc SetPlanArchived(SetPlanArchivedRequest) returns (SetPlanArchivedResponse);

  // CreatePrice creates one catalog price mapping.
  rpc CreatePrice(CreatePriceRequest) returns (CreatePriceResponse);

  // UpdatePrice changes one existing catalog price mapping.
  rpc UpdatePrice(UpdatePriceRequest) returns (UpdatePriceResponse);

  // SetPriceArchived changes one catalog price mapping's archive state.
  rpc SetPriceArchived(SetPriceArchivedRequest) returns (SetPriceArchivedResponse);

  // UpdateSetting changes one integer-valued catalog setting.
  rpc UpdateSetting(UpdateSettingRequest) returns (UpdateSettingResponse);

  // PreviewSubscriptionMigration evaluates a migration candidate set. It is a
  // command because it may invoke Stripe and must not be cached.
  rpc PreviewSubscriptionMigration(PreviewSubscriptionMigrationRequest)
      returns (PreviewSubscriptionMigrationResponse);

  // RunSubscriptionMigration applies a migration and records an audit event.
  rpc RunSubscriptionMigration(RunSubscriptionMigrationRequest)
      returns (RunSubscriptionMigrationResponse);

  // ListSubscriptionMigrations returns newest-first recorded migrations.
  rpc ListSubscriptionMigrations(ListSubscriptionMigrationsRequest)
      returns (ListSubscriptionMigrationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetOrganizationBillingExemption explicitly controls internal billing
  // exemption. It is global-admin only and never infers exemption from the
  // owner account.
  rpc SetOrganizationBillingExemption(SetOrganizationBillingExemptionRequest)
      returns (SetOrganizationBillingExemptionResponse);

  // ListConfidentialOrganizations lists the organizations opted in to
  // confidential environments. It is global-admin only.
  rpc ListConfidentialOrganizations(ListConfidentialOrganizationsRequest)
      returns (ListConfidentialOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetOrganizationConfidentialEnvironments opts one organization in to, or
  // out of, confidential environments. It is global-admin only and audited.
  // An opted-in organization still needs a deployment that enables
  // confidential storage, and room in its environment quota.
  rpc SetOrganizationConfidentialEnvironments(SetOrganizationConfidentialEnvironmentsRequest)
      returns (SetOrganizationConfidentialEnvironmentsResponse);
}

message GetCatalogRequest {}

message GetCatalogResponse {
  repeated CatalogPlan plans = 1;
  repeated CatalogPrice prices = 2;
  repeated CatalogSetting settings = 3;
}

// PlanSpec is the mutable catalog-plan body. The three overage fields remain
// fractional-cent rates because their database columns are double precision.
message PlanSpec {
  string display_name = 1;
  int32 price_cents = 2;
  int32 included_devs = 3;
  int32 max_concurrent_ws = 4;
  int32 max_team_members = 5;
  int32 storage_gb = 6;
  bool is_contact_us = 7;
  bool is_admin_only = 8;
  int32 included_cpu_hours = 9;
  int32 included_mem_gb_hours = 10;
  int32 included_disk_gb_hours = 11;
  double cpu_overage_cents = 12;
  double mem_overage_cents = 13;
  double disk_overage_cents = 14;
}

message CatalogPlan {
  string resource_type = 1;
  string plan_key = 2;
  PlanSpec plan = 3;
  bool archived = 4;
}

message CatalogPrice {
  string resource_type = 1;
  string plan_key = 2;
  string stripe_mode = 3;
  string price_kind = 4;
  string stripe_price_id = 5;
  bool archived = 6;
}

message CatalogSetting {
  string setting_key = 1;
  int32 int_value = 2;
}

message CreatePlanRequest {
  string resource_type = 1;
  string plan_key = 2;
  PlanSpec plan = 3;
}

message CreatePlanResponse {}

message UpdatePlanRequest {
  string resource_type = 1;
  string plan_key = 2;
  PlanSpec plan = 3;
}

message UpdatePlanResponse {}

message SetPlanArchivedRequest {
  string resource_type = 1;
  string plan_key = 2;
  bool archived = 3;
}

message SetPlanArchivedResponse {}

message CreatePriceRequest {
  string resource_type = 1;
  string plan_key = 2;
  string stripe_mode = 3;
  string price_kind = 4;
  string stripe_price_id = 5;
}

message CreatePriceResponse {}

message UpdatePriceRequest {
  string resource_type = 1;
  string plan_key = 2;
  string stripe_mode = 3;
  string price_kind = 4;
  string stripe_price_id = 5;
}

message UpdatePriceResponse {}

message SetPriceArchivedRequest {
  string resource_type = 1;
  string plan_key = 2;
  string stripe_mode = 3;
  string price_kind = 4;
  bool archived = 5;
}

message SetPriceArchivedResponse {}

message UpdateSettingRequest {
  string setting_key = 1;
  int32 int_value = 2;
}

message UpdateSettingResponse {}

message PreviewSubscriptionMigrationRequest {
  string resource_type = 1;
  string source_plan_key = 2;
  string target_plan_key = 3;
  int32 sample_limit = 4;
}

message MigrationSample {
  string scope = 1;
  string org_id = 2;
  string org_slug = 3;
  string stripe_subscription_id = 4;
  string status = 5;
  string current_plan_key = 6;
  optional string current_stripe_price_id = 7;
}

message PreviewSubscriptionMigrationResponse {
  string resource_type = 1;
  string source_plan_key = 2;
  string target_plan_key = 3;
  string target_stripe_price_id = 4;
  int32 matching_count = 5;
  int32 candidate_count = 6;
  int32 already_on_target = 7;
  repeated MigrationSample samples = 8;
}

message RunSubscriptionMigrationRequest {
  string resource_type = 1;
  string source_plan_key = 2;
  string target_plan_key = 3;
  string proration_behavior = 4;
}

message MigrationRun {
  string id = 1;
  string resource_type = 2;
  string source_plan_key = 3;
  string target_plan_key = 4;
  string target_stripe_price_id = 5;
  string proration_behavior = 6;
  int32 migrated_count = 7;
  int32 skipped_count = 8;
  int32 failed_count = 9;
  optional string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Struct metadata = 12;
}

message RunSubscriptionMigrationResponse {
  MigrationRun migration = 1;
}

message ListSubscriptionMigrationsRequest {
  // Zero selects the server default of 25. Values above 100 are invalid.
  int32 limit = 1;
}

message ListSubscriptionMigrationsResponse {
  repeated MigrationRun migrations = 1;
}

message SetOrganizationBillingExemptionRequest {
  string organization_id = 1;
  bool billing_exempt = 2;
}

message SetOrganizationBillingExemptionResponse {
  string organization_id = 1;
  bool billing_exempt = 2;
}

message ListConfidentialOrganizationsRequest {}

message ConfidentialOrganization {
  string organization_id = 1;
  string slug = 2;
  string name = 3;
}

message ListConfidentialOrganizationsResponse {
  repeated ConfidentialOrganization organizations = 1;
}

message SetOrganizationConfidentialEnvironmentsRequest {
  string organization_slug = 1;
  bool enabled = 2;
}

message SetOrganizationConfidentialEnvironmentsResponse {
  ConfidentialOrganization organization = 1;
  bool enabled = 2;
}
