syntax = "proto3";

package codewire.console.v1;

import "google/protobuf/timestamp.proto";

// GitHubService manages the caller's GitHub connection and lists repositories
// visible through that connection. Organization-scoped API keys cannot call
// this account-global service.
//
// Browser redirects are intentionally not RPCs: authorize remains at
// GET /api/v1/github/oauth/authorize and callback remains at
// GET /api/v1/github/oauth/callback as permanent raw-HTTP routes.
service GitHubService {
  // GetGitHubConfig returns the public GitHub App configuration.
  rpc GetGitHubConfig(GetGitHubConfigRequest) returns (GetGitHubConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetGitHubStatus returns whether the caller has connected GitHub.
  rpc GetGitHubStatus(GetGitHubStatusRequest) returns (GetGitHubStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListGitHubRepos returns one GitHub offset-pagination page, optionally
  // filtered by case-insensitive full-name search. A caller without a stored
  // GitHub connection receives failed_precondition.
  rpc ListGitHubRepos(ListGitHubReposRequest) returns (ListGitHubReposResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SaveGitHubToken stores the result of the native-app device flow.
  rpc SaveGitHubToken(SaveGitHubTokenRequest) returns (SaveGitHubTokenResponse);

  // DeleteGitHubToken disconnects the caller's GitHub account.
  rpc DeleteGitHubToken(DeleteGitHubTokenRequest) returns (DeleteGitHubTokenResponse);
}

message GetGitHubConfigRequest {}

message GetGitHubConfigResponse {
  string client_id = 1;
  string app_slug = 2;
}

message GetGitHubStatusRequest {}

message GetGitHubStatusResponse {
  bool connected = 1;
  // Empty when disconnected or when GitHub did not return a login.
  string username = 2;
  optional int64 installation_id = 3;
  optional google.protobuf.Timestamp connected_at = 4;
}

message ListGitHubReposRequest {
  // Values below one become one.
  int32 page = 1;
  // Values below one default to 30; values above 100 become 100.
  int32 per_page = 2;
  string search = 3;
}

message ListGitHubReposResponse {
  repeated GitHubRepo repos = 1;
}

message GitHubRepo {
  string full_name = 1;
  string html_url = 2;
  string clone_url = 3;
  string description = 4;
  string language = 5;
  bool private = 6;
  string default_branch = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SaveGitHubTokenRequest {
  string access_token = 1;
  string refresh_token = 2;
  // Empty defaults to "bearer".
  string token_type = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  optional google.protobuf.Timestamp refresh_token_expires_at = 5;
  optional int64 installation_id = 6;
  string github_username = 7;
}

message SaveGitHubTokenResponse {}

message DeleteGitHubTokenRequest {}

message DeleteGitHubTokenResponse {}
