syntax = "proto3";

package codewire.console.v1;

// AccountService manages account-global Git author identity.
//
// Organization-scoped API keys cannot call this service. Callers must use a
// browser session or an OAuth-issued native-app bearer credential.
service AccountService {
  // GetGitIdentity returns the resolved Git author name and email.
  rpc GetGitIdentity(GetGitIdentityRequest) returns (GetGitIdentityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateGitIdentity replaces the optional Git author overrides. An absent
  // field clears that override, restoring the account-derived fallback.
  rpc UpdateGitIdentity(UpdateGitIdentityRequest) returns (UpdateGitIdentityResponse);
}

// GitIdentity is the resolved author identity after applying account
// fallbacks to the optional overrides.
message GitIdentity {
  string git_name = 1;
  string git_email = 2;
}

message GetGitIdentityRequest {}

message GetGitIdentityResponse {
  GitIdentity git_identity = 1;
}

message UpdateGitIdentityRequest {
  // Absent clears the override; present empty also resolves to the fallback.
  optional string git_name = 1;
  // Absent clears the override; present empty also resolves to the fallback.
  optional string git_email = 2;
}

message UpdateGitIdentityResponse {
  GitIdentity git_identity = 1;
}
