syntax = "proto3";

package codewire.console.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// BillingService exposes first-party billing catalog, organization billing,
// usage, and Stripe session operations. It is served by codewire-billing.
service BillingService {
  // ListOrgPlans returns the active organization plans keyed by plan key.
  rpc ListOrgPlans(ListOrgPlansRequest) returns (ListOrgPlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListResourcePlans returns active plans for one resource type. Admin-only
  // plans are visible only to platform administrators.
  rpc ListResourcePlans(ListResourcePlansRequest) returns (ListResourcePlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetSignupCredit returns the credit a new organization is granted now. It
  // is public: the signed-out pricing page reads it.
  rpc GetSignupCredit(GetSignupCreditRequest) returns (GetSignupCreditResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetPublicRates returns Regular's four rates, which the public pricing
  // pages show. It is public, and fails rather than answer another rate
  // card's rates.
  rpc GetPublicRates(GetPublicRatesRequest) returns (GetPublicRatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetBillingOverview returns the caller's organization billing summary.
  rpc GetBillingOverview(GetBillingOverviewRequest) returns (GetBillingOverviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListInvoices returns the most recent organization invoices.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListBillingEvents returns the most recent organization billing events.
  rpc ListBillingEvents(ListBillingEventsRequest) returns (ListBillingEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetEnvironmentUsage returns the current billing-period environment usage.
  rpc GetEnvironmentUsage(GetEnvironmentUsageRequest) returns (GetEnvironmentUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateCheckoutSession creates a Stripe subscription checkout session.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);

  // ReconcilePlanCheckoutSession synchronizes an organization's plan right
  // after Stripe Checkout returns, before webhook delivery arrives.
  rpc ReconcilePlanCheckoutSession(ReconcilePlanCheckoutSessionRequest) returns (ReconcilePlanCheckoutSessionResponse);

  // ActivatePaygPlan activates the Pay as you go ($0/mo) plan once the
  // organization has a default payment method on file.
  rpc ActivatePaygPlan(ActivatePaygPlanRequest) returns (ActivatePaygPlanResponse);

  // SwitchOrganizationPlan switches an organization between payg, pro, and
  // max: updates an active Stripe subscription in place, schedules cancellation
  // at period end when moving to payg, or returns a Stripe Checkout URL when a
  // new subscription is required.
  rpc SwitchOrganizationPlan(SwitchOrganizationPlanRequest) returns (SwitchOrganizationPlanResponse);

  // CreatePortalSession creates a Stripe billing portal session.
  rpc CreatePortalSession(CreatePortalSessionRequest) returns (CreatePortalSessionResponse);

  // CreateSetupSession creates a Stripe payment-method setup session. Where
  // the deployment enforces credit, a new card tops up a balance that ran out.
  rpc CreateSetupSession(CreateSetupSessionRequest) returns (CreateSetupSessionResponse);

  // UpdateAutoTopUp turns automatic top-up on or off and sets its amount.
  // Organization owners and admins only; audited.
  rpc UpdateAutoTopUp(UpdateAutoTopUpRequest) returns (UpdateAutoTopUpResponse);

  // AddCredit buys a one-time amount of compute credit. With a saved card it
  // charges the card at once; when the bank asks the customer to approve the
  // charge, or there is no card yet, it answers with the Stripe page where the
  // customer approves or pays, and credit follows once Stripe reports the
  // payment. Organization owners and admins only. A retry with the same
  // request_id and amount never charges twice.
  rpc AddCredit(AddCreditRequest) returns (AddCreditResponse);

  // ListPaymentMethods lists the organization's saved cards, newest first,
  // which is the default, and the publishable key Stripe's card form mounts
  // with. Any member may see them.
  rpc ListPaymentMethods(ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // BeginCardSetup starts adding a card in the console once it is saved: a
  // SetupIntent holding the choices made beside the form, and the secret the
  // form confirms the card with. Saving the card charges nothing by itself.
  // Organization owners and admins only.
  rpc BeginCardSetup(BeginCardSetupRequest) returns (BeginCardSetupResponse);

  // FinishCardSetup finishes adding a card once the form confirmed it: the
  // card becomes the default, the credit chosen at BeginCardSetup is bought
  // with it, the top-up setting chosen there is saved, and the organization
  // is settled at once. With top-up on and still no credit, that charges the
  // top-up amount. The choices come only from the SetupIntent, never from
  // this request. A SetupIntent finishes once, within an hour of its start.
  // Organization owners and admins only.
  rpc FinishCardSetup(FinishCardSetupRequest) returns (FinishCardSetupResponse);

  // SetDefaultPaymentMethod makes one of the organization's cards the one
  // top-ups charge. Organization owners and admins only.
  rpc SetDefaultPaymentMethod(SetDefaultPaymentMethodRequest) returns (SetDefaultPaymentMethodResponse);

  // RemovePaymentMethod removes one of the organization's cards. A removed
  // default is replaced by the newest card left. Organization owners and
  // admins only.
  rpc RemovePaymentMethod(RemovePaymentMethodRequest) returns (RemovePaymentMethodResponse);
}

message ListOrgPlansRequest {}

message ListOrgPlansResponse {
  map<string, OrgPlan> plans = 1;
}

// OrgPlan is one organization subscription plan.
message OrgPlan {
  string display_name = 1;
  int32 price_cents = 2;
  int32 included_devs = 3;
  int32 max_concurrent_ws = 4;
  int32 max_team_members = 5;
  int32 storage_gb = 6;
  bool is_contact_us = 7;
  reserved 8;
  bool archived = 9;
}

message ListResourcePlansRequest {
  // Existing catalog resource type, for example "sandbox".
  string resource_type = 1;
}

message ListResourcePlansResponse {
  map<string, ResourcePlan> plans = 1;
}

// ResourcePlan is one compute-resource subscription plan. Fractional-cent
// overage rates use integer thousandths of a cent.
message ResourcePlan {
  string display_name = 1;
  int32 price_cents = 2;
  int32 included_devs = 3;
  int32 max_concurrent_ws = 4;
  int32 max_team_members = 5;
  int32 storage_gb = 6;
  bool is_contact_us = 7;
  bool is_admin_only = 8;
  bool archived = 9;
  int32 included_cpu_hours = 10;
  int32 included_mem_gb_hours = 11;
  int32 included_disk_gb_hours = 12;
  int64 cpu_overage_millicents = 13;
  int64 mem_overage_millicents = 14;
  int64 disk_overage_millicents = 15;
}

message GetSignupCreditRequest {}

message GetSignupCreditResponse {
  // The credit a new organization is granted once at creation, in
  // nano-euros. 0 means none.
  int64 amount_nano_eur = 1;
}

message GetPublicRatesRequest {}

// Regular's rates, in whole nano-euros per unit-hour.
message GetPublicRatesResponse {
  int64 cpu_nano_eur_per_vcpu_hour = 1;
  int64 memory_nano_eur_per_gib_hour = 2;
  int64 disk_nano_eur_per_gib_hour = 3;
  // Per GiB-hour of disk while a Sandbox is suspended or hibernated.
  int64 parked_storage_nano_eur_per_gib_hour = 4;
}

message GetBillingOverviewRequest {
  string org_id = 1;
}

message GetBillingOverviewResponse {
  bool billing_enabled = 1;
  bool has_payment_method = 2;
  string plan = 3;
  string plan_display_name = 4;
  string status = 5;
  optional google.protobuf.Timestamp trial_end = 6;
  int32 trial_days = 7;
  int32 seat_count = 8;
  int32 included_devs = 9;
  int32 extra_seat_price_cents = 10;
  BillingLimits limits = 11;
  optional google.protobuf.Timestamp current_period_end = 12;
  int32 active_subscriptions = 13;
  int32 total_monthly_cost_cents = 14;
  UsageSummary current_month_usage = 15;
  // Prepaid compute credit, in nano-euros (1e-9 EUR); below zero when usage
  // outran it.
  int64 credit_balance_nano_eur = 16;
  // What a running sandbox costs this organization per unit-hour.
  CreditRates rates = 17;
  // Whether no charge applies at all: the rates are zero and there is no
  // quota.
  bool unmetered = 18;
  bool auto_top_up_enabled = 19;
  int32 auto_top_up_cents = 20;
  // Set while the organization has no credit and no way to get it: creates
  // and starts are refused, and running sandboxes stop 24 hours after it.
  optional google.protobuf.Timestamp credit_exhausted_at = 21;
  // Was card_credit_granted: a card no longer grants credit (#3381).
  reserved 22;
  reserved "card_credit_granted";
  // Usage drawn from credit since the start of this month, in nano-euros.
  int64 month_usage_nano_eur = 23;
  // The default payment method when it is a card, read from Stripe with
  // has_payment_method. Unset when there is no default, it is not a card, or
  // Stripe could not be read.
  PaymentCard default_card = 24;
  // Out of credit, and automatic top-up is charging the card this much, in
  // euro cents, to lift the balance above zero; 0 otherwise. A declined
  // charge, no card or top-up off marks the organization as having no way to
  // get credit, and then nothing is charging (#4754).
  int32 top_up_charging_cents = 25;
  // Whether this deployment enforces credit: an empty balance then refuses
  // creates and starts, and automatic top-up charges the card. Without it
  // nothing is refused or charged, so the console says nothing of running
  // low (#4754).
  bool credit_enforced = 26;
  // Monthly subscription price in USD cents for the active plan (0 for payg/none).
  int32 plan_price_cents = 27;
  // Included monthly compute allowance granted for the current billing cycle, in nano-USD.
  int64 allowance_granted_nano_usd = 28;
  // Portion of the current cycle's allowance already drawn, in nano-USD.
  int64 allowance_drawn_nano_usd = 29;
  // When the current monthly allowance cycle ends (unused allowance expires).
  optional google.protobuf.Timestamp allowance_period_end = 30;
  // Whether the Stripe subscription is scheduled to cancel at the end of the current period.
  bool cancel_at_period_end = 31;
  // Per-sandbox maximum vCPU allowed by the active plan (0 when no active plan).
  int32 max_vcpu = 32;
  // Per-sandbox maximum memory in GiB allowed by the active plan (0 when no active plan).
  int32 max_memory_gib = 33;
  // Per-sandbox maximum disk in GiB allowed by the active plan (0 when no active plan).
  int32 max_disk_gib = 34;
  // Maximum concurrent sandboxes allowed by the active plan (-1 for unlimited, 0 when no plan).
  int32 max_concurrent_sandboxes = 35;
  // Maximum team members allowed by the active plan (-1 for unlimited, 0 when no plan).
  int32 max_team_members = 36;
}

// What a receipt shows of a card: never its number or fingerprint.
message PaymentCard {
  // Stripe's brand code, such as "visa", "mastercard" or "amex".
  string brand = 1;
  // The last four digits of the card number.
  string last4 = 2;
  // The expiry month, 1 to 12.
  int32 exp_month = 3;
  // The four-digit expiry year.
  int32 exp_year = 4;
}

message CreditRates {
  int64 cpu_nano_eur_per_vcpu_hour = 1;
  int64 memory_nano_eur_per_gib_hour = 2;
  int64 disk_nano_eur_per_gib_hour = 3;
}

message UpdateAutoTopUpRequest {
  string org_id = 1;
  bool enabled = 2;
  // EUR 5 to EUR 1,000, in cents.
  int32 amount_cents = 3;
}

message UpdateAutoTopUpResponse {
  bool enabled = 1;
  int32 amount_cents = 2;
}

message AddCreditRequest {
  string org_id = 1;
  // EUR 5 to EUR 1,000, in cents.
  int32 amount_cents = 2;
  // The client's key for this attempt: 16 to 64 letters, digits, '-' or '_'.
  // A retry with the same key and amount resumes the same payment.
  string request_id = 3;
  // Where Stripe's payment page returns, on the configured frontend origin.
  // Used only when the organization has no saved card.
  string success_url = 4;
  string cancel_url = 5;
}

message AddCreditResponse {
  AddCreditOutcome outcome = 1;
  // The amount, in cents.
  int32 amount_cents = 2;
  // ACTION_REQUIRED: the Stripe page where the customer approves the charge
  // or pays.
  string payment_url = 3;
  // REFUSED: why.
  AddCreditRefusal refusal = 4;
  // REFUSED with DECLINED: Stripe's decline code, in lower-case letters,
  // digits and '_'.
  string decline_code = 5;
}

enum AddCreditOutcome {
  ADD_CREDIT_OUTCOME_UNSPECIFIED = 0;
  // The card was charged and the credit added.
  ADD_CREDIT_OUTCOME_PAID = 1;
  // The customer approves or pays on payment_url; credit follows the
  // payment.
  ADD_CREDIT_OUTCOME_ACTION_REQUIRED = 2;
  // Nothing was charged; see refusal.
  ADD_CREDIT_OUTCOME_REFUSED = 3;
}

enum AddCreditRefusal {
  ADD_CREDIT_REFUSAL_UNSPECIFIED = 0;
  // The card was declined.
  ADD_CREDIT_REFUSAL_DECLINED = 1;
  // Another top-up of this organization is being charged.
  ADD_CREDIT_REFUSAL_IN_PROGRESS = 2;
}

message ListPaymentMethodsRequest {
  string org_id = 1;
}

message ListPaymentMethodsResponse {
  // Newest first.
  repeated SavedPaymentMethod payment_methods = 1;
  // The default's id; empty when there is none.
  string default_id = 2;
  // The account's publishable key for Stripe's card form, of the same mode
  // as its secret key; empty when the card form is not configured.
  string publishable_key = 3;
}

message SavedPaymentMethod {
  // Stripe's PaymentMethod id.
  string id = 1;
  // Absent when Stripe's details are out of range.
  PaymentCard card = 2;
}

message BeginCardSetupRequest {
  string org_id = 1;
  // Written into the SetupIntent, where FinishCardSetup reads them.
  bool auto_top_up_enabled = 2;
  // EUR 5 to EUR 1,000, in cents.
  int32 auto_top_up_cents = 3;
  // Credit to buy with the new card before settling, as Add credit does with
  // a saved card: EUR 5 to EUR 1,000 in cents, or 0 for none. Bought first,
  // so top-up charges only if the organization is still without credit.
  int32 credit_cents = 4;
}

message BeginCardSetupResponse {
  // The SetupIntent's client secret, for Stripe's card form only.
  string client_secret = 1;
}

message FinishCardSetupRequest {
  string org_id = 1;
  // The SetupIntent the form confirmed.
  string setup_intent_id = 2;
}

message FinishCardSetupResponse {
  CardSetupSettlement settlement = 1;
  // How buying the chosen credit ended; absent when none was chosen.
  AddCreditResponse credit = 2;
  // The automatic top-up setting saved, as chosen at BeginCardSetup.
  bool auto_top_up_enabled = 3;
}

// What settling the organization after a new card did.
enum CardSetupSettlement {
  CARD_SETUP_SETTLEMENT_UNSPECIFIED = 0;
  // It has credit, or is not charged for compute: nothing was charged.
  CARD_SETUP_SETTLEMENT_FUNDED = 1;
  // It had no credit and top-up is on: the card was charged.
  CARD_SETUP_SETTLEMENT_TOPPED_UP = 2;
  // A charge is under way and finishes shortly.
  CARD_SETUP_SETTLEMENT_PENDING = 3;
  // It has no credit and nothing was charged: top-up is off, or the card
  // was refused.
  CARD_SETUP_SETTLEMENT_OUT_OF_CREDIT = 4;
  // This deployment does not charge for compute.
  CARD_SETUP_SETTLEMENT_NOT_ENFORCED = 5;
}

message SetDefaultPaymentMethodRequest {
  string org_id = 1;
  string payment_method_id = 2;
}

message SetDefaultPaymentMethodResponse {}

message RemovePaymentMethodRequest {
  string org_id = 1;
  string payment_method_id = 2;
}

message RemovePaymentMethodResponse {}

message BillingLimitUsage {
  int32 used = 1;
  int32 max = 2;
}

message BillingLimits {
  BillingLimitUsage team_members = 1;
  int32 concurrent_workspaces = 2;
  int32 storage_gb = 3;
}

message UsageSummary {
  double cpu_hours = 1;
  double memory_gb_hours = 2;
  double storage_gb_hours = 3;
}

message ListInvoicesRequest {
  string org_id = 1;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

message Invoice {
  string id = 1;
  string stripe_invoice_id = 2;
  string status = 3;
  int32 amount_due = 4;
  int32 amount_paid = 5;
  string currency = 6;
  optional string hosted_invoice_url = 7;
  optional string invoice_pdf = 8;
  optional google.protobuf.Timestamp period_start = 9;
  optional google.protobuf.Timestamp period_end = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListBillingEventsRequest {
  string org_id = 1;
}

message ListBillingEventsResponse {
  repeated BillingEvent events = 1;
}

message BillingEvent {
  int64 id = 1;
  string event_type = 2;
  optional string org_id = 3;
  optional int32 amount_cents = 4;
  string currency = 5;
  optional string stripe_item_id = 6;
  google.protobuf.Struct metadata = 7;
  google.protobuf.Timestamp created_at = 8;
}

message GetEnvironmentUsageRequest {
  string org_id = 1;
}

message GetEnvironmentUsageResponse {
  EnvironmentUsageMonth current_month = 1;
  repeated EnvironmentUsageHour hourly_breakdown = 2;
  repeated EnvironmentUsageEntry per_environment = 3;
}

message EnvironmentUsageMonth {
  double cpu_hours = 1;
  double mem_gb_hours = 2;
  double disk_gb_hours = 3;
  // Superseded by cost_nano_eur, and that value in whole cents rounded down.
  int32 cost_cents = 4;
  int32 included_cpu_hours = 5;
  int32 included_mem_gb_hours = 6;
  // Usage drawn from credit this month, in nano-euros: the same figure as
  // BillingOverview.month_usage_nano_eur.
  int64 cost_nano_eur = 7;
}

message EnvironmentUsageHour {
  google.protobuf.Timestamp hour = 1;
  double cpu_hours = 2;
  double mem_gb_hours = 3;
  // Superseded by cost_nano_eur, and that value in whole cents rounded down.
  int32 cost_cents = 4;
  // The hour's sandbox usage at the organization's rate card, in nano-euros,
  // through each sandbox's last observation, as credit is drawn. 0 on
  // Unlimited.
  int64 cost_nano_eur = 5;
}

message EnvironmentUsageEntry {
  string id = 1;
  string name = 2;
  int32 running_seconds = 3;
  // Superseded by cost_nano_eur, and that value in whole cents rounded down.
  int32 cost_cents = 4;
  int32 cpu_millicores = 5;
  int32 memory_mb = 6;
  // Superseded by hourly_nano_eur, and that value in whole cents rounded down.
  int32 hourly_cents = 7;
  // This month's usage at the organization's rate card, in nano-euros,
  // through each session's last observation, as credit is drawn. 0 on
  // Unlimited.
  int64 cost_nano_eur = 8;
  // An hour at the sandbox's largest size this month, in nano-euros.
  int64 hourly_nano_eur = 9;
}

message CreateCheckoutSessionRequest {
  string org_id = 1;
  string plan = 2;
  string success_url = 3;
  string cancel_url = 4;
}

message CreateCheckoutSessionResponse {
  string checkout_url = 1;
}

message ReconcilePlanCheckoutSessionRequest {
  string org_id = 1;
  string session_id = 2;
}

message ReconcilePlanCheckoutSessionResponse {
  string plan = 1;
  string status = 2;
  optional google.protobuf.Timestamp current_period_end = 3;
  int64 allowance_granted_nano_usd = 4;
}

message ActivatePaygPlanRequest {
  string org_id = 1;
}

message ActivatePaygPlanResponse {
  string plan = 1;
  string status = 2;
}

message SwitchOrganizationPlanRequest {
  string org_id = 1;
  string plan = 2;
  string success_url = 3;
  string cancel_url = 4;
}

message SwitchOrganizationPlanResponse {
  string plan = 1;
  string status = 2;
  // Populated when upgrading from payg/no-subscription to a paid plan and
  // Stripe Checkout must collect payment first.
  string checkout_url = 3;
  bool cancel_at_period_end = 4;
}

message CreatePortalSessionRequest {
  string org_id = 1;
  string return_url = 2;
}

message CreatePortalSessionResponse {
  string portal_url = 1;
}

message CreateSetupSessionRequest {
  string org_id = 1;
  string success_url = 2;
  string cancel_url = 3;
}

message CreateSetupSessionResponse {
  // Stripe exposes setup-mode sessions through its Checkout API.
  string checkout_url = 1;
}
