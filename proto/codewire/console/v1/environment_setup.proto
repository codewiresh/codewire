syntax = "proto3";

package codewire.console.v1;

import "codewire/v1/preset.proto";

// EnvironmentSetupService supplies the first-party environment-creation UX.
// The content-negotiated prepare handler is represented by
// codewire.v1.EnvironmentService.WatchEnvironmentCreate instead. The terminal
// WebSocket remains raw HTTP; IssueTerminalTicket is its authenticated RPC
// half.
service EnvironmentSetupService {
  rpc GetEnvironmentCreateOptions(GetEnvironmentCreateOptionsRequest) returns (GetEnvironmentCreateOptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc IssueTerminalTicket(IssueTerminalTicketRequest) returns (IssueTerminalTicketResponse);
}

message GetEnvironmentCreateOptionsRequest {
  string org_id = 1;
}

message GetEnvironmentCreateOptionsResponse {
  reserved 1, 3;
  reserved "github_status", "secret_projects";

  repeated codewire.v1.Preset presets = 2;
}

message IssueTerminalTicketRequest {}

message IssueTerminalTicketResponse {
  string ticket = 1;
}
