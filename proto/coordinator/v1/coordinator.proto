syntax = "proto3";

package coordinator.v1;

option go_package = "github.com/codewiresh/codewire/gen/coordinator/v1;coordinatorv1";

// CoordinatorService is the tailnet coordinate contract: WireGuard key
// exchange between clients and environment sidecars, brokered by
// codewire-coordinator.
//
// The WebSocket + JSON transport uses these message shapes with matching JSON
// field names. The native Connect transport requires Hello as the first client
// message, sends DerpMap only after Hello is authorized, and exchanges Ping
// messages after 15 seconds of application-level idle time.
service CoordinatorService {
  // Coordinate is a long-lived bidirectional exchange. Peers send their own
  // node updates; the coordinator pushes the DERP map, peer updates, and
  // peer removals.
  rpc Coordinate(stream CoordinateRequest) returns (stream CoordinateResponse);
}

// Node carries the WireGuard connectivity information for a single peer.
// Mirrors tailnet.Node (JSON over WebSocket today).
message Node {
  // UUID of the peer (client connection ID or environment/sidecar ID).
  string id = 1;
  // RFC 3339 timestamp the node info was generated.
  string as_of = 2;
  // WireGuard node public key (Tailscale wire encoding, e.g. "nodekey:...").
  string key = 3;
  // Disco public key for NAT traversal ("discokey:...").
  string disco_key = 4;
  // Preferred DERP region ID.
  int32 preferred_derp = 5;
  // DERP region ID -> measured latency in seconds.
  map<string, double> derp_latency = 6;
  // UDP endpoints ("ip:port") the peer is reachable on.
  repeated string endpoints = 7;
  // Tailnet IP prefixes assigned to the peer (CIDR notation).
  repeated string addresses = 8;
}

// CoordinateRequest is a message from a peer to the coordinator.
message CoordinateRequest {
  oneof msg {
    // The peer's current node info. Sent on connect and whenever
    // connectivity changes.
    Node node = 1;
    // Identifies and authorizes the peer. Required as the first message on a
    // native Connect stream.
    Hello hello = 2;
    // Keeps an otherwise-idle native Connect stream alive end to end.
    Ping ping = 3;
  }
}

// CoordinateResponse is a message from the coordinator to a peer.
message CoordinateResponse {
  oneof msg {
    // Connectivity info for one or more peers.
    PeerUpdate peer_update = 1;
    // A peer disconnected.
    PeerRemove peer_remove = 2;
    // The DERP relay map. Sent once at the start of the stream.
    DerpMap derp_map = 3;
    // Keeps an otherwise-idle native Connect stream alive end to end.
    Ping ping = 4;
  }
}

// Hello carries the addressing that the WebSocket transport places in its URL.
message Hello {
  // Client peers send their organization. Sidecar peers leave this empty.
  string org_id = 1;
  // Client and sidecar peers both send their environment.
  string environment_id = 2;
}

// Ping is an application-level keepalive for native Connect streams.
message Ping {}

message PeerUpdate {
  repeated Node nodes = 1;
}

message PeerRemove {
  string peer_id = 1;
}

// DerpMap wraps the tailscale tailcfg.DERPMap JSON document. Kept opaque:
// the structure is owned by the tailscale types and consumed as-is by
// clients.
message DerpMap {
  bytes derp_map_json = 1;
}
