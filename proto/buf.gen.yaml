version: v2

# Uses local protoc-gen-go / protoc-gen-connect-go binaries (install with
# `make proto-tools` or:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
#   go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.18.1
# ). Remote buf plugins are intentionally not used so generation works in
# restricted-network CI.
#
# Generated Go packages share the standalone libs/gen-go module with the
# client-facing codewire packages. Do not use `clean: true`: that would delete
# the module's hand-written go.mod/go.sum. The generation entrypoints remove
# the owned coordinator subtree before invoking buf so stale files cannot
# survive.

# Generation relocates the historical coordinator Go package into the one
# canonical standalone generated-client module. This affects generated import
# paths only; the proto file option remains unchanged so buf FILE breaking
# discipline stays green.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/codewiresh/codewire/libs/gen-go

# Vendored google.rpc protos are contract-only: canonical generated code for
# them already ships in each language ecosystem (e.g. Go's
# google.golang.org/genproto), so generating them here would duplicate those
# types. Exclude them from codegen; they still participate in buf lint
# (via buf.yaml ignore rules) and buf breaking.
#
# codewire/** (the client-facing contract packages) is excluded from this
# template. Those packages generate via buf.gen.codewire.yaml (Go/TS/Python)
# and are compiled for Rust at build time by crates/codewire-proto/build.rs.
inputs:
  - directory: .
    exclude_paths:
      - google/rpc
      - codewire

plugins:
  - local: protoc-gen-go
    out: ../libs/gen-go
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: ../libs/gen-go
    opt:
      - paths=source_relative
