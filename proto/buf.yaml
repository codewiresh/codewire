version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  ignore:
    # Vendored upstream googleapis files (see google/rpc/*.proto provenance
    # comments); they predate buf's STANDARD rules (no package version
    # suffix, unprefixed enum values) and are kept byte-identical to
    # upstream, so they are exempt from lint. `buf breaking` still covers
    # them (FILE rules apply to every file in the module).
    - google/rpc

breaking:
  use:
    - FILE
  # WI-4A corrects the newly authored internal read's missing declaration.
  # Buf regards unknown -> NO_SIDE_EFFECTS as a wire break, so keep this
  # one historical transition out of RPC_SAME_IDEMPOTENCY_LEVEL. The Mesh
  # source guard owns the stricter permanent rule: every declared public and
  # internal Mesh RPC has the exact expected idempotency classification, with
  # demonstrated-red coverage for this method.
  ignore_only:
    RPC_SAME_IDEMPOTENCY_LEVEL:
      - codewire/internal/v1/mesh_authorization.proto
