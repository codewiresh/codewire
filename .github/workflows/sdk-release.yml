name: Release an SDK

# The owner dispatches this on main to publish one version of the TypeScript
# SDK to npm (@codewire/sdk), the Python SDK to PyPI (codewire), or the Rust SDK
# to crates.io (codewire-proto, then codewire), by trusted publishing
# (codewire#3512, codewire#3511). Neither registry trusts Forgejo, so this runs on
# GitHub's mirror of main, which Forgejo ignores: it reads only .gitea/workflows.
# Each registry trusts exactly this workflow file in its own environment, and
# each environment admits only main. npm only stages a version; it goes live
# when the owner approves it on npm with 2FA. Only the owner may dispatch it, and the
# build job refuses any other actor. No registry token exists.
# With publish false the run builds and checks the package and keeps it as the
# run's sdk-dist artifact.
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: The SDK to release
        required: true
        type: choice
        options:
          - typescript
          - python
          - rust
      version:
        description: The version to publish; it must be the package's own version
        required: true
        type: string
      publish:
        description: Publish to the registry (false builds and checks the package only)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sdk-release-${{ inputs.sdk }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the ${{ inputs.sdk }} SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse anything but the owner's dispatch of main at the package's version
        env:
          SDK: ${{ inputs.sdk }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_EVENT_NAME|$GITHUB_REF|$GITHUB_ACTOR|$GITHUB_REPOSITORY" == 'workflow_dispatch|refs/heads/main|noeljackson|codewiresh/codewire' ]] || {
            echo '::error::only the owner dispatches an SDK release, from main'
            exit 1
          }
          case "$SDK" in
            typescript) package_version="$(jq -er .version libs/sdk-ts/package.json)" ;;
            python) package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("libs/sdk-python/pyproject.toml", "rb"))["project"]["version"])')" ;;
            # The two crates release together, at one version.
            rust) package_version="$(cargo metadata --locked --no-deps --format-version 1 |
              jq -r '[.packages[] | select(.name == "codewire" or .name == "codewire-proto") | .version] | unique | join(" ")')" ;;
            *) echo "::error::unknown SDK $SDK"; exit 1 ;;
          esac
          [[ "$REQUESTED_VERSION" == "$package_version" ]] || {
            echo "::error::the package is $package_version, not $REQUESTED_VERSION; raise its version in a pull request first"
            exit 1
          }

      - name: Node.js
        if: ${{ inputs.sdk == 'typescript' }}
        run: scripts/ci/setup/setup-node.sh 22.23.4

      - name: Build and check the package
        env:
          SDK: ${{ inputs.sdk }}
        run: |
          case "$SDK" in
            typescript) scripts/ci/release/package-sdk-ts.sh "$RUNNER_TEMP/sdk-dist" ;;
            python) scripts/ci/release/package-sdk-python.sh "$RUNNER_TEMP/sdk-dist" ;;
            rust) scripts/ci/release/package-sdk-rust.sh "$RUNNER_TEMP/sdk-dist" ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: ${{ runner.temp }}/sdk-dist
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Stage @codewire/sdk on npm
    needs: build
    if: ${{ inputs.sdk == 'typescript' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 carries npm 10.
      - name: Node.js
        run: scripts/ci/setup/setup-node.sh 24.22.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: ${{ runner.temp }}/sdk-dist

      # The trusted publisher allows only staged publishing: the version waits
      # in npm's staging area until the owner approves it with 2FA, which a
      # private repository's GitHub environments cannot require.
      - name: Stage for the owner's approval
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tarball="$RUNNER_TEMP/sdk-dist/codewire-sdk-$VERSION.tgz"
          [[ -f "$tarball" ]] || { echo "::error::the build wrote no codewire-sdk-$VERSION.tgz"; exit 1; }
          npm stage publish "$tarball" --access public
          {
            echo "@codewire/sdk@$VERSION is staged, not yet published."
            echo "Approve it with 2FA under Staged Packages on npmjs.com, or with npm stage approve."
          } >>"$GITHUB_STEP_SUMMARY"

  pypi:
    name: Publish codewire to PyPI
    needs: build
    if: ${{ inputs.sdk == 'python' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: ${{ runner.temp }}/sdk-dist

      - name: Refuse anything but this version's sdist and wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/sdk-dist"
          files="$(find . -type f -printf '%f\n' | sort)"
          [[ "$files" == "codewire-$VERSION-py3-none-any.whl"$'\n'"codewire-$VERSION.tar.gz" ]] || {
            echo "::error::expected only codewire $VERSION's sdist and wheel, found: $files"
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/sdk-dist

  crates-io:
    name: Publish codewire-proto and codewire to crates.io
    needs: build
    if: ${{ inputs.sdk == 'rust' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # crates.io trades this workflow's OIDC token for a publish token that
      # lasts 30 minutes, and this job revokes it when it ends. The exchange is
      # two documented HTTP calls, so no third-party action holds the token.
      - name: Get a short-lived crates.io token
        id: token
        run: |
          oidc="$(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl -fsS -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -er .value)"
          token="$(jq -n --arg jwt "$oidc" '{jwt: $jwt}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- \
              https://crates.io/api/v1/trusted_publishing/tokens | jq -er .token)"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      # codewire depends on codewire-proto at the same version, so one
      # command publishes both, in that order, each built from its packaged
      # sources first.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cargo publish --locked -p codewire-proto -p codewire
          echo "codewire-proto and codewire $VERSION are on crates.io." >>"$GITHUB_STEP_SUMMARY"

      - name: Revoke the token
        if: ${{ always() && steps.token.outputs.token != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
        # The header goes on stdin, so the token is never in curl's argv.
        run: |
          printf 'Authorization: Bearer %s\n' "$CARGO_REGISTRY_TOKEN" |
            curl -fsS -X DELETE -H @- https://crates.io/api/v1/trusted_publishing/tokens
