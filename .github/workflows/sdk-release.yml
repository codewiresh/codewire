name: Release an SDK

# The owner dispatches this on main to publish one version of the TypeScript
# SDK to npm (@codewire/sdk) or the Python SDK to PyPI (codewire), by trusted
# publishing (codewire#3512). Neither registry trusts Forgejo, so this runs on
# GitHub's mirror of main, which Forgejo ignores: it reads only .gitea/workflows.
# Each registry trusts exactly this workflow file in its own environment, and
# each environment admits only main. Only the owner may dispatch it, and the
# build job refuses any other actor. No registry token exists.
# With publish false the run builds and checks the package and keeps it as the
# run's sdk-dist artifact.
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: The SDK to release
        required: true
        type: choice
        options:
          - typescript
          - python
      version:
        description: The version to publish; it must be the package's own version
        required: true
        type: string
      publish:
        description: Publish to the registry (false builds and checks the package only)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sdk-release-${{ inputs.sdk }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the ${{ inputs.sdk }} SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse anything but the owner's dispatch of main at the package's version
        env:
          SDK: ${{ inputs.sdk }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_EVENT_NAME|$GITHUB_REF|$GITHUB_ACTOR|$GITHUB_REPOSITORY" == 'workflow_dispatch|refs/heads/main|noeljackson|codewiresh/codewire' ]] || {
            echo '::error::only the owner dispatches an SDK release, from main'
            exit 1
          }
          case "$SDK" in
            typescript) package_version="$(jq -er .version libs/sdk-ts/package.json)" ;;
            python) package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("libs/sdk-python/pyproject.toml", "rb"))["project"]["version"])')" ;;
            *) echo "::error::unknown SDK $SDK"; exit 1 ;;
          esac
          [[ "$REQUESTED_VERSION" == "$package_version" ]] || {
            echo "::error::the package is $package_version, not $REQUESTED_VERSION; raise its version in a pull request first"
            exit 1
          }

      - name: Node.js
        if: ${{ inputs.sdk == 'typescript' }}
        run: scripts/ci/setup/setup-node.sh 22.23.4

      - name: Build and check the package
        env:
          SDK: ${{ inputs.sdk }}
        run: |
          case "$SDK" in
            typescript) scripts/ci/release/package-sdk-ts.sh "$RUNNER_TEMP/sdk-dist" ;;
            python) scripts/ci/release/package-sdk-python.sh "$RUNNER_TEMP/sdk-dist" ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: ${{ runner.temp }}/sdk-dist
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Publish @codewire/sdk to npm
    needs: build
    if: ${{ inputs.sdk == 'typescript' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 carries npm 10.
      - name: Node.js
        run: scripts/ci/setup/setup-node.sh 24.22.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: ${{ runner.temp }}/sdk-dist

      - name: Publish and read the version back
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tarball="$RUNNER_TEMP/sdk-dist/codewire-sdk-$VERSION.tgz"
          [[ -f "$tarball" ]] || { echo "::error::the build wrote no codewire-sdk-$VERSION.tgz"; exit 1; }
          npm publish "$tarball" --access public
          for _ in $(seq 30); do
            [[ "$(npm view "@codewire/sdk@$VERSION" version 2>/dev/null)" == "$VERSION" ]] && exit 0
            sleep 10
          done
          echo "::error::npm did not serve @codewire/sdk@$VERSION within 300 s"
          exit 1

  pypi:
    name: Publish codewire to PyPI
    needs: build
    if: ${{ inputs.sdk == 'python' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: ${{ runner.temp }}/sdk-dist

      - name: Refuse anything but this version's sdist and wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/sdk-dist"
          files="$(find . -type f -printf '%f\n' | sort)"
          [[ "$files" == "codewire-$VERSION-py3-none-any.whl"$'\n'"codewire-$VERSION.tar.gz" ]] || {
            echo "::error::expected only codewire $VERSION's sdist and wheel, found: $files"
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/sdk-dist
