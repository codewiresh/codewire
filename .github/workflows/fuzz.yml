name: Fuzzing

# Forgejo ignores this directory. GitHub runs the cargo-fuzz targets in fuzz/
# on the public mirror's main branch, daily and on manual dispatch, and keeps
# each target's corpus between runs. The private mirror skips the jobs. A crash
# fails the job and uploads its input; docs/dev/FUZZING.md says how to
# reproduce one.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: fuzzing
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - disco_message
          - netstack_dns_question
          - netstack_ipv4_tcp
          - udp_relay_packet
    env:
      FUZZ_TOOLCHAIN: nightly-2026-11-01
      CARGO_FUZZ_VERSION: 0.13.2
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo "+$FUZZ_TOOLCHAIN" install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"

      - name: Seed the fuzz lock from the root lock
        run: cp Cargo.lock fuzz/Cargo.lock

      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz for ten minutes
        working-directory: fuzz
        run: cargo "+$FUZZ_TOOLCHAIN" fuzz run -O "$TARGET" -- -max_total_time=600

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
