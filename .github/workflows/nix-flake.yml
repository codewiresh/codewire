name: Nix flake

# Forgejo ignores this directory. GitHub checks the repository's flake.nix,
# which installs the released cw for Nix users (docs/dev/CLI-NIX-INSTALL.md,
# #5399), on the public mirror's main whenever the flake or its release pin
# changes, and on dispatch. It runs where those users install from, so Codewire's
# own runners need no Nix and no new egress. The private mirror skips the jobs.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - "nix/**"
      - .github/workflows/nix-flake.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-flake
  cancel-in-progress: true

jobs:
  flake:
    name: Install and run cw from the flake (${{ matrix.os }})
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nix's own installer at one release, run only if its SHA-256 is the pin;
      # it checks its tarball's SHA-256 in turn. No third-party action. The
      # daemon install leaves the runner's user untrusted. A flake's nixConfig
      # can't add substituters or keys, builds are sandboxed, and only the
      # default cache's signatures are trusted.
      - name: Install Nix
        env:
          NIX_INSTALLER_URL: https://releases.nixos.org/nix/nix-2.28.3/install
          NIX_INSTALLER_SHA256: 46b8d7165dceb471f4346366b3a93f1009407b99729b843b8664918f4cc800a0
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$NIX_INSTALLER_URL" -o "$work/install"
          got="$(shasum -a 256 "$work/install" | cut -d' ' -f1)"
          [[ "$got" == "$NIX_INSTALLER_SHA256" ]] || {
            echo "::error::the Nix installer is $got, not the pinned $NIX_INSTALLER_SHA256"
            exit 1
          }
          cat >"$work/nix.conf" <<'EOF'
          experimental-features = nix-command flakes
          accept-flake-config = false
          sandbox = true
          require-sigs = true
          substituters = https://cache.nixos.org/
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          EOF
          sh "$work/install" --daemon --yes --no-channel-add --nix-extra-conf-file "$work/nix.conf"
          # Later steps get what a login shell would: Nix's PATH and, on macOS,
          # the CA bundle its client fetches flake inputs with.
          set +u
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          set -u
          echo /nix/var/nix/profiles/default/bin >>"$GITHUB_PATH"
          [[ -z "${NIX_SSL_CERT_FILE:-}" ]] || echo "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" >>"$GITHUB_ENV"
          nix --version

      - name: Evaluate every system's package
        run: nix flake check --all-systems --no-build

      # The fixed-output download refuses bytes whose hash isn't the pin, so a
      # build is itself the hash check for this runner's system.
      - name: Install cw and run it
        run: |
          set -euo pipefail
          release="$(jq -r .release_tag nix/release.json)"
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          out="$(nix build --no-link --print-out-paths .#cw)"
          version="$(nix run .#cw -- version)"
          [[ "$version" == "cw $release" ]] || {
            echo "::error::the flake's cw prints '$version', not 'cw $release'"
            exit 1
          }
          # Both runners' systems install the release byte for byte.
          want="$(jq -r --arg system "$system" '.targets[$system].sha256' nix/release.json)"
          got="$(shasum -a 256 "$out/bin/cw" | cut -d' ' -f1)"
          [[ "$got" == "$want" ]] || {
            echo "::error::$system installs $got, not the released $want"
            exit 1
          }
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --verify --strict --verbose=2 "$out/bin/cw"
          fi
          echo "$system: cw $release, $got"

  pin:
    name: Check the pin against the signed release
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every system's executable, including the two no runner here installs:
      # its hash and size against the signed release, and the bytes served.
      - name: Recompute the pin from the signed release
        run: python3 -I -B scripts/ci/release/nix_release_pin.py check --pin nix/release.json --blobs
