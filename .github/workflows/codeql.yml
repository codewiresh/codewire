name: CodeQL

# Forgejo ignores this directory. GitHub runs CodeQL static analysis on the
# public mirror's main branch, daily and on manual dispatch, and shows its
# alerts in code scanning. The private mirror skips the jobs. Main moves many
# times a day, so a daily run bounds an alert's delay without one analysis per
# push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: codeql
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's preinstalled Go is older than go.work requires, and
      # CodeQL's Go autobuild runs go list with whatever Go is on PATH.
      - name: Install the Go version go.work requires
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
